item_Desc_nvy_pilot_flightsuit=Tipo de artículo: Traje de vuelo\nReducción de daño: 10%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +97.5%\nCapacidad de carga: 8.0 µSCU\n\nLa Marina ha pasado siglos refinando los trajes de vuelo que llevan sus pilotos de combate. El OMNI-CFS Diamond es la culminación de esta larga y probada experiencia militar. El Omni cuenta con una construcción reforzada para soportar una variedad de entornos hostiles e integra a la perfección con sistemas de armadura clásicos apropiados.
; FORCE
item_Desc_nvy_pilot_flightsuit_helmet_01_Shared=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\n\nEl casco AVS-E ofrece una excelente protección contra impactos y penetración gracias a su carcasa de fibra de carbono, un campo de visión sin interrupciones y una excelente estabilidad, lo que lo hace ideal para todo tipo de operaciones sobre el terreno.
; FORCE
item_Desc_ops_pants_02_01_01=Capacidad de carga: 0.5K µSCU\n\nCon un corte estrecho, los pantalones Mivaldi de OpalSky presentan un atrevido diseño asimétrico con un estilo elegante pero informal de dos materiales, lo que los convierte en el complemento perfecto para cualquier guardarropa.
; FORCE
item_Desc_orig_armor_medium_helmet_01=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -55 / 85 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\n\nInspirado en el elegante estilo de la serie 100, el Giocoso es un casco digno de Origin Jumpworks. Cuenta con un amplio visor facial que proporciona una excelente visión periférica y un sistema especial de flujo de aire interno para disipar el calor y la humedad. En un guiño a la serie 100, la parte trasera del casco integra sutilmente el icónico lenguaje de formas de la cola de la nave en su diseño.
; FORCE
item_Desc_orig_flightsuit_01_01_01=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nEncarna el lujo, el estilo y la velocidad al ponerte este traje de vuelo oficial utilizado por el equipo de carreras de Origin. Este traje de vuelo gris y amarillo presenta el logo de Origin y del 350r en varios lugares destacados.
; FORCE
item_Desc_orig_flightsuit_helmet_01_01_01=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\n\nLánzate de cabeza a la velocidad extrema con comodidad y estilo con el casco de carreras de Origin. Este casco gris y amarillo luce el logo de Origin y presenta una amplia visera para vistas sin obstáculos mientras pasas a toda velocidad.
; FORCE
item_Desc_outlaw_legacy_medium_armor=Tipo de artículo: Armadura media\nReducción de daño: 30%\nTemp. soportada: -56 / 86 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nFuerza y velocidad se combinan en el nuevo conjunto de armadura Inquisitor. Placas de aleación fuertes pero ligeras trabajan junto con un tejido de polifibra reforzada para salvar tu pellejo sin ralentizarte. Al combinarse con la estética intimidante de Kastak Arms, es fácil ver por qué esta armadura media se ha vuelto infame en todo el Imperio.
; FORCE
item_Desc_qrt_mantis_undersuit_01_01_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl Sabine encarna el aspecto y rendimiento avanzados que esperas de Quirinus Tech. Este subtraje de vanguardia integra microtejidos fuertes pero flexibles con placas colocadas estratégicamente para brindar protección sin dejar de ser ligero. Con un diseño elegante, el subtraje Sabine garantizará que te mantengas seguro y con estilo sin importar el camino que tengas por delante.
