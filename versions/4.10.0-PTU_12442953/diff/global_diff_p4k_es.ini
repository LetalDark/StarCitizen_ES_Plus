item_Desc_cds_undersuit_armor_01_02_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nUsando materiales fabricados con tecnología de tejido esférico, CDS ha creado un subtraje ligero y duradero diseñado para satisfacer las necesidades de los combatientes sobre el terreno. Se hizo para combinar con la armadura media GCD-Army de edición limitada, pero es compatible con una amplia variedad de otros conjuntos.
; FORCE
item_Desc_cds_undersuit_helmet_01=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\n\nEl A23 ha sido uno de los sistemas de casco principales de CDS durante años. Construido con tecnología compuesta resistente a impactos y una placa facial laminada endurecida, el A23 es perfecto para entornos peligrosos y operaciones EVA básicas. El visor es compatible con la retícula AR.
; FORCE
item_Desc_clda_undersuit_01_01_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nCon juntas flexibles para mayor comodidad y un movimiento más natural, junto con una conveniente variedad de opciones para puertos conectores en el pecho, el Levin de Caldera ha sido una elección práctica para exploradores en todas partes. Este subtraje en particular ha sido reparado para uso prolongado.
; FORCE
item_Desc_clda_undersuit_02=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nDiseñado para la aventura pero lo suficientemente cómodo para el día a día, el subtraje Markanda se ha vuelto querido por los exploradores. Un diseño único de parches crea un subtraje flexible pero resistente, mientras que un forro interior SureSoft resistente a olores evitará que quieras quitártelo. Este subtraje en particular ha sido reparado para uso prolongado.
; FORCE
item_Desc_clda_undersuit_02_02_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nDiseñado para la aventura pero lo suficientemente cómodo para el día a día, el subtraje Markanda se ha vuelto querido por los exploradores. Un diseño único de parches crea un subtraje flexible pero resistente, mientras que un forro interior SureSoft resistente a olores evitará que quieras quitártelo. Esta edición presenta los colores y el logo de la ya desaparecida Pyrotechnic Amalgamated.
; FORCE
