hurston_UGF_defend_desc_001=HURSTON DYNAMICS\nDEPARTAMENTO DE OUTSOURCING\n\nCONTRATO: Protección de Instalación\nCONTRATISTA: <EM4>~mission(ContractorName)</EM4>\nUBICACIÓN: <EM4>~mission(Location)</EM4>\n\nDETALLES:\nNecesitamos contratistas con experiencia en combate para defender una de nuestras instalaciones de un ataque inminente. Llega rápido y prepara las defensas.\n\nCondiciones del contrato:\nDefender la ubicación contra todas las amenazas hostiles hasta que se neutralicen.\n\nAl aceptar este contrato, asumes todos los riesgos derivados del trabajo descrito.
; FORCE
item_Desc100i_Paint_Camo_Black=Personaliza tu nave Origin de la serie 100 con esta pintura de camuflaje gris.
; FORCE
item_DescCRUS_Star_Runner_Front_Turret=Tipo de artículo: Montura de arma\nFabricante: Crusader Industries\nTamaño: 3\n\nEsta montura de arma de doble enlace controlada por el piloto está hecha a medida para el Mercury Star Runner y viene equipada con dos repetidores láser de tamaño 3 listos para ayudar a mantener despejada tu trayectoria de vuelo.
; FORCE
item_DescCutlass_Paint_SkullandCrossbones_Black_Red=Considerado por el equipo de relaciones públicas de Drake como una referencia irónica a la polémica exagerada, la pintura Skull and Crossbones se apoya en la percepción de que la Cutlass está dirigida a quienes operan al margen de la ley. La pintura adopta la iconografía pirata clásica al incluir varios símbolos de calavera y tibias cruzadas sobre su estructura gris con detalles en rojo.
; FORCE
item_DescFlair_Model_Carrack_toy_b_1H=Esta miniatura altamente detallada celebra el nombramiento de la Carrack como Best in Show en la Exposición Aeroespacial Intergaláctica de 2952. Takuetsu trabajó con Anvil Aerospace para conseguir las dimensiones y los detalles con precisión, de modo que la versión portátil de esta querida nave de exploración pueda acompañarte en aventuras por todo el imperio.
; FORCE
item_DescGATS_BallisticGatling_S3=Fabricante: Gallenson Tactical Systems\nTipo de artículo: Gatling balístico\nTamaño: 3\n\nEl Mantis GT-220 es un cañón giratorio tipo Gatling accionado hidráulicamente diseñado para disparar rondas más pequeñas a una velocidad de disparo muy alta. El Mantis está diseñado para destruir el blindaje de objetivos muy rápidos, sacrificando potencia por una saturación absoluta del área objetivo.
item_DescHammer_Propulsion_HMX_4_3,P=Propulsor Hammer Propulsion HMX 4.3
item_DescHammer_Propulsion_Twin_HM_4_3=La versión de lujo del HM4.3, el sistema de motor HMX4.3 de Hammer Propulsion ofrece un empuje superior y un consumo de combustible refinado en un acabado pulido y elegante. Diseñado para los pilotos más exigentes que buscan tanto rendimiento como prestigio.
; FORCE
item_DescMISC_FuelPod,P=Depósito de combustible MISC
