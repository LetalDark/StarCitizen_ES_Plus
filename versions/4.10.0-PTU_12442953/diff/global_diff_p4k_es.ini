mg_battaglia_blackbox_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: RECUPERACIÓN DE LA CAJA NEGRA\n\nRESUMEN DEL TRABAJO: \nHemos recibido información de que una nave afiliada a M.A. fue reportada recientemente como destruida. Para asegurarnos de que los responsables rindan cuentas y se paguen los Beneficios para los supervivientes, necesitamos que recuperes el registrador de vuelo del lugar del accidente y lo entregues en ~mission(Destination).\n~mission(Timed)\nPAGO:\nTarifa estándar según la lista al entregar la caja negra.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_claimsweep_desc_001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ELIMINAR LADRONES DE ~mission(Location)\n\nRESUMEN DEL TRABAJO: \nUno de nuestros lugares de trabajo en ~mission(LagrangeLocation) fue saqueado. Los mineros legítimos fueron expulsados y los desgraciados responsables llegaron, instalaron algunas torretas desagradables y comenzaron a explotar la reclamación para sí mismos. \n\nNecesito que vayas y elimines cualquier rastro de esta escoria ladrona, incluidas las torretas orbitales, para que nuestra gente pueda volver a trabajar.  \n\nPAGO:\nTarifa estándar según la lista al eliminar con éxito la amenaza hostil.\n\nNOTAS ESPECIALES:\nEstas torretas orbitales son peligrosas. Asegúrate de estar equipado adecuadamente para lidiar con ellas.\n\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_deliver_ore_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ENTREGA DE MUESTRA DE MINERALES\n\nRESUMEN DEL TRABAJO: \nSe le contrata para llevar una muestra de minerales desde ~mission(Location) de vuelta a ~mission(Destination) para un análisis mineral comparativo.\n~mission(Timed)\nPAGO:\nTarifa estándar según la lista al completar.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_escort_safety_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ESCOLTA ARMADA\n\nRESUMEN DEL TRABAJO:  \nHa llegado un comunicado urgente de un minero cercano a ~mission(Location). Han detectado una posible amenaza en la zona y, con razón, les preocupa no poder llegar hasta ~mission(Destination) sin una nave armada que los escolte.\n~mission(Timed)   \nPAGO:\nTarifa estándar según la lista una vez que el minero es escoltado a su destino final. Si ocurren hostilidades, se emitirá una bonificación salarial por combate.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_escort_scan_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ESCOLTA ARMADA\n\nRESUMEN DEL TRABAJO:  \nUn minero necesita una escolta mientras escanea ~mission(Complexity) alrededor de ~mission(Location) en busca de posibles nuevos lugares de excavación. Se espera que los protejas en caso de que surja algún problema. \n \nPAGO:\nTarifa estándar según la lista una vez que el minero es escoltado a su destino final. Si ocurren hostilidades, se emitirá una bonificación salarial por combate.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco\n
; FORCE
mg_battaglia_escort_scan_desc_0002=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ESCOLTA ARMADA\n\nRESUMEN DEL TRABAJO:  \nUno de nuestros miembros necesita una escolta que le cuide las espaldas en ~mission(Complexity) mientras busca posibles lugares de excavación alrededor de ~mission(Location). Si alguien intenta interferir con ellos, dependerá de ti protegerlos. \n \nPAGO:\nTarifa estándar según la lista una vez que el minero es escoltado a su destino final. Si ocurren hostilidades, se emitirá una bonificación salarial por combate.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_recover_cargo__desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: RECUPERACIÓN Y ENTREGA DE CARGA\n\nRESUMEN DEL TRABAJO: \nLamentablemente, una tripulación que transportaba un envío valioso tuvo problemas durante el tránsito. Aunque la nave quedó muy dañada, creemos que la carga todavía está intacta en el lugar del accidente. Se te contrata para viajar al lugar del siniestro, recuperar la carga y entregarla a ~mission(Destination).\n~mission(Timed)\nPAGO:\nTarifa estándar indicada al entregar la carga.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco\n
; FORCE
mg_battaglia_recover_cargo__desc_0002=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: RECUPERACIÓN Y ENTREGA DE CARGA\n\nRESUMEN DEL TRABAJO: \nComo ha sido demasiado común en estos días, una de nuestras tripulaciones tuvo problemas y se vieron obligados a abandonar la nave, dejando atrás el valioso envío que transportaban. Se te contrata para viajar al lugar del siniestro, recuperar la carga y entregarla a ~mission(Destination).\n~mission(Timed)\nPAGO:\nTarifa estándar indicada al entregar la carga.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_recover_stolen_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: RECUPERACIÓN DE CARGA ROBADA\n\nRESUMEN DEL TRABAJO: \nUn forajido llamado ~mission(TargetName) atacó uno de nuestros puestos de minería remotos y logró llevarse una carga valiosa. M.A. no permitirá que un ataque contra uno de nuestros miembros quede impune. Se le está contratando para localizar a ~mission(TargetName|Last), recuperar la carga por cualquier medio necesario y entregarla a ~mission(Destination) para que pueda ser devuelta a sus legítimos propietarios.\n~mission(Contractor|RecoveryTimed)\nPAGO:\nTarifa estándar al devolver la carga.\n~mission(Contractor|RecoveryDanger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_recover_stolen_desc_0002=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: RECUPERACIÓN DE CARGA ROBADA\n\nRESUMEN DEL TRABAJO: \nUn afiliado de M.A. fue atacado y robado recientemente por un forajido llamado ~mission(TargetName). Afortunadamente, otro asociado nos ha dado información sobre la ubicación actual de ~mission(TargetName|Last). Se le está contratando para enfrentarse a este bandido y recuperar la propiedad robada por cualquier medio necesario. Una vez en su posesión, entregue la mercancía a ~mission(Destination) y nosotros la devolveremos a su legítimo dueño.\n~mission(Contractor|RecoveryTimed)\nPAGO:\nTarifa estándar al devolver la carga.\n~mission(Contractor|RecoveryDanger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_search_body_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CONFIRMACIÓN DEL ESTADO DEL MIEMBRO\n\nRESUMEN DEL TRABAJO: \nUn miembro de M.A., ~mission(TargetName), se sabe que estaba trabajando a bordo de una nave que acaban de informar como destruida. Para asegurarnos de que se paguen adecuadamente los Beneficios para Supervivientes, se le encargará ir al lugar del siniestro de la nave y confirmar qué sucedió exactamente con ~mission(TargetName|Last).\n~mission(Timed)\nPAGO:\nTarifa estándar al confirmar el estado de ~mission(TargetName).\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_search_crew_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CONFIRMACIÓN DEL ESTADO DE LA TRIPULACIÓN DESAPARECIDA\n\nRESUMEN DEL TRABAJO: \nUna nave afiliada a M.A. fue reportada recientemente como destruida. Para asegurarse de que los Beneficios para Supervivientes se paguen adecuadamente, se le asignará la tarea de ir al lugar del siniestro de la nave y confirmar qué sucedió con todos los miembros de la tripulación desaparecidos.\n~mission(Timed)\nPAGO:\nTarifa estándar tras la confirmación del estado de toda la tripulación.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_battaglia_sectorsweep_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: DESPEJAR EL SECTOR DE AMENAZA HOSTIL\n\nRESUMEN DEL TRABAJO: \nUn grupo de forajidos operando en ~mission(Location) han hecho imposible que los mineros trabajen en la zona de forma segura. En respuesta, M.A. está contratando operadores capacitados para moverse por el sector y eliminar cualquier fuerza hostil allí.\n\nPAGO:\nTarifa estándar según la lista tras la eliminación exitosa de la amenaza hostil.\n~mission(Danger)\nAUTORIZACIÓN:\nBattaglia, Recco
; FORCE
mg_pacheco_assassin_sync_desc_001=Hace un tiempo, recibí una amenaza de chantaje no muy sutil. Pudimos rastrearla hasta dos operadores conocidos como ~mission(TargetName) y ~mission(TargetName2).\n\nVas a enviar un mensaje sobre lo que les hacemos a las personas que intentan aprovecharse de nosotros.\n\nForma un equipo y caza a estos bastardos. Y como no podemos arriesgarnos a que filtren la información que tienen, debes matarlos a ambos al mismo tiempo. \n\n~Mission(Danger) Hazlo de forma que nadie vuelva a pensar en chantajearnos durante mucho tiempo.\n\n-Twitch
; FORCE
mg_pacheco_assassin_sync_desc_002=Mis empleadores quieren muertos a ~mission(TargetName) y ~mission(TargetName2).\n\nMás importante aún, quieren que mueran al mismo tiempo. \n\nCoordina con algunos mercenarios de confianza para realizar un ataque simultáneo.\n\n~Mission(Danger) Como sea que suceda, hazlo de forma limpia y no dejes que ninguno de ellos escape. \n\n-Twitch
; FORCE
