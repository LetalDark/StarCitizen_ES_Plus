item_Desc_qrt_mantis_undersuit_01_02_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl Sabine encarna el aspecto y rendimiento avanzados que esperas de Quirinus Tech. Este subtraje de vanguardia integra microtejidos fuertes pero flexibles con placas colocadas estratégicamente para brindar protección sin dejar de ser ligero. Con un diseño elegante, el subtraje Sabine garantizará que te mantengas seguro y con estilo sin importar el camino que tengas por delante. La edición Daybreaker presenta sutiles pero llamativos detalles dorados.
