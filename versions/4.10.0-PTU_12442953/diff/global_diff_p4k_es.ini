item_Desc_dnn_shoes_03_02_01,P=0.3 kg\n\n¿Quieres moverte con ligereza y comodidad en unas zapatillas sin renunciar al estilo? Con acolchado de espuma viscoelástica multinivel en unas suelas diseñadas para adaptarse y flexionarse con tu forma específica, además de llamativos detalles LED en las suelas exteriores, haz que cada paso sea audaz con los zapatos Doubleback.\n\nLa edición Ultimatum es de un azul intenso con vivos colores rosas.
; FORCE
item_Desc_fta_medium_helmet_01_15_16,P=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nFabricada para mineros pero lista para cualquier aventura, el diseño del casco Strata de Greycat Industrial presenta materiales de alta calidad y un sistema de filtración de aire de última generación que permite respirar limpio tanto en una mina profunda como en atmósferas hostiles. La edición Levski presenta un elegante blindaje negro con detalles en amarillo oscuro y el símbolo de la People's Alliance.
; FORCE
item_Desc_gsb_frontier_boots_01_02_11,P=PLACEHOLDER - gsb_frontier_boots_01_02_11
; FORCE
item_Desc_gys_undersuit_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nAdéntrate con confianza en lo desconocido con el subtraje Deep-Space. Diseñado inteligentemente con varias secciones superpuestas para garantizar la integridad del traje, Gyson ha creado un subtraje asequible y a la moda que ayuda a hacer el viaje espacial más accesible para todos.
; FORCE
item_Desc_hdtc_undersuit_01_01_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl Lamont luce tan bien que no querrás llevar armadura encima. Combinando sin esfuerzo placas ligeras con tejidos sintéticos duraderos, el Lamont será tan cómodo en la cabina como estiloso en las calles. Adopta un equipo de protección personal adecuado tanto para el trabajo como para el ocio, y obtén la ventaja Hardin Tactical.
; FORCE
item_Desc_hdtc_undersuit_01_01_02=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl Lamont luce tan bien que no querrás llevar armadura encima. Combinando sin fisuras un blindaje ligero con tejidos sintéticos duraderos, el Lamont será tan cómodo en la cabina como elegante en las calles. Adopta un equipo de protección personal apto tanto para el trabajo como para el ocio, y obtén la ventaja Hardin Tactical.\n \nEl subtraje Xy'kara se inspira en la herencia milenaria de los Xi'an.
; FORCE
item_Desc_kap_combat_light_core_04_01_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 8K µSCU\nMochilas: Ligera\n\nUna síntesis ideal de fuerza y tecnología, la armadura Geist Stealth está fabricada con seda de carbono de grado militar procedente de los mismos fabricantes que protegen a las fuerzas especiales de la UEE. Filamentos tan finos como cabellos tejidos en la tela ocultan las emisiones del portador, haciéndolo indetectable por radar, y la tubería especializada incorporada en las suelas de las botas amortigua el sonido de los pasos.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
; FORCE
item_Desc_kap_combat_light_legs_04_01_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 2.5K µSCU\n\nUna síntesis ideal de fuerza y tecnología, la armadura Geist Stealth está fabricada con seda de carbono de grado militar procedente de los mismos fabricantes que protegen a las fuerzas especiales de la UEE. Filamentos tan finos como cabellos tejidos en la tela ocultan las emisiones del portador, haciéndolo indetectable por radar, y la tubería especializada incorporada en las suelas de las botas amortigua el sonido de los pasos.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
; FORCE
item_Desc_ksar_undersuit_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEste subtraje básico de Kastak Arms ofrece un sellado completo de protección contra los elementos y compatibilidad con múltiples tipos de armadura.
; FORCE
item_Desc_m_hdtc_jacket_02_01_01=Reducción de daño: 5%\nCapacidad de carga: 0.4K µSCU\n0.5 kg\n\nElegante, funcional y letal: la línea de ropa Bellator está diseñada para encajar tanto en una cena de gala como en un tiroteo. Combinando tecnología de vanguardia con medidas precisas, esta chaqueta ofrece cierta protección en combate gracias al intrincado tejido de grafeno en capas de sus hilos. Adornada con un pin decorativo en la solapa, el amplio forro interior de la chaqueta también es capaz de ocultar sutilmente armas y dispositivos pequeños.\n\nLa edición Goldsmith presenta filigrana dorada y costuras sobre un lujoso negro para un look extravagante.
; FORCE
item_Desc_nvs_pilot_flightsuit_01=Tipo de artículo: Traje de vuelo blindado\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nTolerancia a fuerza G: +97.5%\nCapacidad de carga: 8.0 µSCU\n\nInspirado en el traje de vuelo blindado utilizado por los pilotos de la Marina de la UEE, el OMNI-AFS-Sapphire ha sido probado en combate y refinado durante siglos hasta convertirse en la prenda definitiva para cualquier piloto. Su construcción robusta pero cómoda no solo resiste entornos hostiles, sino que también incorpora armadura integrada en brazos, torso y piernas para los enfrentamientos de combate. La única manera de que un piloto se acerque más a lo real es alistándose.
; FORCE
item_Desc_nvs_pilot_flightsuit_helmet_01=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\n\nSimilar al casco utilizado por los pilotos de la Marina de la UEE, el casco OMNI-AFS-Sapphire ofrece una protección y visibilidad excelentes. Su blindaje multicapa protege contra impactos, mientras que su amplia placa facial garantiza una vista clara y sin obstrucciones tanto en la cabina como a pie.
; FORCE
item_Desc_nvy_flightsuit_01_01_01=Tipo de artículo: Traje de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +97.5%\n\nInspirado en los trajes de vuelo originales utilizados por la Fuerza Aérea de la Tierra, esta réplica se mantiene fiel al diseño histórico mientras incorpora comodidades modernas.\n\nLa edición Aviator es principalmente de color verde-beige con detalles en verde claro.
; FORCE
item_Desc_nvy_flightsuit_01_02_01=Tipo de artículo: Traje de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +97.5%\n\nInspirado en los trajes de vuelo originales utilizados por la Fuerza Aérea de la Tierra, esta réplica se mantiene fiel al diseño histórico mientras incorpora comodidades modernas.\n\nLa edición Bombardier es principalmente de color piedra con detalles en marrón oscuro.
