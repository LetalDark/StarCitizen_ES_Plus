vehicel_DescANVL_Valkyrie=Fabricante: Anvil Aerospace \nEnfoque: Dropship\n\nLa Valkyrie sube la apuesta en el transporte de tropas. Diseñada para transportar hasta veinte soldados, así como vehículos, a los lugares más hostiles, esta nave militar lista para el conflicto es una fuerza formidable, tanto ofensiva como defensivamente. Construida pensando en los contratistas de defensa militares y privados, la Valkyrie es uno de los transportes de personal más eficientes y efectivos de su clase.
; FORCE
vehicl_DescMISC_Hull_B=Fabricante: MISC\nEnfoque: Carga media\n\nEl MISC Hull B es una opción robusta para pilotos que buscan un transporte de carga dedicado. Aunque no es tan grande como algunos de los otros modelos de la serie Hull, el perfil más pequeño del Hull B proporciona una mayor flexibilidad y más opciones de acceso.
; FORCE
vehicle_DescAEGS_Avenger_Stalker=Fabricante: Aegis Dynamics\nEnfoque: Interceptor\n\nInicialmente diseñado como la nave de transporte de primera línea de Aegis para el ejército, el Avenger Stalker tomó un camino diferente y finalmente tuvo una larga e histórica carrera como patrullero estándar de la Fiscalía de la UEE. Utilizando su bodega de carga para el transporte de prisioneros, el Avenger presenta un casco robusto y fiable y capacidad para soportes de motor más grandes de lo esperado.
; FORCE
vehicle_DescAEGS_Firebird_Collector_Milt,P=Fabricante: Aegis Dynamics\nEnfoque: Caza sigiloso\n \nCuando los enfrentamientos en primera línea requieren un ataque rápido y decisivo, el Sabre Firebird es el caza mediano ideal para cualquier arsenal. Tomando el ya probado en batalla Sabre Raven, Aegis ha diseñado la variante Firebird con un lanzamisiles mejorado capaz de enfrentarse a una amplia gama de amenazas.
; FORCE
vehicle_DescAEGS_Retaliator=Fabricante: Aegis Dynamics\nEnfoque: Modular\n\nEsta versión civil modificada del Retaliator actualiza el chasis de la nave militar con espacio vacío que puede ser equipado con varios módulos para adaptarse a tus necesidades.
; FORCE
vehicle_DescAEGS_Sabre_Firebird=Fabricante: Aegis Dynamics\nEnfoque: Caza sigiloso\n \nCuando los enfrentamientos en primera línea requieren un ataque rápido y decisivo, el Sabre Firebird es el caza mediano ideal para cualquier arsenal. Tomando el ya probado en batalla Sabre Raven, Aegis ha diseñado la variante Firebird con un lanzamisiles mejorado capaz de enfrentarse a una amplia gama de amenazas.
; FORCE
vehicle_DescAEGS_Vanguard_Harbinger=Fabricante: Aegis Dynamics\nEnfoque: Caza pesado / Bombardero\n\nEl Vanguard Harbinger es el caza/bombardero estándar de la Tierra, que convierte la cápsula de escape estándar del Warden en una potente bahía de bombas. El alcance extendido del Vanguard y el perfil relativamente pequeño significan que puede ir donde las naves con base en portaaviones o los bombarderos estratégicos más grandes no llegan, atacar con fuerza y luego regresar a la base.
; FORCE
vehicle_DescAEGS_Vanguard_Hoplite=Fabricante: Aegis Dynamics\nEnfoque: Dropship \n\nEl Vanguard Hoplite es un cruce entre el caza espacial Vanguard ganador y una nave de abordaje dedicada. Adaptado de diseños probados de naves de asalto, el Hoplite es la herramienta perfecta para insertar un equipo de ataque blindado con suficiente potencia de fuego para sacarlos de nuevo.
; FORCE
vehicle_DescAEGS_Vanguard_Sentinel=Fabricante: Aegis Dynamics\nEnfoque: Caza pesado \n\nEl Vanguard Sentinel es una nave diseñada para luchar de forma inteligente en lugar de enfrentarse a los enemigos cara a cara. La conversión cuenta con una cabina AR, una cápsula e-War externa, misiles señuelo y un conjunto de cargas EMP. Los Vanguard Sentinel a menudo brindan el apoyo de combate necesario para operaciones combinadas. Un Sentinel solitario suele emparejarse con bombarderos Harbinger y escoltas Warden para grandes misiones de ataque.
; FORCE
vehicle_DescANVL_Asgard=Fabricante: Anvil Aerospace\nEnfoque: Dropship\n \nA medida que las batallas de hoy continúan creciendo en escala y complejidad, Anvil Aerospace entiende el impacto que un solo vehículo puede tener en el resultado. Llega el Asgard. La siguiente generación en transporte de vehículos terrestres, el Anvil Asgard cuenta con una rampa de carga rápida, una bodega de tamaño considerable para almacenar de forma segura el vehículo de asalto de tu elección y una amplia gama de armamento para garantizar el acceso incluso a las zonas de despliegue más intensas en combate.
; FORCE
vehicle_DescANVL_Asgard_Collector_Military=Fabricante: Anvil Aerospace\nEnfoque: Dropship\n \nA medida que las batallas de hoy continúan creciendo en escala y complejidad, Anvil Aerospace entiende el impacto que un solo vehículo puede tener en el resultado. Llega el Asgard. La siguiente generación en transporte de vehículos terrestres, el Anvil Asgard cuenta con una rampa de carga rápida, una bodega de tamaño considerable para almacenar de forma segura el vehículo de asalto de tu elección y una amplia gama de armamento para garantizar el acceso incluso a las zonas de despliegue más intensas en combate.\n\nWikelo aquí. He hecho modificaciones útiles para que nave sea mucho más como luchadora. Muy impresionante.
; FORCE
vehicle_DescANVL_Ballista=Fabricante: Anvil Aerospace\nEnfoque: Antiaéreo\n\nMantén tu espacio aéreo libre de peligros con la Anvil Ballista. Diseñada originalmente para defender puestos de avanzada de los ataques vanduul, este sistema móvil de defensa antimisiles cuenta con un potente equipamiento que permite a la Ballista mantenerse firme contra cualquier amenaza, ya llegue por aire o por tierra.
; FORCE
vehicle_DescANVL_Ballista_Dunestalker=Fabricante: Anvil Aerospace\nEnfoque: Antiaéreo\n\nMantén tu espacio aéreo libre de peligros con la Anvil Ballista. Diseñada originalmente para defender puestos de avanzada de los ataques vanduul, este sistema móvil de defensa antimisiles cuenta con un potente equipamiento que permite a la Ballista mantenerse firme contra cualquier amenaza, ya llegue por aire o por tierra. La variante Dunestalker presenta un esquema de pintura naturalista ideal para integrarse en paisajes hostiles.
; FORCE
vehicle_DescANVL_Ballista_Snowblind=Fabricante: Anvil Aerospace\nEnfoque: Antiaéreo\n\nMantén tu espacio aéreo libre de peligros con la Anvil Ballista. Diseñada originalmente para defender puestos de avanzada de los ataques vanduul, este sistema móvil de defensa antimisiles cuenta con un potente equipamiento que permite a la Ballista mantenerse firme contra cualquier amenaza, ya llegue por aire o por tierra. La variante Snowblind viene en un patrón de camuflaje gris para mantenerla oculta contra terrenos rocosos o lunares.
; FORCE
vehicle_DescANVL_C8X_Pisces_Expedition=Fabricante: Anvil Aerospace\nEnfoque: Explorador\n\nCon más armas y una pintura de edición limitada, el C8X Pisces Expedition convierte a la robusta nave de corto alcance en un vehículo de exploración independiente perfectamente viable. Con su estructura compacta, maniobrabilidad ágil y asientos para tres personas, el Pisces Expedition está listo para emprender sus propias aventuras.
; FORCE
vehicle_DescANVL_C8_Pisces=Fabricante: Anvil Aerospace\nEnfoque: Explorador\n\nCon su estructura compacta, maniobrabilidad ágil y asientos para tres personas, la nave de corto alcance C8 Pisces, incluida con cada Carrack, está construida por Anvil Aerospace para explorar por delante o investigar entornos inaccesibles para su nave nodriza más grande.
; FORCE
vehicle_DescANVL_Carrack=Fabricante: Anvil Aerospace\nEnfoque: Expedición\n\nLa aventura llama y Anvil Aerospace responde con la Carrack. Construida para soportar condiciones extremas tanto en el espacio como en la atmósfera, esta exploradora autosuficiente se ha ganado con creces su estatus de exploradora de referencia tanto para el servicio militar como civil.
; FORCE
vehicle_DescANVL_Carrack_Expedition=Fabricante: Anvil Aerospace\nEnfoque: Expedición\n\nLa aventura llama y Anvil Aerospace responde con la Carrack. Construida para soportar condiciones extremas tanto en el espacio como en la atmósfera, esta exploradora autosuficiente se ha ganado con creces su estatus de exploradora de referencia tanto para el servicio militar como civil. La edición 'Expedition' presenta una decoración especial ideal para viajar audazmente por las estrellas.
; FORCE
vehicle_DescANVL_Centurion=Fabricante: Anvil Aerospace\nEnfoque: Antiaéreo\n\nConstruido sobre la popular plataforma Atlas de Anvil, el Centurion presenta una solución táctica para operaciones antiaéreas de corto alcance. Gracias a la torreta AA personalizada basada en energía del Centurion, tus fuerzas pueden establecer superioridad terrestre asegurándose de que las amenazas inmediatas desde arriba se enfrenten de manera rápida y eficiente.
; FORCE
vehicle_DescANVL_Spartan=Fabricante: Anvil Aerospace\nEnfoque: Pasajero\n\nConstruido sobre la robusta plataforma Atlas de Anvil, el mismo chasis utilizado para su devastador sistema de defensa aérea Ballista, el Spartan es un transporte totalmente blindado equipado con ocho asientos plegables. La robusta estructura del Spartan lo hace perfecto para todo tipo de terreno, y su torreta Gatling remota ayuda a despejar el área para un despliegue más fácil.
; FORCE
vehicle_DescANVL_Valkyrie_CitizenCon=Fabricante: Anvil Aerospace \nEnfoque: Dropship\n\nDurante más de un siglo, las naves Anvil se han distinguido en innumerables operaciones de combate civiles y militares. Honra esa orgullosa tradición de seguridad con la Valkyrie Liberator Edition limitada, que presenta un paquete de equipamiento exclusivo que conmemora el debut de la nave en CitizenCon 2948.
; FORCE
vehicle_DescARGO_CSV_Cargo=Fabricante: Argo Astronautics\nEnfoque: Carga ligera\n\nTienes tu terreno, tienes los materiales de construcción adecuados, y ahora estás listo para ver cómo tus sueños toman forma. La compañera ideal de la CSV-FM, la CSV Supply Model proporciona almacenamiento adicional para todos los recursos necesarios para construir tu próximo asentamiento.\n
; FORCE
vehicle_DescARGO_MOTH=Fabricante: Argo Astronautics\nEnfoque: Recuperación media\n\nExperimenta los siglos de experiencia industrial de Argo con la MOTH. Utilizando un chasis probado y contrastado como base, la MOTH cuenta con tres torretas dedicadas a la recuperación y un autocargador externo de recuperación, para que una tripulación de cuatro personas pueda desmantelar, fracturar y almacenar la chatarra tan rápido como pueda acceder a ella.
; FORCE
vehicle_DescARGO_MPUV_Tractor=Fabricante: Argo Astronautics\nEnfoque: Carga ligera\n\nEl Argo Astronautics MPUV-1T está equipado con un rayo tractor que le permite mover fácilmente contenedores de carga dentro y fuera de naves de transporte más grandes. Su tamaño más pequeño y su maniobrabilidad lo convierten en un vehículo de apoyo ideal en zonas de aterrizaje y estaciones espaciales.
; FORCE
vehicle_DescARGO_MPUV_Transport=Fabricante: Argo Astronautics\nEnfoque: Pasajero\n\nEl Argo Astronautics MPUV-1P (comúnmente 'Argo Personnel'). Esta versión del Argo está orientada a una responsabilidad simple pero increíblemente importante: trasladar grupos de personas de un lugar a otro. La Armada de la UEE utiliza ampliamente los MPUV-1P, y cualquier nuevo recluta probablemente pueda recordar esos momentos aterradores en los que una nave así los llevó a su primera misión espacial. En manos civiles, las naves Argo Personnel están adaptadas para todo, desde servicios de taxi estándar hasta su uso como naves de combate improvisadas. El Argo MPUV-1P es capaz de transportar hasta ocho personas y su equipo.
; FORCE
vehicle_DescARGO_Mole=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nEl icónico extractor láser para múltiples operadores de Argo, más comúnmente conocido como el MOLE, te permite trabajar más rápido y de forma más eficiente que nunca gracias a su sistema de minería trilateral patentado. Sus tres estaciones de extracción articuladas y controladas de manera independiente permiten una potencia máxima y una versatilidad casi ilimitada. El MOLE vive según el dicho «muchas manos hacen el trabajo ligero».
; FORCE
vehicle_DescARGO_Mole_Carbon=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nEl icónico extractor láser para múltiples operadores de Argo, más comúnmente conocido como el MOLE, te permite trabajar más rápido y de forma más eficiente que nunca gracias a su sistema de minería trilateral patentado. Sus tres estaciones de extracción articuladas y controladas de manera independiente permiten una potencia máxima y una versatilidad casi ilimitada. La Carbon Edition ofrece la venerada capacidad minera del MOLE con un distintivo acabado completamente negro.
; FORCE
vehicle_DescARGO_Mole_Talus=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nEl icónico extractor láser para múltiples operadores de Argo, más comúnmente conocido como el MOLE, te permite trabajar más rápido y de forma más eficiente que nunca gracias a su sistema de minería trilateral patentado. Sus tres estaciones de extracción articuladas y controladas de manera independiente permiten una potencia máxima y una versatilidad casi ilimitada. El MOLE Talus Edition cuenta con la misma habilidad minera que la nave estándar junto con una pintura gris más discreta.\n
; FORCE
vehicle_DescARGO_Mole_Teach=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nEl icónico extractor láser para múltiples operadores de Argo, más comúnmente conocido como el MOLE, te permite trabajar más rápido y de forma más eficiente que nunca gracias a su sistema de minería trilateral patentado. Sus tres estaciones de extracción articuladas y controladas de manera independiente permiten una potencia máxima y una versatilidad casi ilimitada. El MOLE vive según el dicho «muchas manos hacen el trabajo ligero».\n\nPara adaptarse a las duras condiciones de trabajo en Nyx, Teach's Ship Shop ha equipado esta edición especial con una configuración personalizada que incluye componentes resistentes para ayudarte a afrontar mejor la tarea.
; FORCE
vehicle_DescARGO_RAFT=Fabricante: Argo Astronautics\nEnfoque: Carga media\n\nLa Argo RAFT cuenta con una amplia bodega de carga de 192 SCU y es capaz de transportar contenedores de carga estandarizados de 32 SCU. Perfecta tanto para transportistas principiantes como para veteranos experimentados, la RAFT es una solución ideal para un transporte de mercancías local fiable.
; FORCE
vehicle_DescARGO_RAFT_Collector_Indust=Fabricante: Argo Astronautics\nEnfoque: Carga media\n\nLa Argo RAFT cuenta con una amplia bodega de carga de 192 SCU y es capaz de transportar contenedores de carga estandarizados de 32 SCU. Perfecta tanto para transportistas principiantes como para veteranos experimentados, la RAFT es una solución ideal para un transporte de mercancías local fiable.\n\nWikelo hi. He realizado modificaciones útiles para hacer que la nave sea aún más industriosa. Te gustará.
; FORCE
vehicle_DescARGO_SRV=Fabricante: Argo Astronautics\nEnfoque: Recuperación\n\nCuando se trata de hacer el trabajo, Argo no pierde el tiempo. Desde simples remolques de mercancías y carga hasta desgarradoras operaciones de búsqueda y rescate, el SRV se encarga de todo lo que le puedas arrojar. El sistema de tractor a medida utiliza una innovadora combinación de placa y brazo, lo que permite un uso individual sin esfuerzo, así como un remolque de equipo de precisión para trabajos más grandes. Tu tripulación y pasajeros también están seguros gracias a escudos duraderos y armaduras resistentes que mantienen la cabina y los componentes seguros cuando la situación se pone complicada.
; FORCE
vehicle_DescCNOU_HoverQuad=Fabricante: Consolidated Outland\nEnfoque: Pasajero\n\nDiseñado como vehículo terrestre compañero del Nomad, el elegante marco angular del HoverQuad utiliza cuatro plataformas grav-lev para una máxima maniobrabilidad, lo que lo convierte en el transporte perfecto en todo tipo de superficies.
; FORCE
vehicle_DescCNOU_Mustang_Alpha=Fabricante: Consolidated Outland \nEnfoque: Inicial / Carga ligera\n\nInspirado por la vanguardista visión del CEO de Consolidated Outland, Silas Koerner, el Mustang Alpha es una nave espacial elegante y con estilo que utiliza aleaciones ultraligeras para llevar las proporciones de potencia al límite, aunque a veces de forma poco segura. Y ahora, con el Cargo Carrier opcional, puedes disfrutar de las ventajas del Alpha sin sacrificar la capacidad de carga.
; FORCE
vehicle_DescCNOU_Mustang_Alpha_CitizenCon18=Fabricante: Consolidated Outland \nEnfoque: Inicial / Carga ligera\n\nDiseñado para conmemorar la CitizenCon 2948, este modelo personalizado del recién revisado Mustang Alpha presenta una exclusiva nueva pintura diseñada por el propio Silas Koerner.
; FORCE
vehicle_DescCNOU_Nomad=Fabricante: Consolidated Outland \nEnfoque: Inicial / Carga ligera\n\nCon la versatilidad de un carguero multipropósito de tamaño mediano integrada en un elegante y compacto diseño, el Consolidated Outland Nomad es el modelo de autosuficiencia, el espíritu del cielo abierto y la solución perfecta para cualquiera que desee comenzar una nueva aventura.
; FORCE
vehicle_DescCNOU_Nomad_Teach=Fabricante: Consolidated Outland \nEnfoque: Inicial / Carga ligera\n\nCon la versatilidad de un carguero multipropósito de tamaño mediano integrada en un elegante y compacto diseño, el Consolidated Outland Nomad es el modelo de autosuficiencia, el espíritu del cielo abierto y la solución perfecta para cualquiera que desee comenzar una nueva aventura.\n\nPara adaptarse a las duras condiciones de trabajo en Nyx, Teach's Ship Shop ha equipado esta edición especial con una configuración personalizada que incluye componentes resistentes para ayudarte a afrontar mejor la tarea.
; FORCE
vehicle_DescCRUS_A1_Spirit=Fabricante: Crusader Industries\nEnfoque: Bombardero\n\nCrusader Industries trae su compromiso habitual con la excelencia directamente al mercado civil con la A1 Spirit, una nave estelar multipropósito de tamaño mediano equipada como bombardero ligero pero con suficiente versatilidad para abordar múltiples funciones y trabajos impredecibles.
; FORCE
vehicle_DescCRUS_C1_Spirit=Fabricante: Crusader Industries\nEnfoque: Carga ligera\n\nCrusader Industries trae su compromiso habitual con la excelencia directamente al mercado civil con la C1 Spirit, una nave estelar multipropósito de tamaño mediano construida para el transporte y la entrega de carga, pero con suficiente versatilidad para abordar múltiples funciones y trabajos impredecibles.
; FORCE
vehicle_DescCRUS_Intrepid=Fabricante: Crusader Industries\nEnfoque: Inicial / Carga ligera\n\nPara aquellos ansiosos por enfrentar su futuro, los renombrados ingenieros de Crusader Industries presentan con orgullo la Intrepid. Una nave audaz lista para asumir una amplia variedad de trabajos y superar numerosos desafíos, la Intrepid cuenta con un espacio de carga eficiente y cómodas áreas habitables para aprovechar al máximo tu viaje en solitario por las estrellas.
; FORCE
vehicle_DescCRUS_Intrepid_Collector_Indust,P=Fabricante: Crusader Industries\nEnfoque: Inicial / Carga ligera\n\nPara aquellos ansiosos por enfrentarse a su futuro, los renombrados ingenieros de naves de Crusader Industries presentan con orgullo la Intrepid. Una nave audaz lista para abordar una gran cantidad de trabajos y conquistar numerosos desafíos, la Intrepid cuenta con un espacio de carga eficiente y cómodas instalaciones para vivir, lo que te permitirá aprovechar al máximo tu viaje en solitario a través de las estrellas.
; FORCE
vehicle_DescCRUS_Spirit_C1_Collector_Civilian=Fabricante: Crusader Industries\nEnfoque: Carga ligera\n\nCrusader Industries lleva su habitual compromiso con la excelencia directamente al mercado civil con la C1 Spirit, una nave estelar multipropósito de tamaño mediano diseñada para el transporte y la entrega de carga, pero con suficiente versatilidad para abordar múltiples roles y trabajos impredecibles.\n\nWikelo aquí. Hice modificaciones útiles para hacerla mucho más impresionante.
; FORCE
vehicle_DescCRUS_Starlifter_2951_BIS=Fabricante: Crusader Industries\nEnfoque: Carga pesada\n\nUtilizando el bastidor espacial militar patentado Hercules y ampliando la capacidad de carga, sacrificando apenas potencia de fuego, la C2 ha revolucionado el sector privado. Se ha convertido en el estándar de la industria para equipos de carreras, concesionarios y fabricantes de naves, organizaciones de construcción, corporaciones mineras e incluso grandes compañías de entretenimiento itinerante. Para celebrar que la Hercules fue votada finalista al premio Best in Show en 2951, esta edición de la nave incluye una pintura especial azul y negra ya aplicada.
; FORCE
vehicle_DescCRUS_Starlifter_A2=Fabricante: Crusader Industries\nEnfoque: Bombardero pesado\n\nLa A2 Starlifter ha sido utilizada con efectos devastadores en asaltos aéreos, operaciones de búsqueda y rescate, y misiones de desembarco. Con más del doble de potencia de fuego que la M2 y una bahía de bombas personalizada capaz de entregar una carga asombrosa, la A2 está pensada para quienes transportan enormes cantidades de carga a través de cielos potencialmente hostiles.
; FORCE
vehicle_DescCRUS_Starlifter_A2_Collector_Military=Fabricante: Crusader Industries\nEnfoque: Bombardero pesado\n\nLa A2 Starlifter ha sido utilizada con efectos devastadores en asaltos aéreos, operaciones de búsqueda y rescate, y misiones de desembarco. Con más del doble de potencia de fuego que la M2 y una bahía de bombas personalizada capaz de entregar una carga asombrosa, la A2 está pensada para quienes transportan enormes cantidades de carga a través de cielos potencialmente hostiles.\n\nWikelo aquí. He hecho modificaciones útiles para que la nave sea mucho más parecida a un caza. Muy impresionante.
; FORCE
vehicle_DescCRUS_Starlifter_C2=Fabricante: Crusader Industries\nEnfoque: Carga pesada\n\nUtilizando el chasis espacial militar patentado Hercules y expandiendo la capacidad de carga, sin sacrificar prácticamente ninguna potencia de fuego, la C2 ha arrasado en el sector privado. Se ha convertido en el estándar de la industria para equipos de carreras, distribuidores y fabricantes de naves, organizaciones de construcción, corporaciones mineras e incluso empresas de entretenimiento turístico a gran escala.
; FORCE
vehicle_DescCRUS_Starlifter_M2=Fabricante: Crusader Industries\nEnfoque: Carga pesada\n\nLa M2 Hercules es la principal transportadora estelar táctica de la UEE. La potente combinación de capacidad, maniobrabilidad, durabilidad y robusto paquete de armas del transporte a gran escala garantiza que tu carga y tu tripulación lleguen a su destino en una sola pieza.
; FORCE
vehicle_DescDRAK_Buccaneer=Fabricante: Drake Interplanetary\nEnfoque: Caza ligero\n\nLa Buccaneer ha sido diseñada desde cero para volar y luchar como tú vives. Aquí no hay interiores de cuero ni hiperalmohadas: la Bucc es una chatarrera diseñada para maniobrar y luchar por encima de su categoría de peso. Esta turbulenta caza fronteriza se puede mantener en las peores condiciones para mantener con vida a tripulaciones espaciales reales y en funcionamiento.
; FORCE
vehicle_DescDRAK_Caterpillar=Fabricante: Drake Interplanetary\nEnfoque: Carga media\n\nIntroducida por primera vez en 2871, la Caterpillar de Drake Interplanetary ha demostrado durante mucho tiempo ser una nave multifunción fiable y rentable, capaz de equiparse para todo, desde operaciones mercantiles hasta apoyo de combate. Aclamada durante mucho tiempo como una alternativa muy reñida a la omnipresente serie Hull, la Caterpillar es un carguero que no escatima en armamento ni personalización.
; FORCE
vehicle_DescDRAK_Caterpillar_Pirate=Fabricante: Drake Interplanetary\nEnfoque: Carga media\n\nIntroducida por primera vez en 2871, la Caterpillar de Drake Interplanetary ha demostrado durante mucho tiempo ser una nave multifunción fiable y rentable, capaz de equiparse para todo, desde operaciones mercantiles hasta apoyo de combate. Aclamada durante mucho tiempo como una alternativa muy reñida a la omnipresente serie Hull, la Caterpillar es un carguero que no escatima en armamento ni personalización. Este modelo presenta una decoración única aplicada por los propietarios anteriores.
; FORCE
vehicle_DescDRAK_Caterpillar_ShipShowdown=Fabricante: Drake Interplanetary\nEnfoque: Carga media\n\nIntroducida por primera vez en 2871, la Caterpillar de Drake Interplanetary ha demostrado durante mucho tiempo ser una nave multifunción fiable y rentable, capaz de equiparse para todo, desde operaciones mercantiles hasta apoyo de combate. Aclamada durante mucho tiempo como una alternativa muy reñida a la omnipresente serie Hull, la Caterpillar es un carguero que no escatima en armamento ni personalización.
; FORCE
vehicle_DescDRAK_Clipper=Fabricante: Drake Interplanetary\nEnfoque: Generalista\n \nSi hay algo que todo capitán debe tener muy presente al prepararse para viajar por las estrellas es «esperar lo inesperado». Con una bodega de carga, instalaciones médicas y capacidades de fabricación, junto con la práctica filosofía de diseño de Drake, la Clipper es la nave perfecta para cualquier nueva empresa dedicada a recorrer el espacio.
; FORCE
vehicle_DescDRAK_Corsair=Fabricante: Drake Interplanetary\nEnfoque: Expedición\n\nEscucha el llamado del espacio inexplorado y aprovecha el espíritu de la exploración con la Drake Corsair. Utilizando un diseño único de casco asimétrico, esta exploradora versátil puede ir a donde sea que los vientos de la aventura te lleven.
; FORCE
vehicle_DescDRAK_Corsair_PYAM_Exec=Fabricante: Drake Interplanetary\nEnfoque: Expedición\n\nEscucha el llamado del espacio inexplorado y aprovecha el espíritu de la exploración con la Drake Corsair. Utilizando un diseño único de casco asimétrico, esta exploradora versátil puede ir a donde sea que los vientos de la aventura te lleven. Esta variante presenta una pintura y una carga útil exclusivas para la nave.
; FORCE
vehicle_DescDRAK_Cutlass_Black=Fabricante: Drake Interplanetary\nEnfoque: Carga ligera / Caza mediano\n\nDrake Interplanetary afirma que la Cutlass Black es una solución de bajo coste y fácil mantenimiento para las unidades locales de milicia dentro del sistema. El compartimento de carga más grande de lo normal, el asiento RIO y el soporte dedicado para el rayo tractor son, según asegura la literatura de la compañía, para facilitar las operaciones de búsqueda y rescate.
; FORCE
vehicle_DescDRAK_Cutlass_Black_PYAM_Exec=Fabricante: Drake Interplanetary\nEnfoque: Carga ligera / Caza mediano\n\nDrake Interplanetary afirma que la Cutlass Black es una solución de bajo coste y fácil mantenimiento para las unidades locales de milicia dentro del sistema. El compartimento de carga más grande de lo normal, el asiento RIO y el soporte dedicado para el rayo tractor son, según asegura la literatura de la compañía, para facilitar las operaciones de búsqueda y rescate. Esta variante presenta una pintura y una carga útil exclusivas para la nave.
; FORCE
vehicle_DescDRAK_Cutlass_Black_ShipShowdown=Fabricante: Drake Interplanetary\nEnfoque: Carga ligera / Caza mediano\n\nDrake Interplanetary afirma que la Cutlass Black es una solución de bajo coste y fácil mantenimiento para las unidades locales de milicia dentro del sistema. El compartimento de carga más grande de lo normal, el asiento RIO y el soporte dedicado para el rayo tractor son, según asegura la literatura de la compañía, para facilitar las operaciones de búsqueda y rescate.
; FORCE
vehicle_DescDRAK_Cutlass_Steel=Fabricante: Drake Interplanetary\nEnfoque: Dropship\n\nCon la Cutlass Steel, Drake Interplanetary ha vuelto a reinventar su diseño clásico para crear una nave de transporte de combate de nueva generación mediante la adición de asientos plegables dedicados y un arsenal ampliado. Es un verso peligroso ahí fuera, y la Cutlass Steel está lista para abrirse camino a través de cualquier obstáculo que se interponga en tu camino y el de tu dedicado equipo.
; FORCE
vehicle_DescDRAK_Cutter=Fabricante: Drake Interplanetary\nEnfoque: Inicial / Explorador\n\nDiseñada para personas trabajadoras de todo tipo, la Cutter incluye 4 SCU de espacio de carga y un montón de pegada en un marco compacto y resistente. Es una nave que verdaderamente encarna el espíritu de Drake: que no importa quién seas o qué hagas, puedes alcanzar las estrellas.
; FORCE
vehicle_DescDRAK_Cutter_Scout=Fabricante: Drake Interplanetary\nEnfoque: Explorador\n\nReduciendo el robusto y compacto bastidor del Cutter a lo esencial, Drake tomó una nave ya impresionante y la transformó en la nave de exploración ideal. Con capacidades mejoradas de radar y escaneo, junto con mayor potencia y refrigeración, el Cutter Scout está listo para volar por delante del grupo.
; FORCE
vehicle_DescDRAK_Golem=Fabricante: Drake Interplanetary\nEnfoque: Inicial / Minería ligera\n\nCon la Golem, Drake diseñó la nave ideal para quienes desean iniciar una carrera en la minería. La nave cuenta con un láser de minería personalizado y la capacidad de transportar 32 SCU de valiosos recursos. Fiel al estilo clásico de Drake, la Golem es una nave diseñada con un propósito claro, priorizando la funcionalidad sobre los adornos.
; FORCE
vehicle_DescDRAK_Golem_Collector_Indust=Fabricante: Drake Interplanetary\nEnfoque: Inicial / Minería ligera\n\nCon la Golem, Drake diseñó la nave ideal para quienes desean iniciar una carrera en la minería. La nave cuenta con un láser de minería personalizado y la capacidad de transportar 32 SCU de valiosos recursos. Fiel al estilo clásico de Drake, la Golem es una nave diseñada con un propósito claro, priorizando la funcionalidad sobre los adornos.\n\nWikelo aquí. He hecho modificaciones útiles para que la nave sea aún más productiva. Te gustará.
; FORCE
vehicle_DescDRAK_Golem_OX=Fabricante: Drake Interplanetary\nEnfoque: Carga ligera\n \nCon la Golem OX, Drake ha transformado a esta fiable bestia de carga en la nave ideal para transportar suministros y equipo. Diseñada para pilotos que prefieren la funcionalidad antes que los adornos, la OX duplica la capacidad del modelo original con espacio para 64 SCU e incorpora un rayo tractor para que las transferencias de carga sean tan fluidas como la seda.
; FORCE
vehicle_DescDRAK_Golem_Teach=Fabricante: Drake Interplanetary\nEnfoque: Inicial / Minería ligera\n\nCon la Golem, Drake diseñó la nave ideal para quienes desean iniciar una carrera en la minería. La nave cuenta con un láser de minería personalizado y la capacidad de transportar 32 SCU de valiosos recursos. Fiel al estilo clásico de Drake, la Golem es una nave diseñada con un propósito claro, priorizando la funcionalidad sobre los adornos.\n\nAdaptándose a las duras condiciones de trabajo de Nyx, Teach's Ship Shop ha equipado esta edición especial con una configuración personalizada que incluye componentes resistentes para ayudarte a afrontar mejor el trabajo.
; FORCE
vehicle_DescDRAK_Ironclad_Assault=Fabricante: Drake Interplanetary\nEnfoque: Dropship\n \nCuando la entrega especial que tienes que hacer es una incursión a gran escala, necesitas el Drake Ironclad Assault. No solo puede albergar varios vehículos terrestres en su compartimento, sino que tiene torretas a lo largo de su parte inferior para despejar el camino para el aterrizaje, e incluso una bahía de fabricación para reparaciones de emergencia.
; FORCE
vehicle_DescDRAK_Mule=Fabricante: Drake Interplanetary\nEnfoque: Carga ligera\n\nEl Mule de seis ruedas de Drake es un caballo de batalla fiable para todo tipo de trabajos de carga y transporte. Ya sea transportando mercancías a través de terrenos accidentados o trasladándolas a naves más grandes y cubiertas de carga, el Mule lleva a cabo incluso los contratos más duros hasta el final. Simple y directo.
; FORCE
vehicle_DescESPR_Prowler=Fabricante: Esperia\nEnfoque: Dropship\n\nEl Prowler, que lleva el nombre de la designación militar de la UPE, es una versión modernizada de la infame nave de abordaje tevarin de la Primera Guerra Tevarin. La eficacia del Prowler como vehículo de despliegue rápido de personal se debió principalmente a su silencio. Con el Prowler, encontrarás la fusión perfecta de dos culturas: la elegancia y efectividad de la máquina de guerra tevarin combinada con la fiabilidad de la moderna tecnología UEE.
; FORCE
vehicle_DescESPR_Prowler_Utility=Fabricante: Esperia\nEnfoque: Carga ligera\n\nAunque no existen ejemplos conocidos de esta nave histórica fabricados por los tevarin, los historiadores de Esperia estudiaron informes de campo del ejército de la UPE para reconstruir este Prowler modificado. Utilizado por el ejército tevarin para entregar suministros urgentes en las líneas del frente, el Prowler Utility combina un rayo tractor con una bodega completamente accesible, junto con el armamento aún significativo de la nave de guerra, para convertir la transferencia de carga en condiciones de combate en una operación de precisión.
; FORCE
vehicle_DescESPR_Prowler_Utility_Collector_Indust=Fabricante: Esperia\nEnfoque: Carga ligera\n\nAunque no existen ejemplos conocidos de esta nave histórica fabricados por los tevarin, los historiadores de Esperia estudiaron informes de campo del ejército de la UPE para reconstruir este Prowler modificado. Utilizado por el ejército tevarin para entregar suministros urgentes en las líneas del frente, el Prowler Utility combina un rayo tractor con una bodega completamente accesible, junto con el armamento aún significativo de la nave de guerra, para convertir la transferencia de carga en condiciones de combate en una operación de precisión. \n\nWikelo aquí. He hecho modificaciones útiles para que la nave sea aún más productiva. Te gustará.
; FORCE
vehicle_DescGAMA_Syulen=Fabricante: Gatac Manufacture\nEnfoque: Inicial / Explorador\n\nLa nave de carga Syulen ha sido diseñada artísticamente por la renombrada Casa Gatac para adaptarse tanto a pilotos humanos como xi'an. Con un bastidor refinado y ágil, la Syulen es ideal para transportar entregas importantes a través del universo, o como la nave perfecta para quienes inician su carrera en el transporte.
; FORCE
vehicle_DescGAMA_Syulen_PYAM_Exec=Fabricante: Gatac Manufacture\nEnfoque: Inicial / Explorador\n\nLa nave de carga Syulen ha sido diseñada artísticamente por la renombrada Casa Gatac para adaptarse tanto a pilotos humanos como xi'an. Con un bastidor refinado y ágil, la Syulen es ideal para transportar entregas importantes a través del universo. Esta variante especial presenta una pintura y equipamiento exclusivos para la nave.
; FORCE
vehicle_DescGRIN_MTC=Fabricante: Greycat Industrial\nEnfoque: Explorador\n\nComo experto en operaciones industriales, Greycat entiende que la seguridad en el lugar de trabajo es una parte vital de cualquier empresa exitosa. No solo eso, sino que, para ser completamente efectivo, necesitas poder transportar a tu personal de seguridad y su equipo a donde más se les necesita. Por eso, el MTC Mobile Tactical Center es una adición tan importante para tu próximo proyecto. Lo suficientemente ágil para acceder al terreno difícil que se encuentra en operaciones remotas y equipado con suficientes casilleros para trajes, estantes para armas y almacenamiento para enfrentar una amplia gama de problemas, el Greycat MTC podría marcar la diferencia a la hora de convertir un problema potencial en una ganancia potencial.
; FORCE
vehicle_DescGRIN_PTV=Fabricante: Greycat Industrial\nEnfoque: Pasajero\n\nEl Greycat PTV es un buggy simple y práctico que se utiliza con frecuencia para reducir los tiempos de desplazamiento en grandes hangares o puestos de avanzada.
; FORCE
vehicle_DescGRIN_ROC=Fabricante: Greycat Industrial\nEnfoque: Minería ligera\n\nCentrándose en lo esencial de la minería terrestre, Greycat Industrial diseñó su incansable y directo ROC (Remote Ore Collector) para complementar a los mineros que lo utilizan. Desde su brazo minero con cardán de precisión hasta sus ruedas todoterreno, este vehículo para un solo operador demuestra lo importante que es tener la herramienta adecuada para el trabajo.
; FORCE
vehicle_DescGRIN_ROC_DS=Fabricante: Greycat Industrial\nEnfoque: Minería ligera\n\nCentrándose en lo esencial de la minería terrestre, Greycat Industrial diseñó su incansable y directo ROC-DS (Remote Ore Collector Dual Seat) para permitir que las parejas de mineros hagan más mientras están sobre el terreno. El ROC-DS eleva el nivel de la minería terrestre al añadir mayor capacidad de carga y un segundo asiento para operar el brazo minero con cardán de precisión. Greycat incluso mejoró la cabina del conductor con un recinto protector para permitir excursiones más largas en condiciones adversas. Con el ROC-DS, los equipos de minería ahora tienen la herramienta adecuada para recolectar más mineral con comodidad.
; FORCE
vehicle_DescGRIN_STV=Fabricante: Greycat Industrial\nEnfoque: Pasajero\n\nPrepárate para divertirte de verdad en el trabajo con el STV de Greycat. Este vehículo deportivo todoterreno ha sido construido por profesionales para profesionales y ofrece una velocidad asombrosa y almacenamiento integrado muy práctico.
; FORCE
vehicle_DescGrin_MDC=Fabricante: Greycat Industrial\nEnfoque: Antiaéreo\n \nA partir de un armazón industrial robusto y resistente, Greycat ha creado el MDC Mobile Defense Center, un vehículo de combate eficaz listo para proteger tus intereses, desde zonas mineras remotas hasta patrullas en centros de procesamiento de alto valor, gracias a su torreta PDS montada.
; FORCE
vehicle_DescKRIG_P72_Archimedes=Fabricante: Kruger Intergalactic\nEnfoque: Carreras\n\nYa sea para mayor seguridad, explorar un sistema o simplemente por el placer de volar, la nave de corto alcance P-72 Archimedes de Kruger Intergalactic fue diseñada para ofrecer un manejo excepcional y una aceleración ágil en un paquete elegante y con estilo.
; FORCE
vehicle_DescKRIG_P72_Archimedes_Emerald=Fabricante: Kruger Intergalactic\nEnfoque: Carreras\n\nYa sea para mayor seguridad, explorar un sistema o simplemente por el placer de volar, la nave de corto alcance Kruger Intergalactic P-72 Archimedes fue diseñada para ofrecer un manejo excepcional y una aceleración ágil en un paquete elegante y con estilo.  La edición limitada Emerald presenta una pintura especial "de la suerte".
; FORCE
vehicle_DescMISC_Fortune=Fabricante: MISC\nEnfoque: Recuperación ligera\n\nPara quienes están listos para llevar su profesión al siguiente nivel, los ingenieros de MISC han diseñado cuidadosamente la Fortune como una nave de reclamación pequeña líder en su categoría. Equipada con un brazo de recuperación versátil y un elevador de carga, la MISC Fortune está construida desde la estructura para convertir la chatarra en tesoros.\n
; FORCE
vehicle_DescMISC_Fortune_Teach=Fabricante: MISC\nEnfoque: Recuperación ligera\n\nPara quienes están listos para llevar su profesión al siguiente nivel, los ingenieros de MISC han diseñado cuidadosamente la Fortune como una nave de reclamación pequeña líder en su categoría. Equipada con un brazo de recuperación versátil y un elevador de carga, la MISC Fortune está construida desde la estructura para convertir la chatarra en tesoros.\n\nAdaptándose a las duras condiciones de trabajo de Nyx, Teach's Ship Shop ha equipado esta edición especial con una configuración personalizada que incluye componentes resistentes para ayudarte a afrontar mejor el trabajo.
; FORCE
vehicle_DescMISC_Freelancer=Fabricante: MISC\nEnfoque: Carga ligera\n\nLas grandes corporaciones utilizan los Freelancer como naves mercantes de largo recorrido, pero capitanes independientes que desean operar en los márgenes de la galaxia los reutilizan con la misma frecuencia como naves de exploración dedicadas.
; FORCE
vehicle_DescMISC_Hull_A=Fabricante: MISC\nEnfoque: Carga ligera\n\nEl Hull más pequeño y asequible. El Hull A es ideal para quienes simplemente se aventuran solos en la galaxia. El Hull A es más similar al Aurora y al Mustang, pero carece de la naturaleza de "experto en todos los oficios". Mientras que los demás intercambian capacidad de carga por potencia de fuego o velocidad, el Hull A es 100% transporte de misión.
; FORCE
vehicle_DescMISC_Prospector=Fabricante: MISC\nEnfoque: Minería ligera\n\nDurante años, la Prospector ha sido la nave de minería preferida del universo para los operadores en solitario. Con el característico diseño estilizado de MISC y un conjunto de avanzadas herramientas de minería mejoradas, la Prospector 2947 equilibra a la perfección forma y funcionalidad.
; FORCE
vehicle_DescMISC_Prospector_Collector_Indust=Fabricante: MISC\nEnfoque: Minería ligera\n\nDurante años, la Prospector ha sido la nave de minería preferida del universo para los operadores en solitario. Con el característico diseño estilizado de MISC y un conjunto de avanzadas herramientas de minería mejoradas, la Prospector 2947 equilibra a la perfección forma y funcionalidad. \n\nWikelo aquí. He hecho modificaciones útiles para que la nave sea aún más productiva. Te gustará.
; FORCE
vehicle_DescMISC_Razor_LX=Fabricante: Mirai\nEnfoque: Carreras\n\nLa Razor se sobrealimenta. La LX cuenta con un motor sobreoptimizado para alcanzar velocidades máximas increíbles. Esta potencia tiene un coste en maniobrabilidad y armamento reducidos, lo que la hace ideal para carreras directas. Pero, ¿quién necesita armas cuando estás dejando a tu competencia en el polvo?
; FORCE
vehicle_DescMISC_Reliant=Fabricante: MISC\nEnfoque: Inicial / Carga ligera\n\nCon la Reliant Kore, MISC añade a su ya impresionante línea de naves una nave espacial más pequeña de clase introductoria. Utilizando avanzados diseños xi'an, la Reliant presenta alas amplias y elegantes, propulsores omnidireccionales y una cabina de dos asientos totalmente articulada que admite modos de vuelo horizontal y vertical. Todo esto se combina con una mayor capacidad de carga que muchas naves de su clase para hacer de la Kore una opción natural para transporte de corto alcance, o, con la simple adición de algunos componentes opcionales, esta nave todoterreno puede hacer cualquier cosa que sueñes.
; FORCE
vehicle_DescMISC_Starlancer_MAX_Collector_Indust,P=Fabricante: MISC\nEnfoque: Carga media\n \nPara quienes buscan expandir sus operaciones de transporte, los ingenieros de MISC han mejorado la Starlancer MAX con un compartimento de carga extra espacioso, listo para transportar mercancías y vehículos. Combinado con cómodas instalaciones para viajes largos y un paquete defensivo completo para cuando te desvías de la ruta principal, es fácil ver por qué la Starlancer MAX es la nave de carga preferida por pilotos industriosos en todo el 'verso.
; FORCE
vehicle_DescMISC_Starlancer_TAC_Collector_Military=Fabricante: MISC\nEnfoque: Cañonera\n \nPara quienes buscan una nave versátil que pueda valerse por sí sola en combate, los ingenieros han mejorado la Starlancer TAC con un paquete ofensivo agresivo, lista para enfrentarse a los enemigos más feroces. Cuando aceptas un trabajo de alto riesgo y alta recompensa, la Starlancer TAC está ahí para asegurarse de que tú y tu tripulación puedan completarlo hasta el final.\n\nWikelo aquí. He hecho modificaciones útiles para que la nave sea aún más parecida a un caza. Muy impresionante.
; FORCE
vehicle_DescMRAI_Guardian=Fabricante: Mirai\nEnfoque: Caza pesado\n\nAdoptando el adagio de que la mejor defensa es un buen ataque, los ingenieros de Mirai han aportado su experiencia en rendimiento y maniobrabilidad al caza de largo alcance Guardian.  Vuela en círculos alrededor de tus oponentes con el Mirai Guardian mientras estableces tu superioridad espacial. \n
; FORCE
vehicle_DescMRAI_Guardian_Collector_Military=Fabricante: Mirai\nEnfoque: Caza pesado\n\nAdoptando el adagio de que la mejor defensa es un buen ataque, los ingenieros de Mirai han aportado su experiencia en rendimiento y maniobrabilidad al caza de largo alcance Guardian.  Vuela en círculos alrededor de tus oponentes con el Mirai Guardian mientras estableces tu superioridad espacial. \n\nWikelo aquí. He hecho modificaciones útiles para que la nave sea mucho más parecida a un caza. Muy impresionante.
; FORCE
vehicle_DescMisc_Fury_Miru=Fabricante: Mirai\nEnfoque: Caza de corto alcance\n\nCon la mejor maniobrabilidad de su clase y tecnología xi'an de vanguardia totalmente integrada, el bombardero de corto alcance Fury MX de próxima generación de Mirai utiliza sus veinte misiles montados en halo para devastar objetivos durante el combate espacial de corto alcance.
; FORCE
vehicle_DescORIG_100i=Fabricante: Origin Jumpworks\nEnfoque: Inicial / Explorador\n\nRecorre el universo con la combinación perfecta de lujo y rendimiento. El 100i cuenta con el sistema de combustible AIR patentado de Origin Jumpworks, lo que lo convierte en la nave más eficiente y ecológica del mercado. Capaz de realizar vuelos de larga distancia para los que la mayoría de las naves de su tamaño no están equipadas, el 100i es perfecto para pilotos solitarios que buscan llamar la atención sin sacrificar la funcionalidad o la fiabilidad.
; FORCE
vehicle_DescORIG_125a=Fabricante: Origin Jumpworks\nEnfoque: Caza ligero\n\nLos riesgos están hechos para tomarse, pero ¿por qué arriesgarse a quedarse sin combustible en plena batalla? Con el sistema de combustible AIR, un paquete de armas mejorado y todo el lujo y refinamiento que esperas de Origin Jumpworks, el 125a ha sido diseñado para el inconformista exigente.
; FORCE
vehicle_DescORIG_135c=Fabricante: Origin Jumpworks\nEnfoque: Carga ligera\n\nCon una cantidad engañosa de espacio de almacenamiento en su elegante y estilizado bastidor, y el sistema de combustible AIR patentado de Origin, el modelo 135c es la opción obvia para músicos, mensajeros y cualquiera que intente comenzar la fiesta. Llévalo allí rápido, y luce bien mientras lo haces.
; FORCE
vehicle_DescORIG_300i=Fabricante: Origin Jumpworks\nEnfoque: Turismo de lujo\n\nSi vas a viajar por las estrellas... ¿por qué no hacerlo con estilo? El 300i es la principal nave espacial de lujo de Origin Jumpworks. Es un asesino plateado y elegante que envía tanto mensaje con su silueta como con sus cañones de partículas.
; FORCE
vehicle_DescORIG_325a=Fabricante: Origin Jumpworks\nEnfoque: Interceptor\n\nEl hecho de que sea una galaxia accidentada no significa que debas sacrificar tu comodidad: el 325a puede salir victorioso en cualquier combate aéreo. El 325a presenta una carga útil de armas avanzada, así como un sistema de orientación personalizado diseñado especialmente para el 325a por WillsOp.
; FORCE
vehicle_DescORIG_400i=Fabricante: Origin Jumpworks\nEnfoque: Expedición\n\nExplorar las estrellas es un esfuerzo muy noble, y Origin Jumpworks ha estado a la altura de las circunstancias al crear el explorador de alto rendimiento 400i. Con un alcance líder en su clase, importantes capacidades defensivas y un sistema de escaneo equipado de fábrica, el 400i está listo para enfrentarse a los rincones más duros de la galaxia manteniendo la comodidad y la elegancia por las que Origin es conocida.
; FORCE
vehicle_DescORIG_600i=Fabricante: Origin Jumpworks\nEnfoque: Expedición\n\nEsta embarcación de lujo multifunción de Origin Jumpworks presenta un diseño de casco exquisitamente detallado que equilibra rendimiento y versatilidad en una forma elegante y atemporal. El 600i está diseñado con una tecnología modular de vanguardia, lo que te permite personalizar tu nave según tus necesidades.
; FORCE
vehicle_DescORIG_600i_2951_BIS=Fabricante: Origin Jumpworks\nEnfoque: Expedición\n\nEsta embarcación de lujo multifunción de Origin Jumpworks presenta un diseño de casco exquisitamente detallado que equilibra rendimiento y versatilidad en una forma elegante y atemporal. El 600i está diseñado con una tecnología modular de vanguardia, lo que te permite personalizar tu nave según tus necesidades. Para celebrar que el 600i ha sido elegido finalista del Best in Show de 2951, esta edición de la nave presenta una pintura especial azul y negra ya aplicada.
; FORCE
vehicle_DescORIG_600i_Touring=Fabricante: Origin Jumpworks\nEnfoque: Turismo de lujo\n\nEsta embarcación de lujo multifunción de Origin Jumpworks presenta un diseño de casco exquisitamente detallado que equilibra rendimiento y versatilidad en una forma elegante y atemporal. El 600i está diseñado con una tecnología modular de vanguardia, lo que te permite personalizar tu nave según tus necesidades.
; FORCE
vehicle_DescORIG_890Jump=Fabricante: Origin Jumpworks\nEnfoque: Turismo de lujo\n\nCon un exterior elegante y estilizado que contradice su espacioso interior, el 890 Jump es una verdadera maravilla de la ingeniería; diseñado para impresionar desde todos los ángulos combinando un diseño único e innovador con los mejores materiales y la tecnología más avanzada. El resultado es una nave única en su clase, una obra maestra digna del nombre Origin.
; FORCE
vehicle_DescORIG_X1=Fabricante: Origin Jumpworks\nEnfoque: Pasajero\n\nBienvenido al siguiente nivel con el X1, el vehículo de cabina abierta de alto rendimiento de Origin Jumpworks. Construido con polímeros ligeros, el X1 lleva la velocidad y la agilidad al siguiente nivel gracias a la tecnología de motor perfectamente integrada y a la disposición conjunta de los propulsores vectoriales. El diseño innovador y la ingeniería de alta calidad se entrelazan para crear una experiencia de vuelo como ninguna otra.
; FORCE
vehicle_DescORIG_X1_Force=Fabricante: Origin Jumpworks\nEnfoque: Pasajero\n\nConstruida para soportar entornos más duros y lucir bien al hacerlo, la X1 Force es una versión modificada del modelo X1 base que presenta elementos defensivos adicionales para fortalecer esta veloz y ágil moto de cabina abierta, lo que le permite servir en una variedad de roles, desde explorar mundos hasta posibles operaciones de infiltración de seguridad.
; FORCE
vehicle_DescRSI_Aurora_ES=Fabricante: RSI\nEnfoque: Inicial / Explorador\n\nLa Aurora es la descendiente moderna de la nave espacial X-7 de Roberts Space Industries, que probó los primeros motores de salto. Utilitaria al cien por cien, la Aurora es la nave perfecta para principiantes: lo que le falta en estilo lo compensa con un amplio espacio para módulos de mejora.
; FORCE
vehicle_DescRSI_Aurora_MR=Fabricante: RSI\nEnfoque: Inicial / Caza ligero\n\n¿Quizás estás buscando algo que ofrezca capacidad de carga pero también capacidades de combate? La Aurora Marque viene con un par de láseres de calidad Behring y un sistema de refrigeración de armas de alta calidad.
; FORCE
vehicle_DescRSI_Aurora_Mk2=Fabricante: Roberts Space Industries\nEnfoque: Inicial / Carga ligera\n \nUna nueva interpretación de la nave clásica, Roberts Space Industries ha reinventado la probada Aurora desde su estructura. Presentamos la Aurora Mk II. Todo, desde el rendimiento de la nave y su usabilidad hasta su diseño, ha sido renovado pensando en una nueva generación de pilotos. Además, esta última versión introduce una nueva característica en la serie Aurora: módulos intercambiables. En lugar de limitar a los pilotos a una única trayectoria profesional, estos módulos permiten una especialización operativa sencilla desde la comodidad de tu hangar. Tanto si eres propietario de tu primera nave como si eres un piloto veterano listo para mejorar tu nave de uso diario, la Aurora Mk II te está esperando.
; FORCE
vehicle_DescRSI_Constellation_Phoenix=Fabricante: RSI\nEnfoque: Turismo de lujo\n\nUna nave espacial de lujo dedicada para el capitán estelar más exigente. La Constellation Phoenix puede operar como nave de mando de una organización y cuenta con un interior lujosamente rediseñado. Incluye un compartimento oculto con supresión de sensores para tu carga más valiosa. La Phoenix viene con un rover Lynx y un caza Kruger P-72 Archimedes.
; FORCE
vehicle_DescRSI_Constellation_Phoenix_Emerald=Fabricante: RSI \nEnfoque: Turismo de lujo\n\nYa seas un sofisticado amante de la vida social o un fiestero empedernido, la Constellation Phoenix Emerald es tu pasaporte personal al entretenimiento. Con una lujosa cabina interior diseñada específicamente para la diversión y una pintura de edición limitada "de la suerte", la Emerald es el lugar perfecto para saborear una copa de Radegast Gold o disfrutar de una Sleeping Tiger Malt verde mientras viajas con lujo por las estrellas. Solo asegúrate de traer un piloto designado.
; FORCE
vehicle_DescRSI_Hermes=Fabricante: Roberts Space Industries\nEnfoque: Carga media\n\nA diferencia de su homónimo mitológico, la RSI Hermes no es ninguna embaucadora: realmente es así de rápida. Con un paquete de propulsores a medida e innovador, un impresionante conjunto de medidas defensivas y una bodega de carga de gran tamaño, la Hermes está lista para acelerar las entregas hasta sus destinos finales. Incluso en puntos de entrega peligrosos a los que otras cargueras no se atreverían a ir.
; FORCE
vehicle_DescRSI_Lynx=Fabricante: RSI\nEnfoque: Turismo de lujo\n\nRSI diseñó el Lynx Rover para que sea un vehículo capaz de explorar una amplia variedad de terrenos y al mismo tiempo ofrecer una experiencia de conducción de primer nivel y optimizada.
; FORCE
vehicle_DescRSI_Perseus=Fabricante: RSI\nEnfoque: Cañonera pesada\n\nCuando RSI se propuso hacer la declaración moderna definitiva en prevención persuasiva, miraron hacia su propio pasado, a las históricas cañoneras designadas Perseus. Capaz de destrozar goliats de clase subcapital, la mera presencia de una cañonera Perseus en un escuadrón de bloqueo o patrulla es suficiente para hacer que tus enemigos más agresivos se lo piensen dos veces antes de atacar, al igual que su homónimo clásico.
; FORCE
vehicle_DescRSI_Scorpius_Antares=Fabricante: RSI\nEnfoque: Caza pesado\n\nRSI ha actualizado la característica configuración de bi-ala adaptable del Scorpius y ha añadido un Amortiguador Cuántico y un Dispositivo EMP a medida diseñados exclusivamente por su equipo interno para crear el poderoso Scorpius Antares. Construido pensando en la potencia de frenado, el Scorpius Antares está diseñado para llevar cualquier persecución a un final rápido.
; FORCE
vehicle_DescRSI_Ursa_Rover=Fabricante: RSI\nEnfoque: Explorador\n\nConstruido por RSI específicamente para el explorador planetario, el Ursa Rover ofrece a los civiles capacidades todoterreno de grado militar y se erige como el estándar resistente en aplicaciones terrestres de exploración, mapeo y descubrimiento.
; FORCE
vehicle_DescRSI_Ursa_Rover_Emerald=Fabricante: RSI\nEnfoque: Explorador\n\nLa fortuna favorece a los audaces. El nombre más fiable en la exploración todoterreno encarna la esencia de la buena fortuna y el éxito con este Ursa Rover conmemorativo de edición limitada.
; FORCE
vehicle_DescRSI_Zeus_ES=Fabricante: Roberts Space Industries\nEnfoque: Expedición\n\nListo para transportar a toda una nueva generación de viajeros a través del universo, Roberts Space Industries se enorgullece de presentar una nave espacial que lleva ocho siglos en desarrollo: la nueva nave Zeus Mk II. Rindiendo homenaje al diseño clásico que lanzó a la humanidad a las estrellas en 2140, el Zeus Mk II ha sido actualizado para superar los estándares modernos, manteniendo el corazón de este querido ícono espacial.  Con un enfoque en la exploración, la edición Zeus Mk II ES presenta un robusto paquete de radar para descubrir nuevos hallazgos, y armamento y escudos mejorados para ayudar a regresar a casa.\n
; FORCE
vehicle_DescRSI_Zeus_ES_Collector_Indust,P=Fabricante: Roberts Space Industries\nEnfoque: Expedición\n\nListo para transportar a toda una nueva generación de viajeros a través del universo, Roberts Space Industries se enorgullece de presentar una nave espacial que lleva ocho siglos en desarrollo: la nueva nave Zeus Mk II. Rindiendo homenaje al diseño clásico que lanzó a la humanidad a las estrellas en 2140, el Zeus Mk II ha sido actualizado para superar los estándares modernos, manteniendo el corazón de este querido ícono espacial.  Con un enfoque en la exploración, la edición Zeus Mk II ES presenta un robusto paquete de radar para descubrir nuevos hallazgos, y armamento y escudos mejorados para ayudar a regresar a casa.
; FORCE
vehicle_DescTMBL_Cyclone=Fabricante: Tumbril Land Systems\nEnfoque: Pasajero\n\nCon una potente combinación de velocidad, maniobrabilidad y robusta durabilidad, el Cyclone es una opción perfecta para entregas locales y transporte entre granjas y puestos de avanzada planetarios.
; FORCE
vehicle_DescTMBL_Cyclone_AA=Fabricante: Tumbril Land Systems \nEnfoque: Antiaéreo\n\nUn ecualizador en el campo de batalla, el Cyclone AA viene equipado con un misil tierra-aire y un paquete de contramedidas para proporcionar cobertura a las tropas terrestres contra objetivos aéreos.
; FORCE
vehicle_DescTMBL_Cyclone_MT=Fabricante: Tumbril Land Systems \nEnfoque: Antiaéreo\n\nSiguiendo el éxito del lanzamiento inicial del Cyclone, Tumbril ha tenido en cuenta tus comentarios y ha expandido su popular línea de vehículos tácticos con el totalmente nuevo Cyclone MT. Equipado con una combinación de torreta de cañón y misiles, este módulo ofrece opciones de combate aumentadas en el campo.
; FORCE
vehicle_DescTMBL_Cyclone_RN=Fabricante: Tumbril Land Systems \nEnfoque: Explorador\n\nMantente móvil y alerta con el Cyclone RN. Este vehículo ligero de reconocimiento es la solución perfecta para carreras de reconocimiento, proporcionando exploraciones rápidas y detalladas del terreno, así como la colocación de balizas.
; FORCE
vehicle_DescTMBL_Cyclone_TR=Fabricante: Tumbril Land Systems \nEnfoque: Antivehículo\n\nDiseñado para uso militar y de seguridad, el módulo Cyclone TR cuenta con una armadura mejorada y una torreta operada por un humano capaz de montar un arma de Tamaño 1 y un campo de fuego responsivo de 360°.
; FORCE
vehicle_DescTMBL_Nova=Fabricante: Tumbril Land Systems\nEnfoque: Tanque pesado\n\nEl nuevo Nova de Tumbril es un guerrero de campo de batalla clásico, reinventado para la era moderna. Este tanque pesado ofrece una combinación devastadora de armamento para eliminar amenazas en tierra y en el aire.
; FORCE
vehicle_DescTMBL_Storm=Fabricante: Tumbril Land Systems\nEnfoque: Tanque ligero\n \nIntroducido originalmente en 2606 durante la Segunda Guerra Tevarin, el minitanque de un solo operador Tumbril Storm fue construido para arrasar campos de batalla y eliminar la artillería enemiga. Reinventado desde cero para ser más rápido, más fuerte y más impactante que nunca, el último Storm es una verdadera fuerza de la naturaleza, muy adaptado al paisaje frenético de la guerra moderna.
; FORCE
vehicle_DescTMBL_Storm_AA=Fabricante: Tumbril Land Systems\nEnfoque: Tanque ligero\n\nIntroducido originalmente en 2606 durante la Segunda Guerra Tevarin, el minitanque de un solo operador Tumbril Storm fue construido para arrasar campos de batalla y eliminar la artillería enemiga. Reinventado desde cero para ser más rápido, más fuerte y más impactante que nunca, el Storm AA es una verdadera fuerza de la naturaleza, equipado con una lluvia de misiles para proporcionar cobertura contra objetivos aéreos y terrestres.
; FORCE
vehicle_NameRSI_Aurora_CL_short=Aurora CL
; FORCE
vehicle_NameRSI_Aurora_ES_short=Aurora ES
; FORCE
vehicle_NameRSI_Aurora_LN_short=Aurora LN
; FORCE
vehicle_NameRSI_Aurora_LX_short=Aurora LX
; FORCE
vehicle_descMISC_Starlancer_MAX=Fabricante: MISC\nEnfoque: Carga media\n \nPara quienes buscan expandir sus operaciones de transporte, los ingenieros de MISC han mejorado la Starlancer MAX con un compartimento de carga extra espacioso, listo para transportar mercancías y vehículos. Combinado con cómodas instalaciones para viajes largos y un paquete defensivo completo para cuando te desvías de la ruta principal, es fácil ver por qué la Starlancer MAX es la nave de carga preferida por pilotos industriosos en todo el 'verso.
; FORCE
vehicle_descMISC_Starlancer_TAC=Fabricante: MISC\nEnfoque: Cañonera\n \nPara quienes buscan una nave versátil que pueda valerse por sí sola en combate, los ingenieros han mejorado la Starlancer TAC con un paquete ofensivo agresivo, lista para enfrentarse a los enemigos más feroces. Cuando aceptas un trabajo de alto riesgo y alta recompensa, la Starlancer TAC está ahí para asegurarse de que tú y tu tripulación puedan completarlo hasta el final.
; FORCE
Foxwell_DefendDestructibleEntites_E_Desc_001=¿Algún piloto disponible en la zona? Necesitamos protección en <EM4>~mission(Location|Address)</EM4> para un cliente. Una banda de forajidos lleva atacando sus <EM4>~mission(Objects)</EM4> y, si no se hace nada al respecto, van a causar daños serios. Necesitamos a alguien que proteja la propiedad del cliente lo máximo posible y se ocupe de esos matones.\n\nPor la información que hemos podido reunir, estos matones son de poca monta, pero pueden hacer pupa si no andas con ojo. Así que, si lo manejas según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (condicional)</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n\n<EM4>Reputación: +100 Foxwell Enforcement (General)</EM4>\n\n<EM4>Condición:</EM4> Este título lo comparten variantes en varios sistemas. Solo otorgan planos los contratos en el sistema Stanton; las variantes en Nyx y Pyro no conceden recompensa de planos. Comprueba el sistema de destino.
; FORCE
Foxwell_DefendDestructibleEntites_H_Desc_001=Uno de nuestros clientes de alta prioridad está siendo atacado por una banda criminal que ataca sus <EM4>~mission(Objects)</EM4> en <EM4>~mission(Location|Address)</EM4>. Los activos del cliente son valiosos, así que tenemos que mantenerlos a salvo a toda costa, pero no te voy a engañar: va a ser un reto y medio con estos matones decididos a hacer daños serios. \n\nSi fuera yo, no dudaría en <EM>llevar refuerzos</EM4> para encargarme de ellos. No son ninguna broma, así que ofrecemos unos bien merecidos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal que se encargue de estos tipos con éxito. \n\nMucha suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (condicional)</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n\n<EM4>Reputación: +200 Foxwell Enforcement (General)</EM4>\n\n<EM4>Condición:</EM4> Este título lo comparten variantes en varios sistemas. Solo otorgan planos los contratos en el sistema Stanton; las variantes en Nyx y Pyro no conceden recompensa de planos. Comprueba el sistema de destino.
; FORCE
Foxwell_DefendDestructibleEntites_M_Desc_001=Espero que puedas prestar servicios de protección en <EM4>~mission(Location|Address)</EM4>. Uno de nuestros clientes de alta prioridad está teniendo serios problemas con una banda de forajidos que ataca sus ~mission(Objects). Hay que mantener los activos lo más a salvo e intactos posible. El cliente espera el servicio por el que paga, así que no la cagues o podríamos perder a un cliente fiel.\n\nDe momento, todavía estamos un poco a oscuras con estos forajidos, pero si lo manejas según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (condicional)</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n\n<EM4>Reputación: +150 Foxwell Enforcement (General)</EM4>\n\n<EM4>Condición:</EM4> Este título lo comparten variantes en varios sistemas. Solo otorgan planos los contratos en el sistema Stanton; las variantes en Nyx y Pyro no conceden recompensa de planos. Comprueba el sistema de destino.
; FORCE
Foxwell_DefendDestructibleEntites_S_Desc_001=Acaba de entrar un contrato de emergencia sobre una banda de matones violentos sembrando el caos en las infraestructuras de uno de nuestros clientes VIP. Si estás disponible, necesitamos que corras a <EM4>~mission(Location|Address)</EM4> y defiendas los <EM4>~mission(Objects)</EM4> extremadamente valiosos del cliente a toda costa. \n\nFoxwell conoce muy bien a este grupo, así que créeme cuando te digo que estos pilotos no son para tomarse a la ligera. Te recomiendo encarecidamente que organices una <EM>fuerza de apoyo altamente competente</EM> que vuele contigo hasta el lugar.\n\nSi consigues sobrevivir al encuentro con la propiedad del cliente intacta, sumamos <EM4>~mission(ScripAmount) MG Scrip</EM4> a cualquier contratista principal lo bastante valiente como para aceptar este trabajo. \n\nMantente a salvo, y buena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (condicional)</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n\n<EM4>Reputación: +300 Foxwell Enforcement (General)</EM4>\n\n<EM4>Condición:</EM4> Este título lo comparten variantes en varios sistemas. Solo otorgan planos los contratos en el sistema Stanton; las variantes en Nyx y Pyro no conceden recompensa de planos. Comprueba el sistema de destino.
; FORCE
Foxwell_DefendDestructibleEntites_VE_Desc_001=Atención a todos los pilotos: uno de nuestros clientes busca protección para sus <EM4>~mission(Objects)</EM4>, situados en <EM4>~mission(Location|Address)</EM4>. Por lo que hemos podido recoger, los atacantes son un grupo de aspirantes a forajidos pesados que probablemente no se han dado cuenta del valor de los activos que intentan destruir, simplemente sembrando el caos por hacerlo. Aun así, la propiedad del cliente es importante, así que hay que mantenerla lo más intacta posible.\n\nSi te encargas de ellos según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (condicional)</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n\n<EM4>Reputación: +100 Foxwell Enforcement (General)</EM4>\n\n<EM4>Condición:</EM4> Este título lo comparten variantes en varios sistemas. Solo otorgan planos los contratos en el sistema Stanton; las variantes en Nyx y Pyro no conceden recompensa de planos. Comprueba el sistema de destino.
; FORCE
Foxwell_DefendDestructibleEntites_VH_Desc_001=Apoyo urgente de naves necesario en <EM4>~mission(Location|Address)</EM4>. Una conocida organización criminal destructiva lleva meses tanteando el terreno con la propiedad de uno de nuestros clientes, y ahora ha montado un infierno atacando los <EM4>~mission(Objects)</EM4> del cliente. Estos activos son muy valiosos, así que hay que mantenerlos a salvo a toda costa, aunque sabemos que no será nada fácil.\n\nNo puedo enfatizar lo suficiente lo peligrosos que son estos tipos, así que no dudaría en <EM>llevar refuerzos</EM> para encargarme de ellos. Si tú y los activos salís intactos, ofrecemos unos bien merecidos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal. \n\nMucha suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (condicional)</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n\n<EM4>Reputación: +250 Foxwell Enforcement (General)</EM4>\n\n<EM4>Condición:</EM4> Este título lo comparten variantes en varios sistemas. Solo otorgan planos los contratos en el sistema Stanton; las variantes en Nyx y Pyro no conceden recompensa de planos. Comprueba el sistema de destino.
; FORCE
Foxwell_DefendEntitesAndEscort_E_Desc,P=Necesitamos un contratista que preste servicios de convoy y protección en <EM4>~mission(Location|Address)</EM4>. Uno de nuestros clientes de élite está siendo atacado por una banda de forajidos que ataca sus <EM4>~mission(Objects) y naves</EM4>. Tendrás que mantener a la tripulación a salvo mientras atraviesa la zona, y asegurarte además de que los activos sigan intactos. Estos matones parecen capaces de hacer daños serios, así que asegúrate de enfrentarlos con cautela o el cliente podría no ser el único en sufrir grandes pérdidas.\n\nSi lo manejas según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> como compensación al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendEntitesAndEscort_H_Desc,P=La tripulación que gestiona las operaciones de uno de nuestros clientes en <EM4>~mission(Location|Address)</EM4> ha informado de que están siendo atacados por una banda criminal que ataca las <EM4>~mission(Objects) y naves</EM4> de la zona. Tu trabajo será mantener a ambos a salvo a toda costa. Aún no tengo todos los datos, pero supongo que será una misión dura: estos forajidos parecen decididos a montar una buena carnicería. \n\nSi fuera yo, <EM4>llevaría refuerzos</EM4> para encargarme de ellos. Y si consigues proteger a todos, ofrecemos unos bien merecidos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal que se encargue con éxito de estos miserables. \n\nMucha suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendEntitesAndEscort_M_Desc,P=Necesitamos un contratista que preste servicios de convoy y protección en <EM4>~mission(Location|Address)</EM4>. Uno de nuestros clientes de élite está siendo atacado por una banda de forajidos que ataca sus <EM4>~mission(Objects) y naves</EM4>. Tendrás que mantener a la tripulación a salvo mientras atraviesa la zona, y asegurarte además de que los activos sigan intactos. Estos matones parecen capaces de hacer daños serios, así que asegúrate de enfrentarlos con cautela o el cliente podría no ser el único en sufrir grandes pérdidas.\n\nSi lo manejas según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> como compensación al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendEntitesAndEscort_S_Desc,P=Acaba de llegar un SOS de emergencia de una tripulación de mantenimiento al servicio de uno de los clientes VIP de Foxwell. Si estás disponible, te urgimos a llegar a <EM4>~mission(Location|Address)</EM4> lo antes posible. Mientras te enfrentas a los atacantes, deberás proteger los <EM4>~mission(Objects) del cliente y cualquiera de sus naves que pueda necesitar ayuda</EM4>. \n\nNo es ni de lejos la primera vez que vemos a estos forajidos en concreto, así que créeme cuando te digo que estos pilotos no son para tomarse a la ligera. Te recomiendo encarecidamente que organices una <EM>fuerza de apoyo altamente competente</EM> que vuele contigo hasta el lugar.\n\nSi consigues defender con éxito los intereses del cliente, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> como compensación al contratista principal lo bastante valiente como para aceptar este trabajo. \n\nMantente a salvo, y buena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendEntitesAndEscort_VE_Desc,P=Atención a cualquier piloto en la zona: un grupo de bandidos está atacando a uno de nuestros clientes en <EM4>~mission(Location|Address)</EM4>, en concreto sus <EM4>~mission(Objects)</EM4> y las naves de mantenimiento que los gestionan. Por nuestra información, son solo unos pocos forajidos intentando ganar unos créditos rápidos, pero también son del tipo que causa daños serios si te metes en su camino.\n\nSi te encargas de ellos y reubicas la nave y la tripulación del cliente con seguridad, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendEntitesAndEscort_VH_Desc,P=Ayuda urgente a naves necesaria en <EM4>~mission(Location|Address)</EM4>. Una banda de forajidos criminales destructivos que llevan tiempo intentando hacerse un nombre ha golpeado con fuerza a uno de nuestros clientes de alta prioridad, <EM4>atacando sus naves y los ~mission(Objects) del cliente</EM4>. Tu trabajo será mantener a todos y todo a salvo, aunque no será fácil.\n\nNo puedo enfatizar lo suficiente lo peligrosos que son estos atacantes, así que asegúrate de <EM>llevar refuerzos</EM> para encargarte de ellos. Si tú, la tripulación y las infraestructuras salís intactos, ofrecemos una generosa suma de <EM4>~mission(ScripAmount)  MG Scrip</EM4> al contratista principal. \n\nMucha suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendLocation_E_Desc_001=Las naves que salen y entran de <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> están siendo atacadas por fuerzas hostiles. La gente de allí nos ha contratado para resolver este problema de inmediato.\n\nNecesitamos a alguien que llegue pronto y empiece a luchar contra estas naves. La situación parece estar evolucionando constantemente, así que te mantendré actualizado sobre dónde se te necesita más.\n\nPor el esfuerzo y la prisa, también pagaremos un bono de <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal por manejar esto.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta a uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendLocation_H_Desc_001=La gente de <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> está siendo atacada y necesita nuestro apoyo. Sus naves en la zona más amplia están siendo atacadas y hay una creciente preocupación de que esto sea solo el preludio de algo más grande.\n\nLa situación está cambiando, pero estoy recibiendo actualizaciones constantes sobre lo que está ocurriendo y te mantendré informado mientras avance el contrato.\n\n¿Estás disponible para ir en su ayuda? Sería inteligente reclutar algunos amigos para ayudar. Estos son clientes importantes y no podemos permitirnos fallarles. El contratista principal recibirá un bono de <EM4>~mission(ScripAmount) MG Scrip</EM4> si haces el trabajo.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta a uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendLocation_M_Desc_001=Tenemos clientes reportando ataques de forajidos a naves alrededor de <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. Están completamente bloqueados y cualquiera que intente entrar o salir es un objetivo. Cualquier intento de resolver el problema solo ha resultado en más refuerzos de forajidos apareciendo.\n\nEl cliente está desesperado por una solución, así que estamos contratando a un contratista para que restaure la paz en el área. Si surgen otros problemas una vez que estés allí, te enviaré direcciones sobre cómo ayudar.\n\nRealmente necesitamos a alguien para esto rápidamente. Así que para hacer la oferta más atractiva, el contratista principal también recibirá un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comuníquese con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendLocation_S_Desc_001=Buscando un profesional consumado para manejar un trabajo de alto riesgo. Tenemos clientes VIP en <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> que enfrentan ataques extremadamente agresivos de forajidos que están atacando las naves alrededor de su ubicación. Los detalles exactos sobre el ataque aún están llegando, pero parece ser una operación amplia y de múltiples frentes.\n\nSi estás disponible, recomiendo encarecidamente que traigas apoyo adicional de naves de combate, muchos suministros y pongas tu mejor esfuerzo. Hazlo bien y recompensaremos al contratista principal con un bono de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta a uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendLocation_VE_Desc_001=Las naves forajidas están acosando a cualquiera que intente aterrizar o salir de las operaciones de nuestro cliente en <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. Necesitamos a alguien que vuele allí para defender el sitio y proteger las naves de nuestro cliente antes de que la situación se salga de control. Llega, enfrenta a esos agresores y te mantendré actualizado sobre la situación.\n\nAyuda con esto y pasaremos un bono de <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta a uno de nuestros representantes de contratos.
; FORCE
Foxwell_DefendLocation_VH_Desc_001=Se necesita apoyo para las naves en <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> de inmediato. Los intereses de nuestro cliente en la zona están bajo un feroz ataque por parte de fuerzas de forajidos. Buscamos a alguien que pueda tomar su equipo, algunas naves de apoyo de confianza, y desplegar antes de que sea demasiado tarde. Una vez que llegues, te enviaré cualquier actualización de situación.\n\nNo arruines esto. Estos clientes están pagando por y esperando protección de primer nivel. Si algo sale mal, podríamos perder este contrato. Por eso daremos un bono de <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal si todo sale bien.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta a uno de nuestros representantes de contratos.
; FORCE
Foxwell_DestroyNarcotics_E_desc_001=Algunas personas harán cualquier cosa por unos cuantos créditos. Hay un grupo de forajidos novatos en <EM4>~mission(Location|Address)</EM4> que ha decidido empezar a fabricar drogas. Resulta que no son muy buenos en ello, o quizás son demasiado buenos. La basura que están produciendo es más fuerte de lo normal y un peligro real para cualquiera que la consuma.\n\nNos han contratado para acabar con su operación y destruir cualquier alijo de drogas en el lugar. Hay guardias armados protegiendo el sitio, pero no parecen muy hábiles. Nuestros equipos de vigilancia observaron a uno de ellos casi dispararse en el pie. No podemos asegurarlo, pero lo más probable es que no representen un gran problema para un profesional como tú.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DestroyNarcotics_H_desc_001=Los informes sobre un aumento en las sobredosis de drogas en Stanton tienen preocupados a los servicios de seguridad. Parece que un grupo de poca monta está aumentando sus ganancias adulterando su mercancía con productos químicos tóxicos. Acabar con este grupo y detener la distribución de sus drogas se ha convertido en una prioridad.\n\nUn informante de Foxwell ha revelado que parte de este grupo ha establecido su base en <EM4>~mission(Location|Address)</EM4>. Necesitamos contratar a un mercenario para que se dirija allí y destruya cualquier alijo de drogas antes de que se propaguen por todo el sistema. Ten cuidado, porque se dice que este grupo está fuertemente armado y decidido a lucrar con ese veneno sin importar las consecuencias.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_DestroyNarcotics_M_desc_001=Nos han contratado para encargarnos de un problema en <EM4>~mission(Location|Address)</EM4>. Ha habido un reciente aumento de actividad en la zona relacionada con el tráfico de drogas. Parece una operación bien organizada y existe una creciente preocupación de que se expanda aún más si no se detiene. ¿Tienes disponibilidad para asegurarte de que eso no suceda?\n\nEl trabajo es bastante sencillo. Dirígete al sitio y destruye su alijo de drogas. De esta manera, no tendrán los créditos para expandir aún más sus operaciones. No esperes que te lo pongan fácil. Se ha visto regularmente a guardias armados en las instalaciones, así que asegúrate de llevar suficiente equipo para enfrentarlos.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateAll_Allies_desc_001=Nos informaron que un grupo de forajidos está intentando tomar el control de <EM4>~mission(Location|Address)</EM4>. Hay fuerzas de seguridad locales en el lugar, pero están teniendo dificultades para detener el ataque.\n\nNecesitamos un contratista que se dirija allí de inmediato y ayude a eliminar a los agresores. Lleva suficiente equipo y ten cuidado al enfrentarte a los objetivos. No queremos recibir informes de que miembros del equipo de seguridad hayan caído por fuego amigo.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateAll_NonHostiles_desc_001=Nos han contratado para manejar una situación delicada. Una banda se ha asentado en <EM4>~mission(Location|Address)</EM4> y necesitamos despejar la zona. El único problema es que aún hay civiles en el lugar.\n\nBuscamos a alguien con las habilidades y el buen criterio para eliminar a los forajidos sin dañar a ningún inocente. Si crees que puedes hacerlo, toma tu equipo y dirígete allí.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateAll_OLP_M_desc_001=Hemos estado siguiendo a un grupo de forajidos en nombre de un cliente, y parece que han hecho una parada permanente en una antigua plataforma orbital. \n\nEstamos buscando un contratista que pueda dirigirse a <EM4>~mission(Location|Address)</EM4> y neutralizar los objetivos. La plataforma está infestada de matones armados y peligrosos, por lo que hemos designado esto como un contrato de nivel amarillo.\n\n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateAll_PAF_M_desc_001=Hemos estado rastreando a un grupo de forajidos que han estado causando problemas a uno de nuestros clientes. Parece que se han instalado en una antigua instalación de Hathor. No sabemos cuáles son sus planes con esa vieja instalación, pero nuestro cliente está ansioso por deshacerse de ellos.\n\nBuscamos a alguien que vaya a <EM4>~mission(Location|Address)</EM4> y neutralice estos objetivos.\n\n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateAll_desc_001=Buscamos a alguien dispuesto a deshacerse de la basura en <EM4>~mission(Location|Address)</EM4>. Parece que una banda se ha instalado sin el permiso de los propietarios. Así que nos han contratado para sacarlos de allí por cualquier medio que consideremos necesario. \n\nYo llevaría munición de sobra si fuera tú. Dudo que quieran irse por las buenas. \n\n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateSpecific_NonHostiles_desc_001=Tenemos información sobre un objetivo con recompensa llamado <EM4>~mission(TargetName)</EM4>. Alguien lo vio junto con conocidos cómplices criminales en <EM4>~mission(Location|Address)</EM4>. Necesitamos que llegues antes de que se escapen. \n\n<EM4>~mission(TargetName|Last)</EM4> tiene fama de solo dejarse ver en lugares con civiles. Realmente necesitamos que elimines a este objetivo sin causar daños colaterales a civiles. Foxwell no puede permitirse verse atrapado en la tormenta que se desataría por la pérdida de vidas inocentes. \n\n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_EliminateSpecific_desc_001=Buscamos ejecutar una recompensa sobre <EM4>~mission(TargetName)</EM4>. Hemos descubierto que actualmente se esconde con algunos cómplices en <EM4>~mission(Location|Address)</EM4>. \n\nYo me prepararía para lidiar con los indeseables que rondan a <EM4>~mission(TargetName|Last)</EM4>, pero nuestra única verdadera preocupación es que captures al objetivo. \n    \n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_HaulCargo_AToB_OLP_desc_01=Buscamos un contratista con las habilidades y la nave adecuadas para una misión importante. Unos forajidos tendieron una emboscada a un Hull C que transportaba una carga de <EM4>~mission(CargoGradeToken)</EM4> y la llevaron a <EM4>~mission(Location|Address)</EM4>. Nos han contratado para recuperarla toda.  \n\nLa carga está almacenada en alguna parte de una instalación abandonada de Hathor. El lugar es grande y está infestado de forajidos. Necesitamos a alguien que recupere la mercancía desde el montacargas de carga allí y la entregue de vuelta en el <EM4>montacargas de carga en ~mission(Destination|Address)</EM4>. No creas que será un paseo. Trae mucha munición y una nave que pueda manejar contenedores de <EM4>~mission(MissionMaxSCUSize)</EM4>. \n\nTampoco estaría de más traer un <EM4>haz de tractor portátil</EM4>.   \n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con fianza, autorizado para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_HaulCargo_AToB_PAF_desc_01=Una banda saqueó recientemente un centro de distribución y se llevó una <EM4>carga de ~mission(CargoGradeToken)</EM4>. Foxwell ha sido contratada para recuperar todos esos bienes. Recibimos informes de que estos forajidos usan antiguas instalaciones de Hathor como almacenes, y creemos que los artículos robados están actualmente en <EM4>~mission(Location|Address)</EM4>.\n\nSi te interesa, necesitarás una nave que pueda manejar contenedores de <EM4>~mission(MissionMaxSCUSize)</EM4>. Dudo que puedas entrar y salir de esa PAF sin que te vean, así que mejor prepárate para despejar la ubicación. Una vez segura, toma la mercancía desde el montacargas de carga y entrégala en el <EM4>montacargas de carga en ~mission(Destination|Address)</EM4>. \n\nTampoco estaría de más traer un <EM4>haz de tractor portátil</EM4>.   \n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con fianza, autorizado para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_HaulCargo_MultiToSingle_desc_01=Algo raro está ocurriendo en las antiguas instalaciones mineras de Hathor. Tanto las instalaciones de alineación de plataforma (PAF) como las plataformas láser orbitales (OLP) han estado abandonadas y acumulando polvo durante décadas, pero los forajidos han empezado a usarlas como base de operaciones.\n\nNos ha contratado una parte interesada que ha perdido recientemente mucha carga importante a manos de una de esas bandas. Actualmente, sus cosas están guardadas en <EM4>~mission(Location1|Address)</EM4> y <EM4>~mission(Location2|Address)</EM4>, pero crece el temor de que la banda pueda trasladar los bienes pronto. Por eso nos han contratado para golpear ambas instalaciones de Hathor, recuperar la carga desde los montacargas de carga y llevarla al montacargas de carga en <EM4>~mission(Destination|Address)</EM4>. \n\nAquí tienes los detalles de qué recoger en cada ubicación. No importa en qué orden lo hagas, siempre que todo se recoja y se entregue. Solo asegúrate de traer una nave que pueda manejar contenedores de <EM4>~mission(MissionMaxSCUSize)</EM4>.  Tampoco estaría de más traer un <EM4>haz de tractor portátil</EM4>.   \n\n~mission(MultiToSingleToken)\n\nFoxwell no ha podido explorar estas ubicaciones, pero si fuera tú, esperaría enfrentarme a una resistencia armada seria. Mejor trae buen equipo y, si puedes, algunos colegas.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con fianza, autorizado para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_Mercenary_Intro_desc_001=¿Eres un contratista experimentado que busca aumentar sus ingresos con trabajo de seguridad? ¿O quizás eres nuevo en el campo y buscas algo de experiencia práctica? \n\nFoxwell Enforcement está buscando nuevos contratistas entusiastas para ayudar con el cumplimiento de la ley local. Para ver si eres el indicado para nosotros, nos gustaría que te dirijas a <EM4>~mission(Location|Address)</EM4> y apoyes a las fuerzas de seguridad en el lugar. Los miembros de una banda local han estado causando problemas en esa zona. Ayuda a las fuerzas locales a encargarse de estos forajidos para calificar para más oportunidades de contrato con Foxwell.\n\nLos contratistas trabajan estrictamente de manera independiente. Foxwell espera que los contratistas suministren sus propias armas y armaduras, y no se hace responsable de lesiones, daños o muertes ocurridas durante el contrato.\n\nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_Mercenary_Rehire_desc_001=Debido a una reestructuración corporativa, Foxwell tiene algunas vacantes nuevas que deben cubrirse de inmediato. Foxwell sabe que anteriormente has mostrado interés en este tipo de trabajo y nos preguntamos si te gustaría intentarlo de nuevo con un contrato.\n\nUno de nuestros clientes necesita apoyo en <EM4>~mission(Location|Address)</EM4>, donde sus fuerzas de seguridad están teniendo dificultades para manejar una incursión de forajidos. Dirígete allí y ayuda a las fuerzas locales a eliminar el problema antes de que sea demasiado tarde. \n\nSi completas con éxito este contrato, Foxwell estará encantado de enviarte más trabajo.\n\n\nEugene Walton\nFoxwell Enforcement\n"Seguridad, a tu manera"\n\nFoxwell Enforcement es un especialista en seguridad acreditado con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_RetrieveCargo_OLP_desc_001=Aquí tenemos un encargo interesante. Unos forajidos emboscaron un convoy de suministros y se llevaron una carga vital. Todo indica que fue un trabajo profesional. No dejaron testigos, tomaron piezas de carga específicas y dejaron lo menos valioso. Su único error fue olvidar revisar la carga en busca de rastreadores. Ahora, la mercancía está en <EM4>~mission(Location|Address)</EM4>, y nos han contratado para recuperarla cuanto antes.\n\nBuscamos a alguien que recupere la carga robada de la plataforma orbital y la lleve a <EM4>~mission(Destination|Address)</EM4>. Ha sido designado como un contrato de nivel rojo porque tendrás que enfrentarte a verdaderos profesionales para recuperar la mercancía. Los créditos serán pagados al devolver la carga.\n  \n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_RetrieveCargo_PAF_desc_001=Aquí hay un contrato para cualquiera que busque algo de acción. Foxwell ha sido contratado para rastrear una carga importante robada de un centro de distribución local. Nuestra investigación localizó la mercancía y a los culpables en <EM4>~mission(Location|Address)</EM4>.\n\nNecesitamos a alguien que recupere la carga robada y la devuelva a sus legítimos dueños en <EM4>~mission(Destination|Address)</EM4>. Esas antiguas instalaciones de alineación de plataformas son bastante grandes y no estamos seguros de cuántos forajidos habrá allí, así que ten cuidado.\n\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en toda la UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_SecurityPatrol_E_Desc_001=Necesitamos que alguien neutralice una patrulla de seguridad. Deberás ir al <EM4>marcador de ubicación</EM4> en tu HUD y luego escanear varios puntos de referencia designados para asegurarte de que están seguros y protegidos.\n\nLos satélites en esa región han estado fallando recientemente. No estamos exactamente seguros de qué está pasando allí, pero es mejor estar preparado en caso de que surjan problemas.\n\nCompleta este contrato y el contratista principal recibirá un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_SecurityPatrol_H_Desc_001=Se han avistado varias naves desconocidas en áreas frecuentadas por transportistas que entregan mercancías para nuestro cliente. Están preocupados de que estas naves estén monitoreando a sus transportistas en preparación para una emboscada, por lo que nos contrataron para patrullar la zona.\n\nComienza yendo al <EM4>marcador de ubicación</EM4> en tu HUD y escanéalo para asegurarte de que está despejado. Después, te enviaremos a otras áreas para escanear posibles amenazas. Te recomendamos que lleves un <EM4>ala</EM4> y muchos suministros para estar listo para cualquier cosa que pueda aparecer.\n\nTambién ten en cuenta que completar este contrato con éxito le dará al contratista principal un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_SecurityPatrol_M_Desc_001=Un cliente está preocupado por la actividad cerca de algunos de sus intereses. Nos han contratado para patrullar la zona y realizar escaneos en varias ubicaciones. ¿Interesado? Si es así, dirígete al <EM4>marcador de ubicación</EM4> en tu HUD para comenzar la patrulla.\n\nEl cliente no fue específico sobre las amenazas, pero no cree que todo esté en orden allí. Esperemos que podamos darles algo de tranquilidad.\n\nAdemás, el cliente ha organizado para que ofrezcamos un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_SecurityPatrol_S_Desc_001=Se necesita un piloto experimentado para una patrulla importante. Un cliente destacado está harto de los forajidos que atacan sus naves y satélites. Nos han contratado para escanear las áreas en cuestión y lidiar con cualquier fuerza hostil. La patrulla comienza en el <EM4>marcador de ubicación</EM4> en tu HUD antes de movernos a varias otras ubicaciones que esperaremos que despejes.\n\nNo estamos seguros de lo que te encontrarás allí, pero según la inteligencia proporcionada por el cliente, frecuentemente ven grupos de cazas de cinco a siete naves merodeando por la región. Algunos incluso tienen naves más grandes liderando el ataque. Eso significa que estarás listo para una pelea seria. Si puedes, trata de reclutar al menos <EM4>tres amigos</EM4> para la causa. Incluso un piloto experimentado necesitará toda la ayuda que pueda obtener contra esta tripulación.\n\nDado que esto va a ser difícil, el contratista principal recibirá un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4> al final de la patrulla.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_SecurityPatrol_VE_Desc_001=Es hora de realizar una patrulla de rutina para uno de nuestros clientes a largo plazo. La ruta es una serie de puntos de referencia que deben ser visitados y escaneados para confirmar que todo esté como se espera. Debería ser lo suficientemente simple.\n\nSi estás interesado, por favor acepta y dirígete al <EM4>marcador de ubicación</EM4> en tu HUD para comenzar. Hazlo bien y el contratista principal recibirá un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_SecurityPatrol_VH_Desc_001=Un cliente necesita nuestra ayuda. Los forajidos están merodeando por ciertos sectores donde hacen negocios y atacando a cualquiera que se encuentren. Nuestro cliente ya ha perdido varias naves y no puede permitirse perder más.\n\nNecesitamos a alguien que patrulle esas áreas y atraiga a las fuerzas hostiles. El trabajo comienza contigo dirigiéndote al <EM4>marcador de ubicación</EM4> en tu HUD y escaneando. Luego, compartiremos algunos otros puntos de patrulla para que los escanees.\n\nPor lo que parece, estos grupos de naves cuentan con pilotos hábiles y agresivos. Mejor estar listo para pelear si te encuentras con alguno de ellos. Sería bueno tener al menos <EM4>dos pilotos confiables</EM4> a tu lado para esta misión.\n\nAl final de una patrulla exitosa, el contratista principal recibirá un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nMantente tranquilo,\n\nEugene Walton\nOperador Principal, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor comunícate con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipAmbush_E_desc_001=Un forajido que había estado huyendo finalmente ha regresado al sistema. Parece que esperaba que desapareciendo un tiempo nos olvidaríamos de él. Ni siquiera está intentando ocultar su identidad o cambiar su rutina, lo que significa que sabemos exactamente dónde va a estar.\n\nLa información más reciente indica que está pilotando una <EM4>~mission(AmbushTarget)</EM4> y que pronto pasará por <EM4>~mission(Location|Address)</EM4>. Ya he localizado una nube de emisiones que es el lugar perfecto para ocultarte, apagar tu nave y esperar. La única variable real es si estará solo o no. Hemos oído que a veces viaja con amigos que también pilotan cazas monoplaza. Lanzar ese primer ataque sorpresa será importante, ya que su tripulación tiene experiencia en combate, pero tendremos refuerzos listos para darte apoyo si los necesitas.\n\nCumple con esto y le daremos al contratista principal un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador principal, Foxwell Enforcement\n'La seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con garantía, autorizado para operar en toda la UEE. Siempre estamos buscando nuevos operadores para que se unan a nuestra familia. Si tú o alguien que conoces está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipAmbush_H_desc_001=Recientemente, una <EM4>~mission(AmbushTarget)</EM4> atrajo a las fuerzas de Foxwell con una baliza de rescate falsa. Para cuando nuestras fuerzas se dieron cuenta de lo que estaba ocurriendo, una escuadra de naves desató un ataque devastador y solo una contratista de Foxwell sobrevivió. Sus registros de escaneo identificaron la nave señuelo, y desde entonces hemos mantenido vigilancia sobre ella.\n\nNuestra vigilancia ha revelado que la escuadra sigue un patrón de vuelo regular que creemos que podemos aprovechar. Hay una nube de emisiones considerable en <EM4>~mission(Location|Address)</EM4> que la convierte en un lugar ideal para apostarse. ¿Crees tener lo necesario para encargarte de esto?\n\nTe enfrentarás a la <EM4>~mission(AmbushTarget)</EM4>, otras naves grandes y una escolta considerable. Ojalá pudiera ser más específico, pero esta tripulación rota las naves de la escuadra con frecuencia. Sería inteligente traer apoyo, para que no te abrumen con su número.\n\nCompleta el trabajo y le daremos al contratista principal un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador principal, Foxwell Enforcement\n'La seguridad, a tu manera'\n\nFoxwell Enforcement es una empresa especializada en seguridad con licencia para operar en todo el espacio de la UEE. Siempre estamos buscando nuevos operadores para que se unan a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipAmbush_M_desc_001=Foxwell ha estado rastreando una <EM4>~mission(AmbushTarget)</EM4> utilizada por forajidos y ha descubierto un patrón en sus movimientos. La nave debería pasar pronto por <EM4>~mission(Location|Address)</EM4>.\n\nBuscamos un contratista dispuesto a llegar rápidamente, esconderse en la nube de emisiones y luego tender la emboscada cuando llegue el momento. Normalmente hay naves escolta acompañando a la <EM4>~mission(AmbushTarget)</EM4>. Ten cuidado de no actuar demasiado pronto y arruinar el factor sorpresa. Por lo que he leído, el elemento sorpresa es crucial.\n\nSi lo logras, le daremos al contratista principal un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\nEugene Walton\nOperador principal, Foxwell Enforcement\n'La seguridad, a tu manera'\n\nFoxwell Enforcement es una empresa especializada en seguridad con licencia para operar en todo el espacio de la UEE. Siempre estamos buscando nuevos operadores para que se unan a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipAmbush_S_desc_001=Hemos recibido varias comunicaciones sobre ataques recientes realizados por una <EM4>~mission(AmbushTarget)</EM4> y sus naves escolta. Al abrir un expediente, comenzamos a rastrear los movimientos de la nave y notamos que pasa con frecuencia por una nube de emisiones cerca de <EM4>~mission(Location|Address)</EM4>. Queremos aprovechar eso para lanzar un ataque sorpresa.\n\nUna vez en el lugar, deberías esconderte en la nube de emisiones para ocultar tu firma lo suficiente como para lanzar el primer golpe. Desafortunadamente, Foxwell no puede proporcionar refuerzos adicionales para esta operación, así que serás responsable de traer tus propias fuerzas de apoyo. Y puede que las necesites. La tripulación de la ~mission(AmbushTarget) es agresiva y está curtida en combate.\n\nSi te encargas de esto por nosotros, habrá un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4> para el contratista principal.\n\nBuena suerte,\n\nEugene Walton\nOperador principal, Foxwell Enforcement\n'La seguridad, a tu manera'\n\nFoxwell Enforcement es una empresa especializada en seguridad con licencia para operar en todo el espacio de la UEE. Siempre estamos buscando nuevos operadores para que se unan a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipAmbush_VE_desc_001=¿Te apetece ayudarnos a hacer desaparecer a un tipo peligroso? \n\nNos han contratado para cazar a un forajido que pilota un <EM4>~mission(AmbushTarget)</EM4>. No debería ser muy difícil, ya que sigue la misma ruta de vuelo cada día. Eso lo convierte en un objetivo perfecto para una emboscada. He analizado la ruta y determinado que <EM4>~mission(Location|Address)</EM4> es el lugar ideal para atacar. Hay una nube de emisiones allí que será perfecta para ocultar la firma de tu nave mientras esperas.   \n\nEl trabajo es sencillo si te interesa. Ve al lugar, escóndete, apaga sistemas, y espera a que pase. A veces vuela solo, pero a menudo lo acompañan otras naves monoplaza. No debería ser difícil de manejar para un profesional. Además, tendremos refuerzos cerca listos para desplegarse cuando empiece todo.\n\nSi lo consigues, le daremos al contratista principal un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nBuena suerte,\n\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipAmbush_VH_desc_001=Foxwell recibió información de un cliente importante de que un grupo de forajidos ha formado una escuadra que acecha el sistema con naves subcapitales y cazas escolta. Nuestro cliente teme que, si no se los detiene, los forajidos formarán más de estas escuadras de ataque y desestabilizarán la seguridad del sistema. Nos han contratado para eliminar a este grupo antes de que eso ocurra.\n\nNecesitamos un contratista con confianza y experiencia para esta tarea. La buena noticia es que ya tenemos un plan. Una de las naves utilizadas por esta escuadra, una <EM4>~mission(AmbushTarget)</EM4>, fue robada a nuestro cliente, quien aún puede rastrear sus movimientos. Nos compartieron los datos de ubicación y descubrimos que esta escuadra suele pasar por <EM4>~mission(Location|Address)</EM4>. Exploramos la zona y encontramos que una gran nube de emisiones la convierte en el lugar ideal para una emboscada.\n\nNo voy a mentirte, esto no será fácil. No tenemos fuerzas adicionales para desplegar, así que sería buena idea que traigas tu propio apoyo.\n\nSi lo logras, he acordado un pago adicional de <EM4>~mission(ScripAmount) MG Scrip</EM4> para el contratista principal.\n\nBuena suerte,\n\nEugene Walton\nOperador principal, Foxwell Enforcement\n'La seguridad, a tu manera'\n\nFoxwell Enforcement es una empresa especializada en seguridad con licencia para operar en todo el espacio de la UEE. Siempre estamos buscando nuevos operadores para que se unan a nuestra familia. Si tú o alguien que conoces está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_E_001=Vale, esto puede que sea demasiado para hacerlo en solitario, así que si tienes algún favor que cobrar, quizá sea buen momento para hacerlo. Hay un grupo de desesperados atacando naves de reparto por todo este sector y nos han encargado limpiar la zona. \n\nCuando tu tripulación esté lista, dirígete a ~mission(Location|Address) y elimina a los hostiles que encuentres allí. Estos bastardos son bastante listos, así que suelen dividirse en grupos pequeños. Asegúrate de quedarte hasta acabar con todos y cada uno de ellos.\n \nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_H_001=Parece que un par de bandas menores han decidido unir recursos y empezar a realizar ataques coordinados. Por separado no eran gran cosa, pero juntas están demostrando ser una amenaza seria que debe ser eliminada.\n\nRecluta algunos refuerzos de confianza y vuela hasta ~mission(Location|Address). Una vez ataques al grupo inicial que encuentres allí, los otros grupos llegarán para apoyarlos. Asegúrate de quedarte hasta acabar con todos.\n \nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_M_001=Un grupo escindido de forajidos se ha separado de una de las principales bandas del sistema y está intentando abrirse camino por su cuenta. Por los problemas que están causando está claro que quieren hacerse un nombre lo antes posible. Dependerá de ti y de tu tripulación de apoyo ponerles fin.\n\nCuando tu tripulación esté lista, dirígete a ~mission(Location|Address) y enfréntate a la banda. No todos estarán esperando allí desde el principio. Espera que lleguen refuerzos cuando comience el ataque. Solo asegúrate de quedarte hasta que todos hayan sido eliminados.\n \nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_VE_001=Hay un pequeño grupo de criminales que ha estado marcando territorio, atacando a cualquier carguero que se acerque lo suficiente. Pero se volvieron un poco demasiado codiciosos, porque ahora alguien nos está pagando para ocuparnos de ellos.\n\nCuando tú y quienquiera que traigas estéis listos, dirígete a ~mission(Location|Address) y enfréntate a estos criminales. Como les gusta volar en grupos separados, asegúrate de quedarte hasta acabar con todos.\n \nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
; FORCE
Foxwell_destroyprobe_E_desc_001=Un cliente ha informado de la presencia de monitores de vigilancia ilegales alrededor de <EM4>~mission(Location|Address)</EM4>. Están extremadamente preocupados de que estos monitores puedan estar accediendo a información sensible relacionada con sus operaciones.\n\nCreemos que hay <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> que deberán ser destruidos. Rastrearlos es complicado debido a sus bajas firmas EM, por lo que tendrás que determinar su ubicación exacta una vez en la zona.\n\nEstos “skimmers” están equipados con protocolos de seguridad que activarán transferencias de datos si son atacados directamente. Asegúrate de destruirlos antes de que la carga se complete. Quienquiera que haya colocado estos dispositivos también será notificado. Si tienen fuerzas en la zona, no te sorprendas si aparecen e intentan detenerte.\n   \n  \nEugene Walton\nFoxwell Enforcement\n“Seguridad, a tu manera”\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_destroyprobe_H_desc_001=Buscamos a alguien que se encargue de un problema que uno de nuestros clientes tiene en <EM4>~mission(Location|Address)</EM4>. Parece que alguien ha instalado varios “data skimmers” ilegales para robar información sensible. Necesitamos que los desconectes cuanto antes.\n\nTendrás que escanear la zona para localizar los <EM4>~mission(Contractor|DestroyProbeAmount)</EM4>, lo cual será complicado debido a sus bajas emisiones. Una vez los encuentres, destrúyelos rápidamente antes de que sus protocolos de seguridad se activen y suban los datos almacenados. También deberías estar atento a fuerzas hostiles en la zona, así que planifica en consecuencia.\n \n\nEugene Walton\nFoxwell Enforcement\n“Seguridad, a tu manera”\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_destroyprobe_M_desc_001=Después de que un contratista recuperara con éxito datos robados a uno de nuestros clientes, un analista de seguridad verificó que fueron capturados por monitores de vigilancia no autorizados instalados ilegalmente en <EM4>~mission(Location|Address)</EM4>. Buscamos a alguien para ocuparse de ellos y destruirlos.\n\nTendrás que localizar los <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> y eliminarlos antes de que puedan recopilar más datos. “Skimmers” pasivos como estos suelen ser difíciles de encontrar, así que sé minucioso en tu búsqueda.\n\nUna vez atacados, sus protocolos de seguridad harán que empiecen a transmitir el contenido de sus unidades, por lo que es imprescindible detener la subida antes de que se complete. También es probable que quienes estén detrás de esto se encuentren en la zona, así que ten cuidado.\n\n\nEugene Walton\nFoxwell Enforcement\n“Seguridad, a tu manera”\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_destroyprobe_S_desc_001=Uno de nuestros clientes está cada vez más frustrado porque sus convoyes están siendo atacados constantemente. Hemos incrementado las patrullas en la zona y parece que unos forajidos han colocado “skimmers” en <EM4>~mission(Location|Address)</EM4> con la intención de robar datos importantes, como rutas de vuelo y manifiestos de carga.\n\nNecesitamos que registres el área, localices los <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> y los destruyas. Usan un método pasivo de recopilación de datos diseñado para mantener su firma baja, así que serán bastante difíciles de detectar. Asegúrate de escanear el área cuidadosamente para encontrarlos. Una vez ataques uno, activarán su modo de transferencia de datos de emergencia, lo que los hará visibles al empezar a transmitir; solo asegúrate de destruirlos antes de que terminen.\n\nTambién es posible que, al ser atacados, los forajidos envíen algunas naves para responder. Más te vale estar atento para defenderte y destruir esos monitores antes de que transfieran los datos con éxito.\n\n\nEugene Walton\nFoxwell Enforcement\n“Seguridad, a tu manera”\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_destroyprobe_VE_desc_001=<EM4>Nos hemos enterado de que criminales locales están operando ~mission(Contractor|DestroyProbeAmount) alrededor de ~mission(Location|Address) para estudiar posibles objetivos.</EM4> Varios de nuestros clientes operan en esa área, así que convendría eliminarlos antes de que se conviertan en un problema.\n\nLos monitores están diseñados para pasar desapercibidos, lo que significa que encontrarlos será un poco molesto. Tendrás que barrer la zona para identificar su ubicación exacta. Una vez lo hagas, destrúyelos.\n\nEs probable que quien esté detrás de estos dispositivos intente detenerte. Además, suelen equipar estos monitores con protocolos defensivos que hacen una copia de seguridad de los datos automáticamente cuando son atacados. En cuanto empieces a disparar, tendrás que terminar el trabajo rápido antes de que la transferencia se complete.\n\n\nEugene Walton\nFoxwell Enforcement\n“Seguridad, a tu manera”\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
Foxwell_destroyprobe_VH_desc_001=Hemos recibido informes de “skimmers” ilegales cerca de <EM4>~mission(Location|Address)</EM4> que están apuntando a las operaciones de nuestro cliente. Los datos recopilados podrían causar todo tipo de problemas, así que necesitamos que localices y destruyas los <EM4>~mission(Contractor|DestroyProbeAmount)</EM4>.\n\nMás fácil decirlo que hacerlo. Monitores como estos están diseñados para pasar desapercibidos, por lo que detectarlos no será fácil, pero una vez escanees la zona y los localices, podrás eliminarlos. Pero ten cuidado, en cuanto empieces a atacarlos, se activará una transferencia de datos de emergencia. Es importante que los destruyas antes de que la subida termine.\n\nTambién es muy probable que aparezca resistencia hostil para intentar detenerte. Será mejor que estés atento para que no te sorprendan.\n\n\nEugene Walton\nFoxwell Enforcement\n“Seguridad, a tu manera”\n\nFoxwell Enforcement es un especialista en seguridad acreditado y autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operativos para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor contacta con uno de nuestros representantes de contratos.
; FORCE
foxwell_DefendShip_E_desc_001=Foxwell está buscando un piloto de combate disponible para proporcionar asistencia inmediata a una ~mission(Ship) bajo ataque cerca de ~mission(Location|Address). No hemos identificado a los responsables del ataque, pero nos han asegurado que es una fuerza pequeña.\n\nPor favor, envíen refuerzos rápidamente y eliminen a todos los hostiles. Necesitamos que el cliente sobreviva, ya que aún no nos ha pagado.\n\nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor, contacta a uno de nuestros representantes de contratos.
; FORCE
foxwell_DefendShip_E_desc_002=Central acaba de transmitir una comunicación urgente de un cliente potencial que ha sido atacado mientras viajaba por el sistema. Los hemos ubicado cerca de ~mission(Location|Address) y parece que necesitan urgentemente personal de seguridad para sacarlos de una situación crítica.\n\nFoxwell está buscando operativos de seguridad disponibles (experiencia en combate preferida) para responder.\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor, contacta a uno de nuestros representantes de contratos.
; FORCE
foxwell_DefendShip_H_desc_001=Un contrato de emergencia acaba de llegar sobre una pelea cerca de ~mission(Location|Address). Aparentemente, un grupo de naves fue emboscado por forajidos liderados por ~mission(TargetName), quien ha sido buscado en varios planetas por asesinato y robo de naves. Foxwell está buscando pilotos de combate de primer nivel para proteger a los clientes contra ellos.\n\nEste contrato ha sido marcado como de nivel rojo, por lo que es realmente peligroso. Si tienes personas que puedas traer, probablemente deberías. Si lo haces, también deberías informarles sobre las políticas de contratación de Foxwell.\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor, contacta a uno de nuestros representantes de contratos.
; FORCE
foxwell_DefendShip_H_desc_002=Una peligrosa banda de forajidos liderada por ~mission(TargetName) ha lanzado un ataque contra un convoy de naves cerca de ~mission(Location|Address). Foxwell acaba de ser contratado por uno de ellos para proporcionar apoyo inmediato en combate.\n\nSi estás disponible, por favor, acude de inmediato para destruir a ~mission(TargetName|Last) y su tripulación y asegurar la seguridad de todas las naves. Esta será una misión peligrosa, pero será una gran carta de presentación para Foxwell, si tiene éxito.\n\nBuena suerte,\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor, contacta a uno de nuestros representantes de contratos.
; FORCE
foxwell_DefendShip_M_desc_001=Tenemos un contrato de nivel naranja para cualquier piloto de combate disponible. Una ~mission(Ship) está bajo ataque cerca de ~mission(Location|Address) y necesita desesperadamente ayuda. No estamos seguros de cuántos atacantes hay, pero parecen ser muy peligrosos, así que ten cuidado.\n\nUna vez en el sitio, elimina a los hostiles que encuentres y protege al cliente. Una vez que hayan transferido los créditos, te enviaremos el pago.\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor, contacta a uno de nuestros representantes de contratos.
; FORCE
foxwell_DefendShip_M_desc_002=Buscando un piloto de seguridad disponible (preferible experiencia en combate) para ayudar a un piloto de ~mission(Ship) que está bajo ataque. La inteligencia ha sido incierta, pero los forajidos que están llevando a cabo el ataque parecen ser muy peligrosos, así que ten cuidado.\n\nSi estás disponible, por favor acepta y dirígete a ~mission(Location|Address) de inmediato para proteger al cliente y eliminar a todos los hostiles. El pago se procesará una vez que el cliente esté a salvo.\n\nEugene Walton\nFoxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad con licencia para operar en todo el UEE. Siempre estamos buscando nuevos operadores para unirse a nuestra familia. Si tú o alguien que conozcas está interesado, por favor, contacta a uno de nuestros representantes de contratos.
; FORCE
mg_clovus_bladesteal_obj_long_06=El ~mission(Item) ha sido recuperado por otra parte interesada. Recupéralo antes de que sea destruido.
; FORCE
Foxwell_DefendEntitesAndEscort_H_Desc=La tripulación que gestiona las operaciones de uno de nuestros clientes en <EM4>~mission(Location|Address)</EM4> ha informado de que están siendo atacados por una banda criminal que ataca las <EM4>~mission(Objects) y naves</EM4> de la zona. Tu trabajo será mantener a ambos a salvo a toda costa. Aún no tengo todos los datos, pero supongo que será una misión dura: estos forajidos parecen decididos a montar una buena carnicería. \n\nSi fuera yo, <EM4>llevaría refuerzos</EM4> para encargarme de ellos. Y si consigues proteger a todos, ofrecemos unos bien merecidos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal que se encargue con éxito de estos miserables. \n\nMucha suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos (Dificultad: Difícil)</EM4>\n<EM4>Stanton</EM4>\n<EM4>Variante 1</EM4>\n- [CIV|1|A] 7SA 'Concord' (Escudo)\n- [CIV|1|D] INK (Escudo)\n- [CIV|2|A] 7MA 'Lorica' (Escudo)\n- [CIV|2|D] RPEL (Escudo)\n- [CIV|3|A] 7CA 'Nargun' (Escudo)\n- [CIV|3|D] HAVEN (Escudo)\n<EM4>Variante 2</EM4>\n- Repetidor Attrition-4\n- Repetidor Attrition-5\n- Repetidor Attrition-6\n- [MIL|3|A] FR-86 (Escudo)\n- [MIL|0|B] Sens (Radar)\n- [MIL|1|B] Tige (Radar)\n<EM4>Pyro</EM4>\n<EM4>Variante 1</EM4>\n- [CIV|0|B] IonWave (Generador)\n- [CIV|0|C] Radix (Generador)\n- [CIV|1|B] IonBurst (Generador)\n- [CIV|1|C] PowerBolt (Generador)\n- [CIV|1|C] LightBlossom (Generador)\n- [CIV|1|B] MagnaBloom (Generador)\n- [CIV|2|C] FullForce (Generador)\n- [CIV|2|B] IonSurge (Generador)\n- [CIV|2|B] Radiance (Generador)\n- [CIV|3|C] FullForce Pro (Generador)\n- [CIV|3|B] IonSurge Pro (Generador)\n- [CIV|3|B] Celestial (Generador)\n- [CIV|3|C] NewDawn (Generador)\n<EM4>Variante 2</EM4>\n- [MIL|1|A] Glacier (Enfriador)\n- [MIL|2|A] Avalanche (Enfriador)\n- [MIL|3|A] Blizzard (Enfriador)\n- Repeater de distorsión DR Modelo-XJ1\n- Repeater de distorsión DR Modelo-XJ2\n- Repeater de distorsión DR Modelo-XJ3\n<EM4>Nyx</EM4>\n<EM4>Variante 1</EM4>\n- [CIV|0|C] Frost-Star SL (Enfriador)\n- [CIV|0|C] Fridan (Enfriador)\n- [CIV|0|A] Tepilo (Enfriador)\n- [CIV|1|C] Frost-Star (Enfriador)\n- [CIV|1|C] ArcticStorm (Enfriador)\n- [CIV|1|C] Berian (Enfriador)\n- [CIV|1|A] Gelid (Enfriador)\n- [CIV|2|C] Frost-Star EX (Enfriador)\n- [CIV|2|C] ColdSnap (Enfriador)\n- [CIV|2|A] Aufeis (Enfriador)\n- [CIV|2|C] Graupel (Enfriador)\n- [CIV|3|C] Frost-Star XL (Enfriador)\n- [CIV|3|C] FrostBurn (Enfriador)\n- [CIV|3|A] Draug (Enfriador)\n- [CIV|3|A] Elsen (Enfriador)\n- [CIV|3|A] Kragen (Enfriador)\n<EM4>Variante 2</EM4>\n- Repetidor CF-117 Bulldog\n- Repetidor CF-227 Badger\n- Repetidor CF-337 Panther\n- Repetidor CF-447 Rhino\n- Repetidor CF-557 Galdereen\n- Repetidor CF-667 Mammoth\n- [MIL|0|A] V60-26 (Radar)
