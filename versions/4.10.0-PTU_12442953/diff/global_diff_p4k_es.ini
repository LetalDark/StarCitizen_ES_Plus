item_Desc_cds_combat_medium_arms_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 8K µSCU\nMochilas: Media, Ligera\n\nLa mark X forma parte de la galardonada serie de armaduras Omni-Role Combat de CDS. Este traje apto para EVA incorpora la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y los elementos mientras minimiza la agilidad del operador.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
; FORCE
item_Desc_cds_combat_medium_backpack_01_01_01=Tipo de artículo: Mochila media\nCapacidad de carga: 105K µSCU\nCompatibilidad de núcleo: Media y pesada\n\nPrepárate para cualquier situación con la mochila CSP-68M. Originalmente diseñada para las exigencias del soporte de combate, esta mochila media se ha hecho popular gracias a su durabilidad y a un conector de núcleo patentado que ayuda a que la CSP-68M se asiente cómoda y equilibradamente en la espalda.
; FORCE
item_Desc_cds_combat_medium_core_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 7.5K µSCU\nMochilas: Media, Ligera\n\nEsta versión de la armadura de combate ORC-mkX de CDS ha sido modificada respecto a su forma original. La mark X forma parte de la galardonada serie de armaduras Omni-Role Combat de CDS. Este traje apto para EVA incorpora la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y los elementos mientras minimiza la agilidad del operador.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
