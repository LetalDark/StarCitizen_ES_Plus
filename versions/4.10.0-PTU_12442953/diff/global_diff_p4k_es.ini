item_Desc_slaver_armor_light_01_core=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\nMochilas: Ligera\n\nDiseñado para cumplir con EVA, el set Calico es el traje de armadura perfecto para infiltradores, francotiradores, ladrones, básicamente cualquiera que prefiera evitar entrar a la fuerza. Construido con una combinación de armadura PAB3 y un casco personalizado, te ayudará a resistir algunos disparos sin ralentizarte.
