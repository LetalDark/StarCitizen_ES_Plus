item_DescMXOX_NeutronCannon_S2=Fabricante: MaxOx\nTipo de artículo: Cañón de neutrones\nTamaño: 2\n\nBasado en la tecnología del NN-13, el NN-14 de MaxOx ofrece un aumento significativo en la potencia del cañón automático de neutrones para darle a cada disparo un golpe devastador. Sin embargo, ese mayor daño conlleva un mayor consumo de tu planta de energía.
; FORCE
item_DescMovable_Trolley_Hover_cargo=Gracias al grav-lev, este carro de mano utilitario facilita mucho el transporte de cargas pesadas.
item_DescRSI_Constellation_Aquila_shop=Fabricante: RSI\nCategoría: Exploración\n\n¡Explora cualquier horizonte lejano! La Constellation Aquila es la nave de exploración definitiva, equipada con el escáner y los sensores más avanzados para detectar los secretos del universo. Su robusto diseño y su autonomía la convierten en la compañera ideal para travesías largas y peligrosas.
; FORCE
item_DescStinger_Paint_Silver_Grey_Teal=La pintura Insularis añade un elegante y etéreo acabado en verde azulado y metal con pátina para resaltar y celebrar la naturaleza de otro mundo de la Stinger.
; FORCE
item_DescSyulen_Paint_bronze_grey_red=Convierte a tu Syulen en una nave digna de admiración con la pintura Xy'kara, que dota a la nave de un rico aspecto bronce jaspeado en tonos grises y matices rojizos.
; FORCE
item_Desc_BASL_combat_light_helmet_01_01_01=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -31 / 61 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\n\nEl diseño único con rostro descubierto hace que el casco Advocacy Interceptor sea una opción ligera y liberadora para operar en atmósfera. Cuenta con placas cuidadosamente dispuestas para proteger la cabeza de una variedad de peligros de combate y ambientales, además de una visera resistente a impactos y antirreflejo sobre los ojos. El visor es compatible con la retícula AR.
; FORCE
item_Desc_BASL_undersuit_01_01_01=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nCon un diseño engañosamente simple, el subtraje Advocacy Interceptor es completamente negro con refuerzos acolchados de protección gris en brazos y piernas. La reconocida artesanía de Basilisk hace que este traje de vuelo sea duradero y sumamente cómodo, sin dejar dudas de por qué es ampliamente utilizado por la Advocacy.
; FORCE
item_Desc_CDS_Undersuit_Armor_02_Shared=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl FBL-8u es el primer subtraje de CDS que utiliza la nueva tecnología de tejido esférico del fabricante, la cual produce un material sorprendentemente ligero pero resistente que puede soportar los rigores de los viajes espaciales. Originalmente desarrollado para combinar perfectamente con la armadura ligera FBL-8a de CDS, sigue siendo compatible con otros conjuntos de armadura.
; FORCE
item_Desc_CDS_Undersuit_Armor_Shared=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEste completo Traje de Combate Táctico proporciona un sellado total contra el vacío, libertad total de movimiento e interactúa perfectamente con sistemas de armadura compatibles.
; FORCE
item_Desc_CDS_undersuit_01_03_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEste completo Traje de Combate Táctico proporciona un sellado total contra el vacío, libertad total de movimiento e interactúa perfectamente con sistemas de armadura compatibles. La edición Lifeforce fue diseñada pensando en los servicios de emergencia, con un esquema de colores blanco, rojo y gris muy visible.
; FORCE
item_Desc_COMP_WLOP_S02_Baas=Tipo de artículo: Computadora\nFabricante: WillsOp\nTamaño: 2\nGrado: C\nClase: Civil\n\nEl Baas de WillsOp te brinda un rendimiento superior para ofrecer una de las experiencias computacionales más rápidas y completas.
; FORCE
item_Desc_GRIN_utility_medium_backpack_01=Tipo de artículo: Mochila media\nCapacidad de carga: 127.5K µSCU\nCompatibilidad de núcleo: Media y pesada\n\nOriginalmente diseñada para mineros, la armadura Aril viene con una mochila acoplable que puede alojar una variedad de herramientas y suministros para mantener las manos libres. La mochila Aril está disponible en una variedad de colores vibrantes para adaptarse a tu gusto personal y facilitar la identificación en el lugar de trabajo.
; FORCE
item_Desc_Slaver_Undersuit_Armor_Shared=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nLa serie Stoneskin de subtrajes de combate de Kastak Arms está construida sobre el famoso sistema TCS-4 de CDS, basándose en la amplia retroalimentación de los operadores que dependen de esta tecnología en el campo. Ofreciendo una miríada de opciones para armadura y capacidades EVA, el Stoneskin está preparado para rivalizar con CDS como un subtraje resistente y fiable.
; FORCE
item_Desc_basl_combat_light_flightsuit_02_01_01=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nCon un diseño engañosamente simple, el traje de vuelo Ace Interceptor es negro azabache con acolchado protector gris reforzado en brazos y piernas. La reconocida artesanía de Basilisk hace que este traje de vuelo sea duradero y sumamente cómodo, sin dejar dudas de por qué es ampliamente utilizado por los mejores pilotos del imperio.
; FORCE
item_Desc_basl_combat_light_helmet_02_01_01=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\n\nEl diseño único de cara abierta hace que el casco Ace Interceptor sea una opción ligera y liberadora para operar en atmósfera. Presenta un revestimiento de placas estratificadas con precisión para proteger la cabeza de diversos peligros ambientales y de combate, junto con una visera resistente a impactos y antirreflejo sobre los ojos. El visor es compatible con la retícula AR.
; FORCE
item_Desc_cbd_hat_03_01_CFP_var2,P=PLACEHOLDER - cbd_hat_03_01_CFP_var2
