item_Desc_cds_combat_medium_core_03_01_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 7.5K µSCU\nMochilas: Media, Ligera\n\nEsta versión de la armadura de combate ORC-mkX de CDS ha sido modificada desde su forma original. La mark X es parte de la galardonada serie Omni-Role Combat de CDS. Este traje certificado para EVA presenta la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y elementos, mientras minimiza la agilidad del operador.
