item_Desc_syfb_flightsuit_suit_01_iae2023_01=Tipo de artículo: Traje de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +97.5%\nCapacidad de carga: 6.5 µSCU\nMochilas: Ligera\n\nPerfeccionado a través de siglos de innovación, el elegante y estilizado traje de vuelo Xanthule de Syang Fabrication ha sido meticulosamente adaptado a la fisiología humana. El traje Xanthule cuenta con placas ligeras y transpirables hechas con un tejido de carbono y seda que proporciona protección fiable mientras mantiene la estética característica de la renombrada Casa. Esta edición especial IAE 2953 está decorada con un patrón en cobre y blanco inspirado en el Syulen de Gatac Manufacture.
; FORCE
item_Desc_uba_prison_undersuit_01=Tipo de artículo: Mono de trabajo\nReducción de daño: 5%\nRango térmico: -75 / 75 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\nCapacidad de carga: 8.0 µSCU\n\nEl Mono de Trabajo para Reclusos es un traje duradero y de alta visibilidad diseñado para sobrevivir las duras condiciones que enfrentan los reclusos durante los programas de trabajo fuera. El mono integra acolchados reforzados para protección con un tejido sintético resistente que cumple con el estándar mínimo gubernamental de aislamiento térmico, manteniendo los costos bajos. La resistente mochila de trabajo ofrece amplia capacidad de almacenamiento y distribuye el peso de manera uniforme sobre la espalda del usuario, permitiéndole cargar más durante cada turno. También cuenta con correas inferiores seguras para permitir determinar el tamaño del tanque de oxígeno por recluso, minimizando el riesgo de escape.
; FORCE
item_Desc_vgl_undersuit_01_01_Shared=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl ForceFlex de Virgil es la próxima generación en tecnología de subtraje. Certificado tanto para combate como para trabajo industrial, puedes estar seguro de que el tejido combinado te mantendrá protegido en cualquier situación a la que lo sometas.
; FORCE
item_Desc_vpw_bouncer_jacket_01_01_01=Capacidad de carga: 1K µSCU\n0.5 kg\n\nLa chaqueta Vaporwear Creese cuenta con un cuello de la antigua Tierra y etiquetas alrededor de los hombros. Los detalles blindados en los hombros y las mangas ventiladas permiten usar la chaqueta de manera informal o pilotando un vehículo con techo abierto.\n\nLa edición especial Nine Tails presenta la simbología de la banda.
; FORCE
item_Desc_vpw_bouncer_jacket_01_02_01=Capacidad de carga: 1K µSCU\n\nLa chaqueta Vaporwear Creese cuenta con un cuello de la antigua Tierra y etiquetas alrededor de los hombros. Los detalles blindados en los hombros y las mangas ventiladas brindan protección sin restringir el movimiento, lo que permite usar la chaqueta de manera informal o pilotar un vehículo con techo abierto. La edición especial Skullsnap es plateada elegante con estilos geométricos y una calavera gritando en la parte posterior.
; FORCE
item_Desc_vpw_bouncer_jacket_01_03_01=Capacidad de carga: 1K µSCU\n\nLa chaqueta Vaporwear Creese cuenta con un cuello de la antigua Tierra y etiquetas alrededor de los hombros. Los detalles blindados en los hombros y las mangas ventiladas brindan protección sin restringir el movimiento, lo que permite usar la chaqueta de manera informal o pilotar un vehículo con techo abierto. La edición especial Toxic Fog es negra con detalles en verde gas venenoso y una calavera en la parte delantera y trasera.
; FORCE
item_Desc_vpw_bouncer_jacket_01_04_01=Capacidad de carga: 1K µSCU\n\nLa chaqueta Vaporwear Creese cuenta con un cuello de la antigua Tierra y etiquetas alrededor de los hombros. Los detalles blindados en los hombros y las mangas ventiladas brindan protección sin restringir el movimiento, lo que permite usar la chaqueta de manera informal o pilotar un vehículo con techo abierto. La edición especial Copperhead presenta una serpiente que envuelve la parte delantera, trasera y el brazo izquierdo de la chaqueta.
; FORCE
item_Descbehr_rifle_ballistic_03=Fabricante: Behring\nTipo de artículo: Rifle\nClase: Balística\nTamaño del cargador: 40\nAccesorios: Óptica, Cañón, Subcañón (S2)\n[Auto] DPS: 178.8 | Alpha: 16.5\n[Auto] DPS: 131.2 | Alpha: 66\nVelocidad: 550 m/s\nCargado: 3.7 kg | Descargado: 3.2 kg\n[Red. daño] 100% 65m | 61% 173m | 0% 1100m\n\nDiseñado para enfrentamientos a corta distancia como los abordajes, el CQ7 de Behring es un rifle de combate bullpup de nueva generación pensado para dominar las exigencias del entorno del campo de batalla moderno.
; FORCE
item_Descbehr_rifle_ballistic_03_mag=Tipo de artículo: Cargador\nCapacidad: 40 | 0.5 kg\n\nEste cargador para el rifle CQ7 viene precargado con cuarenta cartuchos.
; FORCE
item_Deschdgw_rifle_ballistic_01=Fabricante: Hedeby Gunworks\nTipo de artículo: Rifle\nClase: Balística\n\nTamaño del cargador: 20\nCadencia de fuego: 320 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S3)\n\nLos armeros de Hedeby Gunworks se inspiraron en los diseños balísticos clásicos para construir un rifle largo arraigado en el pasado y en el futuro. El Arlington ofrece una puntería precisa, un fácil ciclado de cartuchos gracias al diseño de acción de palanca y múltiples modos de disparo. Los artesanos moldearon el cuerpo del arma a mano para crear una pieza tan apta para la repisa de la chimenea como para la frontera.
; FORCE
item_Deschdgw_rifle_ballistic_01_mag=Tipo de artículo: Cargador\nCapacidad: 20\n\nEste cargador para el rifle Arlington viene precargado con veinte cartuchos.
; FORCE
item_Descvolt_optics_tsco_x8_s3_store01=Fabricante: VOLT\nTipo: Telescópica\nPunto de montaje: Óptica\nAumento: 8x\nTiempo de apuntado: +0%\nTamaño: 3\n\nDiseñada para disparos de precisión a larga distancia, la FarSight está cuidadosamente fabricada para proporcionar una fidelidad de objetivos sin igual. La tecnología de lentes TruePicture de VOLT ofrece altos niveles de transmisión de luz, asegurando una fácil adquisición de objetivos y una iluminación diurna para que siempre consigas tu marca.\n\nLa versión Golden Blossom es principalmente negra, adornada con intrincadas flores doradas, ofreciendo a tus enemigos un último vistazo de vida antes de la muerte.
; FORCE
item_Descvolt_sniper_energy_01_store01=Fabricante: Verified Offworld Laser Technologies\nTipo de artículo: Rifle de francotirador\nClase: Energía (Láser)\n\nTamaño de batería: 22\nCadencia de fuego: 60-300 rpm\nAlcance efectivo: 80 m\n\nAccesorios: Ópticas (S3), Subcañón (S2)\n\nEl rifle de francotirador láser Zenith de VOLT ofrece flexibilidad operativa en el campo de batalla, ya que puede disparar rápidamente disparos de baja energía, o dejarse cargar automáticamente para disparar un proyectil de energía mucho más potente que también genera significativamente más ruido y calor.\n\nLa versión Golden Blossom es principalmente negra, adornada con intrincadas flores doradas, ofreciendo a tus enemigos un último vistazo de vida antes de la muerte.
; FORCE
item_Mining_Modules_Active_GRIN_Charge_BTGL_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo de minería (activo)\n\nPotencia del láser de minería: +15%\n\nTasa de carga óptima: +30%\n\nDuración: 30 segundos\nUsos: 6\n\nEl Clearcut mejora notablemente los resultados de la minería al alterar la tasa de carga y acelerar la extracción de mineral valioso.
; FORCE
item_Mining_Modules_Passive_THCN_Power_BTGL_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo de minería (pasivo)\n\nResistencia: -15.5%\n\nPotencia del láser de minería: +15%\n\nPotencia del láser de extracción: -15%\n\nAl reducir las ineficiencias en el rendimiento del láser de minería, el Módulo Deluge aumenta la eficacia del haz mientras está en uso.
; FORCE
item_Mining_Modules_Passive_THCN_Resistance_BTGL_Desc=Fabricante: Thermyte Concern\nTipo de artículo: Módulo de minería (pasivo)\n\nResistencia: -24.8%\n\nPotencia del láser de minería: +8%\n\nPotencia del láser de extracción: -15%\n\nEl Módulo Overrun utiliza un variador de matriz modificado para que los láseres penetren más allá de la resistencia natural de las rocas durante la minería.
; FORCE
