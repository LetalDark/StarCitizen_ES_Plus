UWC_Refueling_easy_desc_001=Hola,\n\nSi vas equipado para repostar, este igual te interesa. \n\nAcaba de activarse una baliza en <EM4>~mission(Location|Address)</EM4>, de un cliente cuya <EM4>~mission(Ship)</EM4> necesita ~mission(FuelType), así que asegúrate de tener tus depósitos al máximo.\n\nLa nave del cliente te pagará a razón de ~mission(RefuelRequest), y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nParece un trabajo limpio y de ida y vuelta, pero nunca está de más mantener los escáneres activos.\nDime si te interesa y pongamos a esta buena gente en marcha.\n\nEspero noticias tuyas,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
; FORCE
UWC_Refueling_intro_desc_001=¡Hola!\n\nDD del United Wayfarers Club al habla.\n\nEl UWC ofrece servicios de reparación, rearme y repostaje por toda la UEE. Da la casualidad de que estamos buscando nuevos afiliados con naves equipadas para repostar. Si tienes los depósitos de combustible y te gusta que la gente se alegre de verte, el UWC puede ser tu club.\n\nY si crees que sí, tengo una baliza activa que igual te interesa.\n\nSi resulta que sí, un consejo: <EM4>asegúrate de tener los depósitos de combustible llenos antes de salir</EM4>.\n\nUn miembro del Club se ha quedado sin ~mission(FuelType) en <EM4>~mission(Location|Address)</EM4>. No tengo claros los detalles, como cómo acabó ahí sin Go Juice, pero al UWC no le gusta dejar a la gente colgada.\n\nLa nave del cliente te pagará a razón de ~mission(RefuelRequest). Como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nEs un encargo directo. Perfecto si quieres hacerte una idea de este tipo de trabajo. Sal ahí, llena los tanques de su <EM4>~mission(Ship)</EM4> y ponles en marcha. Después de unos cuantos encargos así, el proceso se vuelve memoria muscular. Hasta entonces, hay una <EM4>entrada de diario</EM4> en tu mobiGlas llamada "Protocolos de repostaje" que cubre lo básico.\n\nNo se han registrado actividades de forajidos en ese sector, pero mantente alerta. Siempre recomiendo que apuntes a un cierre rápido. Cuanto antes termines, antes podré conseguirte otro contrato. El UWC siempre busca nuevos afiliados. \n\nDeseando trabajar contigo.\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
; FORCE
UWC_Refueling_multiple_med_desc_001,P=Hola otra vez,\n\nTengo una baliza en <EM4>~mission(Location|Address)</EM4> y esta es un poco más complicada de lo habitual. Tengo una pequeña flotilla de naves solicitando ~mission(FuelType). Impresionante coordinación y falta de planificación a la vez, para necesitar repostar todas al mismo tiempo. \n\nEl cliente te pagará a razón de ~mission(RefuelRequest), y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nComo la zona en la que están es bastante segura, no debería haber muchos problemas al acecho, pero hoy en día nunca se sabe. No estaría mal ponerlos de nuevo en marcha tan rápido como puedas.\n\nBuen viaje,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
; FORCE
UWC_Refueling_multiple_med_title_001=REPOSTAJE DE CONVOY URGENTE
; FORCE
Vaughn_EliminateSpecific_FPS_storm_H_desc_003=Un objetivo anterior que pensaba haber sido eliminado parece haber resurgido como mercenario contratado en <EM4>~mission(Location)</EM4> trabajando para ASD. Aunque estoy enormemente decepcionado con el contratista que afirmó haber eliminado a <EM4>~mission(TargetName|Last)</EM4>, voy a reabrir el contrato original y dártelo a ti para que lo termines.\n\nActualmente está apostado en una instalación operativa, así que no estará solo. Usa tu criterio al ejecutar el contrato, pero ten claro que <EM4>~mission(TargetName)</EM4> es la prioridad.\n\nConfío en que lo harás mejor que mi anterior subcontratista,\n\nVaughn
; FORCE
Vaughn_EliminateSpecific_FPS_storm_H_desc_004=Tengo un contrato difícil para un operativo exigente. El nombre del objetivo es <EM4>~mission(TargetName)</EM4>. Actualmente trabaja como guardia de seguridad contratada para Associated Science & Development y está apostado en <EM4>~mission(Location)</EM4>, muy lejos de su anterior carrera como ejecutor y recadero de un sindicato.\n\nNecesito que entres y te encargues de <EM4>~mission(TargetName|Last)</EM4>, lo cual es más fácil de decir que de hacer, porque sin duda estará atrincherado con otras fuerzas de seguridad corporativas, pero confío en que lo resolverás.\n\nTodo lo mejor,\n\nVaughn
; FORCE
Vehicle_DescGRIN_UTV=Fabricante: Greycat Industrial\nEnfoque: Carga\n\nEl Greycat UTV es un buggy utilitario y resistente diseñado para transportar cargas ligeras por terrenos accidentados. Tanto si coordinas el almacenamiento de mercancías como si haces una entrega a un puesto avanzado vecino, el diseño directo del UTV permite a los operadores centrarse en la tarea que tienen entre manos.
