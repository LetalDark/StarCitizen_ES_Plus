IAE_2955_HoverQuad_Terminus_Desc=Fabricante: Consolidated Outland\nEnfoque: Transporte\n\nDiseñada como vehículo terrestre complementario de la Nomad, la HoverQuad posee un chasis anguloso y aerodinámico que utiliza cuatro plataformas grav-lev para lograr la máxima maniobrabilidad, convirtiéndola en el transporte perfecto sobre cualquier superficie.\n\nAtraviesa paisajes pintorescos con estilo gracias a la sublime pintura HoverQuad Terminus, negra con toques rojos.
