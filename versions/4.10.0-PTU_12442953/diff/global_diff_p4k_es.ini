item_Desc_nvy_flightsuit_helmet_01_01_01=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\n\nInspirado en los trajes de vuelo originales utilizados por la Fuerza Aérea de la Tierra, esta réplica se mantiene fiel al diseño histórico mientras incorpora comodidades modernas. Con una semi-visera tintada propia de la época, esta reproducción de casco no es estanca al aire.\n\nLa edición Aviator es principalmente de color verde-beige con detalles en verde claro.
