item_Desc_cds_combat_heavy_core_01_02_02=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nTasa de purga de radiación: 251.1 REM/s\nCapacidad de carga: 10.5K µSCU\nMochilas: Todas\n\nCuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. La armadura pesada ADP-mk4 de Clark Defense Systems permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
; FORCE
item_Desc_cds_combat_heavy_legs_01_02_02=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nTasa de purga de radiación: 251.1 REM/s\nCapacidad de carga: 6.5K µSCU\n\nCuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. La armadura pesada ADP-mk4 de Clark Defense Systems permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
; FORCE
item_Desc_cds_combat_light_core_02_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -32 / 62 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\nMochilas: Ligera\n\nLa búsqueda de CDS por crear la armadura ligera ideal continúa con la FBL-8a. Esta armadura ligera te mantendrá ágil gracias a su mezcla estratégica de placas protectoras y tejidos de nanoentramado reforzados. Aunque la armadura funciona con cualquier subtraje, fue diseñada específicamente para combinar con el subtraje FBL-8u, con especial atención a cómo encajan ambos para hacer el conjunto lo más aerodinámico y ágil posible.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
; FORCE
item_Desc_cds_combat_light_core_03=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -32 / 62 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\nMochilas: Ligera\n\nBasado en la armadura de combate FBL-8a de CDS, este conjunto ha sido modificado respecto a su forma original. Esta armadura ligera te mantendrá rápido en tus pies con su mezcla estratégica de placas protectoras y tejidos de nano-malla reforzados. Aunque la armadura funciona con cualquier subtraje, fue diseñada específicamente para ajustarse al subtraje FBL-8u con especial atención en cómo encajan ambos para que el conjunto sea lo más aerodinámico y sensible posible.
