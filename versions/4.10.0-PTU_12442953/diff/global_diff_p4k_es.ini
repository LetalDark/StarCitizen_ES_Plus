item_Desc_slaver_armor_medium_01_core=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 7.5K µSCU\nMochilas: Media, Ligera\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Su placa corporal se basa en el mismo subtraje de CDS que usan los Marines de la UEE, y añade piezas reconstruidas del Omni-Role mkII para brindarte una protección sólida frente al fuego entrante, pero la auténtica joya es el casco modificado. Esa pieza se construyó para aguantar explosiones, así que debería protegerte de sobra frente a unos cuantos disparos. Todo el conjunto también se ha probado razonablemente contra el vacío, así que puedes hacer AEV cuanto quieras sin preocuparte por morir.
; FORCE
item_Desc_slaver_combat_heavy_arms_01_02_01,P=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -72 / 102 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nIncorporando los mismos conocimientos y experiencia de fabricación en los que han llegado a confiar los Marines de la UEE, Clark Defense Systems ha diseñado su línea civil de armaduras pesadas Defiance para plantar cara incluso ante los escenarios de combate más adversos, con su placa protectora de tres estrellas y su marco de movilidad totalmente integrado.\n\nLa edición Ultimatum presenta la característica iconografía en rosa neón de la banda Nine Tails.
