item_desc_gys_undersuit_01_01_12=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nAventúrate con confianza en lo desconocido con el subtraje Deep-Space. Diseñado de forma inteligente con varias secciones superpuestas para garantizar su integridad, Gyson ha creado un subtraje asequible y con estilo que ayuda a hacer que los viajes espaciales sean más accesibles para todos.\n\nLa versión Shutdown presenta colores negros y grises con detalles en metal oscuro.
; FORCE
item_desc_gys_undersuit_01_01_13=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nAventúrate con confianza en lo desconocido con el subtraje Deep-Space. Diseñado de forma inteligente con varias secciones superpuestas para garantizar la integridad del traje, Gyson ha creado un subtraje asequible y con estilo que ayuda a hacer los viajes espaciales más accesibles para todos.\n\nLa versión Bruiser presenta colores carmesí oscuro y azul medianoche con detalles en metal pulido.
; FORCE
item_desc_gys_undersuit_01_01_14=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nAventúrate con confianza en lo desconocido con el subtraje Deep-Space. Diseñado de forma inteligente con varias secciones superpuestas para garantizar la integridad del traje, Gyson ha creado un subtraje asequible y con estilo que ayuda a hacer los viajes espaciales más accesibles para todos.\n\nLa versión Brassy presenta un color blanco con detalles en bronce.
; FORCE
item_scraper_GRIN_Large_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo raspador\nVelocidad de extracción: 0.05\nRadio: 6m\nEficiencia de extracción: 60%\n\nRaspe más casco en una sola pasada con el módulo raspador Trawler. Si bien el área de efecto es mayor que la de otros módulos, es menos eficiente debido al calor intenso que genera más quemaduras. Convirtiendo al Trawler en el módulo ideal para usar cuando un trabajo requiere velocidad sobre eficiencia.
; FORCE
item_scraper_GRIN_Small_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo raspador\nVelocidad de extracción: 0.6\nRadio: 1.5m\nEficiencia de extracción: 100%\n\nCinch es un módulo raspador de precisión que produce un pequeño y enfocado rayo perfecto para extraer recursos de cada rincón y rendija de un casco. Aunque el tamaño relativamente pequeño del rayo requiere más tiempo para eliminar el Material Compuesto Reciclado (RMC), su excelente velocidad de extracción hará que el esfuerzo adicional valga la pena.
; FORCE
item_scraper_GRIN_Standard_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo raspador\nVelocidad de extracción: 0.15\nRadio: 3.5m\nEficiencia de extracción: 90%\n\nEs fácil ver por qué el Abrade de Greycat Industrial es uno de los módulos raspadores más utilizados en el verso. Su diseño ofrece tanto un área de efecto considerable como una velocidad de extracción respetable, creando un rayo fiable que puede raspar cascos de manera rápida y eficiente.
; FORCE
