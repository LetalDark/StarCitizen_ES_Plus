item_Desc_slaver_combat_light_legs_01_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 2.5K µSCU\n\nDiseñado para ser un traje de combate ligero apto para AEV, el conjunto Calico es la armadura perfecta para infiltradores, francotiradores, ladrones, básicamente cualquiera al que le guste evitar echar puertas abajo. Fabricado a partir de una combinación de armadura PAB3 y un casco personalizado, puede ayudarte a resistir algo de fuego entrante sin frenarte.\n\nLa edición Ultimatum presenta sutiles acentos rosa neón de Nine Tails a lo largo de toda la armadura.
; FORCE
item_Desc_slaver_combat_medium_core_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 7.5K µSCU\nMochilas: Media, Ligera\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Su placa corporal se basa en el mismo subtraje de CDS que usan los Marines de la UEE, y añade piezas reconstruidas del Omni-Role mkII para brindarte una protección sólida frente al fuego entrante. Todo el conjunto también se ha probado razonablemente contra el vacío, así que puedes hacer AEV cuanto quieras sin preocuparte por morir.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
; FORCE
item_Desc_slaver_combat_medium_helmet_01_02_01,P=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Construido originalmente para resistir explosiones, debería protegerte perfectamente de algunos disparos. Además, todo el conjunto se ha probado razonablemente contra el vacío, así que puedes hacer todo el AEV que quieras sin preocuparte por morir.\n\nLa edición Ultimatum presenta la característica iconografía en rosa neón de la banda Nine Tails.
; FORCE
item_Desc_slaver_combat_medium_legs_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4.5K µSCU\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Su placa corporal se basa en el mismo subtraje de CDS que usan los Marines de la UEE, y añade piezas reconstruidas del Omni-Role mkII para brindarte una protección sólida frente al fuego entrante. Todo el conjunto también se ha probado razonablemente contra el vacío, así que puedes hacer AEV cuanto quieras sin preocuparte por morir.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
; FORCE
item_Desc_slaver_undersuit_armor_01_01_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl Stoneskin de Kastak Arms es un subtraje de combate basado en el famoso sistema TCS-4 de CDS, desarrollado a partir de la extensa retroalimentación de los operadores que confían en esta tecnología en el campo. Ofreciendo una gran variedad de opciones para armadura y capacidades EVA, el Stoneskin está listo para competir con CDS como un subtraje resistente y confiable.
; FORCE
item_Desc_srvl_undersuit_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nCon la misma construcción relativamente fiable que el casco Why Not, el Second Life toma algunos de esos subtrajes viejos y desgastados y les da nueva vida.
; FORCE
item_Desc_srvl_undersuit_02_01_01=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nCosido de forma tosca a partir de una variedad de materiales saqueados, el subtraje Wastelander cumplirá con su cometido.
; FORCE
item_Desc_srvl_undersuit_02_01_02=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nCosido de forma tosca a partir de una variedad de materiales saqueados, el subtraje Wastelander cumplirá con su cometido. Esta versión presenta un llamativo color óxido.
; FORCE
item_Desc_srvl_undersuit_helmet_01=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\n\nQue un casco esté roto no significa que sea inútil. Este casco de subtraje recuperado debería ofrecer protección adecuada contra el vacío. Si te gusta arriesgar, arriesga con este. ¿Por qué no?
; FORCE
item_Desc_syfb_flightsuit_helmet_01_01_01=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de purga de radiación: 81 REM/s\n\nAdaptado por Syang Fabrication para satisfacer los requisitos únicos de la fisiología humana, el casco Xanthule recrea fielmente la audaz silueta preferida por los Xi'an. Cuando se combina con el traje Xanthule, crea un aspecto distintivo y llamativo.
