item_Desc_cds_combat_superheavy_helmet_01_01_02,P=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nSiembra el caos como nunca imaginaste manteniendo la cabeza intacta con el casco BUL-H4. Con un visor facial completo y un blindaje metálico reforzado, además de acolchado interno adicional para mantenerte cómodo, no solo a salvo, te convertirás en una fuerza a tener en cuenta. El visor es compatible con la retícula AR.\n\nLa edición Stronghold presenta la feroz simbología de la banda Nine Tails con llamativos detalles en rosa neón.
; FORCE
item_Desc_cds_combat_superheavy_suit_01_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\n\nRedefine la protección personal con la serie BUL-H4. Utilizando polímeros sintéticos avanzados, los impactos se mitigan significativamente, transformando a quien la lleva en un baluarte defensivo. La estructura asistida por energía de la armadura ayuda a mantener la movilidad, compensando el peso considerable del traje.
; FORCE
item_Desc_cds_combat_superheavy_suit_01_04_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\n\nRedefine la protección personal con la serie BUL-H4. Utilizando polímeros sintéticos avanzados, los impactos se mitigan significativamente, transformando a quien la lleva en un baluarte defensivo. La estructura asistida por energía de la armadura ayuda a mantener la movilidad, compensando el peso considerable del traje.\n\nLa edición SteelTek presenta un reluciente acabado plateado metálico con un patrón mercurial que recorre toda la superficie.
; FORCE
item_Desc_cds_combat_superheavy_suit_02_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\n\nRedefine la protección personal con la serie BUL-H4. Gracias al uso de polímeros sintéticos avanzados, los impactos se mitigan de forma significativa, convirtiendo al usuario en un baluarte defensivo. El armazón asistido por energía de la armadura ayuda a mantener la movilidad, compensando el elevado peso del traje.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
