RAIN_CollectResources_storm_desc_002=A todos los contratistas disponibles,\n\nEn Rayari no escatimamos esfuerzos para detener la crisis actual de regeneración, pero para continuar con estas labores, nuestros científicos necesitan un recurso raro que los proveedores de la empresa no pueden conseguir.\n\nRayari busca un contratista experimentado para recolectar <EM4>perlas valakkar irradiadas</EM4>, que pueden extraerse de valakkar apex que han estado expuestos extensamente a la radiación. Nuestros escaneos han encontrado una población calificada dentro de la tormenta cerca de <EM4>~mission(Location)</EM4>. Debido a que estos animales son muy peligrosos, Rayari está dispuesto a compensar generosamente a quien pueda ayudar con la recolección de las perlas.\n\nUna vez obtenidas, por favor lleva estos valiosos recursos a <EM4>~mission(Destination|Address)</EM4>.\n\nJuntos podemos hacer el universo mejor para todos.\n\nNarina Lerrem\nGerente Senior\nSubcontratación de Investigación Clínica
; FORCE
RAIN_intro_desc_01=A todos los contratistas disponibles,\n\nRayari Incorporated está buscando contratistas independientes que puedan brindar apoyo adicional en nuestros esfuerzos por expandir los límites de la ciencia, la agricultura y la medicina dentro del Imperio y más allá. \n\nUna iniciativa de investigación en <EM4>~mission(Destination|Address)</EM4> necesita urgentemente recursos, por lo que buscamos un contratista confiable que pueda obtener y entregar estos componentes cruciales.\n\nPara más información sobre los materiales en cuestión, consulta "Guía del recolector" en tu diario.\n\nRayari ofrece salarios competitivos, además de la satisfacción de saber que estás ayudando a construir un universo mejor.\n\nCrezcamos juntos,\n\nNarina Lerrem\nGerente Senior\nSubcontratación de Investigación Clínica
; FORCE
