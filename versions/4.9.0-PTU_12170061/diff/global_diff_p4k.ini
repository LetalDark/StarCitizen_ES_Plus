mg_battaglia_blackbox_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: BLACK BOX RECOVERY\n\nWORK BRIEF: \nWe've received word that an M.A. affiliated vessel was recently reported destroyed. To make sure that those responsible are held accountable and Survivor Benefits are properly paid, we need you to retrieve the flight recorder from the wreckage site and deliver it to ~mission(Destination).\n~mission(Timed)\nPAYMENT:\nStandard listed rate upon delivery of black box.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_claimsweep_desc_001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: REMOVE THIEVES FROM ~mission(Location)\n\nWORK BRIEF: \nOne of our worksites over at ~mission(LagrangeLocation) got pinched. The legit miners were ousted and the dirtbags responsible rolled in, set up some nasty sentries, and began harvesting the claim for themselves. \n\nI need you to go in and clear out any trace of these stealing scum, orbital sentries and all, so that our people can get back to work.  \n\nPAYMENT:\nStandard listed rate upon successful removal of hostile threat.\n\nSPECIAL NOTES:\nThese orbital sentries pack a punch. See that you're outfitted properly to deal with them.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_deliver_ore_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ORE SAMPLE DELIVERY\n\nWORK BRIEF: \nYou are being contracted to bring a sample of ore from ~mission(Location) back to ~mission(Destination) for comparative mineral analysis.\n~mission(Timed)\nPAYMENT:\nStandard listed rate upon completion.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_escort_safety_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ARMED ESCORT\n\nWORK BRIEF:  \nAn urgent comm has arrived from a miner out near ~mission(Location). They picked up a possible threat in the area and are rightly concerned that they will not be able to make it to ~mission(Destination) without an armed ship escorting them.\n~mission(Timed)   \nPAYMENT:\nStandard listed rate once the miner is escorted to their final destination. If hostilities do occur, a combat pay bonus will be issued.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_escort_scan_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ARMED ESCORT\n\nWORK BRIEF:  \nA miner is in need of an escort while they scan ~mission(Complexity) around ~mission(Location) for possible new dig sites. You will be expected to protect them should any trouble arise. \n \nPAYMENT:\nStandard listed rate once the miner is escorted to their final destination. If hostilities do occur, a combat pay bonus will be issued.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco\n
; FORCE
mg_battaglia_escort_scan_desc_0002=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: ARMED ESCORT\n\nWORK BRIEF:  \nOne of our members needs an escort to watch their back at ~mission(Complexity) while they scan for potential dig sites around ~mission(Location). If anyone attempts to interfere with them, it'll be up to you to protect them. \n \nPAYMENT:\nStandard listed rate once the miner is escorted to their final destination. If hostilities do occur, a combat pay bonus will be issued.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_recover_cargo__desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CARGO RECOVERY AND DELIVERY\n\nWORK BRIEF: \nSadly, a crew carrying a valuable shipment ran into trouble while in transit. Although the ship was badly damaged, we believe that the cargo is still intact at the wreckage site. You are being contracted to travel to the wreck site, recover the cargo, and deliver it to ~mission(Destination).\n~mission(Timed)\nPAYMENT:\nStandard listed rate upon delivery of the cargo.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco\n
; FORCE
mg_battaglia_recover_cargo__desc_0002=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CARGO RECOVERY AND DELIVERY\n\nWORK BRIEF: \nAs has too often been the case these days, one of our crews ran into trouble and were forced to abandon ship leaving behind the valuable shipment they were transporting. You are being contracted to travel to the wreck site, recover the cargo, and deliver it to ~mission(Destination).\n~mission(Timed)\nPAYMENT:\nStandard listed rate upon delivery of the cargo.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_recover_stolen_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: STOLEN CARGO RECOVERY\n\nWORK BRIEF: \nAn outlaw by the name of ~mission(TargetName) attacked one of our remote mining outfits and managed to make off with a valuable haul. There is no way M.A. is going to let an attack on one our member stand like this. You are being contracted to find ~mission(TargetName|Last), recover the cargo by any means necessary, and deliver it to ~mission(Destination) so it can be returned to its rightful owners.\n~mission(Contractor|RecoveryTimed)\nPAYMENT:\nStandard listed rate upon return of the cargo.\n~mission(Contractor|RecoveryDanger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_recover_stolen_desc_0002=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: STOLEN CARGO RECOVERY\n\nWORK BRIEF: \nAn M.A. affiliate was recently attacked and robbed by an outlaw named ~mission(TargetName). Thankfully, another associate has tipped us off on ~mission(TargetName|Last)'s current location. You are being contracted to confront this bandit and recover the stolen property by any means necessary. Once in your possession, deliver the goods to ~mission(Destination) and we'll get them to their rightful owner.\n~mission(Contractor|RecoveryTimed)\nPAYMENT:\nStandard listed rate upon return of the cargo.\n~mission(Contractor|RecoveryDanger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_search_body_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CONFIRMATION OF MEMBER'S STATUS\n\nWORK BRIEF: \nAn M.A. member, ~mission(TargetName), was known to be working aboard a vessel that was just reported as destroyed. To make sure that Survivor Benefits are properly paid, you will be tasked with going to the vessel's wreckage site and confirming what exactly happened to ~mission(TargetName|Last).\n~mission(Timed)\nPAYMENT:\nStandard listed rate upon confirmation of ~mission(TargetName)'s status.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_search_crew_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CONFIRMATION OF MISSING CREW'S STATUS\n\nWORK BRIEF: \nAn M.A. affilliated vessel was recently reported destroyed. To make sure that Survivor Benefits are properly paid, you will be tasked with going to the vessel's wreckage site and confirming what happened to all the missing crew members.\n~mission(Timed)\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_battaglia_sectorsweep_desc_0001=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: CLEAR SECTOR OF HOSTILE THREAT\n\nWORK BRIEF: \nA group of outlaws operating in ~mission(Location) have made it impossible for miners to work in the area safely. In response, M.A. is hiring skilled operators to move through the sector and clear out any hostile forces there.\n\nPAYMENT:\nStandard listed rate upon successful removal of hostile threat.\n~mission(Danger)\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
mg_pacheco_assassin_sync_desc_001=A little while ago I got a not too subtle blackmail threat. We were able to track it down to two operators who go by ~mission(TargetName) and ~mission(TargetName2).\n\nYou're going to send a message about what we do to people who try to take advantage of us.\n\nForm a crew and hunt these bastards down. And because we can't risk them leaking the information they have, you need to kill both of them at the same time. \n\n~Mission(Danger) Make it so no one thinks about blackmailing us again for a long time.\n\n-Twitch
; FORCE
mg_pacheco_assassin_sync_desc_002=My employers want ~mission(TargetName) and ~mission(TargetName2) dead.\n\nMore importantly, they want them dead at the same time. \n\nCoordinate with some hired guns you trust to perform a simultaneous hit.\n\n~Mission(Danger) However it goes down, make it clean and don't let either of them get away. \n\n-Twitch
; FORCE
