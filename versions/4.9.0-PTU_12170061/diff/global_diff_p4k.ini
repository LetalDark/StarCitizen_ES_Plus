UWC_Refueling_easy_desc_001=Hey there,\n\nIf you're fitted for refueling, you might like this one. \n\nA beacon has just gone live at <EM4>~mission(Location|Address)</EM4>, from a client whose <EM4>~mission(Ship)</EM4> is in need of ~mission(FuelType), so make sure your pods are topped off.\n\nThe client vessel will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nLooks like a zero-drama one and done, but it never hurts to keep your scanners live.\nLet me know if you're interested and let's get these good people on their way.\n\nWaiting to hear from you,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"
; FORCE
UWC_Refueling_intro_desc_001=Hey!\n\nDD from the United Wayfarers Club here.\n\nThe UWC offers repair, rearming and refueling services across the UEE. It just so happens that we're on the look-out for new affiliates whose ships are fitted for refueling. If you've got the fuel pods and like it when people are pleased to see you, the UWC might be the club for you.\n\nAnd if you think it might be, I've got a live beacon you might like.\n\nIf you do happen to like it, a word to the wise: <EM4>make sure your fuel pods are full before you head out</EM4>.\n\nA Club member has run out of ~misssion(FuelType) at <EM4>~mission(Location|Address)</EM4>. I'm not sure on the details, like how they ended up out there with no Go Juice, but the UWC doesn't like to leave folk hanging.\n\nThe client vessel will pay you at the rate of ~mission(RefuelRequest). As a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nIt's a straightforward run. Perfect if you want to get a feel for this kind of job. Get out there, fill up the tanks of their <EM4>~mission(Ship)</EM4> and get them on their way. Do enough runs like this, and the process becomes muscle memory. Until then, there's a <EM4>journal entry</EM4> on your mobiGlas called "Refueling Protocols" that covers the basics.\n\nThere have been no reports of outlaw activity in that sector, but stay alert. I always recommend you aim for a fast turnaround. The sooner you're done, the sooner I can fix you up with another contract. UWC's always looking for new affiliates. \n\nLooking forward to working with you.\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"
; FORCE
UWC_Refueling_multiple_med_desc_001,P=Hey again,\n\nI've got a beacon at <EM4>~mission(Location|Address)</EM4> and this one's a bit more complicated than usual. Got small convoy of ships requesting ~mission(FuelType). Impressive coordination and lack of planning to all need refueling at the same time. \n\nThe client will pay you at the rate of ~mission(RefuelRequest), and as a United Wayfarers Club contractor, you will also qualify for the UWC service fee listed above upon completion.\n\nHopefully since the area they're in is pretty safe, there shouldn't be too much trouble lurking, but these days you never know. Wouldn't hurt to get them back flying again as quick as you're able.\n\nHappy trails,\n\nDina Deloit\nDispatch Hub\nUnited Wayfarers Club\n"We’ve got your back"
; FORCE
UWC_Refueling_multiple_med_title_001=URGENT CONVOY REFUEL
; FORCE
Vaughn_EliminateSpecific_FPS_storm_H_desc_003=A previous target I had thought to have been eliminated seems to have resurfaced as a hired merc over at <EM4>~mission(Location)</EM4> working for ASD. While I am supremely disappointed with the contractor who claimed to have eliminated <EM4>~mission(TargetName|Last)</EM4>, I'm going to re-open the original contract and give it to you to finish it.\n\nThey are currently stationed at an operational facility, so they will not be alone. Use your discretion in executing the contract, but know that <EM4>~mission(TargetName)</EM4> is the priority.\n\nI trust you'll do better than my former subcontractor,\n\nVaughn
; FORCE
Vaughn_EliminateSpecific_FPS_storm_H_desc_004=Have a difficult contract for a discerning operative. Target's name is <EM4>~mission(TargetName)</EM4>. They're currently working as hired security for Associated Science & Development and posted at <EM4>~mission(Location)</EM4>, a far cry from their previous career as a syndicate enforcer and bagman.\n\nI'll need you to get in and take out <EM4>~mission(TargetName|Last)</EM4> which is easier said then done as they will undoubtedly be entrenched with other corporate security forces, but I believe you'll figure it out.\n\nAll the best,\n\nVaughn
; FORCE
Vehicle_DescGRIN_UTV=Manufacturer: Greycat Industrial\nFocus: Passenger\n\nThe Greycat UTV is a durable, utility buggy designed to transport light cargo loads across rugged terrain. Whether you’re coordinating freight storage or making a supply run to a neighboring outpost, the straightforward design of the UTV allows operators to focus on tackling the job at hand.
; FORCE
crafting_machineName_fabricator_standard_AA=RediMake Item Fabricator AA Support
; FORCE
destroyItems_BombingRunItem=Fuel Tanks
; FORCE
fleetweek2950_holoviewer_g12_desc=While larger vehicles like the Tumbril Nova and Anvil Ballista may be better known for their military might, the UEE deploys thousands of smaller tactical vehicles in defense of the Empire. More easily transported to provide greater mission flexibility, these rovers and grav-levs often allow tactical responsiveness to a wider variety of terrain and scenarios. When atmospheric conditions become hostile and can impede flight, having a varied motor pool at your disposal can make all the difference.\n\nOne of the newest rovers to join the ranks is the G12a from Origin Jumpworks. While it may have the sleek lines the manufacturer is known for, the G12a is reinforced with heavier armor and fortified wheels, and comes armed with a full defensive and offensive suite. When deployed, it will initially serve as a patrol vehicle for landing sites located in active combat areas with severe weather patterns.\n
; FORCE
harvestable_Armillaria_Lev_desc=First discovered in the sewer lines at the QV Mining Station built into the Delamar asteroid in Nyx, this quick growing fungus has become a useful manufacturing component for the settlers of Levski thanks to the strong mycelium fibers that can be dried and used in a variety of ways.
; FORCE
headhunters_Nyx_bombingrun_M_desc_001=Seems we got a bit of competition out here in Nyx. Scouts have spotted a gang holding up at  <EM4>~mission(Location|Address)</EM4>.\n\nNow, I'm a fair man. I sent these nullbrains a message saying they either vacate the facility or we make them wish they had, and they made their choice. So now I need you to fly over there and blow the life out of the fuel tanks. Let's see how long they stick around without them.\n\n-Stows out
; FORCE
headhunters_bombingrun_S_desc_001=We've heard news that a new gang are planning an attack on a place over at <EM4>~mission(Location|Address)</EM4>. They figure if they can take out the fuel supplies there then it's theirs for the taking.\n\nBut little do they know that we're gonna send you in first to blow the fuel tanks so we can claim the place before they do. If it all goes to plan, we can clear the location out and stick it to that gang at the same time. Two birds, one stone.\n\nOnly problem is this place is armed to the teeth. Bring a crew and get those fuel tanks out of action. We'll take care of the rest.\n\n-Stows out
; FORCE
headhunters_bombingrun_VE_desc_001=Headhunters didn't get to be what it is today by playing nice. We've tracked down the hideout of a bunch of scraggy upstarts that have been making inroads into our territory. Need you to send a message.\n\nHead to <EM4>~mission(Location|Address)</EM4> and blow the crap out of their fuel tanks. They'll think twice about muscling in on our operations when their ships are grounded.\n\n-Stows out
; FORCE
headhunters_bombingrun_multi_E_CFP_desc_001=Every day it seems like Citizens for Prosperity is out here trying to snatch up more people for their shitty little cause and make life more difficult for hardworkin' folks like ourselves. \n\nI figure they could use a reminder about who really is in charge here. Head to ~mission(Location|Address) and really mess the place up. \n\nNothing like a bit of property damage to get a point across.\n\n-Stows out
hud_turret_position_change_in_progress=Repositioning Turret ...
