
; --- Engine-referenced refueling strings retired by CIG (restored from prev build) ---
Hint_RefuelingProvider_RefuelingProcess=Target the refueling ship with ~action(spaceship_targeting_advanced|v_target_cycle_in_view_reset) and send a docking request using ~action(spaceship_movement|v_toggle_docking_request). Be sure to align your ship behind the nozzle of the refueler.
Hint_RefuelingProvider_Undocking=When refueling is complete, undock using ~action(spaceship_movement|v_toggle_docking_request).
Hints_Refueling_RequestDocking=To send a docking request to the client's ship you're targeting use ~action(spaceship_movement|v_toggle_docking_request).

