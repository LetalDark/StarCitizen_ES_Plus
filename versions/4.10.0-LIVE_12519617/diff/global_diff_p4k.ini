Foxwell_DefendDestructibleEntites_E_Desc_001=Any willing pilots in the area? Need some protection around <EM4>~mission(Location|Address)</EM4> for a client. A band of outlaws has been targeting their <EM4>~mission(Objects)</EM4>, and if nothing's done about it they'll do some real damage. Need someone to protect the client’s property as much as possible and deal with the thugs.\n\nFrom the intel we’ve managed to gather, these thugs are small-time but can cause some pain if you’re not careful. So, if you manage to nail this to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendDestructibleEntites_H_Desc_001=One of our high priority clients is under attack from a criminal gang targeting their <EM4>~mission(Objects)</EM4> in <EM4>~mission(Location|Address)</EM4>. The client’s assets are valuable, so we need to keep those safe at all costs, but I won’t kid – it’ll be a challenge and a half with these thugs determined to do some real damage. \n\nIf it were me, I wouldn’t hesitate to <EM>bring backup</EM4> to deal with them. They’re no joke, so we’re offering a well-earned <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor who deals with these guys successfully. \n\nBest of luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendDestructibleEntites_M_Desc_001=I'm hoping that you'll be able to provide protection services at <EM4>~mission(Location|Address)</EM4>. One of our high priority clients is having some real trouble with a band of outlaws targeting their ~mission(Objects). Need to be able to keep the assets as safe and intact as possible. Client’s expecting the service they pay for, so don’t mess this up or we might lose a loyal customer.\n\nFor now, we’re still a little in the dark when it comes to these outlaws, but if you manage to nail this to the Foxwell standards, we’re offering  <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendDestructibleEntites_S_Desc_001=An emergency contract just came through about a gang of violent thugs wreaking havoc on one of our VIP clients’ infrastructures. If available, we need you to rush to <EM4>~mission(Location|Address)</EM4> and defend the client’s extremely valuable <EM4>~mission(Objects)</EM4> at all costs. \n\nFoxwell is extremely aware of this group, so believe me when I say these pilots are not to be taken lightly. I strongly recommend that you arrange a <EM> highly competent backup force</EM> to fly with you to the site.\n\nIf you manage to survive the encounter with the client’s property intact, we’re adding  <EM4>~mission(ScripAmount) MG Scrip</EM4> any main contractor brave enough to take this job on. \n\nStay safe, and good luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendDestructibleEntites_VE_Desc_001=Calling all pilots – one of our clients is looking for some protection for their <EM4>~mission(Objects)</EM4>, based in <EM4>~mission(Location|Address)</EM4>. From what we’ve gathered, the attackers are a group of wannabe outlaw pests who probably haven’t realized the value of the assets they’re trying to destroy, just wreaking havoc for the sake of it. Still, the client’s property is important, so should be kept as intact as possible.\n\nIf you take care of them to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendDestructibleEntites_VH_Desc_001=Urgent ship support needed at <EM4>~mission(Location|Address)</EM4>. A known destructive criminal organization has been testing the waters with one of our clients’ property for months, and has now raised hell by targeting the client’s <EM4>~mission(Objects)</EM4>. These assets are highly valuable, so need to keep those safe at all costs – though we know it’ll be no easy feat.\n\nI cannot stress enough how dangerous these guys are, so I wouldn’t hesitate to <EM>bring backup</EM> to deal with them. If you and the assets make it out intact, we’re offering a well-earned <EM4>~mission(ScripAmount) MG Scrip</EM4>  to the main contractor. \n\nBest of luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendEntitesAndEscort_E_Desc,P=We need a contractor to provide convoy and protection services at <EM4>~mission(Location|Address)</EM4>. One of our elite clients' are under attack from a band of outlaws targeting their <EM4>~mission(Objects) and ships</EM4>. You'll need to keep the crew safe as they traverse the area, as well as make sure the assets stay as intact. These thugs look like they can do some real damage, so be sure you engage them with caution or the client might not be the only one to take heavy losses.\n\nIf you manage to nail this to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> as compensation to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendEntitesAndEscort_H_Desc,P=Crew managing one of our client's operations at <EM4>~mission(Location|Address)</EM4> have reported that they're under attack from a criminal gang targeting the <EM4>~mission(Objects) and ships</EM4> in the area. It will be your job to keep both safe at all costs. I don't have all the facts yet, but I reckon this will be a tough mission – these outlaws seem determined to do some real carnage. \n\nIf it were me, I would <EM>bring backup</EM4> to deal with them. And if you manage to protect everyone, we’re offering a well-earned <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor who deals with these lowlife's successfully. \n\nBest of luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendEntitesAndEscort_M_Desc,P=We need a contractor to provide convoy and protection services at <EM4>~mission(Location|Address)</EM4>. One of our elite clients' are under attack from a band of outlaws targeting their <EM4>~mission(Objects) and ships</EM4>. You'll need to keep the crew safe as they traverse the area, as well as make sure the assets stay as intact. These thugs look like they can do some real damage, so be sure you engage them with caution or the client might not be the only one to take heavy losses.\n\nIf you manage to nail this to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> as compensation to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendEntitesAndEscort_S_Desc,P=An emergency SOS just came through from a maintenance crew under the employ of one of Foxwell's VIP clients. If available, we urge you to get to <EM4>~mission(Location|Address)</EM4> as soon as possible. While engaging with the attackers, you'll be expected to protect the client’s  <EM4>~mission(Objects) and of their ships that may need assistance</EM4>. \n\nThis is far from the first we've seen from these particular outlaws, so believe me when I say these pilots are not to be taken lightly. I strongly recommend that you arrange a <EM>highly competent backup force</EM> to fly with you to the site.\n\nIf you manage to successfully defend the client's interests, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> as compensation to the main contractor brave enough to take this job on. \n\nStay safe, and good luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendEntitesAndEscort_VE_Desc,P=For any pilots in the area – a group of bandits is targeting one of our clients at <EM4>~mission(Location|Address)</EM4>, specifically their <EM4>~mission(Objects)</EM4> and the maintenance ships that manage them. From our intel, it's only a few outlaws trying to make some quick credits, but they're also the type to cause some real damage if you get in their way.\n\nIf you take care of them and relocate the client's ship and crew safely, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendEntitesAndEscort_VH_Desc,P=Urgent ship aid needed at <EM4>~mission(Location|Address)</EM4>. A band of destructive criminal outlaws that have been trying to make a name for themselves recently has struck hard against one of our high priority clients, <EM4>attacking their ships and targeting the client's ~mission(Objects)</EM4>. It will be your job to keep everyone and everything safe – though it won't be an easy feat.\n\nI cannot stress enough how dangerous these attackers are, so be sure to <EM>bring backup</EM> to deal with them. If you, the crew, and the infrastructures make it out intact, we’re offering a generous sum of <EM4>~mission(ScripAmount)  MG Scrip</EM4> to the main contractor. \n\nBest of luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendLocation_E_Desc_001=Ships coming and going from <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are being targeted by hostile forces. The folks there have hired us to deal with this problem immediately.\n\nNeed someone to get there pronto and start fighting off these ships. The situation appears to be constantly evolving, so I’ll keep you updated on where you’re needed most. \n\nFor the hustle and effort, we’ll also be paying a bonus of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor for dealing with this.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendLocation_H_Desc_001=The folks at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> are under attack and need our support. Their ships in the wider area are being targeted and there’s a growing concern that this is only a precursor to something bigger.  \n\nThe situation is evolving, but I’m being fed constant updates on what’s going on and will keep you informed as the contract progresses. \n\nAre you available to come to their aid? Would be smart to recruit some friends to help. These are important clients and we can’t afford to fail them. The main contractor will earn a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> if you get the job done.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendLocation_M_Desc_001=We’ve got clients reporting outlaw attacks on ships around <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. They got locked down tight and anybody heading in or out is a target. Any attempts to solve the issue have just been met with more outlaw reinforcements appearing. \n\nThe client is desperate for a solution, so we’re hiring a contractor to go and restore peace in the area. If any other issues flare up once you're there, I’ll comm you directions on how to help.  \n\nReally need someone on this fast. So to sweeten the pot, the main contractor will also get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendLocation_S_Desc_001=Looking for a consummate professional to handle a high-stakes job. We’ve got VIP clients at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> who are facing extremely aggressive and motivated outlaws targeting ships around their location. Exact details on the attack are still rolling in, but it appears to be a wide ranging, multi-pronged operation. \n\nIf you’re available, I highly recommend that you bring additional combat support ships, plenty of supplies, and your A-game. Get this right, and we’ll reward the main contractor with a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendLocation_VE_Desc_001=Outlaw ships are harassing anyone attempting to land or leave our client’s operations at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4>. Need someone to fly there to defend the site and protect our client’s ships before the situation gets out of control. Get there, get after those aggressors, and I'll keep you updated on the situation. \n\nHelp take care of this and we'll pass along a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DefendLocation_VH_Desc_001=Ship support is needed at <EM4>~mission(DefendLocationWrapperLocation|Address)</EM4> immediately. Our client’s interests in the area are under fierce attack by outlaw forces. Looking for someone who can grab their gear, a few support ships they can trust, and deploy before it’s too late. Once you arrive, I’ll send any sitrep updates your way.  \n\nDon’t mess this up. These clients are paying for and expecting top tier protection. If anything goes wrong, we could lose this contract. That’s why we’ll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> if all goes down without a hitch.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DestroyNarcotics_E_desc_001=Some folks will do anything for a few creds. There’s a group of upstart outlaws over at <EM4>~mission(Location|Address)</EM4> that have decided to start manufacturing drugs. Turns out they’re not too good at it, or maybe a little too good. The junk they’re pumping out is stronger than the normal stuff and a real danger to anyone who uses it. \n\nWe’ve been hired to knock out their operation and destroy whatever drugs stashes are on site. Armed guards are protecting the place, but they don’t seem too skilled. Our surveillance teams observed one of them almost shoot himself in the foot. Can’t say for certain, but odds are they won’t give a pro like you too many problems.  \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DestroyNarcotics_H_desc_001=Reports of a spike in drug overdoses around Stanton has security services worried. Seems like some two-bit crew is juicing their profits by cutting their stuff with toxic chemicals. Shutting down this crew and stopping the distribution of their drugs has become a top priority.\n\nA Foxwell informant has revealed that part of this crew has currently set up shop at <EM4>~mission(Location|Address)</EM4>. Hiring a contractor to hustle over there and destroy whatever drugs they’ve got stashed before they’re spread across the system. Better be careful though, word is this crew is armed to the teeth and determined to profit off that poison no matter what.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_DestroyNarcotics_M_desc_001=We’ve been contracted to take care of a problem at <EM4>~mission(Location|Address)</EM4>. There’s been a recent surge of activity in the area tied to the drug trade. It appears to be a well-run operation and there’s a growing concern that it’ll expand wider if not stopped. Any chance you’re available to make sure that doesn’t happen?   \n\nJob is pretty straightforward. Head to the site and destroy their stash of drugs. That way they won’t have the creds to expand their operations any further. I wouldn’t expect them to make this easy on you though. Armed guards are regularly seen around the facility, so be sure you’ve got enough gear to deal with them too. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateAll_Allies_desc_001=Got word that outlaws are attempting to overrun <EM4>~mission(Location|Address)</EM4>. There’s local security forces there, but they’re struggling to stop that attack.\n\nNeed a contractor to hustle there and help take care of the aggressors. Bring plenty of gear, and be careful when engaging targets. Don’t want to hear about any security team members getting caught in your crossfire.    \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateAll_NonHostiles_desc_001=We’ve been contracted to take care of a delicate situation. A gang has settled into <EM4>~mission(Location|Address)</EM4> that we need to get cleared out. Only issue is that there’s still some civilians there too. \n\nLooking for someone with the skills and good trigger sense to get rid of those outlaws without harming any innocent people. If that’s you, grab your gear and get over there. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateAll_OLP_M_desc_001=We’ve been following a group of outlaws on behalf of a client, and it looks like they’ve taken a permanent pit stop on an old orbital platform. \n\nWe’re looking for a contractor who can head over to <EM4>~mission(Location|Address)</EM4> and neutralize the targets. The platform is crawling with a bunch of armed and dangerous thugs, so we’ve designated this a yellow level contract.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateAll_PAF_M_desc_001=We’ve been tracking a group of outlaws who’ve been causing trouble for one of our clients. Seems they’ve taken up residence at an old Hathor facility. Don’t know what their plans with that old facility are but our client is eager to have them taken care of.\n\nLooking for someone to go to <EM4>~mission(Location|Address)</EM4> and neutralize these targets.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateAll_desc_001=Looking for someone willing to take out the trash at <EM4>~mission(Location|Address)</EM4>. Guess a gang has settled in without the permission of the owners. So they’ve hired us to get them out whatever way we see fit. \n\nI’d bring plenty of ammo, if I were you. Doubt they’ll want to leave willingly. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateSpecific_NonHostiles_desc_001=Got a line on a bounty named <EM4>~mission(TargetName)</EM4>. Someone spotted them along with known criminal accomplices at <EM4>~mission(Location|Address)</EM4>. Need you to get there before they get going. \n\n<EM4>~mission(TargetName|Last)</EM4> has a reputation for only showing their face in places with civs. Really need you to take down this bounty without there being any civilian collateral damage. Foxwell can’t afford to be caught in the shitstorm that would erupt over the loss of innocent life. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_EliminateSpecific_desc_001=Looking to execute a bounty on <EM4>~mission(TargetName)</EM4>. We’ve learned that they’re currently hiding out with some confederates at <EM4>~mission(Location|Address)</EM4>. \n\nI’d be prepared to deal with the lowlifes hanging around <EM4>~mission(TargetName|Last)</EM4>, but our only real concern is that you land the target. \n    \n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_HaulCargo_AToB_OLP_desc_01=Looking for a contractor with the right skills and ship for an important mission. Outlaws ambushed a Hull C carrying a <EM4>~mission(CargoGradeToken)</EM4> load of cargo and took it to <EM4>~mission(Location|Address)</EM4>. We’ve been hired to get it all back.  \n\nThe cargo is being stored somewhere at a defunct Hathor facility. The place is big and crawling with outlaws. Need someone to retrieve the goods from the freight elevator there and deliver it all back to the <EM4>freight elevator at ~mission(Destination|Address)</EM4>. Don’t think this will be a walk in the park. Bring lots of ammo and a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. \n\nIt also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_HaulCargo_AToB_PAF_desc_01=A crew recently raided a distribution center and made off with <EM4>~mission(CargoGradeToken) load of cargo</EM4>. Foxwell has been hired to get all those goods back. We’re getting reports of these outlaws using old Hathor facilities as stash houses and we believe the stolen items are currently at <EM4>~mission(Location|Address)</EM4>.\n\nIf interested, you’ll need a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>. Doubt you’ll be able to slip in and out of that PAF without being noticed either, so best be prepared to clear the location. Once safe, grab the goods from the freight elevator and deliver them to the <EM4>freight elevator at ~mission(Destination|Address)</EM4>. \n\nIt also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_HaulCargo_MultiToSingle_desc_01=Something weird is going on at the old Hathor mining facilities. Both the platform alignment facilities and orbital laser platforms have been abandoned and gathering dust for decades, but outlaws have started using them as a base of operations.\n\nWe’ve been hired by a concerned party who’s recently lost a lot of important cargo to one such gang. Currently, their stuff is stashed at <EM4>~mission(Location1|Address)</EM4> and <EM4>~mission(Location2|Address)</EM4>, but there’s a growing fear that the gang may be offloading their goods soon. That’s why we’ve been hired to hit both of those Hathor facilities, retrieve the cargo from the freight elevators, and bring it to the freight elevator at <EM4>~mission(Destination|Address)</EM4>. \n\nHere’s the specifics on what to grab from each location. Doesn’t matter in what order you do this, as long as it all gets collected and delivered. Just be sure to bring a ship that can handle <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4>.  It also wouldn't hurt to bring a <EM4>handheld tractor beam</EM4> with you.   \n\n~mission(MultiToSingleToken)\n\nFoxwell hasn’t been able to scout these locations, but if I were you, I’d expect to face some serious armed resistance. Best bring a bunch of gear and some friends.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_Mercenary_Intro_desc_001=Are you an experienced contractor looking to increase your income with some security work? Or maybe you’re new to the field and are looking for some hands-on experience? \n\nFoxwell Enforcement are looking for enthusiastic new contractors to help with local law enforcement. To see if you’re the right fit for us, we’d like for you to head over to <EM4>~mission(Location|Address)<EM4> and support the security forces on site. Local gang members have been giving that spot problems. Help the local forces take care of these outlaws to qualify for more contract opportunities with Foxwell.\n\nContractors are employed on a strictly freelance basis. Foxwell expects contractors to supply their own weapons and armor and does not accept any responsibility for any injuries, damages, or deaths accumulated during the contract.\n\nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_Mercenary_Rehire_desc_001=Due to a corporate restructuring, Foxwell has some new vacancies that need to be filled immediately. Foxwell knows you’ve previously expressed interest in this line of work, and we’re wondering if you would want to take another crack at a contract.\n\nOne of our clients needs support at <EM4>~mission(Location|Address)</EM4> where their security forces are struggling to handle an outlaw incursion. Head there and help the local forces get rid of the problem before it’s too late. \n\nSuccessfully complete this contract, and Foxwell would be happy to send more work your way.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_RetrieveCargo_OLP_desc_001=Got an interesting one here. Outlaws ambushed a supply convoy and made off with some vital cargo. All signs point to this being a professional job. They didn’t leave any witnesses, grabbed specific pieces of cargo, and left the less valuable stuff. Their one mistake was forgetting to check the cargo for trackers. The cargo is now sitting at <EM4>~mission(Location|Address)</EM4>, and we’ve been contracted to get it back promptly. \n\nLooking for someone to retrieve the stolen cargo from the orbital platform and bring it to <EM4>~mission(Destination|Address)</EM4>. Designated a red level contract because you’ll have to go up against some real pros to get the goods back. Credits will be paid upon the return of the cargo.\n  \n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_RetrieveCargo_PAF_desc_001=Got a contract here for anyone looking for something heavy. Foxwell’s been hired to track down a load of important cargo stolen from a local distribution center. Our investigation tracked the goods and the culprits to <EM4>~mission(Location|Address)</EM4>.  \n\nWe need someone to go retrieve the stolen cargo and return it to the rightful owners at <EM4>~mission(Destination|Address)</EM4>. Those old platform alignment facilities are quite big and we aren’t sure exactly how many outlaws will be there, so be careful. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.\n
; FORCE
Foxwell_SecurityPatrol_E_Desc_001=Need someone to knock out a security patrol. You’ll need to go to the <EM4>location marker</EM4> on your HUD and then scan several designated waypoints ensuring that they’re safe and secure. \n\nSatellites in that region have been acting up recently. Not exactly sure what’s going on out there, but best be prepared in case there’s any trouble.\n\nComplete this contract and the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_SecurityPatrol_H_Desc_001=Several unknown ships have been spotted in areas frequented by haulers delivering goods for our client. They’re worried these ships are monitoring their haulers in preparation for an ambush, so they’ve hired us to patrol the area. \n\nStart by going to the <EM4>location marker</EM4> on your HUD and scan it to ensure it’s clear. After that, we’ll send you to some other areas to scan for potential threats. We recommend that you bring a <EM4>wingman</EM4> and plenty of supplies to be ready to handle whatever might come your way.     \n\nAlso know that successfully completing this contract will earn the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_SecurityPatrol_M_Desc_001=A client is concerned about activity near some of their interests. We’ve been contracted to patrol the area and run scans at several locations. Interested? If so, head to the <EM4>location marker</EM4> on your HUD to start the patrol.\n\nThe client wasn’t specific about the threats, but they don’t think everything’s on the level out there. Hopefully we’ll be able to bring them some peace of mind.\n\nAdditionally, the client arranged for us to offer a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor.\n\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_SecurityPatrol_S_Desc_001=Need a battle-hardened pilot for an important patrol. A prominent client is fed up with outlaws targeting their ships and satellites. We’ve been hired to scan the areas in question and deal with any hostile forces. The patrol begins at the <EM4>location marker</EM4> on your HUD before moving to a number of other locations we’ll expect you to clear.\n\nNot sure what you’ll run into out there, but based on intel shared by the client, they’re frequently seeing fighter groups of five to seven ships roaming the region. Some even have larger ships leading the charge. That means you better be ready for a serious fight. If you can, try to recruit at least <EM4>three friends</EM4> to the cause. Even a seasoned pilot will need all the help they can get against this crew.   \n\nSince this is going to be a tough one, the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> at the end of the patrol.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_SecurityPatrol_VE_Desc_001=Time to knock out a routine patrol for one of our long-term clients. The route is a series of waypoints that need to be visited and scanned to confirm everything’s as expected. Should be simple enough.  \n\nIf interested, please accept and head to the <EM4>location marker</EM4> on your HUD to start. Pull this off and the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_SecurityPatrol_VH_Desc_001=A client needs our help. Outlaws are roaming certain sectors where they do business and attacking anyone they come across. Our client has already lost several ships and can’t afford to lose anymore. \n\nWe need someone to patrol those areas and draw out any hostile forces. The job begins with you heading to the <EM4>location marker</EM4> on your HUD and scanning. Then we’ll share a handful of other patrol points for you to scan. \n\nFrom the sound of it, these packs of ships feature skilled and aggressive pilots. Best be ready to rumble if you run into any of them. Would be good to have at least <EM4>two trusted pilots</EM4> by your side for this one.\n\nAt the end of a successful patrol, the main contractor will get a bonus payment of <EM4>~mission(ScripAmount) MG Scrip.</EM4>\n\nStay chilly,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipAmbush_E_desc_001=An outlaw who’s been on the run finally returned to the system. Seems like they hoped that disappearing for a bit would make us forget about them. They’re not even trying to hide their identity or vary their routine which means we know exactly where they’re going to be.\n\nLatest intel indicates that they’re flying a <EM4>~mission(AmbushTarget)</EM4> and will be passing by <EM4>~mission(Location|Address)</EM4> soon. I’ve already scoped out an emission cloud that’s a perfect place for you to find cover, power down your ship, and wait. Only real variable is if they’ll be alone or not. We’ve heard they sometimes roll with friends that all fly single-seaters. Landing that first surprise strike will be important as this crew is battle-tested, but we’ll have reinforcements at the ready to provide support if you need them.\n\nGet this done and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipAmbush_H_desc_001=Recently, a <EM4>~mission(AmbushTarget)</EM4> baited Foxwell forces with a bogus rescue beacon. By the time our forces realized what was happening, a squad of ships unleashed a devastating attack and only one Foxwell contractor survived. Their scan logs identified the bait ship, and we’ve had scouts monitoring them ever since.\n\nOur surveillance has revealed the squad has a regular flight pattern that we think we can exploit. There’s a sizable emission cloud at <EM4>~mission(Location|Address)</EM4> that makes it an ideal spot to post up. Think you have what it takes to handle this for us? \n\nIt’ll be you against the <EM4>~mission(AmbushTarget)</EM4>, other large craft, and a sizable escort. Wish I could be more specific than that but this crew regularly rotates ships in and out of the squad. Would be smart to bring some support, so you don’t get overwhelmed by their numbers.   \n\nComplete the job and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipAmbush_M_desc_001=Foxwell has been tracking a <EM4>~mission(AmbushTarget)</EM4> used by outlaws and discovered a pattern to its movements. The ship should be passing by <EM4>~mission(Location|Address)</EM4> soon.\n\nLooking for a contractor willing to hustle there, hide in the emission cloud, and then spring the trap when the time is right. There’s usually escort ships with the <EM4>~mission(AmbushTarget)</EM4>. Careful not to jump the gun and blow your cover. The element of surprise is crucial from what I’ve read.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipAmbush_S_desc_001=We’ve received a handful of comms about recent attacks undertaken by an <EM4>~mission(AmbushTarget)</EM4> and its escort ships. After opening a file, we started tracking the ship’s movements and noticed that it frequently passes an emission cloud near <EM4>~mission(Location|Address)</EM4>. We want to use that to our advantage to launch a surprise attack. \n\nOnce on site, you should hide in the emission cloud to cloak your signature enough to allow you to make the first strike. Unfortunately, Foxwell can’t provide additional reinforcements for this operation, so you’ll be responsible for bringing any support forces. You might need the help too. The crew of the ~mission(AmbushTarget) is aggressive and battle hardened.        \n\nYou get this taken care of for us and there's a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> in it for the main contractor.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipAmbush_VE_desc_001=Care to help us ghost a bad guy? \n\nWe’ve been hired to hunt down an outlaw flying a <EM4>~mission(AmbushTarget)</EM4>. Shouldn’t be too hard since they take the same flightpath each day. That makes them a prime target for an ambush if I ever saw one. I’ve analyzed the route and determined that <EM4>~mission(Location|Address)</EM4> is the ideal spot to strike. There’s an emission cloud there that’ll be perfect to hide your ship’s signature while you wait.   \n\nJob is simple if you’re interested. Head to the location, hide out, power down, and then wait for them to fly by. Sometimes they roll alone but they often have other single-seat ships with them. Shouldn’t be too hard to handle for a pro. Plus, we’ll still have reinforcements nearby and ready to deploy once it pops off.\n\nPull this off and we'll give the main contractor a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4>.\n\nGood luck,\n\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipAmbush_VH_desc_001=Foxwell got word from an important client that outlaws have put together a squad that’s been stalking the system with sub-capital ships and escort fighters. Our client is concerned that if left unchecked, outlaws will create more of these attack squads and destabilize system security. We’ve been hired to wipe out this group before that happens. \n\nWe need a confident and skilled contractor for this task. Good news is that we have a plan in place. One of the ships used by this squad, a <EM4>~mission(AmbushTarget)</EM4>, was stolen from our client, who’s still able to track its movements. They’ve shared the location data with us and we’ve discovered that this squad often goes by <EM4>~mission(Location|Address)</EM4>. We’ve scouted the location and discovered a large emission cloud makes an ideal spot for an ambush.  \n\nNot going to lie, this isn’t going to be easy. We don’t have any additional forces available to deploy, so it would be good to bring your own support. \n\nYou manage to pull this off, I've arranged for a bonus payment of <EM4>~mission(ScripAmount) MG Scrip</EM4> for the main contractor.\n\nGood luck,\n\nEugene Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_E_001=Okay, this might be a bit of stretch to do on your own, so if you got any favors to call in, it could be good to cash those chits now. There's a group of desperados striking delivery ships up and down this sector and we've been tasked with cleaning them up. \n\nOnce your crew is ready, head over to ~mission(Location|Address) and take the hostiles there down. Now, these bastards are a bit clever so they tend to split up into smaller packs. Make sure you wait around to clear every last one of them out.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives."
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_H_001=It seems that a couple of different small-time gangs have decided to pool their resources and start doing coordinated attacks. Alone, they weren't much, but all together they're proving to be a serious threat that has to be dealt with.\n\nRecruit some backup you can rely on and the fly over to ~mission(Location|Address). Once you attack the initial gang members you find there, the other groups will arrive to support them. Make sure you wait around to take out all of them.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_M_001=A splinter group of outlaws have broken off from one of the main gangs in the system and have been trying to strike out on their own. With the amount of trouble they've been causing its clear they're looking to establish a name for themselves as quickly as they can. It's going to be up to you and your support crew to put a stop to them.\n\nOnce your crew is ready, head over to ~mission(Location|Address) and engage with the gang. Not all of them will just be waiting there on site. Expect reinforcements to arrive once you begin your assault. Just be sure to stay until every last one of them has been take care of.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives."
; FORCE
Foxwell_ShipWaveAttack_ClearHostiles_Desc_VE_001=There's a small group of criminals that have been marking their territory, striking out any freighters that get close enough. They got a little too greedy though, because now someone's paying us to go deal with them.\n\nOnce you and whoever you're bringing are ready, go to ~mission(Location|Address) and engage with these criminals. Since they like to fly in separate packs, be sure you wait around to clear every last one of them out.\n \nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_destroyprobe_E_desc_001=A client has reported the presence of illegal surveillance monitors around <EM4>~mission(Location|Address)</EM4>. They’re extremely concerned that these monitors might be accessing sensitive information related to their operations.\n\nWe believe there are <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> that will need to be destroyed. Tracking them is difficult with their low EM signatures, so you will need to determine their exact location once you’re in the area.\n\nThese 'skimmers' are outfitted with security protocols that will trigger data transfers if they are directly attacked. Make sure that you destroy them before the upload can complete. Whoever planted these things will also be notified. If they have any forces in the area, don’t be surprised if they show up and try to stop you.\n   \n  \nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_destroyprobe_H_desc_001=Looking for someone to handle an issue one of our clients is having at <EM4>~mission(Location|Address)</EM4>. Guess someone has set up several illegal 'data skimmers' to steal sensitive info. Need them taken offline pronto. \n\nYou’ll need to scan the area to locate the <EM4>~mission(Contractor|DestroyProbeAmount)</EM4>, which will be tricky because of their low EM. Once found, destroy them quickly before their security override kicks in and they upload their datastores. Also, you should keep an eye out for hostile forces in the area, so plan accordingly.\n \n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_destroyprobe_M_desc_001=After a contractor successfully recovered data stolen from one of our clients, a security analyst verified that it was captured by unauthorized surveillance monitors illegally installed around <EM4>~mission(Location|Address)</EM4>. We’re looking for someone to follow up and take out those monitors.\n\nYou will need to find the <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> and destroy them before any more data can be gathered. Passive 'Skimmers' like these typically are hard to find so be thorough in your search.\n\nOnce attacked, their security protocols will cause them to begin transmitting the contents of their drives, so it’s imperative that you stop the upload before it can complete. There’s also a good chance that whoever’s responsible might be in the area, so be careful.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_destroyprobe_S_desc_001=One of our clients is growing frustrated that their convoys are coming under constant attack. We’ve increased patrols in the area and it looks like outlaws have placed 'skimmers' around <EM4>~mission(Location|Address)</EM4> hoping to steal important data, like flight routes and cargo manifests, from our client. \n\nWe need you to search the area, locate the <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> and destroy them. They use a passive form of data collection designed to keep their signature low, so they're going to be pretty hard to spot. Make sure that you scan the area carefully to find them. Once you attack one, they'll shift into emergency data transfer mode, which will make them easy to see once they start transmitting, just make sure you destroy them before they finish. \n\nIt’s also possible that when attacked, the outlaws will send some ships to respond. Best be on your game so you defend yourself and destroy those monitors before any data can successfully transfer. \n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_destroyprobe_VE_desc_001=<EM4>We’ve learned that local criminals are operating ~mission(Contractor|DestroyProbeAmount) around ~mission(Location|Address) to case potential targets.</EM4> Several of our clients operate in that area so it would be good to clear these out before they become a problem. \n\nThe monitors are designed to keep a low profile which means finding them will be a bit of a pain. You'll have to sweep the area to identify their exact location. Once you do that, destroy them. \n\nWhoever’s running these monitors probably might try to stop you. Also, they tend to rig these monitors with defensive protocols that automatically back-up the data when attacked. Once you start shooting, you'll need to finish the job quickly before the transfer is completed.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
Foxwell_destroyprobe_VH_desc_001=We got reports of illegal 'skimmers' over by <EM4>~mission(Location|Address)</EM4> that are targeting our client’s operations. The data collected could lead to all sorts of trouble, so we need the <EM4>~mission(Contractor|DestroyProbeAmount)</EM4> located and destroyed. \n\nEasier said than done, though. Monitors like this are designed to be unobtrusive, so spotting them won't be easy but once you scan the area and locate them, you can take them out. But be warned, as soon as you start attacking, it’ll trigger an emergency data transfer. It's important that you take them out before the upload can finish. \n\nThere’s also a good chance hostile resistance will show up and try to stop you. Better stay situationally aware out there so you don’t get surprised.\n\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
