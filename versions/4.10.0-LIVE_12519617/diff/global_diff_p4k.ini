ReccoBattaglia_RepUI_Biography=Recco Battaglia, the latest in a long line of miners, had continued the family tradition until an accident at a dig site left her unable to work. Frustrated with her post-accident treatment under the bureaucracy of the UEE and United Resource Workers, Recco moved out to Nyx where she now coordinates contractor operations for the People's Alliance.
