item_Desc_COMP_WLOP_S02_Baas=Item Type: Computer\nManufacturer: WillsOp\nSize: 2\nGrade: C\nClass: Civilian\n\nThe Baas from WillsOp gives you superior performance to deliver one of the fastest and comprehensive computational experiences.
; FORCE
item_Desc_GRIN_utility_medium_backpack_01=Item Type: Medium Backpack\nCarrying Capacity: 127.5K µSCU\nCore Compatibility: Medium & Heavy\n \nOriginally designed for miners, the Aril armor comes with an attachable backpack that can accommodate a variety of tools and supplies to keep your hands free. The Aril backpack is available in a variety of vibrant colors to fit your personal taste and for easy identification on the jobsite.
; FORCE
item_Desc_KeyCard_SOO_IFFI_2=A single use card that contains the codes for accessing the Nine Tails' Identity Friend and Foe Inverter on the Hartmoore platform.
; FORCE
item_Desc_Slaver_Undersuit_Armor_Shared=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nKastak Arms' Stoneskin series of combat undersuits are built upon CDS' famous TCS-4 system based on extensive feedback from the operators who rely on this technology in the field. Offering a myriad of options for armor and EVA capabilities, the Stoneskin is set to rival CDS as a rugged and reliable undersuit.
; FORCE
item_Desc_basl_combat_light_flightsuit_02_01_01=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nFeaturing a deceptively simple design, the Ace Interceptor flight suit is jet black with reinforced grey protective padding on the arms and legs. Basilisk's renowned craftsmanship make this flight suit durable and supremely comfortable, leaving no mystery as to why it's widely used by top pilots across the empire.
; FORCE
item_Desc_basl_combat_light_helmet_02_01_01=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nThe unique open-faced design makes the Ace Interceptor helmet a lightweight and liberating option for operating in atmosphere. It features precisely layered plating to protect the head from a variety of combat and environmental hazards and an impact resistant, anti-glare visor over the eyes. Visor is AR crosshair compatible.
; FORCE
item_Desc_cbd_hat_03_01_CFP_var2,P=PLACEHOLDER - cbd_hat_03_01_CFP_var2
; FORCE
item_Desc_cds_combat_heavy_core_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 10.5K µSCU\nBackpacks: All\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
; FORCE
item_Desc_cds_combat_heavy_legs_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 6.5K µSCU\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
; FORCE
item_Desc_cds_combat_light_core_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -32 / 62 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4K µSCU\nBackpacks: Light\n\nCDS's quest to create the ideal light armor continues with the FBL-8a. This light armor will keep you fast on your feet with its strategic mix of protective plating and reinforced nano-weave fabrics. While the armor works with any undersuit, it was specifically designed to match the FBL-8u undersuit with special attention given to how the two fit together to make the set as streamlined and responsive as possible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
; FORCE
