item_Desc_dnn_shoes_03_02_01,P=Want to be light on your feet in comfortable trainers without compromising on style? With multi-level memory foam padding on soles built to fit and flex with your specific shape, as well as eye-catching LED highlights in the outsoles, make every step a bold one with the Doubleback shoes.\n\nThe Ultimatum edition are deep blue with bold pink colors.
; FORCE
item_Desc_fta_medium_helmet_01_15_16,P=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -50 / 80 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nMade for miners but ready for any adventure, Greycat Industrial's Strata helmet design features high quality materials and a next-gen air filtration system that enables clean breathing whether in a deep mine or hostile atmospheres. The Levski edition features sleek black plating with dark yellow highlights, and the People's Alliance symbol.
; FORCE
item_Desc_gsb_frontier_boots_01_02_11,P=PLACEHOLDER - gsb_frontier_boots_01_02_11
