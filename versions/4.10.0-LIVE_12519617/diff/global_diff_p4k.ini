item_Desc_rrs_combat_heavy_backpack_01_04_01=Item Type: Heavy Backpack\nCarrying Capacity: 150K µSCU\nCore Compatibility: Heavy\n\nComfortably carry vital gear with the Morozov-CH backpack. This softshell bag is made with an advanced duraweave that's lightweight yet ready for battlefield action. It also features several easy to access pockets and a plethora of straps to keep supplies secure and tight to your back. The Stronghold edition features the fierce symbology of the Nine Tails gang. 
; FORCE
item_Desc_rrs_specialist_heavy_arms_06_01_01,P=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nFeaturing fortified armor plating, special anti-rip protective padding and ample storage, the Morozov-SH is ready to overcome all kinds of adversity. After consulting with security professionals, RRS added a unique high protective collar and a lightweight inner lining; making the Morozov-SH both comfortable and a battlefield stalwart. The Stronghold edition features the fierce symbology of the Nine Tails gang with bold neon pink accents.
; FORCE
