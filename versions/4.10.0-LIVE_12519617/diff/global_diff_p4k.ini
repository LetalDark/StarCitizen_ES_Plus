; FORCE
item_Desc_ksar_undersuit_01=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nThis baseline undersuit from Kastak Arms offers complete protection seal from the elements and compatibility with multiple armor types.
; FORCE
item_Desc_m_hdtc_jacket_01_01_01=Damage Reduction: 20%\nCarrying Capacity: 0.4K µSCU\n\nStylish, functional, and deadly: the Bellator clothing line is designed to fit in at dinner party just as well as a gunfight. Blending cutting edge technology with precise measurements, this jacket provides some combat protection thanks to the intricate weaving of layered graphene in its threads. Adorned with a decorative lapel pin, the jacket's spacious inner lining is also capable of subtly concealing small weaponry and devices.
