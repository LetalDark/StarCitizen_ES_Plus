fleetweek2950_holoviewer_g12_desc=While larger vehicles like the Tumbril Nova and Anvil Ballista may be better known for their military might, the UEE deploys thousands of smaller tactical vehicles in defense of the Empire. More easily transported to provide greater mission flexibility, these rovers and grav-levs often allow tactical responsiveness to a wider variety of terrain and scenarios. When atmospheric conditions become hostile and can impede flight, having a varied motor pool at your disposal can make all the difference.\n\nOne of the newest rovers to join the ranks is the G12a from Origin Jumpworks. While it may have the sleek lines the manufacturer is known for, the G12a is reinforced with heavier armor and fortified wheels, and comes armed with a full defensive and offensive suite. When deployed, it will initially serve as a patrol vehicle for landing sites located in active combat areas with severe weather patterns.\n
; FORCE
foxwell_DefendShip_E_desc_001=Foxwell is looking for an available combat pilot to provide immediate assistance to a ~mission(Ship) under attack over by ~mission(Location|Address). We have not identified the perpetrators in the attack, but have been assured it is a small force.\n\nPlease dispatch quickly and clear out all hostiles. We need the client to make it through this as they haven't paid us yet.\n\nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
foxwell_DefendShip_E_desc_002=Central just passed along an urgent comm from a prospective client who's been attacked while traveling through the system. We've placed them around ~mission(Location|Address) and it seems that they're in serious need of security personnel to bail them out of a tight spot.\n\nFoxwell is looking for any available security operatives (combat experience preferred) to respond.\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
foxwell_DefendShip_H_desc_001=An emergency contract just came in about a fight near ~mission(Location|Address). Apparently a group of ships were ambushed by outlaws led by ~mission(TargetName), who's been wanted on multiple planets for murder and ship theft. Foxwell's looking for top tier combat pilots to go and protect the clients against them.\n\nThis one's been flagged as a red level contract so it's really dangerous. If you have people you could bring, you probably should. If you do, you should also let them know about Foxwell's hiring policies. \n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
foxwell_DefendShip_H_desc_002=A dangerous outlaw pack led by ~mission(TargetName) has launched an attack against a convoy of ships near ~mission(Location|Address). Foxwell has just been contracted by one of them to provide immediate combat support.\n\nIf available, please scramble immediately to destroy ~mission(TargetName|Last) and their crew and ensure the safety of all the ships. This will be a dangerous mission, but will be great optics for Foxwell, if successful.\n\nGood luck,\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
foxwell_DefendShip_M_desc_001=Got an orange level contract for any available combat pilots. A ~mission(Ship) is under attack around ~mission(Location|Address) and is in desperate need for assistance. We're not sure how many perpetrators there are, but they seem motivated and dangerous so exercise caution.\n\nOnce on site, engage and destroy any hostiles you encounter and protect the client. Once they've transferred the credits, we'll route you your payment.\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
foxwell_DefendShip_M_desc_002=Looking for an available security pilot (combat experience preferred) to help a ~mission(Ship) pilot who's currently under attack. Intel has been sketchy, but the outlaws perpetrating the attack seem to be very dangerous, so exercise caution.\n\nIf available, please accept and head to ~mission(Location|Address) immediately to protect the client and take out all the hostiles. Payment will be processed once the client is safe.\n\nEugene Walton\nFoxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
; FORCE
harvestable_Armillaria_Lev_desc=First discovered in the sewer lines at the QV Mining Station built into the Delamar asteroid in Nyx, this quick growing fungus has become a useful manufacturing component for the settlers of Levski thanks to the strong mycelium fibers that can be dried and used in a variety of ways.
; FORCE
headhunters_Nyx_bombingrun_M_desc_001=Seems we got a bit of competition out here in Nyx. Scouts have spotted a gang holding up at  <EM4>~mission(Location|Address)</EM4>.\n\nNow, I'm a fair man. I sent these nullbrains a message saying they either vacate the facility or we make them wish they had, and they made their choice. So now I need you to fly over there and blow the life out of the fuel tanks. Let's see how long they stick around without them.\n\n-Stows out
; FORCE
headhunters_bombingrun_S_desc_001=We've heard news that a new gang are planning an attack on a place over at <EM4>~mission(Location|Address)</EM4>. They figure if they can take out the fuel supplies there then it's theirs for the taking.\n\nBut little do they know that we're gonna send you in first to blow the fuel tanks so we can claim the place before they do. If it all goes to plan, we can clear the location out and stick it to that gang at the same time. Two birds, one stone.\n\nOnly problem is this place is armed to the teeth. Bring a crew and get those fuel tanks out of action. We'll take care of the rest.\n\n-Stows out
; FORCE
headhunters_bombingrun_VE_desc_001=Headhunters didn't get to be what it is today by playing nice. We've tracked down the hideout of a bunch of scraggy upstarts that have been making inroads into our territory. Need you to send a message.\n\nHead to <EM4>~mission(Location|Address)</EM4> and blow the crap out of their fuel tanks. They'll think twice about muscling in on our operations when their ships are grounded.\n\n-Stows out
; FORCE
headhunters_bombingrun_multi_E_CFP_desc_001=Every day it seems like Citizens for Prosperity is out here trying to snatch up more people for their shitty little cause and make life more difficult for hardworkin' folks like ourselves. \n\nI figure they could use a reminder about who really is in charge here. Head to ~mission(Location|Address) and really mess the place up. \n\nNothing like a bit of property damage to get a point across.\n\n-Stows out
