item_Desc_rsi_deckcrew_undersuit_01=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nRSI's Beacon undersuit is a general use utility designed to provide total protection against environments and vacuum. Built out of a durable but flexible polymers, the Beacon provides a wide freedom of motion for a variety of body types.
; FORCE
item_Desc_rsi_deckcrew_undersuit_01_ruso=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nRSI's Beacon undersuit is a general use utility designed to provide total protection against environments and vacuum. Built out of a durable but flexible polymers, the Beacon provides a wide freedom of motion for a variety of body types. The Rust Society edition celebrates blue-collar workers with an exclusive red and tan coloration that hides dirt and wear and tear well.  
; FORCE
item_Desc_rsi_explorer_light_core_01_01_coramor=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -38 / 68 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 9k µSCU\nBackpacks: Light\n\nRobert Space Industries’ Venture Explorer Suit provides exceptional protection against the dangers of space. Designed for those who don't know where their next adventure might go, the suit combines comfort and safety without sacrificing mobility. This special Lovestruck edition features a stylish metallic pink and black color scheme inspired by the colors of the Coramor festival.
; FORCE
