item_Desc_cds_combat_medium_arms_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8K µSCU\nBackpacks: Medium, Light\n\nThe mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
; FORCE
item_Desc_cds_combat_medium_backpack_01_01_01=Item Type: Medium Backpack\nCarrying Capacity: 105K µSCU\nCore Compatibility: Medium & Heavy\n\nBe ready for any situation with the CSP-68M Backpack. Originally designed for the rigors combat support, this medium backpack has become popular thanks to its durability and a patented core connector that helps the CSP-68M sit comfortably and balanced on the back.
; FORCE
