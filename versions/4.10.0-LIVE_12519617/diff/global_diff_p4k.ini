; FORCE
Battaglia_RPT_BoardShip_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ship In Distress\n\nWORK BRIEF: \nGot an urgent distress call from one of the Miners Amalgamated crews I sent out, saying they’re under attack by a gang that ambushed their ship. \n\nI need you to rush down there, board the <EM4>~mission(Ship)</EM4> and help protect my people out there.\n\nPlease let me know ASAP if you can help.\n\nPAYMENT:\nStandard listed rate upon elimination of all targets.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_CreateUplink_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Moraine Movements\n\nWORK BRIEF: \nThis is a little outside our usual purview, but with the Moraine attacking more often, we’re hoping to find out where they’re operating and steer crews clear of those areas.\n\nWe need someone to <EM4>infiltrate a suspected Moraine facility and plug a small listening device into their server</EM4>. We’ve been told that the station is rarely occupied but <EM4>it’s possible that you will encounter Moraine there</EM4>, so be careful.\n\nWhile we don’t advocate violence, the potential benefits of this intel will be able to save many lives on both sides.\n\nPAYMENT:\nStandard listed rate upon successful installation.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_CreateUplink_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Need some intel\n\nWORK BRIEF: \nThe Governing Committee have been looking for more information to help strategize a way out of our current situation with the Moraine. They’ve asked for people willing to <EM4>plant tracking programs aboard Moraine stations</EM4> in order to gather data to better understand their movements and locations in Nyx.\n\nYou’ll need to <EM4>head out to ~mission(Location), get access to the Moraine station, and plant the device in their servers</EM4>.\n\nIt’s entirely possible that this station may be occupied but hopefully violence can be avoided.\n\nGood luck.\n\nPAYMENT:\nStandard listed rate upon successful installation.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_CreateUplink_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Tapping Moraine Servers\n\nWORK BRIEF: \nIt’s no secret the Moraine have been escalating their attacks against People Alliance crews just trying to make an honest living in Nyx. While the PA won’t condone open hostilities against them, the Governing Committee wants to try to keep away from them as much as possible.\n\nWe need someone to head to a Moraine station near <EM4>~mission(Location) and implant a data card in their servers</EM4>. There’s a tracking program that will autorun and feed us the location of Moraine ships. The Committee hopes that we can use this data to warn our crews and save lives.\n\nAny help you can provide would be appreciated. I won’t lie, it’s possible that <EM4>there might be Moraine on the station</EM4> who won’t take kindly to you being there, so be careful.\n\nPAYMENT:\nStandard listed rate upon successful installation.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_MissCrew_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Crew Hasn’t Checked In\n\nWORK BRIEF: \nJust got word that one of the mining teams is unaccounted for. They were supposed to be back hours ago, but no one’s heard from them. Family have tried to reach out but haven’t gotten a response from anyone on the crew.\n\nI can send you their last known location, so we’re looking for someone to go check in and see if they’re okay. If the worst happened, <EM4>please identify anyone you find</EM4>. I’m sure the families would appreciate some closure on what happened.\n\nThanks\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_MissCrew_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Missing Mining Team\n\nWORK BRIEF: \nOne of our local crews set off for a dig and haven’t checked back in. With everything going on out there, people are starting to get a little worried, so <EM4>we’d like someone to try and get eyes on them</EM4>.\n\nI hate to say this, but if something happened to them, could you <EM4>please identify everyone you find</EM4> so we can let next of kin know?\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_MissCrew_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Missing Persons\n\nWORK BRIEF: \nA group of prospectors set out to look for some mining opportunities and haven’t been heard from since. We’re looking for someone to check in and see if they’re okay.\n\nI'll send you <EM4>their last known location</EM4>. Just head out there and see what happened.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_RecoverItem_VH_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval Very Dangerous\n\nWORK BRIEF: \nThere's been another attack out at ~mission(Location). Whoever did it killed the entire crew in the ambush. The Governing Committee wants answers so we're looking for someone to head out there, <EM4>retrieve the blackbox and deliver it ~mission(Destination)</EM4>. Make sure you <EM4>bring a ship with some storage to hold the blackbox</EM4>.\n\nBe incredibly careful. They said it was a large group that attacked them, and I'd bet <EM4>they're still in the area</EM4>.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Minor Mining Job\n\nWORK BRIEF: \nIf you’ve got time, I’ve got a pretty basic mining job for you. I'm building a database of mineral types and their locations but I need some raw data, so I need someone to locate <EM4>~mission(Resources) ~mission(MineableType)</EM4>. You can keep what you find, I'll pull the data I need. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Need Some Ore Mined\n\nWORK BRIEF: \nGot a moment? Need someone to fly over to locate <EM4>~mission(Resources)</EM4> and mine at least <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>. We're updating our database for future mining expeditions. You can keep what you find, we just need the data. ~mission(Rarity)\n\nAlso, if new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out in your mobi.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Scan And Mining Needed\n\nWORK BRIEF: \nI have a job here that might interest you. I need people to go out and do some basic mining in order to pull some geological data for future prospecting. Need someone to scope out and mine <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>. You'll be helping us out massively. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nKeep me posted.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_04_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Needs Gathering\n\nWORK BRIEF: \nGot a big mining job with your name on it. We're looking to update our records about mineral yields so we need someone to scan and extract about <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4> mined if possible. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_05_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Efficient Miners Wanted\n\nWORK BRIEF: \nNeed your help with something. If you could harvest ~mission(Resources) ~mission(MineableType)</EM4>, that would really help out our understanding of the current mineral levels in the system. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks in advance.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_06_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Mining and Data Collection\n\nWORK BRIEF: \nHave a big one for you today. Need you to get down there and mine ~mission(Resources) ~mission(MineableType)</EM4> and relay your stats back to us. I'm looking to pull together some findings from various miners around the system. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
Battaglia_RPT_ScanMine_Mole_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Mining and MOLE\n\nWORK BRIEF: \nAnother special job for you with an extra special payout. Like the previous jobs, I need you to find and extract <EM4> ~mission(Resources) ~mission(MineableType)</EM4> and relay your stats back to us. ~mission(Rarity) \n\nI can't even tell you how helpful your work has been in the past so I've arranged an extra special payout for this one. ~mission(Rarity)\n\nBy this point you know what you're doing but just going to remind you that <EM4>the United Resource Workers' mining journal on your mobi is great if you're stuck.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nYou'll receive a custom ARGO MOLE as payment for all your help.\n\nAUTHORIZATION:\nBattaglia, Recco
; FORCE
