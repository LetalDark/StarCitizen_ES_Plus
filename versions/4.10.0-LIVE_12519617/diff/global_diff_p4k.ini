item_Desc_cds_undersuit_01_crus01_01=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nThis comprehensive Tactical Combat Suit provides a complete sealed suit against vacuum, free range of motion, and interfaces seamlessly with compatible armor systems. The Crusader Edition was made specifically for the company's security services.
; FORCE
item_Desc_cds_undersuit_armor_01_02_01=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nUsing materials made with orb-weave technology, CDS has created a lightweight, durable undersuit that has been designed to meet the needs of on-the-ground combatants. It was made to match the limited-edition GCD-Army medium armor, but is compatible with a wide range of other sets.
; FORCE
item_Desc_cds_undersuit_helmet_01=Item Type: Flight Helmet\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe A23 has been one of CDS' mainstay helmet systems for years. Built out of impact-resistant composite technology and a hardened laminate faceplate, the A23 is perfect for hazardous environment and basic EVA operations. Visor is AR crosshair compatible.
; FORCE
item_Desc_clda_undersuit_01_01_01=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nFeaturing flexible gaskets for greater comfort and more natural movement, along with a convenient range of chest connector port options, the Levin from Caldera has been a practical choice for explorers everywhere. This particular undersuit has been repaired for extended use.
; FORCE
item_Desc_clda_undersuit_02=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nBuilt for adventure but comfortable enough for everyday, the Markanda undersuit has become beloved by explorers. A unique patchwork design creates a flexible yet resilient undersuit, while an odor resistant SureSoft inner lining will keep you from wanting to take it off. This particular undersuit has been repaired for extended use.
; FORCE
item_Desc_clda_undersuit_02_02_01=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nBuilt for adventure but comfortable enough for everyday, the Markanda undersuit has become beloved by explorers. A unique patchwork design creates a flexible yet resilient undersuit, while an odor resistant SureSoft inner lining will keep you from wanting to take it off. This edition features the colors and logo of the now defunct Pyrotechnic Amalgamated.
; FORCE
