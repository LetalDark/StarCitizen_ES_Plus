soo2_subobj_13_short,P=Lanzadera del Centro Administrativo
soo2_subobj_14_desc,P=Los Nine Tails tienen fuertes defensas alrededor de la barcaza; el collar de acoplamiento probablemente estará vigilado, así que ocúpate de ellos primero.
