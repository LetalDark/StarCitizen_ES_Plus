TheCollector_Mod_ATLS_Geo_Grad1_Desc=Módulo de rendimiento de nivel básico para el exoesqueleto ATLS Geo. Proporciona un aumento moderado de la capacidad de carga sobre la configuración estándar.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
TheCollector_Mod_ATLS_Geo_Grad1_Name=<EM4>*</EM4> Mod ATLS Geo Mk I
TheCollector_Mod_ATLS_Geo_Grad2_Desc=Módulo de rendimiento de nivel medio para el exoesqueleto ATLS Geo. Mejoras equilibradas en capacidad de carga y eficiencia energética.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
TheCollector_Mod_ATLS_Geo_Grad2_Name=<EM4>*</EM4> Mod ATLS Geo Mk II
TheCollector_Mod_ATLS_Geo_Grad3_Desc=Módulo de rendimiento de gama alta para el exoesqueleto ATLS Geo. Máximo aumento de capacidad de carga para operaciones de alta exigencia.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
TheCollector_Mod_ATLS_Geo_Grad3_Name=<EM4>*</EM4> Mod ATLS Geo Mk III
TheCollector_Recipes_Desc_L22Wolf=Wikelo muy emocionado. Tener idea para nuevo material. Pero hacerlo es muy complicado. Muy enrevesado. Necesito ayuda fabricando una muestra de prueba. Yo te doy plano, tú haces, traes a mí, y haré trato. Te doy un L-22 Wolf muy especial. Muy potente, muy lobo.\n<EM4>Posibles Planos</EM4>\n<EM4>Variante 1</EM4>\n- Tailwind Dominion Camo (Casco vuelo)\n<EM4>Variante 2</EM4>\n- Tailwind Dominion Camo (Traje vuelo)\n
TheCollector_Recipes_Desc_NoneAR=Este rifle muy bueno disparando, pero podría tener mejor diseño. Wikelo arregla. Ahora tiene muy buena pinta. Te lo doy a cambio. Tráeme cosas, yo te doy el rifle. Incluso te doy plano si lo necesitas.\n<EM4>Posibles Planos</EM4>\n<EM4>Variante 1</EM4>\n- Tailwind Dominion Camo (Casco vuelo)\n<EM4>Variante 2</EM4>\n- Tailwind Dominion Camo (Traje vuelo)\n
TheCollector_Recipes_Desc_SuperHeavyCombat=¡Esta armadura es grande, sí! Te protege muy bien. Wikelo la hace extra brillante para que todos vean lo buena que es tu armadura. Si traes las cosas que necesito, la cambio por ellas.
TheCollector_Recipes_Desc_VGLflightsuit=Las naves tienen ventanas grandes. Todos pueden verte volando. Tienes que estar con tu mejor pinta. Wikelo tiene muy buen traje de vuelo para ti. Hagamos trato, tráeme lo que necesito y Wikelo te da traje. Te doy plano también si no tienes.\n<EM4>Posibles Planos</EM4>\n<EM4>Variante 1</EM4>\n- Tailwind Dominion Camo (Casco vuelo)\n<EM4>Variante 2</EM4>\n- Tailwind Dominion Camo (Traje vuelo)\n
TheCollector_Recipes_Desc_aparGatlingGun=Esta arma es muy grande y muy ruidosa. A Wikelo le encanta. La hice extra brillante para que todos vean lo especial que es esta arma. Creo que te gustará, así que tráeme un trato.
TheCollector_Recipes_DrakeClipper=La Clipper hace un montón de cosas bien, pero Wikelo piensa, ¿y si peleara más? Entonces sigue haciendo todas las cosas, pero ahora hace una cosa mejor. Bien, ¿sí? Yo te doy plano, tú haces mi nuevo metamaterial, me lo traes, y yo lo cambio.
TheCollector_Recipes_Title_DrakeClipper=La Clipper Pelea Ahora
