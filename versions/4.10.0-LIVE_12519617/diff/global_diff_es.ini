Nozzle_FuelGiver_GRIN_NozzleSecure_Desc,P=Fabricante: Greycat Industrial\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 1,05 SCU/s\nVelocidad de flujo cuántico: 0,58 SCU/s\nIntegridad máx.: 9818\n\nFruto del compromiso duradero de Greycat con la calidad y la fiabilidad, la boquilla de combustible Marlin ofrece estabilidad y seguridad en cada fase del proceso de repostaje.
Nozzle_FuelGiver_GRIN_NozzleSecure_Name=Marlin
Nozzle_FuelGiver_GRIN_NozzleVeryFast_Desc,P=Fabricante: Greycat Industrial\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 2,0 SCU/s\nVelocidad de flujo cuántico: 1,1 SCU/s\nIntegridad máx.: 6300\n\nLa boquilla Lindstrom de Greycat alcanza con holgura unas velocidades de flujo impresionantes, aunque a costa de la seguridad. Si el tiempo apremia, esta es la boquilla a elegir.
Nozzle_FuelGiver_GRIN_NozzleVeryFast_Name=Lindstrom
Nozzle_FuelGiver_SHIN_NozzleExpensiveFast_Desc,P=Fabricante: Shubin Interstellar\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 2,54 SCU/s\nVelocidad de flujo cuántico: 1,4 SCU/s\nIntegridad máx.: 8640\n\nSi la velocidad es la prioridad y el precio no es un problema, la boquilla de combustible Bendix de Shubin ofrece velocidades de transferencia de gama alta en un paquete fiable.
Nozzle_FuelGiver_SHIN_NozzleExpensiveFast_Name=Bendix
Nozzle_FuelGiver_SHIN_NozzleExpensiveSecure_Desc,P=Fabricante: Shubin Interstellar\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 2,15 SCU/s\nVelocidad de flujo cuántico: 1,18 SCU/s\nIntegridad máx.: 16992\n\nUna boquilla que se merece su precio premium: la Torrez de Shubin prioriza la estabilidad y la seguridad sin dejar de ofrecer unas velocidades de transferencia sólidas y fiables.
Nozzle_FuelGiver_SHIN_NozzleExpensiveSecure_Name=Torrez
Nozzle_FuelGiver_SHIN_NozzleMostExpensive_Desc,P=Fabricante: Shubin Interstellar\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 2,18 SCU/s\nVelocidad de flujo cuántico: 1,2 SCU/s\nIntegridad máx.: 10800\n\nLa boquilla de combustible Ezra de Shubin es un paquete bien equilibrado que ofrece una combinación cuidadosamente ajustada de velocidad de transferencia y seguridad. Eso sí, esta clase de calidad meditada tiene un precio.
Nozzle_FuelGiver_SHIN_NozzleMostExpensive_Name=Ezra
