item_DescAsgard_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Asgard con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescAsgard_Paint_Silver_Silver_Silver=La pintura SteelTek presenta un reluciente revestimiento metálico con un patrón de Damasco que recorre toda la superficie de la Asgard.
item_DescAtls_Paint_silver_teal_white=El Foundation Fest es una oportunidad para que ciudadanos y civiles se unan y fortalezcan los cimientos de nuestra comunidad. Muestra tu compromiso con un universo mejor con esta pintura personalizada.
item_DescAurora_mk2_Paint_silver_teal_white=El Foundation Fest es una oportunidad para que ciudadanos y civiles se unan y fortalezcan los cimientos de nuestra comunidad. Muestra tu compromiso con un universo mejor con esta pintura personalizada.
item_DescAurora_mk2_Paint_silver_teal_white_torch=El Foundation Fest es una oportunidad para que ciudadanos y civiles se unan y fortalezcan los cimientos de nuestra comunidad. Muestra tu compromiso con un universo mejor con esta pintura personalizada.
item_DescBEHR_BallisticCannon_S7_Tiburon=Fabricante: Behring\nTipo de artículo: Cañón balístico\nTamaño: 7\n\nUn arma anticapital dedicada y ajustada para satisfacer las exigencias de combate del Tiburon, el cañón balístico C-07T ofrece una potencia ofensiva abrumadora, demostrando que Behring sigue innovando en todas las áreas de la tecnología del campo de batalla.
item_DescBasher_Paint_Black_Black_Red_Pirate=Esta pintura adopta la iconografía pirata clásica al incluir varios símbolos de calavera y tibias cruzadas sobre el oscuro casco de la Basher, con detalles en rojo sangre.
item_DescBasher_Paint_Black_Grey_Grey=Con un agresivo aspecto oxidado, la pintura Razorburn le demuestra al 'verso que estás listo para la pelea.
item_DescBasher_Paint_Brown_Green_Grey=La pintura Corroded abraza los orígenes poco convencionales del Basher luciendo un blindaje de cobre bien oxidado a lo largo del casco de la nave.
item_DescBasher_Paint_Brown_White_Brown=Con una siniestra calavera sobre una pintura base marrón, la pintura Nightmare le da al Basher un aspecto que pone los pelos de punta.
item_DescBasher_Paint_White_Blue_Black=Convierte el Basher en una belleza y una bestia con la pintura Blue Blossom, que luce un colorido y ornamentado patrón floral en la parte superior de la nave.
item_DescBuccaneer_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Buccaneer con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescBuccaneer_Paint_Red_Red_Black=Con una pintura base roja intensa con detalles en negro, la pintura Redline le da a la Buccaneer un aspecto nuevo y audaz.Con una feroz pintura base roja y acentos negros, la pintura Redline dota al Buccaneer de un aspecto audaz y renovado.
item_DescCOOL_AEGS_S01_Bracer=Tipo de artículo: Enfriador\nFabricante: Aegis Dynamics \nEnfriamiento: 34\nEnergía: 3 | EM: 1490 | IR: 7260 | HP: 180\nDisto: 2.7K | Disipa: 180/s | Rec: 16.5s\n210 kg\n\nPara aquellos que buscan un enfriador de linea media solido y fiable, no pueden hacerlo mucho mejor que Aegis' Bracer. Este sistema de refrigeración de estructura pequeña ofrece un rendimiento solido y durabilidad para mantener su nave funcionando a toda maquína.
item_DescCOOL_AEGS_S01_Bracer_SCItem=Tipo de artículo: Enfriador\nFabricante: Aegis Dynamics \nEnfriamiento: 34\nEnergía: 3 | EM: 1490 | IR: 7260 | HP: 180\nDisto: 2.7K | Disipa: 180/s | Rec: 16.5s\n210 kg\n\nPara aquellos que buscan un enfriador de linea media solido y fiable, no hay nada mejor que Aegis' Bracer. Este sistema de refrigeración de estructura pequeña ofrece un rendimiento solido y durabilidad para mantener su nave funcionando a toda maquína.
item_DescCOOL_AEGS_S03_Mercury=Tipo de artículo: Enfriador\nFabricante: Aegis Dynamics \nEnfriamiento: 56\nEnergía: 2-5 | EM: 2480 | IR: 11600 | HP: 1300\nDisto: 6.5K | Disipa: 433.33/s | Rec: 19.5s\n1900 kg\n\nEn situaciones de combate, incluso la ventaja mas pequeña puede generar grandes ganancias. Con el sistema de refrigeración Mercury de Aegis a bordo, podra calentar su nave durante mas tiempo cuando mas lo necesite.
item_DescCOOL_VNCL_S04_Mauler=\nEnfriamiento: 49.4\nEnergía: 3-6 | EM: 2720 | IR: 14900 | HP: 45000\nDisto: 10 | Disipa: 0.67/s | Rec: 21s\n43000 kg\n\nEste enfriador Vanduul procesa el calor excesivo generado por el Mauler durante el combate intenso.
item_DescCarrack_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Carrack con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescCarryable_1H_SQ_Flair_Coin_PirateWeek_2026=Un tesoro digno para quienes saben dónde buscar, esta moneda luce una amenazante calavera y un par de sables en una de sus caras, convirtiéndola en la envidia de más de un pirata a lo largo del 'verso.
item_DescCarryable_2H_FL_Container_Anim_coin_case_1_concierge_a=Adornado con el león característico del Chairman's Club, este elegante estuche negro con ribetes dorados te permite exhibir con buen gusto diez monedas conmemorativas.
item_DescCarryable_2H_FL_MissionItem_prototype_ship_component_1_a=Fabricada específicamente para ser compatible con las plataformas flotantes de Orison, la estructura metálica del TH-01 y sus disipadores de calor a medida garantizan que el propulsor pueda proporcionar la sustentación crucial durante periodos prolongados sin riesgo de sobrecalentamiento.
item_DescCarryable_2H_FL_Safe_Locked=Esta caja fuerte proporciona almacenamiento seguro para objetos valiosos o sensibles.
item_DescCarryable_2H_SQ_aurora_mk2_model_1_stand_a=Creada por Takuetsu Starships mediante láseres de precisión micrométrica, esta maqueta minuciosamente elaborada y acabada a mano capta los llamativos ángulos de la reinventada Aurora Mk II de RSI.
item_DescCarryable_TBO_MissionItem_TSG_FuelTank=Este contenedor de los días operativos de la Instalación de Extracción QV contiene combustible de quantanium almacenado de forma incorrecta, lo que ha provocado una anomalía química en el combustible.
item_DescCaterpillar_Paint_Pirate=Esta temible pintura Pirate para la Caterpillar luce un acabado intimidante con calcomanías de calaveras y un recuento de fechorías cometidas.
item_DescClipper_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Clipper con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescClipper_Paint_Black_Black_Red_Pirate=Esta pintura adopta la iconografía pirata clásica al incluir varios símbolos de calavera y tibias cruzadas sobre el oscuro casco de la Clipper, con detalles en rojo sangre.
item_DescCorsair_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Corsair con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescDRAK_CML_Chaff,P=Lanzador de señuelos Drake
item_DescDRAK_CML_Flare,P=Lanzador de bengalas Drake
item_DescEclipse_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Eclipse con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescFlair_Dashboard_Cockpit_Bot_1_a,P=Diseñado para descansar limpiamente sobre tu salpicadero, este Dashbot acompañante reacciona durante tus viajes con una amplia variedad de expresiones faciales humorísticas. Tanto si está contento de verte como si juzga en silencio tus habilidades de pilotaje, el Emoto Dashbot hará que tu próximo vuelo sea un poco más divertido.
item_DescFury_Paint_Black_Black_Gold=La pintura Goldsmith presenta un estampado floral sobre un lujoso casco negro y dorado para un aspecto extravagante.
item_DescGLSN_BallisticGatling_S2=Creada a partir de una mezcla de piezas distintas, la ametralladora Gatling Deathroll puede disparar rápidamente a larga distancia. Aunque requiere munición, la potencia explosiva que contiene cada disparo compensa con creces el coste de la misma.
item_DescGLSN_LaserRepeater_S2=Con su rápida cadencia de fuego y su calor de alta intensidad por descarga, el repetidor láser Snapper parte de los estándares de su clase y los mejora combinando componentes de otras muchas armas.
item_DescGladiator_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Gladiator con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescGolem_Paint_silver_teal_white=El Foundation Fest es una oportunidad para que ciudadanos y civiles se unan y fortalezcan los cimientos de nuestra comunidad. Muestra tu compromiso con un universo mejor con esta pintura personalizada.
item_DescHTNK_VNCL_S04_Mauler=El tanque de combustible de hidrógeno del Vanduul Mauler almacena combustible para alimentar los motores y propulsores convencionales del Mauler.
item_DescHardDrive_Generic=Un dispositivo portátil de almacenamiento de datos diseñado para transportar información.
item_DescHermes_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Hermes con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescHermes_Paint_White_Blue_Blue=Blanco nítido con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, recuperación y más han hecho del imperio lo que es hoy.Blanco impoluto con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, desguace y demás labores han sido los verdaderos cimientos del esfuerzo fronterizo en Stanton.
item_DescHullB_Paint_Black_White_Yellow=El transporte de carga adquiere un aspecto audaz con la pintura Hull B Empyrean, que presenta un diseño tricolor dinámico. Los detalles amarillos separan una proa blanca de una sección de ingeniería gris, aportando una sensación de velocidad al carguero.El transporte de carga adopta un aspecto audaz y renovado con la pintura Empyrean del Hull B, que presenta un diseño tricolor dinámico. Los destellos amarillos añaden estilo a la base en blanco y negro.
item_DescHullB_Paint_Black_Yellow_Black=Para los capitanes de carga de largo recorrido que prefieren hacer una declaración sutil con su carguero, MISC ofrece la distinguida pintura Hull B Dusk. Un casco completamente gris resalta la silueta clásica de la nave con elegantes detalles en dorado.Para los capitanes de carga de largas distancias que prefieren hacer una declaración discreta con su buque, MISC ofrece la distinguida pintura Dusk con sus tonos negros y amarillos.
item_DescHullB_Paint_Brown_White_Bronze=Incluso una nave trabajadora merece lucir lo mejor posible. La pintura Hull B Horizon ofrece un elegante esquema de color en dos tonos gris y blanco, ideal para atraer miradas en el puerto espacial.Hasta una nave trabajadora merece lucir su mejor aspecto. La pintura Horizon del Hull B ofrece un elegante juego de dos tonos gris y blanco con toques de bronce.
item_DescHullB_Paint_White_Blue_Blue=Blanco nítido con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, recuperación y más han hecho del imperio lo que es hoy.Blanco impoluto con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, desguace y demás labores han sido los verdaderos cimientos del esfuerzo fronterizo en Stanton.
item_DescHullB_Paint_Yellow_Yellow_Black=Los transportistas que quieran llamar la atención con el aspecto de su Hull B deberían equipar la pintura First Light, con su parte frontal negra y secciones traseras amarillas.Los transportistas que quieran llamar la atención con la estética de su Hull B deberían equipar la pintura First Light, con su frontal negro y cuerpo amarillo.
item_DescINTK_VNCL_S04_Mauler=Esta toma de combustible repone las reservas de hidrógeno del Mauler para mantener sus tanques llenos durante las maniobras de combate.
item_DescIronclad_Paint_Black_Black_Red_Pirate=Esta pintura adopta la iconografía pirata clásica al incluir varios símbolos de calavera y tibias cruzadas sobre el oscuro casco de la Ironclad, con detalles en rojo sangre.
item_DescIronclad_beige_beige_beige=Cuando el trabajo te lleva al fin del mundo y de vuelta, ahí está el revestimiento Sediment, que cubre la Ironclad con un robusto tono marrón.
item_DescIronclad_black_black_silver=Haz que la Ironclad sea aún más imponente e impresionante con el revestimiento Dauntless, principalmente negro con llamativos detalles plateados.
item_DescIronclad_cream_silver_silver=El revestimiento Wind Chill para la Ironclad presenta pintura blanca nítida con reflejos negros y detalles plateados.
item_DescIronclad_metal_metal_yellow=El revestimiento Aquamarine para la Ironclad ofrece una base verde azulada metálica con sutiles detalles amarillos para causar impresión, antes de que repartas el primer puñetazo.
item_DescIronclad_olive_olive_yellow=Principalmente verde con detalles amarillos, el revestimiento Commando permite que la Ironclad se mezcle con bosques y entornos verdes.
item_DescJDRV_ORIG_S04_890J,P=Tipo de artículo: Módulo de salto\nFabricante: Origin Jumpworks\nTamaño: 4\n\nEste módulo de salto de clase capital fue diseñado específicamente para la 890 Jump.
item_DescKLWE_LaserRepeater_S1_mr01=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor láser\nTamaño: 1\n\nCon un diseño de disparo secuencial de tres cañones, el repetidor láser CF-117 Bulldog de Klaus & Werner es capaz de disparar proyectiles de energía a alta velocidad manteniendo la eficiencia térmica, lo que lo convierte en un favorito entre los pilotos novatos que equipan su primera nave. La edición Hazard-Zone, adornada con llamativos detalles amarillo mostaza sobre una base negra, hará que vayas armado y listo para luchar con estilo.
item_DescKLWE_LaserRepeater_S2_mr01=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor láser\nTamaño: 2\n\nEl CF-227 Badger es el fiable láser de repetición de tamaño dos de Klaus & Werner. Su mayor potencia y su alta cadencia de fuego lo convierten en un sólido contendiente en cualquier combate. La edición Hazard-Zone, adornada con llamativos detalles amarillo mostaza sobre una base negra, hará que vayas armado y listo para luchar con estilo.
item_DescKLWE_LaserRepeater_S3_mr01=Fabricante: Klaus & Werner\nTipo de artículo: Repetidor láser\nTamaño: 3\n\nEl CF-337 Panther es el modelo de tamaño tres de la línea de repetidores láser de Klaus & Werner. La Panther es un arma de disparar y olvidar de verdad, con una respetable relación entre consumo de energía y daño. Los pilotos que equipan sus naves con Panthers rara vez se arrepienten de la decisión. La edición Hazard-Zone, adornada con llamativos detalles amarillo mostaza sobre una base negra, hará que vayas armado y listo para luchar con estilo.
item_DescM80_Paint_black_black_orange=El negro envuelve la mayor parte del revestimiento Afterglow para la M80, mientras que las líneas de acento en naranja aportan un toque de color.
item_DescM80_Paint_black_darkgrey_lightgrey_camo=Personaliza tu nave M80 con este revestimiento camuflaje gris.
item_DescM80_Paint_red_black_blue=Con un rojo brillante que produce un lustre radiante, el revestimiento Blaze transforma el morro de la M80 con un negro intenso, sutiles detalles azul claro y alas de un gris oscuro.
item_DescM80_Paint_teal_black_green=Llama la atención con el revestimiento Tetra, que presenta un verde azulado tornasolado, detalles en verde claro y un afilado morro negro.
item_DescM80_Paint_white_white_blue=Surca los cielos con estilo gracias al revestimiento Dynasty, que presenta predominantemente un blanco nítido con suaves detalles en negro y azul.
item_DescMISC_Hull_B_MRCK_S06_Bespoke=Tipo de artículo: Soporte de misiles\nFabricante: MISC\nTamaño: 6\nMisiles: 8xS3\n\nSoporte de misiles específico para la MISC Hull B que dispara ocho misiles S3.Tipo de objeto: Rack de Misiles\nFabricante: MISC\nTamaño: 6\nMisiles: 8xS3\n\nRack de misiles a medida para el MISC Hull B que dispara ocho misiles S3.
item_DescMODU_GREY_Basher_Cosmetic_Mohawk_Default=La forma más rápida e infalible de que todo el que te vea sepa que no eres alguien con quien meterse: el bodykit Chopper le da a la parte superior de tu nave un toque dramático sin sacrificar la aerodinámica. Con este gigantesco mástil chapado en acero, no solo llamarás la atención; tus enemigos también saldrán por patas en cuanto te vean acercarte.
item_DescMODU_GREY_Shiv_Cosmetic_Nose_SetA=Es tu nave, así que ¿no debería estar a la altura de tu estilo? Con el bodykit Slasher puedes darle a tu Shiv de Grey's Market un agresivo retoque postventa.
item_DescMODU_GREY_Shiv_Cosmetic_Nose_SetB=Es tu nave, así que ¿no debería estar a la altura de tu estilo? Con el bodykit Barebones puedes darle a tu Shiv de Grey's Market un retoque postventa esbelto y contundente.
item_DescMODU_GREY_Shiv_Cosmetic_Nose_SetC=Es tu nave, así que ¿no debería estar a la altura de tu estilo? Con el bodykit Lunatic puedes darle a tu Shiv de Grey's Market un retoque postventa endiabladamente afilado.
item_DescMODU_GREY_Shiv_Cosmetic_RearL_SetA=Es tu nave, así que ¿no debería estar a la altura de tu estilo? Con el bodykit Slasher puedes darle a tu Shiv de Grey's Market un agresivo retoque postventa.
