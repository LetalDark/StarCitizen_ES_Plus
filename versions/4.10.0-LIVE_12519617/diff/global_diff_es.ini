item_Desc_rrs_specialist_light_helmet_01_05_01,P=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -38 / 68 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nCon su excelente diseño y su estilo llamativo, la armadura Arden-SL ejemplifica por qué los especialistas en seguridad adoran a Roussimoff Rehabilitation Systems. Este versátil conjunto de armadura permite a quien lo lleva mantenerse ágil pero seguro gracias a la colocación precisa de placas de armadura de composite especial y tejidos. También incluye un casco totalmente cerrado con capucha integrada. El visor es compatible con la retícula AR.\n\nPH
item_Desc_rsi_explorer_light_core_01_02_coramor=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -38 / 68 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 9k µSCU\nMochilas: Ligera\n\nEl traje de explorador Venture de Robert Space Industries ofrece una protección excepcional contra los peligros del espacio. Diseñado para quienes no saben adónde los llevará su próxima aventura, el traje combina comodidad y seguridad sin sacrificar movilidad. Esta edición especial Envy, inspirada en el festival Coramor, presenta un vibrante esquema de colores rosa y púrpura para los amantes más entusiastas.
item_Desc_scraper_Salvation_Medium=Fabricante: Greycat Industrial\nTipo de artículo: Módulo raspador\nVelocidad de extracción: 0.7\nRadio: 1.5m\nEficiencia de extracción: 80%\n\nHecho para la Salvation de RSI, el módulo raspador Comer ofrece un área de trabajo enfocada con una tasa de extracción acelerada que permite una experiencia de recuperación fluida.
item_Desc_slaver_combat_heavy_arms_01_02_01,P=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -72 / 102 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nIncorporando los mismos conocimientos y experiencia de fabricación en los que han llegado a confiar los Marines de la UEE, Clark Defense Systems ha diseñado su línea civil de armaduras pesadas Defiance para plantar cara incluso ante los escenarios de combate más adversos, con su placa protectora de tres estrellas y su marco de movilidad totalmente integrado.
item_Desc_slaver_combat_heavy_core_01_02_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -72 / 102 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nIncorporando los mismos conocimientos y experiencia de fabricación en los que han llegado a confiar los Marines de la UEE, Clark Defense Systems ha diseñado su línea civil de armaduras pesadas Defiance para plantar cara incluso ante los escenarios de combate más adversos, con su placa protectora de tres estrellas y su marco de movilidad totalmente integrado.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_slaver_combat_heavy_helmet_01_02_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -72 / 102 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nEl Defiance presenta un casco de batalla totalmente cerrado, construido con dos capas de tramas de composite bajo la placa de armadura, que te proporciona la máxima protección frente a ataques penetrantes y contusivos. El visor es compatible con la retícula AR.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_slaver_combat_heavy_legs_01_02_01,P=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 2.0 µSCU\n\nDiseñado para ser un traje de combate ligero apto para AEV, el conjunto Calico es la armadura perfecta para infiltradores, francotiradores, ladrones, básicamente cualquiera al que le guste evitar echar puertas abajo. Fabricado a partir de una combinación de armadura PAB3 y un casco personalizado, puede ayudarte a resistir algo de fuego entrante sin frenarte.
item_Desc_slaver_combat_light_arms_01_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nDiseñado para ser un traje de combate ligero apto para AEV, el conjunto Calico es la armadura perfecta para infiltradores, francotiradores, ladrones, básicamente cualquiera al que le guste evitar echar puertas abajo. Fabricado a partir de una combinación de armadura PAB3 y un casco personalizado, puede ayudarte a resistir algo de fuego entrante sin frenarte.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_slaver_combat_light_core_01_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 2.0 µSCU\nMochilas: Ligera                                                         \n\nDiseñado para ser un traje de combate ligero apto para AEV, el conjunto Calico es la armadura perfecta para infiltradores, francotiradores, ladrones, básicamente cualquiera al que le guste evitar echar puertas abajo. Fabricado a partir de una combinación de armadura PAB3 y un casco personalizado, puede ayudarte a resistir algo de fuego entrante sin frenarte.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_slaver_combat_light_helmet_01_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\n\nEl casco de combate Renegade de Kastak Arms es un casco de infantería ligero pero resistente, diseñado para ofrecer protección adicional y reducción de impactos durante operaciones en atmósfera. El visor es compatible con la retícula AR.\n\nLa edición Ultimatum presenta la característica iconografía de la banda Nine Tails.
item_Desc_slaver_combat_light_legs_01_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -39 / 69 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 2.0 µSCU\n\nDiseñado para ser un traje de combate ligero apto para AEV, el conjunto Calico es la armadura perfecta para infiltradores, francotiradores, ladrones, básicamente cualquiera al que le guste evitar echar puertas abajo. Fabricado a partir de una combinación de armadura PAB3 y un casco personalizado, puede ayudarte a resistir algo de fuego entrante sin frenarte.\n\nLa edición Ultimatum presenta sutiles acentos rosa neón de Nine Tails a lo largo de toda la armadura.
item_Desc_slaver_combat_medium_arms_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Su placa corporal se basa en el mismo subtraje de CDS que usan los Marines de la UEE, y añade piezas reconstruidas del Omni-Role mkII para brindarte una protección sólida frente al fuego entrante. Todo el conjunto también se ha probado razonablemente contra el vacío, así que puedes hacer AEV cuanto quieras sin preocuparte por morir.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_slaver_combat_medium_core_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 6.4 µSCU\nMochilas: Media, Ligera\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Su placa corporal se basa en el mismo subtraje de CDS que usan los Marines de la UEE, y añade piezas reconstruidas del Omni-Role mkII para brindarte una protección sólida frente al fuego entrante. Todo el conjunto también se ha probado razonablemente contra el vacío, así que puedes hacer AEV cuanto quieras sin preocuparte por morir.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
