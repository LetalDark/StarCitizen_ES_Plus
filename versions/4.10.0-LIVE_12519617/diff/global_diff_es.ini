item_Desc_vgl_utility_light_legs_01_04_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 2.5 µSCU\nTolerancia a fuerza G: -6.2%\n3 kg | Stun: 30% | Impacto: 10%\n\nSé el primero en llegar a la escena con la armadura Chiron. Diseñada para ofrecer la protección esencial que necesitan los médicos de combate, la armadura cuenta con paneles ultraligeros que mantienen al portador rápido sin comprometer la seguridad. Las secciones cruciales de alto impacto se han reforzado con placas de carbono elevadas sobre un polifibra altamente duradero para máxima flexibilidad.\n\nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.
item_Desc_vgl_utility_light_legs_03_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nTasa de depuración de radiación: 145.8 REM/s\n \nSé el primero en llegar a la escena con la armadura Chiron. Diseñada para ofrecer la protección esencial que necesitan los médicos de combate, la armadura cuenta con paneles ultraligeros que mantienen al portador rápido sin comprometer la seguridad. Las secciones cruciales de alto impacto se han reforzado con placas de carbono elevadas sobre un polifibra altamente duradero para máxima flexibilidad.\n \nCelebra el compromiso de la UEE de construir un futuro más brillante con esta edición especial del Festival de la Fundación. Diseñada pensando en los Guías y otros líderes de la comunidad, presenta una capa interior de polifibra verde azulada y detalles a juego en las secciones de placas de carbono.\nTolerancia a fuerza G: -6.2%\n3 kg | Stun: 30% | Impacto: 10%
item_Descapar_hmg_ballistic_01=Fabricante: Apocalypse Arms\nTipo de artículo: HMG\nClase: Balística\n\nTamaño del cargador: 500\nCadencia de fuego: 850 rpm\nAlcance efectivo: 60 m\n\nAccesorios: Bípode (S4)\n\nDemasiado grande para usarse salvo con un exotraje pesado, el Vendetta de Apocalypse Arms es un instrumento de muerte alimentado por cinta. Lo que le falta en precisión lo compensa con una alta cadencia de fuego que garantiza la saturación total del objetivo y el dominio del campo de batalla.
