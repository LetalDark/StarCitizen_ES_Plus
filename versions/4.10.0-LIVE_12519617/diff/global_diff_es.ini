item_Desc_vgl_utility_light_helmet_01_05_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26000 REM\nTasa de depuración de radiación: 145.8 REM/s\n \nUtilizando un cristal protector cristalino tratado con un esmaltado hidrófobo especializado, el casco ligero Chiron se diseñó específicamente para proteger contra el empañamiento y los reflejos, garantizando que los primeros intervinientes mantendrán una visión completa en situaciones de emergencia.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -3.1%\n5 kg | Stun: 30% | Impacto: 10%
