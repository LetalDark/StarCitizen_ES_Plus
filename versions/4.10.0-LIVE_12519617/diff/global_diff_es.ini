CFP_EliminateAll_Rockcracker_Mainenance_desc=Una banda rival se ha instalado en la zona de mantenimiento de una instalación Rockcracker en <EM4>~mission(Location|Address)</EM4>. Métete ahí y elimínalos. Nosotros nos encargamos de tapar el rastro.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
CFP_EliminateAll_Rockcracker_Power_desc=Hay intrusos en la zona de energía de una instalación Rockcracker en <EM4>~mission(Location|Address)</EM4>. Elimínalos antes de que dañen infraestructura crítica.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
CFP_EliminateAll_Rockcracker_Warehouse_desc=Saqueadores han entrado en el almacén de una instalación Rockcracker en <EM4>~mission(Location|Address)</EM4>. Acaba con ellos y asegura la mercancía.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
