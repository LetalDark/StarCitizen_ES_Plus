Battaglia_RPT_BoardShip_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Nave en apuros\n\nRESUMEN DEL TRABAJO: \nHemos recibido una llamada de socorro urgente de una de las tripulaciones de Miners Amalgamated que envié, diciendo que están siendo atacados por una banda que emboscó su nave en <EM4>~mission(Location)</EM4>. Necesito que vayas allí a toda prisa, abordes la <EM4>~mission(Ship)</EM4> y elimines a todos los matones que apuntan a mi gente.\n\nAvísame lo antes posible si puedes ayudar.\n\nPAGO:\nTarifa estándar según la lista al eliminar todos los objetivos.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_BoardShip_01_title=Nave en apuros
Battaglia_RPT_CreateUplink_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Movimientos de los Moraine\n\nRESUMEN DEL TRABAJO: \nEsto se sale un poco de lo que solemos hacer, pero con los Moraine atacando cada vez más, esperamos averiguar dónde operan y mantener a las tripulaciones alejadas de esas zonas.\n\nNecesitamos que alguien se infiltre en una supuesta instalación de los Moraine y conecte un pequeño dispositivo de escucha en su servidor. Nos han dicho que la estación rara vez está ocupada, pero es posible que te encuentres con los Moraine allí, así que ten cuidado.\n\nAunque no defendemos la violencia, los posibles beneficios de esta información podrán salvar muchas vidas en ambos bandos.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_CreateUplink_01_title=Movimientos de los Moraine
Battaglia_RPT_CreateUplink_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Necesitamos información\n\nRESUMEN DEL TRABAJO: \nEl Comité de Gobierno ha estado buscando más información para trazar una estrategia que nos saque de nuestra situación actual con los Moraine. Han solicitado gente dispuesta a <EM4>plantar programas de rastreo a bordo de las estaciones Moraine</EM4> con el fin de recopilar datos para entender mejor sus movimientos y ubicaciones en Nyx.\n\nTendrás que dirigirte a ~mission(Location), acceder a la estación Moraine y plantar el dispositivo en sus servidores.\n\nEs muy posible que esta estación esté ocupada, pero con suerte se podrá evitar la violencia.\n\nBuena suerte.\n\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_CreateUplink_02_title=Necesitamos información
Battaglia_RPT_CreateUplink_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Intervenir los servidores Moraine\n\nRESUMEN DEL TRABAJO: \nNo es ningún secreto que los Moraine han estado intensificando sus ataques contra las tripulaciones de la People's Alliance que solo intentan ganarse la vida honradamente en Nyx. Aunque la PA no consentirá hostilidades abiertas contra ellos, el Comité de Gobernadores quiere intentar mantenerse lo más lejos posible de ellos.\n\nNecesitamos que alguien vaya a una estación Moraine cerca de <EM4>~mission(Location)</EM4> e implante una tarjeta de datos en sus servidores. Hay un programa de rastreo que se ejecutará automáticamente y que nos proporcionará la ubicación de las naves Moraine. El Comité espera que podamos usar estos datos para advertir a nuestras tripulaciones y salvar vidas.\n\nCualquier ayuda que puedas prestar será apreciada. No te mentiré: es posible que haya Moraine en la estación a los que no les guste tu presencia allí, así que ten cuidado.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_CreateUplink_03_title=Intervenir los servidores Moraine
Battaglia_RPT_DataDownload_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Recuperación de datos Moraine\n\nRESUMEN DEL TRABAJO: \nEsto se sale un poco de lo que solemos hacer, pero con los Moraine atacando cada vez más, esperamos averiguar dónde operan y mantener a las tripulaciones alejadas de esas zonas.\n\nNecesitamos que alguien se <EM4>infiltre en una supuesta instalación de los Moraine y haga una copia de los datos de su servidor</EM4>. Nos han dicho que la estación rara vez está ocupada, pero es posible que te encuentres con los Moraine allí, así que ten cuidado.\n\nAunque no defendemos la violencia, los posibles beneficios de esta información podrán salvar muchas vidas en ambos bandos.\n\nPAGO:\nTarifa estándar según la lista tras la entrega\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_DataDownload_01_title=Recuperación de datos Moraine
Battaglia_RPT_MissCrew_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: La tripulación no ha dado señales\n\nRESUMEN DEL TRABAJO: \nAcabo de enterarme de que uno de los equipos de minería está desaparecido. Deberían haber vuelto hace horas, pero nadie ha sabido nada de ellos. Sus familias han intentado contactar con ellos, pero no han obtenido respuesta de nadie de la tripulación.\n\nSe les vio por última vez alrededor de <EM4>~mission(Location)</EM4>, así que buscamos a alguien que vaya a comprobar si están bien. Si ocurrió lo peor, por favor, identifica a cualquiera que encuentres. Seguro que las familias agradecerían saber qué ha pasado.\n\nGracias\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_MissCrew_01_title=La tripulación no ha dado señales
Battaglia_RPT_MissCrew_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Equipo de minería desaparecido\n\nRESUMEN DEL TRABAJO: \nLa tripulación de la <EM4>~mission(ShipName)</EM4> partió a una excavación y no ha vuelto a dar señales. Con todo lo que está pasando ahí fuera, la gente empieza a preocuparse un poco, así que nos gustaría que alguien intentara localizarlos.\n\nSe les rastreó por última vez cerca de <EM4>~mission(Location)</EM4>, así que puedes empezar por ahí. Detesto decir esto, pero si les ha pasado algo, ¿podrías por favor identificar a todos los que encuentres para que podamos avisar a sus familiares?\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_MissCrew_02_title=Equipo de minería desaparecido
Battaglia_RPT_MissCrew_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Personas desaparecidas\n\nRESUMEN DEL TRABAJO: \nUn grupo de prospectores salió a inspeccionar los alrededores de <EM4>~mission(Location)</EM4> y no se ha vuelto a saber de ellos. Buscamos a alguien que vaya a comprobar si están bien.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_MissCrew_03_title=Personas desaparecidas
Battaglia_RPT_Rarity_Rare_desc=Estos son recursos bastante raros, así que puede que sea complicado encontrarlos.
Battaglia_RPT_Rarity_Uncommon_desc=Puede que estos cuesten un poco de encontrar, solo para que lo sepas.
Battaglia_RPT_Rarity_common_desc=Estos deberían ser bastante fáciles de encontrar.
Battaglia_RPT_RecoverItem_M_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Recuperación de caja negra con peligro\n\nRESUMEN DEL TRABAJO: \nHan atacado otra nave cerca de ~mission(Location) y hemos recibido informes contradictorios sobre quién hizo la emboscada, así que buscamos contratar a alguien para que vaya hasta allí y <EM4>recupere la caja negra</EM4>. Lo último que queremos es culpar a la gente equivocada. Deberías poder llevarla tú mismo, pero <EM4>necesitarás una nave con algo de almacenamiento.</EM4>\n\nSolo ten cuidado, hay muchas probabilidades de que <EM4>los emboscadores sigan allí esperando</EM4> a que alguien vaya a reclamarla.\n\nSi consigues recuperarla, <EM4>entrega la caja negra en ~mission(Destination)</EM4> y te pagaremos.\n\nPAGO:\nTarifa estándar según la lista tras la entrega\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_RecoverItem_M_01_title=Recuperación de caja negra con peligro
Battaglia_RPT_RecoverItem_VE_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Recuperación de caja negra\n\nRESUMEN DEL TRABAJO: \nRecibimos un soplo sobre <EM4>una nave que había sido atacada en ~mission(Location)</EM4>.  Al parecer lleva allí un tiempo, pero al Comité de Gobierno le gustaría saber cómo llegó hasta allí. \n\nBuscamos a alguien que vaya, <EM4>recupere la caja negra y la lleve a ~mission(Destination)</EM4> para que podamos averiguar qué ocurrió. \n\nSolo un recordatorio: la caja negra no es pequeña, así que <EM4>necesitarás una nave con algo de almacenamiento</EM4>.\n\nPAGO:\nTarifa estándar según la lista tras la entrega\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_RecoverItem_VE_01_title=Recuperación de caja negra
Battaglia_RPT_RecoverItem_VH_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Recuperación de caja negra muy peligrosa\n\nRESUMEN DEL TRABAJO: \nHa habido otro ataque en ~mission(Location). Quienquiera que fuese mató a toda la tripulación en la emboscada. El Comité de Gobierno quiere respuestas, así que buscamos a alguien que vaya hasta allí, <EM4>recupere la caja negra y la entregue en ~mission(Destination)</EM4>. Asegúrate de <EM4>llevar una nave con algo de almacenamiento para transportar la caja negra</EM4>.\n\nTen muchísimo cuidado. Dijeron que fue un grupo grande el que los atacó, y apostaría a que <EM4>siguen en la zona</EM4>.\n\nPAGO:\nTarifa estándar según la lista tras la entrega\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_RecoverItem_VH_01_title=Recuperación de caja negra muy peligrosa
Battaglia_RPT_Salvage_E_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Desguace\n\nRESUMEN DEL TRABAJO: \nRecibí un aviso sobre <EM4>una nave abandonada cerca de ~mission(Location)</EM4>. Pasé la matrícula por el sistema para asegurarnos de que no estábamos cogiendo la nave de alguien, pero parece no reclamada, así que necesito a alguien con una nave de desguace que vaya hasta allí y la desmantele. \n\nUna vez terminado, <EM4>lleva los recursos a ~mission(Destination)</EM4> y te pagaremos.\n\nPAGO:\nTarifa estándar según la lista tras la entrega de los recursos\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Salvage_E_01_title=Trabajo de desguace: pequeño
Battaglia_RPT_Salvage_H_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Desguace de nave grande\n\nRESUMEN DEL TRABAJO: \nSe corrió la voz de que <EM4>hay una nave grande abandonada cerca de ~mission(Location)</EM4>, así que hacemos un llamamiento a cualquiera que tenga las naves y el equipo para desmantelarla. \n\nSi puedes despiezarla, <EM4>entrega los recursos en ~mission(Destination)</EM4> y te pagaremos por tu tiempo.\n\nPAGO:\nTarifa estándar según la lista tras la entrega de los recursos\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Salvage_H_01_title=Trabajo de desguace: grande
Battaglia_RPT_Salvage_M_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Desguace de nave mediana\n\nRESUMEN DEL TRABAJO: \nMe han dicho que una nave fue destruida cerca de ~mission(Location) tras una emboscada. El propietario está dispuesto a pagar a alguien para que vaya a recuperar las piezas y <EM4>las lleve a ~mission(Destination)</EM4>.\n\nPAGO:\nTarifa estándar según la lista tras la entrega de los recursos\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Salvage_M_01_title=Trabajo de desguace: mediano
Battaglia_RPT_ScanMine_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Trabajo menor de minería\n\nRESUMEN DEL TRABAJO: \nSi tienes tiempo, tengo un trabajo de minería bastante básico para ti. Estoy creando una base de datos de tipos de minerales y sus ubicaciones, pero necesito datos en bruto, así que necesito a alguien que localice <EM4>~mission(Resources) ~mission(MineableType)</EM4>. Puedes quedarte con lo que encuentres, yo sacaré los datos que necesito. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar. Está en tu mobi.</EM4>\n\nGracias.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona y la extracción.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_01_title=Trabajo menor de minería
Battaglia_RPT_ScanMine_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Necesito extraer algo de mena\n\nRESUMEN DEL TRABAJO: \n¿Tienes un momento? Necesito a alguien que vaya a localizar <EM4>~mission(Resources)</EM4> y extraiga al menos <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>. Estamos actualizando nuestra base de datos para futuras expediciones de minería. Puedes quedarte con lo que encuentres, solo necesitamos los datos. ~mission(Rarity)\n\nAdemás, si eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar en tu mobi.</EM4>\n\nAvísame si te animas.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona y la extracción.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_02_title=Necesito extraer algo de mena
Battaglia_RPT_ScanMine_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Se necesita escaneo y minería\n\nRESUMEN DEL TRABAJO: \nTengo aquí un trabajo que podría interesarte. Necesito gente que salga a hacer algo de minería básica para obtener datos geológicos de cara a futuras prospecciones. Necesito a alguien que localice y extraiga <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>. Nos ayudarás enormemente. ~mission(Rarity)\n\nAdemás, si estás atascado o eres nuevo en la minería, hay una <EM4>guía sobre minería de los United Resource Workers en tu mobi</EM4> que deberías consultar.\n\nMantenme informado.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona y la extracción.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_03_title=Se necesita escaneo y minería
Battaglia_RPT_ScanMine_04_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Hay que recoger mena\n\nRESUMEN DEL TRABAJO: \nTengo un gran trabajo de minería con tu nombre en él. Buscamos actualizar nuestros registros sobre rendimientos de minerales, así que necesitamos a alguien que escanee y extraiga unos <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4> a ser posible. ~mission(Rarity)\n\nAdemás, si estás atascado o eres nuevo en la minería, hay una <EM4>guía sobre minería de los United Resource Workers en tu mobi</EM4> que deberías consultar.\n\nAvísame.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona y la extracción.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_04_title=Hay que recoger mena
Battaglia_RPT_ScanMine_05_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Se buscan mineros eficientes\n\nRESUMEN DEL TRABAJO: \nNecesito tu ayuda con algo. Si pudieras extraer ~mission(Resources) ~mission(MineableType)</EM4>, eso ayudaría mucho a comprender los niveles actuales de minerales en el sistema. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar. Está en tu mobi.</EM4>\n\nGracias de antemano.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona y la extracción.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_05_title=Se buscan mineros eficientes
Battaglia_RPT_ScanMine_06_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Minería y recopilación de datos\n\nRESUMEN DEL TRABAJO: \nHoy tengo uno grande para ti. Necesito que vayas hasta allí y extraigas ~mission(Resources) ~mission(MineableType)</EM4> y nos transmitas tus estadísticas. Busco reunir algunos resultados de varios mineros por todo el sistema. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar. Está en tu mobi.</EM4>\n\nAvísame si te animas.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona y la extracción.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_06_title=Minería y recopilación de datos
Battaglia_RPT_ScanMine_Mole_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Minería y MOLE\n\nRESUMEN DEL TRABAJO: \nOtro trabajo especial para ti con una paga extra especial. Como en los trabajos anteriores, necesito que localices y extraigas <EM4> ~mission(Resources) ~mission(MineableType)</EM4> y nos transmitas tus estadísticas. ~mission(Rarity) \n\nNi siquiera puedo expresarte lo útil que ha sido tu trabajo en el pasado, así que he preparado una paga extra especial para este. ~mission(Rarity)\n\nA estas alturas ya sabes lo que haces, pero solo voy a recordarte que <EM4>la guía de minería de los United Resource Workers en tu mobi es genial si te atascas.</EM4>\n\nAvísame si te animas.\n\nPAGO:\nRecibirás una ARGO MOLE personalizada como pago por toda tu ayuda.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_ScanMine_Mole_title=Minería y MOLE
Battaglia_RPT_Scan_01_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Se necesita escaneo de mena\n\nRESUMEN DEL TRABAJO: \nHoy tengo uno sencillo para ti. Busco algunos datos de minería, así que necesito a alguien que escanee algo de <EM4>~mission(Resources)</EM4>. Los datos serán útiles para planificar futuras expediciones. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar. Está en tu mobi.</EM4>\n\nGracias.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_01_title=Se necesita escaneo de mena
Battaglia_RPT_Scan_02_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Mena por escanear\n\nRESUMEN DEL TRABAJO: \nTengo un trabajo para ti. Necesito a alguien que escanee un depósito de <EM4>~mission(Resources)</EM4>. Estoy pensando en crear una base de datos más amplia sobre ubicaciones de minerales, así que tus datos serán útiles.~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar. Está en tu mobi.</EM4>\n\nMantenme informado.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_02_title=Mena por escanear
Battaglia_RPT_Scan_03_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Depósito de mena que necesita escaneo\n\nRESUMEN DEL TRABAJO: \nBusco un minero disponible que salga a escanear en busca de <EM4>~mission(Resources)</EM4>. Solo necesito confirmación de que está ahí y de que merece la pena enviar a alguien a recogerlo. ~mission(Rarity)\n\nAdemás, si estás atascado o eres nuevo en la minería, hay una <EM4>guía sobre minería de los United Resource Workers en tu mobi</EM4> que deberías consultar.\n\nAvísame si tienes tiempo.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_03_title=Depósito de mena que necesita escaneo
Battaglia_RPT_Scan_04_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Escaneo completo de zona en busca de mena\n\nRESUMEN DEL TRABAJO: \nNecesito que compruebes algo por mí si no estás ocupado. Busco ampliar nuestra base de datos de minerales y necesito algunos escaneos de <EM4>~mission(Resources)</EM4>. Yo puedo encargarme de la minería si prefieres dejarlo. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, hay una <EM4>guía sobre minería de los United Resource Workers en tu mobi</EM4> que deberías consultar.\n\nAvísame.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_04_title=Escaneo completo de zona en busca de mena
Battaglia_RPT_Scan_05_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Gran depósito de mena por confirmar\n\nRESUMEN DEL TRABAJO: \nNecesito tu ayuda con un trabajo de prospección. Necesito a alguien que localice un depósito de <EM4>~mission(Resources)</EM4>. \nEstos datos serán útiles para unos estudios que estamos haciendo sobre los niveles de minerales. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, hay una <EM4>guía sobre minería de los United Resource Workers en tu mobi</EM4> que deberías consultar.\n\nGracias de antemano.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_05_title=Gran depósito de mena por confirmar
Battaglia_RPT_Scan_06_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Escaneo de mena prioritario\n\nRESUMEN DEL TRABAJO: \nBusco gente que salga a encontrar depósitos de <EM4>~mission(Resources)</EM4> para contribuir a un experimento a nivel de todo el sistema que ayudará a planificar futuras operaciones de minería. ~mission(Rarity)\n\nAdemás, si no sabes bien dónde buscar o eres nuevo en la minería, <EM4>los United Resource Workers escribieron una guía muy útil que deberías consultar. Está en tu mobi.</EM4>\n\nEspero poder contar contigo.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del escaneo completo de la zona.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_06_title=Escaneo de mena de alta prioridad
Battaglia_RPT_Scan_Golem_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Trabajo muy especial\n\nRESUMEN DEL TRABAJO: \nÚltimamente has hecho un trabajo excelente para nosotros y quería ofrecerte un encargo especial con una recompensa especial. Busco algunos datos más, así que necesito a alguien que <EM4>escanee ~mission(Resources)</EM4> y me envíe lo que encuentre. ~mission(Rarity)\n\nA estas alturas ya sabes lo que haces, pero solo voy a recordarte que <EM4>la guía de minería de los United Resource Workers en tu mobi va de maravilla si te atascas.</EM4>\n\nDime si te animas.\n\nPAGO:\nHe puesto a punto una Drake Golem especial de Teach's para este.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_Golem_title=Trabajo muy especial
Battaglia_RPT_Scan_Prosp_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Escanea, mina y cobra con una Prospector\n\nRESUMEN DEL TRABAJO: \nSigo recopilando datos sobre minería y extracción de minerales, pero para este he conseguido un pago especial. En cuanto <EM4>escanees ~mission(Resources)</EM4> y nos transmitas tus datos, te conseguiré algo realmente bueno por toda tu ayuda. ~mission(Rarity)\n\nA estas alturas ya sabes lo que haces, pero solo voy a recordarte que <EM4>la guía de minería de los United Resource Workers en tu mobi va de maravilla si te atascas.</EM4>\n\nDime si te animas.\n\nPAGO:\nHe conseguido una MISC Prospector especial como pago por toda tu ayuda.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_RPT_Scan_Prosp_title=Escaneo con pago en Prospector
Battaglia_Story01B_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Oportunidad de minería\n\nRESUMEN DEL TRABAJO: \nUno de nuestros contratistas encontró un depósito de <EM4>~mission(ResourceType)</EM4> cerca de <EM4>~mission(Location)</EM4>, pero no pudo extraerlo por su cuenta.\n\nMe pareció una buena oportunidad para un recién llegado con iniciativa.\n\nComo te dije, si necesitas una nave, te hemos reservado una prestada. <EM4>Solo recuerda devolverla.</EM4>\n\nPAGO:\nTarifa estándar según la lista por la extracción de recursos.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_Story01B_title=Oportunidad de minería
Battaglia_Story01C_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Emergencia\n\nRESUMEN DEL TRABAJO: \nHemos recibido una llamada de socorro desesperada del capitán Amir Lucas, de la Blinding Hope. Están <EM4>siendo atacados por una banda de Moraine y necesitan ayuda urgentemente</EM4>.\n\nPAGO:\nN/D\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_Story01C_title=Llamada de socorro de emergencia
Battaglia_Story01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Bienvenido al sistema\n\nRESUMEN DEL TRABAJO: \nHola, la People's Alliance está comprometida a ofrecer oportunidades a mineros, prospectores y recuperadores del sistema, y tenemos una oportunidad interesante que ofrecerte como bienvenida.\n\nSi te interesa, <EM4>solo tienes que aceptar la misión y venir a verme</EM4>.\n\nPAGO:\nTarifa estándar según la lista al completar las tareas.\n\nAUTORIZACIÓN:\nBattaglia, Recco
Battaglia_Story01_obj_hud_01=Salir del viaje cuántico
Battaglia_Story01_obj_long_02=Ve a la Blinding Hope y rescata a la tripulación.
Battaglia_Story01_obj_marker_02=Blinding Hope
Battaglia_Story01_obj_short_02=Ir a la Blinding Hope
Battaglia_Story01_title=Bienvenido al sistema
Battaglia_Story02B_desc=Soy Recco. Esto no es un contrato de la People's Alliance, así que he pensado en escribirte personalmente.\n\nGracias por registrar los restos de la Blinding Hope y confirmar quiénes murieron. Como hablamos, necesito averiguar qué le pasó a Isaac Kepler y creo que puede que los Moraine se lo llevaran. Te envío la ubicación de una base Moraine cercana a la que podrían haberlo llevado; ve ahora y mira si encuentras algún dato sobre lo ocurrido.\n\nTen cuidado. No sé si la estación está abandonada.\n\nGracias por hacer esto. Necesito saber qué le pasó.\n\nRecco
Battaglia_Story02B_title=Buscando a Isaac Kepler
Battaglia_Story02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: La Blinding Hope en apuros\n\nRESUMEN DEL TRABAJO: \nRecibimos una llamada de socorro de la Blinding Hope diciendo que los Moraine los estaban atacando otra vez, y luego se cortó. Solo quiero saber si están bien. <EM4>Dirígete a su última ubicación conocida e informa de lo que encuentres</EM4>.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
