Foxwell_DefendEntitesAndEscort_E_Desc=Necesitamos un contratista que preste servicios de convoy y protección en <EM4>~mission(Location|Address)</EM4>. Uno de nuestros clientes de élite está siendo atacado por una banda de forajidos que ataca sus <EM4>~mission(Objects) y naves</EM4>. Tendrás que mantener a la tripulación a salvo mientras atraviesa la zona, y asegurarte además de que los activos sigan intactos. Estos matones parecen capaces de hacer daños serios, así que asegúrate de enfrentarlos con cautela o el cliente podría no ser el único en sufrir grandes pérdidas.\n\nSi lo manejas según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> como compensación al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.
