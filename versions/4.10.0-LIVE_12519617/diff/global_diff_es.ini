Battaglia_Story03B_desc=Oye, te he pasado la ubicación de Isaac. Ve ahora y tráelo de vuelta a Levski. Creo que tenemos una oportunidad real de salvarlo, pero quiero asegurarme de que los Moraine no lleguen antes a él.\n\nBuena suerte,\n\nRecco
