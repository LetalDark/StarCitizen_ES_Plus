Cornerstone_RepUI_Area=UEE
Cornerstone_RepUI_Description="Construyendo sobre los cimientos de nuestro pasado."\n\nUna de las empresas de construcción más antiguas del 'verso, Cornerstone Developments se enorgullece de ser pionera en la construcción de colonias prefabricadas. A la vanguardia de la nueva frontera, fueron responsables de construir algunas de las primeras estructuras de asentamiento en sistemas como Rhetor, Croshaw y Vega. Hoy en día, su flota de trabajadores puede encontrarse por todo el Imperio realizando construcciones bajo demanda de edificios prefabricados y estaciones espaciales, así como labores generales de mantenimiento y reparación.
