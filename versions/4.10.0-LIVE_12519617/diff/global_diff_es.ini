item_Desc_m_hdtc_jacket_01_01_01=Reducción de daño: 5%\nCapacidad de carga: 0.4K µSCU\n\nElegante, funcional y letal: la línea de ropa Bellator está diseñada para encajar tanto en una cena de gala como en un tiroteo. Combinando tecnología de vanguardia con medidas precisas, esta chaqueta ofrece cierta protección de combate gracias al intrincado entramado de grafeno estratificado en sus hilos. Adornada con un broche decorativo en la solapa, el amplio forro interior de la chaqueta también es capaz de ocultar sutilmente armas y dispositivos pequeños.
