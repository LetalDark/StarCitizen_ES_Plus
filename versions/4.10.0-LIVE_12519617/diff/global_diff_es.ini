item_Desc_mrai_boots_01_01_01,P=Las Botas de Carreras Neutrino utilizan tejidos sintéticos procedentes de artesanos Xi'an para crear un cómodo par de botas lo bastante resistentes como para soportar las exigencias de las carreras a alta velocidad. Inspirado en la cultura y estética tradicional Saisei, el diseño de estas botas de edición especial Mirai es llamativo pero elegante.
item_Desc_mrai_flightsuit_01_01_01,P=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nEl Traje de Vuelo de Carreras Neutrino utiliza tejidos sintéticos procedentes de artesanos Xi'an para crear un cómodo traje de vuelo lo bastante resistente como para soportar las exigencias de las carreras a alta velocidad. Inspirándose en la cultura y estética tradicional Saisei, la marcada franja roja que cruza el cuerpo de esta edición especial Mirai da como resultado un diseño llamativo pero elegante.
item_Desc_mrai_flightsuit_01_03_01,P=Tipo de artículo: Traje de vuelo\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nEncarna el lujo, el estilo y la velocidad enfundándote este traje de vuelo Sakura Sun Neutrino, inspirado en los que lleva el equipo de carreras de Origin. Este impecable traje de vuelo blanco oficialmente autorizado presenta detalles en azul y gris y el logotipo de Origin en varios lugares prominentes.
item_Desc_mrai_flightsuit_01_04_01,P=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\n\nEl amarillo neón audaz y el azul vívido se combinan para hacer que el traje de vuelo de carreras Neutrino de edición especial destaque entre la multitud. Diseñado con los mismos estándares que los trajes de vuelo que llevan los corredores profesionales, presenta logotipos de patrocinadores oficiales para imitar los trajes de corredor de la Murray Cup.
item_Desc_mrai_flightsuit_01_05_01,P=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nEl traje de vuelo de carreras Neutrino de edición limitada adopta el icónico aspecto del personaje de dibujos animados Star Kitten. Inspirado en los que llevan los corredores del Team Takahashi, el traje de vuelo es principalmente rosa con detalles verde azulado y grandes imágenes de Star Kitten en la parte delantera y trasera.
item_Desc_mrai_flightsuit_01_07_02,P=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nDeja una huella imborrable con este traje de vuelo de carreras Neutrino. Ajustándose como una segunda piel sin escatimar en estilo, el perfil blanco puro de la edición WhiteHot, realzado con detalles rojos, ofrece una combinación de estilo llamativo y funcionalidad que te permite concentrarte en lo que más importa: ganar.
item_Desc_mrai_flightsuit_01_07_12,P=Tipo de artículo: Traje de vuelo\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nUn traje de vuelo de carreras que se ajusta como una segunda piel sin escatimar en estilo, la edición Neutrino BlackFire tiene un elegante perfil monocromático realzado con detalles gris pálido y ofrece una discreta combinación de estética y protección que te permite concentrarte en lo que más importa: ganar.
item_Desc_mrai_flightsuit_01_07_18,P=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\nLuce una figura elegante con este traje de vuelo de carreras Neutrino. Ajustándose como una segunda piel sin escatimar en estilo, esta edición especial BlueFlame luce un perfil azul oscuro realzado con detalles rojos y blancos que ofrece una combinación de estilo llamativo y funcionalidad, permitiéndote concentrarte en lo que más importa: ganar.
item_Desc_mrai_flightsuit_02_01_01,P=Tipo de artículo: Traje de vuelo de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +100%\nCapacidad de carga: 8.0 µSCU\n\n¿Necesitas un poco de suerte para cruzar la línea de meta? La exclusiva edición Fortuna de Sakura Sun del Traje de Vuelo de Carreras Neutrino en verde con detalles brillantes puede ser justo lo que necesitas para cambiar tu suerte.
item_Desc_mrai_flightsuit_helmet_01_01_01,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\nEl Casco de Carreras Neutrino utiliza materiales Xi'an avanzados para crear un casco cómodo y ligero lo bastante resistente como para soportar las exigencias de las carreras a alta velocidad. Inspirándose en la cultura y estética tradicional Saisei, el marcado detalle rojo y la marca Mirai de edición especial dan como resultado un diseño llamativo pero elegante.
item_Desc_mrai_flightsuit_helmet_01_03_01,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\nSumérgete de cabeza en la velocidad extrema con comodidad y estilo con este casco de carreras Neutrino de edición especial inspirado en Origin. Principalmente blanco con detalles negros y azules, el casco cuenta con una amplia visera para una visión sin obstrucciones mientras pasas a toda velocidad.
item_Desc_mrai_flightsuit_helmet_01_04_01,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\nEste casco de carreras Neutrino de edición especial fue creado para rendir homenaje a los corredores de la Murray Cup. En amarillo neón, azul y repleto de logotipos de patrocinadores oficiales de las carreras, el casco es a la vez ligero y sumamente cómodo.
item_Desc_mrai_flightsuit_helmet_01_05_01,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\nLa versión de Sakura Sun del icónico casco de carreras que llevan los corredores del Team Takahashi ya puede ser tuya. Este casco Neutrino de edición especial presenta un vibrante rosa con iconografía de Star Kitten en la parte delantera y trasera, además de juguetones bigotes verde azulado a lo largo de la placa facial.
item_Desc_mrai_flightsuit_helmet_01_06_01,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\n¿Necesitas un poco de suerte para cruzar la línea de meta? La exclusiva edición Fortuna de Sakura Sun del Casco de Carreras Neutrino en verde brillante puede ser justo lo que necesitas para cambiar tu suerte.
item_Desc_mrai_flightsuit_helmet_01_07_02,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\nEl casco de carreras Neutrino utiliza materiales Xi'an avanzados para crear un diseño cómodo y ligero lo bastante resistente como para afrontar las exigencias de las carreras a alta velocidad. La edición WhiteHot presenta un acabado blanco brillante y rojo combinado con una estética elegante y minimalista.
item_Desc_mrai_flightsuit_helmet_01_07_12,P=Tipo de artículo: Casco de carreras\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\n\nSakura Sun utiliza materiales Xi'an avanzados para crear un casco cómodo y ligero lo bastante resistente como para afrontar las exigencias de las carreras a alta velocidad. El casco de edición Neutrino BlackFire presenta un acabado gris oscuro combinado con una estética elegante y minimalista.
