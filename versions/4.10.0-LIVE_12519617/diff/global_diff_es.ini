item_Cargo_ShipMining_Pod_Golem_BTGL_Desc=Capacidad: 20 SCU\n\nProducido por Drake como complemento para su vehículo minero GOLEM, este contenedor de mineral cuenta con una construcción resistente capaz de soportar las exigencias del trabajo.
item_Cargo_ShipMining_Pod_Golem_BTGL_Name=Contenedor de mineral GOLEM MC-4
item_Cargo_ShipMining_Pod_MoleProspector_BTGL_Name=Contenedor de mineral MISC mejorado
item_Desc100_Series_Luminalia_white_blue=Equipa tu serie 100 con una pintura mas fresca que una tormenta de nieve. El diseño IceBreak mezcla un gelido blanco con un azul escarchado para una estetica atractiva adecuada para cualquier temporada.
item_DescAEGS_Eclipse_BombRack_S03=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S3\n\nConstruido específicamente para la Eclipse, este soporte de bombas transporta 20 bombas S3.
item_DescAEGS_Eclipse_BombRack_S05=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S5\n\nConstruido específicamente para la Eclipse, este soporte de bombas transporta 4 bombas S5.
item_DescAEGS_Eclipse_BombRack_S10=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S10\n\nConstruido específicamente para la Eclipse, este soporte de bombas transporta 1 bomba S10.
item_DescAEGS_Retaliator_BombRack_S03_Front=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S3\n\nDiseñado para encajar en la parte delantera de la Retaliator, este soporte puede transportar 64 bombas S3.
item_DescAEGS_Retaliator_BombRack_S03_Rear=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S3\n\nDiseñado para encajar en la parte trasera de la Retaliator, este soporte puede transportar 48 bombas S3.
item_DescAEGS_Retaliator_BombRack_S05_Front=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S5\n\nDiseñado para encajar en la parte delantera de la Retaliator, este soporte puede transportar 8 bombas S5.
item_DescAEGS_Retaliator_BombRack_S05_Rear=Tipo de artículo: Soporte de bombas\nFabricante: Aegis Dynamics\nTamaño: S5\n\nDiseñado para encajar en la parte trasera de la Retaliator, este soporte puede transportar 8 bombas S5.
item_DescANVL_Gladiator_BombRack_S3=Tipo de artículo: Soporte de bombas\nFabricante: Anvil Aerospace\nTamaño: S3\n\nEquipa la Gladiator con este soporte de bombas S3 que transporta 6 cargas.
item_DescANVL_Gladiator_BombRack_S5=Tipo de artículo: Soporte de bombas\nFabricante: Anvil Aerospace\nTamaño: S5\n\nEquipa la Gladiator con este soporte de bombas S5 que transporta 2 cargas.
