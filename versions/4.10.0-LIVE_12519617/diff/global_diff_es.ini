TheCollector_Recipes_Title_SuperHeavyCombat=Pesada y Brillante
TheCollector_Recipes_Title_VGLflightsuit=<EM4>[BP]</EM4> Vístete y despega
TheCollector_Recipes_Title_aparGatlingGun=Demasiada Arma
Tut02_Journal01_Trading_Content=El universo de Star Citizen tiene muchos equipos y prendas únicas para que las uses. Estos objetos se pueden saquear de los adversarios, pero también se pueden comprar en las numerosas tiendas del 'verse. Las tiendas especializadas en las principales zonas de aterrizaje tienden a tener el stock necesario para cubrir tus necesidades básicas, mientras que las áreas más tranquilas pueden tener variantes únicas o equipos de nicho.\n\nPara comprar un artículo en exhibición, acércate y aparecerá un cuadro de información. También puedes buscar artículos en los terminales de compras. Aunque estos terminales no son tan prácticos, es más fácil comprar bienes en volumen a través de las interfaces de Terminals. Los terminales también te dan la opción de elegir dónde se entregarán los artículos: ya sea en tu almacenamiento local o directamente en tu inventario personal.\n\nPara vender artículos, primero asegúrate de que estén en tu inventario personal, en el almacenamiento local o sean carga en un vehículo almacenado en ese lugar. Luego puedes interactuar con un Terminal de compras en una tienda y usar la pestaña "VENDER". A partir de ahí, se te darán opciones para seleccionar qué artículos deseas vender. No todas las tiendas comprarán todos los artículos.\n\nINVENTARIO PERSONAL\nTu Inventario Personal es el almacenamiento en tu personaje. Puedes usar esta pantalla para organizar tus artículos, transferirlos entre tu Inventario Personal y el Almacenamiento Local o equiparlos en tu personaje. Ten en cuenta que ciertos artículos tienen requisitos para cuándo se pueden equipar, como el armadura que necesita colocarse sobre un Undersuit. Todos los inventarios tienen una barra de capacidad cerca de la parte superior que indica cuánto pueden almacenar.\n\nALMACENAMIENTO LOCAL\nTu Almacenamiento Local es único para la zona actual en la que te encuentras. Por ejemplo, si estás en microTech, ya no tendrás acceso a tu almacenamiento en Area18. Si bien los Almacenamientos Locales son significativamente más grandes que los Inventarios Personales, aún tienen su propia capacidad máxima.\n\nA medida que acumules un gran número de artículos, puedes usar las pestañas en la parte superior de la ventana de Inventario Local para filtrar categorías específicas de artículos y equipos.\n\nLos vehículos también tienen su propia capacidad de almacenamiento. Este inventario no se comparte con otros jugadores a bordo y permanece accesible para ti mientras estés a bordo del vehículo o mientras ese vehículo esté estacionado en tu zona de aterrizaje actual.\n\nPERDER OBJETOS\nRecuerda, ¡cuando te metes en situaciones peligrosas en el 'verse, te arriesgas a perder tus objetos! Las cosas en tu inventario personal en el momento de tu muerte permanecerán en tu cadáver y deberán ser recuperadas. Lo mismo ocurre cuando se destruye un vehículo. Existe la posibilidad de que otros jugadores encuentren y reclamen tus objetos perdidos antes que tú.\n\nCualquier cosa en almacenamiento en una zona de aterrizaje de una ciudad importante está segura independientemente de lo que te suceda a ti o a tus vehículos.
