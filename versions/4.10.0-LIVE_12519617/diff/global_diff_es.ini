northrock_SOO_intro_desc_001=Saludos,\n\nLas Fuerzas de Seguridad de Crusader se han puesto en contacto con nosotros para recabar nuestra experiencia a la hora de afrontar una situación urgente. Varias plataformas cercanas a Orison han sido tomadas por miembros de la banda Nine Tails y Northrock está deseoso de organizar una operación para expulsarlos y devolver las plataformas a Crusader.\n\nLos Nine Tails han tomado medidas para bloquear todo el tráfico aéreo de la zona, así que se nos ha concedido acceso a una lanzadera segura que te llevará, a ti y a cualquier otro miembro de tu equipo de asalto, a la primera plataforma.\n\nPara que quede claro, debo advertirte de que este no es un contrato para los débiles de corazón. Confío, no obstante, en que gracias a tus habilidades de combate, tú y el equipo que elijas estaréis plenamente a la altura del reto. \n\nEn cuanto llegues a la lanzadera me pondré en contacto directamente contigo con más información.\n\nHablamos pronto,\nAdrienne Du-Buisson\nOficial de Logística - Sucursal de Stanton\nNorthrock Service Group
northrock_SOO_intro_title_001=Plataformas de Orison bajo ataque
northrock_SOO_repeat_desc_001=Nos alegra que emprendas esta operación para Northrock. Aquí tienes el informe completo:\n\nTu prioridad es <EM4>desactivar los tres Alternadores de Identificación Amigo o Enemigo</EM4> que impiden a la Seguridad de Crusader acceder al espacio aéreo alrededor de estas plataformas. Una vez que los alternadores estén fuera de servicio, la Seguridad de Crusader podrá enviar sus naves y volver a asegurar las plataformas. Mientras tanto, las plataformas están conectadas por una serie de lanzaderas no afectadas por los alternadores, que te servirán como principal medio de transporte entre ellas.\n\nTen en cuenta que encontrarás una fuerte resistencia a medida que avances. Crusader ha intentado varias veces hacer frente a esta incursión por su cuenta, pero hasta ahora sin éxito. Sin embargo, creemos que un pequeño equipo de asalto resultará más eficaz para lidiar con las fuerzas Nine Tails. \n\nAdemás, en aras de una plena cooperación, Crusader te ha dado carta blanca para utilizar cualquiera de los recursos que descubras que puedan resultar útiles para la misión. \n\nMucha suerte,\nAdrienne Du-Buisson\nOficial de Logística - Sucursal de Stanton\nNorthrock Service Group
northrock_SOO_repeat_title_001=Recuperar las plataformas de los Nine Tails
