genlocal_maintenance_M_desc_001,P=No sé si lo habéis visto, pero algunas de las máquinas aquí en <EM4>~mission(Location|Address)</EM4> sufrieron muchos daños con la tormenta de anoche y me vendría muy bien algo de ayuda.\n\nPor lo que he visto, probablemente no necesitarás más de <EM4>seis fusibles</EM4>, una <EM4>herramienta de recuperación</EM4> y <EM4>suficientes contenedores de RMC</EM4> para parchear unas cinco tuberías.\n\nAl menos eso es lo que me pareció entender leyendo la <EM4>“Guía de mantenimiento”</EM4> en mi Diario del mobiGlas. Pero no sé, tú eres el experto.\n\nGracias,\n\n~mission(TargetName|First)
