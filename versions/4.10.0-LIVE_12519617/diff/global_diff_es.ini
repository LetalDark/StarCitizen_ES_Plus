LingFamily_delivery_desc_ICC_Special_Cryo=Hola,\n\nNo sé si has oído hablar de ellos alguna vez, pero un representante del ICC (elaboran mapas estelares y estudian el espacio para el Imperio) acaba de contactarnos por un trabajo especial que necesitan recoger de Wikelo's Emporium. \n\nSinceramente, me sorprende un poco que tengan tratos allí, ya que ese puesto comercial Banu no me da precisamente la impresión de "ciencia de vanguardia".\n\n\nEn fin, quieren que la entrega se lleve desde allí hasta ~mission(Destination|Target|Address). También hicieron hincapié en que la carga es muy delicada, así que asegúrate de tratarla con guantes de seda al manipularla, ¿de acuerdo? (No es que normalmente no seas cuidadoso, pero ya sabes cómo son los clientes.) \n\nAsegúrate de llevar un <EM4>haz tractor de alta resistencia</EM4> y una nave con espacio suficiente para almacenar <EM4>~mission(MissionMaxSCUSize) de carga</EM4>.\n\nGracias,  \nConni Ling \nCoordinadora de logística de carga \nLing Family Hauling
