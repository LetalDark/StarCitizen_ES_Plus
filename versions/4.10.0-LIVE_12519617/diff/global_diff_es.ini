ea_popup_body_ModeDisclaimer_MasterModes=Este modo de juego es una prueba especial limitada utilizada para recopilar comentarios sobre varias nuevas características que se están desarrollando para el modelo de vuelo de Star Citizen. No es representativo del Universo Persistente actual ni de la versión final prevista del juego.\n \nPuedes ver todos los detalles sobre el modelo de vuelo para los Modos Maestros y las características presentes en esta prueba en Spectrum haciendo clic en el siguiente enlace.\n\nNuevas Características:\n- Mapas Atmosféricos Activados\n- Selección Ampliada de Naves: P-52, Buccaneer, Gladius, Super Hornet F7C-M, Vanguard Warden, Constellation Andromeda, Hammerhead.\n- Ajuste de Capacitores\n- Mejoras Rotacionales al Impulsar, ahora dependen de la asignación de capacitores. \n- Ajuste de la Resistencia de los Escudos\n- Todas las Naves de Combate ahora utilizan escudos "Burbuja". \n\nPara esta prueba, nos interesa cómo los jugadores utilizan el sistema de Modos Maestros en más entornos, arquetipos y modos.\nTodas las naves presentes en esta prueba no son personalizables y están diseñadas específicamente para esta prueba. Por favor, pruébalas todas y dinos qué piensas en la retroalimentación.\nAtajos de Teclado: ~action(spaceship_movement|v_master_mode_cycle) para cambiar Modos Maestros
