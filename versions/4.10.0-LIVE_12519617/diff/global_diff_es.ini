item_DescMRCK_S01_DRAK_Single_S01,P=Tipo de artículo: Bastidor de misiles\nFabricante: Drake Interplanetary\nTamaño: 1\nMisiles: 6xS1\n\nDiseñado para inclinar la balanza en combate, Drake desarrolló este bastidor de misiles para transportar una cantidad de potencia de fuego relativamente alta para el tamaño de la nave.
item_DescMRCK_S02_ORIG_100i_Dual_S02,P=Tipo de artículo: Soporte de misiles\nFabricante: Origin Jumpworks\nTamaño: 2\nMisiles: 2xS2\n\nSoporte de misiles a medida para la 100i que dispara dos misiles S2.
item_DescMRCK_S02_ORIG_125a_Quad_S02,P=Tipo de artículo: Soporte de misiles\nFabricante: Origin Jumpworks\nTamaño: 2\nMisiles: 4xS2\n\nSoporte de misiles a medida para la 125a que dispara cuatro misiles S2.
item_DescMRCK_S03_GAMA_Railen_Dual_S02=Tipo de artículo: Bastidor de misiles\nFabricante: Gatac Manufacture\nTamaño: 3\nMisiles: 2xS2\n\nDiseñado por Gatac, este bastidor de misiles es capaz de almacenar dos misiles S2.
item_DescMRCK_S04_GAMA_Railen_Octo_S01=Tipo de artículo: Bastidor de misiles\nFabricante: Gatac Manufacture\nTamaño: 4\nMisiles: 8xS1\n\nDiseñado por Gatac, este bastidor de misiles es capaz de almacenar ocho misiles S1.
item_DescMRCK_S05_ANVL_Gladiator_Quad_S05=Tipo de artículo: Bastidor de misiles\nFabricante: Anvil Aerospace\nTamaño: 5\nMisiles: 4xS5 \n\nEste bastidor cuádruple de misiles a medida del Gladiator alberga cuatro misiles S5.
item_DescMRCK_S05_DRAK_Ironclad_Torpedo_Silo=Tipo de artículo: Bastidor de misiles\nFabricante: Drake Interplanetary\nTamaño: 5\nMisiles: 5xS5\n\nEste bastidor a medida para la Drake Ironclad puede transportar y desplegar cinco torpedos S5.
item_DescMeteor_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Meteor con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescPOWR_VNCL_S04_Mauler=\nEnergía: 29 | HP: 69000\nDisto: 70K | Disipa: 66.66/s | Rec: 1056.1s\nEM/Seg: 455.2 | EM Decay: 0.15\n60000 kg\n\nEl generador de energía integrado del Vanduul Mauler produce suficiente energía para el funcionamiento de los sistemas esenciales, incluso en combate intenso.
item_DescPitbull_Cream_Silver_Silver=El revestimiento Wind Chill para la Pitbull presenta pintura blanca nítida con reflejos negros y detalles plateados.
item_DescPitbull_Metal_Metal_Yellow=El revestimiento Aquamarine ofrece una base verde azulada metálica con sutiles detalles amarillos para causar impresión, antes de que repartas el primer puñetazo.
item_DescPitbull_Red_Black_Black=Lánzate al combate con este revestimiento de un rojo sangre para tu Pitbull y muéstrale a todos en el campo de batalla exactamente lo que has venido a buscar.
item_DescPitbull_Yellow_Black_Black=Cuando quieres que te vean venir, el revestimiento Hardstrike es una atrevida explosión de amarillo que hace que cada combate sea aún más vibrante.
item_DescPlayerDeco_Flair_Banu_Instrument_1_a=Inspirado en los instrumentos de fabricación humana que fueron la primera introducción de los Banu a la música, este Ochelo decorado con esmero presenta cuatro cuerdas sobre un mástil elevado y una base con piel de tambor. Algunos de los intérpretes más populares del instrumento han alcanzado la fama actuando como artistas callejeros en mercados y plazas urbanas.
item_DescPlayerDeco_Flair_VanduulLance_DisplayCase=Montada sobre una vitrina vertical, esta pieza expone los restos de una lanza Vanduul recuperada tras la Batalla de Vega.
item_DescPlayerDeco_Gunrack_4P_3R_Lowtech_1_a=Hecho para el entusiasta de las armas que valora sus armas por algo más que la cantidad de daño que pueden causar. Cuenta con numerosos estantes de exhibición para tus armas favoritas, así como espacio de almacenamiento para munición y accesorios de repuesto, todo en un elegante conjunto que muestra tus mejores piezas.
item_DescQDRV_VNCL_S04_Mauler=\nVel: 500 Mm/s | Consumo: 0.0613\nCarga: 9s | Enfriamiento: 32s\nDisto: 10 | Disipa: 0.67/s\n150000 kg | HP: 150000 | EM: 49900 | Energía: 11\n[Eficiencia/tanque] 14.6 SCU: 6.6 | 120 SCU: 54.4\n\nEsta unidad cuántica ha sido calibrada para permitir al Mauler realizar viajes cuánticos largos y cortos, así como acceder a puntos de salto.
item_DescQTNK_VNCL_S04_Mauler=Este tanque de combustible cuántico almacena combustible para alimentar el motor cuántico del Mauler.
item_DescRADR_VNCL_S04_Mauler=\nAsist: 1300-2002m | Margen: 90m\nIR: 90% | EM: 90% | CS: 90%\nEnergía: 5-5 | EM: 2270 | HP: 7300\n\nEl sistema de radar del Vanduul Mauler le permite detectar objetos grandes y pequeños para obtener datos de navegación y combate.
item_DescRAFT_Paint_White_Blue_Blue=Blanco nítido con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, recuperación y más han hecho del imperio lo que es hoy.Blanco impoluto con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, desguace y demás labores han sido los verdaderos cimientos del esfuerzo fronterizo en Stanton.
item_DescRSI_LaserRepeater_S5=Fabricante: Robert Space Industries\nTipo de artículo: Repetidor láser\nTamaño: 5\n\nDiseñado para saturar escudos con una andanada de fuego láser, este repetidor láser RSI Echion hecho a medida despojará a los enemigos de sus defensas, dejándolos vulnerables ante ataques aún más devastadores.
item_DescRailen_Paint_Black_Black_Black_Stencil_1,P=La edición Hyaotan presenta un sutil patrón gris oscuro en forma de olas sobre su base gris claro, con luces azules integradas exclusivas de esta edición que aportan ese brillo de otro mundo.
item_DescRailen_Paint_Black_Black_Black_Stencil_2=La edición Malachitus presenta un patrón verde iridiscente en forma de olas sobre su base negra, que emite un resplandor cautivador bajo la luz de las estrellas.
item_DescRailen_Paint_Bronze_Grey_Teal=La pintura Insularis añade un elegante y etéreo acabado en verde azulado y metal con pátina para resaltar y celebrar la naturaleza de otro mundo de la Railen.
item_DescRailen_Paint_Gold_Grey_Grey_Stencil_1=La edición Uamchuai rompe los moldes con una base gris y marrón arena, con favorecedores reflejos dorados polvorientos que recorren el casco de la nave.
item_DescRailen_Paint_Grey_Grey_Gold,P=La edición Agapanthia luce una elegante base negra con sutiles reflejos dorados oscuros que recorren el casco de la nave.
item_DescRailen_Paint_Hyaotan_black_blue=Haz que tu nave de carga Railen sea aún más distintiva y dinámica visualmente con la pintura Hyaotan, negra con reflejos azules.
item_DescRailen_Paint_White_Grey_Gold,P=La edición Ch.iiing luce una atrevida base blanca con llamativos reflejos dorados que recorren el casco de la nave.
item_DescRetaliator_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Retaliator con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescSHLD_VNCL_S04_Mauler,P=\nEscudo: 1056K | Regen: 77440/s | Tiempo: 13.6s\nRetardo: 4.7s | Caído: 9.39s\nEnergía: 3-6 | EM: 2720 | HP: 53000\n\nEl generador de escudo del Mauler proporciona cobertura defensiva contra el fuego entrante y otras amenazas a la nave.
item_DescSalvation_Paint_silver_teal_white=El Foundation Fest es una oportunidad para que ciudadanos y civiles se unan y fortalezcan los cimientos de nuestra comunidad. Muestra tu compromiso con un universo mejor con esta pintura personalizada.
item_DescShiv_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Shiv con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_DescShiv_Paint_Black_Black_Red_Pirate=Esta pintura adopta la iconografía pirata clásica al incluir varios símbolos de calavera y tibias cruzadas sobre el oscuro casco de la Shiv, con detalles en rojo sangre.
item_DescStarlite_Paint_black_black_gold=Para los capitanes del Starlite que prefieren marcar la diferencia con sutileza, MISC ofrece la distinguida pintura Dusk. Un casco completamente gris realza la silueta clásica de la nave con elegantes ribetes dorados.
item_DescStarlite_Paint_grey_red_black=El Starlite estrena un techo gris frío y un fondo en rojo intenso con la pintura Bonfire, sutil pero deslumbrante.
item_DescStarlite_Paint_khaki_black_white=Prepara tu Starlite para el viaje que te espera con la pintura Mojave, que combina un techo color tostado, una zona inferior en gris y ribetes blancos.
item_DescStarlite_Paint_white_black_yellow=Dale al Starlite una imagen audaz con la pintura Empyrean, de dinámico diseño tricolor. Detalles en amarillo separan el morro blanco de una sección central gris, aportando a la nave una sensación añadida de velocidad.
item_DescSyulen_Paint_bronze_grey_red=Convierte a tu Syulen en una nave digna de admiración con la pintura Xy'kara, que dota a la nave de un rico aspecto bronce jaspeado en tonos grises y matices rojizos.
item_DescTiburon_Paint_blue_lightblue_red=Despedaza a tus enemigos con el revestimiento Colmillos, que transforma al Tiburon con un azul acerado y feroces dientes de tiburón.
item_DescTiburon_Paint_green_green_red=Predominantemente de un verde militar con toques rojos, el revestimiento Pinnacle aporta una estética con los pies en la tierra al Tiburon.
item_DescTiburon_Paint_grey_white_silver=Combinando tonos de gris, blanco y plata, el revestimiento Enforcer enfatiza la robustez del Tiburon con su apariencia estratificada.
item_DescTiburon_Paint_red_grey_grey=El revestimiento Vermillion utiliza un rojo llamativo como color principal, complementado con profundos detalles negros.
item_DescTyilui_Paint_Black_Black_Black_Stencil_2=La edición Tatomidae presenta un elegante patrón metálico de olas en granate sobre el esbelto casco oscuro.
item_DescTyilui_Paint_Bronze_Grey_Teal=La pintura Insularis añade un elegante y etéreo acabado en verde azulado y metal con pátina para resaltar y celebrar la naturaleza de otro mundo de la Tyilui.
item_DescTyilui_Paint_Gold_Grey_Grey_Stencil_1=La edición Uamchuai rompe los moldes con una base gris y marrón arena, con favorecedores reflejos dorados polvorientos que recorren el casco de la nave.
item_DescTyilui_Paint_Grey_Grey_Gold,P=La edición Agapanthia luce una elegante base negra con sutiles reflejos dorados oscuros que recorren el casco de la nave.
item_DescTyilui_Paint_White_Grey_Gold,P=La edición Ch.iing luce una atrevida base blanca con llamativos reflejos dorados que recorren el casco de la nave.
item_DescUTV_Paint_Brown_Grey_Red=Camuflaje marrón claro y gris combinados con detalles en rojo para la pintura Resistor Camo.El camuflaje marrón claro y gris se combina con acentos rojos en la pintura Resistor Camo.
item_DescUTV_Paint_Gold_Black_Black=La pintura Bonanza le da a la UTV un aspecto lustroso con su acabado en dorado y negro.La pintura Bonanza otorga al UTV un aspecto lujoso con su acabado dorado y negro.
item_DescUTV_Paint_Green_Grey_Red=La pintura Wilderness Camo aporta un patrón clásico de camuflaje verde y gris a la UTV con detalles en rojo.La pintura Wilderness Camo aporta al UTV un clásico patrón de camuflaje en verde y gris con acentos rojos.
item_DescUTV_Paint_Grey_Black_Orange=Los vibrantes toques de naranja destacan sobre la pintura base gris de la pintura Reckoner.Llamativos toques de naranja destacan sobre la base gris de la pintura Reckoner.
item_DescUTV_Paint_White_Blue_Blue=Blanco nítido con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, recuperación y más han hecho del imperio lo que es hoy.Blanco impoluto con acentos azules, la pintura Keystone celebra a los trabajadores cuya minería, refinado, transporte, desguace y demás labores han sido los verdaderos cimientos del esfuerzo fronterizo en Stanton.
item_DescVNCL_Gen2_LaserBeam_S9=Fabricante: Vanduul\nTipo de artículo: Rayo láser\nDPS: 15000\n1240 m/s | 7924m\nPen: 24.5 | Radio: 1.23-2.45\nCap: 225 | Coste: 1 | Reg: 45/s | CD: 3s\nHP: 466 | Energía: 1\n\nEste destructivo rayo láser, encontrado típicamente en naves de guerra Vanduul, es comúnmente conocido por su \ndesignación de la Marina de la UEE: 'IGNITER'.
item_DescVNCL_Gen2_LaserRepeater_S6=Fabricante: Vanduul\nTipo de artículo: Repetidor láser\nDPS: 800 | Alpha: 64 | 750 RPM\n1350 m/s | 4806m | Disp: 0.6\nPen: 2.5 | Radio: 0.13-0.25\nCap: 225 | Coste: 1 | Reg: 2787/s | CD: 3s\nHP: 10200 | EM: 446 | Energía: 1.2\n\nEste repetidor láser de corto alcance, estándar en las naves capitales Vanduul de mayor envergadura, recibe el \nnombre de 'STRIKER' por su designación de la Marina de la UEE.
item_DescVNCL_Gen2_PlasmaCannon_S8=Fabricante: Vanduul\nTipo de artículo: Cañón de plasma\nDPS: 4671.3 | Alpha: 4671.27 | 60 RPM\n965.2 m/s | 8725m | Disp: 0.45\nPen: 10.5 | Radio: 0.53-1.05\nCap: 225 | Coste: 1 | Reg: 537/s | CD: 3s\nHP: 2780 | Energía: 0.25\n\nEste contundente cañón de plasma, frecuentemente visto en buques de guerra Vanduul, es conocido como 'RAGE', su designación UEE.
item_DescVNCL_Gen2_TachyonCannon_S10=Fabricante: Vanduul\nTipo de artículo: Cañón de taquiones\nDPS: 15000\nCap: 225 | Coste: 1 | Reg: 537/s | CD: 3s\nHP: 1670 | Energía: 0.25\n\nEste cañón de taquiones devastadoramente potente, encontrado típicamente en naves capitales \nVanduul a gran escala, es más comúnmente conocido por su designación de la Marina de la UEE: 'ANNIHILATOR'.
item_DescVNCL_Gen2_TachyonCannon_S7=Fabricante: Vanduul\nTipo de artículo: Cañón de taquiones\nDPS: 125 | Alpha: 125 | 60 RPM\n917 m/s | 10921m | Disp: 0.45\nPen: 12.25 | Radio: 0.61-1.23\nCap: 225 | Coste: 1 | Reg: 537/s | CD: 3s\nHP: 400 | EM: 1780 | Energía: 3.6\n\nEste potente cañón de taquiones, apreciado en las naves de guerra Vanduul por su largo alcance, es \nmás comúnmente conocido por su designación oficial de la UEE: 'ERADICATOR'.
item_DescWolf_Paint_Black_Black_Red_Camo=Surca discretamente el cielo nocturno en el Wolf con la pintura Nightbreak, que es principalmente negra con detalles rojos.
item_Desc_COMP_WLOP_S00_Adze=Tipo de artículo: Computadora\nFabricante: WillsOp\nTamaño: 0\nGrado: C\nClase: Civil\n\nAhora puedes experimentar el robusto procesamiento de datos de WillsOp en formato móvil con el sistema informático Adze.
item_Desc_COOL_TYDT_S01_SnowBlind=Tipo de artículo: Enfriador\nFabricante: Tyler Design & Tech\nEnfriamiento: 24\nEnergía: 1-1 | EM: 250 | IR: 2570 | HP: 140\nDisto: 2.1K | Disipa: 140/s | Rec: 16.5s\n76 kg\n\nUna firma IR que se está activando es una forma segura de alertar a todo el sector sobre su paradero y, a menudo, puede resultar potencialmente peligrosa. Con el sistema de refrigeración Snowblind de Tyler Design & Tech a bordo, puede reducir significativamente sus emisiones de calor mientras mantiene su nave funcionando en condiciones termicas optimas.
item_Desc_Carryable_1H_CY_flair_poster_HT_Gamescom2026_1_a=Contempla la majestuosidad de la M80 con este póster exclusivo que muestra la estructura aerodinámica y monocromática de la nave, con el lema Beauty Is Power en la parte superior.
item_Desc_Carryable_1H_SQ_Flair_Coin_1_chairmansclub_a=Esta moneda coleccionable luce el distinguido logotipo del Chairman's Club, elegantemente grabado en relieve sobre su superficie.
item_Desc_Carryable_2H_CY_CollectorMaterial_001=Esto es prueba para nuevo metamaterial con diseño especial de Wikelo. Será ligero y fuerte pero ¡quizás no! Bueno para probar.
item_Desc_Carryable_2H_SQ_CollectorMaterial_002=Esto es nueva prueba metamaterial con diseño de Wikelo. Yo creo este ayudará a hacer cosas ir más rápido. Últimas dos pruebas no muy buenas, pero quizás esta funciona.
item_Desc_DMC_gloves_01_01_02=Los guantes Gauntlet de DMC se sienten como una larga jornada de trabajo. Fabricados con resistentes mallas compuestas GranTec, estos Gauntlet hacen honor a su nombre, brindando máxima protección frente a entornos e impactos para que puedas seguir trabajando un día más.
item_Desc_ELD_Shirt_04_01_01=Una cómoda camiseta de algodón blanco con un gran logo de microTech en el frente y uno más pequeño en la parte trasera.
item_Desc_GRIN_utility_medium_arms_03_05_16=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nHecha para mineros pero lista para cualquier aventura, la armadura Strata de Greycat Industrial ofrece protección de primera y prestaciones prácticas. Cada pieza presenta un diseño angular y preciso para brindar cobertura donde más se necesita. La edición Levski luce un elegante blindaje negro con detalles en amarillo oscuro.
item_Desc_GRIN_utility_medium_backpack_03_05_16=Tipo de artículo: Mochila media\nCapacidad de carga: 127.5K µSCU\nCompatibilidad de núcleo: Media y pesada\n6 kg\n\nFabricada para mineros pero lista para cualquier aventura, la mochila Strata de Greycat Industrial ha sido diseñada para ofrecer una solución de almacenamiento funcional. La edición Levski luce un elegante blindaje negro con detalles en amarillo oscuro y el símbolo de la People's Alliance.
item_Desc_GRIN_utility_medium_core_03_05_16=Tipo de artículo: Armadura media\nReducción de daño: 30%\nCapacidad de carga: 15k µSCU\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCompatibilidad de mochila: Ligera y media \n\nHecha para mineros pero lista para cualquier aventura, la armadura Strata de Greycat Industrial ofrece protección de primera y prestaciones prácticas. Cada pieza presenta un diseño angular y preciso para brindar cobertura donde más se necesita. Un cinturón de herramientas con prácticas bolsas y una mochila reforzada ofrecen mucho espacio de almacenamiento. La edición Levski luce un elegante blindaje negro con detalles en amarillo oscuro y el símbolo de la People's Alliance.
item_Desc_GRIN_utility_medium_legs_03_05_16=Tipo de artículo: Armadura media\nReducción de daño: 30%\nCapacidad de carga: 10k µSCU\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nHecha para mineros pero lista para cualquier aventura, la armadura Strata de Greycat Industrial ofrece protección de primera y prestaciones prácticas. Cada pieza presenta un diseño angular y preciso para brindar cobertura donde más se necesita. Un cinturón de herramientas con prácticas bolsas y una mochila reforzada ofrecen mucho espacio de almacenamiento. La edición Levski luce un elegante blindaje negro con detalles en amarillo oscuro y el símbolo de la People's Alliance.
item_Desc_HRST_Tiburon_S10_laserbeam=Fabricante: Hurston Dynamics\nTipo: Rayo láser\nTamaño: 10\n\nDesarrollado conjuntamente con los especialistas en armamento de Aegis para formar parte del armamento anticapital dedicado del Tiburon, el Supremacy-10T combina precisión quirúrgica con un poder destructivo devastador.
item_Desc_KeyCard_SOO_IFFI_1=Una tarjeta de un solo uso que contiene los códigos para acceder al Alternador de Identificación Amigo o Enemigo de los Nine Tails en la plataforma Solanki.
item_Desc_KeyCard_SOO_IFFI_2=Una tarjeta de un solo uso que contiene los códigos para acceder al Alternador de Identificación Amigo o Enemigo de los Nine Tails en la plataforma Hartmore.
item_Desc_KeyCard_SOO_IFFI_3=Una tarjeta de un solo uso que contiene los códigos para acceder al Alternador de Identificación Amigo o Enemigo de los Nine Tails en la Barcaza de Carga.
item_Desc_KeyCard_SOO_WeaponCache=Un código de acceso de un solo uso para un contenedor de almacenamiento de los Nine Tails.
item_Desc_alb_mask_04_01_01=El pasamontañas Volatus es un básico para operativos de seguridad y militares. Confeccionado con algodón resistente y transpirable, 100% cultivado en Sol, y con fibras de polímero reforzado integradas en el tejido, este pasamontañas sirve tanto para mantenerte cómodo como para ocultar tu identidad. El característico rosa con bigotes azules estampado en esta máscara, junto con el icono de edición limitada Shinobi Sally, convierten esta prenda facial en una pieza destacada para cualquier look.
item_Desc_battaglia_boot_01=Una bota de trabajo clásica. Este calzado con puntera de goma es a la vez resistente y ligero, con acolchado adicional en la suela para facilitar el movimiento y reducir la presión sobre el pie que le queda a Battaglia.
item_Desc_battaglia_jacket_01=Sencilla, práctica y hace el trabajo sin complicaciones, muy al estilo de la propia Battaglia. El conjunto presenta una chaqueta de estilo militar verde oscuro sin mangas, con abundante espacio para bolsillos, sobre su característica camiseta interior amarilla y un chaleco blanco.
item_Desc_battaglia_meca_01=Fabricadas especialmente para Battaglia tras un accidente minero, las prótesis presentan un resistente blindaje de hierro con detalles en amarillo mostaza. La mano, desarrollada pensando en el movimiento preciso, hace posible complejos movimientos de los dedos. La pierna, impulsada por sensores cinéticos en el tobillo, permite que la prótesis se adapte a sus necesidades de movimiento sin necesidad de ajuste manual.
item_Desc_battaglia_pants_01=Los pantalones cargo definitivos para quien no teme trabajar duro, pero quiere hacerlo con comodidad. Estos pantalones marrón oscuro presentan grandes bolsillos en la parte superior de las piernas, además de un recorte en la rodilla derecha que la propia Battaglia acortó para hacer sitio a su pierna protésica.
item_Desc_cbd_hat_03_defcon2956=0.25 kg\n\nDemuestra tu agradecimiento a los héroes anónimos de la UEE con la gorra oficial de DefenseCon 2956.
item_Desc_cbd_hat_03_palevski_01=Este sombrero de ala es de color verde oscuro y muestra el logotipo de la People's Alliance en la parte frontal.
item_Desc_cds_armor_heavy_core_01_02_02,P=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nPurga de radiación: 251.1 REM/s\nCapacidad de carga: 8.0 µSCU\nMochilas: Todas\n\nBasada en la armadura de combate pesada ADP-mk4 de CDS, este conjunto ha sido modificado respecto a su forma original. Cuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. Esta armadura permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.
item_Desc_cds_armor_heavy_helmet_01_02_02,P=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nPurga de radiación: 251.1 REM/s\n\nBasada en la armadura de combate pesada ADP-mk4 de CDS, este conjunto ha sido modificado respecto a su forma original. Cuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. Esta armadura permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece. El visor es compatible con la retícula AR.
item_Desc_cds_armor_heavy_legs_01_02_02,P=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nPurga de radiación: 251.1 REM/s\nCapacidad de carga: 8.0 µSCU\n\nBasada en la armadura de combate pesada ADP-mk4 de CDS, este conjunto ha sido modificado respecto a su forma original. Cuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. Esta armadura permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.
item_Desc_cds_combat_heavy_arms_01_02_02=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nPurga de radiación: 251.1 REM/s\n\nCuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. La armadura pesada ADP-mk4 de Clark Defense Systems permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_heavy_core_01_02_02=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nPurga de radiación: 251.1 REM/s\nCapacidad de carga: 8.0 µSCU\nMochilas: Todas\n\nCuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. La armadura pesada ADP-mk4 de Clark Defense Systems permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
