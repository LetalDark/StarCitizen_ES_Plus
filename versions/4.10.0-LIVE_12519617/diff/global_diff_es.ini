DeadSaints_RecoverCargo_Medium_Description=¿Tienes una nave y <EM4>un rayo tractor de gran potencia</EM4>? Bien. Tengo trabajo para ti.\n\nNo sé cómo se enteraron de que íbamos a pasar por allí, pero a uno de mis transportistas le tendieron una emboscada en <EM4>~mission(Location|Address)</EM4>. El piloto ha dejado de responder, así que asumo que lo han liquidado, pero el rastreador de la carga está inmóvil por ahora.\n\nEs de esperar que los bastardos que se cargaron a mi piloto sigan por allí, así que trae refuerzos. Recupera la carga y sal de ahí, no hace falta arriesgar más buenos transportistas en este lío.\n\nLleva la mercancía al elevador de carga en <EM4>~mission(Destination|Address)</EM4> y te enviaré el pago.\n\n-Twitch\n\n<EM4>Reputación: +150 Dead Saints (General)</EM4>
