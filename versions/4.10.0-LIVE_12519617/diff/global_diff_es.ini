Battaglia_Story03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Una idea para Isaac\n\nRESUMEN DEL TRABAJO: \nNecesito tu ayuda con un plan que se me ha ocurrido para Isaac. <EM4>Te daré los detalles en persona</EM4>, pero implicará volver a territorio Moraine, así que tendrás que ir preparado.\n\nPAGO:\nTarifa estándar según la lista tras la confirmación del estado de toda la tripulación.\n\nAUTORIZACIÓN:\nBattaglia, Recco
