item_Desc_qrt_mask_01_01_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -5 / 50 °C\n\nInspirada en el antiguo folclore humano, la máscara Kiba presenta un rostro demoníaco con largos colmillos y aún así ofrece cierta protección gracias al uso de metales tratados. Este semblante intimidante basta para transformar a cualquier guerrero en una presencia aterradora en el campo de batalla.
