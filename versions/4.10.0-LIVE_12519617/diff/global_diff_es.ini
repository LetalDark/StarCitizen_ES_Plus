item_desc_FPS_Consumable_KeyCard_TSG_CargoDeck_A=Esta tarjeta llave concede acceso a la 'Cubierta de carga A' situada en la Estación Shattered Blade.
item_desc_scraper_Salvation_Small=Fabricante: Greycat Industrial\nTipo de artículo: Módulo raspador\nVelocidad de extracción: 0.8\nRadio: 1.0m\nEficiencia de extracción: 100%\n\nHecho para la Salvation de RSI, el eficiente módulo raspador Hart permite a los recuperadores trabajar con rapidez para explotar una reclamación.
item_fuelnozzle_GRIN_Fast_Desc,P=Fabricante: Greycat Industrial\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 1,45 SCU/s\nVelocidad de flujo cuántico: 0,8 SCU/s\nIntegridad máx.: 7140\n\nAl permitir un caudal general considerablemente mayor, la boquilla de combustible Norfield de Greycat prioriza la transferencia rápida y eficiente de combustible y solo sacrifica parte de la capacidad de almacenamiento del depósito.  \n
item_fuelnozzle_GRIN_Safe_Desc,P=Fabricante: Greycat Industrial\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 1,05 SCU/s\nVelocidad de flujo cuántico: 0,58 SCU/s\nIntegridad máx.: 12390\n\nAl mantener una presión de trabajo más alta, la boquilla de combustible Harkin de Greycat no solo presume de una construcción segura, sino que además permite que el almacenamiento adjunto contenga combustible adicional, aunque a una velocidad de transferencia general más lenta.\n
item_fuelnozzle_MISC_Standard_Desc,P=Fabricante: MISC\nTipo de artículo: Boquilla de combustible\nVelocidad de flujo de hidrógeno: 1,65 SCU/s\nVelocidad de flujo cuántico: 0,91 SCU/s\nIntegridad máx.: 9000\n\nLa boquilla elegida por el aclamado MISC Starfarer, la RN-7s, fue diseñada para ser una opción de transferencia de combustible flexible adecuada para una gran variedad de situaciones.\n
item_fuelpod_GRIN_BigAndFast_Desc,P=Fabricante: Greycat Industrial\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 1,3\nModificador de flujo cuántico: 1,3\nIntegridad máx.: 11550\nCapacidad: 24 SCU\n\nLos productos de Greycat han sido durante mucho tiempo un pilar de los sectores industrial y comercial, y su reputación de calidad y fiabilidad se extiende a sus depósitos de combustible. La Gargant es la mayor de la gama de Greycat y presume de velocidades de repostaje que establecen nuevos estándares para un depósito de este tamaño.
item_fuelpod_GRIN_BigAndFast_Name=Gargant
item_fuelpod_GRIN_FastAndSmall_Desc,P=Fabricante: Greycat Industrial\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 1,7\nModificador de flujo cuántico: 1,7\nIntegridad máx.: 21000\nCapacidad: 12 SCU\n\nLa Greycat Bonito ofrece una velocidad de transferencia de primer nivel en una unidad compacta. Esto tiene el coste de la capacidad, lo que hace que la Bonito sea más adecuada para misiones de respuesta rápida repostando naves de tamaño medio a pequeño.
item_fuelpod_GRIN_FastAndSmall_Name=Bonito
item_fuelpod_MISC_Standard_Desc,P=Fabricante: MISC\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 1,16\nModificador de flujo cuántico: 1,16\nIntegridad máx.: 22800\nCapacidad: 20 SCU\n\nEl depósito de combustible estándar del Starfarer, el CR-60, fue diseñado por MISC para ser una opción de almacenamiento de combustible bien equilibrada y lista para abordar una amplia variedad de trabajos.\n
item_fuelpod_SHIN_BitQuckerThanStandard_Desc,P=Fabricante: Shubin Interstellar\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 2,15\nModificador de flujo cuántico: 2,15\nIntegridad máx.: 23040\nCapacidad: 30 SCU\n\nLos depósitos de combustible de Shubin se basan en una riqueza y profundidad de experiencia y conocimientos construidos a lo largo de siglos de desarrollo e innovación. La Nemec es una opción polivalente eficaz, a pesar de sacrificar algo de resistencia al daño para facilitar mayores velocidades de transferencia de combustible.
item_fuelpod_SHIN_BitQuckerThanStandard_Name=Nemec
item_fuelpod_SHIN_FastAndInsecure_Desc,P=Fabricante: Shubin Interstellar\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 2,06\nModificador de flujo cuántico: 2,06\nIntegridad máx.: 11880\nCapacidad: 23 SCU\n\nLa Shubin Rumford prioriza —y consigue— una alta velocidad de transferencia de combustible por encima de la durabilidad, lo que la convierte en una buena elección para una ruta de repostaje a través de espacio protegido.
item_fuelpod_SHIN_FastAndInsecure_Name=Rumford
item_fuelpod_STOR_BigandSlow_Desc,P=Fabricante: Stor*All\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 0,45\nModificador de flujo cuántico: 0,45\nIntegridad máx.: 21000\nCapacidad: 32 SCU\n\nEl Stor*All GSX-EX ofrece una combinación impresionante de tamaño premium y protección, y merece una consideración seria cuando la velocidad de repostaje sea menos prioritaria.
item_fuelpod_STOR_BigandSlow_Name=GSX-EX
item_fuelpod_STOR_Fast_Desc,P=Fabricante: Stor*All\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 0,54\nModificador de flujo cuántico: 0,54\nIntegridad máx.: 14280\nCapacidad: 23 SCU\n\nCuando se trata de equilibrar tu cuenta de resultados, el tiempo es oro. Por eso Stor*All diseñó el depósito de combustible GSX-RF con uno de los caudales más rápidos del mercado. Aunque tiene una capacidad ligeramente reducida, el tiempo ahorrado y las modestas mejoras en el caudal seguro lo convierten en una solución ideal para naves de servicio.\n
item_fuelpod_STOR_Safe_Desc,P=Fabricante: Stor*All\nTipo de artículo: Depósito de combustible\nModificador de flujo de hidrógeno: 0,54\nModificador de flujo cuántico: 0,54\nIntegridad máx.: 21420\nCapacidad: 15 SCU\n\nMediante un revestimiento exterior triple reforzado y muy por encima de los estándares de la industria, el depósito de combustible GSX-HP de Stor*All puede soportar presiones más altas que las opciones de almacenamiento típicas. Esto te permite transportar más combustible y mejora los caudales seguros de la boquilla que utilices.\n
