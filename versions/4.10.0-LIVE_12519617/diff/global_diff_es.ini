ScrambleRace_Desc_Regular_01=¿Eres rápido? ¿Eres mortal? ¿Estás buscando ganar unos buenos créditos? Entonces, tengo la carrera para ti.\n\nHablo de una carrera estilo antiguo, sin restricciones de armas. Pilota una ~mission(RaceType|Short), recolecta puntos de control, roba puntos al líder y gana a lo grande. Quien sea el primero en obtener suficientes puntos es declarado campeón y recibe un gran pago. El segundo y tercer lugar también reciben premios.\n\nHazme saber si estás interesado, y te enviaré las coordenadas de inicio una vez que la carrera esté configurada. Mientras tanto, siéntete libre de preparar tu ~mission(RaceType) para la acción. ~mission(RaceType|ScrambleRaceASOP)
