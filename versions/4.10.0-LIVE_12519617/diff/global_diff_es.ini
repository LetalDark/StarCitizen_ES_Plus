Foxwell_X2_AttackIdris_Title=Objetivo: grupo de ataque XenoThreat
Foxwell_X2_DrawOutBoss_Desc=Hemos interceptado una baliza de localización que sitúa a <EM>~mission(TargetName)</EM4> y a su escuadrilla de ataque personal en <EM4>~mission(Location|Address)</EM4>. Han sido uno de los ejecutores más brutales de XenoThreat desde su fundación. \n\n<EM>~mission(TargetName|Last)</EM4> no es de los que se echan atrás en una pelea, así que golpea a sus naves con la dureza suficiente, hazles bastante daño y no podrán resistirse a unirse a la acción. Una vez estén a la vista, serán tu objetivo principal.\n\n¿Listo?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +8.400 pts (Return of Xenothreat)
Foxwell_X2_DrawOutBoss_Desc,P=Hemos interceptado una baliza de localización que sitúa a <EM>~mission(TargetName)</EM4> y a su escuadrilla de ataque personal en <EM4>~mission(Location|Address)</EM4>. Han sido uno de los ejecutores más brutales de XenoThreat desde su fundación. \n\n<EM>~mission(TargetName|Last)</EM4> no es de los que se echan atrás en una pelea, así que golpea a sus naves con la dureza suficiente, hazles bastante daño y no podrán resistirse a unirse a la acción. Una vez estén a la vista, serán tu objetivo principal.\n\n¿Listo?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +8.400 pts (Return of Xenothreat)
Foxwell_X2_DrawOutBoss_Title=Eliminar al ejecutor de XenoThreat
Foxwell_X2_ShipAmbush_Desc=Nos han pasado información sólida sobre la trayectoria de vuelo de una escuadrilla de ataque de XenoThreat. Buscamos contratistas que puedan despegar ya y posicionarse en <EM4>~mission(Location|Address)</EM4> antes que ellos. Las condiciones locales enmascararán las firmas de tu escáner para que puedas darles la sorpresa de su vida. Vamos a convertir a los cazadores en presas.\n\n¿Interesado?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +4.000 pts (Return of Xenothreat)
Foxwell_X2_ShipAmbush_Desc,P=Nos han pasado información sólida sobre la trayectoria de vuelo de una escuadrilla de ataque de XenoThreat. Buscamos contratistas que puedan despegar ya y posicionarse en <EM4>~mission(Location|Address)</EM4> antes que ellos. Las condiciones locales enmascararán las firmas de tu escáner para que puedas darles la sorpresa de su vida. Vamos a convertir a los cazadores en presas.\n\n¿Interesado?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +4.000 pts (Return of Xenothreat)
Foxwell_X2_ShipAmbush_Title=Emboscar a la escuadrilla de ataque de XenoThreat
Foxwell_X2_ShipDefend_Desc=Ha llegado una baliza de socorro desde <EM4>~mission(Location|Address)</EM4> sobre una nave atacada por XenoThreat. El piloto informa de que sus escudos están cediendo y no puede dejar atrás a los atacantes.\n\nLa nave es un <EM4>~mission(Ship)</EM4>, pero el piloto es Humano, lo que según la retorcida lógica de XenoThreat lo convierte en un traidor a la Humanidad y en blanco de su odio.\n\nBuscamos operadores que se dirijan allí y hagan algo bueno.\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +4.000 pts (Return of Xenothreat)
Foxwell_X2_ShipDefend_Desc,P=Ha llegado una baliza de socorro desde <EM4>~mission(Location|Address)</EM4> sobre una nave atacada por XenoThreat. El piloto informa de que sus escudos están cediendo y no puede dejar atrás a los atacantes.\n\nLa nave es un <EM4>~mission(Ship)</EM4>, pero el piloto es Humano, lo que según la retorcida lógica de XenoThreat lo convierte en un traidor a la Humanidad y en blanco de su odio.\n\nBuscamos operadores que se dirijan allí y hagan algo bueno.\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +4.000 pts (Return of Xenothreat)
Foxwell_X2_ShipDefend_Title=Urgente - Nave bajo ataque de XenoThreat
Foxwell_X2_ShipWaves_Desc=Llegan múltiples informes de naves de XenoThreat concentrándose en <EM4>~mission(Location|Address)</EM4>\nBuscamos contratistas listos para llevarles la pelea. \n\nQuieren que creamos que tienen la razón de su lado. Quieren que creamos que tienen una fuerza abrumadora. Esta es una oportunidad para demostrarles que no nos chupamos el dedo.\n\nNo te voy a mentir, esto es para mí algo más que un simple contrato de seguridad. Odio a estos cabrones intolerantes y todo lo que representan.\n\n¿Te vienes?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +3.800 pts (Return of Xenothreat)
Foxwell_X2_ShipWaves_Desc,P=Llegan múltiples informes de naves de XenoThreat concentrándose en <EM4>~mission(Location|Address)</EM4>\nBuscamos contratistas listos para llevarles la pelea. \n\nQuieren que creamos que tienen la razón de su lado. Quieren que creamos que tienen una fuerza abrumadora. Esta es una oportunidad para demostrarles que no nos chupamos el dedo.\n\nNo te voy a mentir, esto es para mí algo más que un simple contrato de seguridad. Odio a estos cabrones intolerantes y todo lo que representan.\n\n¿Te vienes?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +3.800 pts (Return of Xenothreat)
Foxwell_X2_ShipWaves_Title=Interceptar fuerza de ataque de XenoThreat
Foxwell_bombingrun_E_desc_001,P=Acabamos de recibir la ubicación de un puesto avanzado de forajidos donde algunos criminales emergentes han estado reuniéndose. Ahora bien, nuestro cliente dice que no hay necesidad de enfrentarse directamente a esta gente. En su lugar, atacarás sus líneas de suministro.\n\nVuela hasta <EM4>~mission(Location|Address)</EM4> y destruye sus depósitos de combustible mientras te ocupas de cualquier resistencia mínima que puedan ofrecer. Tú decides cuánto enfrentarte a las fuerzas hostiles, pero no olvides que tu objetivo principal es asegurarte de que esos tanques de combustible queden fuera de servicio.\n\nEste es un contrato de nivel amarillo, así que el pago será proporcional.\n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos</EM4>\n- Antium Maroon (Brazos)\n- Antium Maroon (Pecho)\n- Antium Maroon (Pantalones)\n- Antium Maroon (Casco)\n- Antium Musgo (Casco)\n- Antium Musgo (Brazos)\n- Antium Musgo (Pecho)\n- Antium Musgo (Pantalones)\n\n<EM4>Reputación: +100 Foxwell Enforcement (General)</EM4>
Foxwell_bombingrun_E_title_001=Yellow Level Contract: Disrupt Operations <EM4>[BP]</EM4>
Foxwell_bombingrun_H_desc_001,P=Ha surgido una oportunidad para que un cliente tome medidas contra un grupo de criminales que ha estado acosando su negocio.\n\nSegún los informes, este grupo de forajidos se está ocultando actualmente en <EM4>~mission(Location|Address)</EM4>. El cliente cree que es un buen momento para pillarlos desprevenidos y llevarlos ante la justicia. El trabajo consiste en destruir sus tanques de combustible y poner fin a sus operaciones de contrabando de una vez por todas.\n\nNo hay que subestimar a esta gente. Será mejor que traigas refuerzos y vueles bajo para evitar las torretas. La prioridad, como siempre, son los tanques de combustible.\n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos</EM4>\n- Antium Maroon (Brazos)\n- Antium Maroon (Pecho)\n- Antium Maroon (Pantalones)\n- Antium Maroon (Casco)\n- Antium Musgo (Casco)\n- Antium Musgo (Brazos)\n- Antium Musgo (Pecho)\n- Antium Musgo (Pantalones)\n\n<EM4>Reputación: +200 Foxwell Enforcement (General)</EM4>
Foxwell_bombingrun_H_title_001=Orange Level Contract: Destroy Outlaw Infrastructure <EM4>[BP]</EM4>
Foxwell_bombingrun_M_desc_001,P=Necesitamos un contratista rápido para una operación de golpe y fuga. El cliente dice que algunos matones locales se han estado reuniendo en números preocupantes y se nos ha encargado interrumpir su base de operaciones.\n\nDirígete a <EM4>~mission(Location|Address)</EM4> y destruye sus tanques de combustible. Si lo consigues, podremos retrasar sus planes durante un tiempo y, lo más importante, sin tener que enfrentarnos directamente a ellos.\n\nLos informes indican que hay un par de naves patrullando la zona y algunas torretas defensivas. Solo céntrate en los tanques de combustible y deberías estar bien.\n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos</EM4>\n- Antium Maroon (Brazos)\n- Antium Maroon (Pecho)\n- Antium Maroon (Pantalones)\n- Antium Maroon (Casco)\n- Antium Musgo (Casco)\n- Antium Musgo (Brazos)\n- Antium Musgo (Pecho)\n- Antium Musgo (Pantalones)\n\n<EM4>Reputación: +150 Foxwell Enforcement (General)</EM4>
Foxwell_bombingrun_M_title_001=Orange Level Contract: Take Out Fuel Supplies <EM4>[BP]</EM4>
Foxwell_bombingrun_S_desc_001,P=Buscamos un equipo de mercenarios altamente competente para ayudar con una demolición complicada para un cliente VIP.\n\nLos forajidos que operan en <EM4>~mission(Location|Address)</EM4> han sido identificados como una amenaza creciente en la zona y, para hacer frente a esta situación, tu equipo tiene la misión de destruir los tanques de combustible en la ubicación.\n\nSin embargo, no será tan fácil como entrar y salir sin más: espera enfrentarte a múltiples hostiles y torretas que estarán preparadas para recibiros. Cuanto más fuerte sea tu tripulación, mayores serán las posibilidades de completar la operación con éxito.\n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos</EM4>\n- Antium Maroon (Brazos)\n- Antium Maroon (Pecho)\n- Antium Maroon (Pantalones)\n- Antium Maroon (Casco)\n- Antium Musgo (Casco)\n- Antium Musgo (Brazos)\n- Antium Musgo (Pecho)\n- Antium Musgo (Pantalones)\n\n<EM4>Reputación: +300 Foxwell Enforcement (General)</EM4>
Foxwell_bombingrun_S_title_001=Red Level Contract: Destroy Outlaw Infrastructure <EM4>[BP]</EM4>
Foxwell_bombingrun_VE_desc_001,P=Un grupo de forajidos ha estado acosando a nuestro cliente y recientemente la situación ha empeorado. Han tomado el control de su propiedad y hemos agotado todas las demás opciones.\n\nNecesitamos un piloto competente que se dirija a <EM4>~mission(Location|Address)</EM4> y destruya sus tanques de combustible. Si consigues cortar sus suministros, podrás allanar el camino para que el cliente recupere su propiedad.\n\nEsto no debería ser demasiado difícil. Puede que te encuentres con una o dos naves y quizá algunas torretas, pero estás autorizado a usar fuerza letal. Todo lo que necesitamos es que entres, destruyas los tanques de combustible y salgas.\n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos</EM4>\n- Antium Maroon (Brazos)\n- Antium Maroon (Pecho)\n- Antium Maroon (Pantalones)\n- Antium Maroon (Casco)\n- Antium Musgo (Casco)\n- Antium Musgo (Brazos)\n- Antium Musgo (Pecho)\n- Antium Musgo (Pantalones)\n\n<EM4>Reputación: +100 Foxwell Enforcement (General)</EM4>
Foxwell_bombingrun_VE_title_001=Yellow Level Contract: Limiting Potential Threat <EM4>[BP]</EM4>
Foxwell_bombingrun_VH_desc_001,P=Foxwell ha sido contratada por un cliente para participar en una operación de varias fases en una base de forajidos conocida en <EM4>~mission(Location|Address)</EM4> y necesita un piloto competente para desempeñar su papel.\n\nTú, y cualquier nave de apoyo que consigas reunir, tendréis la misión de destruir los tanques de combustible ubicados allí para preparar el terreno para el resto de la operación.\n\nDesafortunadamente, el lugar está lleno de naves y torretas antiaéreas. Así que asegúrate de que tú y tu gente estáis preparados y recuerda que los tanques de combustible son la prioridad. No hace falta hacerse el héroe.\n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Posibles Planos</EM4>\n- Antium Maroon (Brazos)\n- Antium Maroon (Pecho)\n- Antium Maroon (Pantalones)\n- Antium Maroon (Casco)\n- Antium Musgo (Casco)\n- Antium Musgo (Brazos)\n- Antium Musgo (Pecho)\n- Antium Musgo (Pantalones)\n\n<EM4>Reputación: +250 Foxwell Enforcement (General)</EM4>
Foxwell_bombingrun_VH_title_001=Red Level Contract: Fuel Container Demolition <EM4>[BP]</EM4>
