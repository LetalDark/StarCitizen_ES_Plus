GoblinG_Crusader_HaulCargo_M_Desc=Transporte de tamaño medio para GoblinG en el espacio de Crusader. Recogida en <EM4>~mission(Origin|Address)</EM4>, entrega en <EM4>~mission(Destination|Address)</EM4>.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
GoblinG_Crusader_HaulCargo_M_Desc,P=Tu trabajo para nosotros no ha pasado desapercibido, realmente lo apreciamos.\n\nSi tienes una nave que pueda acomodar un envío de <EM4>~mission(MissionMaxSCUSize) contenedores de carga</EM4> y un rayo tractor de alta resistencia, necesitamos que te dirijas a <EM4>~mission(Location|Address)</EM4> y recojas la carga allí. Deberías poder completar esto por ti mismo, pero si tienes prisa, quizás quieras considerar <EM4>traer un amigo</EM4> contigo.\n\nCuando hayas terminado de recoger la carga del elevador de carga, colócala en un elevador de carga en: <EM4>~mission(Destination|Address|ListAll)</EM4>. Tenemos personal disponible para procesar la entrega desde allí.\n\nGracias por tu ayuda como siempre.\n\n\nDenver Samuels\nOficial de Enlace con Contratistas\nCrusader Industries
