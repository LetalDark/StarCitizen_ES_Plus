item_Desc_nvs_jumpsuit_01_17_16=Capacidad de carga: 1K µSCU\n\nEl mono Falston tiene un cuello alto para protegerse de los elementos, costuras triple reforzadas y un forro interior extra suave porque todos merecen un poco de comodidad. La edición People's Alliance presenta un color verde oscuro con el logotipo de la People's Alliance en la espalda.
item_Desc_nvy_training_shirt_02_defcon2956=0.25 kg\n\nSube la temperatura y celebra DefenseCon 2956 con estilo en esta camiseta con detalles de llamas, lengüetas frontales en el cuello y cremallera trasera de un cuarto.
item_Desc_qrt_combat_heavy_helmet_03_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nInspirado en el antiguo folclore humano, el casco Kiba presenta un rostro demoníaco con largos colmillos. El uso de metales tratados de alta gama crea una estética ornamental, sin dejar de ofrecer una protección considerable desde todos los ángulos. El visor es compatible con la retícula AR.
item_Desc_qrt_combat_heavy_helmet_04_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nInspirado en el antiguo folclore humano, el casco Oni Kiba presenta un rostro demoníaco con largos colmillos y afilados cuernos. El uso de metales tratados de alta gama crea una estética ornamental, sin dejar de ofrecer una protección considerable desde todos los ángulos. El visor es compatible con la retícula AR.
item_Desc_qrt_combat_heavy_helmet_05_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nInspirado en el antiguo folclore humano, el casco Shogun Kiba presenta un rostro demoníaco con largos colmillos, combinados con cuernos curvos y un blindaje trasero ensanchado. El uso de metales tratados de alta gama crea una estética ornamental, sin dejar de ofrecer una protección considerable desde todos los ángulos. El visor es compatible con la retícula AR.\n\nLa edición Stronghold luce la fiera simbología de la banda Nine Tails con llamativos toques de rosa neón.
item_Desc_qrt_combat_medium_arms_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nTasa de depuración de radiación: 145.8 REM/s\n \nLa armadura Testudo de Quirinus Tech combina la durabilidad en combate con la comodidad del día a día. Entreteje placas resistentes pero ligeras con fibras sintéticas ultrarresistentes para ofrecer una protección de primera. En el interior lleva un tejido micromodal patentado, suave al tacto y que evacua la humedad para proporcionar una comodidad suprema.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -6.2%\n4 kg | Stun: 45% | Impacto: 31%
item_Desc_qrt_combat_medium_arms_05_01_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nLa armadura Testudo de Quirinus Tech combina la durabilidad en combate con la comodidad del día a día. Entreteje placas resistentes pero ligeras con fibras sintéticas ultrarresistentes para ofrecer una protección de primera. En el interior lleva un tejido micromodal patentado, suave al tacto y que evacua la humedad para proporcionar una comodidad suprema.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_qrt_combat_medium_backpack_01_02_01=Tipo de artículo: Mochila media\nCapacidad de carga: 105K µSCU\nCompatibilidad con pechera: Media y pesada\n \nLa mochila Testudo puede sentirse ligera como una pluma en tus manos, pero puede soportar una cantidad impresionante de peso gracias al uso de las mismas placas resistentes pero ligeras que el conjunto de armadura.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\n6 kg
item_Desc_qrt_combat_medium_core_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 8K µSCU\nMochilas: Medias, ligeras\n \nLa armadura Testudo de Quirinus Tech combina la durabilidad en combate con la comodidad del día a día. Entreteje placas resistentes pero ligeras con fibras sintéticas ultrarresistentes para ofrecer una protección de primera. En el interior lleva un tejido micromodal patentado, suave al tacto y que evacua la humedad para proporcionar una comodidad suprema.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -25%\n5 kg | Stun: 45% | Impacto: 31%
item_Desc_qrt_combat_medium_helmet_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nTasa de depuración de radiación: 145.8 REM/s \n \nMantén la vista en el premio y la cabeza protegida con el casco Testudo. Cuenta con una visera amplia y una carcasa exterior duradera que sobresale por encima de la frente, diseñada específicamente para absorber y disipar de forma eficiente la energía de los impactos. \n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -6.2%\n5 kg | Stun: 45% | Impacto: 31%
item_Desc_qrt_combat_medium_legs_01_01_10=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4K µSCU\nTolerancia a fuerza G: -12.5%\n6 kg | Stun: 45% | Impacto: 31%\n\nLa armadura Testudo de Quirinus Tech combina la durabilidad en combate con la comodidad del día a día. Entreteje placas resistentes pero ligeras con fibras sintéticas ultrarresistentes para ofrecer una protección de primera. En el interior lleva un tejido micromodal patentado, suave al tacto y que absorbe la humedad para proporcionar una comodidad suprema.
