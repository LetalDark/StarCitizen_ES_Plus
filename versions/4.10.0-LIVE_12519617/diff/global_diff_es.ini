Cargo_ShipMining_Pod_MoleProspector_BTGL_Desc=Capacidad: 15 SCU\n\nHecho para funcionar con cualquier nave minera compatible, el contenedor de mineral MISC mejorado ofrece mejoras frente a las opciones de almacenamiento estándar para que las jornadas de minería sean más eficientes.
