soo2_mainobj_3_desc,P=Para que la seguridad de Crusader llegue a la isla Hartmoore y recupere el control, necesitamos que el IFFI vuelva a estar del lado de la Seguridad de Crusader. Localízalo e invierte su control.
soo2_mainobj_3_long,P=Localiza e invierte el control del IFFI de Hartmoore
soo2_mainobj_3_short,P=Invertir IFFI de Hartmoore
soo2_mainobj_4_desc,P=Esto es todo, la Barcaza Flotante parece haber sido la vía por la que los Nine Tails lograron colarse sin ser vistos ante las defensas de Crusader. Invertir el IFFI de aquí debería señalar el fin de este acto de terrorismo.
