Nyx_OutlawStation_Glaciem_desc=una base de asteroides Moraine en el Glaciem Ring
Nyx_OutlawStation_Keeger=Base Moraine
Nyx_OutlawStation_Keeger_desc=una base de asteroides Moraine en el cinturón Keeger
ORS_BunkerRaid_Desc=Al parecer, se ha avistado a algunos de los Nine Tails responsables del ataque a Orison alrededor de <EM4>~mission(Location|Address)</EM4> reagrupando sus fuerzas. A Crusader le preocupa que estén planeando otro ataque, así que este es un trabajo que hay que hacer bien.\n\nSe te encomendará infiltrarte en el lugar y neutralizar a los Nine Tails por los medios que sean necesarios antes de que puedan llevar a cabo un intento de represalia contra Orison. Como seguro que sabes, estos tipos son mala noticia, así que ten cuidado de que no te ganen la partida.\n\nBuena suerte,\n\nKevin Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad avalado y con licencia para operar en toda la UEE. Siempre buscamos nuevos operadores que se unan a nuestra familia. Si tú o alguien que conoces está interesado, ponte en contacto con uno de nuestros representantes de contratos.
ORS_BunkerRaid_Title=Ayuda a Orison: neutralizar la represalia de los Nine Tails
ORS_Construct_Large_Desc=Muy bien,\n\nLos informes de daños del ataque de los Nine Tails a Orison siguen llegando y la gente de Crusader dice que quizás tengan que reparar una parte importante de los propulsores de esas plataformas. Por eso este es un pedido enorme.\n\nMayor cantidad, pero por lo demás igual que antes. Fabrícalos tú mismo usando un Fabricador de artículos u obtenlos de alguna otra manera.\n\nCuando termines, deja los propulsores en <EM4>~mission(Destination|Target|Address)</EM4>. La paga de este será cuantiosa.\n\nMuchas gracias,\nHal Grimsby\nGestor de contratos\n\nCORNERSTONE MAINTENANCE\n"Construyendo sobre los cimientos de nuestro pasado."
ORS_Construct_Large_Title=Ayuda a Orison: pedido de fabricación grande
ORS_Construct_Medium_Desc=Hola,\n\nCrusader se ha puesto en contacto para decir que la magnitud de los daños en sus plataformas es mayor de lo que pensaban en un principio y que necesitarán más propulsores de los que estimaron originalmente.\n\nEstamos subcontratando su petición a cualquiera que tenga un Fabricador de artículos disponible y listo. Aunque supongo que podrías obtener los propulsores de alguna otra manera, pero eso es cosa tuya.\n\nUna vez listos, entrégalos en <EM4>~mission(Destination|Target|Address)</EM4>. El pago se enviará al completar.\n\nMuchas gracias,\nHal Grimsby\nGestor de contratos\n\nCORNERSTONE MAINTENANCE\n"Construyendo sobre los cimientos de nuestro pasado."
ORS_Construct_Medium_Title=Ayuda a Orison: pedido de fabricación mediano
ORS_Construct_Small_Desc=Bueno,\n\nTras el ataque de los Nine Tails, la gente de Crusader necesita algo más que una simple mano. Lo que necesitan son propulsores en condiciones para reemplazar los que resultaron dañados en los ataques.\n\nHemos adjuntado un plano que detalla los materiales que necesitarás para crearlos. Tú decides si sales a buscar esos materiales por tu cuenta o se los compras a un comerciante. Sea como sea, necesitarás acceso a un Fabricador de artículos para fabricar los propulsores tú mismo.\n\nUna vez terminado, tráelos a <EM4>~mission(Destination|Target|Address)</EM4> y uno del equipo se encargará del resto.\n\nMuchas gracias,\nHal Grimsby\nGestor de contratos\n\nCORNERSTONE MAINTENANCE\n"Construyendo sobre los cimientos de nuestro pasado."
ORS_Construct_Small_Title=Ayuda a Orison: pedido de fabricación pequeño
ORS_ConstructionAid_ResourceGatherLarge_Desc=Muy bien,\n\nHe recibido un pedido a gran escala de la gente de Crusader para ayudarles a arreglar sus plataformas. Pedido grande significa paga grande.\n\nCuando termines de recolectar todos los materiales, llévalos a <EM4>~mission(Destination|Target|Address)</EM4> y asunto resuelto.\n\nMuchas gracias,\nHal Grimsby\nGestor de contratos\n\nCORNERSTONE MAINTENANCE\n"Construyendo sobre los cimientos de nuestro pasado."
ORS_ConstructionAid_ResourceGatherLarge_Title=Ayuda a Orison: pedido de materiales grande
ORS_ConstructionAid_ResourceGatherMedium_Desc=Buenas,\n\nSeguimos a la caza de más materiales para ayudar a Crusader tras el ataque de los Nine Tails. Aunque esta vez necesitamos un poco más. Nos aseguraremos de compensarte como corresponde.\n\nUna vez tengas los materiales, dirígete a <EM4>~mission(Destination|Target|Address)</EM4> y lo arreglaremos.\n\nMuchas gracias,\nHal Grimsby\nGestor de contratos\n\nCORNERSTONE MAINTENANCE\n"Construyendo sobre los cimientos de nuestro pasado."
ORS_ConstructionAid_ResourceGatherMedium_Title=Ayuda a Orison: pedido de materiales mediano
ORS_ConstructionAid_ResourceGatherSmall_desc=Bueno,\n\nQuizás hayas oído hablar de los recientes ataques a las plataformas de Orison. Un asunto terrible. La gente de Crusader se afana por reconstruirlo todo y nos han contratado para ayudar.\n\nPara ponerlos de nuevo en pie, lo que necesitamos son materiales de construcción. También podemos darte un buen sobre de paga por ellos.\n\nSi todavía no sabes cómo conseguir materiales de construcción, tu mejor opción es leer la <EM4>Guía del chatarrero para la recolección de materiales</EM4> de los United Resource Workers. Eso te pondrá en el buen camino.\n\nUna vez tengas el pedido listo, tendrás que dejarlo todo en <EM4>~mission(Destination|Target|Address)</EM4>.\n\nMuchas gracias,\nHal Grimsby\nGestor de contratos\n\nCORNERSTONE MAINTENANCE\n"Construyendo sobre los cimientos de nuestro pasado."
ORS_ConstructionAid_ResourceGatherSmall_title=Ayuda a Orison: pedido de materiales pequeño
ORS_JournalTracker_Content=Tras el brutal ataque de los Nine Tails a las plataformas de Orison, es vital que empecemos a reconstruir, y para ello necesitamos tu ayuda. Crusader Industries, junto con varias organizaciones de apoyo, está coordinando un esfuerzo generalizado para abastecer y asegurar nuestras labores de ayuda. \n\nCon tu contribución, podemos devolver Orison a como era antes.
ORS_JournalTracker_Title=Ayuda a Orison
ORS_MedicalAid_Delivery_Desc=Hola,\n\nCrusader nos ha pedido a los de Ling Family Hauling que ayudemos con sus labores de ayuda, y es extremadamente importante para nosotros como empresa y como familia hacerlo bien. La idea de que lo que les ocurrió a las víctimas de Orison le pasara a alguien de mi familia… Se lo debemos a los supervivientes: hacer todo lo que esté en nuestra mano para ayudarles.\nLos suministros médicos que Crusader necesita están listos para recogerse en <EM4>~mission(Location|Target|Address)</EM4> y deben dejarse en <EM4>~mission(Destination|Target|Address)</EM4>. Y asegúrate de llevar un <EM4>haz tractor de mano</EM4> para agilizar las cosas.\n\nGracias, \nConni Ling\nCoordinadora de envíos\nLing Family Hauling
ORS_MedicalAid_Delivery_Title=Ayuda a Orison: entrega de ayuda médica
ORS_MedicalAid_HaulingLarge_Desc=Hola, soy El.\n\nDe entrada: este trabajo en concreto es importante, así que si quieres encargarte de este por nosotros, asegúrate de tener confianza en tu capacidad para hacer un buen trabajo. \n\nCrusader nos ha contratado para entregar suministros médicos en <EM4>~mission(Destination|Target|Address)</EM4>. La recogida es en <EM4>~mission(Location|Target|Address)</EM4>. Ten en cuenta que este va a ser grande, así que asegúrate de llevar un <EM4>haz tractor de mano</EM4> y una nave que pueda transportar <EM4>~mission(MissionMaxSCUSize) contenedores de carga</EM4>, o podría ponerse un poco difícil.\n\nNo puedo recalcar lo suficiente la importancia de este contrato: mucha buena gente resultó herida en esos ataques, y es nuestra responsabilidad hacer lo que podamos para ayudarles en las secuelas. Se lo debemos a las víctimas, como mínimo.\n\nHagámoslo por ellos,\n\nElla Tieno \nCoordinadora jr. de logística \nCovalex Shipping   \n'Lo que necesites, donde lo necesites.'
ORS_MedicalAid_HaulingLarge_title=Ayuda a Orison: transporte de suministros grande
ORS_MedicalAid_HaulingMedium_Title=Ayuda a Orison: transporte de suministros mediano
ORS_MedicalAid_HaulingMedium_desc=Hola, soy El.\n\nCrusader sigue intentando arreglar las cosas en Orison tras el ataque, así que espero que estés libre para seguir echando una mano con la tarea.\n\nNos han contratado para entregar suministros de ayuda en <EM4>~mission(Destination|Target|Address)</EM4>. La recogida es en <EM4>~mission(Location|Target|Address)</EM4>. \nTampoco es un transporte cualquiera, así que asegúrate de ir en una nave que pueda transportar <EM4>~mission(MissionMaxSCUSize) contenedores de carga</EM4> y de llevar un <EM4>haz tractor de mano</EM4>, o harás que quedemos todos como aficionados.\n\nNo estoy de broma con lo de que este trabajo es importante y hay que hacerlo bien. Mucha gente resultó herida durante la incursión de los Nine Tails, y cuentan con gente como nosotros para conseguirles la ayuda que necesitan. Así que hagámoslo por ellos, ¿de acuerdo?\n\nElla Tieno \nCoordinadora jr. de logística \nCovalex Shipping   \n'Lo que necesites, donde lo necesites.'
ORS_MedicalAid_HaulingSmall_Desc=Hola, soy El.\n\nNecesito un contratista de fiar para una entrega bastante importante hoy. Seguro que estás al tanto de lo que pasó en Orison, un gran alboroto. Me ha hecho el trabajo diez veces más difícil.\n\nEn fin, Crusader nos ha contratado para entregar unos suministros médicos en <EM4>~mission(Destination|Target|Address)</EM4>. La recogida es en <EM4>~mission(Location|Target|Address)</EM4>. Este pedido no debería ser muy pesado, solo asegúrate de tener una nave que pueda transportar <EM4>~mission(MissionMaxSCUSize) contenedores de carga</EM4> y un <EM4>haz tractor de mano</EM4>, o de verdad harás el ridículo cuando llegues allí.\n\nMira, seré sincera contigo. Este trabajo no es transportar por transportar. Orison quedó bastante hecho polvo por esos Nine Tails, así que cualquier cosa que podamos hacer para ayudarles es probablemente lo correcto.\n\nAcabemos con esto,\n\nElla Tieno \nCoordinadora jr. de logística \nCovalex Shipping   \n'Lo que necesites, donde lo necesites.'
ORS_MedicalAid_HaulingSmall_Title=Ayuda a Orison: transporte de suministros pequeño
ORS_ShipAmb_Desc=Busco un piloto duro y competente en la zona dispuesto a enfrentarse a algunos de los forajidos responsables del ataque a Crusader. Nos ha llegado la noticia de que un grupo de rezagados de los Nine Tails se está atrincherando cerca de <EM4>~mission(Location|Address)</EM4> después de que los expulsaran de Orison, y Crusader Security quiere nuestra ayuda para ocuparse de ellos mientras están debilitados. \n\nHemos localizado un buen punto en la zona para pillarlos por sorpresa, así que irás allí, esperarás en silencio hasta que aparezcan y les golpearás antes de que se den cuenta de lo que pasa. Con suerte esto enviará un mensaje al resto de ellos de que sus acciones tienen consecuencias.\n\nBuena suerte,\n\nKevin Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad avalado y con licencia para operar en toda la UEE. Siempre buscamos nuevos operadores que se unan a nuestra familia. Si tú o alguien que conoces está interesado, ponte en contacto con uno de nuestros representantes de contratos.
ORS_ShipAmb_Title=Ayuda a Orison: golpear al escuadrón de los Nine Tails
ORS_ShipWaveAt_Desc=Acabo de enterarme de que algunos de los Nine Tails implicados en el reciente asalto a Orison se están reuniendo cerca de <EM4>~mission(Location|Address)</EM4> antes de lanzar su próximo ataque. Necesitamos un piloto de combate capaz que los intercepte y se ocupe de ellos antes de que empiecen a causar estragos de nuevo.\n\nPara complicar las cosas, por lo que sabemos hay muchas probabilidades de que tengan refuerzos adicionales de camino, así que asegúrate de que las naves extra no te pillen por sorpresa.\n\nUn saludo,\n\nKevin Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad avalado y con licencia para operar en toda la UEE. Siempre buscamos nuevos operadores que se unan a nuestra familia. Si tú o alguien que conoces está interesado, ponte en contacto con uno de nuestros representantes de contratos.
ORS_ShipWaveAt_Title=Ayuda a Orison: impedir la reagrupación de los Nine Tails
PU_AMartel_CIV_M_MC_TSGDamageIdris75_GP_001,P=Nos están dando un poco más de lo que me gustaría.
PU_AMartel_CIV_M_MC_TSGDamageIdris75_GP_002,P=Necesitamos protección. La Tranquility ha encajado golpes serios.
PU_AMartel_CIV_M_MC_TSGDamageIdris75_GP_003,P=Si alguien puede echar una mano, necesitamos protección.
PU_AMartel_CIV_M_MC_TSGPhase1CompletedIdrisAvailable_GP_001,P=Creo que esos eran los últimos. Si lo necesitas, abriremos las puertas de la bahía para que puedas rearmarte y repostar. Es lo menos que podemos hacer.
PU_AMartel_CIV_M_MC_TSGPhase2IntroAssaultStationWeaponType_GP_001,P=Una cosa más, parece que esos relés de energía usan blindaje pesado, así que puede que tengas que golpearlos con algo distinto a armas de energía.
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveFinalCoolerDestroyed_GP_001,P=Esa era la última unidad de refrigeración. El núcleo de energía está expuesto. Cárgatelo y, con suerte, podremos restablecer las comunicaciones con Gabe, nuestro piloto.
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveFinalCoolerDestroyed_GP_002,P=La última unidad de refrigeración ha caído. Deberías tener vía libre al núcleo de energía. Buena suerte
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveIntro2A_GP_001,P=Esa era la última. Deberías tener acceso a los brazos de la estación. Si te metes dentro, tendrás que cargarte las unidades de refrigeración, lo que provocará que se abra el núcleo central de energía. Pero ten cuidado, estamos detectando niveles altos de energía de distorsión ahí dentro.
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveIntro2A_GP_002,P=Los brazos de la estación deberían estar abiertos ahora. Tendrás que entrar y destruir las unidades de refrigeración para exponer el núcleo de energía. Los escáneres detectan una gran cantidad de energía de distorsión, así que tendrás que ser rápido.
PU_AMartel_CIV_M_MC_TSGPhase5SavePilotCaptainsResponsetoForgeThreat_GP_001,P=No me gusta cómo suena eso. Tendrás que darte prisa. Además, si necesitas reabastecerte, lo haría ahora. Tendremos que protegernos si aparecen los Vanduul.
PU_AMartel_CIV_M_MC_TSGPhase5Success_GP_001,P=Ni hablar, Gabe. No estás en condiciones de enredarte con nadie. Quiero que saltes a quantum y te largues de aquí ya.
PU_AMartel_CIV_M_MC_TSGPhase5VanduulWarning_GP_001,P=Los sensores de largo alcance han marcado contactos entrantes. Quizá quieras darte prisa.
PU_AMartel_CIV_M_MC_TSGPhase5VanduulWarning_GP_002,P=Contactos Vanduul dirigiéndose a nuestra posición. Tenemos algo de tiempo, pero no mucho.
PU_AMartel_CIV_M_MC_TSGPhase6AttackMauler_GP_001,P=Si te ves con ganas, vamos a intentar derribar ese Mauler. Es demasiado peligroso dejarlo suelto en el sistema.
PU_AMartel_CIV_M_MC_TSGPhase6EscapeMaulerIdrisLeaving_GP_001,P=Vale, no podemos permitirnos quedarnos por aquí más tiempo, no con esa nave capital aquí. Deberías saltar a quantum mientras puedas. Buena suerte.
PU_AMartel_CIV_M_MC_TSGPhase6EscapeMauler_GP_001,P=Deberías largarte de aquí mientras puedas. Nosotros aguantaremos a los Vanduul.
PU_AMartel_CIV_M_MC_TSGPhase6GabeDiesCaptainsresponse_GP_001,P=Joder. Gabe ha caído…
PU_AMartel_CIV_M_MC_TSGPhase6GabeEscapesCaptainsresponse_GP_001,P=Gracias por sacar a Gabe de aquí.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerArrives_GP_001,P=Atentos todos. Acaba de aparecer una nave capital Vanduul. Seguid con lo vuestro. Los aguantaremos todo lo que podamos.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerArrives_GP_002,P=Tenemos una nave capital Vanduul en el sitio. Gabe, lárgate de aquí cagando leches. Los aguantaremos.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerArrives_GP_003,P=Nuevo contacto. Una nave capital Vanduul acaba de saltar a quantum hasta aquí. Sacad a Gabe de aquí. Llamaremos su atención.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerDestroyed_GP_001,P=¡Nave capital Vanduul abatida! No me puedo creer que lo hayas hecho.
PU_AMartel_CIV_M_MC_TSGPhase7MissionComplete_GP_001,P=Eso parece ser todo. Al Comité Gobernante le va a encantar saber que hemos conseguido echar mano a datos reales sacados de una nave capital Vanduul. En fin, trabajo de primera. He conseguido que mis superiores te den algo especial por todas las molestias. Gracias de nuevo.
PU_AMartel_CIV_M_MC_TSGTargetEncouragement_GP_001,P=Cárgate ese objetivo.
PU_AMartel_CIV_M_MC_TSGTargetEncouragement_GP_002,P=Odio meterte prisa, pero necesitamos cargarnos eso.
PU_AMartel_CIV_M_MC_TSGTargetEncouragement_GP_003,P=Necesito que se cargue ese objetivo.
PU_AMartel_CIV_M_PMH_TSGDamageIdris25_GP_001,P=No vamos a aguantar mucho más si no nos los quitas de encima.
PU_AMartel_CIV_M_PMH_TSGDamageIdris25_GP_002,P=La Tranquility está recibiendo fuego intenso. Repito. Fuego intenso.
PU_AMartel_CIV_M_PMH_TSGDamageIdris25_GP_003,P=Necesitamos asistencia inmediata. Hemos sufrido daños críticos.
PU_AMartel_CIV_M_PMH_TSGDamageIdris50_GP_001,P=Mi nave está recibiendo daños serios. Vas a tener que apretar el ritmo.
PU_AMartel_CIV_M_PMH_TSGDamageIdris50_GP_002,P=Necesito ayuda para quitarnos a estos Shattered Blade de encima.
PU_AMartel_CIV_M_PMH_TSGDamageIdris50_GP_003,P=Nos vendría bien tu ayuda aquí. La Tranquility está encajando golpes serios.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_001,P=Nave enemiga abatida.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_002,P=Una pena que tuviera que llegar a esto.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_003,P=Shattered destruido.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_004,P=Encuentra paz en la otra vida.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_005,P=Ojalá hubieran tomado decisiones distintas.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_006,P=Triste verlo.
PU_AMartel_CIV_M_PMH_TSGMissionAbandon_GP_001,P=Mira, te necesitábamos. No deberías largarte así sin más.
PU_AMartel_CIV_M_PMH_TSGMissionAbandon_GP_002,P=Antes una promesa significaba algo. Típica mierda del UEE.
PU_AMartel_CIV_M_PMH_TSGMissionAbandon_GP_003,P=Sabía que no se podía confiar en un representante corporativo para cumplir.
PU_AMartel_CIV_M_PMH_TSGMissionFail_GP_001,P=Reconducir toda la energía a <grito de muerte>
PU_AMartel_CIV_M_PMH_TSGMissionFail_GP_002,P=La Tranquility está perdida. Aband- <grito de muerte>
PU_AMartel_CIV_M_PMH_TSGMissionFail_GP_003,P=Tripulación, aband- <grito>
PU_AMartel_CIV_M_PMH_TSGPhase1Completed_GP_001,P=Parece que nos hemos quitado a los hostiles. Has llegado en el momento justo.
PU_AMartel_CIV_M_PMH_TSGPhase1Completed_GP_002,P=Radar limpio de amenazas inmediatas.
PU_AMartel_CIV_M_PMH_TSGPhase1Completed_GP_003,P=Creo que estamos bien por ahora. Buen trabajo.
PU_AMartel_CIV_M_PMH_TSGPhase1IntroDefeatAttackingFighters_GP_001,P=Intersec dijo que vendría alguien. Soy la capitana Aniss Martel de la nave de seguridad Tranquility. Uno de los nuestros está retenido como rehén dentro de esa estación, pero primero necesitamos ayuda para despejar a estos cazas.
PU_AMartel_CIV_M_PMH_TSGPhase1IntroDefeatAttackingFighters_GP_002,P=¿Eres de Intersec? Soy la capitana Martel de la People's Alliance. Te pongo al día más tarde, primero tenemos que quitar a estos cazas de encima de la Tranquility.
PU_AMartel_CIV_M_PMH_TSGPhase1IntroDefeatAttackingFighters_GP_003,P=Me alegro de que hayas podido venir. Me llamo Martel y esta nave es la Tranquility. Cuando nos quites a estos cazas de encima, te pongo al día de la situación.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFinal_GP_001,P=Eso es. Las bahías al núcleo de energía deberían estar abiertas. Ve y cárgatelo.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFinal_GP_002,P=El último ha caído. Deberías tener acceso al núcleo central de energía ahora.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFirst_GP_001,P=Todos los generadores de ese brazo están caídos. Quedan dos más. Todas las torretas de ese brazo deberían estar vulnerables ahora.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFirst_GP_002,P=Los generadores del primer brazo están caídos. Eso desactivará los escudos de las torretas, pero quedan dos más antes de que podamos llegar al núcleo de energía.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageSecond_GP_001,P=Ese brazo está caído. Sigamos así y carguémonos el último.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageSecond_GP_002,P=El segundo brazo está caído. Solo queda uno más. Podemos con esto.
PU_AMartel_CIV_M_PMH_TSGPhase2IntroAssaultStation_GP_001,P=Vamos al lío que nos ocupa. Pensábamos que esa estación estaba abandonada y enviamos a un piloto a investigar; resulta que Shattered Blade estaba escondiéndose. Sus torretas nos iluminaron cuando intentamos atacar, así que tuvimos que retirarnos. Las comunicaciones se han cortado, así que no hemos podido contactar ni saber si siquiera está vivo. La estación es uno de los modelos más antiguos del sistema, así que el sistema de apuntado de las torretas no puede rastrear naves más pequeñas. Tendrás que pasar por varios aros para entrar, pero puede que haya una forma de saltarse su seguridad y sus defensas. Necesitarás destruir los relés de energía situados alrededor de la estación. Cárgatelos y te indicaré desde ahí.
PU_AMartel_CIV_M_PMH_TSGPhase2SubObjectiveSuccess_GP_001,P=Esa era la última. Deberías tener acceso a los brazos de la estación. Si te metes dentro, hay tres generadores de escudo por brazo. Tendremos que cargárnoslos para acceder al núcleo de energía de la estación.
PU_AMartel_CIV_M_PMH_TSGPhase2SubObjectiveSuccess_GP_002,P=Los brazos de la estación deberían estar abiertos ahora. Si consigues pasar las torretas y entrar, tendrás que destruir tres generadores de escudo instalados dentro de cada uno.
PU_AMartel_CIV_M_PMH_TSGPhase2SubObjectiveSuccess_GP_003,P=Sin esos relés, deberías tener acceso a cada uno de los brazos de la estación. Métete dentro y destruye los generadores de cada uno. Eso debería exponer el núcleo de energía y dejarte cargarte sus torretas.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_001,P=Relé caído. Bien hecho.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_002,P=Buen trabajo cargándotelo.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_003,P=Sigue así. Casi lo tenemos.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_004,P=Buen impacto. Buen trabajo.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_005,P=Relé destruido. Gran trabajo.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_006,P=Relé eliminado.
PU_AMartel_CIV_M_PMH_TSGPhase3IntroInterceptBombers_GP_001,P=Joder, detecto múltiples bombarderos de Shattered Blade. Supongo que no les gusta lo que estamos haciendo aquí. Vamos a necesitar ayuda.
PU_AMartel_CIV_M_PMH_TSGPhase3IntroInterceptBombers_GP_002,P=Shattered Blade acaba de enviar un montón de bombarderos. ¿Alguna posibilidad de que nos eches una mano? Vamos a necesitarla.
PU_AMartel_CIV_M_PMH_TSGPhase4DestroypowercoreSuccess_GP_001,P=Gran trabajo. Cargarse el núcleo de energía debería disparar una anulación a nivel de toda la estación que reiniciará todos los protocolos de Shattered Blade.
PU_AMartel_CIV_M_PMH_TSGPhase4ReminderDestroyPowerCore_GP_001,P=Aún tenemos que cargarnos el núcleo de energía si queremos recuperar a nuestro piloto.
PU_AMartel_CIV_M_PMH_TSGPhase5Remind_GP_001,P=Quizá quieras darte prisa ahí dentro. Esto se está poniendo un poco chungo aquí fuera.
PU_AMartel_CIV_M_PMH_TSGPhase5Remind_GP_002,P=Odio molestarte, pero deberías mover el culo.
PU_AMartel_CIV_M_PMH_TSGPhase5Remind_GP_003,P=La situación va de mal en peor aquí fuera. Yo me movería si puedes.
PU_AMartel_CIV_M_PMH_TSGPhase5SavePilotCaptainsResponse_GP_001,P=Te tenemos, Gabe. Me alegro de oír que estás bien. Tenemos aquí ayuda que va a sacarte de ahí. Os dejo a los dos para que te volvamos a poner en el aire.
PU_AMartel_CIV_M_PMH_TSGPhase6BonusObjectiveSuccess_GP_001,P=Ah, una cosa más. No sé si te servirá de algo, pero interceptamos un código en algunas comunicaciones cuando atacó Shattered Blade. Si estás pensando en investigar esa estación, quizá signifique algo allí.
PU_AMartel_CIV_M_PMH_TSGPhase6FailPilotDead_GP_001,P=Quería darte las gracias por intentar salvar a Gabe. El universo es cada vez más peligroso. Todos deberíamos permanecer unidos y cuidarnos los unos a los otros más. En fin, deberíamos irnos. Cuídate.
PU_AMartel_CIV_M_PMH_TSGPhase6FailPilotDead_GP_002,P=Nunca es más fácil perder a un voluntario bajo tu mando. Pero podemos seguir adelante con lo que Gabe creía: hacer de Nyx un lugar más seguro para todos. Cumplamos todos con nuestra parte, ¿de acuerdo? Cuídate.
PU_AMartel_CIV_M_PMH_TSGPhase6SuccessCaptainsresponse_GP_001,P=Solo quiero decir que has dado el callo hoy. Mi gente y yo apreciamos tu tenacidad y tu esfuerzo. Espero verte por Levski en algún momento.
PU_AMartel_CIV_M_PMH_TSGPhase6SuccessCaptainsresponse_GP_002,P=Nunca habría pensado que alguien del UEE se pondría de nuestro lado así. Gracias. Espero que encuentres la paz allí donde la busques. Cuídate.
PU_AMartel_CIV_M_PMH_TSGPhase7VanduulDataDiscoveredMissionStart_GP_001,P=Eh, soy la capitana Martel de nuevo.  Nunca había visto a alguien derribar uno de esos Mauler. No fuera de la Marina, al menos. Lo que estás viendo ahí es uno de sus almacenes de datos. Hemos estado intentando hacernos una mejor idea de su número en Nyx y eso puede ayudar. Si consigues sacar el resto de los datos, le dará a la Alianza una ventaja importante.
PU_BATTAGLIA_PEO_F_MC_RBMMission1EmergencyArrive_GP_001=Bien, has llegado. He hablado con Lucas, el capitán de la Blinding Hope. Se han encerrado en el puente, pero los Moraine están intentando entrar como sea. ¿Puedes acercarte y echar una mano? Le he pasado tus datos de comunicación, debería estar llamándote ya.
PU_BATTAGLIA_PEO_F_MC_RBMMission1EmergencyMissionFail_GP_001,P=Eh, soy Recco. Bienvenido de vuelta. Solo quería ponerte al día. Gracias a ti, Lucas pudo repeler al resto de los Moraine y escapar. Siento que hayas tenido que regenerar, así que quería decirte que puedes quedarte con todos los minerales que extrajiste. Gracias por intentar ayudar a Lucas y a los demás.
PU_BATTAGLIA_PEO_F_MC_RBMMission1EmergencyMissionSuccess_GP_001=Aquí Recco. Lucas dice que pudiste encargarte de esos Moraine. Nos han estado golpeando mucho últimamente, así que da gusto poder darle la vuelta por fin a una de estas historias tristes. ¿Sabes qué? Quédate con lo que hayas extraído. Es lo mínimo que puedo hacer por haber dado un paso al frente y echar una mano.
PU_BATTAGLIA_PEO_F_MC_RBMMission1Emergency_GP_001=Soy yo. Acabo de recibir una llamada de emergencia de una de nuestras naves, la Blinding Hope, que volvía de una excavación. Los emboscaron los Moraine, una de las bandas de forajidos del sistema, y necesitan ayuda. Eres la persona más cercana que tengo. Por favor, ayúdalos.
PU_BATTAGLIA_PEO_F_MC_RBMMission1FindRocks_GP_001=Eh. Aquí Recco. Parece que estás en la zona. Tendrás que escanear para ver dónde están los minerales.
PU_BATTAGLIA_PEO_F_MC_RBMMission1Hook_GP_001=Eh, soy Recco Battaglia, de Levski. Organizo algunos de los trabajos que entran y salen de la estación. Te he metido un contrato en el gestor. Échale un vistazo y dime si te interesa.
PU_BATTAGLIA_PEO_F_MC_RBMMission1MiningComplete_GP_001=Con eso debería bastar. Se te da de forma natural. Vuelve a casa.
PU_BATTAGLIA_PEO_F_MC_RBMMission1RockCracked_GP_001=Genial. Ahora que has partido la roca, tendrás que cambiar de modo para extraerlo.
PU_BATTAGLIA_PEO_F_MC_RBMMission1RockFound_GP_001=Ahí está. Eso es lo que buscas. Ahora solo tienes que recolectarlo.
PU_BATTAGLIA_PEO_F_MC_RBMMission2ArriveatScene_GP_001=Mira eso… [long pause] A juzgar por los daños, no creo que quede nadie vivo ahí dentro. Siento pedirte esto, pero deberíamos identificar a quienes hemos perdido, para poder avisar a las familias.
PU_BATTAGLIA_PEO_F_MC_RBMMission2BlackBoxObtained_GP_001=La caja negra dice que Isaac estaba a bordo cuando despegaron, pero si no hay cuerpo, me pregunto adónde fue. No sé por qué los Moraine se lo llevarían, pero ya han secuestrado gente antes... Tienen una estación vieja cerca de aquí que han usado como puesto de acecho. Te enviaré la ubicación.
PU_BATTAGLIA_PEO_F_MC_RBMMission2Body1FoundLucas_GP_001=Sí, ese es el capitán Lucas.
PU_BATTAGLIA_PEO_F_MC_RBMMission2Body2Found_GP_001=[pause] Sí, esa es Meg… Justo la semana pasada hablaba de hacer menos de estos viajes.
PU_BATTAGLIA_PEO_F_MC_RBMMission2Body3Found_GP_001=Confirmado. Ese es TJ… lo siento, esto nunca se hace más fácil, ¿sabes?
PU_BATTAGLIA_PEO_F_MC_RBMMission2GettheBlackBox_GP_001=Eh… No veo a Kepler ahí... Perdona, Isaac Kepler. ¿Puedes coger la caja negra de la nave para que veamos si partió con ellos?
PU_BATTAGLIA_PEO_F_MC_RBMMission2MissionAccept_GP_001=Eh, soy yo. He puesto en el contrato todo lo que sé, pero sigo sin poder contactar con la Blinding Hope. Lucas siempre está muy encima de dar parte, así que necesito a alguien ahí fuera. Últimamente has hecho un buen trabajo, así que quería darle esto a alguien de confianza. Gracias.
PU_BATTAGLIA_PEO_F_MC_RBMMission2MissionHook_GP_001=Hola. Soy Recco. Tengo aquí una situación un poco complicada, por si puedes ayudar. Acéptalo desde tu mobi si te viene bien.
PU_BATTAGLIA_PEO_F_MC_RBMMission2MoraineBaseDownloadComplete_GP_001=Genial. Tráeme esos datos y podré ver si mencionan algo sobre lo que le pasó a Isaac.
PU_BATTAGLIA_PEO_F_MC_RBMMission2MoraineBaseEntranceOpened_GP_001=Eso es. Ya deberías poder entrar. Ten cuidado.
PU_BATTAGLIA_PEO_F_MC_RBMMission2MoraineBasePlayerArrives_GP_001=Muy bien, esa es la base Moraine de la que te hablé. Es poco probable que Isaac esté aquí, pero tenemos que intentarlo. Ten cuidado: puede que el sitio parezca vacío, pero nunca se sabe.
PU_BATTAGLIA_PEO_F_MC_RBMMission2MoraineBasePlayerEntersStation_GP_001=Deberías intentar encontrar su sala de servidores. Quizá ahí podamos averiguar qué le pasó a Isaac.
PU_BATTAGLIA_PEO_F_MC_RBMMission2MoraineBasePlayerFindsTerminal_GP_001=Ahí mismo. Si accedes a ese terminal, podrás descargar los datos que queden de los Moraine. Puede tardar un poco.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitAfterCommEnds_GP_001=Eh, soy yo. Creo que esto va a funcionar. Ve para allá ahora y trae a Isaac de vuelta a Levski.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine10_GP_001=Lo siento. Lucas no debería haber hecho eso. Pero tienes que saber que los Moraine solo te están utilizando. Ya lo he visto antes. ¿Te acuerdas de Callie Barnes? Los Moraine le prometieron acogerla a cambio de las rutas de nuestras naves de comercio. La mataron. ¿Y Lars Westerna? Misma promesa, mismo resultado. Puede que estés frustrado con nosotros, pero no quiero que salgas herido. Se lo debo a tus padres.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine12_GP_001=Claro que puedes. Todos hemos cometido errores. Parte de ser familia es saber pasarlos por alto.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine13_GP_001=Mira, tengo a alguien de camino a tu posición. Te traerán de vuelta y solo hablaremos. ¿De acuerdo?
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine15_GP_001=Aguanta ahí, llegarán pronto.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine1_GP_001=Vale, allá vamos. Abriendo la comunicación.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine3_GP_001=¿Issac? Soy Recco.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine5_GP_001=Cuidamos de los nuestros, Isaac. Lo sabes. ¿Qué está pasando?
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine7_GP_001=Mira, Isaac, lo entiendo. De verdad. No somos perfectos. Quiero decir, tu padre se quejaba todo el tiempo de lo indecisa que podía ser la People's Alliance, pero eso no significa que el sueño no merezca la pena. Él lo sabía. Pensaba que tú también lo creías. Necesitamos gente joven como tú para ayudar a llevar el movimiento adelante. Así es como funciona esto.
PU_BATTAGLIA_PEO_F_MC_RBMMission3InTransitConversationLine8_GP_001=Quiero saber qué pasó en la Blinding Hope.
PU_BATTAGLIA_PEO_F_MC_RBMMission3MissionHook_GP_001=Eh, soy Recco. No sé si estás libre, pero se me ha ocurrido una idea sobre el asunto de Isaac. Mira tu mobi.
PU_BATTAGLIA_PEO_F_MC_RBMMission3MoraineAmbushPlayerArrivesLine2_GP_001=Isaac, ¿qué estás haciendo?
PU_BATTAGLIA_PEO_F_MC_RBMMission3MoraineAmbushSuccess_GP_001=Lo siento… Pensaba… Quería creer que iba a volver. [long pause]\nTengo que irme. La próxima vez que estés en Levski podemos hablar, pero ahora tengo que irme.
PU_BATTAGLIA_PEO_F_MC_RBMMission3MoraineBasePlayerArrives_GP_001=Vale, vuelve a la sala de servidores y podremos ponernos en marcha.
PU_BATTAGLIA_PEO_F_MC_RBMMission3MoraineBasePlayerInstallsUplink_GP_001=Muy bien, estamos conectados. Dame un segundo para hacer una búsqueda rápida... Lo tengo. Voy a rastrear su ubicación; me gustaría que te reunieras con él y lo trajeras. Creo que se ha corrido la voz de que estuvo implicado en la muerte de Lucas y me preocupa que la gente lo ataque si viene solo. Ve yendo hacia tu nave y veré si consigo hablar con él por comm. 
PU_BATTAGLIA_PEO_F_MG_Chatter_GP_001=Voy tirando, dadas las circunstancias. Nos están llegando muchos contratistas nuevos, así que cuesta un poco gestionarlo, pero vamos saliendo adelante.
PU_BATTAGLIA_PEO_F_MG_Chatter_GP_002=Estoy pensando en tomarme un tiempo libre. Lo que pasa es que no consigo decidir qué hacer ni adónde ir.
PU_BATTAGLIA_PEO_F_MG_Chatter_GP_003=El sistema se está poniendo interesante últimamente. Parece que cada vez que me doy la vuelta hay alguien nuevo fisgoneando.
PU_BATTAGLIA_PEO_F_MG_ContractAcceptOnePerMissiontype_GP_001=Gracias por aceptar el trabajo.
PU_BATTAGLIA_PEO_F_MG_ContractAccept_GP_001=Gracias por aceptar el trabajo.
PU_BATTAGLIA_PEO_F_MG_ContractAccept_GP_002=Genial. Gracias por encargarte de eso.
PU_BATTAGLIA_PEO_F_MG_ContractAccept_GP_003=Necesitaba a alguien que se ocupara de ese.
PU_BATTAGLIA_PEO_F_MG_ContractDecline_GP_001=Supongo que no te ha llamado nada la atención.
PU_BATTAGLIA_PEO_F_MG_ContractDecline_GP_002=Todo bien. Quizá la próxima vez.
PU_BATTAGLIA_PEO_F_MG_ContractDecline_GP_003=Sin problema. Ya encontraré a otro.
PU_BATTAGLIA_PEO_F_MG_ContractOfferActiveContract_GP_001=¿Quieres más? Me gusta esa actitud. Veamos qué más tenemos.
PU_BATTAGLIA_PEO_F_MG_ContractOfferActiveContract_GP_002=Claro, si tú tienes tiempo, yo tengo trabajo.
PU_BATTAGLIA_PEO_F_MG_ContractOfferActiveContract_GP_003=¿Otro más? Claro, veamos qué tengo.
PU_BATTAGLIA_PEO_F_MG_ContractOfferNoActiveContract_GP_001=Claro, tengo algo para lo que me vendrías bien. 
PU_BATTAGLIA_PEO_F_MG_ContractOfferNoActiveContract_GP_002=Sí, creo que puede que tenga algo.
PU_BATTAGLIA_PEO_F_MG_ContractOfferNoActiveContract_GP_003=Mira, acaba de entrar algo que te vendría al pelo.
PU_BATTAGLIA_PEO_F_MG_ConversationContinue_GP_001=¿Necesitas algo más?
PU_BATTAGLIA_PEO_F_MG_ConversationContinue_GP_002=¿Necesitas alguna cosa más?
PU_BATTAGLIA_PEO_F_MG_ConversationContinue_GP_003=¿Te ayudo con algo más?
PU_BATTAGLIA_PEO_F_MG_ConversationStart_GP_001=¿Qué puedo hacer por ti?
PU_BATTAGLIA_PEO_F_MG_ConversationStart_GP_002=¿En qué puedo ayudarte?
PU_BATTAGLIA_PEO_F_MG_ConversationStart_GP_003=Bueno, ¿qué se cuenta?
PU_BATTAGLIA_PEO_F_MG_ConversationTimeOut_GP_001=Será mejor que vuelva a lo mío.
PU_BATTAGLIA_PEO_F_MG_ConversationTimeOut_GP_002=Si eso es todo, tengo trabajo que hacer.
PU_BATTAGLIA_PEO_F_MG_ConversationTimeOut_GP_003=Perdona, tengo que volver al trabajo.
PU_BATTAGLIA_PEO_F_MG_GoodbyeInterrupt_GP_001=Ah… vale… hasta luego, supongo.
PU_BATTAGLIA_PEO_F_MG_Goodbye_GP_001=Muy bien, vuela con cuidado.
PU_BATTAGLIA_PEO_F_MG_Goodbye_GP_002=Buena suerte ahí fuera.
PU_BATTAGLIA_PEO_F_MG_Goodbye_GP_003=Hasta la próxima.
PU_BATTAGLIA_PEO_F_MG_GreetingsReturnVisitDeliverObject_GP_001=Eh, bienvenido de vuelta. Puedes dejar eso ahí.
PU_BATTAGLIA_PEO_F_MG_GreetingsReturnVisitDeliverObject_GP_002=Me alegro de verte. Adelante, deja eso.
PU_BATTAGLIA_PEO_F_MG_GreetingsReturnVisitDeliverObject_GP_003=Has llegado. Genial. Puedes dejar eso ahí.
PU_BATTAGLIA_PEO_F_MG_GreetingsReturnVisit_GP_001=¿Estás bien?
PU_BATTAGLIA_PEO_F_MG_GreetingsReturnVisit_GP_002=Bienvenido de vuelta.
PU_BATTAGLIA_PEO_F_MG_GreetingsReturnVisit_GP_003=Hola.
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledgeContractActive_GP_001=¿No deberías estar ahí fuera trabajando?
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledgeContractActive_GP_002=Tienes un contrato, ¿verdad?
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledgeContractActive_GP_003=Tienes un encargo, ¿no? Vamos, en marcha.
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledgeDropoffIdle_GP_001=Adelante. Deja eso cuando quieras.
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledgeDropoffIdle_GP_002=Venga, déjalo en el suelo.
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledgeDropoffIdle_GP_003=Puedes dejar eso, ¿sabes?
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledge_GP_001=¿Necesitas algo?
PU_BATTAGLIA_PEO_F_MG_IdleAcknowledge_GP_002=Eh… ¿estás bien?
PU_BATTAGLIA_PEO_F_MG_ItemDroppedOff_GP_001=Genial. Gracias por encargarte de eso.
PU_BATTAGLIA_PEO_F_MG_ItemDroppedOff_GP_002=Gracias. Ya me ocupo de procesarlo.
PU_BATTAGLIA_PEO_F_MG_ItemDroppedOff_GP_003=Fantástico. Lo registraremos.
PU_BATTAGLIA_PEO_F_MG_RBMMission1AcceptShipOffer_GP_001=Además, he movido algunos hilos y he apartado una nave minera prestada que puedes usar. Sin presión si no te hace falta.
PU_BATTAGLIA_PEO_F_MG_RBMMission1Busy_GP_001=Deberías tener todo lo que necesitas. Buena suerte ahí fuera.
PU_BATTAGLIA_PEO_F_MG_RBMMission1Intro_GP_001=Como habrás imaginado, soy Recco Battaglia. Me coordino con todos los mineros y recuperadores para asegurarme de que reciban el apoyo que necesitan. En fin, me gusta conocer a mi gente antes de mandarla ahí fuera. ¿Qué me dices? ¿Quieres que te cuente el encargo?
PU_BATTAGLIA_PEO_F_MG_RBMMission1Option1Brief_GP_001=En pocas palabras, tengo una pista sobre unas excavaciones potencialmente ricas con las que el prospector original no puede hacer gran cosa. Eres nuevo en el sistema, así que pensé en pasártelo y ver si podías recolectarlo para nosotros.
PU_BATTAGLIA_PEO_F_MG_RBMMission1Option2NoBriefGoodBye_GP_001=Todo bien, entonces te mando los detalles a tu mobi.
PU_BATTAGLIA_PEO_F_MG_RBMMission1UponEntry_GP_001=Hola, pasa.
PU_BATTAGLIA_PEO_F_MG_RBMMission2Busy_GP_001=Mira, puede que necesite un poco de tiempo para procesar esto.
PU_BATTAGLIA_PEO_F_MG_RBMMission2PlayerArrivesGreeting_GP_001=Eh, bienvenido de vuelta. Deja los datos y les echo un vistazo.
PU_BATTAGLIA_PEO_F_MG_RBMMission2ReactiontoData_GP_001=Vale, veamos qué tenemos aquí… Parece que hay conversaciones entre los Moraine hablando de… No, esto no puede ser… Aquí dice que Isaac avisó a los Moraine sobre la Blinding Hope. Tiene que ser algún tipo de trampa, ¿no? Necesito investigar esto. Hablamos luego, ¿vale?
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat1AcceptCollectData_GP_001=Genial. He estado intentando llamarlo desde mi mobi, pero no contesta. He programado un relé en esa unidad de datos que cogiste de la base Moraine. Si vas y la vuelves a conectar, debería aparecer como un Moraine, así que quizá acepte la comunicación. Coge la unidad cuando estés listo para salir.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat1DataCollectReaction_GP_001=Buena suerte ahí fuera.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat1EncouragementDataCollected_GP_001=Venga, salgamos ahí fuera.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat1EncouragementDataNotCollected_GP_001=No tengo nada más que contarte. La unidad está lista para salir.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat1Interaction_GP_001=Esto es lo que hay. He repasado todos esos datos Moraine, y todos los ataques recientes de los Moraine a naves tenían algo en común: Isaac. No quería creerlo —quiero decir, sus padres lo criaron para creer en lo que intentamos hacer aquí—, pero todas las pruebas están ahí. Sé que sus muertes le afectaron mucho, así que quizá simplemente ha caído en malas compañías o algo así, lo que significa que aún podría haber vuelta atrás. Solo quiero hablar con él. Si puedes ayudarme a conseguirlo, creo que puedo lograr que vuelva a casa. Échale un vistazo.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat1UponEntry_GP_001=Eh, acércate y empezamos.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat3Interaction_GP_001=Primero, quería pedirte disculpas. No fue justo ponerte en peligro así. Quería creer con tantas ganas que Isaac podía volver que, en vez de escuchar lo que me estaba diciendo, te mandé a ciegas. Y casi te cuesta la vida a ti también. Así que lo siento. [beat] \nPero tenía que hacer algo, ¿sabes?
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat3Option1Response_GP_001=Ya, es que todavía lo veo como aquel crío bobalicón correteando por el Mercado. Cuesta creer que pudiera albergar todo ese odio. Sé que Lucas podía ser… difícil, pero quería a ese chaval. Todos lo queríamos.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat3Option2Response_GP_001=Ya, no sé... Cada vez cuesta más creer en lo mejor de la gente. Cuesta más no esconder a los tuyos detrás de muros erizados de armas y disparar a cualquiera que se acerque. Pero aun así, sucumbir a ese miedo y renunciar al universo en el que queremos vivir no me parece mucho futuro. Puede que la People's Alliance necesite madurar un poco, pero tenemos que hacerlo de una forma que no cambie quiénes somos. 
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat3Return_GP_001=No te preocupes. Estaré como siempre la próxima vez que te pases. Solo necesito dejar que esto siga su curso.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat3UponEntry_GP_001=Eh, me alegro de que hayas venido.
PU_BATTAGLIA_PEO_F_MG_RBMMission3Beat3Walkaway_GP_001=Perdona, sí, yo también debería volver a lo mío.
PU_BATTAGLIA_PEO_F_MG_RBMMission3MissionAccept_GP_001=Gracias por hacer esto. Pásate cuando puedas.
PU_BATTAGLIA_PEO_F_MG_RMBMission3Beat3Resolve_GP_001=En fin, gracias por ayudarme. No lo olvidaré. Te he enviado un pequeño detalle. Vuelve a verme si buscas trabajo.
PU_DELOIT_UWC_F_PMH_GenericMissionAbandon_GP_001,P=Vaya. Siento mucho que no vayas a poder terminar este. Espero que estés bien. Bueno, igual la próxima vez sale mejor. Hablamos pronto.
PU_DELOIT_UWC_F_PMH_GenericMissionAbandon_GP_002,P=Vaya, ¿abandonas? Te seré sincera, me sorprende un poco, pero lo entiendo, la vida pasa. Pero no lo conviertas en costumbre, ¿vale? Hasta luego.
PU_DELOIT_UWC_F_PMH_GenericMissionAbandon_GP_003,P=Espera, ¿estás cancelando el contrato? ¿En serio? Vale, pues… Si crees que es lo mejor…
PU_DELOIT_UWC_F_PMH_GenericMissionAccept_GP_001,P=Hola, soy DD. Gracias por aceptar este trabajo. Creo que vas a ser perfecto para él. Tómatelo paso a paso y ten cuidado ahí fuera, ¿vale?
PU_DELOIT_UWC_F_PMH_GenericMissionAccept_GP_002,P=Hola otra vez. Soy DD. Me preguntaba cuándo volverías a por otro contrato. En fin, el tiempo es oro, así que ¡al lío!
PU_DELOIT_UWC_F_PMH_GenericMissionAccept_GP_003,P=¡Hola! Soy DD otra vez. Siempre me alegra ver tu nombre aparecer en un contrato. Tienes los detalles, así que pórtate bien ahí fuera y ya hablamos.
PU_DELOIT_UWC_F_PMH_GenericMissionComplete_GP_001,P=Soy DD. Solo te llamo para decirte que aprecio que seas del tipo fiable. Justo el tipo de piloto que Wayfarer necesita. Vuela seguro y no te pierdas, ¿me oyes?
PU_DELOIT_UWC_F_PMH_GenericMissionComplete_GP_002,P=Mira eso. Contrato completado. Siempre da gusto verlo. En fin, descansa un poco y hablamos pronto.
PU_DELOIT_UWC_F_PMH_GenericMissionComplete_GP_003,P=A Wayfarer le vendrían bien unos cuantos pilotos más como tú, eso seguro. Disfruta del pago, y seguro que pronto tenemos otro contrato para ti.
PU_DELOIT_UWC_F_PMH_GenericMissionFail_GP_001,P=Soy DD. Siempre cuesta cuando el trabajo no sale. Lo único que podemos hacer es aprender y seguir adelante. Tómate un descanso y nos vemos en el siguiente.
PU_DELOIT_UWC_F_PMH_GenericMissionFail_GP_002,P=DD desde el UWC. No parece que ese trabajo esté saliendo. Le pasa al mejor. No dejes que te hunda y vuelve ahí fuera pronto.
PU_DELOIT_UWC_F_PMH_GenericMissionFail_GP_003,P=Vaya. Qué mala suerte. Siento mucho que este no haya salido como querías. Mantén la cabeza alta, ¿vale?
PU_DELOIT_UWC_F_PMH_MissionAcceptIntro_GP_001,P=Déjame ser la primera en darte la bienvenida a bordo. Siempre hay un montón de gente ahí fuera contando con la ayuda de Wayfarer, así que está bien cuando se une un nuevo piloto a la causa. Soy Dina Deloit, pero puedes llamarme DD, todo el mundo lo hace. Seré tu despachadora principal. ¿Qué te parece si te ponemos en marcha? Los clientes no se van a atender solos.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteCrybabyTrap_GP_001,P=Uh oh. Esto no me da buena espina… ¡Cuidado!
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteCrybabyTrap_GP_002,P=Qué raro. No veo ninguna nave… ¡cuidado! Es una trampa.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteCrybabyTrap_GP_003,P=¡Eh! ¡Es un montaje! ¡Cuidado!
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteHandover_GP_001,P=Muy bien, parece que acabas de llegar, así que voy a pasarte con el cliente.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteHandover_GP_002,P=Genial, has llegado. Te paso al cliente ahora.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteHandover_GP_003,P=Vale, ahora que estás en el sitio te conectaré con el cliente…
PU_DELOIT_UWC_F_PMH_RefuelingHostilesDetected_GP_001,P=¡Eh, atento! Tienes problemas de camino. Mantente alerta.
PU_DELOIT_UWC_F_PMH_RefuelingHostilesDetected_GP_002,P=Eh. Prepárate. Tienes algunos hostiles que llegarán en cualquier momento.
PU_DELOIT_UWC_F_PMH_RefuelingHostilesDetected_GP_003,P=Malas noticias. He detectado algunos hostiles dirigiéndose directos hacia ti.
PU_DELOIT_UWC_F_PMH_RefuelingMissionAccept_GP_001,P=Hola, soy DD. Gracias por aceptar este contrato de repostaje. No sé tú, pero a mí la idea de quedarme tirado sin combustible me da un miedo de cojones. Bueno, por suerte te tienen a ti para rescatarlos.
PU_DELOIT_UWC_F_PMH_RefuelingMissionAccept_GP_002,P=Hola, soy DD. A ver qué tienes hoy entre manos… Vale, un trabajo de repostaje. ¿Qué haríamos sin la gente que olvida llenar el depósito, eh? En fin, te dejo con ello.
PU_DELOIT_UWC_F_PMH_RefuelingMissionAccept_GP_003,P=Hola, soy DD otra vez. Parece que te hemos asignado un trabajo de repostaje. Buena suerte y ten cuidado ahí fuera.
PU_DELOIT_UWC_F_PMH_RefuelingMissionFailClientShipDestroyed_GP_001,P=Madre mía. Pobre alma… Y me temo que hay más malas noticias. Sin nave que repostar, tengo que cancelar el contrato. El próximo tendrá un final más feliz, espero. Mantente a salvo, ¿me oyes?
PU_DELOIT_UWC_F_PMH_RefuelingMissionFailClientShipDestroyed_GP_002,P=No me puedo creer que el cliente no lo haya conseguido. Al menos tú sigues con nosotros, ¿no? El lado bueno y todo eso. Por desgracia, voy a tener que cancelar el contrato. Más suerte la próxima vez.
PU_DELOIT_UWC_F_PMH_RefuelingMissionFailClientShipDestroyed_GP_003,P=Aunque me encanta este trabajo, hay días que son más duros que otros. No solo hemos perdido al cliente, sino que también tengo que cancelar el contrato. Bueno, mañana es otro día, ¿no? Hablamos pronto.
PU_DELOIT_UWC_F_PMH_RefuelingTrapCompleteHazardPay_GP_001,P=¡Uf! Me alegra que hayas salido de ese marrón. Y no te preocupes por el contrato. He conseguido que Wayfarer te pague algunos créditos igualmente. Quiero decir, no fue culpa tuya que la solicitud de servicio resultara ser cebo.
PU_DELOIT_UWC_F_PMH_RefuelingTrapCompleteHazardPay_GP_002,P=Gracias al cielo que estás bien. Normalmente sin cliente no hay paga, pero he podido conseguir algo de compensación por las molestias. Espero que te alegre un poco el día. Mantente a salvo ahí fuera, ¿vale?
PU_DELOIT_UWC_F_PMH_RefuelingTrapCompleteHazardPay_GP_003,P=No me puedo creer que estés bien. Eso fue bastante aterrador, pero he podido conseguirte una paga por riesgo por todas las molestias. Así podemos volver a sacarte ahí fuera lo antes posible, ¿vale? Hablamos pronto.
PU_DUBUISSON_NOR_F_MC_AmbushArriveatLocation_GP_001,P=Has llegado al lugar propuesto para la emboscada.
PU_DUBUISSON_NOR_F_MC_AmbushArriveatLocation_GP_002,P=Esta es la zona que operaciones ha marcado como el lugar ideal para la emboscada.
PU_DUBUISSON_NOR_F_MC_AmbushArriveatLocation_GP_003,P=Estás en el sitio. Mantente a la espera y te daré algo más de información.
PU_DUBUISSON_NOR_F_MC_AmbushHideinMarkedLocation_GP_001,P=Te envío un lugar ideal para ocultar tu nave.
PU_DUBUISSON_NOR_F_MC_AmbushHideinMarkedLocation_GP_002,P=Te marco una ubicación que debería ocultar la firma de tu nave.
PU_DUBUISSON_NOR_F_MC_AmbushHideinMarkedLocation_GP_003,P=Te señalo un punto para tomar posición de cara a la emboscada.
PU_DUBUISSON_NOR_F_MC_AmbushTargetDestroyed_GP_001,P=Objetivo abatido.
PU_DUBUISSON_NOR_F_MC_AmbushTargetDestroyed_GP_002,P=El objetivo ha sido eliminado.
PU_DUBUISSON_NOR_F_MC_AmbushTargetDestroyed_GP_003,P=Confirmado. El objetivo está abatido.
PU_DUBUISSON_NOR_F_MC_AmbushTargetMissing_GP_001,P=Contactos enemigos… No veo al objetivo.
PU_DUBUISSON_NOR_F_MC_AmbushTargetMissing_GP_002,P=Tengo hostiles acercándose. No parece que el objetivo vaya con ellos.
PU_DUBUISSON_NOR_F_MC_AmbushTargetMissing_GP_003,P=Detecto algunos hostiles. No tengo confirmación del objetivo.
PU_DUBUISSON_NOR_F_MC_AmbushTargetSpotted_GP_001,P=Objetivo avistado.
PU_DUBUISSON_NOR_F_MC_AmbushTargetSpotted_GP_002,P=Tengo confirmación de que el objetivo está en el lugar.
PU_DUBUISSON_NOR_F_MC_AmbushTargetSpotted_GP_003,P=El objetivo ha sido confirmado.
PU_DUBUISSON_NOR_F_MC_AmbushWait_GP_001,P=Deberías estar oculto. Apaga los sistemas y espera.
PU_DUBUISSON_NOR_F_MC_AmbushWait_GP_002,P=Estás en posición. Los objetivos deberían llegar pronto.
PU_DUBUISSON_NOR_F_MC_AmbushWait_GP_003,P=Mantente aquí. Los objetivos deberían estar llegando pronto.
PU_DUBUISSON_NOR_F_MC_ArriveonBarge_GP_001,P=Mendo se esconde por aquí en algún sitio. Por ahora, céntrate en ocuparte de estas fuerzas de los Nine Tails y luego podremos encontrarlo.
PU_DUBUISSON_NOR_F_MC_DatahackCompleted_GP_001,P=Llegamos demasiado tarde. La transferencia se ha completado. Tendré que informar a Crusader de que parte de sus datos están ahora en manos de los Nine Tails.
PU_DUBUISSON_NOR_F_MC_DatahackDisableEncouragementAlmostOutofTime_GP_001,P=Casi no nos queda tiempo. La transferencia está a punto de completarse.
PU_DUBUISSON_NOR_F_MC_DatahackDisableEncouragement_GP_001,P=Rápido. Encuentra la manera de detener la brecha antes de que termine la transferencia de datos.
PU_DUBUISSON_NOR_F_MC_DatahackDiscovered_GP_001,P=¿Están los Nine Tails robando datos de Crusader? ¿Podría ser esta la razón de todo el asalto? No importa. Detenlo si puedes.
PU_DUBUISSON_NOR_F_MC_DatahackStopped_GP_001,P=Crusader se alegrará de saber que hemos logrado proteger sus datos de caer en manos de los Nine Tails. Quién sabe qué buscaban y por qué.
PU_DUBUISSON_NOR_F_MC_EliteDeadEncouragethePlayertoLootthem_GP_001,P=He cruzado a ese Nine Tail con nuestro sistema y parece que era uno de los miembros más veteranos de la banda. Podría merecer la pena echar un vistazo por si llevaba algo importante encima.
PU_DUBUISSON_NOR_F_MC_EliteDeadIktiHint_GP_001,P=Un problema resuelto. Podría merecer la pena ver si estos ATLS de Crusader pueden reutilizarse para tus necesidades. Sería una lástima desperdiciar un equipo tan potencialmente útil.
PU_DUBUISSON_NOR_F_MC_EliteDeadSearchBody_GP_001,P=Creo que has encontrado a quien tenía el código de acceso.
PU_DUBUISSON_NOR_F_MC_EliteWeaponCacheKeycardFound_GP_001,P=Interesante. Es un código de acceso, pero por desgracia no para el alternador. Debe de haber algo más por aquí que abra. Mantente atento.
PU_DUBUISSON_NOR_F_MC_FindKeyHeadinside_GP_001,P=Bien. Ahora podemos abrir la puerta y llegar hasta Mendo Ren.
PU_DUBUISSON_NOR_F_MC_FullSecurityReset_GP_001,P=Con eso debería bastar. Esta rama de la red de seguridad vuelve a estar en línea y, con suerte, el ascensor funciona.
PU_DUBUISSON_NOR_F_MC_FullSecurityReset_GP_002,P=Ese era el último nodo que había que reiniciar. Esta rama de la red de seguridad ha sido restaurada por completo y el ascensor debería estar de nuevo en línea.
PU_DUBUISSON_NOR_F_MC_FullSecurityReset_GP_003,P=Esos eran todos los nodos de esta rama. La red de seguridad debería estar reiniciada. Dirígete al ascensor y comprueba si funciona.
PU_DUBUISSON_NOR_F_MC_GenericMissionAbandon_GP_001,P=Aquí Northrock. Como empresa, necesitamos que nuestros contratistas cumplan lo prometido en el contrato. Abandonar antes de completarlo no es eso.
PU_DUBUISSON_NOR_F_MC_GenericMissionAbandon_GP_002,P=Aquí Adrienne, de Northrock. Solo llamo para confirmar que hemos recibido tu solicitud de rescindir el contrato antes de tiempo. Esta vez puedo aceptarlo, pero por favor evita hacerlo en el futuro.
PU_DUBUISSON_NOR_F_MC_GenericMissionAbandon_GP_003,P=Aquí Northrock. En el futuro, por favor no aceptes nuestros contratos si no vas a poder llevarlos a término. Es lo más considerado.
PU_DUBUISSON_NOR_F_MC_GenericMissionAccept_GP_001,P=Aquí Adrienne, de Northrock. He recibido confirmación de que estás comenzando uno de nuestros contratos. Ejerceré de oficial de logística según sea necesario, pero todos los detalles deberían estar en el informe. Buena suerte.
PU_DUBUISSON_NOR_F_MC_GenericMissionAccept_GP_002,P=Aquí Adrienne, de Northrock. Gracias por aceptar este contrato. Tengo ganas de trabajar juntos y estaré supervisando tu progreso. Siéntete libre de proceder como creas conveniente.
PU_DUBUISSON_NOR_F_MC_GenericMissionAccept_GP_003,P=Aquí Northrock. Gestionaré tu contrato desde el lado de operaciones. Por el momento no preveo ninguna complicación, así que espero un buen resultado. Buena suerte.
PU_DUBUISSON_NOR_F_MC_GenericMissionComplete_GP_001,P=Aquí Northrock. Con esto has cumplido todos los requisitos necesarios para cerrar ese contrato. Agradezco tu diligencia en este asunto.
PU_DUBUISSON_NOR_F_MC_GenericMissionComplete_GP_002,P=Adrienne de nuevo. Todo se ve bien por mi parte, así que voy a dar por concluido este contrato. Gracias por tu esfuerzo.
PU_DUBUISSON_NOR_F_MC_GenericMissionComplete_GP_003,P=Hola, soy Adrienne. Parece que te has ocupado de todo lo necesario para cerrar este contrato. Excelente. Lo remitiré a contabilidad para que te paguen. Que disfrutes del resto del día.
PU_DUBUISSON_NOR_F_MC_GenericMissionFail_GP_001,P=Aquí Northrock. Lo siento, pero no has cumplido los requisitos establecidos en el contrato, así que damos por terminada esta operación. Gracias por tu tiempo.
PU_DUBUISSON_NOR_F_MC_GenericMissionFail_GP_002,P=Aquí Adrienne, de Northrock. Tengo que retirarte este contrato, ya que no te has ajustado a los parámetros establecidos. Te recomiendo que cambies de actitud cuando trabajes para nosotros en el futuro.
PU_DUBUISSON_NOR_F_MC_GenericMissionFail_GP_003,P=Hola, soy Adrienne. Tras una cuidadosa reflexión, opino que este contrato resulta inviable en su estado actual debido a tus acciones, así que vamos a cancelarlo. Ya sabes cómo son estas cosas.
PU_DUBUISSON_NOR_F_MC_GoodWork_GP_001,P=Bien hecho. Eso se ha manejado con maestría.
PU_DUBUISSON_NOR_F_MC_GoodWork_GP_002,P=Maravilloso. Justo el resultado que esperábamos.
PU_DUBUISSON_NOR_F_MC_GoodWork_GP_003,P=Excelente. Un trabajo excelente, sin duda.
PU_DUBUISSON_NOR_F_MC_GotoShipIktiLeaderResponse_GP_001,P=Entendido. Démonos prisa entonces.
PU_DUBUISSON_NOR_F_MC_HostilesDestroyedEncouragement_GP_001,P=Hostil eliminado.
PU_DUBUISSON_NOR_F_MC_HostilesDestroyedEncouragement_GP_002,P=Es una baja.
PU_DUBUISSON_NOR_F_MC_HostilesDestroyedEncouragement_GP_003,P=Baja confirmada.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveCleared_GP_001,P=No detecto más hostiles.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveCleared_GP_002,P=La zona parece segura.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveCleared_GP_003,P=Todos los hostiles han sido eliminados.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_001,P=Detecto elementos hostiles.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_002,P=Tengo hostiles dirigiéndose a tu posición.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_003,P=Identificadas varias amenazas hostiles. Ten cuidado.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_004,P=Contactos hostiles.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_005,P=Detecto hostiles acercándose.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcementsBigShip_GP_001,P=He identificado una nave capital hostil.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcementsBigShip_GP_002,P=Los escaneos acaban de marcar una nave capital hostil.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcementsBigShip_GP_003,P=Cuidado. Nave capital hostil detectada.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcements_GP_001,P=Se acercan refuerzos hostiles.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcements_GP_002,P=Tienes enemigos adicionales acercándose.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcements_GP_003,P=Mantente alerta. Refuerzos entrantes.
PU_DUBUISSON_NOR_F_MC_IFFIDisableBarge_GP_001,P=Eso es. El alternador está ahora desconectado. Se ha notificado a la Seguridad de Crusader y están enviando unidades ahora mismo. Deberían ser más que capaces de eliminar los últimos restos de los Nine Tails y volver a asegurar las plataformas.
PU_DUBUISSON_NOR_F_MC_IFFIDisabledIsland1_GP_001,P=Leo que esa unidad de alternador está desconectada y que la señal se ha debilitado. Bien hecho. Hay una lanzadera cerca que puedes usar para dirigirte a la siguiente plataforma. Cuanto antes desconectemos las otras unidades, antes podrá la Seguridad de Crusader recuperar el control.
PU_DUBUISSON_NOR_F_MC_IFFIDisabledIsland2_GP_001,P=Acabo de recibir confirmación de que esta unidad de alternador está desconectada. La señal apenas se sostiene, pero sigue siendo suficiente para mantener a raya a las naves de Crusader. Hay una lanzadera cerca que te llevará a la siguiente plataforma y al último alternador.
PU_DUBUISSON_NOR_F_MC_Island2SecondSectionKeepGoing_GP_001,P=Los Nine Tails han reforzado sus fuerzas por toda esta zona. Tendrás que encontrar la manera de abrirte paso para llegar al alternador.
PU_DUBUISSON_NOR_F_MC_Island2SecondSectionReinforcementsArriving_GP_001,P=Prepárate. Se acercan refuerzos. Ocúpate de ellos.
PU_DUBUISSON_NOR_F_MC_KopionCallOut_GP_001,P=Kopions adiestrados por los Nine Tails. No dejes que se acerquen.
PU_DUBUISSON_NOR_F_MC_KopionCallOut_GP_002,P=Unidades de kopion. Mantén la distancia si puedes.
PU_DUBUISSON_NOR_F_MC_KopionCallOut_GP_003,P=Una manada de kopion de los Nine Tails ha captado tu olor. No dejes que te acorralen.
PU_DUBUISSON_NOR_F_MC_LeaveIktiHint_GP_001,P=Tendrás que dejar el ATLS aquí. Por desgracia, no hay forma de pasar las unidades por ahí.
PU_DUBUISSON_NOR_F_MC_Lieutenant2ConfirmLieutenantsArrival_GP_001,P=Ahí está. El teniente por fin se ha unido a la fiesta. Entra en combate y elimínalo.
PU_DUBUISSON_NOR_F_MC_Lieutenant2DeadEncouragethePlayertoLootthem_GP_001,P=Bien hecho. Adelante, regístralo en busca del código del alternador.
PU_DUBUISSON_NOR_F_MC_Lieutenant2IFFIAccessFound_GP_001,P=Justo como esperábamos. Ahora puedes desconectar esta unidad de alternador.
PU_DUBUISSON_NOR_F_MC_Lieutenant2MoreDropships_GP_001,P=De acuerdo, otra nave de desembarco entrante.
PU_DUBUISSON_NOR_F_MC_Lieutenant2MoreDropships_GP_002,P=Mantente alerta. Hay otra nave de desembarco dirigiéndose hacia ti.
PU_DUBUISSON_NOR_F_MC_Lieutenant2MoreDropships_GP_003,P=Cuidado. Más refuerzos.
PU_DUBUISSON_NOR_F_MC_Lieutenant2TakeoutthatAirSupportEscalate_GP_001,P=Buenas noticias. Crusader me ha informado de que debería haber algunas armas antiaéreas almacenadas cerca. Mira a ver si las encuentras.
PU_DUBUISSON_NOR_F_MC_Lieutenant2TakeoutthatAirSupport_GP_001,P=Atención. Han traído apoyo aéreo. Céntrate en eliminarlo.
PU_DUBUISSON_NOR_F_MC_LieutenantAppearsConfirmthatswhotheyneedtokill_GP_001,P=Ese es uno de los tenientes de Mendo Ren. Deben de tener el código del alternador de esta plataforma. Tienes vía libre para entrar en combate.
PU_DUBUISSON_NOR_F_MC_LieutenantDeadEncouragethePlayertoLootthem_GP_001,P=Manejado con maestría. Mira a ver si llevan encima el código del alternador.
PU_DUBUISSON_NOR_F_MC_LieutenantIFFIAccessFound_GP_001,P=Excelente. Ahora puedes usar el código del alternador para desactivar la unidad de esta plataforma.
PU_DUBUISSON_NOR_F_MC_LockedElevatorFirstTime_GP_001,P=He estado en contacto con un enlace de la Seguridad de Crusader y me han informado de que los ascensores de las plataformas están diseñados para entrar en bloqueo cuando la red de seguridad se ve comprometida. Si realizas un reinicio manual de todos los nodos de esta rama de la red, debería volver a funcionar.
PU_DUBUISSON_NOR_F_MC_LockedElevator_GP_001,P=Este ascensor estará desconectado hasta que se reinicie la red de seguridad.
PU_DUBUISSON_NOR_F_MC_LockedElevator_GP_002,P=No podrás usar el ascensor mientras la red de seguridad siga bajo control de los Nine Tails.
PU_DUBUISSON_NOR_F_MC_LockedElevator_GP_003,P=Prueba a reiniciar la red de seguridad para volver a poner el ascensor en línea.
PU_DUBUISSON_NOR_F_MC_LockedIFFIIntereact_GP_001,P=No hay forma de desconectar el alternador sin el código.
PU_DUBUISSON_NOR_F_MC_LockedIFFIIntereact_GP_002,P=Solo Mendo o sus comandantes tendrán los códigos necesarios para desconectar los alternadores.
PU_DUBUISSON_NOR_F_MC_LockedWeaponsCache_GP_001,P=Cerrado. Puede que un miembro veterano de los Nine Tails tenga acceso.
PU_DUBUISSON_NOR_F_MC_LockedWeaponsCache_GP_002,P=Necesitarás los códigos de acceso de un miembro veterano de los Nine Tails si quieres abrirlo.
PU_DUBUISSON_NOR_F_MC_LockedWeaponsCache_GP_003,P=No se abrirá sin el código de un miembro veterano de los Nine Tails.
PU_DUBUISSON_NOR_F_MC_MendoDeadSearchBody_GP_001,P=Baja confirmada. Enhorabuena. Muchos han intentado eliminar a Mendo Ren antes que tú. Registra su cuerpo y comprueba si lleva el último código del alternador.
PU_DUBUISSON_NOR_F_MC_MendoRenIIFFIAccessFound_GP_001,P=Ahí está. Ese es el código final que necesitamos para desconectar esta señal de alternador de una vez por todas.
PU_DUBUISSON_NOR_F_MC_MissionAcceptIntro_GP_001,P=Excelente. Soy Adrienne Du-Buisson, de Northrock, y seré tu oficial de logística. Es un placer tenerte al frente de esta operación. Por desgracia, los Nine Tails han bloqueado todo el tráfico aéreo, así que tendrás que tomar una lanzadera hasta allí. He avisado a la Seguridad de Crusader de que tú y tu equipo de apoyo estáis de camino a las plataformas.  Como podrás imaginar, están deseando que todo este problema con los Nine Tails se resuelva lo antes posible. Quizá la próxima vez nos contacten antes. Por ahora, coge tu equipo y dirígete a la lanzadera de la plataforma.
PU_DUBUISSON_NOR_F_MC_MissionBriefNoIktiAlt_GP_001,P=Bien, ahora que estás de camino a la primera plataforma, esto es lo que necesitas saber. Hace varias horas, miembros de la banda Nine Tails se apoderaron de varias plataformas de Crusader e instalaron Alternadores de Identificación Amigo o Enemigo para controlar el espacio aéreo. Tu objetivo principal será desactivar estos alternadores para permitir que las fuerzas de seguridad entren y vuelvan a asegurar las islas. La Seguridad de Crusader hizo todo lo posible por recuperar las plataformas por su cuenta, pero sufrió numerosas bajas. Fue entonces cuando por fin nos contactaron, convencidos de que una de nuestras pequeñas y bien entrenadas fuerzas de asalto tendría éxito donde ellos fracasaron. Espera una fuerte resistencia de los Nine Tails en cuanto aterrices. Mucha suerte, iré comprobando tu progreso y te informaré según sea necesario.
PU_DUBUISSON_NOR_F_MC_MissionBriefRespondtoIktiLeader_GP_001,P=He estado intentando restablecer el contacto con el equipo de la primera plataforma sin éxito. Estaban bajo intenso fuego de mortero de los Nine Tails, así que hasta que sepamos lo contrario, es mejor darlos por perdidos. Esos morteros serán tu primer obstáculo que despejar en cuanto aterrices. Después de despejar el alternador de la primera plataforma, deberías reunirte con el personal de Crusader que quede en la segunda. Mucha suerte a todos, iré comprobando tu progreso y te informaré según sea necesario.
PU_DUBUISSON_NOR_F_MC_MissionBrief_GP_001,P=Bien, ahora que estás de camino a la primera plataforma, esto es lo que necesitas saber. Hace varias horas, miembros de la banda Nine Tails se apoderaron de varias plataformas de Crusader e instalaron Alternadores de Identificación Amigo o Enemigo para controlar el espacio aéreo. Tu objetivo principal será desactivar estos alternadores para permitir que las fuerzas de seguridad entren y vuelvan a asegurar las islas. La Seguridad de Crusader hizo todo lo posible por recuperar las plataformas por su cuenta, pero sufrió numerosas bajas. Fue entonces cuando por fin nos contactaron, convencidos de que una de nuestras pequeñas y bien entrenadas fuerzas de asalto tendría éxito donde ellos fracasaron. Hemos logrado establecer contacto con uno de sus equipos que aún permanece en la segunda plataforma.
PU_DUBUISSON_NOR_F_MC_MissionComplete_GP_001,P=En nombre de Northrock, permíteme felicitarte por una operación exitosa. Crusader es un cliente muy importante y creo que quedarán más que satisfechos con los resultados que has entregado. Quizá aún más importante, se ha lidiado con Mendo Ren, y eso será una noticia muy bien recibida por más de una parte interesada. Deberías sentirte orgulloso de lo que has logrado hoy aquí. Y con eso, hasta nuestro próximo contrato.
PU_DUBUISSON_NOR_F_MC_MissionConclusionIntro_GP_001,P=Perfecto. Ahora que estás aquí, voy a hacer un poco de papeleo y cerrar este contrato. Adelante, toma el ascensor hasta la lanzadera. He estado en comunicación con representantes de Crusader y debería tener más información y un contrato actualizado para ti pronto.
PU_DUBUISSON_NOR_F_MC_MissionStart_GP_001,P=Hola, aquí Adrienne Du-Buisson, de Northrock. Para ponerte al día, parece que los intentos de la Seguridad de Crusader por recuperar sus plataformas de manos de los miembros de la banda Nine Tails han sido, hasta ahora, notablemente infructuosos. Todavía estoy recopilando los detalles más finos de la situación y tendré un informe completo listo para ti en cuanto estés en marcha. La lanzadera que te llevará a las plataformas debería estar justo delante.
PU_DUBUISSON_NOR_F_MC_MissionUpdateBarge_GP_001,P=Atracada en la siguiente plataforma está la barcaza de carga que los Nine Tails usaron para colarse ante la seguridad de Crusader, y donde encontrarás a Mendo Ren escondido. Ocúpate de él y ese será el último código del alternador.
PU_DUBUISSON_NOR_F_MC_MissionUpdateIsland2IktiLeaderResponse_GP_001,P=Un aumento en la presencia de los Nine Tails no augura nada bueno. Reunámonos con el capitán Reynolds y veamos si podemos combinar esfuerzos para llegar al alternador.
PU_DUBUISSON_NOR_F_MC_MissionUpdateIsland2NoIktiALT_GP_001,P=Mientras te diriges a la siguiente plataforma, ten en cuenta que, al desconectar un alternador, los Nine Tails podrían estar ajustando su estrategia ofensiva. Así que ten cuidado.
PU_DUBUISSON_NOR_F_MC_MissionUpdateIsland2_GP_001,P=Ahora que estamos de camino a la siguiente plataforma, conectaré al capitán Reynolds para una actualización de estado. Capitán, ¿está ahí?
PU_DUBUISSON_NOR_F_MC_PartialSecurityReset_GP_001,P=Un nodo reiniciado. Solo hay que completar el resto para volver a poner el sistema en línea.
PU_DUBUISSON_NOR_F_MC_PartialSecurityReset_GP_002,P=Ese nodo de seguridad ha sido reiniciado. Haz lo mismo con el resto y estaremos en buena forma.
PU_DUBUISSON_NOR_F_MC_PartialSecurityReset_GP_003,P=Ese nodo está de nuevo en línea. Cuando termines de reiniciar los demás, podremos volver a poner en línea toda esta rama de la red de seguridad.
PU_DUBUISSON_NOR_F_MC_PuzzleDoorOpenConfirmation_GP_001,P=Interesante. Ni siquiera sabía que se podía acceder a esta zona. Échale un vistazo y luego volvamos a lo nuestro.
PU_DUBUISSON_NOR_F_MC_ReinforcementsArriving_GP_001,P=Preparaos. Llegan refuerzos de los Nine Tails. No parecen contentos con nuestro progreso hasta ahora.
PU_DUBUISSON_NOR_F_MC_RequireanIktitoSolvePuzzleDirection_GP_001,P=Parece que estamos en un punto muerto. Puede que puedas usar uno de esos ATLS de Crusader para continuar.
PU_DUBUISSON_NOR_F_MC_RespondstoMendoRenLineBarge_GP_001,P=No es de extrañar que Mendo sepa que vamos a por él. Acabemos con esto.
PU_DUBUISSON_NOR_F_MC_RespondstoMendoRenLineIsland2_GP_001,P=Puede que Mendo Ren se haga el duro, pero sospecho que tus esfuerzos están empezando a debilitar su determinación. Veamos lo atrevido que es después de que desconectemos el siguiente alternador.
PU_DUBUISSON_NOR_F_MC_RespondtoIkitiLeaderDeath_GP_001,P=Mierda. Ábrete paso hasta la nave de los Nine Tails y ocúpate de esta amenaza antes de que se convierta en un problema aún mayor.
PU_DUBUISSON_NOR_F_MC_RespondtoMendoRenLineIsland1_GP_001,P=El análisis vocal lo ha identificado como Mendo Ren, un comandante de alto rango de los Nine Tails. Los operativos de Northrock han intentado detenerlo en el pasado con poco éxito. Su presencia aquí explica por qué esto estaba tan bien organizado. Si la experiencia pasada sirve de algo, es muy probable que él y sus tenientes de confianza lleven personalmente los códigos de acceso de los alternadores. Eliminarlos será un paso crítico para recuperar el control del espacio aéreo alrededor de las plataformas. Más te vale mantenerte alerta mientras avanzas.
PU_DUBUISSON_NOR_F_MC_RidingElevatortoLieutenantRoof_GP_001,P=Las imágenes de satélite han confirmado que otro de los tenientes de Mendo Ren está en la azotea. Llevará el código del alternador de esta plataforma y, por tanto, será tu próximo objetivo.
PU_DUBUISSON_NOR_F_MC_SecurityResetFirstTimeAllreset_GP_001,P=Con eso, todos los nodos de esta rama de la red de seguridad están de nuevo en línea. El ascensor debería volver a funcionar.
PU_DUBUISSON_NOR_F_MC_SecurityResetFirstTime_GP_001,P=Ese es el primer nodo reiniciado. Vuelve a poner en línea el resto de nodos de esta rama de la red y podrás acceder al ascensor.
PU_DUBUISSON_NOR_F_MC_ShuttleontheWay_GP_001,P=Hay una nave dirigiéndose ahora a tu ubicación para llevarte de vuelta a la plataforma de lanzaderas desde la que embarcaste. Disculpa que no puedan llevarte todo el camino de vuelta, pero se les necesita para operaciones de rescate.
PU_DUBUISSON_NOR_F_MC_SniperCallOut_GP_001,P=Cuidado. Hay francotiradores apuntando a tu posición.
PU_DUBUISSON_NOR_F_MC_SniperCallOut_GP_002,P=Mantente alerta. Hay nidos de francotiradores cerca.
PU_DUBUISSON_NOR_F_MC_SniperCallOut_GP_003,P=Una advertencia. Puede que haya francotiradores en la zona. Ve con cuidado.
PU_DUBUISSON_NOR_F_MC_WeaponCacheOpenedFirstTime_GP_001,P=Así que para eso era el código de acceso. Echa un vistazo dentro y coge lo que consideres útil.
PU_Forge_SHA_M_PMH_TSGPhase2TauntKnown_GP_001,P=Joder. Otra vez tú. Parece que no puedo librarme de ti, ¿eh? En fin, igual esta vez tenemos más suerte y te metemos en una puta tumba.
PU_Forge_SHA_M_PMH_TSGPhase2TauntKnown_GP_002,P=¿Otra vez por aquí? Esperaba que alguien te hubiera matado ya. Bueno, supongo que tendremos que encargarnos de eso.
PU_Forge_SHA_M_PMH_TSGPhase2TauntKnown_GP_003,P=Lo voy a decir, me alegro de haberme topado contigo otra vez. Mataste a mucha buena gente. Hora de la venganza, cabrón.
PU_Forge_SHA_M_PMH_TSGPhase2Taunt_GP_001,P=Sabes, teníamos algo bastante bueno montado. Nos dejaban en paz haciendo lo nuestro, pero ahora no podemos darnos la vuelta sin toparnos con uno de vosotros, cabrones del UEE.
PU_Forge_SHA_M_PMH_TSGPhase2Taunt_GP_002,P=¿Tienes idea de lo que nos costó fortificar este sitio?
PU_Forge_SHA_M_PMH_TSGPhase2Taunt_GP_003,P=Aquí va una idea: ¿puedo contratarte para que te largues a tomar por culo? Eso es lo único que os importa a los mercenarios, ¿no?
PU_Forge_SHA_M_PMH_TSGPhase3Taunt_GP_001,P=¿Qué tal esto? Volamos en pedazos a ese idris y os podéis ir. ¿Qué te parece? No tendrás motivo para quedarte.
PU_Forge_SHA_M_PMH_TSGPhase3Taunt_GP_002,P=La People's Alliance podría haberse marchado. Tú también. Pero ahora mueren. Esto debería haber sido mucho más simple.
PU_Forge_SHA_M_PMH_TSGPhase3Taunt_GP_003,P=Vale. Vamos a por la tierra quemada, aniquilación pura. Es la única cosa que los Vanduul hacen bien.
PU_Forge_SHA_M_PMH_TSGPhase5Taunt_GP_001,P=<crazy scrambled sound> ¿Te gusta eso? Que me parta un rayo si sé qué significa, pero lo que sí sé es que si lo emites por las comunicaciones, seguro que vienen unos cuantos Vanduul corriendo. Diviértete.
PU_Forge_SHA_M_PMH_TSGPhase5Taunt_GP_002,P=<crazy scrambled sound> ¿Has visto lo que les hacen los Vanduul a los Humanos? Es feo… crudo… despiadado. No te preocupes si no lo has visto. Estás a punto de hacerlo.
PU_GWindell_CIV_M_PMH_TSGGenericDeathThroe_GP_001,P=Mierda, mierda, mierda <death scream>
PU_GWindell_CIV_M_PMH_TSGGenericDeathThroe_GP_002,P=¡Ayuda, ayuda, ayuda!
PU_GWindell_CIV_M_PMH_TSGGenericDeathThroe_GP_003,P=¡Por favor, alguien!
PU_GWindell_CIV_M_PMH_TSGGenericHostileKilledEncouragement_GP_001,P=Joder, qué bueno eres en esto.
PU_GWindell_CIV_M_PMH_TSGGenericHostileKilledEncouragement_GP_002,P=Hostia, eso ha sido increíble.
PU_GWindell_CIV_M_PMH_TSGGenericHostileKilledEncouragement_GP_003,P=Los tienes. Los tienes.
PU_GWindell_CIV_M_PMH_TSGGenericNeedHelp_GP_001,P=Estas naves me están machacando.
PU_GWindell_CIV_M_PMH_TSGGenericNeedHelp_GP_002,P=¿Alguien me echa una mano con estas naves?
PU_GWindell_CIV_M_PMH_TSGGenericNeedHelp_GP_003,P=Que alguien se ocupe de estos cazas.
PU_GWindell_CIV_M_PMH_TSGPhase5DestroyTerminalUponEnter_GP_001,P=Eh, soy Gabe. Estoy escondido en mi nave y a salvo… por ahora al menos. Tendrás que llegar al terminal del hangar para abrir las puertas exteriores y poder salir.
PU_GWindell_CIV_M_PMH_TSGPhase5SavePilotPilotdistresscall_GP_001,P=Mayday, mayday, mayday... ¿Me recibes? Tranquility, soy Gabe.
PU_GWindell_CIV_M_PMH_TSGPhase5SuccessReward_GP_001,P=Lo conseguiste. Hangar abierto y lanzando ahora. Capitana Martel, estoy listo para volver al lío.
PU_GWindell_CIV_M_PMH_TSGPhase6ArrivesatDestination_GP_001,P=Estamos lo bastante lejos. Necesitaré algo de tiempo para activar el motor cuántico.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionComplete_GP_001,P=Activado. Gracias por sacarme de ahí.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionReminder_GP_001,P=No podré saltar a quantum con todos estos cazas encima.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionReminder_GP_002,P=Necesitas despejar a estos cazas para que pueda activar el motor.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionReminder_GP_003,P=Hay demasiados cazas para saltar a quantum. Despéjalos.
PU_GWindell_CIV_M_PMH_TSGPhase6SuccessReward_GP_001,P=Eh, perdón por no quedarme a echar una mano, pero cuando estaba atrapado en la estación, vi a algunos de Shattered Blade soltar sin querer una tarjeta llave. Si andas husmeando por su estación, igual te sirve. Gracias otra vez y nos vemos.
PU_HAWKER1_SK_WalkPast_NoBuy_IG_001_YourePassingOn,P=Estás dejando pasar la oferta del siglo.
PU_HAWKER1_SK_WalkPast_NoBuy_IG_002_OiWhereYou,P=Eh, ¿adónde vas?
PU_HAWKER1_SK_WalkPast_NoBuy_IG_003_WhyTheRush,P=¿A qué tantas prisas, amigo?
PU_HAWKER1_SK_WalkPast_NoBuy_IG_004_AllRightSome,P=Vale, otro día entonces. Ya sabes dónde encontrarme.
PU_HAWKER2_SK_WalkPast_NoBuy_IG_001_YourePassingOn,P=Estás dejando pasar la oferta del siglo.
PU_HAWKER2_SK_WalkPast_NoBuy_IG_002_HeyHeyHey,P=Eh, eh eh eh, ¿adónde vas?
PU_HAWKER2_SK_WalkPast_NoBuy_IG_003_WhyTheRush,P=¿A qué tantas prisas, amigo?
PU_HAWKER2_SK_WalkPast_NoBuy_IG_004_OkaySomeOther,P=Vale, otro día entonces. Ya sabes dónde encontrarme.
PU_IKTICAPTAIN_CRU_F_MC_Death_GP_001,P=Nos pillaron desprevenidos... Todo esto… fue…
PU_IKTICAPTAIN_CRU_F_MC_IntroLine_GP_001,P=Aquí el capitán Reynolds, de la Seguridad de Crusader. Mi equipo de ATLS ha estado intentando avanzar, pero estamos inmovilizados en la segunda plataforma. Intentaremos aguantar todo lo que podamos hasta que llegues.
PU_IKTICAPTAIN_CRU_F_MC_Island2Arrival_GP_001,P=Eh, aquí el capitán Reynolds. Los planes han cambiado. Mi escuadrón ha recibido la orden de entrar en la nave ahora. Tenemos que enfrentarnos a ellos antes de que puedan asegurar su bodega. Reúnete con nosotros allí en cuanto puedas.
PU_IKTICAPTAIN_CRU_F_MC_Island2Brief_GP_001,P=Estoy aquí. Los hemos estado conteniendo hasta ahora, pero que desconectaras el primer alternador ha removido el avispero. Acaba de llegar una nave de los Nine Tails con refuerzos. Vamos a abrirnos paso para ver qué está pasando. Me pondré en contacto de nuevo en cuanto llegues.
PU_ISAAC_MOR_M_CMB_DeathThroe_GP_001=Espera, espera, espera [scream]
PU_ISAAC_MOR_M_CMB_RBMMission3CombatTaunt_GP_001=Te diría que te unieras a los Moraine, pero no creo que tengas lo que hay que tener.
PU_ISAAC_MOR_M_CMB_RBMMission3CombatTaunt_GP_002=Conque peleón, ¿eh? Tienes más agallas que la mayoría de los blandengues de la PA que tienen en seguridad.
PU_ISAAC_MOR_M_CMB_RBMMission3CombatTaunt_GP_003=Deberías haber huido cuando tuviste la oportunidad.
PU_ISAAC_MOR_M_CMB_RBMMission3NeedHelp_GP_001=¡Eh, necesito ayuda aquí!
PU_ISAAC_MOR_M_CMB_RBMMission3NeedHelp_GP_002=¡Ayudadme, por favor!
PU_ISAAC_MOR_M_CMB_RBMMission3NeedHelp_GP_003=¡Quitádmelo de encima!
PU_ISAAC_MOR_M_MC_RBMMission3InTransitConversationLine11_GP_001=¿Y qué se supone que debo hacer? No es que pueda volver sin más.
PU_ISAAC_MOR_M_MC_RBMMission3InTransitConversationLine14_GP_001=Sí, vale.
PU_ISAAC_MOR_M_MC_RBMMission3MoraineAmbushPlayerArrivesLine1_GP_001=Así que tú eres al que ha mandado Recco, ¿eh? Me gusta tu nave... Espero que no la dañemos demasiado.
PU_ISAAC_MOR_M_MC_RBMMission3MoraineAmbushPlayerArrivesLine3_GP_001=Cállate. Te dije que había terminado con todos vosotros, pero no queréis escuchar. Nunca escucháis, así que a lo mejor escucháis esto. Los Moraine han hecho más por mí de lo que hizo nunca la Alliance. Bueno, ¿qué hay de esa nave?
PU_ISAAC_PEO_M_MC_RBMMission3InTransitConversationLine2_GP_001=¿Quién es?
PU_ISAAC_PEO_M_MC_RBMMission3InTransitConversationLine4_GP_001=¿Cómo me habéis encontrado?
PU_ISAAC_PEO_M_MC_RBMMission3InTransitConversationLine6_GP_001=¿Tú qué crees? He terminado con todos vosotros. La People's Alliance es un chiste. Me tragué sus tonterías durante años, pero si ni siquiera son capaces de plantar cara a las bandas, ¿de verdad crees que el Comité de Gobierno va a hacer algo cuando los Vanduul entren? Joder, probablemente les mandarían una tarta con la esperanza de hacer las paces.
PU_ISAAC_PEO_M_MC_RBMMission3InTransitConversationLine9_GP_001=No se suponía que fueran a matar a nadie. Lucas solo tenía que entregar el cargamento, pero no paraba de provocarlos y, cuando descubrió que yo les había dado el chivatazo... se puso como loco. No paraba de pegarme... hasta que ellos lo detuvieron.
PU_KEPLER_MOR_M_DF_DeathThroe_GP_001,P=Espera, espera, espera <scream>
PU_KEPLER_MOR_M_DF_RBMMission3CombatTaunt_GP_001,P=Diría que deberías unirte a los Moraine, pero no creo que tengas lo que hay que tener.
PU_KEPLER_MOR_M_DF_RBMMission3CombatTaunt_GP_002,P=Eres un luchador, ¿eh? Tienes más agallas que la mayoría de los blandengues de la PA que tienen haciendo de seguridad.
PU_KEPLER_MOR_M_DF_RBMMission3CombatTaunt_GP_003,P=Deberías haber huido cuando tuviste la oportunidad.
PU_KEPLER_MOR_M_DF_RBMMission3NeedHelp_GP_001,P=¡Eh, necesito algo de ayuda aquí!
PU_KEPLER_MOR_M_DF_RBMMission3NeedHelp_GP_002,P=¡Ayúdame, por favor!
PU_KEPLER_MOR_M_DF_RBMMission3NeedHelp_GP_003,P=¡Quítamelos de encima!
PU_KEPLER_MOR_M_MC_RBMMission3InTransitConversationLine11_GP_001,P=Entonces, ¿qué se supone que debo hacer? No es que pueda simplemente volver sin más.
PU_KEPLER_MOR_M_MC_RBMMission3InTransitConversationLine14_GP_001,P=Sí, vale.
PU_KEPLER_MOR_M_MC_RBMMission3MoraineAmbushPlayerArrivesLine1_GP_001,P=Así que tú eres al que envió Recco, ¿eh? Me gusta tu nave... Con suerte no la dañaremos demasiado.
PU_KEPLER_MOR_M_MC_RBMMission3MoraineAmbushPlayerArrivesLine3_GP_001,P=Cállate. Dije que había terminado con todos vosotros, pero es que no escucháis. Nunca escucháis, así que quizá escuchéis esto. Los Moraine han hecho más por mí de lo que la Alliance hizo jamás. Y ahora, ¿qué me dices de esa nave?
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine2_GP_001,P=¿Quién es este?
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine4_GP_001,P=¿Cómo me has encontrado?
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine6_GP_001,P=¿Qué crees? He terminado con todos vosotros. La People's Alliance es una broma. Me tragué sus tonterías durante años, pero ni siquiera pueden plantar cara a las bandas, así que, ¿crees por un segundo que el Comité de Gobierno va a hacer algo cuando los Vanduul avancen? Joder, probablemente les mandarían un pastel y esperarían poder hacer las paces.
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine9_GP_001,P=No se suponía que mataran a nadie. Lucas debería haber entregado el botín sin más, pero siguió presionándolos, y cuando descubrió que yo les había dado el chivatazo... se volvió loco. No dejaba de pegarme... hasta que ellos lo detuvieron.
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyArrive_GP_001=Eh, aquí el capitán Amir Lucas, Recco dijo que ayudarías. Deberías poder entrar por la parte delantera de la nave. Nuestro armero también está ahí arriba. Creo que están cargadas...
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyBoard_GP_001=La barricada aún aguanta, pero no sé por cuánto tiempo más. Odio pedirte esto, pero creo que vas a tener que luchar contra ellos.
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyMoraineCleared_GP_001=Creo que los has eliminado a todos. Es una lástima que haya tenido que llegar a la violencia, pero así es el universo hoy en día, supongo. En fin, gracias. Ya has hecho mucho por nosotros, pero ¿puedes hacer una cosa más? Los Moraine dejaron fuera de servicio nuestro generador y esperaba que pudieras arreglarlo antes de irte. Preferiría no perder el tiempo desmontando la barricada hasta que estemos de vuelta en Levski.
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyPowerplantFixed_GP_001=La energía está de nuevo en línea. Parece que se te da tan bien la multiherramienta como el arma. Gracias por tu ayuda. Empezaremos a volver en cuanto te alejes.
PU_REN_NIN_M_MC_ArrivalBarge_GP_001,P=Si crees que voy a dejar que entres aquí tan tranquilo, lo llevas claro. No vas a llegar al último alternador, ¿me oyes?
PU_REN_NIN_M_MC_ArrivalIsland1_GP_001,P=Vaya, mira a quién tenemos aquí. Crusader es aún más patético de lo que pensaba si depende de gente como tú para salvarles el pellejo. Cuanto antes aceptes que los Nine Tails controlan los cielos alrededor de estas plataformas, mejor será para todos. Y para asegurarme de que siga así, tengo a mi mejor gente en cada plataforma custodiando los alternadores. Créeme. Lo mejor que puedes hacer es volver a esa lanzadera ahora mismo. Este no es tu problema.
PU_REN_NIN_M_MC_ArrivalIsland2Ikti_GP_001,P=Escucha. Puede que hayamos perdido la primera plataforma, pero de ninguna manera voy a dejar que eso pase aquí. Unos cuantos ATLS no van a cambiar eso. Dame lo mejor que tengas.
PU_REN_NIN_M_MC_BargeDoorsOpenTaunt_GP_001,P=Bien, ¿tanto deseas conocerme? Pues entra.
PU_REN_NIN_M_MC_Death_GP_001,P=<painful scream> Los Nine Tails van a… te….
PU_REN_NIN_M_MC_EliteDeathFirstTime_GP_001,P=Maldita sea. Menuda decepción. Y uno cree que conoce a alguien y luego va y deja que un escuadrón de escoria lo liquide. Ese no merece que lo llamen Nine Tails.
PU_REN_NIN_M_MC_GeneralTaunts_GP_001,P=¡Vamos, acabemos ya con esta escoria!
PU_REN_NIN_M_MC_GeneralTaunts_GP_002,P=Hagas lo que hagas, los Nine Tails ya han ganado.
PU_REN_NIN_M_MC_GeneralTaunts_GP_003,P=Voy a verte sangrar aunque sea lo último que haga.
PU_REN_NIN_M_MC_GeneralTaunts_GP_004,P=Supongo que Crusader ha sacado partido a sus créditos contratándoos a vosotros.
PU_REN_NIN_M_MC_GeneralTaunts_GP_005,P=Si no estuviera tan cabreado contigo, quizá hasta me impresionarías un poco.
PU_REN_NIN_M_MC_GeneralTaunts_GP_006,P=Hay un ascenso esperando al Nine Tail que acabe con esto.
PU_REN_NIN_M_MC_IroncladEliteDeath_GP_001,P=Les dije que destruyeran esos ATLS, ¿pero lo hicieron? No. Supongo que es lo que me pasa por trabajar con una panda de degolladores. Nadie hace ni caso, joder.
PU_REN_NIN_M_MC_LastStandTaunt_GP_001,P=Ya basta. ¡Soy Mendo puñetero Ren! El azote de siete planetas y el corazón negro de los Nine Tails. ¡Arreglemos esto ahora!
PU_REN_NIN_M_MC_Lieutenant1Death_GP_001,P=El maldito idiota estaba tan centrado en los regens cuando debería haberse esforzado más en seguir con vida. Da igual. Adelante, desconecta ese alternador. No cambiará nada. Aquí seguimos teniendo el control.
PU_REN_NIN_M_MC_Lieutenant1Intro_GP_001,P=Muy bien, Remy. Prepárate. Tienes compañía dirigiéndose hacia ti. Muéstrales lo que un verdadero Nine Tails puede hacer.
PU_REN_NIN_M_MC_Lieutenant2Death_GP_001,P=Diablos… Stax… Nunca pensé que llegaría el día. Adelante, haz lo que quieras con ese alternador. Todavía nos queda uno y eso es más que suficiente.
PU_REN_NIN_M_MC_Lieutenant2IntroResponse_GP_001,P=[Se ríe] Hacía tiempo que no pensaba en ese. Pero oye, mientras los mates, monta todo el jaleo que quieras esta vez.
PU_REN_NIN_M_MC_Lieutenant2Intro_GP_001,P=Muy bien, te toca, Stax. Ten cuidado, ¿vale?
PU_REN_NIN_M_MC_MendoAppearsTauntPart1_GP_001,P=No podías dejarlo estar, ¿verdad? Ahora te va a costar la vida. Espero que hayas disfrutado haciéndote el héroe.
PU_REN_NIN_M_MC_MendoAppearsTauntPart2_GP_001,P=Muy bien, probemos esto otra vez. Tu suerte se acabará en algún momento.
PU_REN_NIN_M_MC_MendoAppearsTauntPart3_GP_001,P=¿Así que crees que puedes conmigo? ¡Pues aquí estoy! Dame con todo lo que tengas.
PU_REN_NIN_M_MC_MendoRaisesCorePart1_GP_001,P=Subamos la apuesta, ¿te parece? Adelante, veamos cómo te las apañas con esto, ¿eh?
PU_REN_NIN_M_MC_MendoRaisesCorePart2_GP_001,P=A la segunda va la vencida, ¿no? Hora de llevar esto al siguiente nivel.
PU_REN_NIN_M_MC_MendoRaisesCorePart3_GP_001,P=No más, esto es todo. Esto es todo lo que tenemos, joder. ¡Así que dame lo peor que tengas!
PU_REN_NIN_M_MC_MendoTakesdamageandleavesPart1_GP_001,P=No vas a poder conmigo tan fácilmente. Aún no he terminado contigo.
PU_REN_NIN_M_MC_MendoTakesdamageandleavesPart2_GP_001,P=¡Argh! Me estoy hartando de verdad de ti.
PU_REN_NIN_M_MC_MendoTakesdamageandleavesPart3_GP_001,P=Maldita sea, maldita sea, maldita sea. Estoy hasta las narices de esto, joder.
PU_REN_NIN_M_MC_PlayerDeactivatesCoresPart1_GP_001,P=Tienes que estar de coña. ¿Ni siquiera eso fue suficiente?
PU_REN_NIN_M_MC_PlayerDeactivatesCoresPart2_GP_001,P=Justo cuando pienso que no puedes ser más irritante, vas y haces mierdas como esta.
PU_REN_NIN_M_MC_PlayerDeactivatesCoresPart3_GP_001,P=Cómo no, también ibas a sobrevivir a eso. Supongo que hoy no es mi día después de todo.
PU_REN_NIN_M_MC_PlayerDiesTauntFalling_GP_001,P=Le quita toda la gracia si vais a limitaros a caer hacia vuestra muerte.
PU_REN_NIN_M_MC_PlayerDiesTaunt_GP_001,P=Mira eso, tu amigo es un cadáver.
PU_REN_NIN_M_MC_PlayerDiesTaunt_GP_002,P=Ahí lo tienes. Uno menos de vosotros, escoria.
PU_REN_NIN_M_MC_PlayerDiesTaunt_GP_003,P=Eso es una baja para nuestro bando. ¿Sigues sintiéndote chulo?
PU_REN_NIN_M_MC_RadiationTaunts_GP_001,P=¿Qué tal te va ahí abajo? No tienes muy buena pinta.
PU_REN_NIN_M_MC_RadiationTaunts_GP_002,P=¿Ya empiezan a dolerte los huesos? Ese es uno de los primeros síntomas, según he oído.
PU_REN_NIN_M_MC_RadiationTaunts_GP_003,P=Mi tripulación tampoco tiene que preocuparse por pagar a un médico. Les prometí que, si te matan, los Nine Tails cubrirán la factura.
PU_REN_NIN_M_MC_RadiationTaunts_GP_004,P=Estos núcleos no se diseñaron para esto, pero a veces hay que pensar de forma creativa, ¿eh?
PU_REN_NIN_M_MC_RadiationTaunts_GP_005,P=Apuesto a que la sangre te empieza a hervir. ¿Lo notas?
PU_REN_NIN_M_MC_ReinforcementsArriveIsland1_GP_001,P=Tengo que decírtelo, me estoy hartando de que interfieras en los asuntos de los Nine Tails. Se acabó el ser amables. Veamos si puedes con esto.
PU_REN_NIN_M_MC_ReinforcementsArriveIsland2_GP_001,P=¿Por qué demonios no te mueres de una vez? De ninguna puta manera voy a perder contra ti. Veamos si puedes sobrevivir a esto.
PU_REN_NIN_M_MC_ResetSecurityFirstTime_GP_001,P=Probablemente creas que estás avanzando bastante hasta ahora. Y sí, quizá empezamos subestimándote, pero no te preocupes, eso va a cambiar.
PU_RefuelNPC01_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Bueno, eso fue absolutamente aterrador. Vale, démonos prisa y terminemos la transferencia de combustible.
PU_RefuelNPC01_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=¿Eran todos? Vale, ¿qué tal si terminamos esto y nos largamos cagando leches?
PU_RefuelNPC01_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Gracias. Este sistema se vuelve más peligroso cada día. Terminemos esto antes de que aparezcan más.
PU_RefuelNPC01_CIV_M_ATC_RefuelingComplete_GP_001,P=Eso es. Listo para irme. Gracias otra vez y siento las molestias.
PU_RefuelNPC01_CIV_M_ATC_RefuelingComplete_GP_002,P=Vale. Transferencia de combustible completada. Gracias por el rescate. Espero que no haya sido demasiada molestia para ti.
PU_RefuelNPC01_CIV_M_ATC_RefuelingComplete_GP_003,P=Uf. Repostado del todo. Muchas gracias por la ayuda. Voy a intentar fijarme un poco más en mis indicadores la próxima vez.
PU_RefuelNPC01_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Death Scream ]
PU_RefuelNPC01_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=Genial. Estamos acoplados. Adelante, autoriza la transacción de combustible.
PU_RefuelNPC01_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Acople completado. Solo necesito que confirmes la transacción de combustible.
PU_RefuelNPC01_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Listo. Establece los términos de la transacción de combustible y le echo un vistazo.
PU_RefuelNPC01_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Espera. He perdido la conexión.
PU_RefuelNPC01_CIV_M_ATC_RefuelingIncomplete_GP_002,P=Eh, todavía necesito más combustible.
PU_RefuelNPC01_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Espera, la transferencia de combustible aún no había terminado.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Eh, gracias por venir. Me siento como un idiota por quedarme sin combustible. Si quieres acoplarte rápido, terminamos con esto.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=Eh, por aquí. Lo siento mucho. Habría jurado que calculé bien la distancia… En fin, vamos a acoplarnos para que puedas seguir tu camino.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Hola. Perdona, esto es muy embarazoso. Tenía un montón de cosas que recoger en la última estación de transferencia y supongo que olvidé repostar. Un fallo de novato. En fin, perdona, si nos acoplamos, te dejo seguir con lo tuyo.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=Vale, vuelve pronto. Aquí estaré esperando.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=Tranquilo, atiende lo que tengas que atender. Estaré aquí cuando estés listo.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Ah, te vas… sí, claro, no pasa nada. Puedo esperar.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=Vale, reconectemos para poder largarnos de aquí.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Bienvenido de vuelta. Acoplemos y terminemos el repostaje.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=Me alegro de que hayas vuelto. Listo para acoplar cuando lo estés tú.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Genial. Veo la transferencia de combustible en marcha.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=Ese precio es un poco más alto de lo que esperaba.
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=¡Joder! ¿¡Quién narices es ese!?
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Tenemos compañía… mala compañía…
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=¡Socorro! Me están atacando.
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=¡Eh! ¿A qué viene eso?
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=¿¡Por qué has hecho eso!?
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=¿Qué demonios te pasa?
PU_RefuelNPC02_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Gracias a los cielos. Hay que admitirlo, se ha puesto tenso por un momento. Ahora que se acabó, vamos a terminar.
PU_RefuelNPC02_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=Por los pelos. Acabemos el repostaje y me largo.
PU_RefuelNPC02_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Me alegro de que se acabara. Espero que terminemos sin más problemas.
PU_RefuelNPC02_CIV_M_ATC_RefuelingComplete_GP_001,P=Vale. Parece que hemos terminado. Me piro.
PU_RefuelNPC02_CIV_M_ATC_RefuelingComplete_GP_002,P=Vale. Estoy repostado. Gracias. Y perdona si he sido un poco brusco. Uno de esos días. Vuela seguro.
PU_RefuelNPC02_CIV_M_ATC_RefuelingComplete_GP_003,P=Listo. Tanque lleno. Pensé que nunca saldría de aquí. Vale. Me marcho.
PU_RefuelNPC02_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Grito de muerte ]
PU_RefuelNPC02_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=Estamos conectados. Fija el precio para que podamos ponernos en marcha.
PU_RefuelNPC02_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Acoplado. Adelante, envía el precio.
PU_RefuelNPC02_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Conexión confirmada. Establece los términos de la transacción para empezar.
PU_RefuelNPC02_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Eh, aún no había terminado de repostar.
PU_RefuelNPC02_CIV_M_ATC_RefuelingIncomplete_GP_002,P=¿Qué pasa? No hemos terminado de repostar.
PU_RefuelNPC02_CIV_M_ATC_RefuelingIncomplete_GP_003,P=¿Pasa algo? Aún necesito más combustible.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Bien, ya estás aquí. Adelante, acopla para poner esto en marcha.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=Ya era hora. Iba a perder la cabeza si seguía flotando aquí más rato. Acopla y déjame salir de aquí.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Me alegro de que apareciera alguien. Date prisa y acopla. No hay razón para que esto dure más de lo necesario.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=Vale… ¿Se supone que tengo que esperar aquí, entonces?
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=Date prisa y vuelve, ¿vale? No quiero pasarme el día entero esperándote.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Claro... Déjame esperando aquí. Como si no tuviera nada mejor que hacer.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=¿Qué tal si acoplas y terminamos con esto? ¿O vas a hacerme perder más tiempo?
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Ahí estás. Acopla de una vez y acabemos con esto.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=Y mi salvador regresa. ¿Qué tal si acoplas para que pueda largarme?
PU_RefuelNPC02_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Llenando el tanque ahora. Debería terminar pronto.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=Eso es más de lo que puedo pagar.
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Maldita sea. ¡Qué más puede salir mal hoy!
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=¡Mierda! ¡Quítamelos de encima!
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=Tiene que ser una broma. ¿Primero el combustible y ahora esto?
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=¿¡Qué demonios estás haciendo!?
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=¿Has perdido la cabeza?
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=¿A qué demonios viene eso?
PU_RefuelNPC03_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Parece que estamos a salvo de momento. Mejor terminamos el repostaje.
PU_RefuelNPC03_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=Creo que esos eran los últimos. Acabemos de cuadrar el combustible mientras podamos.
PU_RefuelNPC03_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Todo despejado. Espero que podamos terminar el repostaje antes de que aparezcan más problemas.
PU_RefuelNPC03_CIV_M_ATC_RefuelingComplete_GP_001,P=Y listo. Tanque lleno y listo para volar. Gracias por todo el esfuerzo.
PU_RefuelNPC03_CIV_M_ATC_RefuelingComplete_GP_002,P=Hecho. Gracias por el repostaje. Vuela seguro ahí fuera.
PU_RefuelNPC03_CIV_M_ATC_RefuelingComplete_GP_003,P=Genial. Combustible al máximo. Aunque espero no necesitar tus servicios otra vez en un buen tiempo.
PU_RefuelNPC03_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Grito de muerte ]
PU_RefuelNPC03_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=Vale. Conectado. No está mal. Solo necesito que apruebes la transacción de combustible.
PU_RefuelNPC03_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Listo. Todo enganchado. Estoy preparado para revisar los términos de la transacción de combustible en cuanto me los envíes.
PU_RefuelNPC03_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Parece que estamos listos. Adelante, confirma la transacción de combustible.
PU_RefuelNPC03_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Eh… sabes que aún no hemos terminado, ¿verdad?
PU_RefuelNPC03_CIV_M_ATC_RefuelingIncomplete_GP_002,P=Espera ahí. Aún no estoy repostado.
PU_RefuelNPC03_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Eh, ¿qué pasa? Aún necesito más combustible.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Ah, perfecto. Estás aquí. Agradezco la ayuda. No me puedo creer que me haya quedado sin combustible. En fin, listo para acoplar cuando lo estés tú.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=Genial, gracias por venir. Estoy listo para acoplar cuando quieras empezar. La verdad es que yo mismo volaba un cisterna, así que sé lo que es. Eso hace aún más vergonzoso que se me secara el tanque. En fin, te dejo a tu trabajo.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Eh, has llegado. Gracias por venir. ¿Dónde estaría el 'verse sin repostadores como tú, eh? Lo tengo todo preparado para empezar la transferencia en cuanto te acoples.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=Vale, si tienes algo urgente, puedo aguantar aquí hasta que vuelvas con el resto del combustible.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=Ah, ¿te escapas un momento? Tranquilo. Yo me quedo por aquí. Pero vuelve pronto, ¿vale?
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=¿Hacemos un descansito? Tampoco tardes mucho, ¿eh? Estaría bien volver a volar pronto.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=Bienvenido de vuelta. Sigo listo para acoplar.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Me alegro de verte de nuevo. Vamos a acoplar y repostar.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=Me alegro de que hayas vuelto. ¿Resolvemos este repostaje de una vez por todas?
PU_RefuelNPC03_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Vale, transfiriendo combustible.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=Espero que sea broma con ese precio. Inténtalo de nuevo.
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Ay, mierda. ¡Me están disparando!
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Maldita sea. ¿Podían haber elegido peor momento?
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=¿Te puedes creer a estos cabrones?
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=¿Qué demonios te ha pasado?
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=Eh, se supone que tienes que ayudarme, no dispararme.
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=¿A qué viene eso?
PU_RefuelNPC04_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Joder. Demasiado cerca. Termina el repostaje antes de que aparezcan más problemas.
PU_RefuelNPC04_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=¿Eran todos? Acabemos el repostaje para que pueda largarme de aquí.
PU_RefuelNPC04_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Buen viaje. Ahora date prisa y termina de repostarme.
PU_RefuelNPC04_CIV_M_ATC_RefuelingComplete_GP_001,P=Listo. Hecho. Y no, no vas a recibir propina.
PU_RefuelNPC04_CIV_M_ATC_RefuelingComplete_GP_002,P=Eso es. Tengo mi combustible. Adiós.
PU_RefuelNPC04_CIV_M_ATC_RefuelingComplete_GP_003,P=Bien. Por fin hemos terminado. Me piro.
PU_RefuelNPC04_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Grito de muerte ]
PU_RefuelNPC04_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=Acoplado. Fija la transacción según lo acordado.
PU_RefuelNPC04_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Vale. Estamos acoplados. Solo fija el precio de la transacción a lo acordado.
PU_RefuelNPC04_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Todo conectado. Fija el precio a lo que indiqué. Sin trampas.
PU_RefuelNPC04_CIV_M_ATC_RefuelingIncomplete_GP_001,P=¿A dónde demonios vas con mi combustible?
PU_RefuelNPC04_CIV_M_ATC_RefuelingIncomplete_GP_002,P=Eh, no hemos terminado.
PU_RefuelNPC04_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Eh, por si no te has dado cuenta, no has terminado de repostarme.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Tú debes ser mi repostador. Y antes de que preguntes, no, no quiero servicios extra. Solo el repostaje. Adelante, acopla.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=Me preguntaba cuándo aparecería mi cisterna. En fin, ¿a qué esperas? Adelante, acopla.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Saltémonos los formalismos, ¿vale? Estás aquí para hacer un trabajo, así que adelante, acopla.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=¿Te vas? Supongo que no tengo nada mejor que hacer con mi tiempo que esperar aquí a que vuelvas.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=No me puedo creer que te vayas sin terminar. Bien. Lo que sea. Vuelve cuanto antes.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Vaya. Qué profesional. ¿Se supone que tengo que quedarme aquí esperando a que te apetezca volver? Claro. Por qué no.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=Por fin. Acopla para que terminemos con esto.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Mira quién decidió volver. Acopla de una vez y termina de repostarme.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=Ya era hora. ¿Sabes? Debería conseguir un descuento después de tanto esperar. Lo que sea, adelante, acopla. Ya voy bastante tarde.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Vale, transfiriendo combustible. Y ahórrate la cháchara.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=No voy a pagar eso.
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=¡Maldita sea! ¡No puedo permitirme reparaciones extra ahora mismo!
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=¿Por qué demonios me están disparando?
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=¡Ah, ni hablar! ¡Quítamelos de encima!
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=¡Cuidado a dónde disparas!
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=¡Eh! ¿Así tratas a un cliente?
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=¿Qué demonios? ¿¡Me estás disparando!?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingArrivesatPlayersLocation_GP_001,P=Eh, hola, voy a ser tu repostador hoy. Adelante, solicita acoplar para que podamos empezar.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingArrivesatPlayersLocation_GP_002,P=Bajo de combustible, ¿eh? Le pasa a los mejores. Bueno, solicita acoplar y vemos cómo ponerte de nuevo en marcha.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingArrivesatPlayersLocation_GP_003,P=¿Qué tal? Tengo combustible aquí con tu nombre. Solo necesito que solicites acoplar y te sacamos de aquí.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingCombatEnds_GP_001,P=Vale, me alegro de que se acabara. Acabemos el repostaje mientras podamos.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingCombatEnds_GP_002,P=Creo que estamos bien. Conecta las naves antes de que aparezcan más.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingCombatEnds_GP_003,P=¿Eran todos? Bien. Vamos a repostarte.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingComplete_GP_001,P=Vale, deberías estar listo. Espero que tengas un buen día.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingComplete_GP_002,P=Tanque lleno. Mantente a salvo ahí fuera.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingComplete_GP_003,P=Todo en orden. Tanque lleno y el espacio te espera. Cuídate.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDeathThroe_GP_001,P=[ Grito de muerte ]
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDockingComplete_GP_001,P=Vale, estamos conectados. Cuando confirmes la compra de combustible desde tu mobi, puedo iniciar la transferencia.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDockingComplete_GP_002,P=Vale… enlace establecido. Deberías ver la orden de compra de combustible en tu mobi. En cuanto la confirmes, puedo empezar a llenar tus tanques.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDockingComplete_GP_003,P=Y listo. Enlazados. Ahora solo necesitamos que firmes la compra de combustible en tu mobiGlas.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingEndingContractEarlier_GP_001,P=¿Sabes qué? Tengo otros clientes esperando. Hemos terminado.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingEndingContractEarlier_GP_002,P=Vale, creo que sé hacia dónde va esto. Me piro.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingEndingContractEarlier_GP_003,P=No tengo tiempo para esto. Buena suerte.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingFuelTransferStarting_GP_001,P=Vale, transfiriendo combustible.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingFuelTransferStarting_GP_002,P=Genial, iniciando transferencia de combustible.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingFuelTransferStarting_GP_003,P=Pinta bien. El combustible fluye.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingIncomplete_GP_001,P=¡Eh! La transferencia aún no había terminado.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingIncomplete_GP_002,P=¿Por qué te has desconectado? No estás repostado.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingIncomplete_GP_003,P=He perdido la conexión. ¿Qué ha pasado?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=¿A dónde te crees que vas? ¿Y el resto del combustible?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=¿Qué pasa? Tu nave aún no está llena.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Eh… ¿hola? No hemos terminado el repostaje.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Maldita sea, tenemos problemas.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Cuidado. Tenemos hostiles.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=Atento. No parecen estar aquí para ayudar.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=¡Eh! ¡Estoy intentando ayudarte!
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=¿Qué demonios estás haciendo?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=Ah, ni hablar. Me piro.
PU_Tobin_INT_M_PMH_TSGMissionAbandon_GP_001,P=Tendré que encontrar a otro que se encargue de este contrato.
PU_Tobin_INT_M_PMH_TSGMissionAbandon_GP_002,P=Mira, en InterSec no podemos contar con gente que no cumple los contratos. Si vas a trabajar para nosotros, asegúrate de poder comprometerte.
PU_Tobin_INT_M_PMH_TSGMissionAbandon_GP_003,P=Te alejas de una situación volátil que aún necesita resolverse. Por favor, no vuelvas a hacerlo.
PU_Tobin_INT_M_PMH_TSGMissionAcceptIntro_GP_001,P=Soy Deacon Tobin. Seré tu gestor de operaciones aquí en Intersec. Una fuente anónima ha indicado que una nave de seguridad de la People's Alliance ha sido inutilizada por una estación de Shattered Blade y necesita ayuda urgente. He contactado con su capitán y le he dicho que vas en camino con toda la prisa posible. Establecerán contacto y te guiarán por lo que hay que hacer cuando llegues.
PU_Tobin_INT_M_PMH_TSGMissionAccept_GP_001,P=Deacon de Intersec al habla. Estas naves de la People's Alliance no paran de remover el avispero. Ya conoces el procedimiento. Te darán indicaciones cuando estés en el sitio. Buena suerte.
PU_Tobin_INT_M_PMH_TSGMissionAccept_GP_002,P=Aquí Intersec. Parece que la People's Alliance ha encontrado otra estación de Shattered Blade y necesita ayuda. Acude al área de operaciones lo más rápido que puedas y te darán indicaciones desde allí.
PU_Tobin_INT_M_PMH_TSGMissionAccept_GP_003,P=Tobin de Intersec al habla. Tenemos otra situación entre la People's Alliance y Shattered Blade. Dirígete allí y te darán instrucciones.
PU_Tobin_INT_M_PMH_TSGMissionFail_GP_001,P=No me gusta hacerlo, pero voy a cancelar esta operación. Ahora mismo no hay ninguna posibilidad de éxito.
PU_Tobin_INT_M_PMH_TSGMissionFail_GP_002,P=Te saco. Hemos perdido cualquier oportunidad de completar esta misión.
PU_Tobin_INT_M_PMH_TSGMissionFail_GP_003,P=Esta operación no va a funcionar. Hemos perdido el control de la situación.
