item_DescKRIG_LaserRepeater_Bespoke_S2=Tipo de artículo: Repetidor láser\nFabricante: Kruger Intergalactic\nTamaño: 2\n\nDiseñado para que la Stingray desate un torrente de fuego láser, este repetidor hecho a medida dispara en rápida sucesión para desmantelar las defensas enemigas.
item_DescMRCK_S04_KRIG_S65_Stingray_Left=Tipo de artículo: Soporte de misiles\nFabricante: Kruger Intergalactic\nTamaño: 4\nMisiles: 4xS2\n\nSoporte de misiles hecho a medida para la Stingray que dispara cuatro misiles S2.
item_DescMRCK_S04_KRIG_S65_Stingray_Right=Tipo de artículo: Soporte de misiles\nFabricante: Kruger Intergalactic\nTamaño: 4\nMisiles: 4xS2\n\nSoporte de misiles hecho a medida para la Stingray que dispara cuatro misiles S2.
item_DescMount_Gimbal_S2_Stingray=Tipo de artículo: Montaje gimbal\nFabricante: Kruger Intergalactic\nTamaño: 2\n\nEste montaje gimbal hecho a medida para la Stingray admite armamento de hasta tamaño 2 y permite puntería adaptativa.
