item_Desc_qrt_specialist_medium_backpack_01_03,P=Tipo de artículo: Mochila ligera\nCapacidad de carga: 54K µSCU\nCompatibilidad de núcleo: Todas\n\nTanto si transportas suministros a una zona de combate como si simplemente llevas equipamiento adicional, la mochila Arden-CL está lista y probada para el campo de batalla. Roussimoff Rehabilitation Systems la diseñó con un conector universal para la pechera, permitiendo acoplarla a una amplia variedad de armaduras.\n\nLa edición Elysium combina detalles dorados brillantes de calaveras aladas con un azul marino.
item_Desc_qrt_specialist_medium_helmet_01_05_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nCombinando durabilidad y un estilo llamativo, la armadura Artimex ejemplifica la estética de Quirinus. Esta armadura de intrincado detalle atiende tanto a la forma como a la función, especialmente cuando se combina con el casco totalmente cerrado que luce un adorno ocular de neón. \n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_qrt_utility_heavy_core_03_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 8K µSCU\nMochilas: Todas\n\nEl diseño elegante se une a la innovación con la armadura Palatino de Quirinus Tech. Este conjunto de armadura combina magistralmente placas reforzadas con nuevos materiales patentados que son ligeros y flexibles, pero capaces de resistir daños graves, permitiendo al usuario ir a la moda, moverse con agilidad y soportar un poder de fuego considerable.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_r6p_glasses_01_01_01=Cuando el futuro pinta brillante, recurre a estas gafas de aviador de R6 Pro. Con un diseño que ha permanecido como un clásico reconocido durante siglos, podrás rendir homenaje a los pioneros aviadores del pasado mientras buscas los nuevos horizontes del mañana.
item_Desc_rrs_combat_light_backpack_01,P=Tipo de artículo: Mochila ligera\nCapacidad de carga: 54K µSCU\nCompatibilidad de núcleo: Todas\n\nTanto si transportas suministros a una zona de combate como si simplemente llevas equipamiento adicional, la mochila Arden-CL está lista y probada para el campo de batalla. Roussimoff Rehabilitation Systems la diseñó con un conector universal para la pechera, permitiendo acoplarla a una amplia variedad de armaduras.
item_Desc_rrs_combat_light_backpack_02_02_01,P=Tipo de artículo: Mochila ligera\nCapacidad de carga: 54K µSCU\nCompatibilidad de núcleo: Todas\n\nTanto si transportas suministros a una zona de combate como si simplemente llevas equipamiento adicional, la mochila Arden-CL está lista y probada para el campo de batalla. Roussimoff Rehabilitation Systems la diseñó con un conector universal para la pechera, permitiendo acoplarla a una amplia variedad de armaduras.\n\nLa edición Chairman's Club está vestida de negro con ricos detalles dorados.
