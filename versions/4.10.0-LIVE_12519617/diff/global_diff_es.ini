item_Desc_cds_combat_heavy_legs_01_02_02=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -80 / 105 °C\nProtección contra radiación: 52800 REM\nPurga de radiación: 251.1 REM/s\nCapacidad de carga: 8.0 µSCU\n\nCuando hay un trabajo difícil por delante, quieres asegurarte de poder verlo hasta el final. La armadura pesada ADP-mk4 de Clark Defense Systems permite a los Marines permanecer en situaciones de combate activo durante más tiempo con más opciones de equipamiento, mientras que su estructura motorizada proporciona un movimiento casi sin restricciones a pesar de la protección que ofrece.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_light_arms_02_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nLa búsqueda de CDS por crear la armadura ligera ideal continúa con la FBL-8a. Esta armadura ligera te mantendrá ágil gracias a su mezcla estratégica de placas protectoras y tejidos de nanoentramado reforzados. Aunque la armadura funciona con cualquier subtraje, fue diseñada específicamente para combinar con el subtraje FBL-8u, con especial atención a cómo encajan ambos para hacer el conjunto lo más aerodinámico y ágil posible.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_light_backpack_01_06_01=Tipo de artículo: Mochila ligera\nCapacidad de carga: 54K µSCU\nCompatibilidad de núcleo: Todas\n\nUna síntesis ideal de fuerza y tecnología, la armadura Geist Stealth está fabricada con seda de carbono de grado militar procedente de los mismos fabricantes que protegen a las fuerzas especiales de la UEE. Filamentos tan finos como cabellos tejidos en la tela ocultan las emisiones del portador, haciéndolo indetectable por radar, y la tubería especializada incorporada en las suelas de las botas amortigua el sonido de los pasos.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_cds_combat_light_core_02_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -32 / 62 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 2.0 µSCU\nMochilas: Ligera\n\nLa búsqueda de CDS por crear la armadura ligera ideal continúa con la FBL-8a. Esta armadura ligera te mantendrá ágil gracias a su mezcla estratégica de placas protectoras y tejidos de nanoentramado reforzados. Aunque la armadura funciona con cualquier subtraje, fue diseñada específicamente para combinar con el subtraje FBL-8u, con especial atención a cómo encajan ambos para hacer el conjunto lo más aerodinámico y ágil posible.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_light_helmet_02_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nLa búsqueda de CDS por crear la armadura ligera ideal continúa con la FBL-8a. Esta armadura ligera te mantendrá ágil gracias a su mezcla estratégica de placas protectoras y tejidos de nanoentramado reforzados. Aunque la armadura funciona con cualquier subtraje, fue diseñada específicamente para combinar con el subtraje FBL-8u, con especial atención a cómo encajan ambos para hacer el conjunto lo más aerodinámico y ágil posible. El visor es compatible con la retícula AR.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_light_legs_02_02_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 2.0 µSCU\n\nLa búsqueda de CDS por crear la armadura ligera ideal continúa con la FBL-8a. Esta armadura ligera te mantendrá ágil gracias a su mezcla estratégica de placas protectoras y tejidos de nanoentramado reforzados. Aunque la armadura funciona con cualquier subtraje, fue diseñada específicamente para combinar con el subtraje FBL-8u, con especial atención a cómo encajan ambos para hacer el conjunto lo más aerodinámico y ágil posible.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_medium_arms_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 6.4 µSCU\nMochilas: Media, Ligera\n\nLa mark X forma parte de la galardonada serie de armaduras Omni-Role Combat de CDS. Este traje apto para EVA incorpora la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y los elementos mientras minimiza la agilidad del operador.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_medium_backpack_01_02_01,P=Tipo de artículo: Mochila media\nCapacidad de carga: 105K µSCU\nCompatibilidad de núcleo: Media y pesada\n\nPrepárate para cualquier situación con la mochila CSP-68M. Originalmente diseñada para las exigencias del soporte de combate, esta mochila media se ha hecho popular gracias a su durabilidad y a un conector de núcleo patentado que ayuda a que la CSP-68M se asiente cómoda y equilibradamente en la espalda.\n\nLa edición Epoque presenta una combinación de azul marino y negro, rematada con detalles dorados barrocos.
item_Desc_cds_combat_medium_core_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 6.4 µSCU\nMochilas: Media, Ligera\n\nEsta versión de la armadura de combate ORC-mkX de CDS ha sido modificada respecto a su forma original. La mark X forma parte de la galardonada serie de armaduras Omni-Role Combat de CDS. Este traje apto para EVA incorpora la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y los elementos mientras minimiza la agilidad del operador.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_medium_helmet_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -55 / 85 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nLa mark X forma parte de la galardonada serie de armaduras Omni-Role Combat de CDS. Este traje apto para EVA incorpora la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y los elementos mientras minimiza la agilidad del operador. El visor es compatible con la retícula AR.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_medium_legs_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -61 / 91 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4.0 µSCU\n\nLa mark X forma parte de la galardonada serie de armaduras Omni-Role Combat de CDS. Este traje apto para EVA incorpora la nueva tecnología de tejido compuesto EdgeCore, maximizando la protección contra proyectiles, explosivos y los elementos mientras minimiza la agilidad del operador.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa la armadura con una base azul intensa adornada con un elegante y fluido diseño de aire.
item_Desc_cds_combat_superheavy_arms_02_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nRedefine la protección personal con la serie BUL-H4. Gracias al uso de polímeros sintéticos avanzados, los impactos se mitigan de forma significativa, convirtiendo al usuario en un baluarte defensivo. El armazón asistido por energía de la armadura ayuda a mantener la movilidad, compensando el elevado peso del traje.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_cds_combat_superheavy_backpack_01_01_01=Tipo de artículo: Portador de munición\nCompatibilidad de núcleo: Media y pesada\nCapacidad de carga: 150K µSCU\n\nConstruido a medida para almacenar munición adicional para ametralladoras pesadas, este portador se conecta directamente a tu arma mediante una cinta de munición, garantizando un fuego continuo y prolongado sin interrupciones.
item_Desc_cds_combat_superheavy_backpack_01_01_02,P=PH - Description for cds_combat_superheavy_backpack_01_01_02
item_Desc_cds_combat_superheavy_backpack_01_03_01=Tipo de artículo: Portador de munición\nCompatibilidad de núcleo: Media y pesada\nCapacidad de carga: 150K µSCU\n\nConstruido a medida para almacenar munición adicional para ametralladoras pesadas, este portador se conecta directamente a tu arma mediante una cinta de munición, garantizando un fuego continuo y prolongado sin interrupciones.\n\nCon un patrón de camuflaje digital blanco, la edición Snow Camo es perfecta para acechar a la presa en entornos helados.
item_Desc_cds_combat_superheavy_backpack_01_04_01=Tipo de artículo: Portador de munición\nCompatibilidad de núcleo: Media y pesada\nCapacidad de carga: 150K µSCU\n\nConstruido a medida para almacenar munición adicional para ametralladoras pesadas, este portador se conecta directamente a tu arma mediante una cinta de munición, garantizando un fuego continuo y prolongado sin interrupciones.\n\nLa edición SteelTek presenta un reluciente revestimiento metálico con un patrón de Damasco que recorre toda la superficie.
item_Desc_cds_combat_superheavy_backpack_01_05_01=Tipo de artículo: Portador de munición\nCompatibilidad de núcleo: Media y pesada\nCapacidad de carga: 150K µSCU\n\nConstruido a medida para almacenar munición adicional para ametralladoras pesadas, este portador se conecta directamente a tu arma mediante una cinta de munición, garantizando un fuego continuo y prolongado sin interrupciones.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_cds_combat_superheavy_core_02_01_01,P=PH - Description for cds_combat_superheavy_core_02_01_01
item_Desc_cds_combat_superheavy_helmet_01_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nRedefine la protección personal con la serie BUL-H4. El hardware PROWL patentado de CDS combina la entrada de vídeo de las ranuras de visor cuádruple para crear una única señal, ofreciendo una visión sin obstáculos sin comprometer la seguridad.
item_Desc_cds_combat_superheavy_helmet_01_01_02,P=PH - Description for cds_combat_superheavy_helmet_01_01_02
item_Desc_cds_combat_superheavy_helmet_01_03_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nRedefine la protección personal con la serie BUL-H4. El hardware PROWL patentado de CDS combina la entrada de vídeo de las ranuras de visor cuádruple para crear una única señal, ofreciendo una visión sin obstáculos sin comprometer la seguridad.\n\nCon un patrón de camuflaje digital blanco, la edición Snow Camo es perfecta para acechar a la presa en entornos helados.
item_Desc_cds_combat_superheavy_helmet_01_04_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nRedefine la protección personal con la serie BUL-H4. El hardware PROWL patentado de CDS combina la entrada de vídeo de las ranuras de visor cuádruple para crear una única señal, ofreciendo una visión sin obstáculos sin comprometer la seguridad.\n\nLa edición SteelTek presenta un reluciente revestimiento metálico con un patrón de Damasco que recorre toda la superficie.
item_Desc_cds_combat_superheavy_legs_02_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\n\nRedefine la protección personal con la serie BUL-H4. Gracias al uso de polímeros sintéticos avanzados, los impactos se mitigan de forma significativa, convirtiendo al usuario en un baluarte defensivo. El armazón asistido por energía de la armadura ayuda a mantener la movilidad, compensando el elevado peso del traje.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_cds_combat_superheavy_suit_01_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4.0 µSCU\n\nRedefine la protección personal con la serie BUL-H4. Utilizando polímeros sintéticos avanzados, los impactos se mitigan significativamente, transformando a quien la lleva en un baluarte defensivo. La estructura asistida por energía de la armadura ayuda a mantener la movilidad, compensando el peso considerable del traje.
item_Desc_cds_combat_superheavy_suit_01_03_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4.0 µSCU\n\nRedefine la protección personal con la serie BUL-H4. Utilizando polímeros sintéticos avanzados, los impactos se mitigan significativamente, transformando a quien la lleva en un baluarte defensivo. La estructura asistida por energía de la armadura ayuda a mantener la movilidad, compensando el peso considerable del traje.\n\nCon un patrón de camuflaje digital blanco, la edición Snow Camo es perfecta para acechar a la presa en entornos helados.
item_Desc_cds_combat_superheavy_suit_01_04_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4.0 µSCU\n\nRedefine la protección personal con la serie BUL-H4. Utilizando polímeros sintéticos avanzados, los impactos se mitigan significativamente, transformando a quien la lleva en un baluarte defensivo. La estructura asistida por energía de la armadura ayuda a mantener la movilidad, compensando el peso considerable del traje.\n\nLa edición SteelTek presenta un reluciente acabado plateado metálico con un patrón mercurial que recorre toda la superficie.
item_Desc_cds_combat_superheavy_suit_02_01_01=Tipo de artículo: Armadura superpesada\nReducción de daño: 90%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4.0 µSCU\n\nRedefine la protección personal con la serie BUL-H4. Gracias al uso de polímeros sintéticos avanzados, los impactos se mitigan de forma significativa, convirtiendo al usuario en un baluarte defensivo. El armazón asistido por energía de la armadura ayuda a mantener la movilidad, compensando el elevado peso del traje.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
item_Desc_cds_undersuit_armor_01_02_02=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nPurga de radiación: 81 REM/s\nTolerancia a fuerza G: +90%\n\nEl FBL-8u es el primer subtraje de CDS en utilizar la nueva tecnología de tejido orbicular del fabricante, que produce un material impresionantemente ligero pero resistente capaz de soportar los rigores del viaje espacial. Desarrollado originalmente para combinar a la perfección con la armadura ligera FBL-8a de CDS, sigue siendo compatible con otros conjuntos de armadura.\n\nPara honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind complementa el subtraje con una base azul marino adornada con elegantes detalles grises.
item_Desc_dmc_pants_04_defcon2956=0.4 kg\n\nCapacidad de carga: 3K µSCU\n \nSube la temperatura y celebra DefenseCon 2956 con estilo en estos pantalones cargo con detalles de llamas, fabricados en tejido de polímero con triple costura y cuatro bolsillos de fácil acceso.
item_Desc_dnn_shoes_03_02_01,P=PH
item_Desc_fta_medium_helmet_01_15_16,P=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -50 / 80 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\n\nFabricada para mineros pero lista para cualquier aventura, la armadura Strata de Greycat Industrial ofrece protección de primera y prestaciones prácticas. Cada pieza presenta un diseño angular y preciso para brindar cobertura donde más se necesita. Un cinturón de herramientas con prácticos bolsillos y una mochila reforzada ofrecen amplio almacenamiento. El galardonado diseño del casco presenta materiales de alta calidad y un sistema de filtración de aire de última generación que permite respirar limpio tanto en una mina profunda como en atmósferas hostiles. La edición Shubin fue creada específicamente para la compañía.\n\nPlACEHOLDER
item_Desc_hdtc_undersuit_01_01_02=Tipo de artículo: Subtraje\nReducción de daño: 5%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de depuración de radiación: 81 REM/s\nCapacidad de carga: 8.0 µSCU\n \nEl Lamont luce tan bien que no querrás llevar armadura encima. Combinando sin fisuras un blindaje ligero con tejidos sintéticos duraderos, el Lamont será tan cómodo en la cabina como elegante en las calles. Adopta un equipo de protección personal apto tanto para el trabajo como para el ocio, y obtén la ventaja Hardin Tactical.\n \nEl subtraje Xy'kara se inspira en la herencia milenaria de los Xi'an.\nTolerancia a fuerza G: +90%\n1 kg | Stun: 10%
item_Desc_kap_combat_heavy_arms_02_09_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -77 / 107 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 7.5 µSCU\n \nDe los maestros diseñadores de Kilgore & Poole llega la armadura pesada Monde. Integrando sin esfuerzo blindaje de triple laminado con la última tecnología defensiva, esta armadura proporciona protección lista para el combate con un sistema de comodidad de última generación y articulaciones flexibles especializadas.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -12.5%\n6 kg | Stun: 60% | Impacto: 35%
item_Desc_kap_combat_heavy_core_02_09_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -77 / 107 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 12.0 µSCU\nMochilas: Todas\n \nDe los maestros diseñadores de Kilgore & Poole llega la armadura pesada Monde. Integrando sin esfuerzo blindaje de triple laminado con la última tecnología defensiva, esta armadura proporciona protección lista para el combate con un sistema de comodidad de última generación y articulaciones flexibles especializadas.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -50%\n7 kg | Stun: 60% | Impacto: 35%
item_Desc_kap_combat_heavy_helmet_02_09_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -77 / 107 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\n \nDe los maestros diseñadores de Kilgore & Poole llega el casco Monde. Integrando sin esfuerzo blindaje de triple laminado con la última tecnología defensiva, esta armadura proporciona protección lista para el combate con un sistema de comodidad de última generación.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -12.5%\n5 kg | Stun: 60% | Impacto: 35%
item_Desc_kap_combat_heavy_legs_02_09_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -77 / 107 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 7.5 µSCU\n \nDe los maestros diseñadores de Kilgore & Poole llega la armadura pesada Monde. Integrando sin esfuerzo blindaje de triple laminado con la última tecnología defensiva, esta armadura proporciona protección lista para el combate con un sistema de comodidad de última generación y articulaciones flexibles especializadas.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\nTolerancia a fuerza G: -25%\n8 kg | Stun: 60% | Impacto: 35%
item_Desc_kap_combat_light_arms_04_01_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -35 / 65 °C\nProtección contra radiación: 26000 REM\nPurga de radiación: 145.8 REM/s\n\nUna síntesis ideal de fuerza y tecnología, la armadura Geist Stealth está fabricada con seda de carbono de grado militar procedente de los mismos fabricantes que protegen a las fuerzas especiales de la UEE. Filamentos tan finos como cabellos tejidos en la tela ocultan las emisiones del portador, haciéndolo indetectable por radar, y la tubería especializada incorporada en las suelas de las botas amortigua el sonido de los pasos.\n\nLa edición Stronghold presenta la fiera simbología de la banda Nine Tails con acentos rosa neón intensos.
