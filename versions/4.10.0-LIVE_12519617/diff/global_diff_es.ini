vehicle_DescAEGS_Tiburon,P=Fabricante: Aegis Dynamics\nEnfoque: Cañonera pesada\n\nUna evolución de un diseño Aegis ya probado, la configuración anticapital del Tiburon se compone de un arma de rayo montada en la espina y orientada hacia delante, complementada por torretas montadas a los lados.
vehicle_DescANVL_Odin=Fabricante: Anvil Aerospace\nEnfoque: Nave capital\n \nCon suficiente poder de fuego como para sacudir los cielos, el crucero de batalla Odin de Anvil Aerospace está tan en su elemento defendiendo a un grupo de combate de naves capitales hostiles como persiguiendo misiones de múltiples facetas operando en solitario. Blandiendo un formidable conjunto de armamento, el Odin destaca en maniobras ofensivas, lo que lo convierte en una poderosa adición para cualquier flota.\n
vehicle_DescARGO_Mole_Battaglia=Fabricante: Argo Astronautics\nEnfoque: Minería media\n\nEl icónico extractor láser para múltiples operadores de Argo, más comúnmente conocido como el MOLE, te permite trabajar más rápido y de forma más eficiente que nunca gracias a su sistema de minería trilateral patentado. Sus tres estaciones de extracción articuladas y controladas de manera independiente permiten una potencia máxima y una versatilidad casi ilimitada. El MOLE vive según el dicho «muchas manos hacen el trabajo ligero».\n\nEste MOLE muestra tu apoyo a la causa de la People's Alliance de construir un futuro mejor en Nyx, con una librea única y piezas reutilizadas.
vehicle_DescDRAK_Clipper_Collector_Military=Fabricante: Drake Interplanetary\nEnfoque: Generalista\n \nSi hay algo que todo capitán debe grabarse a fuego mientras se prepara para surcar las estrellas es "espera lo inesperado". Con una bodega de carga, instalaciones médicas y capacidades de fabricación, además de la sensibilidad práctica del diseño de Drake, la Clipper es la todoterreno perfecta para cualquier nueva empresa espacial.\n\nWikelo aquí. Hice modificaciones útiles para hacer nave mucho más como caza. Muy impresionante.
vehicle_DescDRAK_Command_Module=Fabricante: Drake Interplanetary\nEnfoque: Logística\n\nIncluso los capitanes más experimentados saben cuándo el mejor curso de acción es asumir las pérdidas y vivir para luchar otro día. Con este módulo de mando desmontable, Drake se ha asegurado de que los operadores cautelosos puedan extraerse del cuerpo principal de la nave y hacer una salida apresurada con facilidad, si surge la necesidad.
vehicle_DescDRAK_Golem_Battaglia=Fabricante: Drake Interplanetary\nEnfoque: Inicial / Minería ligera\n\nCon la Golem, Drake diseñó la nave ideal para quienes desean iniciar una carrera en la minería. La nave cuenta con un láser de minería personalizado y la capacidad de transportar 32 SCU de valiosos recursos. Fiel al estilo clásico de Drake, la Golem es una nave diseñada con un propósito claro, priorizando la funcionalidad sobre los adornos.\n\nEsta Golem muestra tu apoyo a la causa de la People's Alliance de construir un futuro mejor en Nyx, con una librea única y piezas reutilizadas.
vehicle_DescDRAK_Pitbull,P=Fabricante: Drake Interplanetary\nEnfoque: Caza de corto alcance\n\nUna máquina de combate ágil y feroz. La Pitbull combina maniobrabilidad a alta velocidad con potencia de fuego pura para ofrecerte un coloso contundente, todo ello en un paquete pequeño y monoplaza.
vehicle_DescGAMA_Tyilui=Fabricante: Gatac Manufacture\nEnfoque: Combate\n\nFiel a la naturaleza de los Xi'an, la Tyilui lleva la innovación al siguiente nivel con la nave más ambiciosa de Gatac hasta la fecha. Además de albergar varias torretas, el hangar orientado hacia popa de este miniportanaves es capaz de alojar múltiples naves de corto alcance, lo que proporciona una mayor flexibilidad operativa en escenarios de combate y más allá.
vehicle_DescGLSN_Basher=Fabricante: Desconocido
vehicle_DescKRIG_L22_Alpha_Wolf_Collector_Military=Fabricante: Kruger Intergalactic\nEnfoque: Caza ligero\n\nConoce una nave casi 400 años en gestación, y bien merecedora de la espera. Kruger Intergalactic está emocionado de presentar su primera nave fabricada de forma independiente, el Wolf. Combinando velocidad, estilo y un diseño impecablemente preciso, el L-22 Alpha Wolf no solo es un escaparate para Kruger, sino que está listo para el combate, ya sea cazando solo o en manada con un poderoso conjunto de armamento, incluidos dos repetidores láser S4 a medida.\n\nWikelo aquí. Hechas modificaciones útiles para hacer nave mucho más como caza. Muy impresionante.
vehicle_DescMISC_Prospector_Battaglia=Fabricante: MISC\nEnfoque: Minería ligera\n\nDurante años, la Prospector ha sido la nave de minería preferida del universo para los operadores en solitario. Con el característico diseño estilizado de MISC y un conjunto de avanzadas herramientas de minería mejoradas, la Prospector 2947 equilibra a la perfección forma y funcionalidad.\n\nEsta Prospector muestra tu apoyo a la causa de la People's Alliance de construir un futuro mejor en Nyx, con una librea única y piezas reutilizadas.
vehicle_DescMISC_Starlite=Fabricante: MISC\nEnfoque: Repostaje ligero\n\nSi hay una constante en el universo, es que las naves acabarán quedándose sin combustible. Ahí es donde entra la Starlite. Con dos depósitos de combustible estándar y un diseño elegante y reducido, la Starlite ha sido meticulosamente elaborada por los ingenieros de MISC para ofrecer servicios de repostaje a las naves que lo necesiten estén donde estén.
vehicle_DescORIG_M80=Fabricante: Origin Jumpworks\nEnfoque: Caza pesado\n\nAdopta la elegancia sin renunciar a la defensa con la M80. Con el famoso diseño elegante y sofisticado de Origin, el casco de la nave esconde con astucia un agresivo sistema de armas que puede desplegarse y desatarse sobre los atacantes en un instante.
vehicle_DescVNCL_Mauler=Fabricante: Vanduul Clans\nEnfoque: Destructor\n\nEl Mauler es una enorme nave de escolta esencial para la flota Vanduul. Este tanque de nave da a sus pilotos una probada de poder, con su diseño angular multinivel, su vasto despliegue de armamento y puntas afiladas en los costados tanto por aerodinámica como por factor intimidante.
