Highpoint_KillAnimals_Derelictoutpostscaves_Desc_E_001=Highpoint Wilderness Specialists\n\nLas poblaciones de fauna local cerca de las cuevas de los puestos abandonados en <EM4>~mission(Location|Address)</EM4> han crecido por encima de niveles sostenibles. Sacrifica el número indicado de criaturas y regresa para cobrar.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
Highpoint_KillAnimals_Derelictoutpostscaves_Desc_H_001=Highpoint Wilderness Specialists\n\nLa situación en <EM4>~mission(Location|Address)</EM4> se ha intensificado — los depredadores alfa dominan las cuevas y amenazan a los equipos de prospección. Necesitamos cazadores experimentados para devolver la población a niveles controlables.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
Highpoint_KillAnimals_Derelictoutpostscaves_Title_E_001=<EM4>*</EM4> Sacrificar Fauna en las Cuevas de Puestos Abandonados
Highpoint_KillAnimals_Derelictoutpostscaves_Title_H_001=<EM4>*</EM4> Sacrificio de Depredador Alfa en las Cuevas Abandonadas
Highpoint_KillAnimals_PAF_Valakkar_Fangs_desc=Colmillos trofeo cosechados de un espécimen Valakkar durante un contrato de sacrificio para la facción People's Alliance. Prueba de una caza exitosa.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
Highpoint_KillAnimals_PAF_Valakkar_Fangs_name=<EM4>*</EM4> Colmillos de Valakkar
Highpoint_KillAnimals_rockcracker_desc_E_001=\n<EM4>Posibles Planos</EM4>\n- R97 Escopeta\n- Brazos de la armadura Monde\n- Pechera de la armadura Monde\n- Piernas de la armadura Monde\n- Casco Monde\n- Brazos de la armadura Monde Hiro\n- Pechera de la armadura Monde Hiro\n- Piernas de la armadura Monde Hiro\n- Casco Monde Hiro\n- Escopeta R97 Cargador (18 cap)\n
Highpoint_KillAnimals_rockcracker_title_E_001=Reduce Valakkar Breaker Station Population <EM4>[BP]</EM4>
Highpoint_Killanimals_Derelictoutpostscaves_Desc_E_002=Highpoint Wilderness Specialists\n\nLas poblaciones de fauna local cerca de las cuevas de los puestos abandonados en <EM4>~mission(Location|Address)</EM4> han crecido por encima de niveles sostenibles. Sacrifica el número indicado de criaturas y regresa para cobrar.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
Highpoint_Killanimals_Derelictoutpostscaves_Desc_M_001=Highpoint Wilderness Specialists\n\nLa presión de fauna en las cuevas de puestos abandonados de <EM4>~mission(Location|Address)</EM4> ha alcanzado un nivel medio. Sacrifica la población objetivo para restaurar el equilibrio.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
Highpoint_Killanimals_Derelictoutpostscaves_Nearoutposts_Desc_E_001=Highpoint Wilderness Specialists\n\nLa actividad de fauna cerca de los puestos alrededor de <EM4>~mission(Location|Address)</EM4> está interfiriendo con las operaciones. Sacrifica el número indicado de criaturas.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
Highpoint_Killanimals_Derelictoutpostscaves_Nearoutposts_Desc_M_001=Highpoint Wilderness Specialists\n\nLa presión de fauna cerca de los puestos de <EM4>~mission(Location|Address)</EM4> requiere un esfuerzo de sacrificio sostenido.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
