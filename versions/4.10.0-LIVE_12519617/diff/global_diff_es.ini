item_DescStingray_Paint_golden_blue_black_stripes=Con líneas finas y fluidas que recuerdan a unas branquias, los azules y dorados de la Marina dan un aire acuático a la Stingray.
item_DescStingray_Paint_white_black_red=Blancos nítidos contrastan con un negro profundo en la pintura Protocol, rematada con un rojo llamativo que sigue los bordes suaves de la Stingray.
item_DescStingray_Paint_white_gray_blue_camo=La pintura Domain Camo combina varios tonos de gris en un patrón de camuflaje digital.
