item_desc_FLBL_ANVL_Asgard_Handling=Fabricante: Broad & Rabiee\nTipo: Flight Blade\n\nLibera el potencial de tu Anvil Asgard con la Flight Blade PHB de Broad & Rabiee. Al reasignar los recursos de empuje frontal, tu nave ofrecerá un manejo de precisión mejorado durante maniobras cerradas.
