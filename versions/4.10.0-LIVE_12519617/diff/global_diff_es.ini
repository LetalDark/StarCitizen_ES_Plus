Adagio_RepUI_Description=Fundada por personal de logistica naval retirado, Adagio tuvo exito apoyando el voraz apetito de recursos del complejo militar-industrial de la era Messer a traves de sus operaciones de salvamento. Despues del fin del regimen de Messer, Adagio, como muchos otros contratistas militares, perdio su contrato y la empresa se vio obligada a buscar nuevas fuentes de ingresos. En última instancia, esto llevo a Adagio a comenzar a revender los derechos de salvamento que habian adquirido a capitanes independientes y otras empresas de diversos tamaños.
BHG_Certification_Easy_Desc=Bounty Hunters Guild\n\nTu objetivo de certificación de nivel aprendiz ha aparecido en <EM4>~mission(Location|Address)</EM4>. Elimina al blanco para avanzar en tu reputación dentro del Gremio. Se aplican los términos de pago estándar; bonificación por trabajo limpio.\n\n[<EM4>*</EM4> Traducción provisional StarCitizen_ES_Plus — CIG aún no ha publicado el texto oficial de este contrato.]
