bounty_desc_first=En un esfuerzo por aumentar la seguridad de Crusader y sus alrededores, Crusader Security está buscando personas cualificadas para ayudar con la resolución de recompensas en la zona. Hemos evaluado que posees el conjunto de habilidades necesario y, como tal, nos gustaría ofrecerte un contrato de recompensa. Tras la resolución satisfactoria de este contrato, serás incluido en la lista de Operadores Autorizados de Crusader y serás referido activamente a los numerosos contratistas de seguridad en la zona para cualquier trabajo futuro de resolución de recompensas que esté disponible.
