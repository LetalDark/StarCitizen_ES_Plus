blacJac_bounty_desc_intro_001=ATENCIÓN: Cazarrecompensas\n\nUn individuo conocido como ~mission(TargetName) ha estado causando problemas a la buena gente de ArcCorp. \n\nTodo nuestro personal regular está ocupado ocupándose de problemas más serios, así que BlacJac está buscando reclutar nuevos talentos de cazarrecompensas.\n \nSi estás interesado, ve localiza y arresta a ~mission(TargetName|Last). ~mission(Contractor|BountyTimed)~mission(Danger)\n\nLogra esto y BlacJac estará muy agradecido.\n\nGracias,\nGloria Mesa\n\nSupervisor de Contratos Privados\nBlacJac Security, "Protección Brindada"
