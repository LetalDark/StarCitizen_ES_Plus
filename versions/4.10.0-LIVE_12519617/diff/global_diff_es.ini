DefenseCon_2956_125a_SlateCamo_Desc=Fabricante: Origin Jumpworks\nEnfoque: Caza ligero\n\nLos riesgos están hechos para tomarse, pero ¿por qué arriesgarse a quedarse sin combustible en plena batalla? Con el sistema de combustible AIR, un paquete de armas mejorado y todo el lujo y refinamiento que esperas de Origin Jumpworks, el 125a ha sido diseñado para el inconformista exigente.\n\nCon el elegante revestimiento Slate Camo en negro, mantendrás el factor sorpresa sin renunciar al estilo.
DefenseCon_2956_Asgard_SkyForge_Desc=Fabricante: Anvil Aerospace\nEnfoque: Nave de asalto\n \nA medida que las batallas de hoy siguen creciendo en escala y complejidad, Anvil Aerospace entiende el impacto que un solo vehículo puede tener en el desenlace. Te presentamos el Asgard. La próxima generación en transporte de vehículos terrestres, el Anvil Asgard cuenta con una rampa de carga rápida, una bodega de tamaño considerable para almacenar de forma segura el vehículo de asalto que elijas, y un imponente arsenal armamentístico para garantizar el acceso incluso a las zonas de aterrizaje más hostiles.\n\nPrincipalmente azul, el revestimiento Sky Forge para el Asgard también presenta acentos en negro y rojo.
DefenseCon_2956_Aurora_MK2_Cloudbuster_Desc=Fabricante: Roberts Space Industries\nEnfoque: Inicial / Carga ligera\n \nUna nueva versión de la nave clásica, Roberts Space Industries ha reimaginado la fiable Aurora desde los puntales hacia arriba. Te presentamos la Aurora Mk II. El rendimiento, la usabilidad y el estilo de la nave han sido renovados para una nueva generación de pilotos. Esta última versión introduce módulos intercambiables en la Aurora. En lugar de encerrar a los pilotos en una única trayectoria profesional, estos módulos permiten una especialización operativa sencilla desde la comodidad de tu hangar. Ahora incluye el Módulo DM, que RSI diseñó para incrementar las capacidades de combate de la Aurora Mk II. El Módulo DM opcional se exhibe aquí.\n\nEl revestimiento Cloudbuster utiliza un gris pálido contrastado con un azul intenso, rematado con vivos detalles amarillos.
DefenseCon_2956_Buccaneer_Stormbringer_Desc=Fabricante: Drake Interplanetary\nEnfoque: Caza ligero\n\nLa Buccaneer ha sido diseñada desde cero para volar y luchar como tú vives. Aquí no hay interiores de cuero ni hiperalmohadas: la Bucc es una chatarrera diseñada para maniobrar y luchar por encima de su categoría de peso. Esta turbulenta caza fronteriza se puede mantener en las peores condiciones para mantener con vida a tripulaciones espaciales reales y en funcionamiento.\n\nMezclando azul y negro con detalles en blanco, el esquema de pintura Stormbringer le da a la nave una nueva apariencia eléctrica.
DefenseCon_2956_C8R_Pisces_Heartbeat_Desc=Fabricante: Anvil Aerospace\nEnfoque: Exploración / Explorador\n\nCon su estructura compacta, ágil maniobrabilidad y asientos para tres personas, la nave de corto alcance C8R Pisces, incluida con cada Carrack, está construida por Anvil Aerospace para operaciones de rescate médico gracias a su cama médica de Nivel 3.\n\nUn intenso color base rojo y vivos detalles en amarillo neón hacen que el revestimiento Heartbeat para la C8 Pisces sea fácil de identificar a distancia durante las operaciones de rescate.
DefenseCon_2956_Clipper_Basalt_Desc=Fabricante: Drake Interplanetary\nEnfoque: Generalista\n \nSi hay algo que todo capitán debe tener muy presente al prepararse para viajar entre las estrellas es “esperar lo inesperado”. Con una bodega de carga, instalaciones médicas y capacidades de fabricación, junto con la sensata filosofía de diseño de Drake, la Clipper es la nave perfecta y completa para cualquier nueva iniciativa espacial.\n\nPredominantemente negra, la pintura Basalt añade detalles en rojo y crema a la Clipper.
DefenseCon_2956_Corsair_Eternity_Desc=Fabricante: Drake Interplanetary\nEnfoque: Expedición\n\nEscucha el llamado del espacio inexplorado y aprovecha el espíritu de la exploración con la Drake Corsair. Utilizando un diseño único de casco asimétrico, esta exploradora versátil puede ir a donde sea que los vientos de la aventura te lleven.\n\nFúndete con la oscuridad del espacio gracias al revestimiento Eternity para la Corsair, en negro con sutiles acentos en rojo.
DefenseCon_2956_Cutlass_Steel_Coalfire_Desc=Fabricante: Drake Interplanetary\nEnfoque: Caza medio / Transporte de tropas medio\n\nCon la Cutlass Steel, Drake Interplanetary ha vuelto a reinventar su diseño clásico para crear una nave de transporte de combate de nueva generación mediante la adición de asientos plegables dedicados y un arsenal ampliado. Es un verso peligroso ahí fuera, y la Cutlass Steel está lista para abrirse camino a través de cualquier obstáculo que se interponga en tu camino y el de tu dedicado equipo. \n\nMantén tu Cutlass con un aspecto impecable con el revestimiento Coalfire, principalmente gris con detalles en rojo.
DefenseCon_2956_Cutter_Caiman_Desc=Fabricante: Drake Interplanetary\nEnfoque: Inicial / Explorador\n\nDiseñada para personas trabajadoras de todo tipo, la Cutter incluye 4 SCU de espacio de carga y un montón de pegada en un marco compacto y resistente. Es una nave que verdaderamente encarna el espíritu de Drake: que no importa quién seas o qué hagas, puedes alcanzar las estrellas.\n\nVerde y blanca con detalles en naranja, el revestimiento Caiman aporta a la Cutter un aspecto distintivo y llamativo.
DefenseCon_2956_Cyclone_MT_Timberline_Desc=Fabricante: Tumbril Land Systems \nEnfoque: Antiaéreo\n\nSiguiendo el éxito del lanzamiento inicial del Cyclone, Tumbril ha tenido en cuenta tus comentarios y ha expandido su popular línea de vehículos tácticos con el totalmente nuevo Cyclone MT. Equipado con una combinación de torreta de cañón y misiles, este módulo ofrece opciones de combate aumentadas en el campo.\n\nPersonaliza tu Cyclone con el revestimiento Timberline, en verde oliva con acentos en naranja.
DefenseCon_2956_DragonflyBlack_Coalfire_Desc=Fabricante: Drake Interplanetary\nEnfoque: Carreras\n\nLa Drake Dragonfly es la nave auxiliar perfecta para cualquiera que quiera vivir al límite. Sin nada que separe al piloto de los peligros del espacio, la Dragonfly es tanto una aventura como una nave. Su conversión de doble modo le permite operar en tierra o en el espacio, y su asiento trasero orientado hacia atrás te deja llevar a un pasajero.\n\nMantén tu Dragonfly con un aspecto impecable con el revestimiento Coalfire, principalmente gris con detalles en rojo.
DefenseCon_2956_Eclipse_Ambush_Desc=Fabricante: Aegis Dynamics\nEnfoque: Bombardero sigiloso\n\nEl Aegis Eclipse es un bombardero diseñado para entrar y atacar antes de que sea detectado. Después de un extenso servicio en la UEE, este equipo militar de alta tecnología hizo su debut en el mercado civil en 2947.\n\nHaz que el Eclipse sea aún más difícil de detectar con el revestimiento Ambush Camo, que presenta un patrón de camuflaje que ayuda a romper la percepción visual.
DefenseCon_2956_F7C-M_SuperHornet_MK2_Tigerveil_Desc=Fabricante: Anvil Aerospace\nEnfoque: Caza medio\n \nPerfeccionando su renombrado caza de superioridad militar con la tecnología más actual, Anvil Aerospace ha diseñado la F7C-M Super Hornet Mk II, manteniendo el segundo asiento y la torreta esférica que hicieron del original un adversario verdaderamente temible.\n\nLa dinámica Hornet Mk II merece un revestimiento a su altura. El revestimiento Tigerveil combina un azul acerado con vibrantes acentos naranjas y sutiles detalles en negro.
DefenseCon_2956_F8C_Lightning_Stormfire_Desc=Fabricante: Anvil Aerospace \nEnfoque: Caza pesado\n\nPocas naves empleadas por los orgullosos hombres y mujeres que sirven en la Marina de nuestro Imperio inspiran tanto respeto como la legendaria F8 Lightning. Una fuerza temible, la F8 ha protegido la libertad de la Humanidad incontables veces frente a numerosas amenazas dentro y fuera del país. Ahora, ese mismo caza de superioridad espacial de próxima generación está disponible para formar parte de tu flota personal con la variante civil Anvil F8C.\n\nDibuja una silueta clásica en cualquier campo de batalla con el revestimiento Stormfire para la nueva F8C Lightning de Anvil. Con un triple recubrimiento de pintura Kalding apto para una gran variedad de atmósferas y condiciones, este elegante acabado platino mantendrá tu nave con un aspecto impecable durante años.
DefenseCon_2956_Fury_MX_Templar_Desc=Fabricante: Mirai\nEnfoque: Caza de corto alcance\n\nCon la mejor maniobrabilidad de su clase y tecnología Xi'an de vanguardia totalmente integrada, el caza de corto alcance Fury MX de próxima generación de Mirai utiliza sus veinte misiles montados en halo para devastar objetivos durante el combate espacial de corto alcance.\n\nMirai diseñó el revestimiento Templar en un blanco intenso con acentos en rojo y negro para dar a la Fury un aspecto digno de las nubes.
DefenseCon_2956_Guardian_MX_Vector_Desc=Fabricante: Mirai\nEnfoque: Caza pesado\n\nPartiendo de la estructura del caza Guardian y añadiendo aún más opciones ofensivas, la Mirai Guardian MX incorpora potencia de fuego adicional y blindaje ideal para abrumar a los oponentes. Aunque no es tan ágil como la Guardian base, este caza pesado sigue siendo más maniobrable que muchas otras naves de su clase.\n\nEl contraste de blancos, rojos y negros crea un diseño anguloso y llamativo en el revestimiento Vector.
DefenseCon_2956_Ironclad_Assault_XXXXX_Desc=Fabricante: Drake Interplanetary\nEnfoque: Nave de asalto\n \nCuando la entrega especial que tienes que hacer es una incursión a gran escala, necesitas el Drake Ironclad Assault. No solo puede albergar varios vehículos terrestres en su compartimento, sino que tiene torretas a lo largo de su parte inferior para despejar el camino para el aterrizaje, e incluso una bahía de fabricación para reparaciones de emergencia.
DefenseCon_2956_Kraken_Desc=Fabricante: Drake Interplanetary\nEnfoque: Portanaves ligero\n\nLa Kraken es un protector y un faro de libertad en un universo a menudo cruel. Para aquellos encargados de salvaguardar a los ciudadanos que no pueden protegerse a sí mismos, la Kraken es a la vez un santuario y una máquina de guerra autónoma lista para enfrentarse a los adversarios más intimidantes. Drake ha descartado el libro de reglas para redefinir las naves de clase capital de uso privado, los portanaves de ataque y la naturaleza misma de la libertad personal. No es más que un testimonio del empoderamiento del pueblo.\n\nLa Kraken se desatará en 2957...
DefenseCon_2956_L-21_Wolf_Rosso_Desc=Fabricante: Kruger Intergalactic\nEnfoque: Caza ligero\n\nConoce una nave fruto de casi 400 años de desarrollo, y que ha valido la espera. Kruger Intergalactic presenta con orgullo su primera nave fabricada de manera independiente, la Wolf. Combinando velocidad, estilo y un diseño impecablemente preciso, la L-21 Wolf no solo es una demostración del talento de Kruger, sino que está lista para el combate, capaz de cazar sola o en manada gracias a su potente arsenal, que incluye dos ametralladoras balísticas S4 personalizadas.\n\nDestaca con fuerza gracias al rojo intenso del revestimiento Rosso y asegúrate de que todos aprecien la belleza única de la Kruger Wolf.
DefenseCon_2956_L-22_AlphaWolf_Antilles_Desc=Fabricante: Kruger Intergalactic\nEnfoque: Caza ligero\n\nConoce una nave fruto de casi 400 años de desarrollo, y que ha valido la espera. Kruger Intergalactic presenta con orgullo su primera nave fabricada de manera independiente, la Wolf. Combinando velocidad, estilo y un diseño impecablemente preciso, la L-22 Alpha Wolf no solo es una demostración del talento de Kruger, sino que está lista para el combate, capaz de cazar sola o en manada gracias a su potente arsenal, que incluye dos repetidoras láser S4 personalizadas.\n\nEl revestimiento Antilles para la Wolf presenta una vibrante pintura base de azul eléctrico y una sección de cola en rojo intenso.
DefenseCon_2956_M80_XXXXX_Desc=Fabricante: Origin Jumpworks\nEnfoque: Caza pesado\n\nAdopta la elegancia sin renunciar a la defensa con la M80. Con el famoso diseño elegante y sofisticado de Origin, el casco de la nave esconde con astucia un agresivo sistema de armas que puede desplegarse y desatarse sobre los atacantes en un instante.\n\nEl negro envuelve la mayor parte del revestimiento Afterglow, mientras que las líneas de acento en naranja aportan un toque de color.
DefenseCon_2956_MDC_Baracus_Desc=Fabricante: Greycat Industrial\nEnfoque: Antiaéreo\n \nA partir de un armazón industrial robusto y resistente, Greycat ha creado el MDC Mobile Defense Center, un vehículo de combate eficaz listo para proteger tus intereses, desde zonas mineras remotas hasta patrullas en centros de procesamiento de alto valor, gracias a su torreta PDS montada. \n\nLos llamativos detalles rojos aportan color y rompen la base negra de la pintura MTC Baracus, que también puede aplicarse a otros vehículos de la serie M de Greycat.
DefenseCon_2956_MTC_Filament_Desc=Fabricante: Greycat Industrial\nEnfoque: Explorador\n\nComo experto en operaciones industriales, Greycat entiende que la seguridad en el lugar de trabajo es una parte vital de cualquier empresa exitosa. Para ser plenamente efectivo, necesitas poder transportar a tu personal de seguridad y su equipo a donde más se les necesita. Por eso, el MTC Mobile Tactical Center es una adición tan importante para tu próximo proyecto. Lo suficientemente ágil para acceder al terreno difícil que se encuentra en operaciones remotas y equipado con suficientes casilleros para trajes, estantes para armas y almacenamiento para enfrentar una amplia gama de problemas, el Greycat MTC podría marcar la diferencia a la hora de convertir un problema potencial en una ganancia potencial.\n\nEquipa la pintura Filament para dar al MTC un acabado gris con detalles en negro y amarillo. También es compatible con otros vehículos de la serie M de Greycat.
DefenseCon_2956_Meteor_LaserWeapon_Shimmer_Desc=Fabricante: RSI\nEnfoque: Caza medio\n\nCon un impresionante poder de fuego, la Meteor es una visión que ningún enemigo quiere tener frente a sí. Inspirada en la icónica Mantis, este caza pesado prescinde de la interdicción cuántica y en su lugar cuenta con dos cañones balísticos S5 hechos a medida y cuatro lanzadores de misiles S4 de carga individual; haciendo de la Meteor una fuerza capaz de iluminar el cielo como una estrella fugaz. El repetidor láser Echion opcional se exhibe aquí.\n\nEl llamativo revestimiento Shimmer aporta un hermoso lustre a la Meteor con una pintura que cambia entre dorado y azul oscuro según la iluminación y el ángulo de visión.
DefenseCon_2956_Mule_Reburn_Desc=Fabricante: Drake Interplanetary\nEnfoque: Carga ligera\n\nEl Mule de seis ruedas de Drake es un caballo de batalla fiable para todo tipo de trabajos de carga y transporte. Ya sea transportando mercancías a través de terrenos accidentados o trasladándolas a naves más grandes y cubiertas de carga, el Mule lleva a cabo incluso los contratos más duros hasta el final. Simple y directo.\n\n¿Quién dice que no puedes divertirte un poco mientras trabajas? El revestimiento Reburn para el Drake Mule aporta un tinte rojo al cristal de la cabina y a la cubierta de carga.
DefenseCon_2956_Nova_EmberStorm_Desc=Fabricante: Tumbril Land Systems\nEnfoque: Tanque pesado\n\nEl nuevo Nova de Tumbril es un guerrero de campo de batalla clásico, reinventado para la era moderna. Este tanque pesado ofrece una combinación devastadora de armamento para eliminar amenazas en tierra y en el aire.\n\nCon un esquema de pintura camuflado en tonos tierra, rojo y negro ideal para entornos desérticos, el revestimiento Nova Ember Storm ofrece una combinación devastadora de armamento para eliminar amenazas en tierra y en el aire.
DefenseCon_2956_Perseus_Flintlock_Desc=Fabricante: RSI\nEnfoque: Cañonera pesada\n\nCuando RSI se propuso hacer la declaración moderna definitiva en prevención persuasiva, miraron hacia su propio pasado, a las históricas cañoneras designadas Perseus. Capaz de destrozar goliats de clase subcapital, la mera presencia de una cañonera Perseus en un escuadrón de bloqueo o patrulla es suficiente para hacer que tus enemigos más agresivos se lo piensen dos veces antes de atacar, al igual que su homónimo clásico.\n\nAcentúa el fuerte y anguloso diseño de la Perseus con el revestimiento Flintlock. Una sección blanca distintiva atraviesa el centro de la nave, separando la afilada mitad delantera de la oscura y amenazadora parte trasera.
DefenseCon_2956_Pitbull_XXXXX_Desc=Fabricante: Drake Interplanetary\nEnfoque: Caza de corto alcance\n\nUna máquina de combate ágil y feroz. La Pitbull combina maniobrabilidad a alta velocidad con potencia de fuego pura para ofrecerte un coloso contundente, todo ello en un paquete pequeño y monoplaza.\n\nCuando quieres que te vean venir, el revestimiento Hardstrike es una atrevida explosión de amarillo que hace que cada combate sea aún más vibrante.
DefenseCon_2956_Pulse_StarKitten_Desc=Fabricante: Mirai\nEnfoque: Combate\n \nLos ingenieros de Mirai se propusieron diseñar una moto con dosel abierto capaz de más. Una conexión más íntima entre el piloto y el rendimiento con una silueta ceñida. Una forma más intuitiva de domar paisajes formidables con un sistema grav-lev receptivo. Una experiencia de combate más inteligente con un arma personalizada totalmente integrada en el espíritu del vehículo. ¿El resultado final? El Mirai Pulse.\n\nEncarna el espíritu de carreras de Sally la Gatita Estrella con esta pintura personalizada para el Mirai Pulse. Combinando los brillantes tonos de rosa y azul claro del querido personaje de dibujos animados, los adhesivos sonrientes de esta pintura aportan un toque juguetón que tus competidores seguramente disfrutarán.
DefenseCon_2956_STV_BlueSteel_Desc=Fabricante: Greycat Industrial\nEnfoque: Pasajero\n\nPrepárate para divertirte de verdad en el trabajo con el STV de Greycat. Este vehículo deportivo todoterreno ha sido construido por profesionales para profesionales y ofrece una velocidad asombrosa y almacenamiento integrado muy práctico.\n\nLas aventuras terrestres nunca lucieron tan bien como con el revestimiento Blue Steel, que otorga al STV un acabado plateado elegante con bordes azules vibrantes.
DefenseCon_2956_Shiv_Nightmare_Desc=Fabricante: Desconocido\nEnfoque: Caza pesado\n\nConstruido de manera rudimentaria a partir de una amalgama de piezas de diversas naves espaciales, este brutal caza está hecho para sobrevivir a las duras realidades del espacio sin reclamar, demostrando que no es la marca de tu nave lo que importa, sino lo que haces con ella. \n\nCon una siniestra calavera sobre una pintura base marrón, el revestimiento Nightmare le da a la Shiv un aspecto que pone los pelos de punta.
DefenseCon_2956_Starfighter_inferno_Polar_Desc=Fabricante: Crusader Industries\nEnfoque: Caza pesado\n\nYa sea liderando una tripulación o cazando grandes naves en solitario, el Ares Inferno es una fuerza a tener en cuenta. Esta variante balística equipada con Gatling atraviesa el blindaje de las cañoneras y convierte a los cazas más pequeños en polvo en segundos.\n\nModifica tu Ares Star Fighter con este revestimiento Polar Camo en blanco y gris.
DefenseCon_2956_Starlite_XXXXX_Desc=Fabricante: MISC\nEnfoque: Repostaje ligero\n\nSi hay una constante en el universo, es que las naves acabarán quedándose sin combustible. Ahí es donde entra la Starlite. Con dos depósitos de combustible estándar y un diseño elegante y reducido, la Starlite ha sido meticulosamente elaborada por los ingenieros de MISC para ofrecer servicios de repostaje a las naves que lo necesiten estén donde estén.
DefenseCon_2956_Storm_AA_Darkside_Desc=Fabricante: Tumbril Land Systems\nEnfoque: Tanque ligero\n\nIntroducido originalmente en 2606 durante la Segunda Guerra Tevarin, el minitanque de un solo operador Tumbril Storm fue construido para arrasar campos de batalla y eliminar la artillería enemiga. Reinventado desde cero para ser más rápido, más fuerte y más impactante que nunca, el Storm AA es una verdadera fuerza de la naturaleza, equipado con una lluvia de misiles para proporcionar cobertura contra objetivos aéreos y terrestres.\n\nEl revestimiento Darkside aporta al Storm un patrón de camuflaje en negro y gris que lo hace difícil de ver en situaciones de poca luz.
DefenseCon_2956_Tiburon_XXXXX_Desc=Fabricante: Aegis Dynamics\nEnfoque: Cañonera pesada\n\nUna evolución de un diseño Aegis ya probado, la configuración anticapital del Tiburon se compone de un arma de rayo montada en la espina y orientada hacia delante, complementada por torretas montadas a los lados.\n \nCombinando tonos de gris, blanco y plata, el revestimiento Enforcer enfatiza la robustez del Tiburon con su apariencia estratificada.\n
DefenseCon_ArmorDisplay_Anvil=Encumbrado como uno de los fabricantes de equipamiento militar más confiables de la UEE durante los últimos dos siglos, su claridad de visión y calidad inigualable han dejado una huella imborrable en la historia de la Humanidad.
DefenseCon_ArmorDisplay_Drake=Con un apasionado séquito de pilotos leales que adoran su enfoque sin rodeos hacia las naves espaciales, este fabricante a veces controvertido continúa desafiando las expectativas.
DefenseCon_ArmorDisplay_Kruger=Lo que comenzó como un renombrado fabricante de piezas de precisión ha crecido hasta convertirse en el creador de naves espaciales elegantemente diseñadas y meticulosamente elaboradas.
DefenseCon_ArmorDisplay_MurrayCup=Sin lugar a dudas la principal liga de carreras del imperio, ha convertido en nombres conocidos a pilotos hábiles que arrancan rápido en la línea de salida, dominan con destreza las curvas cerradas y están dispuestos a superar todos los límites.
DefenseCon_DisplayOnly_Sign,P=Solo para exposición
DefenseCon_OutlawDisplay_NineTails_Desc=A pesar de su creciente reputación, poco se conoce públicamente sobre la banda o su funcionamiento interno; lo que hace que el meteórico ascenso al poder del grupo resulte aún más preocupante para los expertos en crimen organizado. Hoy en día, la banda Nine Tails opera casi exclusivamente dentro del sistema Stanton, utilizando como cuartel general la infame estación espacial abandonada conocida entre los lugareños como ‘Grim HEX’.
DefenseCon_OutlawDisplay_NineTails_Title=Nine Tails
DefenseCon_OutlawDisplay_ShatteredBlade_Desc=Uno de los proveedores más significativos de tecnología alienígena del mercado negro, estos contrabandistas han ido aumentando las tensiones en Nyx gracias a sus métodos agresivos que han atraído la ira de los Vanduul e incrementado las incursiones por todo el sistema.
DefenseCon_OutlawDisplay_ShatteredBlade_Title=Shattered Blade
DefenseCon_OutlawDisplay_XenoThreat_Desc=Predicando una retórica violentamente anti-UEE y xenófoba, las fuerzas de XenoThreat han utilizado sus escondites en Pyro para lanzar docenas de ataques contra estructuras civiles y corporativas por todo el imperio en busca de su agenda supremacista humana.
DefenseCon_OutlawDisplay_XenoThreat_Title=XenoThreat
DefenseCon_VanduulDisplay_Desc=Esta agresiva especie alienígena, compuesta por clanes guerreros independientes, lleva siglos atormentando al imperio con sus brutales incursiones contra sistemas y asentamientos humanos. En 2945, las crecientes hostilidades tras la Batalla de Vega llevaron a la UEE a declarar formalmente la guerra contra estos crueles y sádicos invasores.
DefenseCon_VanduulDisplay_Title=Vanduul
Dlg_SC_bb_bb_factory_ANVL_systems_coolant_0890=Sistema de refrigeración
Dlg_SC_bb_bb_factory_ORIG_systems_coolant_0890=Sistema de refrigeración
Dlg_SC_bb_bb_factory_RSI_systems_coolant_0890=Sistema de refrigeración
Dusters_RepUI_Description=Una Banda criminal ubicada en el Sistema Stanton que se especializa en delitos relacionados con la minería, como robar a mineros y operar ilegalmente en ubicaciones mineras de otras personas.
Event_ShipTitle_Ironclad=La Ironclad
FTLCourier_RepUI_Area=UEE
FTLCourier_RepUI_Description=Especializada principalmente en la entrega de paquetes pequeños y portátiles, FTL se ha forjado una reputación como el servicio de mensajería n.º 1 del imperio. Como compañía, FTL está siempre buscando nuevas formas de garantizar que los envíos de los clientes lleguen a su destino más rápido y de manera más segura, asegurando que «cuando necesitas que te entreguen un paquete, nada es más rápido que la luz».
FTLCourier_RepUI_Focus=Servicios de mensajería
FTLCourier_RepUI_Founded=2865
FTLCourier_RepUI_Headquarters=Sherman, Castra II, sistema Castra
FTLCourier_RepUI_Leadership=Ignacio Slade, CEO
FTLCourier_RepUI_Name=FTL Courier
FW22_NT_Journal_Body_05=NOMBRE DEL CHAT:\nSuministros de grupos Pressley\n\nMIEMBROS DEL CHAT: \nRen\nACR1234\n\nACR1234 [12:24]: \naquí.\nACR1234 [12:24]: \n~mission(bargeCode)\n\nRen [12:26]: \nGracias por los códigos.\n\nACR1234 [12:30]: \n¿Como esta quedando por alli?\n\nRen [12:34]: \nYa esta todo listo. Espera que todo empiece según lo previsto.\n\nACR1234 [12:37]: \nBuena suerte.\n\nRen [12:39]: \n¿Quien necesita suerte? Esos IFFIs son unos componentes de tecnologicos impresionantes. Gracias por la transmision.\n\nACR1234 [12:43]: \nMe alegra que te gusten los nuevos juguetes. En cuanto a los negocios, ese paquete especial que prepare para ti debería funcionar perfectamente en su sistema.\n\nRen [12:46]: \nSin duda. Te avisare una vez que se complete la transferencia.
Factions_ClawSalamander_DisplayName=Claw Salamanders
Foxwell_DefendDestructibleEntites_E_Desc_001=¿Algún piloto disponible en la zona? Necesitamos protección en <EM4>~mission(Location|Address)</EM4> para un cliente. Una banda de forajidos lleva atacando sus <EM4>~mission(Objects)</EM4> y, si no se hace nada al respecto, van a causar daños serios. Necesitamos a alguien que proteja la propiedad del cliente lo máximo posible y se ocupe de esos matones.\n\nPor la información que hemos podido reunir, estos matones son de poca monta, pero pueden hacer pupa si no andas con ojo. Así que, si lo manejas según los estándares de Foxwell, ofrecemos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal. \n\nBuena suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n<EM4>Posibles Planos</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n
Foxwell_DefendDestructibleEntites_E_Title_001=<EM4>[BP]</EM4> Contrato nivel amarillo: Proteger ~mission(Objects)
Foxwell_DefendDestructibleEntites_H_Desc_001=Uno de nuestros clientes de alta prioridad está siendo atacado por una banda criminal que ataca sus <EM4>~mission(Objects)</EM4> en <EM4>~mission(Location|Address)</EM4>. Los activos del cliente son valiosos, así que tenemos que mantenerlos a salvo a toda costa, pero no te voy a engañar: va a ser un reto y medio con estos matones decididos a hacer daños serios. \n\nSi fuera yo, no dudaría en <EM>llevar refuerzos</EM4> para encargarme de ellos. No son ninguna broma, así que ofrecemos unos bien merecidos <EM4>~mission(ScripAmount) MG Scrip</EM4> al contratista principal que se encargue de estos tipos con éxito. \n\nMucha suerte,\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n<EM4>Posibles Planos</EM4>\n- Rifle de Asalto de Energía Parallax\n- Antium (Brazos)\n- Antium (Pecho)\n- Antium (Pantalones)\n- Antium (Casco)\n- Batería de rifle Parallax (80 Cap)\n
