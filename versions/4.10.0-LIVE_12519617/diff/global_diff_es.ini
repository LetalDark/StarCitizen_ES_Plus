vehicle_DescKRIG_S65_Stingray=Fabricante: Kruger Intergalactic\nEnfoque: Caza medio\n\nEstilizada, equilibrada y firme en su concepción, la S-65 Stingray es un caza medio que combina una gran maniobrabilidad sin renunciar a la pegada. Fiel al animal que le da nombre, la Stingray no es ajena al combate: entra en picado, castiga sin descanso y se retira, sin miedo a encajar algún golpe por el camino.
