ui_pregame_hangar_aeroview_history=Aeroview se enorgullece de ser el fabricante de hangares con mas trayectoria del espacio humano. Su experiencia se remonta a hace mas de 300 años. En el siglo XXVII, Arthur Nassir fundo la compañia en torno a un rigido código de etica empresarial centrado en la calidad del diseño, la dedicacion a la ergonomia y un respeto extremo con la confidencialidad del cliente. Aeroview tambien se reserva el derecho de rechazar el servicio a cualquier usuario que no sea ciudadano. Si bien el diseño y creacion de hangares no están tan relacionados con la pirateria espacial, el desden público de Nassir por quienes vuelan al margen de la ley propicio el código etico de la empresa. Cuando Shubin Interstellar adquirio Aeroview, las condiciones de venta incluian una clausula que obligaba a respetar este código a perpetuidad. \n\nAunque sus estatutos no hayan cambiado, el modelo de negocios original de Aeroview ya no es el mismo. Los hangares de Aeroview del siglo XXVIII eran construcciones palaciegas diseñadas a medida para que la elite pudiera disponer de sus propias naves espaciales. Durante los ultimos años, Aeroview ha adaptado sus tacticas para seguir los pasos de SELF-LAND (aunque jamas lo admitirian). En lugar de construir hangares personalizados de alta calidad, ahora ofrecen una linea de hangares modulares «para empresas», con un coste que solo pueden cubrir exitosos empresarios y ejecutivos de negocios. A diferencia de otras compañias, Aeroview no ofrece arrendamiento de las propiedades que albergan sus hangares; eso corre por cuenta del cliente. Sin embargo, los hangares de Aeroview pueden construirse en cualquier lugar del IUT con notificacion previa de 48 horas (o de 24 horas si se efectua el pago de una tarifa de construccion urgente). Cabe destacar que Aeroview ha logrado un gran exito en el desarrollo de hangares para unidades de gran tamaño o naves que requieran espacio adicional para su equipamiento de apoyo. Tanto los pilotos de naves Freelancer (en las que caben multiples personas) o de Hornets (que poseen armas y necesitan espacios de reparaciones mas complejos) suelen encontrar mas rentable la compra de un solo hangar de Aeroview que la de varios de SELF-LAND.
ui_pregame_hangar_revelyork_history=Cuando la empresa de ingenieria Revel & York se lanzo a diseñar su primer hangar hace unos treinta años, nadie los tomo en serio. La compañia, conocida por sus muebles costosos e incomodos, buscaba adentrarse en un terreno dominado por colosos del sector aeroespacial. Las criticas cesaron rapidamente cuando la linea de hangares de lujo de Revel & York se convirtio en el refugio habitual de las naves espaciales de los mas ricos y poderosos. Los gigantescos hangares de la empresa, construidos sobre zonas de aterrizaje idoneas en terrenos de gran valor, se ganaron su reputación como productos de excelencia y calidad.\n\nLos diseñadores de Revel & York trabajan codo a codo con los pilotos para desarrollar una experiencia inigualable. Es la unica empresa que construye hangares modulares diseñados para albergar naves espaciales de clase mercante, como la Constellation y la Caterpillar, por lo que ofrece un valioso servicio para un segmento pequeño de la poblacion. Los diseños de sus hangares se han ganado su reputación: ofrecen plataformas interconectadas con elevacion motorizada para que los pilotos puedan supervisar su nave desde arriba, asi como vehículos terrestrés diseñados especialmente para transportar tripulaciones entre modulos. Todo esta preparado para la comodidad y la productividad de los pilotos de elite. SELF-LAND y la competencia construyen estaciónamientos para naves, mientras que Revel & York ofrece experiencias estelares.
ui_pregame_hangar_vfgindustrial_history=Tom Vivien, Walter Fink y Ulla Gandil eran miembros del Cuerpo de Ingenieros del Ejercito de la UEE que se especializaban en construir rapidamente zonas de aterrizaje presurizadas en zonas de combate durante su servicio. Fundaron VFG Industrial poco despues de ser despedidos e intentaron llevar su experiencia al mercado civil. Con tantos grupos mineros y terraformadores por ahi, creian que habia una demanda de hangares funcionales y bien construidos en condiciones "no ideales". Tenian razon, los clientes llegaban en masa, hasta que el ejercito intento demandarlos por robo de patentes. La demanda afirmaba que todo el negocio de VFG se basaba en informes de diseño patentados escritos y propiedad del Ejercito. VFG intento prepararse para una larga pelea, pero pronto empezo a quedarse sin recursos. Con el congelamiento de su negocio, no entro mas dinero, pero los tres se negaron a dar marcha atras.\n\nCuando las cosas parecian mas sombrias, recibieron una especie de indulto. ArcCorp estaba muy interesado en sus metodos de construccion de hangares, especificamente para sus subsidiarias de minería y terraformación, pero tambien para comercializarlos masivamente al público. Los miembros de VFG estaban divididos. Fink se nego rotundamente a venderle a MegaCorp, pero los otros dos sabian que no tenian otra opcion. Los tres finalmente acordaron vender. Los abogados de ArcCorp se hicieron cargo de su defensa y en cuestion de semanas lograron utilizar algo de magia negra trastienda para paralizar el caso del Ejercito. Fink realizo una compra sustancial y dejo la empresa. Tom Vivien y Ulla Gandil tecnicamente todavía están en la junta directiva, pero el control de la empresa ha pasado a ArcCorp.
