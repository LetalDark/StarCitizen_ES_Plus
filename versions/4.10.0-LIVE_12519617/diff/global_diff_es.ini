ReccoBattaglia_RepUI_Description=La última de un largo linaje de mineros, Recco Battaglia continuó la tradición familiar hasta que un accidente en una excavación la dejó incapacitada para trabajar. Frustrada por el trato recibido tras el accidente bajo la burocracia de la UEE y los United Resource Workers, Recco se marchó a Nyx, donde ahora coordina las operaciones de los contratistas para la People's Alliance.
