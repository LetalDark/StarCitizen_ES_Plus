item_Desc_mrai_gloves_01_01_01,P=Los Guantes de Carreras Neutrino utilizan tejidos sintéticos procedentes de artesanos Xi'an para crear un cómodo par de guantes lo bastante resistentes como para soportar las exigencias de las carreras a alta velocidad. Inspirándose en la cultura y estética tradicional Saisei, el diseño de estos guantes de edición especial Mirai es llamativo pero elegante.
