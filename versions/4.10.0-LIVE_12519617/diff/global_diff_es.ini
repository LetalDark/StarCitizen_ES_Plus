item_Desc_slaver_combat_medium_legs_01_02_01=Tipo de artículo: Armadura media\nReducción de daño: 30%\nRango térmico: -60 / 90 °C\nProtección contra radiación: 26400 REM\nPurga de radiación: 145.8 REM/s\nCapacidad de carga: 4.0 µSCU\n\nEl DustUp te cubre las espaldas si buscas meterte en problemas. Su placa corporal se basa en el mismo subtraje de CDS que usan los Marines de la UEE, y añade piezas reconstruidas del Omni-Role mkII para brindarte una protección sólida frente al fuego entrante. Todo el conjunto también se ha probado razonablemente contra el vacío, así que puedes hacer AEV cuanto quieras sin preocuparte por morir.\n\nLa edición Ultimatum presenta la característica iconografía rosa neón de la banda Nine Tails.
item_Desc_slaver_undersuit_helmet_01=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de depuración de radiación: 81 REM/s\nTolerancia a fuerza G: -2.5%\n5 kg | Stun: 20% | Impacto: 10%\n\nLa serie Stoneskin de Kastak Arms se basa en el famoso sistema TCS-4 de CDS, partiendo de los exhaustivos comentarios de los operadores que dependen de esta tecnología sobre el terreno. El Stoneskin está destinado a rivalizar con la competencia como un casco resistente y fiable.
item_Desc_slaver_undersuit_helmet_02=Tipo de artículo: Casco de vuelo\nReducción de daño: 15%\nRango térmico: -30 / 60 °C\nProtección contra radiación: 15200 REM\nTasa de depuración de radiación: 81 REM/s\nTolerancia a fuerza G: -2.5%\n5 kg | Stun: 20% | Impacto: 10%\n\nLa serie Stoneskin de Kastak Arms se basa en el famoso sistema TCS-4 de CDS, partiendo de los exhaustivos comentarios de los operadores que dependen de esta tecnología sobre el terreno. El Stoneskin está destinado a rivalizar con la competencia como un casco resistente y fiable.
item_Desc_srvl_armor_heavy_legs_02,P=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -85 / 115 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 8.0 µSCU\n\nPiezas de naves recuperadas y restos de equipo protector en desuso fueron soldados juntos para crear este intimidante conjunto de armadura. Combinado con un cinturón de cuero decorado.
item_Desc_srvl_combat_heavy_arms_03_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango de temperatura: -70 / 100 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\n6 kg | Stun: 60% | Impacto: 35%\n\nPreferida por los cazadores más brutales, la armadura Wrecker es una fusión de metal desechado y telas robadas, ensamblados para ofrecer protección mientras acechas a tu presa.
item_Desc_srvl_combat_heavy_core_03_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango de temperatura: -70 / 100 °C\nProtección contra radiación: 26800 REM\nTasa de depuración de radiación: 145.8 REM/s\nCapacidad de carga: 8K µSCU\nMochilas: Todas\n7 kg | Stun: 60% | Impacto: 35%\n\nPreferida por los cazadores más brutales, la armadura Wrecker es una fusión de metal desechado y telas robadas, ensamblados para ofrecer protección mientras acechas a tu presa.
item_Desc_srvl_combat_heavy_helmet_03_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nVelocidad de limpieza de radiación: 145.8 REM/s\n5 kg | Stun: 60% | Impacto: 35%\n\nFavorita de los cazadores más brutales, la armadura Wrecker es una fusión de metal desechado y telas saqueadas, ensamblados para ofrecer protección mientras acechas a tu presa.
item_Desc_srvl_combat_heavy_legs_03_01_01=Tipo de artículo: Armadura pesada\nReducción de daño: 40%\nRango térmico: -70 / 100 °C\nProtección contra radiación: 26800 REM\nVelocidad de limpieza de radiación: 145.8 REM/s\nCapacidad de carga: 8K µSCU\n8 kg | Stun: 60% | Impacto: 35%\n\nFavorita de los cazadores más brutales, la armadura Wrecker es una fusión de metal desechado y telas saqueadas, ensamblados para ofrecer protección mientras acechas a tu presa.
item_Desc_syfb_combat_light_arms_01_01_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -31 / 61 °C\nProtección contra radiación: 26000 REM\nTasa de depuración de radiación: 145.8 REM/s\n \nLa armadura Xy'kara de Syang Fabrications ofrece el resultado de miles de años de pericia en combate Xi'an en un envoltorio humano. Estrechamente adaptada a la fisionomía humana, la armadura Xy'kara proporciona una protección sin igual sin sacrificar la movilidad ni la efectividad en combate, sin renunciar al estilo.\nTolerancia a fuerza G: -3.1%\n2 kg | Stun: 30% | Impacto: 10%
item_Desc_syfb_combat_light_core_01_01_01,P=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -31 / 61 °C\nProtección contra radiación: 26000 REM\nTasa de purga de radiación: 145.8 REM/s\nCapacidad de carga: 2K µSCU\n\nLa armadura Xy'kara de Syang Fabrications ofrece el resultado de miles de años de pericia en combate Xi'an en un envoltorio humano. Estrechamente adaptada a la fisionomía humana, la armadura Xy'kara proporciona una protección sin igual sin sacrificar la movilidad ni la efectividad en combate, sin renunciar al estilo.
item_Desc_syfb_combat_light_helmet_01_01_01=Tipo de artículo: Armadura ligera\nReducción de daño: 20%\nRango térmico: -31 / 61 °C\nProtección contra radiación: 26000 REM\nTasa de depuración de radiación: 145.8 REM/s\n \nLa armadura Xy'kara de Syang Fabrications ofrece el resultado de miles de años de pericia en combate en un envoltorio humano. Estrechamente adaptada a la fisionomía humana, la armadura Xy'kara proporciona una protección sin igual sin sacrificar la movilidad ni la efectividad en combate, sin renunciar al estilo, en ningún lugar más que en el casco, cuyo visor de cara Xi'an reconoce la herencia milenaria de la antigua raza que la creó.\nTolerancia a fuerza G: -3.1%\n5 kg | Stun: 30% | Impacto: 10%
