Foxwell_X2_AttackIdris_Desc=Tenemos localizado un Idris de XenoThreat con apoyo de cazas en <EM4>~mission(Location|Address)</EM4>. Su disciplina de comunicaciones es pésima. Según el parloteo por radio, el Comandante está a bordo del Idris. No recuerdo la última vez que lo tuvimos tan bien localizado. Esto podría ser una oportunidad para decapitar toda la operación. \n\n¿Te apuntas?\n\nEugene Walton\nDespachador, Foxwell Enforcement\n'Seguridad, a tu manera'\n\nFoxwell Enforcement es un especialista en seguridad autorizado para operar en todo el UEE. Siempre estamos buscando nuevos operadores que se unan a nuestra familia. Si tú o alguien que conozcas está interesado, ponte en contacto con uno de nuestros representantes de contratos.\n\n<EM4>Escenario:</EM4> +120.000 pts (Return of Xenothreat) (compartido entre el equipo)
