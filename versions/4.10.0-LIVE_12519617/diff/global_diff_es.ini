UWC_From=United Wayfarers Club
UWC_Refueling_easy_desc_001=Hola,\n\nSi vas equipado para repostar, este igual te interesa. \n\nAcaba de activarse una baliza en <EM4>~mission(Location|Address)</EM4>, de un cliente cuya <EM4>~mission(Ship)</EM4> está en las últimas, así que asegúrate de tener tus tanques de combustible al máximo.\n\nLa nave del cliente te pagará a razón de <EM4>~mission(FuelRate) aUEC por SCU de hidrógeno</EM4> y  <EM4>~mission(QTFuelRate) aUEC por SCU de cuántico</EM4>, y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nParece un trabajo limpio y de ida y vuelta, pero nunca está de más mantener los escáneres activos.\nDime si te interesa y pongamos a esta buena gente en marcha.\n\nEspero noticias tuyas,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refueling_easy_desc_002=Hola, \n\nTengo a un miembro del Club en <EM4>~mission(Location|Address)</EM4> que necesita ~mission(FuelType). \n\nLa nave del cliente te pagará a razón de ~mission(RefuelRequest) y, como contratista del United Wayfarers Club, también podrás optar a la tarifa de servicio del UWC indicada arriba al completar el trabajo.\n\nSi te interesa, debería ser un encargo sencillo. La baliza lo sitúa muy lejos de cualquier zona de conflicto reciente, pero nunca está de más mantener un ojo puesto en los escáneres, ¿verdad?\n\nTienen sitios donde estar, así que pongámoslos en marcha.\n\nTómatelo con calma ahí fuera.\n\nDina Deloit\nCentro de Despacho\nUnited Wayfarers Club\n"Te cubrimos las espaldas"
UWC_Refueling_easy_title_001=<EM4>[BP]</EM4> SOLICITUD DE REPOSTAJE: ~mission(Ship)
UWC_Refueling_high_desc_001=Hola,\n\nOtro día, otra baliza. Hay una <EM4>~mission(Ship)</EM4> que busca llenar los depósitos de ~mission(FuelType) en <EM4>~mission(Location|Address)</EM4>.  La nave del cliente te pagará a razón de ~mission(RefuelRequest), y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nNo te voy a mentir: es un sitio feo donde quedarse atascado, y peor aún para que te pillen por sorpresa. Hemos perdido a buena gente ahí fuera; incluso los que tuvieron suerte volvieron a casa con piezas de menos.\n\nSi decides aceptar el trabajo, hazme un favor y mantén los ojos bien abiertos. Si tienes algún colega con tiempo libre, igual le pides que te cubra.\n\nQuizá esté siendo paranoica, pero eso no significa que no vayan a por ti, como decía mamá Deloit. \nEn realidad nunca lo dijo, pero estoy bastante segura de que lo diría si se ganara la vida con esto.\n\nHaz el trabajo y vuelve a casa sano y salvo, ¿vale?\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refueling_high_title_001=<EM4>[BP]</EM4> SOLICITUD DE REPOSTAJE CRÍTICA: ~mission(Ship)
UWC_Refueling_intro_desc_001=¡Hola!\n\nDD del United Wayfarers Club al habla.\n\nEl UWC ofrece servicios de reparación, rearme y repostaje por toda la UEE. Da la casualidad de que estamos buscando nuevos afiliados con naves equipadas para repostar. Si tienes los tanques y te gusta que la gente se alegre de verte, el UWC puede ser tu club.\n\nY si crees que sí, tengo una baliza activa que igual te interesa.\n\nSi resulta que sí, un consejo: <EM4>asegúrate de tener los tanques de combustible llenos antes de salir</EM4>.\n\nUn miembro del Club se ha quedado sin combustible en <EM4>~mission(Location|Address)</EM4>. No tengo claros los detalles, como cómo acabó ahí sin Go Juice, pero al UWC no le gusta dejar a la gente colgada.\n\nLa nave del cliente te pagará a razón de <EM4>~mission(FuelRate) aUEC por SCU de hidrógeno</EM4> y  <EM4>~mission(QTFuelRate) aUEC por SCU de cuántico</EM4>. Como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nEs un encargo directo. Perfecto si quieres hacerte una idea de este tipo de trabajo. Sal ahí, llena los tanques de su <EM4>~mission(Ship)</EM4> y ponles en marcha. Después de unos cuantos encargos así, el proceso se vuelve memoria muscular. Hasta entonces, hay una <EM4>entrada de diario</EM4> en tu mobiGlas llamada ""Protocolos de repostaje"" que cubre lo básico.\n\nNo se han registrado actividades de forajidos en ese sector, pero mantente alerta. Siempre recomiendo que apuntes a un cierre rápido. Cuanto antes termines, antes podré conseguirte otro contrato. El UWC siempre busca nuevos afiliados. \n\nDeseando trabajar contigo.\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refueling_intro_title_001=EL UWC CONTRATA REPOSTADORES
UWC_Refueling_moderate_desc_001=¡Hola, tú!\n\nTengo una baliza en <EM4>~mission(Location|Address)</EM4>. Dicen que sus tanques están secos y les vendría bien ~mission(FuelType). Si te interesa, me da la sensación de que se alegrarán mucho de verte.\n\nLa nave del cliente te pagará a razón de ~mission(RefuelRequest), y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nEstán atrapados en una zona con mala fama, aunque últimamente las cosas están algo más tranquilas. Aun así, yo diría que merece la pena estar atento, por si quedan problemas al acecho. \n\nEn cualquier caso, cuanto antes vuelvan todos a volar, tú incluido, mejor.\n\nBuen viaje,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refueling_moderate_title_001=<EM4>[BP]</EM4> SOLICITUD DE REPOSTAJE URGENTE: ~mission(Ship)
UWC_Refueling_multiple_hard_desc_001=Hola,\n\nEn <EM4>~mission(Location|Address)</EM4> acabamos de recibir un trabajo de repostaje para toda una pequeña flota de naves que en conjunto necesitan ~mission(FuelType). ¡Cuando llueve, diluvia!\n\nEl cliente te pagará a razón de ~mission(RefuelRequest) y, como contratista del United Wayfarers Club, también podrás optar a la tarifa de servicio del UWC indicada arriba al completar el trabajo.\n\nPor desgracia, donde están retenidos no es precisamente el mejor de los sectores, así que estaría atento a cualquier tontería mientras haces el recorrido. \n\nLo mejor será intentar ponerlos a todos en marcha en cuanto puedas.\n\nBuen viaje,\n\nDina Deloit\nCentro de Despacho\nUnited Wayfarers Club\n"Te cubrimos las espaldas"
UWC_Refueling_multiple_hard_title_001=REPOSTAJE DE FLOTA CRÍTICO
UWC_Refueling_multiple_med_desc_001=Hola otra vez,\n\nTengo una baliza en <EM4>~mission(Location|Address)</EM4> y esta es gorda. Una flotilla entera de naves se ha quedado sin combustible al mismo tiempo. Coordinación impresionante y falta de planificación a la vez. \n\nLa nave del cliente te pagará a razón de <EM4>~mission(FuelRate) aUEC por SCU de hidrógeno</EM4> y  <EM4>~mission(QTFuelRate) aUEC por SCU de cuántico</EM4>, y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nComo la zona en la que están es bastante segura, no debería haber muchos problemas al acecho, pero hoy en día nunca se sabe. No estaría mal ponerlos de nuevo en marcha tan rápido como puedas.\n\nBuen viaje,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refueling_multiple_med_desc_001,P=Hola otra vez,\n\nTengo una baliza en <EM4>~mission(Location|Address)</EM4> y esta es gorda. Una flotilla entera de naves se ha quedado sin combustible al mismo tiempo. Coordinación impresionante y falta de planificación a la vez. \n\nLa nave del cliente te pagará a razón de <EM4>~mission(FuelRate) aUEC por SCU de hidrógeno</EM4> y  <EM4>~mission(QTFuelRate) aUEC por SCU de cuántico</EM4>, y como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nComo la zona en la que están es bastante segura, no debería haber muchos problemas al acecho, pero hoy en día nunca se sabe. No estaría mal ponerlos de nuevo en marcha tan rápido como puedas.\n\nBuen viaje,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refueling_multiple_med_title_001=<EM4>[BP]</EM4> REPOSTAJE DE FLOTA URGENTE
UWC_Refuelling_BespokeCapital_Desc=Aquí DD; tengo algo especial para ti,\n\nAcabo de recibir un aviso desde <EM4>~mission(Location|Address)</EM4>. Una fuerza de asalto liderada por una ~mission(Ship) acaba de entrar en el sistema y busca un repostaje rápido antes de volver a salir. \n\nNecesitan ~mission(FuelType) cuanto antes y pagarán ~mission(RefuelRequest) por ello. Como contratista del United Wayfarers Club, también optarás a la tarifa de servicio del UWC indicada arriba al completarlo.\n\nNo te voy a mentir: tengo más que un poco de envidia. ¿Acercarte tanto a una nave así de grande? De esas que luego cuentas a tus nietos.\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»\n
UWC_Refuelling_BespokeCapital_Title=REPOSTAJE URGENTE DE FLOTA CAPITAL
UWC_Refuelling_BespokeCombat_Desc=Eh,\n\nAntes de que digas que sí a este contrato, hay algo que deberías saber: este trabajo viene con una seria advertencia de salud. \n\nNos ha llegado una llamada urgente de repostaje en pleno vuelo en <EM4>~mission(Location|Address)</EM4>. Es una pequeña flota recién salida del combate y entre todos necesitan ~mission(FuelType). Por lo poco que han dicho, suena a que esperan problemas, así que quien vaya hacia allí debería estar preparado para un recibimiento hostil.\n\nLa tarifa del trabajo es ~mission(RefuelRequest), más la tarifa de servicio del UWC indicada arriba al completarlo. Pero créeme, si aceptas esto, te vas a ganar cada crédito de tu paga en este. \n\nVuela con cuidado. No te mueras.\n\nBuena suerte,\n\nDina Deloit\nCentro de Despachos\nUnited Wayfarers Club\n«Te cubrimos las espaldas»
UWC_Refuelling_BespokeCombat_Title=REPOSTAJE CRÍTICO DE GRUPO DE COMBATE
