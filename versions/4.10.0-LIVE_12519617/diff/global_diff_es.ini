item_Desc_vgl_combat_heavy_backpack_01_12_01=Tipo de artículo: Mochila pesada\nCapacidad de carga: 150K µSCU\nCompatibilidad con pechera: Pesada\n \nEsta mochila rígida de Virgil, Ltd. hace que viajar sea fácil. Tanto si necesitas un lugar para llevar tus armas como si has decidido llevar raciones extra para un viaje largo, esta mochila se diseñó para cualquier ocasión. El interior cuenta con un generoso bolsillo cerrable para evitar que tus objetos pequeños se desordenen.\n \nLa edición Purgatory Camo presenta un elegante patrón gris sobre gris.\n6 kg
