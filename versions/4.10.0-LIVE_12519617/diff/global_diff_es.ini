item_Descbehr_glauncher_ballistic_01=Fabricante: Behring\nTipo de artículo: Lanzagranadas\nClase: Balística\nTamaño del cargador: 6\nAccesorios: Óptica, Subcañón (S2)\n[Semi] DPS: 74.2 | Alpha: 74.2 | 50 m/s\nDmg/Cargador: 1\nCargado: 8.17 kg | Descargado: 5.31 kg\n[Red. daño] Max: 200m\n\nEste lanzagranadas dispara granadas de 40 mm para despejar habitaciones y expulsar a los enemigos detras de la cobertura, gracias al diseño de precision de Behring que prepara cada granada para explotar al impactar.
item_Descbehr_pistol_ballistic_01_mr01=Fabricante: Behring\nTipo de artículo: Pistola\nClase: Balística\n\nTamaño del cargador: 20\nCadencia de fuego: 450 rpm\nAlcance efectivo: 25 m\n\nAccesorios: Óptica (S1), Cañón (S1), Subcañón (S1)\n\nGracias a un diseño aerodinámico y un marco de polímero ligero que ayuda a minimizar el retroceso, es fácil ver por qué la versátil y fiable S-38 de Behring se ha convertido en un arma de mano de confianza en todo el Imperio, tanto para ciudadanos como para agentes de la ley. Para honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind adorna el arma con una intensa base azul decorada con un elegante y fluido diseño de aire a lo largo de toda su longitud.
item_Descbehr_rifle_ballistic_01_mr01=Fabricante: Behring\nTipo de artículo: Rifle de Asalto\nClase: Balística\n\nTamaño del cargador: 40\nCadencia de fuego: 550 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S2)\n\nEl clásico rifle P4-AR de Behring presenta un culatazo plegable y un cañón acortado, lo que lo convierte en una opción ideal para enfrentamientos en espacios reducidos. Su precisión y facilidad de uso general lo hacen universalmente valorado entre los usuarios de seguridad, militares y civiles. Para honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind adorna el arma con una intensa base azul decorada con un elegante y fluido diseño de aire a lo largo de toda su longitud.
item_Descbehr_rifle_ballistic_01_sf01,P=Fabricante: Behring\nTipo de artículo: Rifle de Asalto\nClase: Balística\n\nTamaño del cargador: 40\nCadencia de fuego: 550 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S2)\n\nEl clásico rifle P4-AR de Behring presenta un culatazo plegable y un cañón acortado, lo que lo convierte en una opción ideal para enfrentamientos en espacios reducidos. Su precisión y facilidad de uso general lo hacen universalmente valorado entre los usuarios de seguridad, militares y civiles. \n\nLa edición "Star Kitten" presenta el rosa característico de Sally con acentos azules y a la propia y famosa gata impresa a lo largo del costado.
item_Descbehr_rifle_ballistic_03=Fabricante: Behring\nTipo de artículo: Rifle\nClase: Balística\n\nTamaño del cargador: 45\nCadencia de fuego: 600 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S2)\n\nDiseñado para enfrentamientos a corta distancia como los abordajes, el CQ7 de Behring es un rifle de combate bullpup de nueva generación pensado para dominar las exigencias del entorno del campo de batalla moderno.
item_Descbehr_rifle_ballistic_03_mag=Tipo de artículo: Cargador\nCapacidad: 45\n\nEste cargador para el rifle CQ7 viene precargado con cuarenta y cinco cartuchos.
item_Descbehr_rifle_ballistic_03_store01=Fabricante: Behring\nTipo de artículo: Rifle\nClase: Balística\nTamaño del cargador: 40\nAccesorios: Óptica, Cañón, Subcañón (S2)\n[Auto] DPS: 178.8 | Alpha: 16.5\n[Auto] DPS: 131.2 | Alpha: 66\nVelocidad: 550 m/s\nCargado: 3.7 kg | Descargado: 3.2 kg\n[Red. daño] 100% 65m | 61% 173m | 0% 1100m\n\nDiseñado para enfrentamientos a corta distancia como los abordajes, el CQ7 de Behring es un rifle de combate bullpup de nueva generación pensado para dominar las exigencias del entorno del campo de batalla moderno.\n\nLa edición Goldsmith se creó en colaboración con Hardin Tactical y presenta filigrana dorada sobre un lujoso negro para un look extravagante.
item_Descbehr_rifle_ballistic_03_tint01,P=Fabricante: Behring\nTipo de artículo: Rifle\nClase: Balística\nTamaño del cargador: 40\nAccesorios: Óptica, Cañón, Subcañón (S2)\n[Auto] DPS: 178.8 | Alpha: 16.5\n[Auto] DPS: 131.2 | Alpha: 66\nVelocidad: 550 m/s\nCargado: 3.7 kg | Descargado: 3.2 kg\n[Red. daño] 100% 65m | 61% 173m | 0% 1100m\n\nDiseñado para enfrentamientos a corta distancia como los abordajes, el CQ7 de Behring es un rifle de combate bullpup de nueva generación pensado para dominar las exigencias del entorno del campo de batalla moderno. La edición Blacklist presenta un acabado negro intenso.
item_Descbehr_rifle_ballistic_03_tint02,P=Fabricante: Behring\nTipo de artículo: Rifle\nClase: Balística\nTamaño del cargador: 40\nAccesorios: Óptica, Cañón, Subcañón (S2)\n[Auto] DPS: 178.8 | Alpha: 16.5\n[Auto] DPS: 131.2 | Alpha: 66\nVelocidad: 550 m/s\nCargado: 3.7 kg | Descargado: 3.2 kg\n[Red. daño] 100% 65m | 61% 173m | 0% 1100m\n\nDiseñado para enfrentamientos a corta distancia como los abordajes, el CQ7 de Behring es un rifle de combate bullpup de nueva generación pensado para dominar las exigencias del entorno del campo de batalla moderno. La edición Snowfire presenta un acabado blanco y gris claro con acentos negros.
item_Descbehr_rifle_ballistic_03_tint03,P=Fabricante: Behring\nTipo de artículo: Rifle\nClase: Balística\nTamaño del cargador: 40\nAccesorios: Óptica, Cañón, Subcañón (S2)\n[Auto] DPS: 178.8 | Alpha: 16.5\n[Auto] DPS: 131.2 | Alpha: 66\nVelocidad: 550 m/s\nCargado: 3.7 kg | Descargado: 3.2 kg\n[Red. daño] 100% 65m | 61% 173m | 0% 1100m\n\nDiseñado para enfrentamientos a corta distancia como los abordajes, el CQ7 de Behring es un rifle de combate bullpup de nueva generación pensado para dominar las exigencias del entorno del campo de batalla moderno. La edición Infantry presenta un acabado verde y marrón neutro con acentos negros.
item_Descbehr_shotgun_ballistic_01_mr01=Fabricante: Behring\nTipo de artículo: Escopeta\nClase: Balística\nTamaño del cargador: 12\nAccesorios: Ópticas (S1), Cañón (S3), Bajo cañón (S2)\n[Semi] DPS: 132 | Alpha: 88 | 225 m/s\nDmg/Cargador: 1.1K\nCargado: 5.48 kg | Descargado: 4.5 kg\n[Red. daño] 100% 12m | 91% 32m | 0% 450m\n\nDiseñada originalmente para uso militar, Behring decidió vender la escopeta balística BR-2 al público general después de que los primeros evaluadores del arma siguieran pidiendo llevarse una a casa. Con un modo de disparo semiautomático capaz de ofrecer rápidamente una devastadora potencia de detención, la BR-2 es la opción ideal tanto para operaciones ofensivas como defensivas. La edición Purgatory Camo viste un acabado gris sobre gris que crea un perfil sobrio y utilitario.
item_Descgmni_rifle_ballistic_01_mr01=Fabricante: Gemini\nTipo de artículo: Rifle de Asalto\nClase: Balística\nTamaño del cargador: 30\nAccesorios: Ópticas (S2), Cañón (S2), Bajo cañón (S2)\n[Semi] DPS: 150.5 | Alpha: 21.5 | 1200 m/s\nDmg/Cargador: 645\nCargado: 3.9 kg | Descargado: 3.4 kg\n[Red. daño] 100% 100m | 81% 140m | 0% 2400m\n\nCon el S71, Gemini diseñó un rifle de asalto ergonómico ideal para enfrentamientos a media distancia. Recamarado con un proyectil de calibre menor que el de otras armas de su clase, el S71 se ha hecho popular entre los profesionales de la seguridad privada por su estética elegante y su precisión.\n\nLa edición Purgatory Camo presenta un elegante perfil monocromo.
item_Descgmni_smg_ballistic_01_sf01=Fabricante: Gemini\nTipo de artículo: SMG\nClase: Balística\nTamaño del cargador: 50\nAccesorios: Cañón (S1), Ópticas (S1), Bajo cañón (S1)\n[Auto] DPS: 177.3 | Alpha: 11.5 | 500 m/s\nDmg/Cargador: 575\nCargado: 3.05 kg | Descargado: 2.75 kg\n[Red. daño] 100% 15m | 65% 35m | 0% 950m\n\nFácil de manejar y un placer para la vista, el C54 es un SMG elegante y de balanceo preciso fabricado por Gemini. Su armazón ligero de polímero y su diseño ergonómico lo convierten en la opción ideal para enfrentamientos a corta distancia. El C54 es capaz de disparar proyectiles de 10 mm en automático para proporcionar el máximo apoyo y saturación de objetivos, garantizando que cualquier enfrentamiento termine rápido. \n\nLa edición Ochelo se inspira en el instrumento musical Banu del mismo nombre.
item_Deschdgw_optics_tsco_x4_s2=Fabricante: Hedeby Gunworks\nTipo: Telescópica\nPunto de acoplamiento: Óptica\nAumento: 1.5x - 4x\nTiempo de apuntado: +25%\nTamaño: S2\n\nFabricada con exquisitez por los armeros de Hedeby Gunworks, la mira Myers fue diseñada para acompañar las elegantes líneas de su señorial rifle Arlington.
item_Deschdgw_rifle_ballistic_01=Fabricante: Hedeby Gunworks\nTipo de artículo: Rifle\nClase: Balística\n\nTamaño del cargador: 25\nCadencia de fuego: 320 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S3)\n\nLos armeros de Hedeby Gunworks se inspiraron en los diseños balísticos clásicos para construir un rifle largo arraigado en el pasado y en el futuro. El Arlington ofrece una puntería precisa, un fácil ciclado de cartuchos gracias al diseño de acción de palanca y múltiples modos de disparo. Los artesanos moldearon el cuerpo del arma a mano para crear una pieza tan apta para la repisa de la chimenea como para la frontera.
item_Deschdgw_rifle_ballistic_01_mag=Tipo de artículo: Cargador\nCapacidad: 25\n\nEste cargador para el rifle Arlington viene precargado con veinticinco cartuchos.
item_Deschdgw_rifle_ballistic_01_tint01=Fabricante: Hedeby Gunworks\nTipo de artículo: Rifle\nClase: Balística\n\nTamaño del cargador: 20\nCadencia de fuego: 320 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S3)\n\nLos armeros de Hedeby Gunworks se inspiraron en los diseños balísticos clásicos para construir un rifle largo arraigado en el pasado y en el futuro. El Arlington ofrece una puntería precisa, un fácil ciclado de cartuchos gracias al diseño de acción de palanca y múltiples modos de disparo. Los artesanos moldearon el cuerpo del arma a mano para crear una pieza tan apta para la repisa de la chimenea como para la frontera.\n\nLa edición Gamekeeper cambia la culata del rifle por una de elegante madera de nogal.
item_Deschdgw_rifle_ballistic_01_tint02=Fabricante: Hedeby Gunworks\nTipo de artículo: Rifle\nClase: Balística\n\nTamaño del cargador: 20\nCadencia de fuego: 320 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S3)\n\nLos armeros de Hedeby Gunworks se inspiraron en los diseños balísticos clásicos para construir un rifle largo arraigado en el pasado y en el futuro. El Arlington ofrece una puntería precisa, un fácil ciclado de cartuchos gracias al diseño de acción de palanca y múltiples modos de disparo. Los artesanos moldearon el cuerpo del arma a mano para crear una pieza tan apta para la repisa de la chimenea como para la frontera.\n\nLa edición Widowmaker consta de un cuerpo de metal oscuro con una culata de caoba intensa.
item_Deschdgw_rifle_ballistic_01_tint03=Fabricante: Hedeby Gunworks\nTipo de artículo: Rifle\nClase: Balística\n\nTamaño del cargador: 20\nCadencia de fuego: 320 rpm\nAlcance efectivo: 50 m\n\nAccesorios: Óptica (S2), Cañón (S2), Subcañón (S3)\n\nLos armeros de Hedeby Gunworks se inspiraron en los diseños balísticos clásicos para construir un rifle largo arraigado en el pasado y en el futuro. El Arlington ofrece una puntería precisa, un fácil ciclado de cartuchos gracias al diseño de acción de palanca y múltiples modos de disparo. Los artesanos moldearon el cuerpo del arma a mano para crear una pieza tan apta para la repisa de la chimenea como para la frontera.\n\nLa edición Watchpoint añade al rifle una elegante culata de fibra de carbono que contrasta con el plateado refinado del cañón.
item_Descklwe_lmg_energy_01_mr01=Fabricante: Klaus & Werner\nTipo de artículo: LMG\nClase: Láser\nTamaño de la batería: 100\nAccesorios: Ópticas (S2), Cañón (S2), Bajo cañón (S3)\n[Auto] DPS: 153.3 | Alpha: 11.5 | 600 m/s\nDmg/Cargador: 1.1K\nCargado: 11.62 kg | Descargado: 10 kg\n[Red. daño] Max: 2400m\n\nKlaus & Werner ha creado un arma icónica con la fiable LMG láser Demeco. Empleada con frecuencia en enfrentamientos militares, esta favorita de la infantería de corta a media distancia ha sido construida priorizando la estabilidad y la precisión.\n\nLa edición Purgatory Camo combina varios tonos de gris para un diseño sobrio y sin alharacas.
item_Descklwe_rifle_energy_01_sf01=Fabricante: Klaus & Werner\nTipo de artículo: Rifle de Asalto\nClase: Láser\nTamaño de la batería: 45\nAccesorios: Ópticas (S2), Cañón (S2), Bajo cañón (S2)\n[Burst] DPS: 140 | Alpha: 63 | 1200 m/s\n[Burst5] DPS: 147.1 | Alpha: 105 | 1200 m/s\nDmg/Cargador: 945\nCargado: 4.3 kg | Descargado: 3.7 kg\n[Red. daño] Max: 4800m\n\nLas armas de asalto fiables nunca pasan de moda. Klaus & Werner mantiene esa tradición presentando el Gallant. Este rifle de asalto basado en energía es capaz de proporcionar fuego preciso y sostenido sobre objetivos hasta media distancia, mientras que su sistema de alimentación de alta capacidad permite a los operadores disparar muchas más veces por batería.\n\nLa edición Conviction Camo utiliza una difusa selección de grises para ayudar a camuflarse en entornos más urbanos.
item_Descklwe_smg_energy_01_mr01=Fabricante: Klaus & Werner\nTipo de artículo: SMG\nClase: Láser\n\nTamaño de la batería: 45\nCadencia de fuego: 562.5 rpm\nAlcance efectivo: 25m\n\nAccesorios: Óptica (S1), Cañón (S1), Subcañón (S1)\n\nLa mano de obra experta de Klaus & Werner vuelve a lucirse para hacer que el rifle de energía compacto láser Lumin V sea aún más letal y fiable. Un nuevo modo de "disparo automático a intervalos" lanza ráfagas de cinco disparos cuando se mantiene presionado el gatillo, aprovechando la saturación del objetivo propia del disparo automático a la vez que ofrece pausas para reajustar la puntería. Incluso cuando se ataca constantemente, el excelente diseño del arma proporciona un retroceso bajo y una apertura ajustada. Para honrar a quienes acudieron en ayuda de Orison en su momento de necesidad, la edición SecondWind adorna el arma con una intensa base azul decorada con un elegante y fluido diseño de aire a lo largo de toda su longitud.
item_Descksar_gren_frag_01=Fabricante: Kastak Arms\nTipo de artículo: Granada\n \nÁrea de efecto: 7.5 m\nTipo de daño: Plasma\n \nLa granada de plasma Scorch de Kastak Arms será sin duda una incorporación devastadora a tu próxima batalla. Una vez cebada y lista, la Scorch explotará al impactar, liberando una ráfaga de daño intenso por plasma sobre tu objetivo que dejará atrás una zona de peligro persistente.
item_Descnone_rifle_multi_01_collector01=Fabricante: Desconocido\nTipo de artículo: Rifle de Asalto\nClase: Balística\nTamaño del cargador: 45\n[Auto] DPS: 182.8 | Alpha: 22 | 875 m/s\nDmg/Cargador: 990\nCargado: 4.1 kg | Descargado: 3.5 kg\n[Red. daño] 100% 60m | 45% 300m | 0% 1750m\n\nLa belleza está en los ojos de quien la mira y, si apuntas bien, también lo estará una bala del rifle de asalto Killshot. Lo que le falta en gracia, este diseño clásico lo compensa con su propio encanto canalla.\n\nLa edición Dominion Camo añade al rifle un estampado de camuflaje verde oscuro.
item_Descutfl_crossbow_ballistic_01=Fabricante: UltiFlex\nTipo de artículo: Ballesta\n \nTamaño del cargador: 5\nCadencia: 60 rpm\nAlcance efectivo: 50 m\n \nAccesorios: Óptica (S3), Bajocañón (S3)\n \nLos artesanos de UltiFlex pasaron por cientos de prototipos para descubrir el material ligero perfecto con la combinación adecuada de resistencia y flexibilidad para su ballesta Novian, una compañera ideal en todo, desde expediciones fronterizas hasta infiltraciones tácticas. Con un tirón de su mecanismo de disparo, la Novian lanza casi en silencio un pesado virote que se astilla al impacto causando daño devastador a objetivos a corta distancia.
item_Descutfl_crossbow_ballistic_01_mag=Tipo de artículo: Cargador\nCapacidad: 5\n\nEste cargador para la ballesta Novian viene precargado con cinco virotes.
item_Descutfl_crossbow_ballistic_01_sota01=Fabricante: UltiFlex \nTipo de artículo: Ballesta\n\nTamaño del cargador: 5 \nCadencia de tiro: 60 rpm \nAlcance efectivo: 50 m   \n\nAccesorios: Ópticas (S3), Bajo cañón (S3)\n\nLos artesanos de UltiFlex pasaron por cientos de prototipos hasta dar con el material ligero perfecto, con la combinación justa de resistencia y flexibilidad para su ballesta Novian, una compañera ideal lo mismo en expediciones fronterizas que en infiltraciones tácticas. Con un solo gesto del mecanismo de disparo, la Novian lanza casi en silencio un pesado virote que se astilla al impactar, causando un daño devastador en objetivos a corta distancia.\n\nLa edición Shroud presenta cálidos detalles en madera oscura sobre un armazón gris oscuro, convirtiéndola en el equipo ideal para quien busca su próxima aventura.
item_Descutfl_crossbow_ballistic_01_store01,P=Fabricante: UltiFlex\nTipo de artículo: Ballesta\n  \nTamaño del cargador: 5\nCadencia: 60 rpm\nAlcance efectivo: 50 m\n  \nAccesorios: Óptica (S3),Bajocañón (S3)\n  \nLos artesanos de UltiFlex pasaron por cientos de prototipos para descubrir el material ligero perfecto con la combinación adecuada de resistencia y flexibilidad para su ballesta Novia, una compañera ideal en todo, desde expediciones fronterizas hasta infiltraciones tácticas. Con un tirón de su mecanismo de disparo, la Novia lanza casi en silencio un pesado virote que se astilla al impacto causando daño devastador a objetivos a corta distancia. \n \nLos detalles en bronce de la edición Xy'kara se inspiran en la herencia milenaria de los Xi'an.
item_Descutfl_crossbow_ballistic_01_tint01,P=Fabricante: UltiFlex\nTipo de artículo: Ballesta\n  \nTamaño del cargador: 5\nCadencia: 60 rpm\nAlcance efectivo: 50 m\n  \nAccesorios: Óptica (S3), Bajocañón (S3)\n  \nLos artesanos de UltiFlex pasaron por cientos de prototipos para descubrir el material ligero perfecto con la combinación adecuada de resistencia y flexibilidad para su ballesta Novian, una compañera ideal en todo, desde expediciones fronterizas hasta infiltraciones tácticas. Con un tirón de su mecanismo de disparo, la Novian lanza casi en silencio un pesado virote que se astilla al impacto causando daño devastador a objetivos a corta distancia. \n \nLa edición Nighthunter luce un marco mate negro sumergido en sombras.
item_Descutfl_crossbow_ballistic_01_tint02,P=Fabricante: UltiFlex\nTipo de artículo: Ballesta\n  \nTamaño del cargador: 5\nCadencia: 60 rpm\nAlcance efectivo: 50 m\n  \nAccesorios: Óptica (S3), Bajocañón (S3)\n  \nLos artesanos de UltiFlex pasaron por cientos de prototipos para descubrir el material ligero perfecto con la combinación adecuada de resistencia y flexibilidad para su ballesta Novian, una compañera ideal en todo, desde expediciones fronterizas hasta infiltraciones tácticas. Con un tirón de su mecanismo de disparo, la Novian lanza casi en silencio un pesado virote que se astilla al impacto causando daño devastador a objetivos a corta distancia. \n \nLa edición Ghostmaker luce detalles en gris humo sobre un cuerpo metálico.
item_Descutfl_crossbow_ballistic_01_tint03,P=Fabricante: UltiFlex\nTipo de artículo: Ballesta\n  \nTamaño del cargador: 5\nCadencia: 60 rpm\nAlcance efectivo: 50 m\n \nAccesorios: Óptica (S3), Bajocañón (S3)\n \nLos artesanos de UltiFlex pasaron por cientos de prototipos para descubrir el material ligero perfecto con la combinación adecuada de resistencia y flexibilidad para su ballesta Novian, una compañera ideal en todo, desde expediciones fronterizas hasta infiltraciones tácticas. Con un tirón de su mecanismo de disparo, la Novian lanza casi en silencio un pesado virote que se astilla al impacto causando daño devastador a objetivos a corta distancia. \n \nLa edición Wildshot mezcla en su estilo tonos naturales discretos.
item_Mining_Modules_Active_GRIN_Charge_BTGL_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo de minería (activo)\n\nPotencia del láser de extracción: XX%\n\nTasa de carga óptima: XX%\n\nDuración: 15 segundos\nUsos: 3\n\nEl Clearcut mejora notablemente los resultados de la minería al alterar la tasa de carga y acelerar la extracción de mineral valioso.
item_Mining_Modules_Active_GRIN_Charge_BTGL_Name=Módulo Clearcut
item_Mining_Modules_Passive_THCN_Power_BTGL_Desc=Fabricante: Greycat Industrial\nTipo de artículo: Módulo de minería (pasivo)\n\nPotencia del láser de extracción: XX%\n\nAl reducir la eficiencia del rendimiento del láser de minería, el Módulo Deluge aumenta la eficacia del haz mientras está en uso.
item_Mining_Modules_Passive_THCN_Power_BTGL_Name=Módulo Deluge
item_Mining_Modules_Passive_THCN_Resistance_BTGL_Desc=Fabricante: Thermyte Concern\nTipo de artículo: Módulo de minería (pasivo)\n\nResistencia: -XX%\n\nEl Módulo Overrun utiliza un variador de matriz modificado para que los láseres penetren más allá de la resistencia natural de las rocas durante la minería.
item_Mining_Modules_Passive_THCN_Resistance_BTGL_Name=Módulo Overrun
