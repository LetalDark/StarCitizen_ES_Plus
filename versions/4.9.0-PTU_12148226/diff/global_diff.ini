Foxwell_X2_AttackIdris_Desc=We have a fix on a XenoThreat Idris with fighter support at <EM4>~mission(Location|Address)</EM4>. Their comms discipline's lousy. According to the radio chatter, the Commander's on board the Idris. Can't remember the last time we had such a strong fix on him. This could be a chance to decapitate the whole operation. \n\nWant in?\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_X2_AttackIdris_Title=Target: XenoThreat Attack Group
Foxwell_X2_DrawOutBoss_Desc=We have intercepted a location beacon that puts <EM>~mission(TargetName)</EM4> and their personal attack wing at <EM4>~mission(Location|Address)</EM4>. They have been one of XenoThreat's most brutal enforcers since their founding. \n\n<EM>~mission(TargetName|Last)</EM4>'s not one to back down from a fight so hit their ships hard enough, do enough damage and they won't be able to resist joining in the action. Once they're out in the open, they'll be your main target.\n\nReady to go?\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_X2_DrawOutBoss_Title=Eliminate XenoThreat Enforcer
Foxwell_X2_ShipAmbush_Desc=Been handed some strong intel on a XenoThreat strike wing's flightpath. Looking for contractors who can dust off now and be set up at <EM4>~mission(Location|Address)</EM4> ahead of them. Local conditions will mask your scanner signatures so you can give them the surprise of their lives. Let's turn the hunters into the hunted.\n\nInterested?\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_X2_ShipAmbush_Title=Ambush XenoThreat Strike Wing
Foxwell_X2_ShipDefend_Desc=A distress beacon came in from <EM4>~mission(Location|Address)</EM4> about a ship under attack from XenoThreat. The pilot reports that their shields are failing and they can't outrun the attackers.\n\nThe ship's a <EM4>~mission(Ship)</EM4>, but the pilot's Human, which  according to XenoThreat's twisted way of thinking, makes them a traitor to Humanity and a target for their hate.\n\nWe're looking for operators to head out there and do some good.\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_X2_ShipDefend_Title=Urgent - Ship Under XenoThreat Attack
Foxwell_X2_ShipWaves_Desc=Multiple reports are coming in of XenoThreat ships massing at <EM4>~mission(Location|Address)</EM4>\nWe're looking for contractors ready to take the fight to them. \n\nThey want us to believe that they have right on their side. They want us to believe that they have overwhelming force. This is a chance to show them we know better.\n\nI won't lie, this is more than just a simple security contract to me. I really hate those intolerant assholes and everything they stand for.\n\nYou with me?\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_X2_ShipWaves_Title=Interdict XenoThreat Attack Force
