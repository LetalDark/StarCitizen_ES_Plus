HeadHunters_DefendEntitesAndEscort_E_Desc=I was having a shite day, and it just got worse. Our interests over at <EM4>~mission(Location|Address)</EM4> comm'd to let me know that their  <EM>~mission(Objects)</EM4> are under attack by these no-name hoods looking to stake a claim.\n\nYou're gonna go there for me and protect the place, including any <EM4>friendly ships</EM4> unfortunate enough to be caught in the crossfire. Don't think putting these wannabees in their place will be too tricky for someone like you. \n\nAlso, I’ll sweeten the pot by giving the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> just to show my appreciation. \n\nStows out.
HeadHunters_DefendEntitesAndEscort_E_Title=Provide Protection at ~mission(Location)
HeadHunters_DefendEntitesAndEscort_H_Desc=There's this small gang that continues to be a thorn in our side, and the bastards have just ambushed some friends over at <EM4>~mission(Location|Address)</EM4>. Seems like they're doing their best to destroy the <EM4>~mission(Objects)</EM4> there.\n\nI need you and whatever <EM4>crew you can muster</EM4> on site stopping these mungers from blowing everything up and protecting any <EM4>friendly ships</EM4> that need a hand.\n\nHandle this right and I’ll give the main contractor  <EM4>~mission(ScripAmount) Council Scrip</EM4>.\n\n- Stows
HeadHunters_DefendEntitesAndEscort_H_Title=Stop Rival Attack at ~mission(Location)
HeadHunters_DefendEntitesAndEscort_M_Desc=A new gang who is proving to be a real pain in the ass for the Headhunters just upped the stakes by attacking the <EM4>~mission(Objects)</EM4> at <EM4>~mission(Location|Address)</EM4>. Never a good thing since we got interest in the welfare of the folks there, but doubly so because if they do too much damage it might royally screw an upcoming operation.\n\nHead over there as soon as you're able and stop the attack before they can do any lasting damage. And if any <EM4>friendly ships</EM4> need a hand, I want you to look out for them too. Don't expect this gang to be pushovers but you should still be able to deal with them if you keep your head on.\n \nIf you need any extra motivation, I’m adding <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor.\n\n- Stows
HeadHunters_DefendEntitesAndEscort_M_Title=Secure ~mission(Location) from Upstarts
HeadHunters_DefendEntitesAndEscort_S_Desc=The maintenance and reliable function of <EM4>~mission(Location|Address)</EM4> is pretty darn important to the Headhunters, but this rival crew seems determined knock it out of contention. They're on site now, targeting <EM4>~mission(Objects)</EM4> there. \n\nProtecting the site, and any <EM4>friendly ships</EM4>, in the area is important enough that I want you to bring some <EM4>reliable backup along</EM4> when you go and terminate these nullbrains. \n\nTo prove just how serious we are about getting this done right, the main contractor will earn <EM4>~mission(ScripAmount) Council Scrip</EM4> for making sure absolutely nothing goes wrong.\n\n- Stow
HeadHunters_DefendEntitesAndEscort_S_Title=Guard ~mission(Location) From Rivals
HeadHunters_DefendEntitesAndEscort_VE_Desc=I won't bore you with the nitty gritty, but trust me when I say that <EM4>~mission(Location|Address)</EM4> is important to the Headhunters. So imagine how pissed I am to learn that they're being harassed by some aggressive upstarts who are hellbent on taking out their <EM>~mission(Objects)</EM4>. It won't stand.   \n\nGet there and provide some protection before everything gets destroyed, including <EM4>any friendly ships</EM4> in the area. Nullbrains like these hopefully won't pose too much of a challenge to a rising star like yourself.\n\nClear ‘em all out I’ll throw <EM4>~mission(ScripAmount) Council Scrip</EM4> to whoever accepted this gig.\n\n- Stows
HeadHunters_DefendEntitesAndEscort_VE_Desc_0=Got some assets that need a guardian angel at <EM4>~mission(Location|Address)</EM4>. Keep them breathing and walk them out. Easy money if you're paying attention.
HeadHunters_DefendEntitesAndEscort_VE_Title=Keep ~mission(Location) Safe
HeadHunters_DefendEntitesAndEscort_VE_Title_0=Babysit the Goods
HeadHunters_DefendEntitesAndEscort_VH_Desc=So, I thought we had done a good job of keeping things on the quiet side, but looks like the fact <EM4>~mission(Location|Address)</EM4> has Headhunters ties has gotten out. Now there are some heavy operators causing major problems there, targeting the <EM>~mission(Objects)</EM4> and generally causing me a massive headache.\n\nWith the amount of firepower these interlopers are packing, you're gonna need to bring along a <EM4>crew of your own</EM4> to pull this off. Especially since I need you to be protecting any <EM4>friendly ships</EM4> that need help.\n\nThis op needs to go off without a hitch, so I’m offering the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> for a job well done. \n\nStows out.
HeadHunters_DefendEntitesAndEscort_VH_Title=Defend ~mission(Location) From Mercs
HeadHunters_EliminateAll_Rockcracker_Power_desc=Some idiots set up shop near the power section of a Rockcracker at <EM4>~mission(Location|Address)</EM4>. Go in and put them down. Quick and quiet.
HeadHunters_EliminateAll_Rockcracker_Zone1_desc=Rivals taking up real estate in the first zone of a Rockcracker at <EM4>~mission(Location|Address)</EM4>. Time to send them home in body bags.
HeadHunters_EliminateAll_Rockcracker_Zone2_desc=Same crew, different corner. Second zone of the Rockcracker at <EM4>~mission(Location|Address)</EM4>. Finish what we started.
HeadHunters_EliminateAll_Rockcracker_title_001=Hit the Rockcracker Crew
HeadHunters_ShipAmbush_Intro_desc_001=We've got a juicy target lining up a route through <EM4>~mission(Location|Address)</EM4>. Get into position and wait for our signal — we'll spring the ambush together.
HeadHunters_ShipAmbush_Intro_title_001=Setting the Trap
Headhunters_DefendDestructibleEntites_E_Desc_001=Some morons with some seriously inflated notion of their place in 'verse made the damn foolish choice of attacking the <EM>~mission(Objects)</EM4> at <EM4>~mission(Location|Address)</EM4>. We've got some things in play over there so we can’t let ‘em get away with it.\n\nIf you're interesting in helpin' out, get there and deal with these luggers before they can do too much damage. Don't figure you'll break too much of a sweat dealin' with them.\n\nAlso, I’ll sweeten the pot by giving the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> just to show my appreciation. \n\nStows out.
Headhunters_DefendDestructibleEntites_E_Title_001=Protect ~mission(Objects) From Luggers
Headhunters_DefendDestructibleEntites_H_Desc_001=Got word from some allies of ours over at <EM4>~mission(Location|Address)</EM4> that they're coming under attack. A gang we've had run-ins with before are trying to take them over by first destroying their <EM4>~mission(Objects)</EM4>.\n\nThis crew are mungers through and through, but they mean business and can handle themselves in a fight. It will take a bit of doing to make sure they don't blow up everything. You might even think about <EM>bringing some help</EM> along.\n\nHandle this right and I’ll give the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4>.\n\n- Stows
Headhunters_DefendDestructibleEntites_H_Title_001=Stop Gang From Destroying ~mission(Objects)
Headhunters_DefendDestructibleEntites_M_Desc_001=Our friends at <EM4>~mission(Location|Address)</EM4> have been compromised. A new gang in the area  are threatening them by targeting their <EM4>~mission(Objects)</EM4>.  \n\nIf those get destroyed its going to be seriously bad for business, so I want you over there pronto on protection duty.  \n \nIf you need any extra motivation, I’m adding <EM4>~mission(ScripAmount) Council Scrip</EM4> for the main contractor.\n\n- Stows
Headhunters_DefendDestructibleEntites_M_Title_001=Secure ~mission(Objects) From Rivals
Headhunters_DefendDestructibleEntites_S_Desc_001=Our partners at <EM4>~mission(Location|Address)</EM4> need help. A rival outlaw crew are swarming the area and attacking the <EM4>~mission(Objects)</EM4> there. That’d be bad enough as is, but this site is absolutely critical to our future plans in the area and its damn important that it remains in working order.\n\nWith the scale of this attack and the skill of these pilots, there's no doubt that some <EM>reliable backup</EM> would serve you well. Gather your crew, fly out to the site, and stop these bootlicks before they can do any lasting damage. \n\nTo prove just how serious we are about getting this done right, the main contractor will earn <EM4>~mission(ScripAmount) Council Scrip</EM4> for making sure absolutely nothing goes wrong.\n\n- Stow
Headhunters_DefendDestructibleEntites_S_Title_001=Guard ~mission(Objects) At All Costs
Headhunters_DefendDestructibleEntites_VE_Desc_001=You don't need all the details, but Headhunters have an interest in what happens over at <EM4>~mission(Location|Address)</EM4> and I just got word they're being harassed by some aggressive upstarts. \n\nThe dumb sods are trying to cripple the place by taking out their <EM>~mission(Objects)</EM4>. I'm not having it.   \n\nGet there and provide some protection before everything gets destroyed. These chumps are lightweights so shouldn't be too much of a problem for you to handle. \n\nClear ‘em all out I’ll throw <EM4>~mission(ScripAmount) Council Scrip</EM4> to whoever accepted this gig as a bonus.\n\n- Stows
Headhunters_DefendDestructibleEntites_VE_Title_001=Keep ~mission(Objects) Safe From Upstarts
Headhunters_DefendDestructibleEntites_VH_Desc_001=A band of hired guns has been sent to mess with our interests over at <EM4>~mission(Location|Address)</EM4>. Seems someone has been tipped off that if the <EM>~mission(Objects)</EM4> there are destroyed that it will severely interrupt Headhunter operations in the area. That's a problem I want you to fix.\n\nNot gonna lie, theses mercs are no joke. It'd be foolish to go it alone. That’s why you’ll need to be fully supplied and find <EM>some trustworthy friends</EM> to fly at your wing.\n\nThis op needs to go off without a hitch, so I’m offering the main contractor <EM4>~mission(ScripAmount) Council Scrip</EM4> for a job well done. \n\nStows out.
Headhunters_DefendDestructibleEntites_VH_Title_001=Defend ~mission(Objects) From Mercs
Headhunters_EliminateAllFF_Desc_001=The Frontier Fighters have been pushing into our territory at <EM4>~mission(Location|Address)</EM4>. We need their crew shut down before they get any ideas. Head over there and take out everyone you find. No survivors.
Headhunters_EliminateAllFF_Title_001=Send a Message to the Frontier Fighters
