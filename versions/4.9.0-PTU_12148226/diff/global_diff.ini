item_Desc_srvl_combat_heavy_legs_03_01_01=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -70 / 100 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 8K µSCU\n\nFavored by the most brutal of hunters, the Wrecker armor is a fusion of discarded metal and pilfered fabric cobbled together to offer protection while stalking prey.
item_Desc_syfb_combat_light_arms_01_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -31 / 61 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n \nThe Xy'kara Armor from Syang Fabrications offers the result of thousands of years of Xi'an combat expertise in a Human package. Closely patterned to the Human physique, the Xy'kara armor provides unparalleled protection without sacrificing mobility and combat effectiveness without sacrificing style.
item_Desc_syfb_combat_light_core_01_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -31 / 61 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCapacity: 2000 mSCU\n \nThe Xy'kara Armor from Syang Fabrications offers the result of thousands of years of Xi'an combat expertise in a Human package. Closely patterned to the Human physique, the Xy'kara armor provides unparalleled protection without sacrificing mobility and combat effectiveness without sacrificing style.
item_Desc_syfb_combat_light_helmet_01_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -31 / 61 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n \nThe Xy'kara Armor from Syang Fabrications offers the result of thousands of years of combat expertise in a Human package. Closely patterned to the Human physique, the Xy'kara armor provides unparalleled protection without sacrificing mobility and combat effectiveness without sacrificing style - nowhere more so than in the helmet whose Xi'an-face visor acknowledges the millennia-long heritage of the ancient race that created it.
item_Desc_syfb_combat_light_legs_01_01_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -31 / 61 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nThe Xy'kara Armor from Syang Fabrications offers the result of thousands of years of Xi'an combat expertise in a Human package. Closely patterned to the Human physique, the Xy'kara armor provides unparalleled protection without sacrificing mobility and combat effectiveness without sacrificing style.
item_Desc_vgl_combat_heavy_backpack_01_12_01=Item Type: Heavy Backpack\nCarrying Capacity: 150K µSCU\nCore Compatibility: Heavy\n \nThis hard backpack from Virgil, Ltd. makes travel easy. Whether you need a place to carry your weapons or you've decided to bring some extra rations along for a long journey, this backpack was designed to handle any occasion. The interior features a generous, closeable pocket to keep your small items from falling out of place.\n \nThe Purgatory Camo edition features a sleek gray-on-gray pattern.
item_Desc_vgl_flightsuit_01_01_01=Item Type: Flight Suit\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +97.5%\n\nTaking its design cues from the early days of aviation, the Tailwind flight suit prioritizes functionality above all. Utilizing a thin layer of woolen insulation, a quilted collar, and breathable materials in key locations, this suit gives every pilot the best chance at success.
item_Desc_vgl_flightsuit_01_02_01=Item Type: Flight Suit\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +97.5%\n\nTaking its design cues from the early days of aviation, the Tailwind flight suit prioritizes functionality above all. Utilizing a thin layer of woolen insulation, a quilted collar, and breathable materials in key locations, this suit gives every pilot the best chance at success.\n\nThe Dominion Camo edition adds a dark green camo pattern to the flight suit.
item_Desc_vgl_flightsuit_02_01_01=Item Type: Flight Suit\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +97.5%\n\nTaking its design cues from the early days of aviation, the Tailwind flight suit prioritizes functionality above all. Utilizing a thin layer of woolen insulation, a quilted collar, and breathable materials in key locations, this suit gives every pilot the best chance at success.\n\nShow your pride for the company that champions the everyman with the Drake edition of the Tailwind flight suit.
item_Desc_vgl_flightsuit_03_01_01=Item Type: Flight Suit\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +97.5%\n\nTaking its design cues from the early days of aviation, the Tailwind flight suit prioritizes functionality above all. Utilizing a thin layer of woolen insulation, a quilted collar, and breathable materials in key locations, this suit gives every pilot the best chance at success.\n\nUtilizing the neon yellows and vivid blues associated with the Murray Cup, this special edition features the logos of the official sponsors of the race.
item_Desc_vgl_flightsuit_04_01_01=Item Type: Flight Suit\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +97.5%\n\nTaking its design cues from the early days of aviation, the Tailwind flight suit prioritizes functionality above all. Utilizing a thin layer of woolen insulation, a quilted collar, and breathable materials in key locations, this suit gives every pilot the best chance at success.\n\nTough, sleek, and industrial, the Anvil edition emphasizes the vehicle manufacturer's values with a military green base, sharp yellow stripes, and the company's logo emblazoned proudly on it.
item_Desc_vgl_flightsuit_05_01_01=Item Type: Flight Suit\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +97.5%\n\nTaking its design cues from the early days of aviation, the Tailwind flight suit prioritizes functionality above all. Utilizing a thin layer of woolen insulation, a quilted collar, and breathable materials in key locations, this suit gives every pilot the best chance at success.\n\nFeaturing a sophisticated gray with refined brass accents, the Kruger edition of this flight suit exemplifies the high quality and detail oriented focus of the ship company.
item_Desc_vgl_flightsuit_helmet_01_01_01=Item Type: Flight Helmet\nDamage Reduction: 15%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nStyled on classic racing helmets, the Tailwind helmet offers crucial insulation and neck support from the rigors of the racing cockpit. The double layered visor provides essential protection from glare whilst ensuring the helmet remains airtight and that the wearer's vision remains unimpeded.
