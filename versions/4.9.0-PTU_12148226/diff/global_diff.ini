RedWind_RecoverCargo_Easy_Description=RedWind Logistics\n\nSome of our cargo went missing during a transit incident at <EM4>~mission(Location|Address)</EM4>. Recover the containers and deliver them to <EM4>~mission(Destination|Address)</EM4>. Standard payment on delivery.
