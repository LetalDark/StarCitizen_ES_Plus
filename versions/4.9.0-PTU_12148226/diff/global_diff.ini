item_Desc_m_hdtc_jacket_01_01_01=Damage Reduction: 5%\nCarrying Capacity: 0.4K µSCU\n\nStylish, functional, and deadly: the Bellator clothing line is designed to fit in at dinner party just as well as a gunfight. Blending cutting edge technology with precise measurements, this jacket provides some combat protection thanks to the intricate weaving of layered graphene in its threads. Adorned with a decorative lapel pin, the jacket's spacious inner lining is also capable of subtly concealing small weaponry and devices.
