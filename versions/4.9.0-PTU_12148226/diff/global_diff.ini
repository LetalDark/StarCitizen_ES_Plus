Battaglia_RPT_BoardShip_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ship In Distress\n\nWORK BRIEF: \nGot an urgent distress call from one of the Miners Amalgamated crews I sent out, saying they’re under attack by a gang that ambushed their ship in <EM4>~mission(Location)</EM4>. Need you to rush down there, board the <EM4>~mission(Ship)</EM4> and take out all the punks targeting my guys.\n\nPlease let me know ASAP if you can help.\n\nPAYMENT:\nStandard listed rate upon elimination of all targets.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_BoardShip_01_title=Ship In Distress
Battaglia_RPT_CreateUplink_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Moraine Movements\n\nWORK BRIEF: \nThis is a little outside our usual purview, but with the Moraine attacking more often, we’re hoping to find out where they’re operating and steer crews clear of those areas.\n\nWe need someone to infiltrate a suspected Moraine facility and plug a small listening device into their server. We’ve been told that the station is rarely occupied but it’s possible that you will encounter Moraine there, so be careful.\n\nWhile we don’t advocate violence, the potential benefits of this intel will be able to save many lives on both sides.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_CreateUplink_01_title=Moraine Movements
Battaglia_RPT_CreateUplink_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Need some intel\n\nWORK BRIEF: \nThe Governing Committee have been looking for more information to help strategize a way out of our current situation with the Moraine. They’ve asked for people willing to <EM4>plant tracking programs aboard Moraine stations</EM4> in order to gather data to better understand their movements and locations in Nyx.\n\nYou’ll need to head out to ~mission(Location), get access to the Moraine station, and plant the device in their servers.\n\nIt’s entirely possible that this station may be occupied but hopefully violence can be avoided.\n\nGood luck.\n\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_CreateUplink_02_title=Need some intel
Battaglia_RPT_CreateUplink_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Tapping Moraine Servers\n\nWORK BRIEF: \nIt’s no secret the Moraine have been escalating their attacks against People Alliance crews just trying to make an honest living in Nyx. While the PA won’t condone open hostilities against them, the Governors Committee wants to try to keep away from them as much as possible.\n\nWe need someone to head to a Moraine station near <EM4>~mission(Location)</EM4> and implant a data card in their servers. There’s a tracking program that will autorun that will feed us the location of Moraine ships. The Committee hopes that we can use this data to warn our crews and save lives.\n\nAny help you can provide would be appreciated. I won’t lie, it’s possible that there might be Moraine on the station who won’t take kindly to you being there, so be careful.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_CreateUplink_03_title=Tapping Moraine Servers 
Battaglia_RPT_DataDownload_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Moraine Data Retrieval\n\nWORK BRIEF: \nThis is a little outside our usual purview, but with the Moraine attacking more often, we’re hoping to find out where they’re operating and steer crews clear of those areas.\n\nWe need someone to <EM4>infiltrate a suspected Moraine facility and make a copy of their server data</EM4>. We’ve been told that the station is rarely occupied but it’s possible that you will encounter Moraine there, so be careful.\n\nWhile we don’t advocate violence, the potential benefits of this intel will be able to save many lives on both sides.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_DataDownload_01_title=Moraine Data Retrieval
Battaglia_RPT_MissCrew_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Crew Hasn’t Checked In\n\nWORK BRIEF: \nJust got word that one of the mining teams is unaccounted for. They were supposed to be back hours ago, but no one’s heard from them. Family have tried to reach out but haven’t gotten a response from anyone on the crew.\n\nThey were last reported around <EM4>~mission(Location)</EM4>, so we’re looking for someone to go check in and see if they’re okay. If the worst happened, please identify anyone you find. I’m sure the families would appreciate some closure on what happened.\n\nThanks\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_MissCrew_01_title=Crew Hasn’t Checked In
Battaglia_RPT_MissCrew_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Missing Mining Team\n\nWORK BRIEF: \nThe crew of the <EM4>~mission(ShipName)</EM4> set off for a dig and haven’t checked back in. With everything going on out there, people are starting to get a little worried, so we’d like someone to try and get eyes on them.\n\nThey were last tracked near <EM4>~mission(Location)</EM4> so you can start there. I hate to say this, but if something happened to them, could you please identify everyone you find so we can let next of kin know?\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_MissCrew_02_title=Missing Mining Team
Battaglia_RPT_MissCrew_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Missing Persons\n\nWORK BRIEF: \nA group of prospectors set out to poke around <EM4>~mission(Location)</EM4> and haven’t been heard from since. We’re looking for someone to check in and see if they’re okay.\n\nPAYMENT:\nStandard listed rate upon entire crew's status confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_MissCrew_03_title=Missing Persons
Battaglia_RPT_Rarity_Rare_desc=These are pretty rare resources, so they might be tricky to find.
Battaglia_RPT_Rarity_Uncommon_desc=These might be a little tricky to find, just a head's up.
Battaglia_RPT_Rarity_common_desc=These should be pretty easy to find.
Battaglia_RPT_RecoverItem_M_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval w/Danger\n\nWORK BRIEF: \nWe had another ship attacked out near ~mission(Location) and received conflicting reports about who did the ambush, so we're looking to hire someone to fly out and <EM4>retrieve the blackbox</EM4>. Last thing we want to do is blame the wrong people. You should be able to carry it, but <EM4>you'll need a ship with some storage.</EM4>\n\nJust be careful, there's a real good chance <EM4>the ambushers are still there waiting</EM4> for someone to claim it.\n\nIf you're able to get it, <EM4>deliver the blackbox to ~mission(Destination)</EM4> and we'll get you paid.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_RecoverItem_M_01_title=Blackbox Retrieval w/Danger
Battaglia_RPT_RecoverItem_VE_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval\n\nWORK BRIEF: \nReceived a tip about <EM4>a ship that had been attacked at ~mission(Location)</EM4>.  Apparently it's been there for a little while, but the Governing Committee would like to know how it got there. \n\nWe're looking for someone to go out, <EM4>retrieve the blackbox and bring it to ~mission(Destination)</EM4> so we can figure out what happened. \n\nJust a reminder, the blackbox isn't small, so <EM4>you'll need a ship with some storage</EM4>.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_RecoverItem_VE_01_title=Blackbox Retrieval
Battaglia_RPT_RecoverItem_VH_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Blackbox Retrieval Very Dangerous\n\nWORK BRIEF: \nThere's been another attack out at ~mission(Location). Whoever did it killed the entire crew in the ambush. The Governing Committee wants answers so we're looking for someone to head out there, <EM4>retrieve the blackbox and deliver it ~mission(Destination)</EM4>. Make sure you <EM4>bring a ship with some storage to hold the blackbox</EM4>.\n\nBe incredibly careful. They said it was a large group that attacked them, and I'd be <EM4>they're still in the area</EM4>.\n\nPAYMENT:\nStandard listed rate upon delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_RecoverItem_VH_01_title=Blackbox Retrieval Very Dangerous
Battaglia_RPT_Salvage_E_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Salvage\n\nWORK BRIEF: \nGot a call about <EM4>a derelict ship out near ~mission(Location)</EM4>. Ran the regtag through the system to make sure we weren't taking someone's ride but it looks unclaimed, so I need someone with a salvage ship to head out and break it down. \n\nOnce you're done, <EM4>take the resources to ~mission(Destination)</EM4> and we'll get you paid.\n\nPAYMENT:\nStandard listed rate upon resource delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Salvage_E_01_title=Salvage Job: Small
Battaglia_RPT_Salvage_H_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Large Ship Salvage\n\nWORK BRIEF: \nWord got passed over that <EM4>there's a large derelict ship out near ~mission(Location)</EM4>, so we're putting the word out for anyone who's got the ships and gear to break it down. \n\nIf you can chop it up, then <EM4>deliver the resources to ~mission(Destination)</EM4> and we'll pay you for your time.\n\nPAYMENT:\nStandard listed rate upon resource delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Salvage_H_01_title=Salvage Job: Large
Battaglia_RPT_Salvage_M_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Medium Ship Salvage\n\nWORK BRIEF: \nGot word that a ship got destroyed out by ~mission(Location) after an ambush. Owner is willing to pay for someone to go salvage the parts and <EM4>bring them to ~mission(Destination)</EM4>.\n\nPAYMENT:\nStandard listed rate upon resource delivery\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Salvage_M_01_title=Salvage Job: Mid
Battaglia_RPT_ScanMine_01_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Minor Mining Job\n\nWORK BRIEF: \nIf you’ve got time, I’ve got a pretty basic mining job for you. I'm building a database of mineral types and their locations but I need some raw data, so I need someone to locate <EM4>~mission(Resources) ~mission(MineableType)</EM4>s. You can keep what you find, I'll pull the data I need. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_01_title=Minor Mining Job
Battaglia_RPT_ScanMine_02_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Need Some Ore Mined\n\nWORK BRIEF: \nGot a moment? Need someone to fly over to locate <EM4>~mission(Resources)</EM4> and mine at least <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>s. We're updating our database for future mining expeditions. You can keep what you find, we just need the data. ~mission(Rarity)\n\nAlso, if new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out in your mobi.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_02_title=Need Some Ore Mined
Battaglia_RPT_ScanMine_03_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Scan And Mining Needed\n\nWORK BRIEF: \nI have a job here that might interest you. I need people to go out and do some basic mining in order to pull some geological data for future prospecting. Need someone to scope out and mine <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>s. You'll be helping us out massively. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nKeep me posted.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_03_title=Scan And Mining Needed
Battaglia_RPT_ScanMine_04_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Needs Gathering\n\nWORK BRIEF: \nGot a big mining job with your name on it. We're looking to update our records about mineral yields so we need someone to scan and extract about <EM4>~mission(Resources)</EM4> <EM4>~mission(MineableType)</EM4>s mined if possible. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_04_title=Ore Needs Gathering
Battaglia_RPT_ScanMine_05_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Efficient Miners Wanted\n\nWORK BRIEF: \nNeed your help with something. If you could harvest ~mission(Resources) ~mission(MineableType)</EM4>s, that would really help out our understanding of the current mineral levels in the system. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks in advance.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_05_title=Efficient Miners Wanted
Battaglia_RPT_ScanMine_06_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Mining and Data Collection\n\nWORK BRIEF: \nHave a big one for you today. Need you to get down there and mine ~mission(Resources) ~mission(MineableType)</EM4>s and relay your stats back to us. I'm looking to pull together some findings from various miners around the system. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation and extraction.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_06_title=Mining and Data Collection
Battaglia_RPT_ScanMine_Golem_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Extra Special Job\n\nWORK BRIEF: \nYou've been doing some excellent work for us lately and wanted to offer a special job with a special reward. I'm looking for some more data, so I need someone to scan ~mission(Resources) ~mission(MineableType)</EM4>s and send me what you find. ~mission(Rarity)\n\nBy this point you know what you're doing but just going to remind you that <EM4>the United Resource Workers' mining journal on your mobi is great if you're stuck.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nPolished up a special Drake Golem from Teach's for this one.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_Golem_title=Extra Special Job
Battaglia_RPT_ScanMine_Mole_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Mining and MOLE\n\nWORK BRIEF: \nAnother special job for you with an extra special payout. Like the previous jobs, I need you to find and extract <EM4> ~mission(Resources) ~mission(MineableType)</EM4>s and relay your stats back to us. ~mission(Rarity) \n\nI can't even tell you how helpful your work has been in the past so I've arranged an extra special payout for this one. ~mission(Rarity)\n\nBy this point you know what you're doing but just going to remind you that <EM4>the United Resource Workers' mining journal on your mobi is great if you're stuck.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nYou'll receive a custom ARGO MOLE as payment for all your help.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_Mole_title=Mining and MOLE
Battaglia_RPT_ScanMine_Prosp_desc=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Scan, Mine, and Prospector Payout\n\nWORK BRIEF: \nStill pulling together data on mining and mineral extraction but got a special payout for this one. Once you scan ~mission(Resources) ~mission(MineableType)</EM4>s and relay your stats back to us, I'll get you something real nice for all your help. ~mission(Rarity)\n\nBy this point you know what you're doing but just going to remind you that <EM4>the United Resource Workers' mining journal on your mobi is great if you're stuck.</EM4>\n\nLet me know if you’re up for it.\n\nPAYMENT:\nGot a special MISC Prospector as payment for all your help.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_ScanMine_Prosp_title=Scan, Mine, and Prospector Payout
Battaglia_RPT_Scan_01_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Scan Needed\n\nWORK BRIEF: \nGot a simple one for you today. I'm looking for some mining data so I need someone to scan some <EM4>~mission(Resources)</EM4>. The data will be helpful to plan future expeditions. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nThanks.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Scan_01_title=Ore Scan Needed
Battaglia_RPT_Scan_02_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore To Be Scanned\n\nWORK BRIEF: \nGot a job for you. Need someone to scan a deposit of <EM4>~mission(Resources)</EM4>. I'm looking into building a more extensive database on mineral locations, so your data will be helpful.~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nKeep me posted.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Scan_02_title=Ore To Be Scanned
Battaglia_RPT_Scan_03_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Ore Deposit Needs Scanning\n\nWORK BRIEF: \nI'm looking for an available miner to go out and scan for <EM4>~mission(Resources)</EM4>. Just need confirmation that it’s there and worth sending someone to collect. ~mission(Rarity)\n\nAlso, if you're stuck or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know if you’ve got the time.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Scan_03_title=Ore Deposit Needs Scanning
Battaglia_RPT_Scan_04_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Full Area Scan For Ore\n\nWORK BRIEF: \nI need you to check something out for me if you’re not busy. I'm looking to build on our mineral database and need some scans of <EM4>~mission(Resources)</EM4>. I can handle the mining if you want to leave it. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nLet me know.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Scan_04_title=Full Area Scan for Ore
Battaglia_RPT_Scan_05_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Large Deposit Of Ore To Confirm\n\nWORK BRIEF: \nNeed your help with a prospecting job. Need someone to track down a deposit of <EM4>~mission(Resources)</EM4>. \nThis data will be helpful for some studies we're doing about mineral levels. ~mission(Rarity)\n\nAlso, if you're stuck on where to look or new to mining, there's a <EM4>journal on mining by the United Resource Workers in your mobi</EM4> that you should check out.\n\nThanks in advance.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Scan_05_title=Large Deposit Of Ore To Confirm
Battaglia_RPT_Scan_06_desc,P=*********** People's Alliance ***********\n******/ 'Stronger When United' /******\n\nRE: Priority Ore Scan\n\nWORK BRIEF: \nI'm looking for people to go out and find deposits of <EM4>~mission(Resources)</EM4> to contribute to a system-wide experiment that will help plan future mining operations. ~mission(Rarity)\n\nAlso, if you're stuck of where to look or new to mining, <EM4>the United Resource Workers wrote a helpful journal that you should check out. It's in your mobi.</EM4>\n\nHope I can rely on you.\n\nPAYMENT:\nStandard listed rate upon full area scan confirmation.\n\nAUTHORIZATION:\nBattaglia, Recco
Battaglia_RPT_Scan_06_title=High Priority Ore Scan
