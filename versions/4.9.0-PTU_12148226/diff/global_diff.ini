item_Desc_mrai_boots_01_01_01,P=The Neutrino Racing Boots use synthetic fabrics sourced from Xi’an artisans to create a comfortable pair of boots that are durable enough to endure the stresses of high-velocity racing. Taking inspiration from traditional Saisei culture and aesthetics,  the design of these special Mirai edition boots are striking but elegant.
item_Desc_mrai_flightsuit_01_01_01,P=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nItem Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nThe Neutrino Racing Flight Suit uses synthetic fabrics sourced from Xi’an artisans to create a comfortable flight suit durable enough to endure the stresses of high-velocity racing. Taking inspiration from traditional Saisei culture and aesthetics, the stark red stripe across the body of this special Mirai edition results in a striking but elegant design.
item_Desc_mrai_flightsuit_01_03_01,P=Item Type: Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nEmbody luxury, style, and speed by stepping into this Sakura Sun Neutrino flight suit, inspired by those worn by the Origin racing team. This officially sanctioned crisp white flight suit features blue and grey highlight and the Origin logo in several prominent places. 
item_Desc_mrai_flightsuit_01_04_01,P=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\n\nBold neon yellow and vivid blue combine to make the special edition Neutrino racing flight suit stand out from the crowd. Designed to the same standards as the flight suits worn by professional racers, it features logos from official sponsors to mimic the Murray Cup racer suits.
item_Desc_mrai_flightsuit_01_05_01,P=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nThe limited edition Neutrino racing flight suit embraces the iconic look of the cartoon character Star Kitten. Inspired by those worn by Team Takahashi racers, the flight suit is primarily pink with teal highlights and large images of Star Kitten on the front and back.
item_Desc_mrai_flightsuit_01_07_02,P=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nMake an unmissable statement in this Neutrino racing flight suit. Fitting like a second skin without skimping on style, the WhiteHot edition's pure-white profile enhanced by red accents offers a combination of eye-catching style and function, allowing you to concentrate on what matters most: winning.
item_Desc_mrai_flightsuit_01_07_12,P=Item Type: Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nA racing flight suit that fits like a second skin without skimping on style, the Neutrino BlackFire edition has a sleek monochrome profile enhanced by pale gray accents and offers a low-key combination of looks and protection, allowing you to concentrate on what matters most: winning.
item_Desc_mrai_flightsuit_01_07_18,P=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nCut a dashing figure in this Neutrino racing flight suit. Fitting like a second skin without skimping on style, this special BlueFlame edition sports a dark blue profile enhanced by red and white accents offers a combination of eye-catching style and function, allowing you to concentrate on what matters most: winning.
item_Desc_mrai_flightsuit_02_01_01,P=Item Type: Racing Flight Suit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +100%\nCarrying Capacity: 8.0 µSCU\n\nNeed a bit of luck to help you cross the finish line? Sakura Sun's exclusive Fortuna edition of the Neutrino Racing Flight Suit in green with shimmering accents may be just the thing to turn your fortune around.
item_Desc_mrai_flightsuit_helmet_01_01_01,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe Neutrino Racing Helmet uses advanced Xi’an materials to create a comfortable, lightweight helmet durable enough to endure the stresses of high-velocity racing. Taking inspiration from traditional Saisei culture and aesthetics, the stark red highlight and special edition Mirai branding results in a striking but elegant design.
item_Desc_mrai_flightsuit_helmet_01_03_01,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nPlunge headlong into extreme speed in comfort and style with this special edition Origin-inspired Neutrino racing helmet. Primarily white with black and blue highlights, the helmet features a wide visor for unobstructed views as you speed by.
item_Desc_mrai_flightsuit_helmet_01_04_01,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThis special edition Neutrino racing helmet was made to pay homage to Murray Cup racers. Neon yellow, blue, and packed full of logos from official race sponsors, the helmet is both lightweight and supremely comfortable.
item_Desc_mrai_flightsuit_helmet_01_05_01,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nSakura Sun's take on the iconic racing helmet worn by Team Takahashi racers can now be yours. This special edition Neutrino helmet features vibrant pink with Star Kitten iconography on the front and back, plus playful teal whiskers across the faceplate.
item_Desc_mrai_flightsuit_helmet_01_06_01,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nNeed a bit of luck to help you cross the finish line? Sakura Sun's exclusive Fortuna edition of the Neutrino Racing Helmet in shimmering green may be just the thing to turn your fortune around.
item_Desc_mrai_flightsuit_helmet_01_07_02,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nThe Neutrino racing helmet utilises advanced Xi’an materials to create a comfortable, lightweight design durable enough to handle the stresses of high-velocity racing. The WhiteHot edition features a bright white and red finish paired with a sleek, minimalist aesthetic.
item_Desc_mrai_flightsuit_helmet_01_07_12,P=Item Type: Racing Helmet\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\n\nSakura Sun utilises advanced Xi’an materials to create a comfortable, lightweight helmet durable enough to handle the stresses of high-velocity racing. The Neutrino BlackFire edition helmet features a dark gray finish paired with a sleek, minimalist aesthetic.
