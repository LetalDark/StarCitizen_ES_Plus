Intersec_TSG_Assist_Solo_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Vanduul\nEquipment Specs: Combat Ready\nBriefing: \nAn Idris-class People's Alliance security vessel named Tranquility is currently engaged with a <EM>Vanduul capital ship</EM4> near an old <EM4>QV Extraction station</EM4> and Intersec is looking for combat pilots to lend some support.\n\nScramble to the AO and <EM4>engage Vanduul fighters so the Tranquility can focus on the capital ship</EM4>. \n\nGood luck,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.
Intersec_TSG_Assist_Solo_Title_001=Assist People's Alliance Vessel Tranquility
Intersec_TSG_Assist_Solo_obj_long_01=Protect the Tranquility by defeating all of the ~mission(WaveName).
Intersec_TSG_Assist_Solo_obj_marker=Tranquility
Intersec_TSG_Assist_Solo_obj_short_01=~mission(WaveName)
Intersec_TSG_Assist_Solo_obj_wavetracker=Vanduul Waves Defeated: %ls
Intersec_TSG_Assist_Solo_wavename=Vanduul Fighters
Intersec_TSG_BombRun_Solo_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Shattered Blade\nEquipment Specs: Combat Ships w/Ordnance\nBriefing: \nLocal assets have indicated that Shattered Blade elements are attempting to rebuild one of their stations and Intersec is looking for a pilot to make sure that doesn't happen.\n\nThey've managed to get basic turret defenses back online but currently only have <EM4>two power relays activated</EM4>. These will be your targets as they <EM4>cannot be destroyed by energy weapons, you will need to bring ballistic or ordnance to be effective</EM4>. \n\nReactivation of this station will allow the Shattered Blade to try and reclaim a foothold in this system and we can't let that happen.\n\nGood luck,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.
Intersec_TSG_BombRun_Solo_Title_001=Strategic Bombing
Intersec_TSG_CollectData_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Vanduul\nEquipment Specs: N/A\nBriefing: \nCaptain Martel from the People's Alliance vessel Tranquility reached out to say that they had conscripted you to retrieve data drives from the destroyed Vanduul capital ship.\n\nBe careful in the extraction of the said drives and deliver them to the People's Alliance for analysis once completed.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.
Intersec_TSG_CollectData_Title_001=Retrieve Vanduul Data
Intersec_TSG_DefendShip_Solo_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Shattered Blade\nEquipment Specs: Combat Ready\nBriefing: \nWe've received word that a People's Alliance security pilot stumbled across a Shattered Blade hideout and needs immediate assistance. \n\nHead to the abandoned station and <EM4>provide cover until they can quantum to safety</EM4>.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.
Intersec_TSG_DefendShip_Solo_Title_001=Defend People's Alliance Pilot
Intersec_TSG_EscortShip_Solo_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Shattered Blade\nEquipment Specs: Combat Ready\nBriefing: \nIntersec has intercepted chatter from Shattered Blade channels that they've captured a People's Alliance security pilot in an old extraction station that they control.\n\nWe need an experienced combat pilot to provide combat assistance so the pilot can escape. The airspace outside the hangar is swarming with hostiles, so you will <EM4>need to clear the airspace so the pilot can launch and QT safely</EM4>.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.
Intersec_TSG_EscortShip_Solo_Title_001=Extraction Mission
Intersec_TSG_Group_Desc_001=MISSION SPECS\n\nArea of Operation: Nyx System \nHostile Forces: Shattered Blade\nEquipment Specs: Strike Group\nBriefing: \nWe've received word that a People's Alliance security ship called Tranquility stumbled across  Shattered Blade hiding out in an old QV Extraction station. Details are sketchy but will connect you with local assets once on site. \n\nIntersec is looking for a team to intervene and protect the Tranquility and their personnel. Based on discussions with the Tranquility's captain, you will <EM4>need  ballistic and ordnance to break down the defenses of the station</EM4> and ultimately <EM4>get boots on the ground to save their pilot</EM4>.\n\n<EM4>Recruiting additional ships</EM4> to support you in this mission is absolutely critical. You will <EM4>need a variety of ship types</EM4> to balance multiple combat zones in space and on the ground.\n\nRespectfully,   \n\nDeacon Tobin \nOperations Manager \nInterSec Defense Solutions  \n\nThis communication consists of confidential information solely intended for the recipient. Please disregard if received in error and notify the sender. All operations are conducted at the contractor’s own personal risk and must adhere to UEE and system law where applicable.
Intersec_TSG_Group_Title_001=Tactical Strike Group Needed
