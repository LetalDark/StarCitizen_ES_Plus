Highpoint_KillAnimals_Derelictoutpostscaves_Desc_E_001=Highpoint Wilderness Specialists\n\nLocal fauna populations near the derelict outpost caves at <EM4>~mission(Location|Address)</EM4> have grown beyond sustainable levels. Cull the indicated number of creatures and return for payment.
Highpoint_KillAnimals_Derelictoutpostscaves_Desc_H_001=Highpoint Wilderness Specialists\n\nThe situation at <EM4>~mission(Location|Address)</EM4> has escalated — apex predators are dominating the caves and threatening surveyor teams. We need experienced hunters to bring the population back under control.
