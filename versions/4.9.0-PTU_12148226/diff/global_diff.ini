item_DescAsgard_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Asgard with the Nightbreak livery, which is primarily black with red highlights.
item_DescBEHR_BallisticCannon_S7_Tiburon=Manufacturer: Behring\nItem Type: Ballistic Cannon\nSize: 7\n\nA dedicated anti-capital ship weapon adjusted to meet the combat demands of the Tiburon, the C-07T Ballistic Cannon delivers overwhelming offensive power, proving Behring continues to innovate in all areas of battlefield technology.
item_DescBuccaneer_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Buccaneer with the Nightbreak livery, which is primarily black with red highlights.
item_DescBuccaneer_Paint_Red_Red_Black=Featuring a fierce red base paint with black highlights, the Redline livery gives the Buccaneer a bold new look.
item_DescCOOL_VNCL_S04_Mauler=This Vanduul cooler processes the excessive heat generated by the Mauler during intense combat.
item_DescCarrack_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Carrack with the Nightbreak livery, which is primarily black with red highlights.
item_DescCarryable_1H_SQ_Flair_Coin_PirateWeek_2026=A worthy treasure for those who know where to look, this coin bears a menacing skull and a pair of cutlasses on one side making it the envy of many a pirate across the 'verse.
item_DescCarryable_2H_FL_Container_Anim_coin_case_1_concierge_a=Emblazoned with the Chairman's Club signature lion, this sleek black case with gold trim allows you to tastefully display ten commemorative coins.
item_DescCarryable_2H_FL_MissionItem_prototype_ship_component_1_a=Specifically fabricated to be compatible with Orison's floating platforms, the TH-01's metal frame and bespoke heat sinks ensure the propulsor can provide crucial lift for prolonged periods of time without risk of overheating.
item_DescCarryable_2H_FL_Safe_Locked=This safe provides secure storage for valuable or sensitive items.
item_DescCarryable_2H_SQ_aurora_mk2_model_1_stand_a=Created by Takuetsu Starships using micron-accurate lasers, this precisely fashioned and hand-finished model captures the striking angles of RSI's reimagined Aurora Mk II.
item_DescCarryable_TBO_MissionItem_TSG_FuelTank=This container from the QV Extraction Facility's operational days contains quantanium fuel that has been improperly stored causing a chemical anomaly in the fuel.
item_DescCaterpillar_Paint_Pirate=This fearsome Pirate livery for the Caterpillar features an intimidating finish with skull decals and an accounting of nefarious deeds.
item_DescClipper_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Clipper with the Nightbreak livery, which is primarily black with red highlights.
item_DescCorsair_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Corsair with the Nightbreak livery, which is primarily black with red highlights.
item_DescDRAK_CML_Chaff,P=Drake Noise Launcher
item_DescDRAK_CML_Flare,P=Drake Decoy Launcher
item_DescEclipse_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Eclipse with the Nightbreak livery, which is primarily black with red highlights.
item_DescFlair_Dashboard_Cockpit_Bot_1_a,P=Made to sit neatly on your dashboard, this companion Dashbot reacts during your travels with a large range of humorous facial expressions. Whether it's happy to see you or silently judging your piloting skills, the Emoto Dashbot is sure to make your next flight a little more fun.
item_DescGladiator_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Gladiator with the Nightbreak livery, which is primarily black with red highlights.
item_DescHTNK_VNCL_S04_Mauler=The Vanduul Mauler's Hydrogen Fuel Tank stores fuel to power the Mauler conventional engines and thrusters.
item_DescHermes_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Hermes with the Nightbreak livery, which is primarily black with red highlights.
item_DescHermes_Paint_White_Blue_Blue=Crisp white with blue accents, the Keystone livery celebrates the workers whose mining, refining, hauling, salvaging, and more have made the empire what it is today.
item_DescHullB_Paint_Black_White_Yellow=Cargo hauling takes on a bold new look with the Hull B Empyrean Livery which features a dynamic tricolor design. Yellow highlights divide a white nose from a grey engineering section lending the appearance of speed to the freighter.
item_DescHullB_Paint_Black_Yellow_Black=For the long haul cargo captains who prefer to make a subtle statement when it comes to their freighter, MISC offers the distinguished Hull B Dusk Livery. A complete grey hull highlights the ship's classic silhouette with tasteful gold trim.
item_DescHullB_Paint_Brown_White_Bronze=Even a hard working spacecraft deserves to look its best. The Hull B Horizon Livery offers a stylish two-tone grey-and-white color scheme that's ideal for turning heads at the spaceport.
item_DescHullB_Paint_White_Blue_Blue=Crisp white with blue accents, the Keystone livery celebrates the workers whose mining, refining, hauling, salvaging, and more have made the empire what it is today.
item_DescHullB_Paint_Yellow_Yellow_Black=Haulers looking to create buzz about the look of their Hull B should equip the First Light livery with its black front and yellow back sections.
item_DescINTK_VNCL_S04_Mauler=This Fuel Intake replenishes the hydrogen fuel stores for the Mauler to keep its tanks full during combat maneuvers.
item_DescIronclad_beige_beige_beige=When the job takes you to the back end of nowhere and back again, there's the Sediment livery which coats the Ironclad in a robust shade of brown.
item_DescIronclad_black_black_silver=Make the Ironclad even more imposing and impressive with the Dauntless livery, which is primarily black with striking silver highlight.
item_DescIronclad_cream_silver_silver=The Wind Chill livery for the Ironclad features crisp white paint with black highlights and silver accents.
item_DescIronclad_metal_metal_yellow=The Aquamarine livery for the Ironclad gives a metallic teal base with subtle yellow accents to make a statement, before you throw a punch.
item_DescIronclad_olive_olive_yellow=Primarily green with yellow accents, the Commando livery allows the Ironclad to blend in with forests and verdant locations. 
item_DescJDRV_ORIG_S04_890J,P=Item Type: Jump Module\nManufacturer: Origin Jumpworks\nSize: 4\n\nThis capital-class jump module was designed specifically for the 890 Jump.
item_DescKLWE_LaserRepeater_S1_mr01=Manufacturer: Klaus & Werner\nItem Type: Laser Repeater\nSize: 1\n\nFeaturing a three-barrel sequential fire design, the Klaus & Werner CF-117 Bulldog laser repeater is capable of delivering high velocity energy rounds while maintaining heat efficiency making it a favorite among new pilots who are outfitting their first ship. The Hazard-Zone edition, adorned with striking mustard yellow highlights on a black base, will have you armed and ready to fight in style.
item_DescKLWE_LaserRepeater_S2_mr01=Manufacturer: Klaus & Werner\nItem Type: Laser Repeater\nSize: 2\n\nThe CF-227 Badger is Klaus & Werner’s dependable size two repeating laser. Its increased output and high rate of fire make it a solid contender in any fight. The Hazard-Zone edition, adorned with striking mustard yellow highlights on a black base, will have you armed and ready to fight in style.
item_DescKLWE_LaserRepeater_S3_mr01=Manufacturer: Klaus & Werner\nItem Type: Laser Repeater\nSize: 3\n\nThe CF-337 Panther is the size three model in Klaus & Werner's laser repeater line. The Panther is a true fire-and-forget weapon with a respectable power consumption-to-damage ratio. Pilots who outfit their ships with Panthers rarely regret the decision. The Hazard-Zone edition, adorned with striking mustard yellow highlights on a black base, will have you armed and ready to fight in style.
item_DescM80_Paint_black_black_orange=Black envelopes most of the Afterglow livery for the M80 while orange accent lines provide a pop of color.
item_DescM80_Paint_black_darkgrey_lightgrey_camo=Customize your M80 ship with this gray camo livery.
item_DescM80_Paint_red_black_blue=Featuring a brilliant red that produces a radiant shine, the Blaze livery transforms the M80's nose with an inky black, pale blue accents, and dark gray wings.
item_DescM80_Paint_teal_black_green=Turn heads with the Tetra livery, featuring a shimmering teal, light green accents, and a sharp black nose.
item_DescM80_Paint_white_white_blue=Soar through the sky in style with the Dynasty livery, predominantly featuring a crisp white with soft accents of black and blue.
item_DescMISC_Hull_B_MRCK_S06_Bespoke=Item Type: Missile Rack\nManufacturer: MISC\nSize: 6\nMissiles: 8xS3\n\nBespoke missile rack for the MISC Hull B that fires eight S3 missiles.
