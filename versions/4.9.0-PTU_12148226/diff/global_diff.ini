item_Desc_mrai_gloves_01_01_01,P=The Neutrino Racing Gloves use synthetic fabrics sourced from Xi’an artisans to create a comfortable pair of gloves that are durable enough to endure the stresses of high-velocity racing. Taking inspiration from traditional Saisei culture and aesthetics, the design of these special Mirai edition gloves are striking but elegant.
