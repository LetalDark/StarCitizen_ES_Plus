Cornerstone_RepUI_Description="Building on the Foundations of our Past."\n\nOne of the oldest construction companies in the 'verse, Cornerstone Developments prides itself on being a pioneer of pre-fabrication colony construction. At the forefront of the new frontier, they were responsible for building some of the first settlement structures in systems such as Rhetor, Croshaw, and Vega. Now, their fleet of workers can be found across the empire performing on-demand construction of pre-fab buildings and space stations, as well as general maintenance and repairs.
