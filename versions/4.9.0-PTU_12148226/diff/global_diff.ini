TheCollector_Recipes_Desc_L22Wolf=Wikelo very excited. Have idea for new material. But making it is most tricky. Very complicated. Need help fabricating a test sample. I give you blueprint, you make, bring to me, and I will trade. Give you extra special L-22 Wolf. Very powerful, very wolf.
TheCollector_Recipes_Desc_NoneAR=This rifle is very good at shooting, but could have nicer design. Wikelo fix. Looks very nice now. Give to you for trade. Bring me things, I give you rifle. Even give you blueprint if you need.
TheCollector_Recipes_Desc_SuperHeavyCombat=This armor is big, yes! Protect you real good. Wikelo make it extra bright so everyone can see how good your armor is. If you bring the things I need, I trade for it.
TheCollector_Recipes_Desc_VGLflightsuit=Ships have big windows. Everyone can see you flying. You should look the best. Wikelo has very good flight suit for you. Do trade, bring me what I need and Wikelo give suit. Give blueprint as well if you do not have. 
TheCollector_Recipes_Desc_aparGatlingGun=This gun is very big and very loud. Wikelo love it. Made it extra bright so that everyone can see how special this gun is. I think you will like this so bring me trade.
TheCollector_Recipes_DrakeClipper=Clipper does a bunch of things good, but Wikelo think what if it did more fight? Then it still do all things, but now do one thing better. Good yes? I give you blueprint, you make my new metamaterial, bring to me, and I will trade. 
