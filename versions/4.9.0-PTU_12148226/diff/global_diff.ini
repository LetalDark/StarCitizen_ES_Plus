item_Desc_qrt_mantis_undersuit_01_05_01,P=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nThe Sabine embodies the advanced look and performance you expect from Quirinus Tech. This cutting edge undersuit integrates strong, yet flexible microweaves with strategically placed plating to provide protection while remaining lightweight. Featuring a sleek design, the Sabine undersuit will ensure you stay safe and stylish no matter the path ahead. \n\nPH
