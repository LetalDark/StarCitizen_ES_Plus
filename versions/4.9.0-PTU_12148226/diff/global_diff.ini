northrock_SOO_intro_desc_001=Greetings,\n\nCrusader Security Forces have contacted us seeking our expertise in dealing with an urgent situation. Several platforms near Orison have been overtaken by members of the Nine Tails gang and Northrock is eager to staff an operation to remove them and return the platforms to Crusader.\n\nThe Nine Tails have put measures in place to block all air traffic in the area, so we've been granted access to a secure shuttle that will take you, and any other members of your assault team, to the first platform.\n\nFor full disclosure, I must warn that this is not a contract for the faint of heart. I am confident though that your combat skills, you and your selected team will be fully up to the challenge. \n\nOnce you've arrived at the shuttle I'll be in touch directly with more information.\n\nSpeak more soon,\nAdrienne Du-Buisson\nLogistics Officer - Stanton Branch\nNorthrock Service Group
northrock_SOO_intro_title_001=Orison Platforms Under Attack
northrock_SOO_repeat_desc_001=Glad to have you undertaking this operation for Northrock. Here is the full brief:\n\nYour priority is to <EM4>disable all three Identify Friend or Foe Inverters</EM4> that are blocking Crusader Security from accessing the airspace around these platforms. Once the inverters are offline, Crusader Security will be able to fly their ships in and resecure the platforms. In the meanwhile, the platforms are connected by a series of shuttles unaffected by the inverters and will serve as your main form of transport between them.\n\nBe aware that you will meet heavy resistance as you progress. Crusader has tried multiple times to deal with this incursion themselves but have thus far been unsuccessful. However, we believe a small strike team will prove more effective in dealing with the Nine Tails forces. \n\nAdditionally, in the spirit of full cooperation, Crusader has given you carte blanche to utilize any of the resources you discover that may prove helpful to the mission. \n\nBest of luck,\nAdrienne Du-Buisson\nLogistics Officer - Stanton Branch\nNorthrock Service Group
northrock_SOO_repeat_title_001=Retake Platforms From Nine Tails
