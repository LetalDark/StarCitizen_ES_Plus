DefenseCon_2956_125a_SlateCamo_Desc=Manufacturer: Origin Jumpworks\nFocus: Light Fighter\n\nRisks were meant to be taken, but why risk running out of fuel in the heat of battle? With the AIR fuel system, a souped-up weapons package, and all the luxury and refinement you've come to expect from Origin Jumpworks, the 125a has been designed for the discerning maverick.\n\nWith the sleek black Slate Camo livery, you'll maintain the element of surprise without compromising on style.
DefenseCon_2956_Asgard_SkyForge_Desc=Manufacturer: Anvil Aerospace\nFocus: Drop Ship\n \nAs the battles of today continue to grow in scale and complexity, Anvil Aerospace understands the impact a single vehicle can have on the outcome. Enter the Asgard. The next generation in ground vehicle transport, the Anvil Asgard features a quick-load ramp, a sizeable hold to securely store your assault vehicle of choice, and hefty array of armaments to ensure access to even the most combat-heavy of drop sites.\n\nMainly blue, the Sky Forge livery for the Asgard also features black and red accents.
DefenseCon_2956_Aurora_MK2_Cloudbuster_Desc=Manufacturer: Roberts Space Industries\nFocus: Starter / Light Freight\n \nA new take of the classic ship, Roberts Space Industries has reimagined the tried-and-true Aurora from the struts up. Introducing the Aurora Mk II. The ship’s performance, usability, and styling has been overhauled for a new generation of pilots. This latest version introduces swappable modules to the Aurora. Rather than locking pilots into a single career path, these modules allow for straightforward operational specialization from the comfort of your hangar. Now including the DM Module, which RSI designed to increase the combat capabilities of the Aurora Mk II. The optional DM Module is on display here.\n\nThe Cloudbuster livery utilizes a contrasting pale gray against a rich blue, finished with playful yellow highlights.
DefenseCon_2956_Buccaneer_Stormbringer_Desc=Manufacturer: Drake Interplanetary\nFocus: Light Fighter\n\nThe Buccaneer has been designed from the ground up to fly and fight the way you live. No leather interiors or hyperpillows here: the Bucc is a scrapper designed to maneuver and fight above its weight class. This rough-and-tumble frontier fighter can be maintained in the worst of conditions in order to keep real, working space crews alive.\n\nBlending blue and black with white accents, the Stormbringer paint scheme gives the ship an electric new look.
DefenseCon_2956_C8R_Pisces_Heartbeat_Desc=Manufacturer: Anvil Aerospace\nFocus: Exploration / Pathfinder\n\nWith its compact frame, deft maneuverability, and seating for three, the C8R Pisces snub craft, included with every Carrack, is built by Anvil Aerospace for medical rescue operations thanks to its Tier 3 medbed.\n\nA bright red base color and neon yellow highlights makes the Heartbeat livery for the C8 Pisces easy to identify from a distance during rescue operations.
DefenseCon_2956_Clipper_Basalt_Desc=Manufacturer: Drake Interplanetary\nFocus: Generalist\n \nIf there’s one thing every captain needs to take to heart as they prepare to journey across the stars it’s “expect the unexpected.” With a cargo bay, medical facilities, and crafting capabilities, along with Drake’s practical design sensibility, the Clipper is the perfect all-arounder for any new spacefaring enterprise.\n\nMainly black, the Basalt livery also brings red and cream highlights to the Clipper.
DefenseCon_2956_Corsair_Eternity_Desc=Manufacturer: Drake Interplanetary\nFocus: Expedition\n\nHeed the call of uncharted space and harness the spirit of exploration with the Drake Corsair. Utilizing a unique asymmetrical hull design, this versatile explorer can go wherever the winds of adventure may steer you.\n\nBecome one with the darkness of space with the Eternity livery for the Corsair, which is black with subtle red accents.
DefenseCon_2956_Cutlass_Steel_Coalfire_Desc=Manufacturer: Drake Interplanetary\nFocus: Medium Fighter / Medium Troop Transport\n\nWith the Cutlass Steel, Drake Interplanetary has once again reinvented their classic design to create a next generation combat transport ship through the addition of dedicated jump seats and an expanded arsenal. It’s a dangerous ‘verse out there, and the Cutlass Steel is ready to cut a path through whatever stands in the way of you and your dedicated crew. \n\nKeep your Cutlass looking sharp with the Coalfire livery that's primarily grey with red highlights.
DefenseCon_2956_Cutter_Caiman_Desc=Manufacturer: Drake Interplanetary\nFocus: Starter / Pathfinder\n\nDesigned for hard-working folks of all stripes, the Cutter packs 4 SCU of cargo room and plenty of wallop into a rough and tumble, compact frame. It's a ship that truly embodies the spirit of Drake: that no matter who you are or what you do, you can reach the stars.\n\nGreen and white with orange highlights, the Caiman livery brings a distinct and dramatic look to the Cutter.
DefenseCon_2956_Cyclone_MT_Timberline_Desc=Manufacturer: Tumbril Land Systems \nFocus: Anti-Air\n\nFollowing the success of the initial release of the Cyclone, Tumbril has taken your feedback and expanded their popular line of tactical vehicles with the all new Cyclone MT. Outfitted with a combination gun and missile turret, this module offers increased combat options in the field.\n\nCustomize your Cyclone with the Timberline livery that's olive green with orange accents.
DefenseCon_2956_DragonflyBlack_Coalfire_Desc=Manufacturer: Drake Interplanetary\nFocus: Racing\n\nThe Drake Dragonfly is the perfect snub ship for anyone looking to live on the edge. With nothing separating the pilot from the dangers of space, the Dragonfly is as much an adventure as a ship! Dual-mode conversion allows the Dragonfly to operate on the ground or in space, and a rear-facing second seat means you can even take a passenger!\n\nKeep your Dragonfly looking sharp with the Coalfire livery that's primarily grey with red highlights.
DefenseCon_2956_Eclipse_Ambush_Desc=Manufacturer: Aegis Dynamics\nFocus: Stealth Bomber\n\nThe Aegis Eclipse is a bomber designed to get in and strike before it's ever even spotted. After extensive service with the UEE, this high-tech military equipment made its civilian market debut in 2947.\n\nMake the Eclipse harder to spot with the Ambush Camo livery, featuring a camouflage pattern to help break up the visual perception. 
DefenseCon_2956_F7C-M_SuperHornet_MK2_Tigerveil_Desc=Manufacturer: Anvil Aerospace\nFocus: Medium Fighter\n \nRefining their renowned military-class superiority fighter with the most up-to-date technology, Anvil Aerospace has crafted the F7C-M Super Hornet Mk II,  retaining the second seat and ball turret that made the original a truly terrifying mark to engage.\n\nThe dynamic Hornet Mk II deserves a livery to match. The Tigerveil livery consists of a steely blue with bold orange and subtle black highlights.
DefenseCon_2956_F8C_Lightning_Stormfire_Desc=Manufacturer: Anvil Aerospace \nFocus: Heavy Fighter\n\nFew vehicles employed by the proud men and women who serve in our Empire's Navy inspire the awe of the legendary F8 Lightning. A force to be reckoned with, the F8 has secured Humanity's freedom from numerous threats at home and abroad countless times. Now, that same next generation space superiority fighter is available to become a part of your personal fleet with the Anvil F8C civilian variant.\n\nCut a classic profile through any battlefield with the Stormfire livery for Anvil's new F8C Lightning. Featuring a triple-coat of Kalding paint rated for a variety of atmospheres and conditions, this sleek platinum look will keep you looking good for years to come.
DefenseCon_2956_Fury_MX_Templar_Desc=Manufacturer: Mirai\nFocus: Snub Fighter\n\nFeaturing best-in-class maneuverability and fully integrated, cutting-edge Xi’an tech, the next-generation Fury MX snub fighter from Mirai uses its twenty halo-mounted missiles to devastate targets during short-range space combat.\n\nMirai made the Templar livery a stark white with red and black highlights to give the Fury a look that would be at home among the clouds.
DefenseCon_2956_Guardian_MX_Vector_Desc=Manufacturer: Mirai\nFocus: Heavy Fighter\n\nTaking the framework of the Guardian fighter and adding even more offensive options, the Mirai Guardian MX packs additional firepower and armor ideal for overwhelming opponents. While not as nimble as the base Guardian, this heavy fighter is still more agile than many other ships in its class.\n\nContrasting whites, reds, and blacks create strikingly angular design on the Vector livery.
DefenseCon_2956_Ironclad_Assault_XXXXX_Desc=Manufacturer: Drake Interplanetary\nFocus: Dropship\n \nWhen the special delivery you have to make is a full-blown incursion, you need the Drake Ironclad Assault. Not only can it fit multiple ground vehicles into its hold, it has turrets along its underside to clear the way for landing, and even a fabrication bay for emergency repairs.
DefenseCon_2956_Kraken_Desc=Manufacturer: Drake Interplanetary\nFocus: Light Carrier\n\nThe Kraken is a protector and a beacon of freedom in a too-often cruel universe. For those tasked with safekeeping Citizens unable to protect themselves, the Kraken is both a sanctuary and a self-contained war machine ready to take on the most daunting adversaries. Drake has thrown out the rule book to redefine private-use capital-class ships, attack carriers, and the very nature of personal freedom. It's nothing if not a testament to the empowerment of the people.\n\nThe Kraken will be unleashed in 2957...
DefenseCon_2956_L-21_Wolf_Rosso_Desc=Manufacturer: Kruger Intergalactic\nFocus: Light Fighter\n\nMeet a ship almost 400 years in the making, and well worth the wait. Kruger Intergalactic is excited to present their first independently manufactured ship, the Wolf. Combining speed, style, and an impeccably precise design, the L-21 Wolf is not only a showcase for Kruger but is battle-ready to hunt alone or in packs with a powerful array of armaments, including two bespoke S4 ballistic gatlings.\n\nLive bright and bold with the stark red of the Rosso livery and ensure that everyone will see the unique beauty of the Kruger Wolf.
DefenseCon_2956_L-22_AlphaWolf_Antilles_Desc=Manufacturer: Kruger Intergalactic\nFocus: Light Fighter\n\nMeet a ship almost 400 years in the making, and well worth the wait. Kruger Intergalactic is excited to present their first independently manufactured ship, the Wolf. Combining speed, style, and an impeccably precise design, the L-22 Alpha Wolf is not only a showcase for Kruger but is battle-ready to hunt alone or in packs with a powerful array of armaments, including two bespoke S4 laser repeaters.\n\nThe Antilles livery for the Wolf features a vibrant, electric blue base paint and bright red tail section.
DefenseCon_2956_M80_XXXXX_Desc=Manufacturer: Origin Jumpworks\nFocus: Heavy Fighter\n\nEmbrace elegance without compromising defense with the M80. Featuring Origin's famous sleek and sophisticated design, the ship's hull slyly hides an aggressive weapons systems that can be unfurled and unleashed on assailants at a moment's notice.\n\nBlack envelopes most of the Afterglow livery while orange accent lines provide a pop of color.
DefenseCon_2956_MDC_Baracus_Desc=Manufacturer: Greycat Industrial\nFocus: Anti-Air\n \nBuilding upon a robust and sturdy industrial frame, Greycat has crafted the MDC Mobile Defense Center into an effective combat vehicle ready to protect your interests from remote mining sites to patrolling high-value processing centers thanks to its mounted PDS turret. \n\nBold red highlights add a bit of color and break up the black base paint of the MTC Baracus livery, which can also be applied to other Greycat M-Series vehicles.
DefenseCon_2956_MTC_Filament_Desc=Manufacturer: Greycat Industrial\nFocus: Pathfinder\n\nAs an expert in industrial operations, Greycat understands that jobsite security is a vital part of any successful business venture. To be fully effective, you need to be able to get your security personnel and their equipment to wherever they’re needed most. That’s why the MTC Mobile Tactical Center is such an important addition to your next venture. Nimble enough to access the difficult terrain encountered at remote operations and equipped with enough suit lockers, weapon racks, and storage to tackle a wide host of issues, the Greycat MTC could make all the difference when it comes to turning a potential problem into potential profit.\n\nEquip the Filament livery to make the MTC grey with black and yellow highlights. It's also compatible with other Greycat M-series vehicles.
DefenseCon_2956_Meteor_LaserWeapon_Shimmer_Desc=Manufacturer: RSI\nFocus: Medium Fighter\n\nPacking some serious firepower, the Meteor is a sight enemies won't want to see. Taking inspiration from the iconic Mantis, this heavy fighter forgoes quantum enforcement and instead features two bespoke S5 ballistic cannons and four single-load S4 missile racks; making the Meteor a force that can light up the sky like a shooting star. The optional Echion laser repeater is on display here.\n\nThe eye-catching Shimmer livery brings a beautiful luster to the Meteor with a paint that shifts between gold and dark blue depending on the lighting and viewing angle.
DefenseCon_2956_Mule_Reburn_Desc=Manufacturer: Drake Interplanetary\nFocus: Light Freight\n\nThe six-wheeled Drake Mule is a dependable workhorse for all sorts of loading and hauling jobs. Whether transporting cargo over rough terrain or ferrying it onto larger vessels and cargo decks, the Mule sees even the toughest contracts through to the end. Plain and simple.\n\nWho says you can't have a bit of fun while on the job? The Reburn livery for the Drake Mule brings a red tint to the cockpit glass and cargo cover.
DefenseCon_2956_Nova_EmberStorm_Desc=Manufacturer: Tumbril Land Systems\nFocus: Heavy Tank\n\nTumbril's new Nova is a classic battlefield warrior, reimagined for the modern age. This heavy tank offers a devastating combination of weaponry to eliminate threats on the ground and in the air.\n\nFeaturing a tan, red and black camo paint scheme ideal for desert environments, the Nova Ember Storm livery offers a devastating combination of weaponry to eliminate threats on the ground and in the air.
DefenseCon_2956_Perseus_Flintlock_Desc=Manufacturer: RSI\nFocus: Heavy Gunship\n\nWhen RSI set out to make the definitive modern statement in persuasive prevention, they looked into their own past, to the historic gunships designated Perseus. Capable of shredding sub-capital class goliaths, the mere presence of a Perseus gunship in a blockade or patrol squad is enough to make your most aggressive enemies think twice before engaging, just like its vintage namesake.\n\nAccentuate the strong, angular design of the Perseus with the Flintlock livery. A distinct white section across the middle of the ship divides the pointed front half from the dark foreboding back.
DefenseCon_2956_Pitbull_XXXXX_Desc=Manufacturer: Drake Interplanetary\nFocus: Snub Fighter\n\nA lean, mean fighting machine. The Pitbull combines high speed maneuvering with raw firepower to bring you a hard-hitting juggernaut - all in a small, single pilot package.\n\nWhen you want them to see you coming, the Hardstrike livery is a bold explosion of yellow to make every fight even more vibrant.
DefenseCon_2956_Pulse_StarKitten_Desc=Manufacturer: Mirai\nFocus: Combat\n \nThe engineers at Mirai set out to craft an open-canopy bike capable of more. A more intimate connection between pilot and performance with a form-fitting silhouette. A more intuitive way to tame formidable landscapes with a responsive grav-lev system. A more intelligent combat experience with a custom weapon fully integrated into the spirit of the vehicle. The end result? The Mirai Pulse.\n\nEmbody Sally the Star Kitten's racing spirit with this custom Mirai Pulse livery. Combining the bright pinks and pale blues of the beloved cartoon mascot, this livery's smiling decals bring a playfulness your competitors are sure to enjoy.
DefenseCon_2956_STV_BlueSteel_Desc=Manufacturer: Greycat Industrial\nFocus: Passenger\n\nGet ready to have some serious fun on the job with the STV from Greycat. This Sport Terrain Vehicle was built by pros for pros and features blazing speed and convenient built-in storage.\n\nGround adventures never looked so good with the Blue Steel livery, which gives the STV a sleek silver finish trimmed with vibrant blue.
DefenseCon_2956_Shiv_Nightmare_Desc=Manufacturer: Unknown\nFocus: Heavy Fighter\n\nCrudely constructed from a patchwork amalgamation of various spaceships, this brutal fighter's made to survive the harsh realities of unclaimed space proving that it's not the brand of your ship that matters, it's what you do with it. \n\nFeaturing a sinister skull atop a brown base paint, the Nightmare livery gives the Shiv a look that sends shivers down the spine.
DefenseCon_2956_Starfighter_inferno_Polar_Desc=Manufacturer: Crusader Industries\nFocus: Heavy Fighter\n\nWhether heading up a crew or hunting big ships solo, the Ares Inferno is a force to be reckoned with. This ballistic Gatling-equipped variant tears through gunship armor and turns smaller fighters to dust in seconds.\n\nModify your Ares Star Fighter with this white and grey Polar Camo livery.
DefenseCon_2956_Starlite_XXXXX_Desc=Manufacturer: MISC\nFocus: Light Refueling\n\nIf there’s one constant in the universe, it’s that ships will eventually run out of fuel. That’s where the Starlite come in. Featuring two standard fuel pods and a scaled back, elegant design, the Starlite was meticulously crafted by the engineers at MISC to offer refueling services to ships in need wherever they may be stranded.
DefenseCon_2956_Storm_AA_Darkside_Desc=Manufacturer: Tumbril Land Systems\nFocus: Light Tank\n\nOriginally introduced in 2606 during the Second Tevarin War, the Tumbril Storm single-operator mini-tank was built to blitz battlefields and take out enemy artillery. Reimagined from the ground up to be faster, stronger, and more impactful than ever, the Storm AA is a true force of nature, equipped with a barrage of missiles to provide cover against airborne and ground targets.\n\nThe Darkside livery gives the Storm a black and grey camouflage pattern to make it hard to see in low light situations.
DefenseCon_2956_Tiburon_XXXXX_Desc=Manufacturer: Aegis Dynamics\nFocus: Heavy Gunship\n\nAn evolution of a proven Aegis design, the Tiburon's anti-capital ship configuration comprises a spine mounted forward facing beam weapon, supplemented by side mounted turrets.\n \nCombining shades of gray, white and silver, the Enforcer livery emphasizes the sturdiness of the Tiburon with its layered appearance.\n
DefenseCon_ArmorDisplay_Anvil=Rising to prominence as one of the UEE’s most trusted makers of military hardware over the last two centuries, their clarity of vision and unmatched quality has made an indelible mark on Humanity’s history.
DefenseCon_ArmorDisplay_Drake=With a passionate following of loyal pilots who love their no-nonsense approach to spacecraft, this sometimes-controversial ship manufacturer continues to defy expectations.
DefenseCon_ArmorDisplay_Kruger=What began as a renowned precision parts manufacturer has grown to become the maker of elegantly designed and meticulously crafted spaceships. 
DefenseCon_ArmorDisplay_MurrayCup=Unquestionably the premier racing league in the empire, it has made household names of skilled pilots who are quick off the line, a deft hand at tight turns, and ready to push beyond the limits.
DefenseCon_DisplayOnly_Sign,P=                                                                    For Display Only
DefenseCon_OutlawDisplay_NineTails_Desc=Despite their growing reputation, little is known publicly about the gang or its inner workings; making the group’s meteoric rise to power only more worrisome to organized crime experts. Today, the Nine Tails gang operates almost exclusively within the Stanton system, using the infamous derelict space station known among locals as ‘Grim HEX’ as its headquarters.
DefenseCon_OutlawDisplay_NineTails_Title=Nine Tails
DefenseCon_OutlawDisplay_ShatteredBlade_Desc=One of the most significant suppliers of black-market alien tech, these smugglers have been escalating tensions in Nyx thanks to their aggressive methodologies that have been drawing the ire of the Vanduul and increasing raids across the system. 
DefenseCon_OutlawDisplay_ShatteredBlade_Title=Shattered Blade
DefenseCon_OutlawDisplay_XenoThreat_Desc=Preaching a viciously anti-UEE and xenophobic rhetoric, XenoThreat forces have used their hideouts in Pyro to launch dozens of attacks against civilian and corporate structures across the empire in pursuit of their Human-first agenda.
DefenseCon_OutlawDisplay_XenoThreat_Title=XenoThreat
DefenseCon_VanduulDisplay_Desc=This aggressive alien species composed of independent warrior clans has been plaguing the empire for centuries with their brutal raids on Human systems and settlements. In 2945, increased hostilities following the Battle of Vega have led the UEE to formally declare war against these cruel and sadistic invaders.
DefenseCon_VanduulDisplay_Title=Vanduul
Event_ShipTitle_Ironclad=The Ironclad
FTLCourier_RepUI_Area=UEE
FTLCourier_RepUI_Description=Specializing primarily in the delivery of small, handheld parcels, FTL have established a reputation as the empire’s #1 courier service. As a company, FTL are always seeking new ways to ensure clients’ shipments get where they are going faster and more securely, ensuring that “when you need a parcel delivered, nothing's Faster Than Light.”
FTLCourier_RepUI_Focus=Courier Services
FTLCourier_RepUI_Founded=2865
FTLCourier_RepUI_Headquarters=Sherman, Castra II, Castra System
FTLCourier_RepUI_Leadership=Ignacio Slade, CEO
FTLCourier_RepUI_Name=FTL Courier
Factions_Moraine_DisplayName,P=Moraine
Foxwell_DefendDestructibleEntites_E_Desc_001=Any willing pilots in the area? Need some protection around <EM4>~mission(Location|Address)</EM4> for a client. A band of outlaws has been targeting their <EM4>~mission(Objects)</EM4>, and if nothing's done about it they'll do some real damage. Need someone to protect the client’s property as much as possible and deal with the thugs.\n\nFrom the intel we’ve managed to gather, these thugs are small-time but can cause some pain if you’re not careful. So, if you manage to nail this to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendDestructibleEntites_E_Title_001=Yellow Lvl. Contract: Protect ~mission(Objects)
Foxwell_DefendDestructibleEntites_H_Desc_001=One of our high priority clients is under attack from a criminal gang targeting their <EM4>~mission(Objects)</EM4> in <EM4>~mission(Location|Address)</EM4>. The client’s assets are valuable, so we need to keep those safe at all costs, but I won’t kid – it’ll be a challenge and a half with these thugs determined to do some real damage. \n\nIf it were me, I wouldn’t hesitate to <EM>bring backup</EM4> to deal with them. They’re no joke, so we’re offering a well-earned <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor who deals with these guys successfully. \n\nBest of luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendDestructibleEntites_H_Title_001=Orange Lvl. Contract: Protect ~mission(Objects)
Foxwell_DefendDestructibleEntites_M_Desc_001=I'm hoping that you'll be able to provide protection services at <EM4>~mission(Location|Address)</EM4>. One of our high priority clients is having some real trouble with a band of outlaws targeting their ~mission(Objects). Need to be able to keep the assets as safe and intact as possible. Client’s expecting the service they pay for, so don’t mess this up or we might lose a loyal customer.\n\nFor now, we’re still a little in the dark when it comes to these outlaws, but if you manage to nail this to the Foxwell standards, we’re offering  <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendDestructibleEntites_M_Title_001=Orange Lvl. Contract: Defend ~mission(Objects)
Foxwell_DefendDestructibleEntites_S_Desc_001=An emergency contract just came through about a gang of violent thugs wreaking havoc on one of our VIP clients’ infrastructures. If available, we need you to rush to <EM4>~mission(Location|Address)</EM4> and defend the client’s extremely valuable <EM4>~mission(Objects)</EM4> at all costs. \n\nFoxwell is extremely aware of this group, so believe me when I say these pilots are not to be taken lightly. I strongly recommend that you arrange a <EM> highly competent backup force</EM> to fly with you to the site.\n\nIf you manage to survive the encounter with the client’s property intact, we’re adding  <EM4>~mission(ScripAmount) MG Scrip</EM4> any main contractor brave enough to take this job on. \n\nStay safe, and good luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendDestructibleEntites_S_Title_001=Red Lvl. Contract: Protect ~mission(Objects)
Foxwell_DefendDestructibleEntites_VE_Desc_001=Calling all pilots – one of our clients is looking for some protection for their <EM4>~mission(Objects)</EM4>, based in <EM4>~mission(Location|Address)</EM4>. From what we’ve gathered, the attackers are a group of wannabe outlaw pests who probably haven’t realized the value of the assets they’re trying to destroy, just wreaking havoc for the sake of it. Still, the client’s property is important, so should be kept as intact as possible.\n\nIf you take care of them to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor. \n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendDestructibleEntites_VE_Title_001=Yellow Lvl. Contract: Defend ~mission(Objects)
Foxwell_DefendDestructibleEntites_VH_Desc_001=Urgent ship support needed at <EM4>~mission(Location|Address)</EM4>. A known destructive criminal organization has been testing the waters with one of our clients’ property for months, and has now raised hell by targeting the client’s <EM4>~mission(Objects)</EM4>. These assets are highly valuable, so need to keep those safe at all costs – though we know it’ll be no easy feat.\n\nI cannot stress enough how dangerous these guys are, so I wouldn’t hesitate to <EM>bring backup</EM> to deal with them. If you and the assets make it out intact, we’re offering a well-earned <EM4>~mission(ScripAmount) MG Scrip</EM4>  to the main contractor. \n\nBest of luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendDestructibleEntites_VH_Title_001=Red Lvl. Contract: Defend ~mission(Objects)
Foxwell_DefendEntitesAndEscort_E_Desc,P=We need a contractor to provide convoy and protection services at <EM4>~mission(Location|Address)</EM4>. One of our elite clients' are under attack from a band of outlaws targeting their <EM4>~mission(Objects) and ships</EM4>. You'll need to keep the crew safe as they traverse the area, as well as make sure the assets stay as intact. These thugs look like they can do some real damage, so be sure you engage them with caution or the client might not be the only one to take heavy losses.\n\nIf you manage to nail this to the Foxwell standards, we’re offering <EM4>~mission(ScripAmount) MG Scrip</EM4> as compensation to the main contractor. \n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
Foxwell_DefendEntitesAndEscort_E_Title,P=Yellow Lvl. Contract: Protect ~mission(Objects) and Escort Employees
Foxwell_DefendEntitesAndEscort_H_Desc,P=Crew managing one of our client's operations at <EM4>~mission(Location|Address)</EM4> have reported that they're under attack from a criminal gang targeting the <EM4>~mission(Objects) and ships</EM4> in the area. It will be your job to keep both safe at all costs. I don't have all the facts yet, but I reckon this will be a tough mission – these outlaws seem determined to do some real carnage. \n\nIf it were me, I would <EM>bring backup</EM4> to deal with them. And if you manage to protect everyone, we’re offering a well-earned <EM4>~mission(ScripAmount) MG Scrip</EM4> to the main contractor who deals with these lowlife's successfully. \n\nBest of luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
