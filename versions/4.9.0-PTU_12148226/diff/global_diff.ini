LingFamily_delivery_desc_ICC_Special_Cryo=Hi,\n\nNot sure if you ever heard of them, but a rep from the ICC (they make starmaps and study space for the empire) just reached out to us about a special job they need picked up from Wikelo's Emporium. \n\nKind of surprised to be honest that they having any dealings there since that Banu's trading-post doesn't exactly scream "cutting-edge science" to me.\n\n\nAnyway, they want the delivery brought from there to ~mission(Destination|Target|Address). They also emphasized that the cargo's very delicate so make sure that you use kid gloves when you're handling it, okay? (Not that you aren't careful normally, but you know how clients are.) \n\nBe sure to bring a <EM4>heavy-duty tractor beam</EM4> and a ship with enough space to store <EM4>~mission(MissionMaxSCUSize) cargo</EM4>.\n\nThanks,  \nConni Ling \nCargo Logistics Coordinator \nLing Family Hauling 
