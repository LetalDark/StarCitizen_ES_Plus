item_Descapar_hmg_ballistic_01_tint03=Manufacturer: Apocalypse Arms\nItem Type: HMG\nClass: Ballistic\n\nMagazine Size: 500\nRate Of Fire: 850 rpm\nEffective Range: 60 m\n\nAttachments: Bi-Pod (S4)\n\nToo large to use except with a heavy exo-suit, the Vendetta from Apocalypse Arms is a belt-fed instrument of death. What it lacks in accuracy it makes up for with a high rate of fire for complete target saturation and battlefield dominance.\n\nThe Brightstar edition features a metallic frame with royal blue highlights ready for any hero to make their stand.
item_Descbehr_pistol_ballistic_01_mr01=Manufacturer: Behring\nItem Type: Pistol\nClass: Ballistic\n\nMagazine Size: 20\nRate Of Fire: 450 rpm\nEffective Range: 25 m\n\nAttachments: Optics (S1), Barrel (S1), Underbarrel (S1)\n\nThanks to a streamlined design and a lightweight polymer frame that helps to minimize recoil, it's easy to see why the versatile and dependable S-38 from Behring has become a trusted sidearm across the Empire for both citizens and law enforcement officers. To honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the weapon with a rich blue base adorned with a sleek, flowing air design along the length of the gun.
item_Descbehr_rifle_ballistic_01_mr01=Manufacturer: Behring\nItem Type: Assault Rifle\nClass: Ballistic\n\nMagazine Size: 40\nRate Of Fire: 550 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nBehring's classic P4-AR rifle features a collapsible stock and shortened barrel, making it an ideal choice for close-quarter firefights. Its accuracy and general ease of use make it universally valued among security, military and civilian users. To honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the weapon with a rich blue base adorned with a sleek, flowing air design along the length of the gun.
item_Descbehr_rifle_ballistic_01_sf01,P=Manufacturer: Behring\nItem Type: Assault Rifle\nClass: Ballistic\n\nMagazine Size: 40\nRate Of Fire: 550 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nBehring's classic P4-AR rifle features a collapsible stock and shortened barrel, making it an ideal choice for close-quarter firefights. Its accuracy and general ease of use make it universally valued among security, military and civilian users. \n\nThe "Star Kitten" edition features Sally's signature pink with blue accents and the famous cat herself printed along the side.
item_Descbehr_rifle_ballistic_03=Manufacturer: Behring\nItem Type: Rifle\nClass: Ballistic\n\nMagazine Size: 45\nRate Of Fire: 600 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nDesigned for close quarter engagements such as boarding actions, Behring's CQ7 is a next generation bullpup battle rifle designed to dominate the rigors of the modern battlefield environment.
item_Descbehr_rifle_ballistic_03_mag=Item Type: Magazine\nCapacity: 45\n\nThis magazine for the CQ7 rifle comes pre-loaded with forty-five rounds.
item_Descbehr_rifle_ballistic_03_tint01=Manufacturer: Behring\nItem Type: Rifle\nClass: Ballistic\n\nMagazine Size: 45\nRate Of Fire: 600 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nDesigned for close quarter engagements such as boarding actions, Behring's CQ7 is a next generation bullpup battle rifle designed to dominate the rigors of the modern battlefield environment. The Blacklist edition features a dark black finish.
item_Descbehr_rifle_ballistic_03_tint02=Manufacturer: Behring\nItem Type: Rifle\nClass: Ballistic\n\nMagazine Size: 45\nRate Of Fire: 600 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nDesigned for close quarter engagements such as boarding actions, Behring's CQ7 is a next generation bullpup battle rifle designed to dominate the rigors of the modern battlefield environment. The Snowfire edition features a white and light gray finish with black accents.
item_Descbehr_rifle_ballistic_03_tint03=Manufacturer: Behring\nItem Type: Rifle\nClass: Ballistic\n\nMagazine Size: 45\nRate Of Fire: 600 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nDesigned for close quarter engagements such as boarding actions, Behring's CQ7 is a next generation bullpup battle rifle designed to dominate the rigors of the modern battlefield environment. The Infantry edition features a neutral green and brown finish with black accents.
item_Descbehr_shotgun_ballistic_01_mr01=Manufacturer: Behring\nItem Type: Shotgun\nClass: Ballistic\n\nMagazine Size: 12\nRate Of Fire: 75 rpm\nEffective Range: 15 m\n\nAttachments: Optics (S1), Barrel (S3), Underbarrel (S2)\n\nOriginally designed for the military, Behring decided to sell the BR-2 ballistic shotgun to the general public after the initial weapon testers kept requesting to take one home. Featuring a semi-auto fire mode that can rapidly deliver devastating stopping power, the BR-2 is the ideal choice for both offensive and defensive operations. The Purgatory Camo edition's grey-on-grey dressing creates a sleek, utilitarian profile.
item_Descgmni_rifle_ballistic_01_mr01=Manufacturer: Gemini\nItem Type: Assault Rifle\nClass: Ballistic\n\nMagazine Size: 30\nRate Of Fire: 300 rpm / 900 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nWith the S71, Gemini designed an ergonomic assault rifle ideal for mid-range engagements. Chambered with a smaller caliber round than other weapons in its class, the S71 has become popular among private military professionals for its sleek aesthetics and precise accuracy. \n\nThe Purgatory Camo edition boasts a stylish monochrome profile. 
item_Descgmni_smg_ballistic_01_sf01=Manufacturer: Gemini\nItem Type: SMG\nClass: Ballistic\n\nMagazine Size: 50\nRate Of Fire: 1,100 rpm\nEffective Range: 35m\n\nAttachments: Barrel (S1), Optics (S1), Underbarrel (S1)\n\nEasy to handle and a beauty to behold, the C54 is a sleek and precisely balanced SMG from Gemini. Its lightweight polymer frame and ergonomic design makes it ideal for close quarter engagements. The C54 is capable of firing 10mm rounds on full auto to provide maximum support and target saturation to ensure that any engagement ends quick. \n\nThe Ochelo edition takes its design inspiration from the Banu musical instrument of the same name.
item_Deschdgw_rifle_ballistic_01=Manufacturer: Hedeby Gunworks\nItem Type: Rifle\nClass: Ballistic\n\nMagazine Size: 25\nRate Of Fire: 320 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S3)\n\nGunsmiths at Hedeby Gunworks looked to classic ballistic designs to construct a long rifle steeped in the past and the future. The Arlington provides accurate marksmanship, an easy cycling of rounds thanks to the lever action design, and multiple fire modes. Artisans shaped the weapon's body by hand to create a piece that's equally fit for the mantle as it is on the frontier.
item_Deschdgw_rifle_ballistic_01_mag=Item Type: Magazine\nCapacity: 25\n\nThis magazine for the Arlington rifle comes pre-loaded with twenty-five rounds.
item_Descklwe_lmg_energy_01_mr01=Manufacturer: Klaus & Werner\nItem Type: LMG\nClass: Energy (Laser)\n\nBattery Size: 100\nRate Of Fire: 400 rpm\nEffective Range: 40 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S3)\n\nKlaus & Werner has created an iconic weapon with tried and true Demeco laser LMG. Used extensively in military engagements, this short-to-mid-range infantry favorite has been constructed with stability and accuracy at the forefront. \n\nThe Purgatory Camo edition mixes shades of gray for a sleek, no nonsense design.
item_Descklwe_rifle_energy_01_sf01=Manufacturer: Klaus & Werner\nItem Type: Assault Rifle\nClass: Energy (Laser)\n\nBattery Size: 45\nRate Of Fire: 450 rpm\nEffective Range: 50 m\n\nAttachments: Optics (S2), Barrel (S2), Underbarrel (S2)\n\nDependable assault weapons never go out of style. Klaus & Werner maintains that tradition by unveiling the Gallant. This energy-based assault rifle is capable of providing accurate and sustained fire at targets up to medium range, while its high-capacity power system allows operators to fire considerably more shots per battery.\n\nThe Conviction Camo edition utilizes a diffuse selection of grays to help blend in with more urban environments.
item_Descklwe_smg_energy_01_mr01=Manufacturer: Klaus & Werner\nItem Type: SMG\nClass: Laser\n\nBattery Size: 45\nRate Of Fire: 562.5 rpm\nEffective Range: 25m\n\nAttachments: Optics (S1), Barrel (S1), Underbarrel (S1)\n\nKlaus & Werner's expert craftsmanship is once again on full display to make the Lumin V laser compact energy rifle even more deadly and dependable. A new "interval autofire" mode blasts five-round barrages when the trigger is held down, utilizing the target saturation that comes with autofire while providing breaks to recompensate aim. Even when constantly on the attack, the gun's excellent design provides low recoil and a tight spread. To honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the weapon with a rich blue base adorned with a sleek, flowing air design along the length of the gun.
item_Descksar_gren_frag_01=Manufacturer: Kastak Arms\nItem Type: Grenade\n \nArea of Effect: 7.5 m\nDamage Type: Plasma\n \nKastak Arms Scorch plasma grenade is sure to be a devastating addition to your next battle. Once primed and ready, the Scorch will explode on impact, unleashing a burst of intense plasma damage on your target that leave a lingering hazard area behind. 
item_Descnone_rifle_multi_01_collector01=Manufacturer: Unknown\nItem Type: Assault Rifle\nClass: Ballistic\n\nMagazine Size: 45\nRate Of Fire: 525 rpm\nEffective Range: 50 m\n\nBeauty is in the eye of the beholder, and if you aim just right, so will a round from the Killshot assault rifle. What it lacks in grace, this classic design has its own scrappy charm.\n\nThe Dominion Camo edition adds a dark green camo pattern to the rifle.
item_Descutfl_crossbow_ballistic_01=Manufacturer: UltiFlex\nItem Type: Crossbow\n \nMagazine Size: 5\nRate Of Fire: 60 rpm\nEffective Range: 50 m\n \nAttachments: Optics (S3), Underbarrel (S3)\n \nThe craftsman at UltiFlex went through hundreds of prototypes to discover the perfect lightweight material with the right combination of strength and flexibility for its Novian crossbow, an ideal companion on everything from frontier expeditions to tactical infiltrations. With a pull of its firing action, the Novian near-silently launches a heavy bolt that shatters on impact causing devastating damage to close-range targets. 
item_Descutfl_crossbow_ballistic_01_mag=Item Type: Magazine\nCapacity: 5\n\nThis magazine for the Novian crossbow comes preloaded with five bolts.
item_Descutfl_crossbow_ballistic_01_sota01=Manufacturer: UltiFlex \nItem Type: Crossbow\n\nMagazine Size: 5 \nRate Of Fire: 60 rpm \nEffective Range: 50 m   \n\nAttachments: Optics (S3), Underbarrel (S3)\n\nThe craftsman at UltiFlex went through hundreds of prototypes to discover the perfect lightweight material with the right combination of strength and flexibility for its Novian crossbow, an ideal companion on everything from frontier expeditions to tactical infiltrations. With a pull of its firing action, the Novian near-silently launches a heavy bolt that shatters on impact causing devastating damage to close-range targets.\n\nThe Shroud edition features rich, dark wood accents on a dark gray frame making it the ideal equipment for anyone seeking their next adventure.
item_Descutfl_crossbow_ballistic_01_store01,P=Manufacturer: UltiFlex\nItem Type: Crossbow\n  \nMagazine Size: 5\nRate Of Fire: 60 rpm\nEffective Range: 50 m\n  \nAttachments: Optics (S3),Underbarrel (S3)\n  \nThe craftsman at UltiFlex went through hundreds of prototypes to discover the perfect lightweight material with the right combination of strength and flexibility for its Novian crossbow, an ideal companion on everything from frontier expeditions to tactical infiltrations. With a pull of its firing action, the Novian near-silently launches a heavy bolt that shatters on impact causing devastating damage to close-range targets. \n \nThe bronze accents of the Xy'kara edition draw inspiration from the millennia-long heritage of the Xi'an.
item_Descutfl_crossbow_ballistic_01_tint01,P=Manufacturer: UltiFlex\nItem Type: Crossbow\n  \nMagazine Size: 5\nRate Of Fire: 60 rpm\nEffective Range: 50 m\n  \nAttachments: Optics (S3), Underbarrel (S3)\n  \nThe craftsman at UltiFlex went through hundreds of prototypes to discover the perfect lightweight material with the right combination of strength and flexibility for its Novian crossbow, an ideal companion on everything from frontier expeditions to tactical infiltrations. With a pull of its firing action, the Novian near-silently launches a heavy bolt that shatters on impact causing devastating damage to close-range targets. \n \nThe Nighthunter edition sports a dipped-in-shadow matte black frame.
item_Descutfl_crossbow_ballistic_01_tint02,P=Manufacturer: UltiFlex\nItem Type: Crossbow\n  \nMagazine Size: 5\nRate Of Fire: 60 rpm\nEffective Range: 50 m\n  \nAttachments: Optics (S3), Underbarrel (S3)\n  \nThe craftsman at UltiFlex went through hundreds of prototypes to discover the perfect lightweight material with the right combination of strength and flexibility for its Novian crossbow, an ideal companion on everything from frontier expeditions to tactical infiltrations. With a pull of its firing action, the Novian near-silently launches a heavy bolt that shatters on impact causing devastating damage to close-range targets. \n \nThe Ghostmaker edition sports smoke gray accents on a metallic body.
item_Descutfl_crossbow_ballistic_01_tint03,P=Manufacturer: UltiFlex\nItem Type: Crossbow\n  \nMagazine Size: 5\nRate Of Fire: 60 rpm\nEffective Range: 50 m\n  \nAttachments: Optics (S3), Underbarrel (S3)\n \nThe craftsman at UltiFlex went through hundreds of prototypes to discover the perfect lightweight material with the right combination of strength and flexibility for its Novian crossbow, an ideal companion on everything from frontier expeditions to tactical infiltrations. With a pull of its firing action, the Novian near-silently launches a heavy bolt that shatters on impact causing devastating damage to close-range targets. \n \nThe Wildshot edition's styling mixes subdued natural tones.
