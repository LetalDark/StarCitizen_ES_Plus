vehicle_DescAEGS_Tiburon,P=Manufacturer: Aegis Dynamics\nFocus: Heavy Gunship\n\nAn evolution of a proven Aegis design, the Tiburon's anti-capital ship configuration comprises a spine mounted forward facing beam weapon, supplemented by side mounted turrets.
vehicle_DescANVL_Odin=Manufacturer: Anvil Aerospace\nFocus: Capital Ship\n \nWith enough firepower to shake the heavens, the Odin battlecruiser from Anvil Aerospace is equally at home defending a battlegroup from hostile capital ships as it is pursuing multi-faceted missions as a lone operator. Brandishing a formidable set of armaments, the Odin excels in offensive maneuvers to make it a powerful addition to any fleet.\n
vehicle_DescDRAK_Clipper_Collector_Military=Manufacturer: Drake Interplanetary\nFocus: Generalist\n \nIf there’s one thing every captain needs to take to heart as they prepare to journey across the stars it’s “expect the unexpected.” With a cargo bay, medical facilities, and crafting capabilities, along with Drake’s practical design sensibility, the Clipper is the perfect all-arounder for any new spacefaring enterprise.\n\nWikelo here. Made useful modifications to make ship much more fighter like. Very impressive.
vehicle_DescDRAK_Command_Module=Manufacturer: Drake Interplanetary\nFocus: Logistics\n\nEven the most experienced captains know when the best course of action is to cut their losses and live to fight another day. With this detachable command module, Drake has made sure that cautious operators can extract themselves from the ship’s main body and make a hasty exit with ease, should the need arise. 
vehicle_DescDRAK_Pitbull,P=Manufacturer: Drake Interplanetary\nFocus: Snub Fighter\n\nA lean, mean fighting machine. The Pitbull combines high speed maneuvering with raw firepower to bring you a hard-hitting juggernaut - all in a small, single pilot package.
vehicle_DescGAMA_Tyilui=Manufacturer: Gatac Manufacture\nFocus: Combat\n\nTrue to the nature of the Xi'an, the Tyilui takes innovation to the next level with Gatac's most ambitious ship yet. In addition to hosting several turrets, the mini-carrier's rear-facing hangar is capable of storing multiple snub ships, providing greater operational flexibility in combat scenarios and beyond.
vehicle_DescKRIG_L22_Alpha_Wolf_Collector_Military=Manufacturer: Kruger Intergalactic\nFocus: Light Fighter\n\nMeet a ship almost 400 years in the making, and well worth the wait. Kruger Intergalactic is excited to present their first independently manufactured ship, the Wolf. Combining speed, style, and an impeccably precise design, the L-22 Alpha Wolf is not only a showcase for Kruger but is battle-ready to hunt alone or in packs with a powerful array of armaments, including two bespoke S4 laser repeaters.\n\nWikelo here. Made useful modifications to make ship much more fighter like. Very impressive.
vehicle_DescMISC_Starlite=Manufacturer: MISC\nFocus: Light Refueling\n\nIf there’s one constant in the universe, it’s that ships will eventually run out of fuel. That’s where the Starlite come in. Featuring two standard fuel pods and a scaled back, elegant design, the Starlite was meticulously crafted by the engineers at MISC to offer refueling services to ships in need wherever they may be stranded.
vehicle_DescORIG_M80=Manufacturer: Origin Jumpworks\nFocus: Heavy Fighter\n\nEmbrace elegance without compromising defense with the M80. Featuring Origin's famous sleek and sophisticated design, the ship's hull slyly hides an aggressive weapons systems that can be unfurled and unleashed on assailants at a moment's notice.
vehicle_DescVNCL_Mauler=Manufacturer: Vanduul Clans\nFocus: Destroyer\n\nThe Mauler is a massive escort craft essential to the Vanduul fleet. This tank of a ship gives its pilots a taste of power, with its multi-level angular design, vast array of weaponry and sharp points on the sides for both aerodynamics and fear-factor.
