item_Desc_rrs_specialist_light_helmet_01_05_01,P=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -38 / 68 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nWith its excellent design and eye-catching style, the Arden-SL armor exemplifies why security specialists love Roussimoff Rehabilitation Systems. This versatile armor set lets the wearer stay agile but safe thanks to the precise placement of special composite armor plating and fabrics. It also features a fully enclosed helmet with an integrated cowl. Visor is AR crosshair compatible.\n\nPH
item_Desc_slaver_combat_heavy_arms_01_02_01,P=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -72 / 102 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nIncorporating the same manufacturing know-how and expertise that the UEE Marines have come to rely on, Clark Defense Systems has designed their civilian-line of Defiance heavy armors to stand firm in the face of even the most adverse combat scenarios with its three-star rated protective plating and fully integrated mobility framework.
item_Desc_slaver_combat_heavy_core_01_02_01,P=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -39 / 69 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light                                                         \n\nDesigned to be an EVA-compliant light combat suit, the Calico set is the perfect armor suit for infiltrators, snipers, thieves, basically anyone who likes to avoid kicking in doors. Built out of a combination of PAB3 armor and a custom helmet, it can help you weather some incoming fire without slowing you down.
item_Desc_slaver_combat_heavy_helmet_01_02_01,P=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -72 / 102 °C\nRadiation Protection: 26800 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nThe Defiance features a fully enclosed battle helmet constructed with two layers of composite weaves underneath armor plating, providing you maximum protection against penetrating and concussive attacks. Visor is AR crosshair compatible.
