item_fuelnozzle_GRIN_Fast_Desc,P=Manufacturer: Greycat Industrial\nItem Type: Fuel Nozzle\nHydrogen Flow Speed: 1.45 SCU/s\nQuantum Flow Speed: 0.8 SCU/s\nMax. Integrity: 7140\n\nAllowing for a greatly increased overall flow rate, the Norfield fuel nozzle from Greycat prioritizes the fast and efficient transfer of fuel while only sacrificing some pod storage capacity.  \n
item_fuelnozzle_GRIN_Safe_Desc,P=Manufacturer: Greycat Industrial\nItem Type: Fuel Nozzle\nHydrogen Flow Speed: 1.05 SCU/s\nQuantum Flow Speed: 0.58 SCU/s\nMax. Integrity: 12390\n\nBy maintaining a higher working pressure, the Harkin fuel nozzle from Greycat not only boasts a secure build, but allows the attached storage to hold additional fuel albeit at a slower overall transfer speed.\n
item_fuelnozzle_MISC_Standard_Desc,P=Manufacturer: MISC\nItem Type: Fuel Nozzle\nHydrogen Flow Speed: 1.65 SCU/s\nQuantum Flow Speed: 0.91 SCU/s\nMax. Integrity: 9000\n\nThe nozzle of choice for the acclaimed MISC Starfarer, the RN-7s was designed to be a flexible fuel transfer option suited for a variety of situations.\n
item_fuelpod_GRIN_BigAndFast_Desc,P=Manufacturer: Greycat Industrial\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 1.3\nQuantum Flow Modifier:  1.3\nMax. Integrity: 11550\nCapacity: 24 SCU\n\nGreycat's products have long been a staple of the industrial and commercial sectors and their reputation for quality and reliability extends to their fuel pods. The Gargant is the largest of Greycat's range and boasts refueling speeds that set new standards for a pod this size.
item_fuelpod_GRIN_BigAndFast_Name=Gargant
item_fuelpod_GRIN_FastAndSmall_Desc,P=Manufacturer: Greycat Industrial\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 1.7\nQuantum Flow Modifier: 1.7\nMax. Integrity: 21000\nCapacity: 12 SCU\n\nThe Greycat Bonito offers a best-in-class transfer speed in a compact unit. This comes at the cost of capacity, making the Bonito best suited to fast-turnaround missions refueling medium to small vessels.
item_fuelpod_GRIN_FastAndSmall_Name=Bonito
item_fuelpod_MISC_Standard_Desc,P=Manufacturer: MISC\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 1.16\nQuantum Flow Modifier: 1.16\nMax. Integrity: 22800\nCapacity: 20 SCU\n\nThe standard fuel pod of the Starfarer, the CR-60 was designed by MISC to be a well balanced fuel storage option ready to tackle a wide variety of jobs.\n
item_fuelpod_SHIN_BitQuckerThanStandard_Desc,P=Manufacturer: Shubin Interstellar\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 2.15\nQuantum Flow Modifier: 2.15\nMax. Integrity: 23040\nCapacity: 30 SCU\n\nShubin's fuel pods draw on a wealth and depth of experience and expertise built over centuries of development and innovation. The Nemec is an effective all-rounder, despite sacrificing some damage resistance in order to facilitate higher fuel transfer speeds.
item_fuelpod_SHIN_BitQuckerThanStandard_Name=Nemec
item_fuelpod_SHIN_FastAndInsecure_Desc,P=Manufacturer: Shubin Interstellar\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 2.06\nQuantum Flow Modifier:  2.06\nMax. Integrity: 11880\nCapacity: 23 SCU\n\nThe Shubin Rumford prioritizes - and achieves - high fuel transfer speed over durability, making it a good choice for a refueling run through protected space.
item_fuelpod_SHIN_FastAndInsecure_Name=Rumford
item_fuelpod_STOR_BigandSlow_Desc,P=Manufacturer: Stor*All\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 0.45\nQuantum Flow Modifier: 0.45\nMax. Integrity: 21000\nCapacity: 32 SCU\n\nThe Stor*All GSX-EX offers an impressive combination of premium size and protection, and should be given serious consideration when refueling speed is less of a priority.
item_fuelpod_STOR_BigandSlow_Name=GSX-EX
item_fuelpod_STOR_Fast_Desc,P=Manufacturer: Stor*All\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 0.54\nQuantum Flow Modifier: 0.54\nMax. Integrity: 14280\nCapacity: 23 SCU\n\nWhen it comes to balancing your bottom line, time is money. That’s why Stor*All designed the GSX-RF fuel pod to have one of the fastest flow rates on the market. While it does have a slightly reduced capacity, the time saved and modest improvements to the safe flow rate makes this an ideal solution for service ships.\n
item_fuelpod_STOR_Safe_Desc,P=Manufacturer: Stor*All\nItem Type: Fuel Pod\nHydrogen Flow Modifier: 0.54\nQuantum Flow Modifier: 0.54\nMax. Integrity: 21420\nCapacity: 15 SCU\n\nBy using a triple reinforced outer plating rated far above industry standards, the GSX-HP fuel pod from Stor*All can handle higher pressures than your typical storage options. This allows you to transport more fuel and improves the safe flow rates of whichever nozzle you use.\n
