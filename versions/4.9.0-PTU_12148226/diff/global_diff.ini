ORS_BunkerRaid_Desc=Some of the Nine Tails responsible for the attack on Orison have reportedly been sighted around <EM4>~mission(Location|Address)</EM4> marshalling their forces. Crusader is concerned they’re planning another attack, so this is a job that needs doing well.\n\nYou’ll be tasked with infiltrating the site and neutralizing the Nine Tails however necessary before they can enact a retaliation attempt on Orison. As I’m sure you’re aware, these guys are bad news, so be careful they don’t get the better of you.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
ORS_BunkerRaid_Title=Orison Relief: Neutralize Nine Tails Reprisal
ORS_Construct_Large_Desc=Alright,\n\nThe damage reports are still rolling in from the Nine Tails' attack on Orison and the folks at Crusader are saying they might have to repair a significant proportion of the propulsors on those platforms. That's why this one's a massive order.\n\nLarger quantity, but same as before otherwise. Either manufacturer them yourself using an Item Fabricator or source them some other way.\n\nWhen you're done, drop the propulsors off at <EM4>~mission(Destination|Target|Address)</EM4>. Be a big payout with this one.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE MAINTENANCE\n"Building on the Foundations of our Past."
ORS_Construct_Large_Title=Orison Relief: Large Fabrication Order
ORS_Construct_Medium_Desc=Hullo,\n\nCrusader have been in touch to say that the scale of the damage to their platforms is greater than they initially thought and they'll need more propulsors than they originally estimated for.\n\nWe're contracting out their request to anyone with an available Item Fabricator standing by. Though I guess you could source the propulsors some other way, but that's on you.\n\nOnce ready, deliver them to <EM4>~mission(Destination|Target|Address)</EM4>. Payment sent on completion.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE MAINTENANCE\n"Building on the Foundations of our Past."
ORS_Construct_Medium_Title=Orison Relief: Medium Fabrication Order
ORS_Construct_Small_Desc=Now then,\n\nAfter the Nine Tails attack, the folks at Crusader could do with more than just a helping hand. What they need are proper propulsors to help replace the ones damaged in the attacks.\n\nWe've attached a blueprint outlining what materials you'll need to create them. Up to you whether you go out and find those materials yourself or buy them from a trader. Either way you will need access to an Item Fabricator to make the propulsors yourself.\n\nOnce you're done bring them to <EM4>~mission(Destination|Target|Address)</EM4> and one of the team will sort out the rest.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE MAINTENANCE\n"Building on the Foundations of our Past."
ORS_Construct_Small_Title=Orison Relief: Small Fabrication Order
ORS_ConstructionAid_ResourceGatherLarge_Desc=Alright,\n\nGot a large scale order from the Crusader folks to help them fix up their platforms. Big order means a big payout.\n\nWhen you're done collecting all the materials, take them to <EM4>~mission(Destination|Target|Address)</EM4> and job's a good'un.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE MAINTENANCE\n"Building on the Foundations of our Past."
ORS_ConstructionAid_ResourceGatherLarge_Title=Orison Relief: Large Materials Order
ORS_ConstructionAid_ResourceGatherMedium_Desc=Ey up,\n\nWe're still on the hunt for more materials to help Crusader after the Nine Tails attack. Need a bit more this time though. Will make sure you're compensated accordingly.\n\nAfter you've got the materials, head to <EM4>~mission(Destination|Target|Address)</EM4> and we'll get it sorted.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE MAINTENANCE\n"Building on the Foundations of our Past."
ORS_ConstructionAid_ResourceGatherMedium_Title=Orison Relief: Medium Materials Order
ORS_ConstructionAid_ResourceGatherSmall_desc=Now then,\n\nYou might have heard about the recent attacks on the Orison platforms. Terrible stuff. The folks at Crusader are scrambling around trying to put it all back together and have contracted us to help.\n\nTo get them back on their feet what we need is construction materials. Can give you a decent pay packet for them too.\n\nIf you don't know already how to get construction materials, your best bet is to read United Resource Workers' <EM4>A Salvager's Guide to Material Collection</EM4>. That'll set you on the right path.\n\nOnce you've got the order ready, you'll need to drop it all off at <EM4>~mission(Destination|Target|Address)</EM4>.\n\nTa very much,\nHal Grimsby\nContracts Manager\n\nCORNERSTONE MAINTENANCE\n"Building on the Foundations of our Past."
ORS_ConstructionAid_ResourceGatherSmall_title=Orison Relief: Small Materials Order
ORS_JournalTracker_Content=Following the vicious attack by the Nine Tails on Orison’s platforms, it is vital that we begin to rebuild, and for that we require your help. Crusader Industries, in conjunction with several support organizations, is coordinating a widespread effort to supply and secure our relief efforts. \n\nWith your contribution, we can return Orison to how it once was.
ORS_JournalTracker_Title=Orison Relief
ORS_MedicalAid_Delivery_Desc=Hello,\n\nCrusader has asked us here at Ling Family Hauling to aid their relief efforts, and it’s extremely important to us as a business and a family to do this right. The thought of what happened to the victims of Orison happening to anyone in my family… We owe it to the survivors to do everything in our power to help them.\nThe medical supplies Crusader needs are set to get picked up from <EM4>~mission(Location|Target|Address)</EM4> and needs to be dropped at <EM4>~mission(Destination|Target|Address)</EM4>. And be sure to bring a <EM4>handheld tractor beam</EM4> to speed things along.\n\nThank you, \nConni Ling\nShipment Coordinator\nLing Family Hauling
ORS_MedicalAid_Delivery_Title=Orison Relief: Medical Aid Delivery
ORS_MedicalAid_HaulingLarge_Desc=Hey, it’s El.\n\nOff the bat – this particular job’s a big deal, so if you’re looking to take this one on for us, make sure you’re confident in your ability to do a job well. \n\nWe’ve been contracted by Crusader to deliver medical supplies to <EM4>~mission(Destination|Target|Address)</EM4>. Pick up’s at <EM4>~mission(Location|Target|Address)</EM4>. Bear in mind, this is gonna be a big one, so make sure bring a <EM4>handheld tractor beam</EM4> and a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> otherwise it might be a little rough.\n\nI can’t stress the importance of this contract enough – lots of good people got hurt in those attacks, and it’s our responsibility to do what we can to help them in the aftermath. We owe the victims that much, at the very least.\n\nLet’s do right by them,\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.'
ORS_MedicalAid_HaulingLarge_title=Orison Relief: Large Supply Haul
ORS_MedicalAid_HaulingMedium_Title=Orison Relief: Medium Supply Haul
ORS_MedicalAid_HaulingMedium_desc=Hey, it’s El.\n\nCrusader is still trying to make things right in Orison following the attack, so I’m hoping you’re free to keep assisting with the effort.\n\nWe been contracted to deliver relief supplies to <EM4>~mission(Destination|Target|Address)</EM4>. Pick up’s at <EM4>~mission(Location|Target|Address)</EM4>. \nNot too shabby a haul either, so make sure you’re in a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and bring a <EM4>handheld tractor beam</EM4>, or you’ll make us all look unprofessional.\n\nI’m not kidding around with this job being important to get done right. Lotta people got hurt during the Nine Tails raid, and they’re relying on people like us to get them the help they need. So let’s do right by them, okay?\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.'
ORS_MedicalAid_HaulingSmall_Desc=Hey, it’s El.\n\nNeed a reliable contractor for a pretty important delivery today. I’m sure you’re aware of what went down in Orison, big commotion. Made my job about ten times harder.\n\nAnyway, we’ve been contracted by Crusader to deliver some medical stuff to <EM4>~mission(Destination|Target|Address)</EM4>. Pick up’s at <EM4>~mission(Location|Target|Address)</EM4>. Shouldn’t be too heavy an order for this one, just make sure you’ve got a ship that can hold <EM4>~mission(MissionMaxSCUSize) cargo containers</EM4> and a <EM4>handheld tractor beam</EM4>, or you’ll really embarrass yourself when you get there.\n\nLook, I’ll level with you. This job isn’t just hauling for hauling’s sake. Orison got pretty messed up by those Nine Tails, so anything we can do to help them out is probably the right thing to do.\n\nLet’s get it done,\n\nElla Tieno \nJr. Logistics Coordinator \nCovalex Shipping   \n'Anything you need, anywhere you need it.'
ORS_MedicalAid_HaulingSmall_Title=Orison Relief: Small Supply Haul
ORS_ShipAmb_Desc=Looking for a tough and competent pilot in the area willing to take on some of the outlaws responsible for the attack on Crusader. We’ve received word that a group of Nine Tails stragglers are hunkering down near <EM4>~mission(Location|Address)</EM4> after they got pushed out of Orison, and Crusader Security wants our help dealing with them while they’re down. \n\nWe’ve mapped out a good spot in the area to get the drop on them, so you’ll go there, wait quietly until they show up, and hit them before they know what’s happening. Hopefully this’ll send a message to the rest of them out there that their actions have consequences.\n\nGood luck,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
ORS_ShipAmb_Title=Orison Relief: Strike Nine Tails Squad
ORS_ShipWaveAt_Desc=Just got word that some of the Nine Tails involved in the recent assault on Orison are convening near <EM4>~mission(Location|Address)</EM4> before launching their next attack. We need a capable fighter pilot to head them off and take care of them before they start wreaking havoc again.\n\nTo complicate matters, from what we know there’s a very high chance that they might have additional reinforcements inbound, so be sure the extra ships don’t take you by surprise.\n\nAll the best,\n\nKevin Walton\nDispatcher, Foxwell Enforcement\n'Security, Your Way'\n\nFoxwell Enforcement is a bonded security specialist licensed to operate throughout the UEE. We are always looking for new operators to join our family. If you or anyone you know is interested, please reach out to one of our contract representatives.
ORS_ShipWaveAt_Title=Orison Relief: Stop Nine Tails Regrouping
PU_AMartel_CIV_M_MC_TSGDamageIdris75_GP_001,P=They're hitting us a little more than I'd like.
PU_AMartel_CIV_M_MC_TSGDamageIdris75_GP_002,P=Need some protection. Tranquility's taken some serious hits.
PU_AMartel_CIV_M_MC_TSGDamageIdris75_GP_003,P=If anyone can lend a hand, need some protection.
PU_AMartel_CIV_M_MC_TSGPhase1CompletedIdrisAvailable_GP_001,P=Think that was the last of them. If you need it, we'll open our bay doors so you can rearm and refuel. It's the least we can do.
PU_AMartel_CIV_M_MC_TSGPhase2IntroAssaultStationWeaponType_GP_001,P=One more thing, looks like those power relays are using some heavy shielding, so you might need to hit it with something other than energy weapons.
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveFinalCoolerDestroyed_GP_001,P=That was the last cooler. Power core's exposed. Take it out and we can hopefully re-establish comms with Gabe, our pilot.
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveFinalCoolerDestroyed_GP_002,P=Last cooler's been taken out. You should have a shot at the power core now. Good luck
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveIntro2A_GP_001,P=That was the last one. You should have access to the station arms. If you make your way inside, you'll need to take out the coolers which will cause the central power core to open up. Just be careful though, we're getting heavy levels of distortion energy in there.
PU_AMartel_CIV_M_MC_TSGPhase2SubObjectiveIntro2A_GP_002,P=The station arms should be open now. You'll need to head inside and destroy the coolers to expose the power core. Scanners are picking up large amounts of distortion energy so you'll have to be quick.
PU_AMartel_CIV_M_MC_TSGPhase5SavePilotCaptainsResponsetoForgeThreat_GP_001,P=I don't like the sound of that. You'll need to hurry. Also, if you need to restock, I'd do it now. We'll need to shell up if Vanduul arrive.
PU_AMartel_CIV_M_MC_TSGPhase5Success_GP_001,P=No chance, Gabe. You're in no condition to tangle with anyone. I want you to quantum out of here now.
PU_AMartel_CIV_M_MC_TSGPhase5VanduulWarning_GP_001,P=Long range sensors flagged incoming contacts. You might want to hurry up.
PU_AMartel_CIV_M_MC_TSGPhase5VanduulWarning_GP_002,P=Vanduul contacts heading to our position. Got a little time but not much.
PU_AMartel_CIV_M_MC_TSGPhase6AttackMauler_GP_001,P=If you're up for it, we're going to try and take down that Mauler. It's too dangerous to let run loose in the system.
PU_AMartel_CIV_M_MC_TSGPhase6EscapeMaulerIdrisLeaving_GP_001,P=Alright, we can't afford to stick around any longer, not with that cap ship here. You should quantum away while you still can. Good luck.
PU_AMartel_CIV_M_MC_TSGPhase6EscapeMauler_GP_001,P=You should get out of here while you can. We'll hold off the Vanduul.
PU_AMartel_CIV_M_MC_TSGPhase6GabeDiesCaptainsresponse_GP_001,P=Dammit. Gabe's down…
PU_AMartel_CIV_M_MC_TSGPhase6GabeEscapesCaptainsresponse_GP_001,P=Thanks for getting Gabe out of here.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerArrives_GP_001,P=Eyes up all. Vanduul cap ship just showed. Keep doing what you're doing. We'll hold them off as long as we can.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerArrives_GP_002,P=Got a vanduul cap ship on site. Gabe, get the hell out of here. We'll hold them off.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerArrives_GP_003,P=New contact. Vanduul cap ship just quantumed in. Get Gabe out of here. We'll get their attention.
PU_AMartel_CIV_M_MC_TSGPhase6VanduulMaulerDestroyed_GP_001,P=Vanduul cap ship down! I can't believe you did that.
PU_AMartel_CIV_M_MC_TSGPhase7MissionComplete_GP_001,P=That looks like all of it. The Governing Committee will be thrilled to hear we managed to get our hands on actual data pulled from a Vanduul cap ship. Anyway, top notch work. I got the higher ups to give you something special for all your trouble. Thanks again.
PU_AMartel_CIV_M_MC_TSGTargetEncouragement_GP_001,P=Take out that target.
PU_AMartel_CIV_M_MC_TSGTargetEncouragement_GP_002,P=Hate to rush you but we need that taken out.
PU_AMartel_CIV_M_MC_TSGTargetEncouragement_GP_003,P=Need that target dealt with.
PU_AMartel_CIV_M_PMH_TSGDamageIdris25_GP_001,P=We're not going to last much longer if you don't keep 'em off us.
PU_AMartel_CIV_M_PMH_TSGDamageIdris25_GP_002,P=Tranquility is taking heavy fire. Repeat. Heavy fire.
PU_AMartel_CIV_M_PMH_TSGDamageIdris25_GP_003,P=Need some immediate assistance. We've sustained critical damage.
PU_AMartel_CIV_M_PMH_TSGDamageIdris50_GP_001,P=My ship's taking some serious damage. You're gonna have to step it up.
PU_AMartel_CIV_M_PMH_TSGDamageIdris50_GP_002,P=Need help getting these Shattered Blade off us.
PU_AMartel_CIV_M_PMH_TSGDamageIdris50_GP_003,P=Could use your help here. Tranquility's taking some serious hits.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_001,P=Enemy ship down.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_002,P=Shame it had to come to this.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_003,P=Shattered destroyed.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_004,P=Find peace in the next life.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_005,P=I wish they'd made different choices.
PU_AMartel_CIV_M_PMH_TSGHostilesKilledEncouragement_GP_006,P=Sad to see.
PU_AMartel_CIV_M_PMH_TSGMissionAbandon_GP_001,P=Look, we needed your help. You shouldn't just bail like that.
PU_AMartel_CIV_M_PMH_TSGMissionAbandon_GP_002,P=A promise used to mean something. Typical UEE bullshit.
PU_AMartel_CIV_M_PMH_TSGMissionAbandon_GP_003,P=I knew we couldn't trust a corporate rep to follow through.
PU_AMartel_CIV_M_PMH_TSGMissionFail_GP_001,P=Reroute all power to <death scream>
PU_AMartel_CIV_M_PMH_TSGMissionFail_GP_002,P=Tranqulity's lost. Abandon <death scream>
PU_AMartel_CIV_M_PMH_TSGMissionFail_GP_003,P=All hands, aband- <scream>
PU_AMartel_CIV_M_PMH_TSGPhase1Completed_GP_001,P=Looks like we're clear of hostiles. You got here in the nick of time.
PU_AMartel_CIV_M_PMH_TSGPhase1Completed_GP_002,P=Scope's clear of immediate threats.
PU_AMartel_CIV_M_PMH_TSGPhase1Completed_GP_003,P=Think we're good for now. Nice work.
PU_AMartel_CIV_M_PMH_TSGPhase1IntroDefeatAttackingFighters_GP_001,P=Intersec said someone would be coming. My name's Captain Aniss Martel of the security vessel, Tranquility. One of ours is being held hostage inside that station, but first we need help clearing out these fighters.
PU_AMartel_CIV_M_PMH_TSGPhase1IntroDefeatAttackingFighters_GP_002,P=You from Intersec? I'm Captain Martel of the People's Alliance. I'll fill you in later, we need to clear these fighters off the Tranquility first.
PU_AMartel_CIV_M_PMH_TSGPhase1IntroDefeatAttackingFighters_GP_003,P=Glad you could make it. My name's Martel and this ship's the Tranquility. Once you get these fighters off us, I'll fill you in on the situation.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFinal_GP_001,P=That did it. Bays to the power core should be open. Go and take it out.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFinal_GP_002,P=Last one's down. You should have access to the central power core now.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFirst_GP_001,P=All the generators in that arm are down. Got two more to go. All the turrets on that arm should be vulnerable now.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageFirst_GP_002,P=First arm's generators are down. That'll disable the shields on the turrets, but two more to go until we can get to the power core.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageSecond_GP_001,P=That arm's down. Let's keep it up and take out the last one.
PU_AMartel_CIV_M_PMH_TSGPhase2DamageSecond_GP_002,P=Second arm's down. Just one more to go. We got this.
PU_AMartel_CIV_M_PMH_TSGPhase2IntroAssaultStation_GP_001,P=Onto the crisis at hand, we thought that station was abandoned and sent a pilot to investigate, turns out Shattered Blade were hiding out. We got lit up by their turrets when we tried to attack, so we had to pull back. Comms have been cut off so we haven't been able to make contact or know if they're even alive. The station's one of the older models in the system, so the targeting system on the turrets can't track smaller ships. You'll have to jump through several hoops to get in, but there might be a way to bypass their security and defenses. You'll need to destroy the power relays positioned around the station. Take those out and I'll advise from there.
PU_AMartel_CIV_M_PMH_TSGPhase2SubObjectiveSuccess_GP_001,P=That was the last one. You should have access to the station arms. If you make your way inside, there are three shield generators per arm. We'll need to take them out to get access to the power core of the station.
PU_AMartel_CIV_M_PMH_TSGPhase2SubObjectiveSuccess_GP_002,P=The station arms should be open now. If you're able to get past the turrets and get inside, you'll have to destroy three shield generators that are installed inside each one.
PU_AMartel_CIV_M_PMH_TSGPhase2SubObjectiveSuccess_GP_003,P=Without those relays, you should have access to each of the station arms. Head inside and destroy the generators in each. That should expose the power core and let you take out their turrets.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_001,P=Relay down. Nice one.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_002,P=Nice job taking that out.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_003,P=Keep it up. We're almost there.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_004,P=Good hit. Nice work.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_005,P=Relay destroyed. Great job.
PU_AMartel_CIV_M_PMH_TSGPhase2TargetDestroyedEncouragement_GP_006,P=Relay taken out.
PU_AMartel_CIV_M_PMH_TSGPhase3IntroInterceptBombers_GP_001,P=Dammit, picking up multiple Shattered Blade bombers. Guess they don't like what we're doing here. We're gonna need some help.
PU_AMartel_CIV_M_PMH_TSGPhase3IntroInterceptBombers_GP_002,P=Shattered Blade just sent a bunch of bombers. Any chance you could lend a hand? We'll need it.
PU_AMartel_CIV_M_PMH_TSGPhase4DestroypowercoreSuccess_GP_001,P=Great job. Taking out the power core should trigger a station-wide override which should reset all the Shattered Blade protocols.
PU_AMartel_CIV_M_PMH_TSGPhase4ReminderDestroyPowerCore_GP_001,P=We still got to take out the power core if we want to get our pilot back.
PU_AMartel_CIV_M_PMH_TSGPhase5Remind_GP_001,P=Might want to hurry up in there. Getting a little hectic out here.
PU_AMartel_CIV_M_PMH_TSGPhase5Remind_GP_002,P=Hate to bother you, but you should get a move on.
PU_AMartel_CIV_M_PMH_TSGPhase5Remind_GP_003,P=Situation's going from bad to worse out here. I'd move if you can.
PU_AMartel_CIV_M_PMH_TSGPhase5SavePilotCaptainsResponse_GP_001,P=We got you, Gabe. Glad to hear you're alright. We got some help here who're gonna get you out of there. I'll leave it to you two to get you back in the air.
PU_AMartel_CIV_M_PMH_TSGPhase6BonusObjectiveSuccess_GP_001,P=Oh, one more thing. Not sure if it helps you at all, but we intercepted a code in some chatter when the Shattered Blade atttacked. If you're thinking of looking into that station, maybe it'll mean something there.
PU_AMartel_CIV_M_PMH_TSGPhase6FailPilotDead_GP_001,P=Wanted to thank you for trying to save Gabe. Universe is just getting more dangerous. We all should be sticking together and looking out for each other more. Anyway, we should go. Take care.
PU_AMartel_CIV_M_PMH_TSGPhase6FailPilotDead_GP_002,P=Never gets easier losing a volunteer under your command. But we can carry on what Gabe believed in: making Nyx a safer place for everyone. Let's all do our part, okay? Take care.
PU_AMartel_CIV_M_PMH_TSGPhase6SuccessCaptainsresponse_GP_001,P=Just want to say, you really stepped up today. My people and I all appreciate your tenacity and hard work. Hope to see you around Levski some time.
PU_AMartel_CIV_M_PMH_TSGPhase6SuccessCaptainsresponse_GP_002,P=I never would've thought anyone from the UEE would've stood with us like this. Thank you. I hope you find peace where you seek it. Take care.
PU_AMartel_CIV_M_PMH_TSGPhase7VanduulDataDiscoveredMissionStart_GP_001,P=Hey, it's Captain Martel again.  I've never seen someone take down one of those Maulers. Not outside of the Navy at least. What you're looking at there is one of their data stores. We've been trying to get a better sense of their numbers in Nyx and those can help. If you can pull the rest of the data, it'll give the Alliance a serious advantage.
PU_BATTAGLIA_PEO_F_MC_RBMMission1FindRocks_GP_001,P=Hey. Recco here. Looks like you're in the area. You'll have to scan to see where the minerals are.
PU_BATTAGLIA_PEO_F_MC_RBMMission1MiningComplete_GP_001,P=That should do it. You're a natural at this. Come on home.
PU_BATTAGLIA_PEO_F_MC_RBMMission2BlackBoxObtained_GP_001,P=Black box says Isaac was on board when they launched, but if there's no body, I wonder where he went. I don't know why the Moraine would take him but they have taken people before... They have an old station near here that they've used as a hunting blind. I'll send you the location.
PU_BATTAGLIA_PEO_F_MC_RBMMission2Body1FoundLucas_GP_001,P=Yeah, that's Captain Lucas.
PU_BATTAGLIA_PEO_F_MC_RBMMission2Body2Found_GP_001,P=<pause> Yeah, that's Meg… Just last week she was talking about doing fewer of these runs.
PU_BATTAGLIA_PEO_F_MC_RBMMission2Body3Found_GP_001,P=Confirmed. That's TJ… sorry, this never gets easier, you know?
PU_BATTAGLIA_PEO_F_MC_RBMMission2GettheBlackBox_GP_001,P=Hey… I'm not seeing Kepler in there... Sorry, Isaac Kepler. Can you grab the ship's black box and we can see if he set out with them?
PU_BATTAGLIA_PEO_F_MG_ContractAccept_GP_001,P=Thanks for taking the job.
PU_BATTAGLIA_PEO_F_MG_ContractAccept_GP_002,P=Great. Thanks for picking that up.
PU_BATTAGLIA_PEO_F_MG_ContractAccept_GP_003,P=Been needing someone to clear that one out.
PU_DELOIT_UWC_F_PMH_GenericMissionAbandon_GP_001,P=Oh dear. I'm so sorry you're not going to be able to finish this one. I hope you're feeling alright. Well, maybe things'll work out better next time. Talk to you soon.
PU_DELOIT_UWC_F_PMH_GenericMissionAbandon_GP_002,P=Woah, quitting, huh? I'll be honest, I'm a bit surprised, but I get it, life happens. Just don't make it a habit, okay? Later.
PU_DELOIT_UWC_F_PMH_GenericMissionAbandon_GP_003,P=Wait, you're canceling the contract? Really? Okay then… If you think that's what's best…
PU_DELOIT_UWC_F_PMH_GenericMissionAccept_GP_001,P=Heya, DD here. Thanks for hopping onto this job. I think you're gonna be perfect for it. Just take it one step at time and be safe out there, okay?
PU_DELOIT_UWC_F_PMH_GenericMissionAccept_GP_002,P=Hey again. It's DD. I was wondering when you'd come back for another contract. Anyway, time's a wasting so we better hop to it!
PU_DELOIT_UWC_F_PMH_GenericMissionAccept_GP_003,P=Hi! It's DD again. Always love seeing your name pop up on a contract. You have the details so be good out there and we'll talk later.
PU_DELOIT_UWC_F_PMH_GenericMissionComplete_GP_001,P=It's DD. Just calling to say I appreciate that you're the dependable sort. Just the kind of pilot Wayfarer needs. Safe flying and don't be a stranger, you hear?
PU_DELOIT_UWC_F_PMH_GenericMissionComplete_GP_002,P=Look at that. Contract complete. Always good to see. Anyway, get some rest, and we'll talk soon.
PU_DELOIT_UWC_F_PMH_GenericMissionComplete_GP_003,P=Wayfarer could use a few more pilots like you, that's for sure. Enjoy the pay, and I'm sure we'll have another contract for you soon.
PU_DELOIT_UWC_F_PMH_GenericMissionFail_GP_001,P=DD here. Always tough when the job doesn't work out. Only thing we can do is learn and move on. Take a little break and I'll see you on the next one.
PU_DELOIT_UWC_F_PMH_GenericMissionFail_GP_002,P=DD calling from UWC. Doesn't look like that job's working out. It happens to the best of us. Don't let it bring you down and get back out there soon.
PU_DELOIT_UWC_F_PMH_GenericMissionFail_GP_003,P=Oof. That's a tough break. I'm so sorry this one didn't go your way. Keep your chin up, okay?
PU_DELOIT_UWC_F_PMH_MissionAcceptIntro_GP_001,P=Let me be the first to say welcome aboard. There's always plenty of people out there counting on Wayfarer's help so its good when a new pilot joins the fray. I'm Dina Deloit but you can call me DD, everyone else does. I'll be your main dispatcher. What do you say we get you going, huh? Clients aren't gonna take care of themselves.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteCrybabyTrap_GP_001,P=Uh oh. Something doesn't feel right here… Look out!
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteCrybabyTrap_GP_002,P=That's weird. I don't see a ship… careful! It's a trap.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteCrybabyTrap_GP_003,P=Hey! It's a set up! Watch out!
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteHandover_GP_001,P=Alrighty, looks like you just arrived, so I'm gonna patch you into the client.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteHandover_GP_002,P=Great, you made it. I'll patch the client into you now.
PU_DELOIT_UWC_F_PMH_RefuelingArriveonSiteHandover_GP_003,P=Okay, now that you're onsite I'll get you patched in with the client…
PU_DELOIT_UWC_F_PMH_RefuelingHostilesDetected_GP_001,P=Hey, heads up! You got trouble coming your way. Look sharp.
PU_DELOIT_UWC_F_PMH_RefuelingHostilesDetected_GP_002,P=Hey. Get ready. You got some hostiles that'll be there any moment. 
PU_DELOIT_UWC_F_PMH_RefuelingHostilesDetected_GP_003,P=Bad news. Picked up some hostiles heading right for you.
PU_DELOIT_UWC_F_PMH_RefuelingMissionAccept_GP_001,P=Hey there, it's DD. Thanks for hopping on this refueling contract. Don't know about you, but the thought of being stranded without fuel scares the hell outta me. Well, thankfully they got you to rescue them.
PU_DELOIT_UWC_F_PMH_RefuelingMissionAccept_GP_002,P=Hiya, DD here. Let's see what you got cooking today… Alright, a refueling job. What would we do without folks forgetting to top off, huh? Anyway, I'll leave you to it.
PU_DELOIT_UWC_F_PMH_RefuelingMissionAccept_GP_003,P=Heyo, it's DD again. Looks like we got you booked for a refueling job. Good luck and be safe out there.
PU_DELOIT_UWC_F_PMH_RefuelingMissionFailClientShipDestroyed_GP_001,P=Oh my. That poor soul... And I'm afraid there's more bad news. Without a ship to refuel, I have to cancel the contract. Next one will have a happier ending I hope. Be safe, you hear?
PU_DELOIT_UWC_F_PMH_RefuelingMissionFailClientShipDestroyed_GP_002,P=I can't believe the client didn't make it. At least you're still with us, huh? Silver linings and all that. Unfortunately, I am going to have cancel the contract. Better luck next time.
PU_DELOIT_UWC_F_PMH_RefuelingMissionFailClientShipDestroyed_GP_003,P=While I love this job, some days sure are tougher than others. Not only is the client gone, but I have to cancel the contract too. Well, tomorrow's another day, right? Talk soon.
PU_DELOIT_UWC_F_PMH_RefuelingTrapCompleteHazardPay_GP_001,P=Whew! I am pleased you made it out of that mess. And don't worry about the contract. I arranged for Wayfarer's to give you some credits anyway. I mean, it wasn't your fault the service request ended up being bait. 
PU_DELOIT_UWC_F_PMH_RefuelingTrapCompleteHazardPay_GP_002,P=Thank heavens you're alright. Now, normally no client means no pay, but I was able to swing some compensation for your trouble. Hopefully that makes your day a little brighter. Be safe out there, okay.
PU_DELOIT_UWC_F_PMH_RefuelingTrapCompleteHazardPay_GP_003,P=Can't believe you're okay. That was pretty scary, but I was able to get you some hazard pay for all your trouble. That way we can get you back out there as soon as possible, alright? Let's talk soon.
PU_DUBUISSON_NOR_F_MC_AmbushArriveatLocation_GP_001,P=You've arrived at the proposed ambush site.
PU_DUBUISSON_NOR_F_MC_AmbushArriveatLocation_GP_002,P=This is the area operations flagged for the ideal ambush site.
PU_DUBUISSON_NOR_F_MC_AmbushArriveatLocation_GP_003,P=You're on site. Stand by and I'll provide some additional intel.
PU_DUBUISSON_NOR_F_MC_AmbushHideinMarkedLocation_GP_001,P=Sending you an ideal spot to hide your ship.
PU_DUBUISSON_NOR_F_MC_AmbushHideinMarkedLocation_GP_002,P=Pinging a location that should hide your ship's signature.
PU_DUBUISSON_NOR_F_MC_AmbushHideinMarkedLocation_GP_003,P=Flagging a spot to take up a position for the ambush.
PU_DUBUISSON_NOR_F_MC_AmbushTargetDestroyed_GP_001,P=Target down.
PU_DUBUISSON_NOR_F_MC_AmbushTargetDestroyed_GP_002,P=Target has been eliminated.
PU_DUBUISSON_NOR_F_MC_AmbushTargetDestroyed_GP_003,P=Confirmed. Target is down.
PU_DUBUISSON_NOR_F_MC_AmbushTargetMissing_GP_001,P=Enemy contacts… I'm not seeing the target.
PU_DUBUISSON_NOR_F_MC_AmbushTargetMissing_GP_002,P=I've got hostiles approaching. Doesn't look like the target's with them.
PU_DUBUISSON_NOR_F_MC_AmbushTargetMissing_GP_003,P=Picking up some hostiles. Don't have a confirmation on the target.
PU_DUBUISSON_NOR_F_MC_AmbushTargetSpotted_GP_001,P=Target spotted.
PU_DUBUISSON_NOR_F_MC_AmbushTargetSpotted_GP_002,P=Got confirmation that the target's on site.
PU_DUBUISSON_NOR_F_MC_AmbushTargetSpotted_GP_003,P=Target has been confirmed.
PU_DUBUISSON_NOR_F_MC_AmbushWait_GP_001,P=You should be hidden. Power down and wait.
PU_DUBUISSON_NOR_F_MC_AmbushWait_GP_002,P=You're in position. Targets should be here soon.
PU_DUBUISSON_NOR_F_MC_AmbushWait_GP_003,P=Hold here. Targets should be arriving soon.
PU_DUBUISSON_NOR_F_MC_ArriveonBarge_GP_001,P=Mendo's hiding here somewhere. For now, focus on dealing with these Nine Tails forces and then we can find him.
PU_DUBUISSON_NOR_F_MC_DatahackCompleted_GP_001,P=We're too late. The transfer completed. I'll have to let Crusader know that some of their data is now in Nine Tails' hands.
PU_DUBUISSON_NOR_F_MC_DatahackDisableEncouragementAlmostOutofTime_GP_001,P=We are almost out of time. The transfer is nearly complete.
PU_DUBUISSON_NOR_F_MC_DatahackDisableEncouragement_GP_001,P=Quickly. Find a way to stop the breach before the data transfer is done.
PU_DUBUISSON_NOR_F_MC_DatahackDiscovered_GP_001,P=Are the Nine Tails stealing Crusader data? Could this be the reason for the whole assault? It doesn't matter. Shut it down if you can.
PU_DUBUISSON_NOR_F_MC_DatahackStopped_GP_001,P=Crusader will pleased to know we managed to protect their data from getting into the Nine Tails' hands. Who knows what they were after and why.
PU_DUBUISSON_NOR_F_MC_EliteDeadEncouragethePlayertoLootthem_GP_001,P=I ran that Nine Tail through our system and it seems they were one of the gang's more senior members. Might be worth taking a look to see if they had anything vital on them.
PU_DUBUISSON_NOR_F_MC_EliteDeadIktiHint_GP_001,P=That's one problem sorted. It might be worth seeing if these Crusader ATLS could be repurposed to fit your needs. Seems a shame to waste such potentially useful hardware. 
PU_DUBUISSON_NOR_F_MC_EliteDeadSearchBody_GP_001,P=I think you found the access code holder.
PU_DUBUISSON_NOR_F_MC_EliteWeaponCacheKeycardFound_GP_001,P=Interesting. That's an access code, but sadly not for the inverter. There must be something else around here it opens up. Keep an eye out.
PU_DUBUISSON_NOR_F_MC_FindKeyHeadinside_GP_001,P=Good. Now we can open the door and get to Mendo Ren.
PU_DUBUISSON_NOR_F_MC_FullSecurityReset_GP_001,P=That should do it. This branch of the security network is back online and hopefully the elevator's working.
PU_DUBUISSON_NOR_F_MC_FullSecurityReset_GP_002,P=That was the last node needing to be reset. This security network branch has been fully restored and the elevator should be back online.
PU_DUBUISSON_NOR_F_MC_FullSecurityReset_GP_003,P=That was all of this branch's nodes. The security network should be reset. Head to the elevator and see if it's operational.
PU_DUBUISSON_NOR_F_MC_GenericMissionAbandon_GP_001,P=This is Northrock. As a company, we need our contractors to fulfill on the promise of the contract. Leaving before it is complete is not that.
PU_DUBUISSON_NOR_F_MC_GenericMissionAbandon_GP_002,P=Adrienne from Northrock here. Just calling to confirm that we've received your request to terminate the contract early. I can accommodate you this time, but please avoid doing this in future.
PU_DUBUISSON_NOR_F_MC_GenericMissionAbandon_GP_003,P=Northrock here. In the future, please don't accept our contracts if you aren't able to see them through. It is the considerate thing to do. 
PU_DUBUISSON_NOR_F_MC_GenericMissionAccept_GP_001,P=Adrienne from Northrock here. I have received confirmation that you are beginning one of our contracts. I will be serving as your Logisitics Officer as needed but all the details should be in the brief. Good luck.
PU_DUBUISSON_NOR_F_MC_GenericMissionAccept_GP_002,P=This is Adrienne from Northrock. Thank you for taking on this contract. I am looking forward to working together and will be monitoring your progress. Feel free to proceed as you see fit.
PU_DUBUISSON_NOR_F_MC_GenericMissionAccept_GP_003,P=Northrock here. I'll be managing your contract on the operations side. I don't foresee any complication at the moment so I am expecting a good outcome. Good luck.
PU_DUBUISSON_NOR_F_MC_GenericMissionComplete_GP_001,P=This is Northrock. You have hereby completed all necessary requirements to close out that contract. I appreciate your diligence in this matter.
PU_DUBUISSON_NOR_F_MC_GenericMissionComplete_GP_002,P=Adrienne again. Everything looks good on my end, so I'm going to conclude this contract. Thank you for your effort.
PU_DUBUISSON_NOR_F_MC_GenericMissionComplete_GP_003,P=Hi, this is Adrienne calling. Looks like you've taken care of everything needed to close out this contract. Excellent. I'll forward this along to accounts and get you paid. Enjoy the rest of your day.
PU_DUBUISSON_NOR_F_MC_GenericMissionFail_GP_001,P=Northrock calling. Apologies, but you have failed to meet the requirements outlined in the contract so we are terminating this operation. Thank you for your time.
PU_DUBUISSON_NOR_F_MC_GenericMissionFail_GP_002,P=Adrienne from Northrock here. I have to pull this contract from you since you failed to adhere to the parameters outlined. I recommend you adjust your mindset when working for us in the future.
PU_DUBUISSON_NOR_F_MC_GenericMissionFail_GP_003,P=Hello, this is Adrienne. After careful consideration, it is my opinion that this contract is currently untenable based on your actions, so we're going to cancel it. You understand how it is.
PU_DUBUISSON_NOR_F_MC_GoodWork_GP_001,P=Nicely done. That was expertly handled.
PU_DUBUISSON_NOR_F_MC_GoodWork_GP_002,P=Wonderful. Just the result we had been hoping for.
PU_DUBUISSON_NOR_F_MC_GoodWork_GP_003,P=Excellent. Fine work to be sure.
PU_DUBUISSON_NOR_F_MC_GotoShipIktiLeaderResponse_GP_001,P=Understood. Let us hurry then.
PU_DUBUISSON_NOR_F_MC_HostilesDestroyedEncouragement_GP_001,P=Hostile eliminated.
PU_DUBUISSON_NOR_F_MC_HostilesDestroyedEncouragement_GP_002,P=That's a kill.
PU_DUBUISSON_NOR_F_MC_HostilesDestroyedEncouragement_GP_003,P=Kill confirmed.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveCleared_GP_001,P=Not detecting any more hostiles.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveCleared_GP_002,P=Area seems secure.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveCleared_GP_003,P=All hostiles have been eliminated.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_001,P=Detecting hostile elements.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_002,P=Got hostiles inbound to your position.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_003,P=Identified several hostile threats. Careful.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_004,P=Hostile contacts.
PU_DUBUISSON_NOR_F_MC_HostilesObjectiveStart_GP_005,P=Picking up hostiles inbound.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcementsBigShip_GP_001,P=I've identified a hostile capital ship.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcementsBigShip_GP_002,P=Scans just flagged a hostile capital ship.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcementsBigShip_GP_003,P=Careful. Hostile capital ship detected.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcements_GP_001,P=Hostile reinforcements are inbound.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcements_GP_002,P=You've got additional enemies incoming.
PU_DUBUISSON_NOR_F_MC_HostilesReinforcements_GP_003,P=Be alert. Reinforcements incoming.
PU_DUBUISSON_NOR_F_MC_IFFIDisableBarge_GP_001,P=That's it. The inverter is now offline. Crusader Security have been notified and are sending units in now. They should be more than able to remove the last remnants of the Nine Tails and resecure the platforms. 
PU_DUBUISSON_NOR_F_MC_IFFIDisabledIsland1_GP_001,P=I'm reading that Inverter unit is offline and that the signal has been weakened. Well done. There is a shuttle nearby that you can use to head to the next platform. The sooner we shut down the other units, the sooner Crusader Security can regain control. 
PU_DUBUISSON_NOR_F_MC_IFFIDisabledIsland2_GP_001,P=Just received confirmation that this inverter unit is offline. The signal is barely hanging on but it's still enough to keep Crusader's ships at bay. There is a shuttle nearby that you that will take you to the next platform and the final inverter. 
PU_DUBUISSON_NOR_F_MC_Island2SecondSectionKeepGoing_GP_001,P=The Nine Tails have built up their forces throughout this area. You'll need to find a way through to reach the inverter.
PU_DUBUISSON_NOR_F_MC_Island2SecondSectionReinforcementsArriving_GP_001,P=Prepare yourself. Reinforcements are closing in. Take care of them. 
PU_DUBUISSON_NOR_F_MC_KopionCallOut_GP_001,P=Nine Tail trained kopions. Don't let them get close.
PU_DUBUISSON_NOR_F_MC_KopionCallOut_GP_002,P=Kopion units. Keep your distance if you can. 
PU_DUBUISSON_NOR_F_MC_KopionCallOut_GP_003,P=A pack of Nine Tail kopion have your scent. Don't let them pin you down. 
PU_DUBUISSON_NOR_F_MC_LeaveIktiHint_GP_001,P=You'll have to leave the ATLS here. Sadly, there's no way to bring the units through there.
PU_DUBUISSON_NOR_F_MC_Lieutenant2ConfirmLieutenantsArrival_GP_001,P=There. The Lieutenant's finally joined the party. Engage and take them out. 
PU_DUBUISSON_NOR_F_MC_Lieutenant2DeadEncouragethePlayertoLootthem_GP_001,P=Nicely done. Go ahead and search them for the inverter code.
PU_DUBUISSON_NOR_F_MC_Lieutenant2IFFIAccessFound_GP_001,P=Just as we hoped. Now you can shut down this inverter unit.
PU_DUBUISSON_NOR_F_MC_Lieutenant2MoreDropships_GP_001,P=All right, another dropship inbound.
PU_DUBUISSON_NOR_F_MC_Lieutenant2MoreDropships_GP_002,P=Be alert. There's another dropship headed your way.
PU_DUBUISSON_NOR_F_MC_Lieutenant2MoreDropships_GP_003,P=Look out. More reinforcements.
PU_DUBUISSON_NOR_F_MC_Lieutenant2TakeoutthatAirSupportEscalate_GP_001,P=Good news. Crusader has informed me that there should be some anti-air weapons stored nearby. See if you can find them.
PU_DUBUISSON_NOR_F_MC_Lieutenant2TakeoutthatAirSupport_GP_001,P=Heads up. They brought air support. Focus on taking them out.
PU_DUBUISSON_NOR_F_MC_LieutenantAppearsConfirmthatswhotheyneedtokill_GP_001,P=That is one of Mendo Ren's lieutenants. They must have the inverter code for this platform. You're cleared to engage.
PU_DUBUISSON_NOR_F_MC_LieutenantDeadEncouragethePlayertoLootthem_GP_001,P=Expertly handled. See if they have the inverter code on them.
PU_DUBUISSON_NOR_F_MC_LieutenantIFFIAccessFound_GP_001,P=Excellent. Now you can use the inverter code to deactivate this platform's unit.
PU_DUBUISSON_NOR_F_MC_LockedElevatorFirstTime_GP_001,P=I have been in contact with a Crusader Security liaison and they've informed me that elevators on the platforms are designed to go into lockdown when the security network is compromised. If you perform a manual reset on all the nodes on this branch of the network, it should become operational again.
PU_DUBUISSON_NOR_F_MC_LockedElevator_GP_001,P=This elevator will be offline until the security network is reset.
PU_DUBUISSON_NOR_F_MC_LockedElevator_GP_002,P=You won't be able to use the elevator while the security network is still under Nine Tails control.
PU_DUBUISSON_NOR_F_MC_LockedElevator_GP_003,P=Try resetting the security network to get the elevator online again.
PU_DUBUISSON_NOR_F_MC_LockedIFFIIntereact_GP_001,P=There's no way to shut the inverter down without the code.
PU_DUBUISSON_NOR_F_MC_LockedIFFIIntereact_GP_002,P=Only Mendo or his commanders will have the codes needed to shut the inverters down.
PU_DUBUISSON_NOR_F_MC_LockedWeaponsCache_GP_001,P=Locked. A senior Nine Tails member might have access to it.
PU_DUBUISSON_NOR_F_MC_LockedWeaponsCache_GP_002,P=You'll need the access codes of a senior Nine Tails member if you want to open it.
PU_DUBUISSON_NOR_F_MC_LockedWeaponsCache_GP_003,P=It won't open without the code from a senior Nine Tails member.
PU_DUBUISSON_NOR_F_MC_MendoDeadSearchBody_GP_001,P=Kill confirmed. Congratulations. Many have tried to eliminate Mendo Ren before you. Search his body and see if he's holding the last inverter code.
PU_DUBUISSON_NOR_F_MC_MendoRenIIFFIAccessFound_GP_001,P=There. That's the final code we need to shut down this inverter signal once and for all.
PU_DUBUISSON_NOR_F_MC_MissionAcceptIntro_GP_001,P=Excellent. This is Adrienne Du-Buisson with Northrock and I will be your logistics officer. It is a pleasure to have you handling this operation for us. Unfortunately, the Nine Tails have blocked all air traffic so you will have to take a shuttle there. I've alerted Crusader Security that you and your support team are en route to the platforms now.  As you can imagine, they are eager to have this whole Nine Tails problem resolved as quickly as possible. Maybe next time, they will contact us sooner. For now, get your gear and make your way to the platform shuttle.    
PU_DUBUISSON_NOR_F_MC_MissionBriefNoIktiAlt_GP_001,P=Okay, now that you're en route to the first platform, here is what you need to know. Several hours ago, members of the Nine Tails gang took over several Crusader platforms and installed Identity Friend or Foe Inverters to control the airspace. Your main objective will be to disable these inverters allowing security forces to enter and resecure the islands. Crusader Security tried their best to retake the platforms themselves but experienced heavy casualties. That's when they finally contacted us, believing that one of our small, well-trained strikeforces will have success where they failed. You can expect heavy Nine Tails' resistance once you touch down. Best of luck, I will be checking your progress and updating you as needed.
PU_DUBUISSON_NOR_F_MC_MissionBriefRespondtoIktiLeader_GP_001,P=I have been trying to re-establish contact with the team on the first platform to no avail. They were under heavy Nine Tail mortar fire so until we hear otherwise, best to consider them a total loss. Those mortars will be your first obstacle to clear once you touch down. After you clear the Inverter on the first platform, you should rendezvous with any remaining Crusader personnel on the second. Best of luck to you all, I will be checking your progress and updating you as needed.
PU_DUBUISSON_NOR_F_MC_MissionBrief_GP_001,P=Okay, now that you're en route to the first platform, here is what you need to know. Several hours ago, members of the Nine Tails gang took over several Crusader platforms and installed Identity Friend or Foe Inverters to control the airspace. Your main objective will be to disable these inverters allowing security forces to enter and resecure the islands. Crusader Security tried their best to retake the platforms themselves but experienced heavy casualties. That's when they finally contacted us, believing that one of our small, well-trained strikeforces will have success where they failed. We've managed to make contact with one of their teams still in place on the second platform. 
PU_DUBUISSON_NOR_F_MC_MissionComplete_GP_001,P=On behalf of Northrock, let me congratulate you on a succesful operation. Crusader is a very important client and I believe they will be more than satisfied by the results you've delivered. Perhaps even more importantly, Mendo Ren was dealt with and that will prove to be very welcome news to more than one interested party. You should feel pride in what you've accomplished here today. And with that, farewell until our next contract.
PU_DUBUISSON_NOR_F_MC_MissionConclusionIntro_GP_001,P=Perfect. Now that you're here, I'm going to do a bit of bookkeeping and close this current contract. Go ahead and take the elevator up to the shuttle. I've been in communication with Crusader reps and I should have more information and an updated contract for you soon.
PU_DUBUISSON_NOR_F_MC_MissionStart_GP_001,P=Hello, Adrienne Du-Buisson with Northrock here. To catch you up, it seems Crusader Security's attempts to take back their platforms from the Nine Tails gang members have been impressively unsuccessful so far. I am still collating the finer details of the situation and will have a full debrief ready for you once you're under way. The shuttle that will take you to the platforms should be just ahead. 
PU_DUBUISSON_NOR_F_MC_MissionUpdateBarge_GP_001,P=Docked at the next platform is the cargo barge the Nine Tails used to sneak past Crusader security and where you will find Mendo Ren hiding. Deal with him and that will be the final inverter code.
PU_DUBUISSON_NOR_F_MC_MissionUpdateIsland2IktiLeaderResponse_GP_001,P=An increase in Nine Tails presence doesn't bode well. Let's rendezvous with Captain Reynolds and see if we cannot combine our efforts to get to the inverter. 
PU_DUBUISSON_NOR_F_MC_MissionUpdateIsland2NoIktiALT_GP_001,P=As you make your way to the next platform, understand that by shutting down an inverter, the Nine Tails may be adjusting their offensive strategy. So be careful.
PU_DUBUISSON_NOR_F_MC_MissionUpdateIsland2_GP_001,P=Now that we're underway to the next platform, I will patch Captain Reynolds in for a status update. Captain, are you there?
PU_DUBUISSON_NOR_F_MC_PartialSecurityReset_GP_001,P=That's one node reset. Just need to complete the rest to bring the system back online.
PU_DUBUISSON_NOR_F_MC_PartialSecurityReset_GP_002,P=That security node has been reset. Do the same to the rest and we shall be in good shape.
PU_DUBUISSON_NOR_F_MC_PartialSecurityReset_GP_003,P=That node is back online. Once you finish resetting the others, we can bring this whole branch of the security network back online.
PU_DUBUISSON_NOR_F_MC_PuzzleDoorOpenConfirmation_GP_001,P=Interesting. Didn't even know this area was accessible. Check it out and then let's get back on track.
PU_DUBUISSON_NOR_F_MC_ReinforcementsArriving_GP_001,P=Prepare yourselves. Nine Tail reinforcements arriving. They don't seem to be happy about our progress so far. 
PU_DUBUISSON_NOR_F_MC_RequireanIktitoSolvePuzzleDirection_GP_001,P=Seems we are at an impasse. You might be able to use one of those Crusader ATLSes to proceed.
PU_DUBUISSON_NOR_F_MC_RespondstoMendoRenLineBarge_GP_001,P=No surprise that Mendo knows we are coming for him. Let's finish this.
PU_DUBUISSON_NOR_F_MC_RespondstoMendoRenLineIsland2_GP_001,P=Mendo Ren may be putting on a tough act, but I suspect your efforts are beginning to weaken his resolve. Let us see how bold he is after we shut down the next inverter.
PU_DUBUISSON_NOR_F_MC_RespondtoIkitiLeaderDeath_GP_001,P=Shit. Make your way into the Nine Tails ship and deal with this threat before it can become even more of an issue.
PU_DUBUISSON_NOR_F_MC_RespondtoMendoRenLineIsland1_GP_001,P=Vocal analysis identifed that as Mendo Ren, a high up commander in the Nine Tails. Northrock operatives have tried to apprehend him in the past with little success. His presence here explains why this was such a well-organized affair. If past experience is anything to go on, it is highly likely that he and his trusted lieutenants will be personally holding the access codes to the inverters. Taking them out will be a critical step to regaining control of the airspace around the platforms. Best keep your wits about you as you proceed.
PU_DUBUISSON_NOR_F_MC_RidingElevatortoLieutenantRoof_GP_001,P=Satellite imagery confirmed that another of Mendo Ren's lieutenants is on the roof. They will be holding the inverter code for this platform and as such will be your next target. 
PU_DUBUISSON_NOR_F_MC_SecurityResetFirstTimeAllreset_GP_001,P=That's all the nodes on this branch of the security network back online. The elevator should now be operational again.
PU_DUBUISSON_NOR_F_MC_SecurityResetFirstTime_GP_001,P=That's the first node reset. Get the rest of the nodes on this branch of the network back online and you'll be able to access the elevator.
PU_DUBUISSON_NOR_F_MC_ShuttleontheWay_GP_001,P=There's a ship headed to your location now to take you back to the shuttle platform you embarked from. Apologies that they won't be able to take you all the way back, but they're needed for rescue operations. 
PU_DUBUISSON_NOR_F_MC_SniperCallOut_GP_001,P=Careful. There are snipers locked onto your position.
PU_DUBUISSON_NOR_F_MC_SniperCallOut_GP_002,P=Be on alert. There are sniper nests nearby.
PU_DUBUISSON_NOR_F_MC_SniperCallOut_GP_003,P=Word of warning. There may be snipers in the area. Use caution.
PU_DUBUISSON_NOR_F_MC_WeaponCacheOpenedFirstTime_GP_001,P=So that's what the access code was for. Take a look inside and feel free to grab anything you deem useful.
PU_Forge_SHA_M_PMH_TSGPhase2TauntKnown_GP_001,P=Well shit. It's you again. Can't seem to be rid of you, can I? Oh well, maybe we'll have better luck this time and put you in the fucking ground.
PU_Forge_SHA_M_PMH_TSGPhase2TauntKnown_GP_002,P=Back again? I was hoping someone killed you by now. Well, guess we'll have to take care of that.
PU_Forge_SHA_M_PMH_TSGPhase2TauntKnown_GP_003,P=I'm gonna say it, I’m glad I ran into you again. You killed a lot of good people. Time for payback, asshole.
PU_Forge_SHA_M_PMH_TSGPhase2Taunt_GP_001,P=You know, we had a really nice thing going. We were left alone doing our thing, but now we can't turn around without running into one of you UEE assholes.
PU_Forge_SHA_M_PMH_TSGPhase2Taunt_GP_002,P=You have any idea how long it took us to fortify this place?
PU_Forge_SHA_M_PMH_TSGPhase2Taunt_GP_003,P=Here's an idea, can I hire you to just piss off? That's all you mercs care about anyway, right?
PU_Forge_SHA_M_PMH_TSGPhase3Taunt_GP_001,P=How about this? We blast the shit out of that idris and you can leave. That sound good? You won't have any reason to stay then.
PU_Forge_SHA_M_PMH_TSGPhase3Taunt_GP_002,P=People's Alliance could've just walked away. You could have too. But now they die. This should have been so much simpler.
PU_Forge_SHA_M_PMH_TSGPhase3Taunt_GP_003,P=Fine. We're gonna go scorched earth, pure annihilation. It's the one thing the Vanduul do right.
PU_Forge_SHA_M_PMH_TSGPhase5Taunt_GP_001,P=<crazy scrambled sound> You like that? Hell if I know what it means, but what I do know is that you blast that out on comms, some Vanduul are sure to come running. Have fun.
PU_Forge_SHA_M_PMH_TSGPhase5Taunt_GP_002,P=<crazy scrambled sound> Have you seen what Vanduul do to Humans? It's ugly… raw… merciless. Don't worry if you haven't. You're about to.
PU_GWindell_CIV_M_PMH_TSGGenericDeathThroe_GP_001,P=Shit, shit, shit <death scream>
PU_GWindell_CIV_M_PMH_TSGGenericDeathThroe_GP_002,P=Help, help, help!
PU_GWindell_CIV_M_PMH_TSGGenericDeathThroe_GP_003,P=Please anybody!
PU_GWindell_CIV_M_PMH_TSGGenericHostileKilledEncouragement_GP_001,P=Damn, you're good at this.
PU_GWindell_CIV_M_PMH_TSGGenericHostileKilledEncouragement_GP_002,P=Oh shit, that was amazing.
PU_GWindell_CIV_M_PMH_TSGGenericHostileKilledEncouragement_GP_003,P=You got 'em. You got 'em.
PU_GWindell_CIV_M_PMH_TSGGenericNeedHelp_GP_001,P=These ships are chewing me up.
PU_GWindell_CIV_M_PMH_TSGGenericNeedHelp_GP_002,P=Anybody lend a hand with these ships?
PU_GWindell_CIV_M_PMH_TSGGenericNeedHelp_GP_003,P=Somebody get these fighters.
PU_GWindell_CIV_M_PMH_TSGPhase5DestroyTerminalUponEnter_GP_001,P=Hey, Gabe here. I'm holed up in my ship and safe… for now at least. You'll need to get to the hangar terminal to open the outer doors so I can get out.
PU_GWindell_CIV_M_PMH_TSGPhase5SavePilotPilotdistresscall_GP_001,P=Mayday, mayday, mayday... Do you copy? Tranquility, it's Gabe.
PU_GWindell_CIV_M_PMH_TSGPhase5SuccessReward_GP_001,P=You did it. Hangar's open and launching now. Captain Martel, I'm ready to get back in there.
PU_GWindell_CIV_M_PMH_TSGPhase6ArrivesatDestination_GP_001,P=We're far enough away. I'll need some time to spin up the quantum drive.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionComplete_GP_001,P=Spun up. Thanks for getting me out of there.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionReminder_GP_001,P=I won't be able to quantum with all these fighters on me.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionReminder_GP_002,P=You need to clear out these fighters so I can spin up.
PU_GWindell_CIV_M_PMH_TSGPhase6MissionReminder_GP_003,P=There are too many fighters to quantum away. Clear them out.
PU_GWindell_CIV_M_PMH_TSGPhase6SuccessReward_GP_001,P=Hey, sorry I couldn't stick around and help out, but back when I was trapped on the station, I saw some of the Shattered Blade accidentally drop a keycard. If you're poking around their station, maybe it will help out. Thanks again and see you around.
PU_HAWKER1_SK_WalkPast_NoBuy_IG_001_YourePassingOn,P=You're passing on the deal of the century.
PU_HAWKER1_SK_WalkPast_NoBuy_IG_002_OiWhereYou,P=Hey, where you going?
PU_HAWKER1_SK_WalkPast_NoBuy_IG_003_WhyTheRush,P=Why the rush, my friend?
PU_HAWKER1_SK_WalkPast_NoBuy_IG_004_AllRightSome,P=All right some other time then. You know where to find me.
PU_HAWKER2_SK_WalkPast_NoBuy_IG_001_YourePassingOn,P=You're passing on the deal of the century.
PU_HAWKER2_SK_WalkPast_NoBuy_IG_002_HeyHeyHey,P=Hey, hey hey hey, where you going?
PU_HAWKER2_SK_WalkPast_NoBuy_IG_003_WhyTheRush,P=Why the rush, my friend?
PU_HAWKER2_SK_WalkPast_NoBuy_IG_004_OkaySomeOther,P=Okay, some other time then. You know where to find me.
PU_IKTICAPTAIN_CRU_F_MC_Death_GP_001,P=They got the drop on us... The whole thing… it was…
PU_IKTICAPTAIN_CRU_F_MC_IntroLine_GP_001,P=This is Captain Reynolds with Crusader Security. My ATLS team have been trying to make headway but we're pinned down on the second platform. We'll try to hold out for as long as we can until you can get here.
PU_IKTICAPTAIN_CRU_F_MC_Island2Arrival_GP_001,P=Hey, Captain Reynolds here. Plans have changed. My squad has been ordered to move into the ship now. We need to engage them before they have a chance to lock down their hold. Meet us there as soon as you can.
PU_IKTICAPTAIN_CRU_F_MC_Island2Brief_GP_001,P=I'm here. We've been holding them back so far but you shutting off the first inverter kicked the hornet's nest. A Nine Tail ship just arrived with reinforcements. We're going to cut our way closer to see what's going on. I'll get back in touch once you arrive.
PU_KEPLER_MOR_M_DF_DeathThroe_GP_001,P=Wait, wait, wait <scream>
PU_KEPLER_MOR_M_DF_RBMMission3CombatTaunt_GP_001,P=I'd say you should join up with the Moraine, but I don't think you've got what it takes.
PU_KEPLER_MOR_M_DF_RBMMission3CombatTaunt_GP_002,P=You're a fighter, huh? Got more spirit than most of the PA wimps they have running security.
PU_KEPLER_MOR_M_DF_RBMMission3CombatTaunt_GP_003,P=You should've run when you had the chance.
PU_KEPLER_MOR_M_DF_RBMMission3NeedHelp_GP_001,P=Hey, I need some help here!
PU_KEPLER_MOR_M_DF_RBMMission3NeedHelp_GP_002,P=Help me, please!
PU_KEPLER_MOR_M_DF_RBMMission3NeedHelp_GP_003,P=Get 'em off me!
PU_KEPLER_MOR_M_MC_RBMMission3InTransitConversationLine11_GP_001,P=So what am I supposed to do? It's not like I can just come back.
PU_KEPLER_MOR_M_MC_RBMMission3InTransitConversationLine14_GP_001,P=Yeah, fine.
PU_KEPLER_MOR_M_MC_RBMMission3MoraineAmbushPlayerArrivesLine1_GP_001,P=So you're the one Recco sent, huh? I like your ship... Hopefully we won't damage it too much.
PU_KEPLER_MOR_M_MC_RBMMission3MoraineAmbushPlayerArrivesLine3_GP_001,P=Shut up. I said I was done with you all, but you just won't listen. You never listen, so maybe you'll listen to this. Moraine have done more for me than the Alliance ever did. Now, how about that ship?
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine2_GP_001,P=Who's this?
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine4_GP_001,P=How'd you find me?
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine6_GP_001,P=What do you think? I'm done with you all. The People's Alliance are a joke. I bought into their bullshit for years, but they can't even stand up to the gangs, so do you think for a second the Governing Committee's gonna do anything when the Vanduul push in? Shit, they'd probably send them a cake and hope that they can make peace.
PU_KEPLER_PEO_M_MC_RBMMission3InTransitConversationLine9_GP_001,P=They weren't supposed to kill anyone. Lucas should've just handed over the haul, but he just kept pushing them and when he found out I'd tipped them off... he went crazy. He wouldn't stop hitting me... until they stopped him.
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyArrive_GP_001,P=Hey, this is Captain Amir Lucas, Recco said you'd be helping out. You should be able to get in through the front of the ship. Our weapons locker is up there too. I think they're loaded...
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyBoard_GP_001,P=Barricade's still holding, but I'm not sure for how much longer. I hate asking you to do this, but I think you're going to have to fight them.
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyMoraineCleared_GP_001,P=I think you got them all. It's a shame it had to come to violence, but that's the universe these days, I guess. Anyway, thank you. You've already done so much for us, but can you do one more thing? The Moraine took out our power plant and I was hoping you could fix it before you left. I'd rather not take the time to dismantle the barricade until we're back in Levski.
PU_LUCAS_PEO_M_MC_RBMMission1EmergencyPowerplantFixed_GP_001,P=Power's back online. Seems you're as handy with a multi-tool as your are with a gun. Thanks for your help. We'll start heading back as soon as you're clear.
PU_REN_NIN_M_MC_ArrivalBarge_GP_001,P=If you think I'm just gonna let you waltz in here, you've got another thing coming. You're not getting to the last inverter, you hear me?
PU_REN_NIN_M_MC_ArrivalIsland1_GP_001,P=Well look who we have here. Crusader's even more pathetic than I thought if they're relying on the likes of you to save their ass. Quicker you accept that Nine Tails control the skies around these platforms, the better it'll be for everyone. And to make sure it stays that way, I got my best people on each platform guarding the inverters. Trust me. Best thing you can do is get back on that shuttle right now. This ain't your problem.
PU_REN_NIN_M_MC_ArrivalIsland2Ikti_GP_001,P=Listen up. We may have lost the first platform, but no way I'm letting that happen here. Few ATLS ain't going to change that. Try your worst.
PU_REN_NIN_M_MC_BargeDoorsOpenTaunt_GP_001,P=Fine, you're so eager to meet me? Then come on in.
PU_REN_NIN_M_MC_Death_GP_001,P=<painful scream> Nine Tails are gonna… you….
PU_REN_NIN_M_MC_EliteDeathFirstTime_GP_001,P=Damn. That's a disappointment. Here you think you know someone and then they go ahead and get wasted by a squad of slaggers. Doesn't deserve to be called a Nine Tails that one.
PU_REN_NIN_M_MC_GeneralTaunts_GP_001,P=Come on, let's kill this scum already!
PU_REN_NIN_M_MC_GeneralTaunts_GP_002,P=No matter what you do, Nine Tails have already won.
PU_REN_NIN_M_MC_GeneralTaunts_GP_003,P=I'm gonna see you bleed if it’s the last thing I do.
PU_REN_NIN_M_MC_GeneralTaunts_GP_004,P=Guess Crusader got their credits worth hiring you lot.
PU_REN_NIN_M_MC_GeneralTaunts_GP_005,P=If I wasn't so pissed off at you, I might be a little impressed.
PU_REN_NIN_M_MC_GeneralTaunts_GP_006,P=There's a promotion waiting for whichever Nine Tail ends this.
PU_REN_NIN_M_MC_IroncladEliteDeath_GP_001,P=I told them to destroy those ATLS, but did they? No. Guess that's what I get workin' with a bunch of cutthroats. Nobody bloody listens.
PU_REN_NIN_M_MC_LastStandTaunt_GP_001,P=Enough's enough. I'm Mendo fuckin' Ren! The scourge of seven planets and the black heart of the Nine Tails. We settle this now!
PU_REN_NIN_M_MC_Lieutenant1Death_GP_001,P=Damn idiot was so focused on regens when he should've tried to stay alive a bit harder. Whatever. Go ahead and shut off that inverter. Won't make a lick of difference. We're still in control here. 
PU_REN_NIN_M_MC_Lieutenant1Intro_GP_001,P=All right, Remy. Get ready. You got some company heading your way. Show them what a real Nine Tails can do.
PU_REN_NIN_M_MC_Lieutenant2Death_GP_001,P=Hell… Stax… Never thought I'd see the day. Go ahead and do you what you want with that Invertor. We still got one and that's more than enough.
PU_REN_NIN_M_MC_Lieutenant2IntroResponse_GP_001,P=[Chuckles] Haven't thought about that one in a while. But hey, as long as you kill 'em, make as much mess as you want this time. 
PU_REN_NIN_M_MC_Lieutenant2Intro_GP_001,P=Alright, you're on deck, Stax. Watch out for yourself, okay? 
PU_REN_NIN_M_MC_MendoAppearsTauntPart1_GP_001,P=You just couldn't leave well enough alone could you? Now it's gonna cost you your life. Hope you enjoyed playing hero.
PU_REN_NIN_M_MC_MendoAppearsTauntPart2_GP_001,P=All right, let's try this again. Your luck's gotta run out at some point.
PU_REN_NIN_M_MC_MendoAppearsTauntPart3_GP_001,P=So, you think you can take me? Well here I am! Hit me with your best shot.
PU_REN_NIN_M_MC_MendoRaisesCorePart1_GP_001,P=Let's up the ante, shall we. Go on and see how well you deal with this, eh?
PU_REN_NIN_M_MC_MendoRaisesCorePart2_GP_001,P=Second time's the charm, right? Time to take things to the next level.
PU_REN_NIN_M_MC_MendoRaisesCorePart3_GP_001,P=No more, this is it. This is everything we bloody got. So bring your worst!
PU_REN_NIN_M_MC_MendoTakesdamageandleavesPart1_GP_001,P=You won't get the best of me that easy. I'm not done with you yet.
PU_REN_NIN_M_MC_MendoTakesdamageandleavesPart2_GP_001,P=Argh! I'm getting really sick and tired of you.
PU_REN_NIN_M_MC_MendoTakesdamageandleavesPart3_GP_001,P=Damn it, damn it, damn it. I'm seriously fuckin' over this. 
PU_REN_NIN_M_MC_PlayerDeactivatesCoresPart1_GP_001,P=You got to be bloody kidding me. Even that wasn't enough?
PU_REN_NIN_M_MC_PlayerDeactivatesCoresPart2_GP_001,P=Just when I think you can't get any more irritating, you go and do shit like this.
PU_REN_NIN_M_MC_PlayerDeactivatesCoresPart3_GP_001,P=Figures you'd survive that too. Guess today isn't my day after all.
PU_REN_NIN_M_MC_PlayerDiesTauntFalling_GP_001,P=Sort of takes the fun out of it if you're just gonna fall to your deaths.
PU_REN_NIN_M_MC_PlayerDiesTaunt_GP_001,P=Look at that, your friend's a corpse. 
PU_REN_NIN_M_MC_PlayerDiesTaunt_GP_002,P=There we go. One less of you slaggers. 
PU_REN_NIN_M_MC_PlayerDiesTaunt_GP_003,P=That's a kill for our side. You still feeling cocky?
PU_REN_NIN_M_MC_RadiationTaunts_GP_001,P=How you feelin' down there? You ain't lookin' so hot.
PU_REN_NIN_M_MC_RadiationTaunts_GP_002,P=Are your bones startin' to hurt yet? That's one of the first symptoms, I hear.
PU_REN_NIN_M_MC_RadiationTaunts_GP_003,P=My crew don't have to worry about payin' for a doctor neither. Promised them if they kill you, Nine Tails will cover the bill.
PU_REN_NIN_M_MC_RadiationTaunts_GP_004,P=These cores weren't designed for this, but sometimes you got to think outside the box, eh?
PU_REN_NIN_M_MC_RadiationTaunts_GP_005,P=Bet your bloods beginning to boil. Can you feel it?
PU_REN_NIN_M_MC_ReinforcementsArriveIsland1_GP_001,P=I gotta tell ya, I'm getting pretty sick and tired of you interfering with Nine Tails business. Gloves are coming off. See if you can handle this.
PU_REN_NIN_M_MC_ReinforcementsArriveIsland2_GP_001,P=Why the hell won't you just die already? No shittin' way am I'm losing to you. Let's see if you can survive this.
PU_REN_NIN_M_MC_ResetSecurityFirstTime_GP_001,P=You probably think you're making good progress so far. And yeah, maybe we started off underestimating you, but don't worry, that'll change.
PU_RefuelNPC01_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Well, that was absolutely terrifying. Okay, let's hurry up and get the fuel transfer done.
PU_RefuelNPC01_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=Is that all of them? Alright, how about we finish this and get the hell out of here.
PU_RefuelNPC01_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Thank you. This system's getting more dangerous by the day. Let's finish this before more show up.
PU_RefuelNPC01_CIV_M_ATC_RefuelingComplete_GP_001,P=That's it. Ready to go. Thanks again and sorry for the trouble.
PU_RefuelNPC01_CIV_M_ATC_RefuelingComplete_GP_002,P=Okay. Fuel transfer's done. Thanks for the rescue. I hope it wasn't too much bother for you.
PU_RefuelNPC01_CIV_M_ATC_RefuelingComplete_GP_003,P=Phew. All refueled. Thanks so much for the help. I'm going to try to be a bit better about watching my gauges next time.
PU_RefuelNPC01_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Death Scream ]
PU_RefuelNPC01_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=Great. We're docked up. Go ahead and authorize the fuel transaction.
PU_RefuelNPC01_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Docking complete. Just need you to confirm the fuel transaction.
PU_RefuelNPC01_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=That should do it. Set the fuel transaction terms, and I'll take a look.
PU_RefuelNPC01_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Hold up. I lost connection.
PU_RefuelNPC01_CIV_M_ATC_RefuelingIncomplete_GP_002,P=Hey, I still need more fuel.
PU_RefuelNPC01_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Wait, the fuel transfer wasn't done yet.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Hey, thanks for showing up. I feel like an idiot for running out of fuel. If you want to dock up quick, we can get this over with.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=Hey, over here. I'm really sorry about this. I could've sworn I calculated the distance right… Anyway, let's get docked up so you can get on your way.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Hi. Sorry, this is really embarassing. I had a bunch of things I needed to pick up from the last transfer station and I guess I forgot to get fuel. Such a rookie mistake. Anyway, sorry, if we can get docked, I can get you out of here.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=All right, come back soon. I'll be here waiting.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=No worries, take care of whatever you have to. I'll be here when you're ready.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Oh, you're leaving… yeah, sure, that's fine. I can wait.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=Okay, let's get reconnected so we can get out of here.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Welcome back. Let's dock and finish the refuel.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=Glad you made it. I'm ready to dock when you are.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=That's great. Seeing the fuel transfer now.
PU_RefuelNPC01_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=That price's a bit higher than I was expecting.
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Holy shit! Who the hell is that?!
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Got company… got bad company…
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=Help! I'm under attack.
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=Hey! What gives?
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=Why did you do that?!
PU_RefuelNPC01_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=What the hell's the matter with you?
PU_RefuelNPC02_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Thank the powers. Gotta admit it got tense there for a moment. Now that's done, let's finish up.
PU_RefuelNPC02_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=That was close. Let's finish refueling so I can get gone.
PU_RefuelNPC02_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Glad that's over. Hopefully we can finish up without any more issues.
PU_RefuelNPC02_CIV_M_ATC_RefuelingComplete_GP_001,P=Alright. Looks like we're done. I'm out of here.
PU_RefuelNPC02_CIV_M_ATC_RefuelingComplete_GP_002,P=Okay. I'm refueled. Thanks. And sorry if I was a bit short with you. Just one of those days. Safe flying.
PU_RefuelNPC02_CIV_M_ATC_RefuelingComplete_GP_003,P=There. Tank's full. Thought I would never get out of here. Okay. I'm off.
PU_RefuelNPC02_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Death Scream ]
PU_RefuelNPC02_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=We're connected. Get the pricing set so we can get going.
PU_RefuelNPC02_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Docked. Go ahead and send the pricing over.
PU_RefuelNPC02_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Connection confirmed. Set the transaction terms so we can get started.
PU_RefuelNPC02_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Hey, I wasn't done refueling yet.
PU_RefuelNPC02_CIV_M_ATC_RefuelingIncomplete_GP_002,P=What's going on? We're not done refueling.
PU_RefuelNPC02_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Something wrong? I still need more fuel.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Good, you're here. Go ahead and dock so we can get this show on the road.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=About time. Was about to lose my mind if I had to float any longer. Get docked so I can get out of here.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Glad someone showed up. Why don't you hurry up and dock. No reason this has to take any longer than it needs to.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=Okay… Guess I'm supposed to just wait here then?
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=Hurry up and come back, okay? I don't want to spend all day waiting on you.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Sure... Leave me waiting here. It's not like I have anything better to do.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=How about you dock so we can finish this. Or are you going to waste more of my time?
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=There you are. Dock already and we can wrap this up.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=And my savior returns. How about you dock so I can get going.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Filling up my tank now. Should be done soon.
PU_RefuelNPC02_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=That's more than I can pay.
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Damn it. What else can go wrong today!
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Crap! Get them off me!
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=You gotta be kidding me. First the fuel, and now this?
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=What the hell are you doing?!
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=Have you lost your mind?
PU_RefuelNPC02_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=What the hell was that for?
PU_RefuelNPC03_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Seems we're safe for now. Better finish refueling.
PU_RefuelNPC03_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=I think that was the last of 'em. Let's finish sorting my fuel while we can.
PU_RefuelNPC03_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=All clear. Hopefully we can finish refueling before any more trouble shows up.
PU_RefuelNPC03_CIV_M_ATC_RefuelingComplete_GP_001,P=And there we go. Topped off and ready to fly. Thanks for all your hard work.
PU_RefuelNPC03_CIV_M_ATC_RefuelingComplete_GP_002,P=Done. Thanks for the refuel. Fly safe out there.
PU_RefuelNPC03_CIV_M_ATC_RefuelingComplete_GP_003,P=Great. All fueled up. Though here's hoping I won't need your services again for a while.
PU_RefuelNPC03_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Death Scream ]
PU_RefuelNPC03_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=All right. Connected. Not too bad. Just need you to approve the fuel transaction.
PU_RefuelNPC03_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=There we go. All hooked up. I'm ready to look at the fuel transaction terms as soon as you send 'em my way.
PU_RefuelNPC03_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Looks like we're set. Go ahead and confirm the fuel transaction.
PU_RefuelNPC03_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Uh… you know we're not done yet, right?
PU_RefuelNPC03_CIV_M_ATC_RefuelingIncomplete_GP_002,P=Hold on there. I'm still not refueled yet.
PU_RefuelNPC03_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Whoa, what's happening? I still need more fuel.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=Ah, perfect. You're here. Appreciate the help. Can't believe I ran out. Anyway, I'm ready to dock when you are.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=Great, thanks for coming. I'm all set to dock so we can start whenever you want. I actually used to fly a tanker myself so I know what it's like. Makes it that much more embarassing that my fuel dried up. Anyway, I'll leave you to it.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Hey, you made it. Thanks for coming. Where would the 'verse be without refuelers like you, huh? I've got everything set up so we can start the transfer once you're docked.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=Okay, if you got something urgent, I can just hold tight until you get back with the rest of the fuel.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=Oh, you're ducking out for a minute? No worries. I'll hang out here. Just hurry back, okay?
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=We taking a little break? Just don't take too long, all right. Would be good to get back flying soon.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=Welcome back. I'm still ready to dock.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Nice to see you again. Let's get docked and refueled.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=Glad you made it back. Shall we go ahead and get this refueling sorted once and for all?
PU_RefuelNPC03_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Okay, fuel transferring now.
PU_RefuelNPC03_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=You better be joking with that price. Try again.
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Oh, shit. I'm taking fire!
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Damn it. Could they have picked a worse time?
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=Can you believe these assholes?
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=What the hell's gotten into you?
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=Hey, you're supposed to help me, not shoot me.
PU_RefuelNPC03_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=What was that for?
PU_RefuelNPC04_CIV_M_ATC_RefuelingCombatEnds_GP_001,P=Geez. That was too close. Finish refueling before any more trouble shows up.
PU_RefuelNPC04_CIV_M_ATC_RefuelingCombatEnds_GP_002,P=Was that all of them? Let's finish refueling so I can get the hell out of here.
PU_RefuelNPC04_CIV_M_ATC_RefuelingCombatEnds_GP_003,P=Good riddance. Now hurry up and finishing refueling me.
PU_RefuelNPC04_CIV_M_ATC_RefuelingComplete_GP_001,P=There. All done. And no, you won't be getting a tip.
PU_RefuelNPC04_CIV_M_ATC_RefuelingComplete_GP_002,P=That's it. Got my fuel. Bye.
PU_RefuelNPC04_CIV_M_ATC_RefuelingComplete_GP_003,P=Good. We're finally finished. I'm out of here.
PU_RefuelNPC04_CIV_M_ATC_RefuelingDeathThroe_GP_001,P=[ Death Scream ]
PU_RefuelNPC04_CIV_M_ATC_RefuelingDockingComplete_GP_001,P=Docked. Set the transaction to what we agreed.
PU_RefuelNPC04_CIV_M_ATC_RefuelingDockingComplete_GP_002,P=Okay. We’re docked. Just set the transaction price to what was agreed.
PU_RefuelNPC04_CIV_M_ATC_RefuelingDockingComplete_GP_003,P=Everything's connected. Set the price to what I specified. No funny stuff.
PU_RefuelNPC04_CIV_M_ATC_RefuelingIncomplete_GP_001,P=Where the hell are you going with my fuel?
PU_RefuelNPC04_CIV_M_ATC_RefuelingIncomplete_GP_002,P=Hey, we're not done here.
PU_RefuelNPC04_CIV_M_ATC_RefuelingIncomplete_GP_003,P=Uh, if you hadn't noticed, you didn't finish refueling me.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerArrives_GP_001,P=You must be my refueler. And before you ask, no, I don't want any extra services. Just the refuel. Now go ahead and dock.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerArrives_GP_002,P=I was wondering when my tanker was going to show up. Anyway, what are you waiting for? Go ahead and dock.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerArrives_GP_003,P=Let's just skip the pleasantries, okay? You're here to do a job, so go ahead and dock.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=You're leaving? I guess I don't have anything better to do with my time than wait around here for you to come back.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=I can't believe you're leaving without finishing. Fine. Whatever. Just get back as soon as possible.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Wow. How professional. Guess I'm expected to just sit here waiting for you to feel like coming back? Sure. Why not.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_001,P=Finally. Dock so we can get this over with.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_002,P=Look who decided to come back? Dock already and finish refueling me.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPlayerReturnstoArea_GP_003,P=About time. You know, I should really get a discount after sitting here waiting. Whatever, go ahead and dock. I'm late enough as it is.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPriceAccepted_GP_001,P=Okay, fuel's transferring. And don't bother with small talk.
PU_RefuelNPC04_CIV_M_ATC_RefuelingPriceRejected_GP_001,P=I'm not paying that.
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Damn it! I can't afford extra repairs right now!
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=What the hell are they shooting me for?
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=Oh, hell no! Get them off me!
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=Watch what you're shooting!
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=Hey! That how you treat a customer?
PU_RefuelNPC04_CIV_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=What the hell? You're shooting at me?!
PU_RefuellingProvider01_UWC_M_ATC_RefuelingArrivesatPlayersLocation_GP_001,P=Hey there, I'm gonna be your refueler for today. Go ahead and request to dock so we can started.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingArrivesatPlayersLocation_GP_002,P=Low on gas, huh? Happens to the best of us. Well, request to dock and we can see about getting you back out on the move.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingArrivesatPlayersLocation_GP_003,P=How's it going? Got some fuel here with your name on it. Just need yo to request to dock and we can get you out of here.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingCombatEnds_GP_001,P=Okay, glad that's over. Let's finish up the refueling while we can.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingCombatEnds_GP_002,P=I think we're good. Connect the ships before more show up.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingCombatEnds_GP_003,P=That all of them? Good. Let's get you fueled up.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingComplete_GP_001,P=All right, you should be all set. Hope you have a good rest of your day.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingComplete_GP_002,P=Tank's full. Stay safe out there.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingComplete_GP_003,P=We are all good now. Tank's full and space awaits. Take it easy.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDeathThroe_GP_001,P=[ Death Scream ]
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDockingComplete_GP_001,P=Okay, we're all connected. Once you confirm the fuel purchase from you mobi I can start the transfer.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDockingComplete_GP_002,P=Alright… link established. You should be able to see the fuel purchase order in your mobi now. Once you confirm I can start filling your tanks.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingDockingComplete_GP_003,P=And there we go. Linked up. Now we just need you to sign off on the fuel purchase in your mobiGlas.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingEndingContractEarlier_GP_001,P=You know what, I got other clients waiting. We're done here.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingEndingContractEarlier_GP_002,P=Okay, I think I know where this is headed. I'm out of here.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingEndingContractEarlier_GP_003,P=I don't have time for this. Good luck.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingFuelTransferStarting_GP_001,P=Okay, transferring fuel now.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingFuelTransferStarting_GP_002,P=Great, starting fuel transfer.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingFuelTransferStarting_GP_003,P=Looks good. Fuel's a-flowing.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingIncomplete_GP_001,P=Woah! The transfer wasn't done yet.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingIncomplete_GP_002,P=Why'd you break? You aren't refueled.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingIncomplete_GP_003,P=Lost the connection. What happened?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingPlayerLeavesArea_GP_001,P=Where do you think you're going? What about the rest of the fuel?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingPlayerLeavesArea_GP_002,P=What's going on? Your ship's not full yet.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingPlayerLeavesArea_GP_003,P=Uh… hello? We haven't finished the refueling.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyOther_GP_001,P=Damn it, we got trouble.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyOther_GP_002,P=Look out. Got some hostiles.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyOther_GP_003,P=Watch it. They don't look like they're here to help.
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyPlayer_GP_001,P=Hey! I'm trying to help you!
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyPlayer_GP_002,P=What the hell are you doing?
PU_RefuellingProvider01_UWC_M_ATC_RefuelingShipAttackedbyPlayer_GP_003,P=Oh hell no. I'm out of here.
PU_Tobin_INT_M_PMH_TSGMissionAbandon_GP_001,P=I'll need to find someone else to take care of this contract.
PU_Tobin_INT_M_PMH_TSGMissionAbandon_GP_002,P=Look, InterSec can't use people who don't follow through on contracts. If you're gonna work for us, make sure you can commit.
PU_Tobin_INT_M_PMH_TSGMissionAbandon_GP_003,P=You're walking away from a volatile situation that still needs to be resolved. Please don't do this in the future.
PU_Tobin_INT_M_PMH_TSGMissionAcceptIntro_GP_001,P=This is Deacon Tobin. I'll be your op manager over here at Intersec. An anonymous source has indicated that a People's Alliance security ship has been crippled by a Shattered Blade station and desperately needs help. I've contacted their captain and told them that you're inbound with all due haste. They'll establish contact and walk you through what needs to be done when you arrive.
PU_Tobin_INT_M_PMH_TSGMissionAccept_GP_001,P=Deacon from Intersec here. These People's Alliance ships seem to keep kicking the hornet's nest. You know the drill. They'll direct once you're on site. Good luck.
PU_Tobin_INT_M_PMH_TSGMissionAccept_GP_002,P=Intersec calling. Seems the People's Alliance found another Shattered Blade station and are in need of help. Scramble to the AO as quick as you can and they'll direct from there.
PU_Tobin_INT_M_PMH_TSGMissionAccept_GP_003,P=Tobin at Intersec calling. Got another situation between the People's Alliance and Shattered Blade. Head out there and they'll advise.
PU_Tobin_INT_M_PMH_TSGMissionFail_GP_001,P=Hate to do it, but I'm calling this operation. There is a zero chance of success now.
PU_Tobin_INT_M_PMH_TSGMissionFail_GP_002,P=I'm pulling you out. We've lost any chance of completing this mission.
PU_Tobin_INT_M_PMH_TSGMissionFail_GP_003,P=This op isn't going to work. We've lost control of the situation.
PeoplesAlliance_RepUI_Area=Nyx
PeoplesAlliance_RepUI_Description=An independent community based in the Nyx system that's striving to built a truly egalitarian Human society.
PeoplesAlliance_RepUI_Focus=Empathy & Community 
