item_DescMRCK_S01_DRAK_Single_S01,P=Item Type: Missile Rack\nManufacturer: Drake Interplanetary\nSize: 1\nMissiles: 6xS1\n\nDesigned to turn the tide in combat, Drake developed this missile rack to carry a relatively large amount of firepower for the ship's size.
item_DescMRCK_S02_ORIG_100i_Dual_S02,P=Item Type: Missile Rack\nManufacturer: Origin Jumpworks\nSize: 2\nMissiles: 2xS2\n\nBespoke missile rack for the 100i that fires two S2 missiles.
item_DescMRCK_S02_ORIG_125a_Quad_S02,P=Item Type: Missile Rack\nManufacturer: Origin Jumpworks\nSize: 2\nMissiles: 4xS2\n\nBespoke missile rack for the 125a that fires four S2 missiles.
item_DescMRCK_S03_GAMA_Railen_Dual_S02=Item Type: Missile Rack\nManufacturer: Gatac Manufacture\nSize: 3\nMissiles: 2xS2\n\nDesigned by Gatac, this missile rack is capable of storing two S2 missiles.
item_DescMRCK_S04_GAMA_Railen_Octo_S01=Item Type: Missile Rack\nManufacturer: Gatac Manufacture\nSize: 4\nMissiles: 8xS1\n\nDesigned by Gatac, this missile rack is capable of storing eight S1 missiles.
item_DescMRCK_S05_ANVL_Gladiator_Quad_S05=Item Type: Missile Rack\nManufacturer: Anvil Aerospace\nSize: 5\nMissiles: 4xS5 \n\nThis quad missile rack bespoke to the Gladiator holds four S5 missiles.
item_DescMRCK_S05_DRAK_Ironclad_Torpedo_Silo=Item Type: Missile Rack\nManufacturer: Drake Interplanetary\nSize: 5\nMissiles: 5xS5\n\nThis bespoke rack for the Drake Ironclad can carry and deploy five S5 torpedoes.
item_DescMeteor_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Meteor with the Nightbreak livery, which is primarily black with red highlights.
item_DescPOWR_VNCL_S04_Mauler=The Vanduul Mauler's built-in Power Plant generates enough energy for the operation of essential systems, even in heavy combat.
item_DescPitbull_Cream_Silver_Silver=The Wind Chill livery for the Pitbull features crisp white paint with black highlights and silver accents.
item_DescPitbull_Metal_Metal_Yellow=The Aquamarine livery gives a metallic teal base with subtle yellow accents to make a statement, before you throw a punch.
item_DescPitbull_Red_Black_Black=Dive into combat with this blood red livery for your Pitbull to show everyone on the battlefield exactly what you're out for.
item_DescPitbull_Yellow_Black_Black=When you want them to see you coming, the Hardstrike livery is a bold explosion of yellow to make every fight even more vibrant.
item_DescPlayerDeco_Flair_Banu_Instrument_1_a=Inspired by Human-made instruments which were the Banu's first introduction to music, this ornately decorated Ochelo features four strings on a raised fret and a leather-skinned drum base. Some of the most popular practitioners of the instrument have risen to fame performing as buskers in markets and city squares. 
item_DescPlayerDeco_Flair_VanduulLance_DisplayCase=Mounted onto a standing case, this display shows the remains of a Vanduul lance recovered from the aftermath of the Battle of Vega.
item_DescPlayerDeco_Gunrack_4P_3R_Lowtech_1_a=Made for the weapon enthusiast who values their guns for more than just the amount of damage they can do. Complete with numerous display shelves for your favorite arms, as well as storage space for spare ammo and accessories, all in a stylish package that shows off your top picks.
item_DescQDRV_VNCL_S04_Mauler=This Quantum Drive has been calibrated to allow for the Mauler to undertake long and short quantum travel as well as access jump points.
item_DescQTNK_VNCL_S04_Mauler=This Quantum Fuel Tank stores fuel to power the Mauler's quantum engine.
item_DescRADR_VNCL_S04_Mauler=The Radar system for the Vanduul Mauler allowing it to detect objects large and small for navigational and combat data.
item_DescRAFT_Paint_White_Blue_Blue=Crisp white with blue accents, the Keystone livery celebrates the workers whose mining, refining, hauling, salvaging, and more have made the empire what it is today.
item_DescRSI_LaserRepeater_S5=Manufacturer: Robert Space Industries\nItem Type: Laser Repeater\nSize: 5\n\nDesigned to overwhelm shields with a barrage of laserfire, this custom-made RSI Echion laser repeater will strip enemies of their defenses leaving them vulnerable to more devastating attacks.
item_DescRailen_Paint_Black_Black_Black_Stencil_1,P=The Hyaotan edition features a subtle dark grey, wave-like pattern over its light grey base, with embedded blue lights unique to this edition to give off that otherworldly shine.
item_DescRailen_Paint_Black_Black_Black_Stencil_2=The Malachitus edition features an iridescent green, wave-like pattern over it's black base, which gives off a mesmerizing glow in the light of the stars.
item_DescRailen_Paint_Bronze_Grey_Teal=The Insularis livery adds a sleek, ethereal teal and patina metal finish to emphasize and celebrate the otherworldly nature of the Railen.
item_DescRailen_Paint_Gold_Grey_Grey_Stencil_1=The Uamchuai edition breaks the mold with grey and sand-brown base, with flattering dusty gold highlights that flow down the ship's hull.
item_DescRailen_Paint_Grey_Grey_Gold,P=The Agapanthia edition bears a sleek black base with subtle dark gold highlights that flow down the ship's hull.
item_DescRailen_Paint_Hyaotan_black_blue=Make your Railen cargo ship even more visually distinct and dynamic with the Hyaotan livery that's black with blue highlights.
item_DescRailen_Paint_White_Grey_Gold,P=The Ch.iiing edition boasts a bold white base with eye-catching gold highlights that flow down the ship's hull.
item_DescRetaliator_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Retaliator with the Nightbreak livery, which is primarily black with red highlights.
item_DescSHLD_VNCL_S04_Mauler,P=The Mauler's shield generator provides defensive coverage against incoming fire and other threats to the ship.
item_DescShiv_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Shiv with the Nightbreak livery, which is primarily black with red highlights.
item_DescStarlite_Paint_black_black_gold=For the Starlite captains who prefer to make a subtle statement, MISC offers the distinguished Dusk Livery. A complete grey hull highlights the ship's classic silhouette with tasteful gold trim.
item_DescStarlite_Paint_grey_red_black=The Starlite gets a cool grey top and vivid red bottom with the subtle yet striking Bonfire livery.
item_DescStarlite_Paint_khaki_black_white=Prepare your Starlite for the journey ahead with the Mojave livery featuring a tan top, gray lower, and white trim.
item_DescStarlite_Paint_white_black_yellow=Give the Starlite a bold new look with the Empyrean Livery which features a dynamic tricolor design. Yellow highlights divide a white nose from a grey mid-section lending the ship an added appearance of speed.
item_DescSyulen_Paint_bronze_grey_red=Make your Syulen one worthy of admiration with the Kenglath livery that provides the ship a rich bronze marbled look in shades of gray and red undertones.
item_DescTiburon_Paint_blue_lightblue_red=Tear your enemies to pieces with the Colmillos livery, transforming the Tiburon with a steely blue and ferocious shark teeth.
item_DescTiburon_Paint_green_green_red=Predominately a military green with touches of red, the Pinnacle livery brings a grounded aesthetic to the Tiburon.
item_DescTiburon_Paint_grey_white_silver=Combining shades of gray, white and silver, the Enforcer livery emphasizes the sturdiness of the Tiburon with its layered appearance.
item_DescTiburon_Paint_red_grey_grey=The Vermillion livery utilizes a striking red as its primary color, complete with deep black accents.
item_DescTyilui_Paint_Black_Black_Black_Stencil_2=The Tatomidae edition features an elegant, metallic, maroon wave-pattern across the sleek, dark hull.
item_DescTyilui_Paint_Bronze_Grey_Teal=The Insularis livery adds a sleek, ethereal teal and patina metal finish to emphasize and celebrate the otherworldly nature of the Tyilui.
item_DescTyilui_Paint_Gold_Grey_Grey_Stencil_1=The Uamchuai edition breaks the mold with grey and sand-brown base, with flattering dusty gold highlights that flow down the ship's hull.
item_DescTyilui_Paint_Grey_Grey_Gold,P=The Agapanthia edition bears a sleek black base with subtle dark gold highlights that flow down the ship's hull.
item_DescTyilui_Paint_White_Grey_Gold,P=The Ch.iing edition boasts a bold white base with eye-catching gold highlights that flow down the ship's hull.
item_DescUTV_Paint_Brown_Grey_Red=Light brown and grey camo combine with red highlights for the Resistor Camo livery.
item_DescUTV_Paint_Gold_Black_Black=The Bonanza livery gives the UTV a lustrous look with its gold and black finish.
item_DescUTV_Paint_Green_Grey_Red=The Wilderness Camo livery brings a classic green and grey camo pattern to the UTV with red highlights.
item_DescUTV_Paint_Grey_Black_Orange=Bright pops of orange stand out against the grey base paint of the Reckoner livery.
item_DescUTV_Paint_White_Blue_Blue=Crisp white with blue accents, the Keystone livery celebrates the workers whose mining, refining, hauling, salvaging, and more have made the empire what it is today.
item_DescVNCL_Gen2_LaserBeam_S9=Manufacturer: Vanduul\nItem Type: Laser Beam\n\nThis destructive laser beam typically found on Vanduul warships, is commonly known by its \nUEE Navy designation, 'IGNITER'.
item_DescVNCL_Gen2_LaserRepeater_S6=Manufacturer: Vanduul\nItem Type: Laser Repeater\n\nThis close range laser repeater, standard for larger Vanduul capital ships, is referred to by the \nUEE Navy's designation of 'STRIKER'.
item_DescVNCL_Gen2_PlasmaCannon_S8=Manufacturer: Vanduul\nItem Type: Plasma Cannon\n\nThis hard-hitting plasma cannon, often seen on Vanduul battleships, is referred to as 'RAGE,' its UEE designation.
item_DescVNCL_Gen2_TachyonCannon_S10=Manufacturer: Vanduul\nItem Type: Tachyon Cannon\n\nThis devestatingly powerful Tachyon cannon, typically found on large-scale Vanduul \ncapital ships, is more commonly referred to by its UEE Navy designation of 'ANNIHILATOR'.
item_DescVNCL_Gen2_TachyonCannon_S7=Manufacturer: Vanduul\nItem Type: Tachyon Cannon\n\nThis powerful Tachyon cannon, prized on Vanduul warships for it's long range, is more \ncommonly referred to by it's designated UEE designation of 'ERADICATOR'.
item_DescWolf_Paint_Black_Black_Red_Camo=Discreetly soar through the night sky in the Wolf with the Nightbreak livery, which is primarily black with red highlights.
item_Desc_COMP_WLOP_S00_Adze=Item Type: Computer\nManufacturer: WillsOp\nSize: 0\nGrade: C\nClass: Civilian\n\nYou can now experience the robust data processing of WillsOp in a mobile form factor with the Adze computing system.
item_Desc_Carryable_2H_CY_CollectorMaterial_001=This is a test for new metamaterial with special design by Wikelo. It will be light and strong but maybe not! Good to test.
item_Desc_Carryable_2H_SQ_CollectorMaterial_002=This a new metamaterial test with design by Wikelo. I think one will this help make things go faster. Last two tests not so good, but maybe this one works. 
item_Desc_DMC_gloves_01_01_02=DMC's Gauntlet gloves feel like a hard day's work. Built with resilient GranTec composite weaves, these Gauntlets live up to their name, providing maximum protection against environments and impacts so you can work another day.
item_Desc_GRIN_utility_medium_arms_03_05_16,P=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nMade for miners but ready for any adventure, Greycat Industrial's Strata armor provides premium protection and convenient features. Each piece features an angular and precise design to deliver coverage where it's most needed most. A toolbelt with convenient pouches and a reinforced backpack offers plenty of storage. The award-winning helmet design has been copied by other manufacturers, but the original still reigns supreme with its high quality materials and next-gen air filtration system that enables clean breathing whether in a deep mine or hostile atmospheres. The Heatwave edition is primarily black with glowing red highlights.
item_Desc_GRIN_utility_medium_backpack_03_05_16,P=Item Type: Medium Backpack\nCarrying Capacity: 127.5K µSCU\nCore Compatibility: Medium & Heavy\n\nMade for miners but ready for any adventure, Greycat Industrial's Strata armor provides premium protection and convenient features. Each piece features an angular and precise design to deliver coverage where it's most needed most. A toolbelt with convenient pouches and a reinforced backpack offers plenty of storage. The award-winning helmet design has been copied by other manufacturers, but the original still reigns supreme with its high quality materials and next-gen air filtration system that enables clean breathing whether in a deep mine or hostile atmospheres. The Heatwave edition is primarily black with glowing red highlights.
item_Desc_GRIN_utility_medium_core_03_05_16,P=Item Type: Medium Armor\nDamage Reduction: 30%\nCarrying Capacity: 15k µSCU\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nBackpack Compatibility: Light & Medium \n\nMade for miners but ready for any adventure, Greycat Industrial's Strata armor provides premium protection and convenient features. Each piece features an angular and precise design to deliver coverage where it's most needed most. A toolbelt with convenient pouches and a reinforced backpack offers plenty of storage. The award-winning helmet design has been copied by other manufacturers, but the original still reigns supreme with its high quality materials and next-gen air filtration system that enables clean breathing whether in a deep mine or hostile atmospheres. The Heatwave edition is primarily black with glowing red highlights.
item_Desc_GRIN_utility_medium_legs_03_05_16,P=Item Type: Medium Armor\nDamage Reduction: 30%\nCarrying Capacity: 10k µSCU\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nMade for miners but ready for any adventure, Greycat Industrial's Strata armor provides premium protection and convenient features. Each piece features an angular and precise design to deliver coverage where it's most needed most. A toolbelt with convenient pouches and a reinforced backpack offers plenty of storage. The award-winning helmet design has been copied by other manufacturers, but the original still reigns supreme with its high quality materials and next-gen air filtration system that enables clean breathing whether in a deep mine or hostile atmospheres. The Heatwave edition is primarily black with glowing red highlights.
item_Desc_HRST_Tiburon_S10_laserbeam=Manufacturer: Hurston Dynamics\nType: Laser Beam\nSize: 10\n\nDeveloped in concert with the weapons specialists of Aegis to form part of the dedicated anti-capital ship loadout of the Tiburon, the Supremacy-10T combines surgical precision with devastating destructive power.
item_Desc_KeyCard_SOO_IFFI_1=A single use card that contains the codes for accessing the Nine Tails' Identity Friend and Foe Inverter on the Solanki platform.
item_Desc_KeyCard_SOO_IFFI_2=A single use card that contains the codes for accessing the Nine Tails' Identity Friend and Foe Inverter on the Hartmore platform.
item_Desc_KeyCard_SOO_IFFI_3=A single use card that contains the codes for accessing the Nine Tails' Identity Friend and Foe Inverter on the Cargo Barge.
item_Desc_KeyCard_SOO_WeaponCache=A single use access code for a Nine Tails' storage container.
item_Desc_battaglia_boot_01=A classic workman's boot. This rubber-toed shoe is both sturdy and lightweight, with extra padding in the sole for easy movement and reduced pressure on Battaglia's remaining foot.
item_Desc_battaglia_jacket_01=Simple, practical, and gets the job done without a fuss - much like Battaglia herself. The look features a sleeveless dark green military-style jacket, complete with plenty of pocket space, over her signature yellow undershirt and white vest.
item_Desc_battaglia_meca_01=Made specially for Battaglia after a mining accident, the prosthetics feature tough iron plating with mustard yellow accents. The hand, developed with precise movement in mind, makes complicated finger movement possible. The leg, powered by kinetic sensors in the ankle, allows the prosthetic leg to adapt to her movement needs without need for manual adjustment.
item_Desc_battaglia_pants_01=The ultimate cargo pants for someone who isn't afraid to put in the work, but wants to be comfortable doing it. These dark brown pants feature large pockets on the upper legs, as well as cropping at the right knee that Battaglia shortened herself to make room for her prosthetic leg.
item_Desc_cbd_hat_03_defcon2956=Show your appreciation for the everyday heroes of the UEE with the official DefenseCon 2956 hat.
item_Desc_cbd_hat_03_palevski_01=This brimmed hat is a dark green color and displays the People's Alliance logo on the front.
item_Desc_cds_armor_heavy_core_01_02_02,P=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 8.0 µSCU\nBackpacks: All\n\nBased on CDS' ADP-mk4 heavy combat armor, this set has been modified from its original form. When there's a difficult job at hand, you want to ensure that you can see it through to the end. This armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.
item_Desc_cds_armor_heavy_helmet_01_02_02,P=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\n\nBased on CDS' ADP-mk4 heavy combat armor, this set has been modified from its original form. When there's a difficult job at hand, you want to ensure that you can see it through to the end. This armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers. Visor is AR crosshair compatible.
item_Desc_cds_armor_heavy_legs_01_02_02,P=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 8.0 µSCU\n\nBased on CDS' ADP-mk4 heavy combat armor, this set has been modified from its original form. When there's a difficult job at hand, you want to ensure that you can see it through to the end. This armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.
item_Desc_cds_combat_heavy_arms_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_heavy_core_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 8.0 µSCU\nBackpacks: All\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_heavy_helmet_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_heavy_legs_01_02_02=Item Type: Heavy Armor\nDamage Reduction: 40%\nTemp. Rating: -80 / 105 °C\nRadiation Protection: 52800 REM\nRadiation Scrub Rate: 251.1 REM/s\nCarrying Capacity: 8.0 µSCU\n\nWhen there's a difficult job at hand, you want to ensure that you can see it through to the end. Clark Defense Systems' ADP-mk4 heavy armor allows Marines to remain in active combat situations for a longer duration with more loadout options, while its powered frame provides near unfettered movement despite the protection it offers.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_light_arms_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nCDS's quest to create the ideal light armor continues with the FBL-8a. This light armor will keep you fast on your feet with its strategic mix of protective plating and reinforced nano-weave fabrics. While the armor works with any undersuit, it was specifically designed to match the FBL-8u undersuit with special attention given to how the two fit together to make the set as streamlined and responsive as possible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_light_backpack_01_06_01,P=PH - Description for cds_combat_light_backpack_01_06_01
item_Desc_cds_combat_light_core_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -32 / 62 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\nBackpacks: Light\n\nCDS's quest to create the ideal light armor continues with the FBL-8a. This light armor will keep you fast on your feet with its strategic mix of protective plating and reinforced nano-weave fabrics. While the armor works with any undersuit, it was specifically designed to match the FBL-8u undersuit with special attention given to how the two fit together to make the set as streamlined and responsive as possible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_light_helmet_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nCDS's quest to create the ideal light armor continues with the FBL-8a. This light armor will keep you fast on your feet with its strategic mix of protective plating and reinforced nano-weave fabrics. While the armor works with any undersuit, it was specifically designed to match the FBL-8u undersuit with special attention given to how the two fit together to make the set as streamlined and responsive as possible. Visor is AR crosshair compatible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_light_legs_02_02_01=Item Type: Light Armor\nDamage Reduction: 20%\nTemp. Rating: -35 / 65 °C\nRadiation Protection: 26000 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 2.0 µSCU\n\nCDS's quest to create the ideal light armor continues with the FBL-8a. This light armor will keep you fast on your feet with its strategic mix of protective plating and reinforced nano-weave fabrics. While the armor works with any undersuit, it was specifically designed to match the FBL-8u undersuit with special attention given to how the two fit together to make the set as streamlined and responsive as possible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_medium_arms_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 6.4 µSCU\nBackpacks: Medium, Light\n\nThe mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_medium_core_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 6.4 µSCU\nBackpacks: Medium, Light\n\nThis version of CDS' ORC-mkX combat armor has been modified from its original form. The mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_medium_helmet_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -55 / 85 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\n\nThe mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility. Visor is AR crosshair compatible.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
item_Desc_cds_combat_medium_legs_01_02_01=Item Type: Medium Armor\nDamage Reduction: 30%\nTemp. Rating: -61 / 91 °C\nRadiation Protection: 26400 REM\nRadiation Scrub Rate: 145.8 REM/s\nCarrying Capacity: 4.0 µSCU\n\nThe mark X is part of CDS’ award-winning Omni-Role Combat armor series. This EVA-rated suit features new EdgeCore composite weave technology, maximizing protection against projectiles, explosives and the elements while minimizing operator agility.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the armor with a rich blue base adorned with a sleek, flowing air design.
