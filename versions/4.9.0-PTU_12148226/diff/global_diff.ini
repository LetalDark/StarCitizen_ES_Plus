item_desc_FLBL_ANVL_Asgard_Handling=Manufacturer: Broad & Rabiee\nType: Flight Blade\n\nUnlock the potential of your Anvil Asgard with the PHB Flight Blade from Broad & Rabiee. By re-allocating forward thrust resources, you can expect your ship to deliver increased precision handling during tight maneuvers.
item_desc_FLBL_ANVL_Asgard_Speed=Manufacturer: Broad & Rabiee\nType: Flight Blade\n\nUnlock the potential of your Anvil Asgard with the TSB Flight Blade from Broad & Rabiee. By re-allocating lateral thrust resources, you can expect your ship to deliver increased top speeds in the straightaway.
