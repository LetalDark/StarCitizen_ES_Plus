item_Desc_cds_undersuit_armor_01_02_02=Item Type: Undersuit\nDamage Reduction: 5%\nTemp. Rating: -30 / 60 °C\nRadiation Protection: 15200 REM\nRadiation Scrub Rate: 81 REM/s\nG-Force Tolerance: +90%\n\nThe FBL-8u is the first CDS undersuit to utilize the manufacturers new orb-weave technology that produces an impressively light yet strong material that can withstand the rigors of space travel. Originally developed to pair perfectly with CDS's FBL-8a light armor, it remains compatible with other armor sets.\n\nTo honor those who came to Orison's aid in its time of need, the SecondWind edition compliments the undersuit with a navy blue base adorned with a sleek, gray accents.
item_Desc_dmc_pants_04_defcon2956=Carrying Capacity: 3K µSCU\n \nTurn up the heat and celebrate DefenseCon 2956 in style in these flame-accented cargo pants made from triple-stitched polymer weave fabric, with four easy access pockets.
